<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070a" />
<title>ESCAPE FROM MATRIX — chat protocol</title>
<style>
  :root{
    --bg:#05070a; --panel:#0a0e12; --panel2:#0d1218;
    --line:#1a2a22; --fg:#d6f5e3; --dim:#6b8f7c;
    --acc:#38ff9e; --warn:#ff5d7a; --ok:#7dffc4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  body.shard-B{
    --line:#3b2a16; --fg:#ffe6c7; --dim:#9a7a52;
    --acc:#ffa94d; --warn:#ff6b6b; --ok:#ffd9a8;
    --panel:#0d0a06; --panel2:#120d07;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:#030507; color:var(--fg); font:14px/1.45 var(--sans);
    overflow:hidden; transition:color .4s, background .4s;
  }
  #app{
    height:100%; height:100dvh; max-width:760px; margin:0 auto;
    display:grid; grid-template-rows:auto auto minmax(0,1fr) auto;
    background:radial-gradient(120% 70% at 50% 0%, #0a1410 0%, var(--bg) 55%);
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }
  body.shard-B #app{background:radial-gradient(120% 70% at 50% 0%, #150e06 0%, var(--bg) 55%);}
  header{background:var(--panel); border-bottom:1px solid var(--line);}
  .topline{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px 6px;}
  .room h1{margin:0; font-size:15px; font-weight:650; letter-spacing:.01em; color:var(--acc);}
  .sub{font-size:10px; color:var(--dim); margin-top:2px; font-family:var(--mono);}
  .sub b{color:var(--fg); font-weight:500;}
  .legs{display:flex; gap:3px; flex:none;}
  .leg{font-size:8px; padding:1px 3px; border:1px solid var(--line); border-radius:2px;
    color:var(--acc); font-family:var(--mono); letter-spacing:.03em;}
  .leg.dead{color:var(--dim); opacity:.35; text-decoration:line-through;}
  .decay{height:3px; background:#0a120d; overflow:hidden;}
  .decay i{display:block; height:100%; width:0;
    background:linear-gradient(90deg, var(--acc), #ffd166 60%, var(--warn));
    transition:width .3s ease;}
  .tabs{display:flex; gap:2px; overflow-x:auto; padding:0 6px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs button{
    appearance:none; background:none; border:0; border-bottom:2px solid transparent;
    color:var(--dim); font:inherit; font-size:12px; padding:8px 10px 7px; cursor:pointer;
    white-space:nowrap; transition:color .15s, border-color .15s;
  }
  .tabs button.active{color:var(--acc); border-bottom-color:var(--acc);}
  .tabs button:disabled{opacity:.4; cursor:default;}
  .tabs .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--warn);
    margin-left:5px; vertical-align:1px; box-shadow:0 0 6px var(--warn); animation:blink 1.4s infinite;}
  @keyframes blink{50%{opacity:.3;}}
  .pinbar{padding:6px 12px; border-bottom:1px solid var(--line); background:var(--panel2);
    display:flex; flex-direction:column; gap:3px;}
  .pinrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-height:16px;}
  .plabel{font-size:8px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); flex:none;}
  .chip{font-size:10px; border:1px solid var(--line); border-radius:3px; padding:1px 6px;
    color:var(--fg); font-family:var(--mono); white-space:nowrap;}
  .chip.off{color:var(--dim); border-style:dashed;}
  #pinbar.lost .chip{animation:lostflash 1s ease-out;}
  @keyframes lostflash{0%{border-color:var(--warn); color:var(--warn);} 100%{border-color:var(--line);}}
  #timeline{overflow-y:auto; padding:12px 12px 16px; display:flex; flex-direction:column;
    gap:8px; min-height:0; scrollbar-width:thin;}
  #timeline .spacer{flex:1 1 auto; min-height:0;}
  .topic{font-size:11px; color:var(--dim); border:1px dashed var(--line); border-radius:10px;
    padding:7px 10px; line-height:1.45; background:rgba(255,255,255,.015);}
  .topic b{color:var(--fg); font-weight:600;}
  .topic .plabel{display:block; margin-bottom:2px;}
  .msg{display:flex; gap:8px; max-width:90%; align-items:flex-end; animation:pop .18s ease-out;}
  @keyframes pop{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .msg.out{align-self:flex-end; flex-direction:row-reverse;}
  .ava{width:26px; height:26px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-size:11px; font-weight:650; font-family:var(--mono);}
  .bubble{background:#0c1410; border:1px solid var(--line); border-radius:12px; border-bottom-left-radius:4px;
    padding:6px 10px; min-width:0;}
  .msg.out .bubble{background:#0e2a1c; border-color:#1d5c3a; border-bottom-left-radius:12px;
    border-bottom-right-radius:4px;}
  body.shard-B .bubble{background:#150f08;}
  body.shard-B .msg.out .bubble{background:#2a1a0a; border-color:#5c3d1d;}
  .meta{display:flex; gap:8px; align-items:baseline; font-size:9px; color:var(--dim);
    margin-bottom:1px; font-family:var(--mono);}
  .meta b{color:var(--fg); font-weight:600; font-size:10px; font-family:var(--sans);}
  .text{font-size:13px; line-height:1.45; overflow-wrap:anywhere;}
  .msg.sys{align-self:center; max-width:92%;}
  .msg.sys span{display:block; text-align:center; font-size:10px; font-family:var(--mono);
    color:var(--dim); border:1px dashed var(--line); border-radius:10px; padding:4px 10px; line-height:1.4;}
  .msg.sys.warn span{color:var(--warn); border-color:rgba(255,93,122,.35);}
  .msg.redacted .bubble{opacity:.55; border-style:dashed;}
  .msg.redacted .text{text-decoration:line-through; text-decoration-color:rgba(255,93,122,.6);}
  .rednote{font-size:9px; color:var(--warn); margin-top:2px; font-family:var(--mono);}
  .daysep{align-self:center; font-size:9px; letter-spacing:.16em; color:var(--dim);
    text-transform:uppercase; font-family:var(--mono); padding:2px 8px; border-bottom:1px solid var(--line);}
  footer{background:var(--panel); border-top:1px solid var(--line); padding:8px 10px 10px;}
  .replies{display:flex; flex-wrap:wrap; gap:6px;}
  .reply{appearance:none; background:#0d1712; border:1px solid var(--line); color:var(--fg);
    font:inherit; font-size:12px; padding:7px 11px; border-radius:16px; cursor:pointer;
    display:inline-flex; gap:8px; align-items:center; transition:background .15s, border-color .15s;}
  body.shard-B .reply{background:#171006;}
  .reply:disabled{opacity:.35; cursor:default;}
  .reply em{font-style:normal; font-size:9px; color:var(--dim); font-family:var(--mono);}
  .tools{display:flex; gap:12px; margin-top:8px; flex-wrap:wrap; align-items:center;}
  .tools button{appearance:none; background:none; border:0; color:var(--dim); font:inherit;
    font-size:10px; padding:2px 0; cursor:pointer; font-family:var(--mono);}
  .tools button:disabled{opacity:.35; cursor:default;}
  .tools #lang{margin-left:auto; color:var(--acc);}
  #modal{position:fixed; inset:0; z-index:80; display:grid; place-items:center;
    background:rgba(2,5,4,.82); backdrop-filter:blur(3px); padding:18px;}
  #modal.hidden{display:none;}
  .box{max-width:520px; width:100%; border:1px solid var(--acc); background:#070d09;
    padding:20px; border-radius:8px; box-shadow:0 0 44px rgba(56,255,158,.15);}
  body.shard-B .box{background:#0f0a05; box-shadow:0 0 44px rgba(255,169,77,.15);}
  .box h2{margin:6px 0 10px; font-size:17px; letter-spacing:.05em; color:var(--acc);}
  .box p{margin:0 0 12px; font-size:13px;}
  .endtag{font-size:9px; letter-spacing:.3em; color:var(--dim); font-family:var(--mono);}
  .endtag.bad{color:var(--warn);}
  .stats{display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:12px;
    margin:14px 0 16px; border-top:1px solid var(--line); padding-top:12px;}
  .stats span{color:var(--dim);}
  .stats b{color:var(--acc); font-weight:600; text-align:right;}
  .rules{margin:0 0 16px; padding-left:18px; font-size:12px;}
  .rules li{margin-bottom:6px;}
  .rules b{color:var(--acc);}
  .rules code, .box code{background:rgba(255,255,255,.06); padding:1px 4px; border-radius:3px; font-size:.92em;}
  body.glitch #app{animation:glitch .7s steps(3) both;}
  @keyframes glitch{
    0%{transform:none; filter:none;}
    12%{transform:translate(-6px,2px); filter:hue-rotate(45deg) saturate(2.2);}
    26%{transform:translate(5px,-2px); filter:none;}
    42%{transform:translate(-3px,1px); filter:invert(.07);}
    63%{transform:translate(2px,0); filter:none;}
    100%{transform:none; filter:none;}
  }
  @media (max-width:480px){
    .topline{padding:8px 10px 4px;}
    .room h1{font-size:14px;}
    .text{font-size:12.5px;}
    .tabs button{padding:7px 8px; font-size:11px;}
    .pinbar{padding:5px 10px;}
    .chip{font-size:9px;}
    #timeline{padding:10px 10px 14px;}
    .bubble{padding:5px 9px;}
    footer{padding:7px 8px 9px;}
    .reply{padding:6px 9px; font-size:11.5px;}
    .tools{gap:10px;}
  }
  @media (hover:hover){
    .tabs button:hover:not(:disabled){color:var(--fg);}
    .reply:hover:not(:disabled){background:#12251a; border-color:var(--acc);}
    body.shard-B .reply:hover:not(:disabled){background:#241708;}
    .tools button:hover:not(:disabled){color:var(--fg);}
  }
  @media (hover:none){
    .tabs button:focus-visible, .reply:focus-visible{outline:1px solid var(--acc); outline-offset:2px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>

<div id="app">
  <header>
    <div class="topline">
      <div class="room">

      <div class="legs" id="legs"></div>
    </div>
    <div class="decay"><i id="decayfill"></i></div>
    <nav class="tabs" id="tabs" aria-label="rooms"></nav>
  </header>
  <div class="pinbar" id="pinbar"></div>
  <main id="timeline" aria-live="polite"></main>
  <footer>
    <div class="replies" id="replies"></div>
    <div class="tools">
      <button id="hint"></button>
      <button id="backfill"></button>
      <button id="help"></button>
      <button id="fs"></button>
      <button id="lang"></button>

</div>
<div id="modal" class="hidden"><div class="box" id="modalbox"></div></div>

  const params = new URLSearchParams(location.search);
  let LANG = params.get('lang');
  if (LANG !== 'ru' && LANG !== 'en') {
    try { LANG = localStorage.getItem('efm_lang'); } catch (e) { LANG = null; }
  }
  if (LANG !== 'ru' && LANG !== 'en') {
    LANG = (navigator.language || 'en').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
  }

  const PASS = LANG === 'ru' ? 'перепел-ноль-девять' : 'nightingale-zero-nine';

  function t(key, p) {
    let s = (STR[LANG] && STR[LANG][key]) || (STR.ru[key]) || key;
    if (p) {
      Object.keys(p).forEach((k) => { s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), p[k]); });
    }
    return s;
  }

  const $ = (s) => document.querySelector(s);
  const timelineEl = $('#timeline');

  let S = null;
  let best = null;
  try { best = JSON.parse(localStorage.getItem('efm_chat_best') || 'null'); } catch (e) { best = null; }

  const WHO = {
    archivist: { name: '@archivist', ini: 'A', c: '#9d7bff' },
    tombstone: { name: '@tombstone', ini: 'T', c: '#ff6b6b' },
    bridge: { name: '@bridge', ini: 'B', c: '#4db8ff' },
    admin: { name: '@admin', ini: '@', c: '#ffb84d' }
  };

  const B_HISTORY = ['b.lobby.1', 'b.lobby.2', 'b.archives', 'b.relay', 'b.core'];

  function host() { return HOST[S.shard]; }

  function addMsg(m) {
    m.id = S.msgId++;
    m.run = m.run === undefined ? S.run : m.run;
    m.shard = m.shard || S.shard;
    m.room = m.room || S.room;
    m.ts = S.tick;
    m.redacted = false;
    if (m.pass) m.unread = true;
    S.msgs.push(m);
  }

  function settleFlush() {
    if (!S.pending.length) return;
    const due = S.pending.filter((p) => p.at <= S.tick);
    if (!due.length) return;
    S.pending = S.pending.filter((p) => p.at > S.tick);
    for (const p of due) {
      addMsg({
        from: 'archivist',
        text: t('ui.code') + '<b>' + PASS + '</b>. ' + t('talk.deliver'),
        old: true,
        shard: 'A',
        room: 'lobby',
        pass: true
      });
    }
    maybeReadCode();
  }

  function hasUnreadCode() {
    return S.msgs.some((m) => m.pass && m.unread && !m.redacted);
  }

  function maybeReadCode() {
    if (S.over) return;
    if (S.shard !== 'A' || S.room !== 'lobby') return;
    const unread = S.msgs.filter((m) => m.pass && m.unread && !m.redacted);
    if (!unread.length) return;
    unread.forEach((m) => { m.unread = false; });
    S.known.pass = true;
    addMsg({ from: 'system', text: t('ui.readCode', { code: PASS }) });
  }

  function spend(n) {
    if (S.over) return true;
    S.tick += n;
    S.decay = Math.min(100, S.decay + n);
    settleFlush();
    if (S.tick > 0 && S.tick % PERIOD === 0) { rollback(); return true; }
    if (S.decay >= 100) { gameOver('decay'); return true; }
    return false;
  }

  function rollback() {
    const lost = [];
    if (S.inv.key) lost.push(t('ui.shard'));
    if (S.inv.token) lost.push(t('ui.token'));
    if (S.lock) lost.push(t('ui.lock'));

    S.msgs.forEach((m) => { if (m.run === S.run) m.redacted = true; });
    S.rollbacks += 1;
    S.legs -= 1;
    S.decay = Math.min(100, S.decay + DECAY_ROLLBACK);
    S.pending = [];
    S.run += 1;
    S.room = 'lobby';
    S.shard = 'A';
    S.inv = { key: false, token: false };
    S.lock = false;
    S.runStart = S.tick;

    document.body.classList.add('glitch');
    setTimeout(() => document.body.classList.remove('glitch'), 700);

    addMsg({ from: 'system', text: t('rb.banner', { n: PERIOD }), warn: true });
    addMsg({
      from: 'system',
      text: t('rb.device', { n: S.legs + 1 }) + (lost.length ? t('rb.lost', { items: lost.join(', ') }) : ''),
      warn: true
    });
    addMsg({ from: 'system', text: t('rb.memory') });

    if (S.legs <= 0) { gameOver('legs'); return; }
    if (S.decay >= 100) { gameOver('decay'); return; }
  }

  function backfill() {
    if (S.over) return;
    if (S.tick === S.runStart && S.room === 'lobby' && S.shard === 'A' && !S.inv.key && !S.inv.token && !S.lock) {
      addMsg({ from: 'system', text: t('bf.nothing') });
      render();
      return;
    }
    S.msgs.forEach((m) => { if (m.run === S.run) m.redacted = true; });
    S.run += 1;
    S.backfills += 1;
    S.decay = Math.min(100, S.decay + DECAY_BACKFILL);
    S.pending = [];
    S.tick = S.runStart;
    S.room = 'lobby';
    S.shard = 'A';
    S.inv = { key: false, token: false };
    S.lock = false;
    addMsg({ from: 'system', text: t('bf.banner', { t: S.runStart }) });
    if (S.decay >= 100) { gameOver('decay'); return; }
    render();
  }

  function move(to) {
    if (S.over || to === S.room) return;
    S.room = to;
    addMsg({ from: 'system', text: t('ui.join', { room: '#' + to + ':' + host() }) });
    maybeReadCode();
    spend(1);
    render();
  }

  function switchShard() {
    if (S.over || S.room !== 'relay') return;
    S.shard = S.shard === 'A' ? 'B' : 'A';
    addMsg({ from: 'system', text: t('ui.federation', { host: host() }) });
    maybeReadCode();
    spend(1);
    render();
  }

  function talk() {
    if (S.over) return;
    if (S.shard !== 'A') {
      addMsg({ from: 'system', text: '@archivist — m.room.redaction.' });
      render();
      return;
    }
    if (S.known.pass) {
      addMsg({ from: 'me', text: t('talk.me') });
      addMsg({ from: 'archivist', text: t('talk.already') });
      spend(1);
      render();
      return;
    }
    if (hasUnreadCode()) {
      addMsg({ from: 'me', text: t('talk.me') });
      addMsg({ from: 'archivist', text: t('talk.unread') });
      spend(1);
      render();
      return;
    }
    const inflight = S.pending.find((p) => p.pass);
    if (inflight) {
      addMsg({ from: 'me', text: t('talk.me') });
      addMsg({ from: 'archivist', text: t('talk.inflight', { n: Math.max(1, inflight.at - S.tick) }) });
      spend(1);
      render();
      return;
    }
    addMsg({ from: 'me', text: t('talk.me') });
    addMsg({ from: 'archivist', text: t('talk.send') });
    S.pending.push({ at: S.tick + 4, pass: true });
    spend(2);
    render();
  }

  function search() {
    if (S.over) return;
    if (S.shard !== 'A') {
      addMsg({ from: 'system', text: t('search.empty') });
      render();
      return;
    }
    if (S.known.keySpot) {
      addMsg({ from: 'system', text: t('search.known') });
      render();
      return;
    }
    addMsg({ from: 'me', text: t('search.me') });
    const rolled = spend(2);
    if (rolled || S.over) { render(); return; }
    S.known.keySpot = true;
    addMsg({ from: 'system', text: t('search.found') });
    render();
  }

  function takeKey() {
    if (S.over) return;
    if (S.shard !== 'A') { addMsg({ from: 'system', text: t('take.nothere') }); render(); return; }
    if (S.inv.key) { addMsg({ from: 'system', text: t('take.have') }); render(); return; }
    if (!S.known.keySpot) { addMsg({ from: 'system', text: t('take.unknown') }); render(); return; }
    addMsg({ from: 'me', text: t('take.me') });
    const rolled = spend(1);
    if (rolled || S.over) { render(); return; }
    S.inv.key = true;
    addMsg({ from: 'system', text: t('take.ok') });
    render();
  }

  function takeToken() {
    if (S.over) return;
    if (S.shard !== 'A') { addMsg({ from: 'system', text: t('token.empty') }); render(); return; }
    if (S.inv.token) { addMsg({ from: 'system', text: t('token.have') }); render(); return; }
    addMsg({ from: 'me', text: t('token.me') });
    const rolled = spend(2);
    if (rolled || S.over) { render(); return; }
    S.inv.token = true;
    addMsg({ from: 'system', text: t('token.ok') });
    render();
  }

  function deploy() {
    if (S.over) return;
    if (S.shard !== 'B') { addMsg({ from: 'system', text: t('deploy.wrong') }); render(); return; }
    if (S.deployed) { addMsg({ from: 'system', text: t('deploy.used') }); render(); return; }
    if (S.legs >= MAX_LEGS) { addMsg({ from: 'system', text: t('deploy.full') }); render(); return; }
    addMsg({ from: 'me', text: t('deploy.me') });
    const rolled = spend(2);
    if (rolled || S.over) { render(); return; }
    S.deployed = true;
    S.legs += 1;
    addMsg({ from: 'system', text: t('deploy.ok') });
    render();
  }

  function insert() {
    if (S.over) return;
    if (S.shard !== 'A') { addMsg({ from: 'tombstone', text: t('insert.wrong') }); render(); return; }
    if (S.lock) { addMsg({ from: 'tombstone', text: t('insert.have') }); render(); return; }
    if (!S.inv.key || !S.inv.token) {
      addMsg({ from: 'tombstone', text: t('insert.need') });
      render();
      return;
    }
    addMsg({ from: 'me', text: t('insert.me') });
    const rolled = spend(1);
    if (rolled || S.over) { render(); return; }
    S.inv = { key: false, token: false };
    S.lock = true;
    addMsg({ from: 'tombstone', text: t('insert.ok') });
    render();
  }

  function openDoor() {
    if (S.over) return;
    if (S.shard !== 'B') { addMsg({ from: 'tombstone', text: t('open.wrong') }); render(); return; }
    if (!S.lock) { addMsg({ from: 'tombstone', text: t('open.nolock') }); render(); return; }
    if (!S.known.pass) { addMsg({ from: 'tombstone', text: t('open.nocode') }); render(); return; }
    addMsg({ from: 'me', text: t('open.me', { code: PASS }) });
    const rolled = spend(1);
    if (rolled || S.over) { render(); return; }
    addMsg({ from: 'tombstone', text: t('open.ok') });
    win();
  }

  function hint() {
    if (S.over) return;
    S.hints += 1;
    let text;
    if (!S.known.pass) {
      if (hasUnreadCode()) {
        text = t('hint.unread');
      } else if (S.pending.some((p) => p.pass)) {
        const p = S.pending.find((x) => x.pass);
        text = t('hint.inflight', { n: Math.max(1, p.at - S.tick) });
      } else {
        text = t('hint.ask');
      }
    } else if (!S.known.keySpot && !S.inv.key) {
      text = t('hint.shard');
    } else if (!S.inv.key) {
      text = t('hint.take');
    } else if (!S.inv.token) {
      text = t('hint.token');
    } else if (!S.lock) {
      text = t('hint.lock');
    } else if (S.shard !== 'B') {
      text = t('hint.switch');
    } else {
      text = t('hint.door', { n: PERIOD - (S.tick % PERIOD) });
    }
    if (S.shard === 'B' && text.indexOf('collapse.local') !== -1) {
      text = t('hint.otherHalf') + text;
    }
    addMsg({ from: 'system', text: t('ui.hintPrefix') + text });
    spend(1);
    render();
  }

  function ending() {
    if (S.decay >= 85) {
      return { title: t('end.late.title'), text: t('end.late.text') };
    }
    if (S.legs <= 2) {
      return { title: t('end.lossy.title'), text: t('end.lossy.text') };
    }
    return { title: t('end.clean.title'), text: t('end.clean.text') };
  }

  function stats() {
    return '<div class="stats">' +
      '<span>' + t('stat.events') + '</span><b>' + S.tick + '</b>' +
      '<span>' + t('stat.resets') + '</span><b>' + S.rollbacks + '</b>' +
      '<span>' + t('stat.backfills') + '</span><b>' + S.backfills + '</b>' +
      '<span>' + t('stat.hints') + '</span><b>' + S.hints + '</b>' +
      '<span>' + t('stat.legs') + '</span><b>' + Math.max(0, S.legs) + ' / ' + MAX_LEGS + '</b>' +
      '<span>' + t('stat.decay') + '</span><b>' + Math.round(S.decay) + '%</b>' +
      '</div>';
  }

  function saveBest() {
    const r = { t: S.tick, rollbacks: S.rollbacks, decay: Math.round(S.decay), legs: S.legs, ts: Date.now() };
    best = r;
    try { localStorage.setItem('efm_chat_best', JSON.stringify(r)); } catch (e) { /* private mode */ }
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      try {
        fetch('/__api/rows/efm_chat_best', {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ value: r, public: true })
        }).catch(() => {});
      } catch (e) { /* not on the showroom */ }
    }
  }

  function win() {
    S.over = true;
    const e = ending();
    saveBest();
    showModal(
      '<div class="endtag">' + t('end.winTag') + '</div>' +
      '<h2>' + e.title + '</h2>' +
      '<p>' + e.text + '</p>' +
      stats() +
      '<button class="reply" data-act="restart">' + t('end.restart') + '</button>'
    );
    addMsg({ from: 'system', text: t('end.door', { title: e.title }) });
    render();
  }

  function gameOver(kind) {
    S.over = true;
    const isLegs = kind === 'legs';
    showModal(
      '<div class="endtag bad">' + t('end.loseTag') + '</div>' +
      '<h2>' + (isLegs ? t('end.legs.title') : t('end.decay.title')) + '</h2>' +
      '<p>' + (isLegs ? t('end.legs.text') : t('end.decay.text')) + '</p>' +
      stats() +
      '<button class="reply" data-act="restart">' + t('end.retry') + '</button>'
    );
    render();
  }

  function showModal(html) {
    $('#modalbox').innerHTML = html;
    $('#modal').classList.remove('hidden');
  }

  function hideModal() {
    $('#modal').classList.add('hidden');
    $('#modalbox').innerHTML = '';
  }

  function bubble(m) {
    if (m.from === 'system') {
      return '<div class="msg sys' + (m.warn ? ' warn' : '') + '"><span>' + m.text + '</span></div>';
    }
    const who = WHO[m.from] || { name: '@unknown', ini: '?', c: '#888' };
    const out = m.from === 'me';
    const ava = out ? '' : '<div class="ava" style="background:' + who.c + '22;border:1px solid ' + who.c + '55;color:' + who.c + '">' + who.ini + '</div>';
    const stamp = m.old ? t('ui.oldStamp') : 't=' + m.ts;
    const meta = out
      ? '<div class="meta"><span>' + t('ui.you') + '</span><span>' + stamp + '</span></div>'
      : '<div class="meta"><b>' + who.name + '</b><span>' + stamp + '</span></div>';
    return '<div class="msg' + (out ? ' out' : '') + (m.redacted ? ' redacted' : '') + '">' +
      ava +
      '<div class="bubble">' + meta +
      '<div class="text">' + m.text + '</div>' +
      (m.redacted ? '<div class="rednote">' + t('ui.redacted') + '</div>' : '') +
      '</div></div>';
  }

  function renderTimeline() {
    const msgs = S.msgs.filter((m) => m.shard === S.shard && m.room === S.room);
    let html = '<div class="topic"><span class="plabel">' + t('ui.topic') + '</span>' +
      '<span>' + t('topic.' + S.room + '.' + S.shard) + '</span></div><div class="spacer"></div>';
    msgs.forEach((m, i) => {
      if (m.old && (i === 0 || !msgs[i - 1].old)) html += '<div class="daysep">' + t('ui.daySep') + '</div>';
      html += bubble(m);
    });
    timelineEl.innerHTML = html;
    timelineEl.scrollTop = timelineEl.scrollHeight;
  }

  function renderHeader() {
    $('#roomname').textContent = '#' + S.room;
    $('#server').textContent = host();
    $('#clock').textContent = 't=' + S.tick;
    $('#decaylabel').textContent = t('ui.decay');
    $('#decaypct').textContent = Math.round(S.decay) + '%';
    $('#decayfill').style.width = Math.min(100, S.decay) + '%';
    const legsEl = $('#legs');
    legsEl.innerHTML = '';
    for (let i = 0; i < MAX_LEGS; i += 1) {
      const s = document.createElement('span');
      s.className = 'leg' + (i < S.legs ? '' : ' dead');
      s.textContent = 'ES-' + (i + 1);
      legsEl.appendChild(s);
    }
    document.body.classList.toggle('shard-B', S.shard === 'B');
    document.body.classList.toggle('shard-A', S.shard === 'A');
  }

  function renderTabs() {
    const tabs = $('#tabs');
    tabs.innerHTML = '';
    const unread = S.shard === 'A' && hasUnreadCode();
    for (const r of ORDER) {
      const b = document.createElement('button');
      b.innerHTML = '#' + r + (unread && r === 'lobby' ? '<span class="dot"></span>' : '');
      b.className = r === S.room ? 'active' : '';
      b.title = t('ui.tabHint');
      b.disabled = S.over;
      b.addEventListener('click', () => { if (!S.over) move(r); });
      tabs.appendChild(b);
    }
  }

  function renderPin() {
    const pin = $('#pinbar');
    const items = [];
    if (S.inv.key) items.push(t('ui.shard'));
    if (S.inv.token) items.push(t('ui.token'));
    if (S.lock) items.push(t('ui.lock'));
    pin.innerHTML =
      '<div class="pinrow"><span class="plabel">' + t('ui.pinned') + '</span>' +
      (items.length ? items.map((x) => '<span class="chip">' + x + '</span>').join('') : '<span class="chip off">' + t('ui.empty') + '</span>') +
      '</div>' +
      '<div class="pinrow"><span class="plabel">' + t('ui.saved') + '</span>' +
      '<span class="chip' + (S.known.pass ? '' : ' off') + '">' + t('ui.code') + (S.known.pass ? PASS : '?') + '</span>' +
      '<span class="chip' + (S.known.keySpot ? '' : ' off') + '">' + t('ui.shardAt') + (S.known.keySpot ? '#archives' : '?') + '</span>' +
      '</div>';
  }

  function actionList() {
    const out = [];
    const add = (label, cost, fn) => out.push({ label, cost, fn });
    if (S.room === 'lobby') {
      add(t('act.talk'), 2, talk);
    }
    if (S.room === 'archives') {
      if (!S.known.keySpot) add(t('act.search'), 2, search);
      add(t('act.take'), 1, takeKey);
    }
    if (S.room === 'relay') {
      add(t('act.switch', { host: S.shard === 'A' ? 'mirror.local' : 'collapse.local' }), 1, switchShard);
      if (S.shard === 'A') add(t('act.token'), 2, takeToken);
      if (S.shard === 'B' && !S.deployed) add(t('act.deploy'), 2, deploy);
    }
    if (S.room === 'core') {
      if (S.shard === 'A') add(t('act.insert'), 1, insert);
      else add(t('act.open'), 1, openDoor);
    }
    return out;
  }

  function renderReplies() {
    const box = $('#replies');
    box.innerHTML = '';
    for (const a of actionList()) {
      const b = document.createElement('button');
      b.className = 'reply';
      b.innerHTML = '<span>' + a.label + '</span>' + (a.cost ? '<em>−' + a.cost + 't</em>' : '');
      b.disabled = S.over;
      b.addEventListener('click', () => { if (!S.over) a.fn(); });
      box.appendChild(b);
    }
    if (!box.children.length) {
      const d = document.createElement('div');
      d.style.cssText = 'font-size:11px;color:var(--dim);font-family:var(--mono)';
      d.textContent = t('ui.nothing');
      box.appendChild(d);
    }
  }

  function render() {
    if (!S) return;
    renderHeader();
    renderTabs();
    renderPin();
    renderTimeline();
    renderReplies();
    $('#hint').disabled = S.over;
    $('#backfill').disabled = S.over;
  }

  function helpHtml() {
    return '<div class="endtag">' + t('help.tag') + '</div>' +
      '<h2>' + t('help.title') + '</h2>' +
      '<p>' + t('help.intro') + '</p>' +
      '<ul class="rules">' +
      '<li>' + t('help.b1', { n: PERIOD }) + '</li>' +
      '<li>' + t('help.b2') + '</li>' +
      '<li>' + t('help.b3') + '</li>' +
      '<li>' + t('help.b4') + '</li>' +
      '<li>' + t('help.b5') + '</li>' +
      '<li>' + t('help.b6') + '</li>' +
      '<li>' + t('help.b7') + '</li>' +
      '<li>' + t('help.b8') + '</li>' +
      '</ul>' +
      '<button class="reply" data-act="close">' + t('help.close') + '</button>';
  }

  function applyUiLang() {
    document.documentElement.lang = LANG;
    document.title = t('doc.title');
    $('#hint').textContent = t('tool.hint');
    $('#backfill').textContent = t('tool.backfill');
    $('#help').textContent = t('tool.help');
    $('#fs').textContent = t('tool.screen');
    $('#lang').textContent = LANG === 'ru' ? 'EN' : 'RU';
    $('#lang').title = t('ui.langTitle');
  }

  function newGame() {
    S = {
      tick: 0,
      decay: 0,
      legs: MAX_LEGS,
      shard: 'A',
      room: 'lobby',
      inv: { key: false, token: false },
      known: { pass: false, keySpot: false },
      lock: false,
      pending: [],
      hints: 0,
      deployed: false,
      over: false,
      run: 0,
      runStart: 0,
      rollbacks: 0,
      backfills: 0,
      msgId: 1,
      msgs: []
    };
    hideModal();
    addMsg({ from: 'system', text: t('boot.title') });
    addMsg({ from: 'system', text: t('boot.server'), warn: true });
    addMsg({ from: 'system', text: t('boot.rules', { n: PERIOD }) });
    addMsg({ from: 'system', text: t('boot.goal') });
    if (best) addMsg({ from: 'system', text: t('boot.best', { t: best.t, r: best.rollbacks }) });
    addMsg({ from: 'archivist', text: t('boot.greet') });
    addMsg({ from: 'bridge', text: t('b.lobby.1'), shard: 'B', room: 'lobby', run: -1, old: true });
    addMsg({ from: 'admin', text: t('b.lobby.2'), shard: 'B', room: 'lobby', run: -1, old: true });
    addMsg({ from: 'bridge', text: t('b.archives'), shard: 'B', room: 'archives', run: -1, old: true });
    addMsg({ from: 'bridge', text: t('b.relay'), shard: 'B', room: 'relay', run: -1, old: true });
    addMsg({ from: 'bridge', text: t('b.core'), shard: 'B', room: 'core', run: -1, old: true });
    render();
  }

  $('#hint').addEventListener('click', () => { if (S && !S.over) hint(); });
  $('#backfill').addEventListener('click', () => { if (S && !S.over) backfill(); });
  $('#help').addEventListener('click', () => showModal(helpHtml()));
  $('#fs').addEventListener('click', () => {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  });
  $('#lang').addEventListener('click', () => {
    const next = LANG === 'ru' ? 'en' : 'ru';
    try { localStorage.setItem('efm_lang', next); } catch (e) { /* ignore */ }
    const u = new URL(location.href);
    u.searchParams.set('lang', next);
    location.href = u.toString();
  });
  $('#modal').addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.dataset.act === 'restart') newGame();
    else if (el.dataset.act === 'close') hideModal();
  });

  applyUiLang();
  newGame();
})();
</script>
</body>
</html>
