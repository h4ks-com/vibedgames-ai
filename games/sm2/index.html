function beasts_turn(){
  /* the projectiles and what flies first, then everything on the boards near you */
  for (let pass = 0; pass < 2; pass++)
    for (let i = 0; i < being_n && !dead && !won; i++){
      const b = beings[i];

      if (Math.abs(RS[b.room].col - RS[room].col) > 3 || Math.abs(RS[b.room].band - RS[room].band) > 4) continue;
      beast_act(b);
    }
}

/* ── the boards' own doings ─────────────────────────────── */
function frenzies(){
  /* the area's markers: past an attack marker the Beezos come at your row from the east, or the Albatosses with their Bob-ombs */
  const mx = tile_of_x(), mrow = tile_of_row();
  let kind = 0;
  for (let i = 0; i < ENEMY_N; i++){
    const E = ENEMY[i];
    if (E.area !== area) continue;
    if (AREA[area].horizontal ? E.x > mx : E.row < mrow) continue;      /* in a climb the markers are rows, passed on the way up: the lowest still above counts */
    const k = E.id === 0x48 ? 1 : E.id === 0x47 ? 2 : E.id === 0x49 ? 0 : -1;
    if (k < 0) continue;
    kind = k;
    if (!AREA[area].horizontal) break;
  }
  frenzy = kind;
  if (!kind || turn % 6 || subspace) return;
  const row = tile_of_row();
  if (kind === 1){ const r = tile_room(area, mx + 14, row - (turn % 2)), c = R2; if (!solid(r, c) && !being_at(r, c)){ const b = spawn(BK_BEEZO, r, c); if (b) b.dir = 0; } }
  else { const r = tile_room(area, mx + 14, row > 4 ? row - 4 : 0), c = R2; if (!solid(r, c) && !being_at(r, c)){ const b = spawn(BK_ALBATOSS, r, c); if (b){ b.dir = 0; b.state = 1; } } }
}
function room_tick(){
  if (dead || won) return;
  frenzies();
  if (star_left > 0 && --star_left === 0){ say("The star wears off."); sound_bed = ""; }
  if (hurt_left > 0) hurt_left--;
  if (watch_left > 0 && --watch_left === 0) say("The stopwatch runs down.");
  if (held === BK_BOMB){ if (--held_timer <= 0){ held = -1; explode(room, cell); } else if (held_timer <= 2) say("The bomb in your hands: " + held_timer + "."); }
  if (subspace && --sub_left <= 0){ subspace = 0; say("Subspace fades, and you are back."); sound_bed = ""; sound_scene(); }
  if (RS[room].c[cell].ground === G_QUICK){ in_quick++; { const u = up_cell(room, cell), r2 = R2; if (u >= 0 && RS[r2].c[u].ground === G_QUICK && in_quick >= 2){ die("Under the quicksand."); return; } } } else in_quick = 0;
  /* a conveyor belt carries what stands on it */
  { const dn = down_cell(room, cell), r2 = R2; if (dn >= 0 && (RS[r2].c[dn].thing === T_BELTL || RS[r2].c[dn].thing === T_BELTR)){ const n = way_cell(room, cell, RS[r2].c[dn].thing === T_BELTR ? 0 : 3), r3 = R2; if (n >= 0 && !solid(r3, n)){ const b = being_at(r3, n); if (!b || (BEAST[b.kind].flags & (BF_THING | BF_ITEM))) go_cell(r3, n); } } }
  /* a door of light lasts a while */
  if (turn % 16 === 0) for (let rr = AREA[area].first; rr < AREA[area].first + area_rooms(area); rr++) for (let cc = 0; cc < BOARD_SIZE; cc++) if (RS[rr].c[cc].thing === T_SUBDOOR && canonical(rr, cc) && !(rr === room && cc === cell) && !subspace){ RS[rr].c[cc].thing = -1; sync_cell(rr, cc); }
}

/* ── the turn's end ─────────────────────────────────────── */
function gravity(){
  if (dead || won) return;
  on_climb = climbable(room, cell);
  if (on_climb) return;
  if (rose){ rose = 0; return; }                           /* a turn spent rising, or floating, is not a turn falling */
  rise = 0; float_left = 0; floating = 0;                  /* and any other turn ends the jump */
  if (supported(room, cell)) return;
  if (RS[room].c[cell].ground === G_QUICK && (turn & 1)) return;   /* the quicksand takes you slowly */
  const d = down_cell(room, cell), r2 = R2;
  if (d < 0){ die("Down the pit."); return; }
  if (solid(r2, d)) return;
  const b = being_in_way(r2, d);
  if (b && !(BEAST[b.kind].flags & (BF_THING | BF_PLATFORM))){ touch_being(b, 1); return; }
  if (RS[r2].c[d].ground === G_WATER){ room = r2; cell = d; die("Into the water."); return; }
  go_cell(r2, d);
  if (supported(room, cell)) sound_say("blow land");
}
function end_turn(){
  if (dead || won) return;
  beasts_turn();
  if (!dead && !subspace) generators_turn();
  if (!dead) gravity();
  if (!dead){ const b = being_at(room, cell); if (b && !(BEAST[b.kind].flags & (BF_THING | BF_PLATFORM)) && b.kind !== BK_HAWKMOUTH) touch_being(b, 0); }
  if (!dead) room_tick();
  sound_scene();
}
function die(how){
  if (dead) return;
  dead = 1;
  deaths++; deaths_here++;
  lives--;
  dead_how = how;
  sound_say("bed off"); sound_bed = "";
  sound_say(lives < 0 ? "jingle gameover" : "jingle died");
  show_story = lives < 0 ? 4 : 3;
  if (lives < 0) gameover = 1;
}
/* a life lost, or a game over continued: the area again, from where you last came into it */
function continue_game(){
  dead = 0; show_story = 0; dead_how = "";
  held = -1; star_left = 0; hurt_left = 0; watch_left = 0; rise = 0; on_climb = 0; subspace = 0; in_jar = 0; carpet = -1;
  if (gameover){
    gameover = 0; lives = 3; deaths_here = 0;
    if (continues > 0){ continues--; start_level(cur_level); say("Continue: world " + world + "-" + level + " again.  " + continues + " left."); }
    else { start_level(0); continues = 2; say("No continues left: from the beginning."); }
    sound_bed = ""; sound_scene(); return;
  }

  if (from){ const w = Math.trunc(Number(from) / 10), l = Number(from) % 10; for (let i = 0; i < 20; i++) if (LEVELS[i].world === w && LEVELS[i].level === l) start_level(i); }
  try {
    for (let lv = 0; lv < 200 && !won; lv++){
      wstage("World " + LEVELS[cur_level].world + "-" + LEVELS[cur_level].level);
      wlevel();
    }
    wexpect(won, "Wart beaten");
  } catch (e){
    if (!(e instanceof WalkFail)) throw e;
    walk_out.push("keys " + walk_keys + "  deaths " + deaths);
    if (walk_trace) walk_out.push("keys " + walk_keystring);
    return walk_out;
  }
  walk_out.push("");
  walk_out.push("WALK OK: " + walk_keys + " keys, " + turn + " turns, " + deaths + " lives lost, score " + score + "; Subcon is free");
  if (walk_trace) walk_out.push("keys " + walk_keystring);
  return walk_out;
}

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same 2A03 and played
 * as a buffer; the tune loops until the next one. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the tune's intro once, then its loop */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("subcon.sav"),
  set: (s) => localStorage.setItem("subcon.sav", s),
};
start_game(params.get("seed"), 0);
if (SOUND.on) SOUND.command("bed title");
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left Subcon.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: the six ways are d x z a w e as in subcon.c; the
 * arrows are left and right, and up and down the way you face; Escape
 * is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return facing ? 'e' : 'w';
  if (e.key === "ArrowDown") return facing ? 'x' : 'z';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
