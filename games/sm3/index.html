function thing_at(r, c){
  for (let i = 0; i < being_n; i++)
    if (beings[i].alive === 1 && beings[i].room === r && beings[i].cell === c && (BEAST[beings[i].kind].flags & BF_THING) && beings[i].state === 0) return beings[i];
  return null;
}
function platform_at(r, c){
  for (let i = 0; i < being_n; i++)
    if (beings[i].alive === 1 && beings[i].room === r && beings[i].cell === c && standable_kind(beings[i]) && (BEAST[beings[i].kind].flags & BF_PLATFORM)) return beings[i];
  return null;
}
function visible(c){ return 1; }
function solid(r, c){
  if (r < 0 || c < 0) return 1;
  const k = RS[r].c[c];
  if (!passable_ground(k.ground)) return 1;
  if (k.thing >= 0 && (THING[k.thing].flags & TF_SOLID)) return 1;
  return 0;
}
function stands(r, c){ const k = RS[r].c[c]; return k.thing >= 0 && (THING[k.thing].flags & TF_STAND) ? 1 : 0; }
function climbable(r, c){ const k = RS[r].c[c]; return k.thing >= 0 && (THING[k.thing].flags & TF_CLIMB) ? 1 : 0; }
function watery(r, c){ return RS[r].c[c].ground === G_WATER ? 1 : 0; }
function supported(r, c){
  if (stands(r, c)) return 1;
  if (RS[r].c[c].ground === G_QUICK) return 0;
  const d = down_cell(r, c), r2 = ws_room;
  if (d < 0) return 0;
  return solid(r2, d) || stands(r2, d) || platform_at(r2, d) !== null ? 1 : 0;
}
function ground_step_name(r, c){
  const k = RS[r].c[c], t = k.thing;
  if (k.ground === G_ICE) return "ice";
  if (t === T_BRICK || t === T_QBLOCK || t === T_EMPTY || t === T_WOODBOUNCE || t === T_NOTE || t === T_PIPE) return "brick";
  if (t === T_BELTL || t === T_BELTR || t === T_ARROWLIFT || t === T_CANNON) return "wood";
  if (t >= 0 && (THING[t].flags & TF_STAND)) return t === T_VINETOP ? "a vine" : "a platform";
  if (platform_at(r, c)) return "a creature";
  const ts = AREA[RS[r].area].tileset;
  if (ts === 2 || ts === 14) return "the underground";
  if (ts === 10 || ts === 4) return "wood";
  if (ts === 9) return "sand";
  return "the ground";
}
function sound_step(){
  if (!sound_sink) return;
  if (on_climb){ sound_say("step a vine"); return; }
  if (stands(room, cell)){ sound_say("step " + ground_step_name(room, cell)); return; }
  const d = down_cell(room, cell), r2 = ws_room;
  if (d < 0) return;
  sound_say("step " + ground_step_name(r2, d));
}
function sound_beasts(){
  if (!sound_sink) return;
  let worst = null;
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (!b.alive || b.room !== room || (BEAST[b.kind].flags & (BF_ITEM | BF_PLATFORM | BF_PROJ | BF_THING))) continue;
    if (!worst || BEAST[b.kind].points > BEAST[worst.kind].points) worst = b;
  }
  if (worst) sound_say("call " + BEAST[worst.kind].name);
}

function spawn(kind, r, c){
  if (r < 0 || c < 0) return null;
  let b = null;
  if (being_n < BEING_MAX) b = beings[being_n++];
  else for (let i = being_n - 1; i >= 0 && !b; i--) if (!beings[i].alive) b = beings[i];
  if (!b) return null;
  b.kind = kind; b.room = r; b.cell = c;
  b.alive = 1; b.state = 0; b.timer = 0; b.hp = 1; b.home = 0; b.aux = 0;
  b.dir = 0;
  if (kind === BK_BOOMBOOM || kind === BK_KOOPALING) b.hp = 3;
  if (kind === BK_BOWSER) b.hp = 3;
  if (kind === BK_FIRECHOMP) b.hp = 4;
  if (room === r && !(BEAST[kind].flags & (BF_ITEM | BF_PLATFORM | BF_PROJ | BF_THING)) && !dead) sound_say("call " + BEAST[kind].name);
  return b;
}
/* the creature an object id of the cartridge is, or -1 for the ones that are not creatures here */
function kind_of_type(t){
  switch (t){
  case 0x72: case 0x7C: return BK_GOOMBA; case 0x73: case 0x74: return BK_PARAGOOMBA;
  case 0x6C: case 0x7A: return BK_GREENKOOPA; case 0x6D: case 0x7B: return BK_REDKOOPA;
  case 0x6E: case 0x7E: return BK_PARAGREEN; case 0x6F: case 0x80: return BK_PARARED;
  case 0x70: return BK_BUZZY; case 0x9F: return BK_PARABEETLE; case 0x71: return BK_SPINY;
  case 0x83: case 0xB6: return BK_LAKITU;
  case 0xA0: case 0xA1: case 0xA2: case 0xA3: case 0x7D: case 0x7F: case 0x56: case 0x57: return BK_PIRANHA;
  case 0xA4: case 0xA5: return BK_FIREPIRANHA; case 0xA6: case 0xA7: return BK_VENUS;
  case 0x2A: return BK_PTOOIE; case 0x33: case 0x39: case 0x3D: return BK_NIPPER;
  case 0x81: return BK_HAMMERBRO; case 0x82: return BK_BOOMERANGBRO; case 0x87: return BK_FIREBRO; case 0x86: return BK_SLEDGEBRO;
  case 0x77: case 0x88: case 0x48: case 0x42: case 0x43: return BK_CHEEP; case 0x64: case 0x76: case 0x3B: return BK_REDCHEEP;
  case 0x61: case 0x62: case 0x6A: return BK_BLOOPER; case 0x2D: case 0x63: return BK_BERTHA; case 0x67: return BK_LOTUS;
  case 0x55: return BK_BOBOMB; case 0x2F: return BK_BOO; case 0x3F: return BK_DRYBONES;
  case 0x8A: case 0x8B: case 0x8C: case 0x8D: case 0x8E: case 0x8F: return BK_THWOMP;
  case 0x5A: case 0x5B: case 0x51: case 0x5E: case 0x5F: case 0x60: return BK_ROTODISC;
  case 0x9E: case 0x53: return BK_PODOBOO; case 0x30: case 0x45: return BK_HOTFOOT; case 0x59: return BK_FIRESNAKE;
  case 0x58: return BK_FIRECHOMP; case 0x89: case 0x4F: return BK_CHAINCHOMP; case 0xAD: return BK_ROCKY;
  case 0x78: case 0x79: return BK_BULLET; case 0x29: return BK_SPIKE; case 0x31: case 0x32: return BK_STRETCH;
  case 0x2B: return BK_KURIBO; case 0xAF: return BK_SUN;
  case 0x4A: case 0x4B: case 0x4C: return BK_BOOMBOOM; case 0x0E: return BK_KOOPALING; case 0x18: return BK_BOWSER;
  case 0x0B: return BK_ONEUP; case 0x0C: return BK_STAR; case 0x0D: return BK_MUSHROOM; case 0x19: return BK_FLOWER; case 0x1E: return BK_LEAF;
  case 0x41: return BK_CARD; case 0x52: case 0xBA: return BK_TREASURE;
  case 0x94: case 0x95: case 0x96: case 0x97: case 0x98: case 0x99: case 0x9A: return BK_BIGQ;
  case 0x26: case 0x27: case 0x28: case 0x36: case 0x37: case 0x38: case 0x3A: case 0x3C: case 0x3E: case 0x44: case 0x90: case 0x91: case 0x92: case 0x93: return BK_LOG;
  case 0x24: case 0x2C: return BK_CLOUDPLAT; case 0xAE: return BK_BOLTLIFT;
  case 0x34: return BK_TOAD; case 0xD5: return BK_KING;
  default: return -1;
  }
}
/* the tile an enemy of the list stands at: the row under its top, if that is free, since the tall ones are listed by their heads */
let boss_fort_no = 0;                  /* the number of the fortress whose Boom Boom is in hand: his Y hi */
let er_cell = 0;
function enemy_room(a, x, row){
  const r = tile_room(a, x, row), c = tr_cell;
  if (solid(r, c)){ const u = up_cell(r, c), r2 = ws_room; if (u >= 0 && !solid(r2, u)){ er_cell = u; return r2; } }
  else { const d = down_cell(r, c), r2 = ws_room; if (d >= 0 && !solid(r2, d) && !stands(r2, d) && row + 1 < AREA[a].height){ const dd = down_cell(r2, d), r3 = ws_room; if (dd >= 0 && (solid(r3, dd) || stands(r3, dd))){ er_cell = d; return r2; } } }
  er_cell = c; return r;
}
/* the creatures an area starts with: the cartridge's object list, laid on the boards */
let pipeway_idx = -1, pipeway_mode = 0;   /* the level's pipeway controller: where its pipe sets you down on the map */
function spawn_area(a){
  pipeway_idx = -1; pipeway_mode = 0;
  for (let i = AREA[a].enemy_first; i < AREA[a].enemy_first + AREA[a].enemy_n; i++){
    const E = ENEMY[i];
    /* the pipeway controller is no creature: its row is the index of the pair of map stops its level's pipe joins,
     * and its row's high bits say which end you come out of (prg002.asm's ObjInit_PipewayCtlr) */
    if (E.id === 0x25){ pipeway_idx = ((E.row >> 4) & 1) * 16 + (E.row & 15); pipeway_mode = (E.row >> 5) !== 0 ? 1 : 0; continue; }
    const kind = kind_of_type(E.id);
    if (kind < 0) continue;
    const x = E.x;
    let row = E.row;
    /* Boom Boom's Y hi is the fortress's own number, which the map wants when it falls, and not his height at
     * all: the cartridge reads it, then sets his Y hi to 1 and stands him there (ObjInit_BoomBoom, prg003.asm) */
    if (kind === BK_BOOMBOOM){ boss_fort_no = row >> 4; row = 16 + (row & 15); }
    const r = enemy_room(a, x, row), c = er_cell;
    if (kind === BK_PIRANHA || kind === BK_FIREPIRANHA){
      /* it lives in the pipe under it, and comes up */
      const b = spawn(kind, r, c);
      if (b){ b.state = 0; b.timer = (i * 5) % 8; b.dir = (E.id === 0xA1 || E.id === 0xA3 || E.id === 0x56 || E.id === 0x57) ? 1 : 0; }
      continue;
    }
    const b = spawn(kind, r, c);
    if (!b) continue;
    b.home = x; b.aux = E.id;
    if ((BEAST[kind].flags & BF_BOSS) || kind === BK_TOAD || kind === BK_KING) for (let k = 0; k < 8 && !supported(b.room, b.cell); k++){ const dn = down_cell(b.room, b.cell), r2 = ws_room; if (dn < 0 || solid(r2, dn)) break; b.room = r2; b.cell = dn; }
    if (kind === BK_ROTODISC){ b.state = i % 12; b.dir = (E.id === 0x5B || E.id === 0x60) ? 1 : 0; b.hp = r; b.home = c; }
    if (kind === BK_THWOMP){ b.dir = E.id === 0x8A ? 0 : E.id === 0x8B ? 1 : E.id === 0x8C ? 2 : 3; b.hp = r; b.home = c; }
    if (kind === BK_PARARED){ b.dir = E.id === 0x80 ? 1 : 0; b.hp = r; b.home = c; b.state = 1; }
    if (kind === BK_PARABEETLE || kind === BK_LOG || kind === BK_CLOUDPLAT || kind === BK_BOLTLIFT){
      b.dir = 1; b.hp = r; b.home = c;
      b.state = (E.id === 0x28 || E.id === 0x38) ? 1 : (E.id === 0x3A || E.id === 0x3C) ? 2 : 0;
      /* a path follower starts along the path, east if the path goes that way */
      if (b.state === 2){ b.dir = 0; for (let d = 0; d < 6; d++){ const n = way_cell(b.room, b.cell, d); if (n >= 0 && RS[ws_room].c[n].ch === ';'){ b.dir = d; break; } } }
    }
    if (kind === BK_ROCKY){ b.state = 0; b.timer = (i * 3) % 7; }
    if (kind === BK_BOO || kind === BK_STRETCH) b.state = 0;
    if (kind === BK_BOBOMB) b.hp = 0;
    if (kind === BK_VENUS || kind === BK_LOTUS || kind === BK_NIPPER || kind === BK_FIREPIRANHA) b.timer = (i * 7) % 9;
    if (kind === BK_CHAINCHOMP){ b.hp = r; b.home = c; b.timer = 0; }
    if (kind === BK_PODOBOO){ b.hp = r; b.home = c; b.timer = (i * 5) % 12; b.dir = E.id === 0x53 ? 1 : 0; }
    if (kind === BK_KOOPALING) b.home = world - 1;
    if (kind === BK_BIGQ) b.state = E.id - 0x94;
    if (kind === BK_TREASURE) b.state = 0;
    if (kind === BK_SPIKE || kind === BK_HAMMERBRO || kind === BK_BOOMERANGBRO || kind === BK_FIREBRO || kind === BK_SLEDGEBRO) b.timer = (i * 3) % 6;
    if (kind === BK_CHEEP || kind === BK_REDCHEEP){ b.dir = 0; b.hp = r; b.home = c; }
    if (kind === BK_LAKITU){ b.dir = 1; b.timer = 0; }
    if (kind === BK_BULLET){ b.dir = 0; }
  }
}

/* ── places ── */
function tile_of_x(){ cell_tile(room, cell); return ct_x; }
function tile_of_row(){ cell_tile(room, cell); return ct_row; }
function cur_screen(){ return screen_of_x(area, tile_of_x(), tile_of_row()); }
/* the junction of an area for the screen of it you leave from: where its alternate takes you in.  The cartridge keeps the
 * table by the screen; a screen with no entry takes the nearest entry below it, as the airship's intro does */
function jct_of(a, screen){
  let best = -1;
  for (let i = AREA[a].jct_first; i < AREA[a].jct_first + AREA[a].jct_n; i++){
    if (JCT[i].index === screen) return i;
    if (JCT[i].index < screen && (best < 0 || JCT[i].index > JCT[best].index)) best = i;
  }
  if (best >= 0) return best;
  return AREA[a].jct_n ? AREA[a].jct_first : -1;
}
function room_enter(from){
  const R = RS[room];
  R.entry = cell;
  if (!R.seen) R.seen = 1;
  sound_scene();
  sound_beasts();
}
function settle_now(){
  for (let guard = 0; guard < 80 && !supported(room, cell) && !on_climb && !watery(room, cell); guard++){
    const d = down_cell(room, cell), r2 = ws_room;
    if (d < 0 || solid(r2, d)) break;
    if (RS[r2].c[d].ground === G_LAVA || RS[r2].c[d].ground === G_QUICK) break;
    { const b = being_at(r2, d); if (b && !(BEAST[b.kind].flags & (BF_THING | BF_PLATFORM | BF_ITEM))){ touch_being(b, 1); break; } }   /* a creature under you as you come down: landed on */
    const from = room; room = r2; cell = d;
    if (room !== from) room_enter(from);
  }
}
/* the areas of the level: the one entered, its alternate, and the alternate's alternate, built and peopled */
function build_level(a){
  const seen = [];
  for (let k = 0, cur = a; k < 6 && cur >= 0; k++){
    if (seen.indexOf(cur) >= 0) break;
    seen.push(cur); build_area(cur); spawn_area(cur);
    cur = AREA[cur].alt;
  }
}
/* put you into an area: at its start, or by a junction (where the pipe or the door from the other area's screen comes out) */
function enter_area(a, mode, x_from, row_from){
  const from = room;
  const A = AREA[a];
  area = a;
  let x, row;
  if (mode === EM_HERE){ x = x_from; row = row_from; }
  else if (mode === EM_TOP){ x = x_from; row = 0; }
  else if (mode === EM_BOTTOM){ x = x_from; row = A.height - 1; }
  else { x = A.xstart; row = A.start_row; if (A.vertical){ x = 8; row = A.height - 3; } }
  if (x < 0) x = 0;
  if (x >= A.width) x = A.width - 1;
  if (row < 0) row = 0;
  if (row >= A.height) row = A.height - 1;
  room = tile_room(a, x, row); cell = tr_cell;
  if (mode === EM_HERE && (solid(room, cell) || is_solid_letter(grid_of(a)[row * A.width + x])) && jct_dir >= 1 && jct_dir <= 4){
    /* a pipe's mouth is where you arrive, and the junction says which way you come out of it: up, down, right, left */
    for (let k = 0; k < 4 && (solid(room, cell) || k === 0); k++){
      const n = jct_dir === 1 ? up_cell(room, cell) : jct_dir === 2 ? down_cell(room, cell) : way_cell(room, cell, jct_dir === 3 ? 0 : 3);
      if (n < 0) break;
      room = ws_room; cell = n;
    }
  }
  /* into a solid, up to the open air; into water, stay */
  for (let k = 0; k < 12 && solid(room, cell); k++){ const u = up_cell(room, cell); if (u < 0) break; room = ws_room; cell = u; }
  if (mode === EM_HERE && !solid(room, cell)){
    /* a pipe's mouth is where you arrive: stand on it */
    const k = RS[room].c[cell];
    if (k.thing === T_PIPE){ const u = up_cell(room, cell), r2 = ws_room; if (u >= 0 && !solid(r2, u)){ room = r2; cell = u; } }
  }
  jct_dir = 0;
  rise = 0; on_climb = climbable(room, cell); last_cell = -1; flying = 0; pmeter = 0; glide = 0; in_water = watery(room, cell);
  if (room !== from) room_enter(from);
  if (mode === EM_START || mode === EM_HERE) settle_now();
}
function start_level(a, node){
  clear_beings();
  build_level(a);
  held = -1; on_climb = 0; rise = 0; star_left = 0; hurt_left = 0; pswitch_left = 0; flying = 0; pmeter = 0; glide = 0; kuribo = 0; boss_dead = 0;
  level_node = node; level_area = a; came_from_area = -1;
  level_time = AREA[a].time === 3 ? -1 : (AREA[a].time === 0 ? 300 : AREA[a].time === 1 ? 400 : 200) * 4;   /* the clock: a turn here is a cell, two tiles; four turns a second of the original is about a run */
  on_map = 0;
  room = -1;
  enter_area(a, EM_START, 0, 0);
  if (pwing){ flying = 9999; say("The P-wing: you can fly the whole way."); }
  sound_bed = ""; sound_scene();
}

/* ── hurting and scoring ── */
function add_score(n){ score += n; }
function add_coin(){ coins++; sound_say("blow coin"); add_score(50); if (coins >= 100){ coins -= 100; lives++; sound_say("blow oneup"); say("A hundred coins: a life.  " + lives + "."); } }
function become(s){ if (s > suit) sound_say("blow grow"); suit = s; }
function hurt(what){
  if (star_left > 0 || hurt_left > 0 || dead) return;
  if (kuribo){ kuribo = 0; hurt_left = 6; sound_say("blow hurt"); say(what + ".  The shoe is lost."); cap_msg(); return; }
  if (suit >= S_RACCOON){ suit = S_BIG; hurt_left = 6; sound_say("blow hurt"); say(what + ".  The suit is gone; you are big."); cap_msg(); return; }
  if (suit === S_BIG){ suit = S_SMALL; hurt_left = 6; sound_say("blow hurt"); say(what + ".  You are small."); cap_msg(); return; }
  say(what + "."); cap_msg();
  die(what);
}
function kill_being(b, points, how){
  b.alive = 0;
  if (points) add_score(points);
  if (how){ say(how + ".  " + points + "."); cap_msg(); }
  if (b.kind === BK_KOOPALING || b.kind === BK_BOOMBOOM) boss_dead = 1;
}
const BIGQ_SUITS = [IT_NONE, IT_MUSHROOM, IT_FLOWER, IT_LEAF, IT_TANOOKI, IT_FROG, IT_HAMMER];
function take_item(b){
  const k = b.kind;
  b.alive = 0;
  if (k === BK_MUSHROOM){ if (suit === S_SMALL) become(S_BIG); say(suit === S_BIG ? "A mushroom: you are big." : "A mushroom."); add_score(1000); }
  else if (k === BK_LEAF){ become(S_RACCOON); say("A leaf: a raccoon's tail and ears.  g spins the tail; run and you fly."); add_score(1000); }
  else if (k === BK_FLOWER){ become(S_FIRE); say("A fire flower: g throws fire."); add_score(1000); }
  else if (k === BK_STAR){ star_left = 24; sound_say("blow grow"); say("Invincible, for a while."); add_score(1000); sound_bed = ""; sound_scene(); }
  else if (k === BK_ONEUP){ lives++; sound_say("blow oneup"); say("A life.  " + lives + "."); }
  else if (k === BK_CARD){ card_taken(); }
  else if (k === BK_WAND){ say("The wand!  The king will be himself again."); sound_say("jingle victory"); level_clear(); }
  else if (k === BK_BIGQ){
    const it = b.state >= 0 && b.state < 7 ? BIGQ_SUITS[b.state] : IT_LEAF;
    if (it === IT_NONE){ lives += 3; sound_say("blow oneup"); say("The big ? block: three lives.  " + lives + "."); }
    else { if (box_n < BOX_MAX) box[box_n++] = it; sound_say("blow grow"); say("The big ? block: " + ITEM_NAME[it] + ", for the item box."); }
  }
  else if (k === BK_ANCHOR){ if (box_n < BOX_MAX) box[box_n++] = IT_ANCHOR; say("An anchor, for the box."); }
  else if (k === BK_TREASURE && b.state === 14){ say("The ball of light: the fortress is yours."); sound_say("jingle victory"); level_clear(); }
  else if (k === BK_TREASURE){
    const it = b.state === 1 ? IT_MUSHROOM : b.state === 2 ? IT_FLOWER : b.state === 3 ? IT_LEAF : b.state === 4 ? IT_STAR : b.state === 5 ? IT_HAMMER : b.state === 6 ? IT_FROG : b.state === 7 ? IT_TANOOKI : b.state === 8 ? IT_MUSICBOX : b.state === 9 ? IT_WHISTLE : b.state === 10 ? IT_ANCHOR : b.state === 11 ? IT_HAMMERTOOL : b.state === 12 ? IT_CLOUD : b.state === 13 ? IT_PWING : IT_LEAF;
    if (box_n < BOX_MAX) box[box_n++] = it;
    sound_say("blow grow"); say("The treasure box: " + ITEM_NAME[it] + ", for the item box.");
    if (level_kind === LK_HBRO) level_clear();
  }
}
/* a shell kicked: it slides its way along the row */
function kick_shell(b, dir){
  b.state = 1; b.dir = dir; b.timer = 0;
  sound_say("blow kick");
  say("The shell slides.");
}
/* a stomp: what landing on a creature does */
function stomp(b){
  const f = BEAST[b.kind].flags, k = b.kind;
  sound_say("blow stomp");
  rise = 2;                                               /* the bounce */
  if (f & BF_BOSS){
    if (b.state === 2){ say(BEAST[k].name + " spins, and is not to be hit again yet."); cap_msg(); return; }   /* stunned: the bounce, no hit */
    b.hp--;
    if (b.hp > 0){ say(BEAST[k].name + " is hit.  " + b.hp + " more."); cap_msg(); b.timer = 0; b.state = 2; return; }
    kill_being(b, BEAST[k].points, null);
    say(BEAST[k].name + " is beaten."); cap_msg();
    if (k === BK_KOOPALING){ const w = spawn(BK_WAND, b.room, b.cell); if (w) say(BEAST[k].name + " is beaten, and drops the wand."); cap_msg(); }
    else if (k === BK_BOOMBOOM){ const w = spawn(BK_TREASURE, b.room, b.cell); if (w){ w.state = 14; } say("Boom Boom is beaten.  A ball of light: the fortress is yours."); }
    return;
  }
  if (k === BK_PARAGOOMBA){ b.kind = BK_GOOMBA; say("The Paragoomba's wings are gone."); return; }
  if (k === BK_PARAGREEN){ b.kind = BK_GREENKOOPA; say("The Paratroopa's wings are gone."); return; }

      const surface = in_water && u3 >= 0 && !watery(r3, u3) && !solid(r3, u3);
      rise = surface ? JUMP_ROWS + 1 : in_water ? 1 : JUMP_ROWS;
      if ((suit === S_RACCOON || suit === S_TANOOKI) && meter_full && !in_water){ flying = 12; say("Up, and flying!"); sound_say("whoosh fly"); }
      else if (pwing && flying <= 0) flying = 9999;
      else sound_say("whoosh jump");
    }
    const may = on_climb || rise > 0 || flying > 0 || in_water;
    if (!may){ say("Nothing to jump from."); end_turn(); return; }
    if (n < 0){
      leave_by_edge(1);
      if (!dead && !won && !on_map) end_turn();
      return;
    }
    const b = being_in_way(r2, n);
    if (b && !(BEAST[b.kind].flags & (BF_THING | BF_PLATFORM))){
      touch_being(b, 0);
      if (dead || won || on_map) return;
      if (b.alive && !(BEAST[b.kind].flags & BF_ITEM)){ if (rise > 0) rise--; end_turn(); return; }
    }
    const k = RS[r2].c[n];
    if (k.thing >= 0 && (THING[k.thing].flags & TF_HIT) && (solid(r2, n) || k.thing === T_INVIS)){ hit_block(r2, n); rise = 0; end_turn(); return; }
    if (solid(r2, n) || platform_at(r2, n)){ say((k.thing >= 0 ? THING[k.thing].name : "The ceiling") + "."); cap_msg(); rise = 0; end_turn(); return; }
    if (!on_climb || off_vine){ if (flying > 0) flying--; else if (!in_water) rise--; }
    rose = 1;
    if (climbable(r2, n)) rise = 0;
    sound_step();
    go_cell(r2, n);
    end_turn(); return;
  }
  if (n < 0){
    if (downward && (on_climb || in_water) && tile_of_row() >= AREA[area].height - 1){ leave_by_edge(0); if (!dead && !on_map) end_turn(); return; }
    /* off the east edge, where the level goes on that way: the airship's intro is aboard the ship, and 4-2, which has
     * no pipe, no door and no card of its own, is at its end (the cartridge's junction for the last screen) */
    if (d === 0 && AREA[area].alt >= 0 && (AREA[area].init_action === 6 || jct_of(area, cur_screen()) >= 0)){ go_junction(AREA[area].init_action === 6 ? "A run, a jump, and aboard the airship" : "The way east"); end_turn(); return; }
    say("The edge."); end_turn(); return;
  }
  const b = being_in_way(r2, n);
  if (b && !(BEAST[b.kind].flags & (BF_THING | BF_PLATFORM))){
    touch_being(b, downward);
    if (dead || won || on_map) return;
    if (b.alive && !(BEAST[b.kind].flags & BF_ITEM)){ if (!downward) rise = 0; end_turn(); return; }
  }
  if (b && b.kind === BK_SHELL && b.state === 0 && level_step){ kick_shell(b, d === 0 ? 1 : 0); end_turn(); return; }
  const k = RS[r2].c[n];
  if (level_step && k.thing === T_PIPE && k.inside !== PK_BODY){
    /* a pipe's mouth beside you, on the level: in */
    if (k.inside === PK_ALT || k.inside === PK_EXIT){ enter_pipe(r2, n); if (!dead && !won && !on_map) end_turn(); return; }
  }
  if (solid(r2, n) || platform_at(r2, n)){
    say((k.thing >= 0 ? THING[k.thing].name : GROUND[k.ground].name) + "."); cap_msg();
    if (!downward) rise = 0;
    end_turn(); return;
  }
  if (!downward){
    /* a level step in the air: the raccoon glides, the frog swims, anyone else falls at the turn's end */
    if (flying > 0 && !supported(room, cell)){ flying--; rose = 1; }
    else if ((suit === S_RACCOON || suit === S_TANOOKI) && !supported(room, cell) && !in_water){ glide ^= 1; if (glide) rose = 1; }
    rise = 0;
  } else { rise = 0; }
  if (climbable(r2, n)) rise = 0;
  sound_step();
  go_cell(r2, n);
  end_turn();
}

/* ── g: the tail, the fire, the hammer, the hands ── */
function held_being(){ const b = held >= 0 && held < being_n && beings[held].alive ? beings[held] : null; if (!b) held = -1; return b; }
function throw_held(){
  const b = held_being();
  if (!b){ held = -1; return; }
  const n = way_cell(room, cell, facing ? 0 : 3), r2 = ws_room;
  if (n < 0 || solid(r2, n)){ say("No room to throw."); return; }
  b.alive = 1; b.room = r2; b.cell = n;
  if (b.kind === BK_SHELL){ kick_shell(b, facing); }
  else { b.state = 1; b.dir = facing; b.timer = 0; }
  held = -1;
  sound_say("blow throw");
  say("Thrown.");
}
const CHEST_GIFT = [IT_MUSHROOM, IT_FLOWER, IT_LEAF, IT_STAR, IT_PWING, IT_TANOOKI];
function chest_open(r, c){
  const k = RS[r].c[c];
  if (k.thing !== T_CHEST) return;
  /* the Toad house's three chests: one opens, the house is done */
  const it = hash3u(Number(SEED & 0xFFFFFFFFn), level_node >>> 0, (r * 61 + c) >>> 0) % 6;
  const obj = level_node >= 0 ? MAPNODE[level_node].obj : -1;
  let item = CHEST_GIFT[it];
  if (obj === 0x0001) item = (it % 2) ? IT_HAMMERTOOL : IT_ANCHOR;
  if (box_n < BOX_MAX) box[box_n++] = item;
  k.thing = T_EMPTY; sync_cell(r, c);
  sound_say("blow grow");
  say("The chest opens: " + ITEM_NAME[item] + ", for the item box.  Toad: \"Come again!\"");
  level_clear();
}
function action_key(){
  turn++;
  /* a chest beside you */
  for (let d = 0; d < 6; d += 3){ const n = way_cell(room, cell, d), r2 = ws_room; if (n >= 0 && RS[r2].c[n].thing === T_CHEST){ chest_open(r2, n); if (!on_map) end_turn(); return; } }
  if (held >= 0){ throw_held(); end_turn(); return; }
  let t = thing_at(room, cell);
  if (!t) for (let d = 0; d < 6; d += 3){ const n = way_cell(room, cell, d), r2 = ws_room; if (n >= 0){ const tt = thing_at(r2, n); if (tt){ t = tt; break; } } }
  if (t){ held = being_index(t); t.alive = 2; sound_say("blow lift"); say("You pick up " + BEAST[t.kind].name + "."); end_turn(); return; }
  if (suit === S_FIRE){
    const n = way_cell(room, cell, facing ? 0 : 3), r2 = ws_room;
    if (n >= 0 && !solid(r2, n)){ const f = spawn(BK_FIREBALL, r2, n); if (f){ f.dir = facing; f.timer = 0; f.state = 1; } sound_say("shot fireball"); say("A fireball."); }
    else say("No room for a fireball.");
    end_turn(); return;
  }
  if (suit === S_HAMMER){
    const n = way_cell(room, cell, facing ? 5 : 4), r2 = ws_room;
    if (n >= 0 && !solid(r2, n)){ const f = spawn(BK_HAMMER, r2, n); if (f){ f.dir = facing; f.timer = 0; f.state = 1; f.aux = 1; } sound_say("shot hammer"); say("A hammer, thrown."); }
    end_turn(); return;
  }
  if (suit === S_RACCOON || suit === S_TANOOKI){
    let hits = 0;
    sound_say("whoosh tail");
    for (let d = 0; d < 6; d += 3){
      const n = way_cell(room, cell, d), r2 = ws_room;
      if (n < 0) continue;
      const b = being_at(r2, n);
      if (b && strike(b, 2, "The tail")) hits++;
      if (RS[r2].c[n].thing === T_BRICK && RS[r2].c[n].inside === IN_NONE){ RS[r2].c[n].thing = -1; sync_cell(r2, n); hits++; sound_say("blow break"); }
    }
    say(hits ? "The tail spins: " + hits + " hit." : "The tail spins.");
    end_turn(); return;
  }
  say("Nothing to throw, and nothing to pick up.");
  end_turn();
}

/* ── the creatures' turn ────────────────────────────────────
 * A walker goes its way a cell a turn and turns at a wall; it falls
 * where there is nothing under it, unless it is the kind that turns
 * at a ledge.  The flying kinds patrol.  What is thrown flies two
 * cells a turn and then falls, and what it meets goes down.  A
 * creature that comes to your cell touches you. */
function beast_touch_you(b){ if (b && b.room === room && b.cell === cell && b.alive && !dead) touch_being(b, 0); }
function you_on(b){ const u = up_cell(b.room, b.cell); return u >= 0 && ws_room === room && u === cell && rise === 0; }
function explode(r, c){
  sound_say("blow boom");
  const rs = [r], cs = [c];
  for (let d = 0; d < 6; d++){ const k = way_cell(r, c, d); if (k >= 0){ rs.push(ws_room); cs.push(k); } }
  let broke = 0;
  for (let i = 0; i < rs.length; i++){
    if (RS[rs[i]].c[cs[i]].thing === T_BRICK){ RS[rs[i]].c[cs[i]].thing = -1; sync_cell(rs[i], cs[i]); broke++; }
    if (rs[i] === room && cs[i] === cell) hurt("The Bob-omb");
    for (let k = 0; k < being_n; k++){
      const o = beings[k];
      if (!o.alive || o.room !== rs[i] || o.cell !== cs[i] || o.kind === BK_BOBOMB) continue;
      const f = BEAST[o.kind].flags;
      if (f & (BF_ITEM | BF_PLATFORM | BF_THING | BF_PROJ | BF_BOSS)) continue;
      if (o.kind === BK_THWOMP || o.kind === BK_ROTODISC || o.kind === BK_BOO) continue;
      kill_being(o, BEAST[o.kind].points, null);
    }
  }
  if (broke) say("The Bob-omb goes off: " + broke + " brick" + (broke === 1 ? "" : "s") + " broken.");
  else say("The Bob-omb goes off.");
}
/* a thing in flight, or a shell sliding, or a fireball, meeting a creature */
function thrown_hits(p){
  cell_tile(p.room, p.cell); const px = ct_x, prow = ct_row;
  for (let i = 0; i < being_n; i++){
    const o = beings[i];
    if (!o.alive || o === p) continue;
    const f = BEAST[o.kind].flags;
    if (o.room !== p.room || o.cell !== p.cell){
      if (!(f & BF_BOSS)) continue;
      cell_tile(o.room, o.cell);
      if (Math.abs(ct_x - px) > 2 || Math.abs(ct_row - prow) > 1) continue;
    }
    if (f & (BF_ITEM | BF_PLATFORM | BF_THING | BF_PROJ)) continue;
    if (o.kind === BK_TOAD || o.kind === BK_KING) continue;
    const by = p.kind === BK_FIREBALL ? 1 : 3;
    const yours_hammer = p.kind === BK_HAMMER && p.aux === 1;
    if (p.kind === BK_FIREBALL && (f & BF_FIREPROOF)){ p.alive = 0; return; }
    if (f & BF_BOSS){
      if (p.kind === BK_FIREBALL || yours_hammer){ strike(o, 1, null); p.alive = 0; return; }
      if (p.kind === BK_SHELL || p.kind === BK_ICEBLOCK){ p.alive = 0; return; }
      continue;
    }
    if (o.kind === BK_THWOMP || o.kind === BK_ROTODISC || o.kind === BK_BOO || o.kind === BK_STRETCH || o.kind === BK_CHAINCHOMP){ if (p.kind === BK_FIREBALL) p.alive = 0; continue; }
    if (strike(o, yours_hammer ? 3 : by, null)){
      sound_say("blow hit");
      say(BEAST[p.kind].name + " hits " + BEAST[o.kind].name + ".  " + BEAST[o.kind].points + "."); cap_msg();
      if (p.kind === BK_FIREBALL || p.kind === BK_HAMMER){ p.alive = 0; return; }
    }
  }
}
function land_thrown(b){
  const k = b.kind;
  b.alive = 1; b.hp = 0;
  if (k === BK_SHELL){ b.state = 0; return; }
  if (k === BK_ICEBLOCK){ b.state = 0; return; }
  if (!(BEAST[k].flags & BF_THING)){ kill_being(b, 0, null); return; }
  b.state = 0;
}
function thrown_fly(b){
  b.hp++;
  const steps = b.hp <= 3 ? 2 : 1;
  for (let s = 0; s < steps && b.alive; s++){
    const n = way_cell(b.room, b.cell, b.dir ? 0 : 3), r2 = ws_room;
    if (n < 0 || solid(r2, n)){ if (b.hp <= 3){ b.hp = 4; break; } land_thrown(b); return; }
    b.room = r2; b.cell = n;
    thrown_hits(b);
    if (!b.alive) return;
  }
  if (b.hp > 3){
    const dn = down_cell(b.room, b.cell), r2 = ws_room;
    if (dn < 0){ b.alive = 0; return; }
    if (solid(r2, dn) || stands(r2, dn) || platform_at(r2, dn)){ land_thrown(b); return; }
    b.room = r2; b.cell = dn;
    thrown_hits(b);
    if (b.alive && RS[r2].c[dn].ground === G_LAVA) b.alive = 0;
  }
}
function beast_fall(b){
  const d = down_cell(b.room, b.cell), r2 = ws_room;
  if (d < 0){ b.alive = 0; return; }
  if (solid(r2, d) || stands(r2, d) || platform_at(r2, d)) return;
  if (r2 === room && d === cell) return;
  if (being_at(r2, d) && being_at(r2, d) !== b) return;
  if (RS[r2].c[d].ground === G_LAVA){ b.alive = 0; return; }
  if (RS[r2].c[d].ground === G_WATER && !(BEAST[b.kind].flags & (BF_SWIM | BF_THING))){ b.alive = 0; return; }
  const carried = you_on(b);
  b.room = r2; b.cell = d;
  if (carried && standable_kind(b)){ const u = up_cell(r2, d), r3 = ws_room; if (u >= 0 && !solid(r3, u)){ const from = room; room = r3; cell = u; if (room !== from) room_enter(from); } }
}
/* the background path a platform rides, and the next cell of it: its own way if the path goes on that way, else the
 * nearest way to it that the path takes, and never straight back the way it came (ObjNorm_PathFollowPlat, prg002.asm) */
const PATH_TRY = [0, 1, 5, 2, 4];
let pn_room = -1, pn_cell = -1;
function path_cell(r, c){ return RS[r].c[c].ch === ';'; }
function path_next(r, c, dir){
  for (let k = 0; k < 5; k++){
    const d = (dir + PATH_TRY[k]) % 6;
    const n = way_cell(r, c, d), rr = ws_room;
    if (n >= 0 && path_cell(rr, n)){ pn_room = rr; pn_cell = n; return d; }
  }
  /* a step of the path the boards cannot keep whole -- the slant is a tile a row and a cell is two tiles wide, so
   * now and then the path skips a cell: over that one, where the path goes on beyond it */
  for (let k = 0; k < 5; k++){
    const d = (dir + PATH_TRY[k]) % 6;
    const n = way_cell(r, c, d), rr = ws_room;
    if (n < 0 || solid(rr, n) || path_cell(rr, n)) continue;
    for (let k2 = 0; k2 < 3; k2++){
      const d2 = (d + PATH_TRY[k2]) % 6;
      const m = way_cell(rr, n, d2), r3 = ws_room;
      if (m >= 0 && path_cell(r3, m) && !(r3 === r && m === c)){ pn_room = rr; pn_cell = n; return d; }
    }
  }
  return -1;
}
function beast_move(b, r2, n){
  const carried = you_on(b) && standable_kind(b) && (BEAST[b.kind].flags & BF_PLATFORM);
  b.room = r2; b.cell = n;
  if (carried){ const u = up_cell(r2, n), r3 = ws_room; if (u >= 0 && !solid(r3, u) && !being_at(r3, u)){ const from = room; room = r3; cell = u; if (room !== from) room_enter(from); take_here(); } }
}
function walker_go(b, cells){
  for (let k = 0; k < cells; k++){
    const n = way_cell(b.room, b.cell, b.dir ? 0 : 3), r2 = ws_room;
    if (n < 0 || solid(r2, n)){ b.dir = b.dir ? 0 : 1; continue; }
    if (BEAST[b.kind].flags & BF_LEDGE){ const dn = down_cell(r2, n), r3 = ws_room; if (dn < 0 || (!solid(r3, dn) && !stands(r3, dn) && !platform_at(r3, dn))){ b.dir = b.dir ? 0 : 1; continue; } }
    if (r2 === room && n === cell){ beast_touch_you(b); return; }
    const o = being_at(r2, n);
    if (o && o !== b && !(BEAST[o.kind].flags & (BF_THING | BF_ITEM))){ b.dir = b.dir ? 0 : 1; continue; }
    beast_move(b, r2, n);
  }
}
function shell_slide(b){
  for (let k = 0; k < 2 && b.alive; k++){
    const n = way_cell(b.room, b.cell, b.dir ? 0 : 3), r2 = ws_room;
    if (n < 0 || solid(r2, n)){
      /* off a wall, and back; a brick it meets breaks */
      if (n >= 0 && RS[r2].c[n].thing === T_BRICK && RS[r2].c[n].inside === IN_NONE){ RS[r2].c[n].thing = -1; sync_cell(r2, n); sound_say("blow break"); }
      b.dir = b.dir ? 0 : 1; b.timer++;
      if (b.timer > 40){ b.state = 0; b.timer = 0; }
      return;
    }
    b.room = r2; b.cell = n;
    thrown_hits(b);
    if (b.alive && r2 === room && n === cell) hurt("The shell");
    const dn = down_cell(b.room, b.cell), r3 = ws_room;
    if (dn >= 0 && !solid(r3, dn) && !stands(r3, dn) && !platform_at(r3, dn)){ if (RS[r3].c[dn].ground === G_LAVA){ b.alive = 0; return; } b.room = r3; b.cell = dn; }
  }
}
function spit(b, kind, dir, dy){
  const n = dy ? tile_step(b.room, b.cell, dir ? 1 : -1, dy) : way_cell(b.room, b.cell, dir ? 0 : 3), r2 = ws_room;
  if (n < 0 || solid(r2, n)) return;
  const p = spawn(kind, r2, n);
  if (p){ p.dir = dir; p.timer = 0; p.aux = dy; p.state = 1; }
  sound_say("shot spit");
  if (r2 === room && n === cell) beast_touch_you(p);
}
function near_you(b, cells){ cell_tile(b.room, b.cell); const x = ct_x, row = ct_row; cell_tile(room, cell); return Math.abs(ct_x - x) <= cells * 2 && Math.abs(ct_row - row) <= cells; }
function you_dx(b){ cell_tile(b.room, b.cell); const x = ct_x; cell_tile(room, cell); return ct_x - x; }
function you_dy(b){ cell_tile(b.room, b.cell); const row = ct_row; cell_tile(room, cell); return ct_row - row; }
/* a step toward you, or away, on the level; or up and down */
function step_toward(b, toward){
  const dx = you_dx(b);
  const d = ((dx > 0) === (toward !== 0)) ? 0 : 3;
  if (dx === 0) return;
  const n = way_cell(b.room, b.cell, d), r2 = ws_room;
  if (n < 0 || solid(r2, n)) return;
  if (r2 === room && n === cell){ beast_touch_you(b); return; }
  if (being_at(r2, n)) return;
  beast_move(b, r2, n);
}
function fly_step(b, d){
  const n = way_cell(b.room, b.cell, d), r2 = ws_room;
  if (n < 0 || solid(r2, n)) return;
  if (r2 === room && n === cell){ beast_touch_you(b); return; }
  const o = being_at(r2, n);
  if (o && o !== b) return;
  beast_move(b, r2, n);
}
function beast_act(b){
  const f = BEAST[b.kind].flags;
  const k = b.kind;
  b.timer++;
  if (b.alive === 2){ thrown_fly(b); return; }
  if (k === BK_SHELL && b.state === 1){ shell_slide(b); return; }
  if (k === BK_SHELL || k === BK_ICEBLOCK){ beast_fall(b); return; }
  if (f & BF_ITEM){
    if (k === BK_MUSHROOM || k === BK_STAR || k === BK_ONEUP){ if (b.timer & 1) walker_go(b, 1); beast_fall(b); beast_touch_you(b); }
    if (k === BK_LEAF){ const d = down_cell(b.room, b.cell), r2 = ws_room; if (d >= 0 && !solid(r2, d) && !stands(r2, d)){ if (b.timer & 1) beast_move(b, r2, d); } beast_touch_you(b); }
    if (k === BK_CARD || k === BK_WAND || k === BK_TREASURE || k === BK_ANCHOR || k === BK_BIGQ) beast_touch_you(b);
    return;
  }
  switch (k){
  case BK_FIREBALL: case BK_HAMMER: case BK_BOOMERANG: case BK_WANDSHOT: case BK_KOOPAFIRE: case BK_SPIKEBALL: case BK_LASER: case BK_CANNONBALL: {
    const cells = k === BK_FIREBALL ? 3 : 2;
    for (let s = 0; s < cells && b.alive; s++){
      let n;
      if (k === BK_HAMMER){ const dy = b.timer <= 2 ? -1 : 1; n = tile_step(b.room, b.cell, b.dir ? 1 : -1, dy); }
      else if (k === BK_BOOMERANG){ if (b.timer === 4) b.dir = b.dir ? 0 : 1; n = way_cell(b.room, b.cell, b.dir ? 0 : 3); }
      else if (b.aux){ const dy = b.timer <= 3 ? -1 : 1; n = tile_step(b.room, b.cell, b.dir ? 1 : -1, dy); }
      else n = way_cell(b.room, b.cell, b.dir ? 0 : 3);
      const r2 = ws_room;
      if (n < 0 || solid(r2, n)){
        if (k === BK_FIREBALL){ const u = up_cell(b.room, b.cell), r3 = ws_room; if (u >= 0 && !solid(r3, u) && s === 0){ b.room = r3; b.cell = u; continue; } }
        b.alive = 0; return;
      }
      b.room = r2; b.cell = n;
      if (k === BK_FIREBALL){ thrown_hits(b); if (!b.alive) return; const dn = down_cell(b.room, b.cell), r3 = ws_room; if (dn >= 0 && !solid(r3, dn) && !stands(r3, dn) && s === cells - 1){ b.room = r3; b.cell = dn; } }
      else if (k === BK_HAMMER && b.aux === 1){ thrown_hits(b); if (!b.alive) return; }
      else if (r2 === room && n === cell){ beast_touch_you(b); if (b.alive) b.alive = 0; return; }
    }
    if (b.timer > (k === BK_BOOMERANG ? 9 : 10)) b.alive = 0;
    if (b.alive && RS[b.room].c[b.cell].ground === G_WATER && k === BK_FIREBALL) b.alive = 0;
    return; }
  case BK_GOOMBA: case BK_GREENKOOPA: case BK_REDKOOPA: case BK_BUZZY: case BK_SPINY: case BK_MICROGOOMBA:
    if (b.timer & 1) walker_go(b, 1);
    beast_fall(b); beast_touch_you(b); return;
  case BK_PARAGOOMBA: case BK_PARAGREEN: case BK_KURIBO: {
    const t = b.timer % 4;
    if (t === 1){ const u = up_cell(b.room, b.cell), r2 = ws_room; if (u >= 0 && !solid(r2, u) && !(r2 === room && u === cell)) beast_move(b, r2, u); }

/* the cannons of the level: a Bullet Bill from each one you are near, every few turns */
function cannons_turn(){
  if (turn % 5) return;
  for (let rr = area_first[area]; rr < area_first[area] + area_rooms(area); rr++){
    if (Math.abs(RS[rr].col - RS[room].col) > 1 || RS[rr].band !== RS[room].band) continue;
    for (let cc = 0; cc < BOARD_SIZE; cc++){
      if (RS[rr].c[cc].thing !== T_CANNON || !canonical(rr, cc)) continue;
      cell_tile(rr, cc); const x = ct_x, row = ct_row; cell_tile(room, cell); const mx = ct_x, mrow = ct_row;
      if (Math.abs(row - mrow) > 12 || Math.abs(x - mx) < 4) continue;
      const dir = mx > x ? 1 : 0;
      const n = way_cell(rr, cc, dir ? 0 : 3), r2 = ws_room;
      if (n < 0 || solid(r2, n) || being_at(r2, n)) continue;
      const b = spawn(BK_BULLET, r2, n);
      if (b){ b.dir = dir; sound_say("shot cannon"); }
    }
  }
}
function beasts_turn(){
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (!b.alive || dead || won || on_map) continue;
    if (RS[b.room].area !== area) continue;
    if (b.alive === 1 && Math.abs(RS[b.room].col - RS[room].col) > 2 && !(BEAST[b.kind].flags & (BF_PROJ | BF_BOSS | BF_PLATFORM)) && b.kind !== BK_LAKITU && b.kind !== BK_SUN) continue;   /* far off: they wait -- but a platform keeps to its round, or the one that follows 6-F1's path would never come back for you */
    beast_act(b);
  }
  if (!dead && !won && !on_map && AREA[area].tileset === 10) cannons_turn();
}

/* ── the boards' own doings ─────────────────────────────── */
let in_quick = 0;
let stood_r = -1, stood_c = -1;   /* where you stood at the last turn's end: a donut lift gives way under the second */
/* the P-switch's while is over: the coins are coins again and the bricks bricks */
function pswitch_off(){
  for (let rr = area_first[area]; rr < area_first[area] + area_rooms(area); rr++) for (let cc = 0; cc < BOARD_SIZE; cc++){
    const q = RS[rr].c[cc];
    if (!canonical(rr, cc)) continue;
    if (q.thing === T_COIN && q.inside === IN_WASBRICK){ q.thing = T_BRICK; q.inside = IN_NONE; sync_cell(rr, cc); }
    else if (q.thing === T_COIN && q.inside === IN_WASPCOIN){ q.thing = -1; q.inside = IN_NONE; sync_cell(rr, cc); }
    else if (q.thing === T_BRICK && q.inside === IN_WASCOIN){ q.thing = T_COIN; q.inside = IN_NONE; sync_cell(rr, cc); }
  }
  say("The P-switch's while is over.");
  sound_bed = "";
}
function room_tick(){

  if (RS[room].c[cell].ground === G_QUICK){ in_quick++; { const u = up_cell(room, cell), r2 = ws_room; if (u >= 0 && RS[r2].c[u].ground === G_QUICK && in_quick >= 2){ die("Under the quicksand"); return; } } } else in_quick = 0;

/* ── a page of text over everything ───────────────────────── */
function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){
      if (s[p + len] === ' ') last_space = len;
      len++;
    }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}

  for (let r = y; r < y + h; r++){ text(x, r, " ", 250, 240); text(x + w - 1, r, " ", 250, 240); }
  const lines = wrap_lines(body, w - 6, 64);

  for (let i = 0; i < lines.length && row < y + h - 2; i++, row++)
    text(x + 3, row, lines[i], i === 0 ? 223 : fg, 235);

function fb_hash(){
  let h = 2166136261 >>> 0;
  for (let row = 0; row < screen_h; row++)

      const at = FB(row, col);
      const ch = fb_ch[at] === FB_QUAD ? 1 : fb_ch[at];       /* the C's glyph slots are the code points here already */
      const q = fb_ch[at] === FB_QUAD ? (fb_q[at] & 15) : 0;
      const v = (fb_fg[at] | (fb_bg[at] << 8) | (q << 16) | (ch << 20)) >>> 0;

      h = Math.imul(h ^ (v >>> 24), 16777619) >>> 0;

    if (key === 'c' && dead){ continue_game(); return 1; }
    if (c === 113 || c === 27 || c === 3) return 0;

}
const MS_DR = [0, 0, 1, -1], MS_DC = [1, -1, 0, 0];
const MS_KEY = ['d', 'a', 'x', 'w'];
/* a Dijkstra over the stops: a move costs one, and an undone level or fortress passed through twenty more */
function map_search(pass_undone){
  for (let r = 0; r < 9; r++) for (let c = 0; c < 64; c++){ const i = MI(r, c); mdist[i] = 1 << 29; mfrom[i] = -1; mpr[i] = mpc[i] = -1; m_done[i] = 0; }
  mdist[MI(mrow, mcol)] = 0;
  for (;;){
    let r = -1, c = -1, best = 1 << 29;
    for (let rr = 0; rr < 9; rr++) for (let cc = 0; cc < 64; cc++){ const i = MI(rr, cc); if (!m_done[i] && mdist[i] < best){ best = mdist[i]; r = rr; c = cc; } }
    if (r < 0) break;
    m_done[MI(r, c)] = 1;
    if (!(r === mrow && c === mcol) && !map_stop_passable(r, c, pass_undone)) continue;
    const through = (!(r === mrow && c === mcol) && map_stop_is_undone(r, c)) ? 20 : 0;
    for (let d = 0; d < 4; d++){
      const r1 = r + MS_DR[d], c1 = c + MS_DC[d];
      if (!path_ok(map_tile(world, r1, c1), MS_DR[d] === 0)) continue;
      const r2 = r1 + MS_DR[d], c2 = c1 + MS_DC[d];
      if (r2 < 0 || r2 >= 9 || c2 < 0 || c2 >= 64) continue;
      if (mdist[MI(r2, c2)] <= mdist[MI(r, c)] + 1 + through) continue;
      mdist[MI(r2, c2)] = mdist[MI(r, c)] + 1 + through; mfrom[MI(r2, c2)] = d; mpr[MI(r2, c2)] = r; mpc[MI(r2, c2)] = c;
    }
    /* a pipe way: down one map pipe and up out of its partner */
    if (map_tile(world, r, c) === MT_PIPE){
      const n = node_at(world, r, c), p = n >= 0 ? pipe_partner(n) : -1;
      if (p >= 0){
        const r2 = MAPNODE[p].row, c2 = MAPNODE[p].col;
        if (r2 >= 0 && r2 < 9 && c2 >= 0 && c2 < 64 && mdist[MI(r2, c2)] > mdist[MI(r, c)] + 1 + through){
          mdist[MI(r2, c2)] = mdist[MI(r, c)] + 1 + through; mfrom[MI(r2, c2)] = 4; mpr[MI(r2, c2)] = r; mpc[MI(r2, c2)] = c;
        }
      }
    }
  }
}
function map_key(k){ return k === 4 ? 'g' : MS_KEY[k]; }
/* the first undone stop on the way back from a target: the level to do next */
let mfu_r = 0, mfu_c = 0;
function map_first_undone(tr, tc){
  let r = tr, c = tc;
  mfu_r = tr; mfu_c = tc;
  while (!(r === mrow && c === mcol)){
    if (mfrom[MI(r, c)] < 0 || mpr[MI(r, c)] < 0) return;
    if (map_stop_is_undone(r, c)){ mfu_r = r; mfu_c = c; }
    const r2 = mpr[MI(r, c)], c2 = mpc[MI(r, c)];
    r = r2; c = c2;
  }
}
function wmap_go(tr, tc){
  /* the keys back from the target to here, reversed */
  const keys = [];
  let r = tr, c = tc;
  while (!(r === mrow && c === mcol) && keys.length < 199){
    const k = mfrom[MI(r, c)];
    if (k < 0 || mpr[MI(r, c)] < 0) wfail("no way back from " + c + "," + r + " on the map");
    keys.push(map_key(k));
    const r2 = mpr[MI(r, c)], c2 = mpc[MI(r, c)];
    r = r2; c = c2;
  }
  for (let i = keys.length - 1; i >= 0; i--){ wsite = "map"; wk(keys[i]); if (!on_map || dead) return; }
}
/* the castle if it can be reached */
let mc_r = -1, mc_c = -1;
function map_castle(){
  for (let r = 0; r < 9; r++) for (let c = 0; c < map_w[world - 1]; c++){ const t = map_tile(world, r, c); if ((t === MT_CASTLE && !world_done[world]) || t === MT_BOWSERCASTLE){ mc_r = r; mc_c = c; return 1; } }
  return 0;
}
const WMAP_WANT = [IT_LEAF, IT_FLOWER, IT_TANOOKI, IT_HAMMER, IT_MUSHROOM];
function wmap(){
  let guard = 0;
  while (on_map && !won && guard++ < 400){
    walk_died = 0;
    let br = -1, bc = -1, bd;
    const have_castle = map_castle();
    const cr = mc_r, cc = mc_c;
    map_search(0);
    if (have_castle && mdist[MI(cr, cc)] < (1 << 29)){ br = cr; bc = cc; }
    if (br < 0){
      map_search(1);
      if (have_castle && mdist[MI(cr, cc)] < (1 << 29)){ map_first_undone(cr, cc); br = mfu_r; bc = mfu_c; }
    }
    if (br < 0){
      bd = 1 << 29;
      let fr = -1, fc = -1;
      for (let r = 0; r < 9; r++) for (let c = 0; c < map_w[world - 1]; c++){ const t = map_tile(world, r, c); if ((t === MT_FORT || t === MT_ALTFORT || t === MT_SPIRAL) && map_stop_is_undone(r, c) && mdist[MI(r, c)] < bd){ bd = mdist[MI(r, c)]; fr = r; fc = c; } }
      if (fr >= 0){ map_first_undone(fr, fc); br = mfu_r; bc = mfu_c; }
    }
    if (br < 0){
      bd = 1 << 29;
      for (let r = 0; r < 9; r++) for (let c = 0; c < map_w[world - 1]; c++) if (map_stop_is_undone(r, c) && mdist[MI(r, c)] < bd){ bd = mdist[MI(r, c)]; br = r; bc = c; }
    }
    if (br < 0) wfail("nowhere to go on the map of world " + world);
    /* the way to it, with the undone stops as walls again but the target itself */
    map_search(0);
    if (mdist[MI(br, bc)] >= (1 << 29)){ map_search(1); map_first_undone(br, bc); br = mfu_r; bc = mfu_c; map_search(0); }
    if (mdist[MI(br, bc)] >= (1 << 29)) wfail("no way to " + bc + "," + br + " on the map of world " + world);
    wstage("World " + world + ": " + map_tile_name(map_tile(world, br, bc), node_at(world, br, bc)) + " at " + bc + "," + br);
    wmap_go(br, bc);
    if (!on_map){ wlevel(); continue; }
    if (mrow !== br || mcol !== bc) continue;
    /* small, with something in the box: bigger first */
    if (suit === S_SMALL && box_n > 0){
      let pick = -1;
      for (let w = 0; w < WMAP_WANT.length && pick < 0; w++) for (let i = 0; i < box_n && pick < 0; i++) if (box[i] === WMAP_WANT[w]) pick = i;
      if (pick >= 0){ wsite = "box"; wk('i'); wk(String.fromCharCode(97 + pick)); }
    }
    wsite = "enter"; wk('g');
    if (!on_map) wlevel();
    else if (show_spade){ while (show_spade){ wk('g'); } }
  }
}
function check_walk(seedText, trace){
  walk_out = [];
  walk_trace = trace ? 1 : 0;
  walk_keys = 0; walk_keystring = [];
  walk_died = 0; cost_gen = 1; wtakeoff = 0; wsoft = 0; wplan_gave_up = 0;
  refuse_r = -1; refuse_c = -1; refuse_n = 0;
  reset_statics();
  start_game(seedText, 1);
  show_intro = 0;
  walk_seen[0] = walk_seen[1] = "";
  try {
    for (let w = 0; w < 40 && !won; w++){
      if (on_map) wmap();
      else wlevel();
    }
    wexpect(won, "Bowser beaten");
    walk_out.push("");
    walk_out.push("WALK OK: " + walk_keys + " keys, " + turn + " turns, " + deaths + " lives lost, score " + score + "; the Princess is free");
    if (walk_trace) walk_out.push("keys " + walk_keystring.slice(0, Math.min(walk_keys, WALK_KEYSTRING_MAX - 1)).join(""));
  } catch (e) {
    if (!(e instanceof WalkFail)) throw e;
    walk_out.push("keys " + walk_keys + "  deaths " + deaths);
    if (walk_trace) walk_out.push("keys " + walk_keystring.slice(0, Math.min(walk_keys, WALK_KEYSTRING_MAX - 1)).join(""));
  }
  return walk_out;
}

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same 2A03 and played
 * as a buffer; the tune loops until the next one. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the tune's intro once, then its loop */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("mushroomworld.sav"),
  set: (s) => localStorage.setItem("mushroomworld.sav", s),
};
start_game(params.get("seed"));
if (SOUND.on) SOUND.command("bed title");
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left the Mushroom World.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: the six ways are d x z a w e as in
 * mushroomworld.c; the arrows are left and right, and up and down the
 * way you face; Escape is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return facing ? 'e' : 'w';
  if (e.key === "ArrowDown") return facing ? 'x' : 'z';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
