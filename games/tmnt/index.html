const STORY = ["New York.  The Foot Clan has taken April O'Neil.\n\n\"My sons,\" says Splinter, \"the Shredder has her, and he has something else: the Life Transformer Gun.  It can make me a man again, and he will not use it for that.  Go and get her back.\"\n\nBebop and Rocksteady were seen going down a manhole on the block.  Take the sewers.  Watch the streets: there are steam rollers, and a steam roller does not care what your bar says.","Rocksteady goes down, and stays down, and you untie April.\n\n\"There's no time,\" she says.  \"Shredder's planted bombs at the Hudson River dam.  Eight of them.  If they go, half the city goes with them.\"\n\nThe dam is up the river.  The only way to the water is in through the door, up through the works, and off the top.","The last bomb stops ticking with seconds to spare, and April, on the radio, says something you will not repeat to Splinter.\n\nYou come home to rest.  The lair has been torn apart.  The television switches itself on, and it is Shredder: \"I have your rat, turtles.  Come and get him, if you can find him.\"\n\nThe Party Wagon is outside.  The Foot have put roadblocks across the streets, and the van's missiles are in a building on the north side.","Mecha Turtle comes apart on the roof, and Splinter comes down off the pole, and a helicopter goes up off the far end of the building with Shredder in it.\n\n\"He is going to the airport,\" says Splinter.  \"The blimp.  Get to the blimp.\"\n\nThe Turtle Blimp is at JFK, in a bunker, under guard.  The airport is fenced into patches, and the only way from one to the next is under it.","The mouser's orb goes dark and the mouser with it, and behind it, in the bunker, the blimp.\n\nYou lift off as the sun goes down, and fly south, over the city, to the Bronx.  Below you, in the dark, the Foot's base, and under it, somewhere, the Technodrome.  There are three tunnels.  It is at the end of one of them.","The eye goes out, and the Technodrome stops, and a hatch in its side hangs open.\n\nInside.  Nothing you take in here comes back.  Shredder is in the control room at the far end, and the Technodrome and the Foot Clan have everything they have between you and it.","Shredder goes down for the last time, and the Life Transformer Gun skids across the floor of the control room to your feet.\n\nYou take it home.  Splinter stands in front of it, and you fire it, and when the light goes, Hamato Yoshi is standing in the lair, and he is crying, and so are you, and April has brought a pizza.\n\nTHE END","The Foot have all four of you now.\n\nSomewhere in the Technodrome, four cages.  Shredder has the Life Transformer Gun, and Splinter, and all the time in the world."];
const KEYS_TEXT = "KEYS\n\nw e   a d   z x    move, one cell, in the six directions; into a thing to fight it; into a crate to climb it\n.                  wait a turn\n1 2 3 4            be Leonardo, Raphael, Michelangelo, Donatello.  It costs no turn.\nf                  fire your sub-weapon in a direction (in the van: a missile)\nt                  in the van: the gun, in a direction\nj                  jump, in a direction, over one cell: a gap, a fire, spikes, water\nc                  a closer look: what is alive here, what grows, what was made.  c again turns the page.\ni                  the team: the four bars and what each is carrying\nT                  the board's skin: fine, hex, brick\nS  L               save, load\n?                  this\nq                  leave\n\nStepping on a pizza eats it, on a weapon takes it, on a bomb stops it, on a cage opens it, on a way takes it.  A ladder, a manhole, a door, a hatch, a hole in the floor: walk onto it.  The van: walk into it to drive, drive onto a door to get out and go in.  A gap between roofs: walk at it with a rope.\n\nThe bar is eight squares.  A slice is two, a half four, a whole all of them.  At nothing you are captured, not dead, and the next turtle takes over; from the third area a captured brother can be found and freed, once an area.  The rollers, the fire, the coral, the crusher and Shredder's gun do not look at the bar.";

}

/* ── the city, built ──────────────────────────────────────── */
function new_cell(){ return {ground: 0, thing: -1, ch: ' '}; }
const RS = [];
for (let r = 0; r < R_N; r++){
  const c = [];
  for (let i = 0; i < BOARD_SIZE; i++) c.push(new_cell());
  RS.push({c: c, seen: 0, crush: 0, guard: -1});
}
function is_item_char(ch){ return "phzsybkrmi!".indexOf(ch) >= 0; }
function thing_of_char(r, ch){
  const d = ROOM[r];
  for (const l of d.legend) if (l.ch === ch) return l.thing;
  switch (ch){
  case 'p': return T_PIZZA_SLICE; case 'h': return T_PIZZA_HALF; case 'z': return T_PIZZA_WHOLE;
  case 's': return T_SHURIKEN; case 'y': return T_TRIPLE; case 'b': return T_BOOMERANG;
  case 'k': return T_SCROLL; case 'r': return T_ROPE; case 'm': return T_MISSILES;
  case 'i': return T_INVINCIBLE; case '!': return T_BOMB;
  case 'o': return T_BOX; case 'x': return T_BLOCK; case '=': return T_LEDGE; case 'g': return T_GIRDER;
  case 'w': return T_SEAWEED; case 'c': return T_CORAL; case '&': return T_CAGE; case '*': return T_MAGNET;
  case 't': return T_TREE; case 'q': return T_CAR; case 'n': return T_HYDRANT; case '$': return T_LAMP;
  case 'v': return T_VAN; case '+': return T_ROADBLOCK; case '|': return T_FENCE;
  default: return -1;
  }
}
function way_at(r, c){
  const ch = RS[r].c[c].ch;
  for (const w of ROOM[r].ways) if (w.ch === ch) return w;
  return null;
}
function cell_of_char(r, ch){
  for (let i = 0; i < BOARD_SIZE; i++) if (RS[r].c[i].ch === ch) return i;
  return -1;
}
function way_ground(w, r){
  const d = ROOM[r];
  if (w.lock === LK_DROP) return G_DROP;
  if (w.lock === LK_ARRIVE) return d.floor;
  if (w.lock === LK_DIVE) return G_DIVE;
  if (d.kind === RK_WATER) return d.floor;
  if (w.word.indexOf("manhole") >= 0 || w.word.indexOf("underpass") >= 0) return G_MANHOLE;
  if (w.word.indexOf("hatch") >= 0) return G_HATCH;
  if (w.word.indexOf("ladder") >= 0 || w.word.indexOf("stairs") >= 0) return G_LADDER;
  return G_DOOR;
}
function build_room(r){
  const d = ROOM[r];
  let i = 0;
  const over = d.kind === RK_OVER;
  RS[r].seen = 0; RS[r].crush = 0; RS[r].guard = -1;
  for (let row = 0; row < 9; row++)
    for (const ch of d.rows[row]){
      if (ch === ' ') continue;
      if (i >= BOARD_SIZE) break;
      const c = RS[r].c[i];
      c.ground = d.floor; c.thing = -1; c.ch = ch;
      switch (ch){
      case '#': c.thing = over ? T_BUILDING : T_WALL; break;
      case '.': break;
      case '_': c.ground = G_VOID; break;
      case '~': c.ground = over ? G_BRIDGE : G_WATER; break;
      case ',': c.ground = G_SIDEWALK; break;
      case '"': c.ground = G_GRASS; break;
      case '@': c.ground = G_DAMTOP; break;
      case '>': c.ground = G_BELT_E; break;
      case '<': c.ground = G_BELT_W; break;
      case '^': c.ground = G_SPIKES; break;
      case '%': c.ground = G_FIRE; break;
      case ':': c.ground = G_HOLE; break;
      case '/': c.ground = G_ROOFGAP; break;
      case 'e': c.ground = G_CURRENT; break;
      default: {
        const t = thing_of_char(r, ch);
        let w = null;
        for (const k of d.ways) if (k.ch === ch) w = k;
        if (t >= 0) c.thing = t;
        else if (w) c.ground = way_ground(w, r);
        else if (ch >= '1' && ch <= '9') { }
        else c.thing = over ? T_BUILDING : T_WALL;
        break; }
      }
      i++;
    }
}
function restock_room(r){
  for (let i = 0; i < BOARD_SIZE; i++){
    const c = RS[r].c[i];
    if (is_item_char(c.ch) && c.ch !== '!') c.thing = thing_of_char(r, c.ch);
    if (c.ch === 'x' && c.thing < 0 && ROOM[r].area !== A_BRONX) c.thing = T_BLOCK;
  }
}

/* ── the turtles ──────────────────────────────────────────── */
const MAXHP = 16, AMMO_MAX = 99;
const TS = [];
for (let t = 0; t < TU_N; t++) TS.push({hp: MAXHP, captured: 0, sub: -1, ammo: 0});
let who = TU_LEO;
let ropes = 0, missiles = 0, invincible = 0, in_van = 0;
let room = R_O1, cell = 26, area = A_STREETS;
let entry_room = -1, entry_cell = -1;
let turn = 0;
let clock_s = 9 * 3600 + 30 * 60;
let day = 0;
let dead = 0, won = 0;
let dead_how = "";
let dam_t = 0, bombs = 0;
let techno_tunnel = 0;
const FLAGS = ["bebop_dead","rocksteady_gone","april_freed","splinter_freed","mecha_gold","eye_dead",
  "shredder_in","mouser_state","spot_t","boomerang_t","in_water","blimp","spot_cool"];
const F = {};
function clear_flags(){ for (const k of FLAGS) F[k] = 0; F.area_done = [0,0,0,0,0,0]; F.rescued = [0,0,0,0,0,0]; }
clear_flags();
const message = ["", ""];
function say(s){ message[1] = message[0]; message[0] = s.slice(0, 159); }
function cap_msg(){ if (message[0].length && message[0][0] >= 'a' && message[0][0] <= 'z') message[0] = message[0][0].toUpperCase() + message[0].slice(1); }
function party_left(){ let n = 0; for (let t = 0; t < TU_N; t++) if (!TS[t].captured) n++; return n; }

/* ── the clock ── */
function pad2(n){ return (n < 10 ? "0" : "") + n; }
function clock_text(){
  const s = clock_s % 86400;
  return DAYS[day % 7] + " " + pad2(Math.trunc(s / 3600)) + ":" + pad2(Math.trunc(s / 60) % 60);
}

/* ── the ground under you, and what may stand where ── */
const beings = [];
let being_n = 0;
function being_at(r, c){
  for (let i = 0; i < being_n; i++)
    if (beings[i].alive && beings[i].room === r && beings[i].cell === c) return beings[i];
  return null;
}
function passable(r, c, for_beast, kind){
  if (c < 0) return 0;
  const k = RS[r].c[c];
  if (k.ground === G_VOID) return 0;
  if (k.thing >= 0 && !(THING[k.thing].flags & TF_PASS)) return 0;
  if (for_beast){
    const f = BEAST[kind].flags;
    if ((k.ground === G_HOLE || k.ground === G_ROOFGAP || k.ground === G_DROP) && !(f & BF_FLIES)) return 0;
    if ((k.ground === G_WATER || k.ground === G_FIRE) && !(f & BF_FLIES)) return 0;
    if (k.ground === G_RIVER && !(f & (BF_FLIES | BF_SWIMS | BF_ORBIT))) return 0;
    if (kind === BK_ROLLER && k.ground !== G_STREET) return 0;
    if (ROOM[r].kind === RK_OVER && !(f & BF_FLIES) && kind !== BK_ROLLER && k.ground !== G_STREET && k.ground !== G_SIDEWALK && k.ground !== G_RUNWAY && k.ground !== G_GRASS) return 0;
    if (k.ground === G_DOOR || k.ground === G_LADDER || k.ground === G_MANHOLE || k.ground === G_HATCH) return 0;
    if (k.thing === T_BOX && !(f & BF_FLIES)) return 0;
  }
  return 1;
}
function room_dark(r){ return ROOM[r].dark; }
function lit_by_plane(c){
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (b.alive && b.kind === BK_SPOTTER && b.room === room && hex_dist(b.cell, c) <= 1) return 1;
  }
  return 0;
}
function visible(c){
  if (!room_dark(room)) return 1;
  return hex_dist(c, cell) <= 1 || lit_by_plane(c);
}

/* ── the game ─────────────────────────────────────────────── */
let show_keys = 0, show_team = 0, show_look = 0, ask_dir = 0, show_intro = 0;
let last_cell = -1;
let taken = 0;
const BEING_MAX = 400;
function spawn(kind, r, c){
  if (being_n >= BEING_MAX) return null;
  const b = {kind: kind, room: r, cell: c, home: c, alive: 1, state: 0, hp: BEAST[kind].hp, timer: 0, cool: 0, dir: 0};
  beings[being_n++] = b;
  b.dir = roll(0, 5);

}
function spawn_room(r){
  const d = ROOM[r];
  for (let i = 0; i < BOARD_SIZE; i++){
    const ch = RS[r].c[i].ch;
    if (ch < '1' || ch > '9') continue;
    for (const l of d.legend) if (l.ch === ch && l.beast >= 0) spawn(l.beast, r, i);
  }
}
function spawn_streets(){
  const O1_ROLL = [28, 13], O1_FOOT = [8, 40, 52];
  const O3_ROLL = [19, 37], O3_FOOT = [9, 22, 45, 53];
  const O4_BOMB = [15, 31, 50], O4E_BOMB = [20, 41];

  for (let i = 0; i < 2; i++) spawn(BK_ROLLER, R_O1, O1_ROLL[i]);
  for (let i = 0; i < 3; i++) spawn(BK_FOOT, R_O1, O1_FOOT[i]);
  for (let i = 0; i < 2; i++) spawn(BK_ROLLER, R_O3, O3_ROLL[i]);
  for (let i = 0; i < 4; i++) spawn(BK_FOOT, R_O3, O3_FOOT[i]);
  for (let i = 0; i < 3; i++) spawn(BK_BOMBER, R_O4W, O4_BOMB[i]);
  for (let i = 0; i < 2; i++) spawn(BK_BOMBER, R_O4E, O4E_BOMB[i]);
  for (let i = 0; i < 3; i++) spawn(BK_SPOTTER, R_O5, O5_SPOT[i]);
}
function init_world(){
  being_n = 0; beings.length = 0;
  clear_flags();
  for (let t = 0; t < TU_N; t++){ TS[t].hp = MAXHP; TS[t].captured = 0; TS[t].sub = -1; TS[t].ammo = 0; }
  who = TU_LEO; ropes = 0; missiles = 0; invincible = 0; in_van = 0;
  dam_t = 0; bombs = 0;
  room = R_O1; cell = 26; area = A_STREETS; turn = 0; dead = 0; won = 0;
  clock_s = 9 * 3600 + 30 * 60; day = 0;
  entry_room = -1; entry_cell = -1; last_cell = -1;
  message[0] = ""; message[1] = "";
  show_story = 0;
  { const T = [R_5C2, R_5D1, R_5E2];
    techno_tunnel = T[bst_pick("the Technodrome", "tunnel", 3)]; }
  for (let r = 0; r < R_N; r++) build_room(r);
  for (let r = 0; r < R_N; r++) if (ROOM[r].kind !== RK_OVER) spawn_room(r);
  spawn_streets();
  room_enter(-1, -1);
}

/* ── going through a way ── */
function room_boss_alive(r){
  for (let i = 0; i < being_n; i++)
    if (beings[i].alive && beings[i].room === r && (BEAST[beings[i].kind].flags & BF_BOSS)) return 1;
  return 0;
}
function put_van(r, c){ RS[r].c[c].thing = T_VAN; }
function take_way(w){
  const from = room, from_cell = cell;
  if (w.lock === LK_ARRIVE) return;
  if (w.lock === LK_BOSS && room_boss_alive(room)){ say("The way on is shut until this is settled."); return; }
  if (w.lock === LK_TECHNO && room !== techno_tunnel){ say("The door opens on a blank wall.  The Technodrome is not down this tunnel."); return; }
  let to = w.to;
  if (room === R_5TD) to = techno_tunnel;
  if (in_van){ in_van = 0; put_van(room, last_cell >= 0 && last_cell !== cell ? last_cell : cell); }
  if (w.lock === LK_DROP) say("You drop through the hole in the floor.");
  else if (w.lock === LK_DIVE) say("You go over the railing and into the river.");
  room = to;
  cell = cell_of_char(room, w.to_ch);
  if (cell < 0) cell = 30;
  room_enter(from, from_cell);
}
function restock_building(b){
  if (area === A_TECHNODROME || b === 0) return;
  for (let r = 0; r < R_N; r++){
    if (ROOM[r].building !== b) continue;
    restock_room(r);
    for (let i = 0; i < being_n; i++){
      const k = beings[i];
      if (k.room !== r || k.alive) continue;
      if (BEAST[k.kind].flags & BF_BOSS) continue;
      if (k.kind === BK_MECHAGOLD || k.kind === BK_BUBBLE) continue;
      if (k.home < 0) continue;
      k.alive = 1; k.hp = BEAST[k.kind].hp; k.cell = k.home; k.state = 0; k.timer = 0; k.cool = 0;
    }
  }
}
function room_enter(from, from_cell){
  const d = ROOM[room];
  if (from >= 0 && ROOM[from].kind === RK_OVER && d.kind !== RK_OVER){
    restock_building(d.building);
    entry_room = from; entry_cell = from_cell;
  }
  if (from >= 0 && ROOM[from].kind === RK_OVER && d.kind === RK_OVER){ entry_room = from; entry_cell = from_cell; }
  if (!RS[room].seen){ RS[room].seen = 1; say(d.blurb); }
  else say(d.name + ".");
  cap_msg();
  if (d.kind === RK_WATER && dam_t === 0){ dam_t = 140; F.in_water = 1; say("Two minutes twenty.  Eight bombs.  April is counting on the radio."); }
  if (d.kind !== RK_WATER){ dam_t = 0; F.in_water = 0; }
  if (room === R_6SHRED && !F.shredder_in){
    F.shredder_in = 1;
    say("Lightning across the control room, and out of it, on the far platform, Shredder.");
  }
  sound_scene();
  sound_beasts();
}

/* ── the bar ── */
function switch_to_next(){
  for (let k = 1; k <= TU_N; k++){
    const t = (who + k) % TU_N;
    if (!TS[t].captured){ who = t; return; }
  }
}
function game_over(how){
  if (dead) return;
  dead = 1;
  dead_how = how;
  sound_say("jingle over");
  sound_say("bed off"); sound_bed = "";
}
function capture(how){
  if (dead) return;
  taken = 1;
  sound_say("jingle capture");
  TS[who].captured = 1; TS[who].hp = 0;
  invincible = 0;
  if (party_left() === 0){
    game_over(how + "  " + TURTLE[who].name + " is taken, and he was the last.");
    return;
  }
  const was = who;
  switch_to_next();
  say(how + "  The Foot take " + TURTLE[was].name + ".  " + TURTLE[who].name + " steps in.");
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (!b.alive || b.room !== room || !(BEAST[b.kind].flags & BF_TOUCH) || hex_dist(b.cell, cell) > 1) continue;
    let best = -1, bd = -1;
    for (let c = 0; c < BOARD_SIZE; c++){
      if (hex_dist(c, cell) > 2 || !passable(room, c, 0, 0) || being_at(room, c) || way_at(room, c)) continue;
      const k = RS[room].c[c];
      if (k.ground === G_HOLE || k.ground === G_WATER || k.ground === G_FIRE || k.ground === G_ROOFGAP || k.ground === G_SPIKES) continue;
      const dd = hex_dist(c, b.cell);
      if (dd > bd){ bd = dd; best = c; }
    }
    if (best >= 0) cell = best;
    break;
  }
  if (ROOM[room].kind === RK_WATER){
    room = R_O2; cell = cell_of_char(R_O2, 'B'); dam_t = 0; F.in_water = 0;
    say(TURTLE[who].name + " goes in from the top of the dam, with the clock full again and " + (8 - bombs) + " bomb" + (8 - bombs === 1 ? "" : "s") + " still to find.");
    sound_scene();
  }
}
function hurt(dmg, how){
  if (dmg <= 0 || dead) return;
  if (invincible) return;
  TS[who].hp -= dmg;
  if (TS[who].hp <= 0) capture(how);
}
function heal(n){
  TS[who].hp += n;
  if (TS[who].hp > MAXHP) TS[who].hp = MAXHP;
}

/* ── the turn's end ── */
function end_turn(){
  if (dead || won) return;
  clock_s += ROOM[room].kind === RK_OVER ? 10 : 1;
  if (invincible > 0 && --invincible === 0) say("The invincibility wears off.");
  beasts_turn();
  room_tick();
  sound_scene();
}

/* ── a step ── */
function on_high(){ const t = RS[room].c[cell].thing; return t >= 0 && (THING[t].flags & TF_HIGH) ? 1 : 0; }
function take_item(c){
  const k = RS[room].c[c];
  const t = k.thing;
  if (t < 0 || !(THING[t].flags & TF_TAKE)) return;
  switch (t){
  case T_PIZZA_SLICE: heal(4); say("A slice of pizza.  Two squares back."); sound_say("jingle pizza"); break;
  case T_PIZZA_HALF: heal(8); say("Half a pizza.  Four squares back."); sound_say("jingle pizza"); break;
  case T_PIZZA_WHOLE: heal(MAXHP); say("A whole pizza.  The bar is full."); sound_say("jingle pizza"); break;
  case T_SHURIKEN: case T_TRIPLE: case T_SCROLL:
    if (TS[who].sub === t){ TS[who].ammo += 20; if (TS[who].ammo > AMMO_MAX) TS[who].ammo = AMMO_MAX; }
    else { TS[who].sub = t; TS[who].ammo = 20; }
    say(TURTLE[who].name + " takes " + THING[t].name + ": " + TS[who].ammo + "."); break;
  case T_BOOMERANG:
    TS[who].sub = T_BOOMERANG; TS[who].ammo = 1;
    say(TURTLE[who].name + " takes the boomerang.  It comes back to the hand, so there is only ever the one."); break;
  case T_ROPE: ropes += 3; say("Three ropes.  " + ropes + " now."); break;
  case T_MISSILES: missiles += 10; say("Ten missiles for the van.  " + missiles + " now."); break;
  case T_INVINCIBLE: invincible = 30; say("The icon spins and goes into you.  For thirty turns nothing can touch you."); sound_say("jingle rescue"); break;
  case T_BOMB:
    bombs++;
    sound_say("jingle bomb");
    if (bombs >= 8) say("The eighth bomb stops.  \"That's all of them!\" says April.");
    else say("The bomb stops ticking.  \"" + (8 - bombs) + " to go,\" says April.");
    break;
  default: break;
  }
  k.thing = -1;
  if (t === T_BOOMERANG && room === R_5B2) F.boomerang_t = 5;
}
function arrive(c){
  const k = RS[room].c[c];
  const prev = cell;
  last_cell = cell;
  cell = c;
  sound_step(c);
  if (k.thing === T_CAGE){
    let freed = -1;
    for (let t = 0; t < TU_N; t++) if (TS[t].captured && freed < 0) freed = t;
    if (freed < 0) say("The cage is empty.");
    else if (F.rescued[area]) say("The cage is locked, and the Foot have taken the key.  One rescue an area.");
    else {
      TS[freed].captured = 0; TS[freed].hp = MAXHP; F.rescued[area] = 1;
      sound_say("jingle rescue");
      say(TURTLE[freed].name + " is in the cage.  You break it open and he is back, and his bar is full.");
    }
  }
  if (k.thing >= 0 && (THING[k.thing].flags & TF_TAKE)) take_item(c);
  if (k.ground === G_FIRE){ capture("The fire takes you."); return; }
  if (k.ground === G_SPIKES){ hurt(2, "You go down on the spikes."); if (!taken) say("Spikes.  They drain you."); }
  if (k.ground === G_CURRENT && (Math.trunc(turn / 3) & 1) === 0){ hurt(3, "The current goes through you and you stop swimming."); say("The current is live, and it goes through you."); }
  if (k.thing === T_SEAWEED){ hurt(2, "The seaweed has you."); say("The seaweed burns."); }
  if (k.ground === G_WATER){
    hurt(2, "The water takes you.");
    if (!dead && !taken){
      say("Into the water, and the water takes you back to the door.");
      if (entry_room === room || entry_room < 0) cell = prev;
      else { const c2 = cell_of_char(room, 'U'); cell = c2 >= 0 ? c2 : prev; }
    }
    return;
  }
  if (dead || taken) return;
  const w = way_at(room, c);
  if (w) take_way(w);
}
function move_dir(d){
  const c = step_cell(cell, d);
  if (c < 0){ say("The edge of the board."); return; }
  const k = RS[room].c[c];
  let b = being_at(room, c);
  if (b && (BEAST[b.kind].flags & BF_FLIES) && (BEAST[b.kind].flags & BF_IMMUNE)) b = null;
  if (b){
    if (in_van){
      if (b.kind === BK_ROLLER){ hurt(2, "The roller rides up over the van."); say("The roller and the van meet, and the van comes off worse."); turn++; end_turn(); return; }
      b.alive = 0; say("The van runs over " + BEAST[b.kind].name + "."); sound_say("blow hit"); turn++; end_turn(); return;
    }
    if (b.kind === BK_ROLLER){ capture("You walk under the roller."); return; }
    if (invincible && !(BEAST[b.kind].flags & BF_IMMUNE) && !(BEAST[b.kind].flags & BF_GATE)){
      b.alive = 0; say("You go through " + BEAST[b.kind].name + " like a cannonball."); sound_say("blow hit"); turn++; end_turn(); return;
    }
    player_attack(b); end_turn(); return;
  }
  if (!in_van && TURTLE[who].reach === 2 && passable(room, c, 0, 0) && k.ground !== G_HOLE && k.ground !== G_ROOFGAP){
    const c2 = step_cell(c, d);
    const b2 = c2 >= 0 ? being_at(room, c2) : null;
    if (b2 && b2.kind !== BK_ROLLER && !(BEAST[b2.kind].flags & BF_IMMUNE)){ player_attack(b2); end_turn(); return; }
  }
  const t = k.thing;
  if (t === T_VAN){
    in_van = 1; k.thing = -1; say("You get into the Party Wagon.  The gun is t and the missiles are f.");
    cell = c; turn++; sound_say("call the Party Wagon"); end_turn(); return;
  }
  if (in_van && k.ground !== G_STREET && !way_at(room, c)){
    if (!passable(room, c, 0, 0)){ say("The van will not go there."); return; }
    in_van = 0; put_van(room, cell); say("You get out of the van.");
  }
  if (t === T_BLOCK){ k.thing = -1; sound_say("blow " + TURTLE[who].weapon); say("The block breaks."); turn++; end_turn(); return; }
  if (t === T_ROADBLOCK){ say(in_van ? "A roadblock.  A missile, f, in its direction." : "A roadblock across the whole street.  The van's missiles are for this."); return; }
  if (t === T_CORAL){ hurt(4, "The coral has you."); say("You brush the coral, and it is not coral."); turn++; end_turn(); return; }
  if (k.ground === G_HOLE){ say("A gap.  j, and a direction, jumps it."); return; }

function hit_being(b, dmg, withw){

function line_first(d, range){

}

function van_gun(d){

/* ── the beasts' turn ── */
function in_line(from, to){
  for (let d = 0; d < 6; d++){
    let c = from;
    for (let i = 0; i < 8; i++){
      c = step_cell(c, d);
      if (c < 0) break;
      if (c === to) return [i + 1, d];
      const k = RS[room].c[c];
      if (k.thing >= 0 && !(THING[k.thing].flags & TF_PASS)) break;
      if (being_at(room, c)) break;
    }
  }
  return [0, -1];
}
function knock_back(b){
  const d = dir_toward(b.cell, cell);
  const c = d >= 0 ? step_cell(cell, d) : -1;
  if (c < 0 || being_at(room, c)) return;
  const k = RS[room].c[c];
  if (k.ground === G_WATER || (passable(room, c, 0, 0) && k.ground !== G_HOLE && k.ground !== G_ROOFGAP && k.ground !== G_DROP && !way_at(room, c))){
    say("The blow knocks you back.");
    arrive(c);
  }
}
function beast_attack(b){
  const K = BEAST[b.kind];
  if (K.flags & BF_TOUCH){
    if (in_van){ hurt(2, "The roller comes through the van."); say("The roller hits the van."); return; }
    capture("The roller comes over you.");
    return;
  }
  if (on_high() && !(K.flags & BF_FLIES) && !(K.flags & BF_REACH2)){ say(K.name + " cannot reach you on the crates."); cap_msg(); return; }
  if (in_van){ say(K.name + " beats on the van and the van does not mind."); cap_msg(); return; }
  if (invincible){ say(K.name + " " + K.verb + " you and bounces off."); cap_msg(); return; }
  const guard = 13;
  const r = roll(1, 20) + K.hit;
  if (r < guard){ say(K.name + " " + K.verb + " at you and misses."); cap_msg(); return; }
  const dmg = roll(K.lo, K.hi);
  sound_say("call " + K.name);
  let how = K.name + " " + K.verb + " you once more, and that is enough.";
  how = how[0].toUpperCase() + how.slice(1);
  say(K.name + " " + K.verb + " you.  " + dmg + ".");
  cap_msg();
  hurt(dmg, how);
  if (!dead && !taken && (K.flags & BF_KNOCK) && roll(1, 3) === 1) knock_back(b);
}
function beast_shoot(b, dist){
  const K = BEAST[b.kind];
  if (b.kind === BK_SHREDDER){
    if (b.state === 0){ b.state = 1; say("Shredder raises the gun."); return; }
    b.state = 0; b.cool = 6;
    sound_say("shot laser");
    if (roll(1, 20) + 4 >= 13 && !invincible){ capture("The Life Transformer Gun.  The light goes, and where you were there is an ordinary turtle, and the Foot pick it up."); return; }
    say("The gun's light goes past you.");
    return;
  }
  sound_say("shot " + (b.kind === BK_ROCKSTEADY ? "gun" : (b.kind === BK_JETPACK || b.kind === BK_TD_TURRET || b.kind === BK_CANNON) ? "laser" : b.kind === BK_MECHAGOLD ? "missile" : "shuriken"));
  if (on_high() && !(K.flags & BF_FLIES) && b.kind !== BK_ROCKSTEADY) return;
  if (invincible) return;
  if (roll(1, 20) + K.hit - (dist > 2 ? 2 : 0) < 13){ say(K.name + " fires and misses."); cap_msg(); return; }
  let how = K.name + " fires once more, and that is enough.";
  how = how[0].toUpperCase() + how.slice(1);
  say(K.name + " fires and hits.  " + K.shot + ".");
  cap_msg();
  hurt(K.shot, how);
}
function beast_move_toward(b, target){
  let best = -1, bd = hex_dist(b.cell, target);
  for (let d = 0; d < 6; d++){
    const c = step_cell(b.cell, d);
    if (c < 0 || c === cell) continue;
    if (!passable(b.room, c, 1, b.kind) || being_at(b.room, c)) continue;
    const dd = hex_dist(c, target);
    if (dd < bd){ bd = dd; best = c; }
  }
  if (best >= 0) b.cell = best;
}
function beast_straight(b){
  const K = BEAST[b.kind];
  const c = step_cell(b.cell, b.dir);
  if (c === cell && (K.flags & BF_FLIES) && (K.flags & (BF_DROP | BF_IMMUNE))){
    const over = step_cell(c, b.dir);
    if (over >= 0 && !being_at(b.room, over)) b.cell = over;
    return;
  }
  if (c === cell){ beast_attack(b); return; }
  if (c >= 0 && passable(b.room, c, 1, b.kind) && !being_at(b.room, c)){ b.cell = c; return; }
  if (b.kind === BK_BUBBLE){ b.alive = 0; return; }
  if ((K.flags & BF_FLIES) && (K.flags & BF_IMMUNE)){
    let back = b.cell;
    for (let i = 0; i < 9; i++){ const n = step_cell(back, (b.dir + 3) % 6); if (n < 0) break; back = n; }
    if (back !== cell && !being_at(b.room, back)) b.cell = back;
    return;
  }
  for (let t = 0; t < 6; t++){
    const nd = roll(0, 5);
    const n = step_cell(b.cell, nd);
    if (n >= 0 && n !== cell && passable(b.room, n, 1, b.kind) && !being_at(b.room, n)){ b.dir = nd; b.cell = n; return; }
  }
  b.dir = (b.dir + 3) % 6;
}
function spawn_near(kind, c, how){
  for (let d = 0; d < 6; d++){
    const n = step_cell(c, (d + roll(0, 5)) % 6);
    if (n >= 0 && n !== cell && passable(room, n, 1, kind) && !being_at(room, n)){
      const u = spawn(kind, room, n);
      if (u){ u.home = -1; say(how); }
      return;
    }
  }
}
function foot_count(){
  let n = 0;
  for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].room === room && (beings[i].kind === BK_FOOT || beings[i].kind === BK_MOUSER)) n++;
  return n;
}
function beast_act(b){
  const K = BEAST[b.kind];
  const dist = hex_dist(b.cell, cell);
  const reach = (K.flags & BF_REACH2) ? 2 : 1;
  if (b.cool > 0) b.cool--;
  if (b.timer > 0){ b.timer--; if (K.flags & BF_STUN) return; }
  if (K.flags & BF_ORBIT){
    let next = -1;
    for (let t = 0; t < 6 && next < 0; t++){ b.state = (b.state + 1) % 6; next = step_cell(b.home, b.state); }
    if (next === cell){ hurt(3, "The gear catches you."); say("The gear comes round and catches you."); return; }
    if (next >= 0 && !being_at(room, next)) b.cell = next;
    return;
  }
  if (K.flags & BF_STRAIGHT){
    beast_straight(b);
    if ((K.flags & BF_DROP) && b.alive && hex_dist(b.cell, cell) <= K.range && !invincible){
      if (roll(1, 20) + K.hit >= 13){ say(K.name + " lets something fall on you.  " + K.shot + "."); cap_msg(); hurt(K.shot, "Something falls on you from above, and that is enough."); }
      else say("Something falls beside you.");
    }
    if (b.kind === BK_INSECT && b.alive && hex_dist(b.cell, cell) <= 1 && roll(1, 2) === 1) beast_attack(b);
    return;
  }
  if (K.flags & BF_GATE){
    b.state = (b.state + 1) % 8;
    if (b.state <= 2){
      const [n, dd] = in_line(b.cell, cell);
      if (n && (dd === 4 || dd === 5) && n <= 4 && !invincible){ sound_say("shot beam"); say("The eye beams come down and find you.  3."); hurt(3, "The beams find you once more."); }
      else if (b.state === 0){ sound_say("shot beam"); say("Beams from the mouser's eyes go down both sides of the room."); }
    } else if (b.state === 3){ if (foot_count() < 3) spawn_near(BK_MOUSER, b.cell, "The mouth opens and a mouser drops out of it."); }
    else if (b.state === 4) say("The mouth stays open, and there is a glowing orb in it.");
    else if (b.state === 7){ say("The mouth shuts."); if (dist <= 1) beast_attack(b); }
    return;
  }
  if (K.flags & BF_SPAWN){
    if (++b.state >= 4){ b.state = 0; if (foot_count() < 3) spawn_near(BK_FOOT, b.cell, "The hatch opens and a foot soldier comes out."); }
    return;
  }
  if (K.flags & BF_LASER){
    if ((turn & 1) === 0) return;
    const [n, dd] = in_line(b.cell, cell);
    sound_say("shot laser");
    if (n && n <= K.range && !invincible && !on_high()){
      if (roll(1, 20) + K.hit >= 13){ say("The laser finds you.  " + K.shot + "."); hurt(K.shot, "The laser finds you once more."); }
      else say("The laser goes past you.");
    }
    return;
  }
  if (K.flags & BF_SHOOT){
    const [n, dd] = in_line(b.cell, cell);
    if (b.kind === BK_SHREDDER){
      if (b.state === 1){ beast_shoot(b, n); return; }
      if (n && n <= K.range && b.cool === 0 && dist > 1){ beast_shoot(b, n); return; }
    } else if (n && n <= K.range && dist > reach && (turn & 1)){ beast_shoot(b, n); return; }
  }
  if (dist <= reach && !(K.flags & BF_ELECTRIC)){
    if (!(K.flags & BF_SWIMS) || RS[room].c[b.cell].ground === G_RIVER){ beast_attack(b); return; }
  }
  if (K.flags & BF_STILL) return;
  if (K.flags & BF_CHARGE){
    const [n, dd] = in_line(b.cell, cell);
    if (n >= 2 && n <= 4){
      sound_say("whoosh charge");
      for (let i = 0; i < 3 && hex_dist(b.cell, cell) > 1; i++){
        const c = step_cell(b.cell, dd);
        if (c < 0 || c === cell || !passable(room, c, 1, b.kind) || being_at(room, c)) break;
        b.cell = c;
      }
      say(K.name + " charges.");
      if (hex_dist(b.cell, cell) <= 1) beast_attack(b);
      return;
    }
  }
  if (K.flags & BF_HUNT){
    if (room_dark(room) && dist > 3) return;
    if ((K.flags & BF_JUMP) && dist >= 3){
      const d = dir_toward(b.cell, cell);
      const c1 = step_cell(b.cell, d), c2 = c1 >= 0 ? step_cell(c1, d) : -1;
      if (c2 >= 0 && c2 !== cell && passable(room, c2, 1, b.kind) && !being_at(room, c2)){ b.cell = c2; sound_say("whoosh jump"); return; }
    }
    beast_move_toward(b, cell);
  }
}
function beasts_turn(){
  for (let i = 0; i < being_n && !dead; i++){
    const b = beings[i];
    if (b.room !== room || !b.alive) continue;
    if (taken) break;
    const K = BEAST[b.kind];
    if ((K.flags & BF_SLOW) && (turn & 1)) continue;
    beast_act(b);
    if (!dead && (K.flags & BF_FAST) && b.alive && !(K.flags & BF_STRAIGHT)) beast_act(b);
  }
}

/* ── the rooms' own doings ── */
function room_tick(){
  if (dead || won) return;
  const k = RS[room].c[cell];
  if (k.ground === G_SPIKES) hurt(1, "The spikes have you.");
  if (k.thing === T_SEAWEED) hurt(2, "The seaweed has you.");
  if (dead || taken) return;
  if (k.ground === G_BELT_E || k.ground === G_BELT_W){
    const c = step_cell(cell, k.ground === G_BELT_E ? 0 : 3);
    if (c >= 0 && passable(room, c, 0, 0) && !being_at(room, c) && RS[room].c[c].ground !== G_HOLE && !way_at(room, c)){
      cell = c; say("The belt carries you " + (k.ground === G_BELT_E ? "east" : "west") + ".");
      const k2 = RS[room].c[c];
      if (k2.thing >= 0 && (THING[k2.thing].flags & TF_TAKE)) take_item(c);
      if (k2.ground === G_SPIKES) hurt(2, "The belt carries you onto the spikes.");
    }
  }

/* ── the screen ───────────────────────────────────────────── */
const SHAPE_BRICK = 0, SHAPE_HEX = 1, SHAPE_FINE = 2, SHAPE_N = 3;
let tile_shape = SHAPE_FINE;
const TILE_W = 4, PIX_H = 4, BOARD_Y = 1;
function you_px(gx, gy, gw, gh){
  const hexed = tile_shape !== SHAPE_BRICK;
  const top = (gh >= 4 && hexed) ? 1 : 0;
  const hd = (gh - top >= 4) ? 2 : 1;
  const rest = gh - top - hd;
  const lg = rest >= 2 ? (rest >> 1) : rest;
  const sh = rest - lg;
  if (gy < top) return -1;
  const band = gy < top + hd ? 0 : gy < top + hd + sh ? 1 : 2;
  if (in_van){
    const w = band === 0 ? (gw >> 1) : Math.trunc(gw * 3 / 4);
    const x = (gw - w) >> 1;
    if (gx < x || gx >= x + w) return -1;
    return band === 0 ? 229 : band === 1 ? 226 : 16;
  }
  let w = band === 0 ? Math.trunc(gw * 3 / 8) : band === 1 ? Math.trunc(gw * 3 / 4) : (gw >> 1);
  if (w < 1) w = 1;
  const x = (gw - w) >> 1;
  if (gx < x || gx >= x + w) return -1;
  if (invincible && ((gx + gy + turn) & 1)) return 227;
  return band === 0 ? TURTLE[who].band : band === 1 ? 34 : 94;
}
function wall_colours(r){
  let cap, body;
  switch (ROOM[r].floor){
  case G_SEWER: cap = 108; body = 65; break;
  case G_DIRT: cap = 101; body = 59; break;
  case G_METAL: case G_CONTROL: cap = 103; body = 60; break;
  case G_ROOF: cap = 250; body = 244; break;
  case G_RIVER: cap = 67; body = 24; break;
  default: cap = 181; body = 138; break;
  }
  if (ROOM[r].kind === RK_OVER){ cap = 180; body = 131; }
  return [cap, body];
}
function put_pixel(fine, tx, gx, y, c){
  if (fine) pxq(tx * 2 + gx, y, c);
  else px(tx + gx, y, c);
}
function draw_cell(tx, ty, r, c, mark, lit){
  const k = RS[r].c[c];
  const G = GROUND[k.ground];
  let base = G.bg, acc = G.fg, sprinkle = 32 + G.prom * 10;
  const fine = tile_shape === SHAPE_FINE ? 1 : 0, hexed = tile_shape !== SHAPE_BRICK;
  const gw = fine ? TILE_W * 2 : TILE_W, gh = hexed ? PIX_H + 1 : PIX_H;
  const tip = gw >> 2, tipw = gw >> 1;
  const y0 = ty * 2 + (hexed ? 1 : 0);
  const tex = hash3u(Math.imul(r, 7919) >>> 0, Number(SEED & 0xFFFFFFFFn), 3);
  const t = k.thing;
  const solid = t >= 0 && !(THING[t].flags & (TF_PASS | TF_TAKE)) && !(THING[t].flags & TF_PLANT);
  let cap = 0, body = 0;
  if (t === T_WALL || t === T_BUILDING){ const wc = wall_colours(r); cap = wc[0]; body = wc[1]; }
  else if (solid){ cap = lighter(THING[t].fg); body = THING[t].fg; }
  const growing = t >= 0 && (THING[t].flags & TF_PLANT) && grow_tile(r, c, t, gw, gh);
  const b = being_at(r, c);
  const beasting = b && beast_pixels(BEAST[b.kind].name, BEAST[b.kind].fg, gw, gh);
  const live = k.ground === G_CURRENT && (Math.trunc(turn / 3) & 1) === 0;
  if (k.ground === G_VOID){ base = acc = 16; sprinkle = 0; }
  if (mark === 1) sprinkle = 0;
  const q4 = (gw >> 2) > 0 ? (gw >> 2) : 1;
  for (let gy = 0; gy < gh; gy++){
    let lo = 0, hi = gw;
    if (hexed && (gy === 0 || gy === gh - 1)){ lo = tip; hi = tip + tipw; }
    for (let gx = lo; gx < hi; gx++){
      const h = hash3u(tex, c, gy * 8 + gx);
      let col = ((h & 0xFF) < sprinkle) ? acc : base;
      if (k.ground === G_BELT_E || k.ground === G_BELT_W){
        const ph = (turn + (k.ground === G_BELT_E ? gx : gw - gx)) & 3;
        col = ph === 0 ? acc : base;
        if (gy === 0 || gy === gh - 1) col = darker(base);
      }
      if (k.ground === G_SPIKES) col = ((gx + gy) & 1) ? acc : base;
      if (k.ground === G_FIRE) col = ((h >>> 9) & 3) === 0 ? 226 : ((h >>> 11) & 1) ? 202 : 196;
      if (k.ground === G_LADDER || k.ground === G_HATCH) col = (gy & 1) ? acc : base;
      if (k.ground === G_MANHOLE){ const cx = gx - (gw >> 1), cy = gy - (gh >> 1); col = (Math.trunc(cx * cx / q4) + cy * cy <= 2) ? 236 : ((gx + gy) & 1 ? acc : base); }
      if (k.ground === G_DROP) col = (gx > (gw >> 2) && gx < Math.trunc(gw * 3 / 4) && gy > 0 && gy < gh - 1) ? 16 : base;
      if (k.ground === G_CURRENT) col = live ? (((gx + gy + turn) & 1) ? 226 : 24) : (((h >>> 7) & 7) === 0 ? 31 : 24);
      if (k.ground === G_ROOFGAP) col = (gy === (gh >> 1) && ((gx + turn) & 3) === 0) ? 240 : 16;
      if (k.ground === G_BRIDGE) col = (gy & 1) ? 137 : 94;
      if (k.ground === G_STREET && r !== R_O5 && ((gy === (gh >> 1)) && ((gx + c * 3) & 7) < 3)) col = 250;
      if (solid){
        col = gy === 0 ? cap : gy === gh - 1 ? darker(body) : body;
        if (t === T_BUILDING){ col = ((gx ^ gy) & 1) && gy > 0 && gy < gh - 1 && ((h >>> 9) & 3) === 0 ? 229 : col; }
        if (t === T_ROADBLOCK) col = ((gx + gy) & 1) ? 208 : 16;
        if (t === T_FENCE) col = ((gx + gy) & 1) ? 245 : 238;
        if (t === T_TECHNODROME) col = gy === 0 ? 250 : ((h >>> 9) & 3) ? 240 : 196;
        if (t === T_APRIL) col = gy === 0 ? 223 : gy < gh - 1 ? 226 : 172;
        if (t === T_SPLINTER) col = gy === 0 ? 137 : gy < gh - 1 ? 130 : 94;
        if (t === T_HELICOPTER) col = gy === 0 ? 245 : gy === 1 ? 240 : 237;
      } else if (t >= 0 && (THING[t].flags & TF_TAKE)){
        let w = THING[t].size >= 'K' ? (gw >> 1) : THING[t].size === 'J' ? Math.trunc(gw * 3 / 8) : (gw >> 2);
        const hh = THING[t].size >= 'K' ? 3 : THING[t].size === 'J' ? 2 : 1;
        if (w < 2) w = 2;
        const x0 = (gw - w) >> 1, yy0 = (gh - hh) >> 1;
        if (gx >= x0 && gx < x0 + w && gy >= yy0 && gy < yy0 + hh) col = (t === T_BOMB && (turn & 1)) ? 226 : THING[t].fg;
      } else if (t === T_BOX){
        col = gy === 0 ? 180 : (gx === lo || gx === hi - 1 || gy === gh - 1) ? 94 : 137;
      } else if (t === T_CAGE){
        col = ((gx & 1) || gy === 0 || gy === gh - 1) ? 245 : base;
      } else if (t === T_VAN){
        col = gy === 0 ? 229 : gy < gh - 1 ? ((gx + gy) & 3 ? 226 : 34) : 16;
      }
      if (growing && grow_px[gy * GROW_MAXW + gx]) col = grow_px[gy * GROW_MAXW + gx];
      if (beasting && bst_px[gy * BST_MAXW + gx]) col = bst_px[gy * BST_MAXW + gx];
      if (mark === 1){ const me = you_px(gx, gy, gw, gh); if (me >= 0) col = me; }
      if (!lit) col = ((t === T_WALL || t === T_BUILDING) && hex_dist(c, cell) <= 2) ? 233 : 16;
      else if (room_dark(r)) col = shade(col, 0.75);
      put_pixel(fine, tx, gx, y0 + gy, col);
    }
  }
}

/* ── a page of text over everything ── */
function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){
      if (s[p + len] === ' ') last_space = len;
      len++;
    }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}

  for (let r = y; r < y + h; r++){ text(x, r, " ", 250, 240); text(x + w - 1, r, " ", 250, 240); }
  const lines = wrap_lines(body, w - 6, 64);
  let row = y + 1;
  for (let i = 0; i < lines.length && row < y + h - 2; i++, row++)
    text(x + 3, row, lines[i].slice(0, 99), i === 0 ? 223 : fg, 235);

}

/* ── the page ─────────────────────────────────────────────────

 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe

 * as a buffer; the tune loops until the next one. */

      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("terrapins.sav"),
  set: (s) => localStorage.setItem("terrapins.sav", s),
};
start_game(params.get("seed"), 0);
if (SOUND.on) SOUND.command("bed lair");
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left the city.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: arrows are w x d a as in ninjaterrapins.c, Escape
 * is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return 'w';
  if (e.key === "ArrowDown") return 'x';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
