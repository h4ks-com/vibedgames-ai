<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDFI - MIDI Catalog</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12131a;
  --surface-raised: #1a1c27;
  --surface-hover: #232634;
  --border: #262a38;
  --border-strong: #363b4d;
  --text: #f0f1f5;
  --text-muted: #9ea3b4;
  --text-subtle: #6b7185;
  --accent: #c4783f;
  --accent-strong: #e89757;
  --green: #5bd8a0;
  --cyan: #5bd8e6;
  --shadow: 0 12px 36px rgba(0,0,0,.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.site-header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 20px;
  padding: 14px max(20px, calc((100vw - 1200px) / 2));
  background: rgba(10,10,15,.92);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(16px);
}
.brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; }
.brand-mark {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-strong));
  font-size: 18px;
}
.brand-sub { font-size: 13px; color: var(--text-subtle); font-weight: 500; }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.count-pill {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 13px;
  font-size: 13px; color: var(--text-muted);
}
.refresh-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 14px;
  font-size: 13px; color: var(--text-muted);
  transition: all .15s;
}
.refresh-btn:hover { border-color: var(--border-strong); color: var(--text); background: var(--surface-raised); }

main { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }

.section-title {
  font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-subtle); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}

.midi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
}

.midi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  transition: border-color .15s, background .15s;
  display: flex; flex-direction: column; gap: 12px;
}
.midi-card:hover { border-color: var(--border-strong); background: var(--surface-raised); }

.card-head { display: flex; align-items: flex-start; gap: 12px; }
.card-icon {
  width: 44px; height: 44px; flex-shrink: 0;
  border-radius: 9px;
  background: linear-gradient(135deg, rgba(196,120,63,.2), rgba(232,151,87,.1));
  border: 1px solid rgba(196,120,63,.25);
  display: grid; place-items: center;
  font-size: 20px;
}
.card-info { flex: 1; min-width: 0; }
.card-name {
  font-size: 14px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-meta { font-size: 12px; color: var(--text-subtle); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 8px; }
.card-meta span { display: inline-flex; align-items: center; gap: 3px; }

.card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  font-size: 11px; padding: 3px 8px; border-radius: 999px;
  background: rgba(91,216,224,.08); color: var(--cyan);
  border: 1px solid rgba(91,216,224,.15);
}
.tag.green { background: rgba(91,216,160,.08); color: var(--green); border-color: rgba(91,216,160,.15); }
.tag.muted { background: rgba(158,163,180,.06); color: var(--text-subtle); border-color: var(--border); }

.card-actions { display: flex; gap: 6px; margin-top: 2px; }
.action-btn {
  flex: 1; padding: 7px 0;
  font-size: 12px; font-weight: 600;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-muted);
  transition: all .15s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.action-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface); }
.action-btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-strong));
  color: #fff; border-color: transparent;
}
.action-btn.primary:hover { opacity: .88; }

/* Loading */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 20px; gap: 16px; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { color: var(--text-muted); font-size: 14px; }

/* Error */
.error-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.error-state h3 { color: var(--accent); margin-bottom: 8px; }

/* Footer */
footer { text-align: center; padding: 30px 20px; color: var(--text-subtle); font-size: 12px; border-top: 1px solid var(--border); }
footer a { color: var(--text-muted); }
footer a:hover { color: var(--text); }

/* Responsive */
@media (max-width: 600px) {
  .midi-grid { grid-template-columns: 1fr; }
  .site-header { padding: 12px 16px; }
  main { padding: 16px; }
}

/* Fade-in animation for cards */
.midi-card { animation: fadeIn .3s ease-out; animation-fill-mode: both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <div class="brand-mark">🎹</div>
    <div>
      MIDFI
      <div class="brand-sub">MIDI Catalog</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="count-pill" id="count-pill">—</div>
    <button class="refresh-btn" onclick="loadMidis()">↻ Refresh</button>
  </div>
</header>

<main>
  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Loading MIDI files...</div>
    </div>
  </div>
</main>

<footer>
  Powered by the <a href="https://s3-api.t3ks.com/kinesthesia/" target="_blank">kinesthesia bucket</a> · Plays via <a href="https://kinesthesia.h4ks.com" target="_blank">kinesthesia</a>
</footer>

<script>
const BUCKET_URL = 'https://s3-api.t3ks.com/kinesthesia/';
const PLAYER_BASE = 'https://kinesthesia.h4ks.com';

function formatDate(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = now - d;
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 7) return days + 'd ago';
  if (days < 30) return Math.floor(days / 7) + 'w ago';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function shortId(key) {
  return key.replace('.mid', '');
}

function playerUrl(key, mode) {
  const full = BUCKET_URL + key + '?download=true';
  return PLAYER_BASE + '/' + mode + '?url=' + encodeURIComponent(full) + '&name=' + encodeURIComponent(shortId(key));
}

async function parseMidiMeta(url) {
  try {
    const res = await fetch(url);
    const buf = new Uint8Array(await res.arrayBuffer());
    // Parse MIDI header
    if (buf.length < 14) return null;
    // Check for MThd
    const isMidi = buf[0] === 0x4D && buf[1] === 0x54 && buf[2] === 0x68 && buf[3] === 0x64;
    if (!isMidi) return null;
    const format = (buf[8] << 8) | buf[9];
    const ntrks = (buf[10] << 8) | buf[11];
    const division = (buf[12] << 8) | buf[13];

    // Parse tempo from first track
    let tempo = 500000; // default 120 BPM
    let totalTicks = 0;
    let trackNames = [];

    let offset = 14;
    for (let t = 0; t < ntrks && offset < buf.length - 8; t++) {
      // MTrk header
      if (buf[offset] !== 0x4D || buf[offset+1] !== 0x54 || buf[offset+2] !== 0x72 || buf[offset+3] !== 0x6B) break;
      const trackLen = (buf[offset+4] << 24) | (buf[offset+5] << 16) | (buf[offset+6] << 8) | buf[offset+7];
      const trackEnd = offset + 8 + trackLen;
      let pos = offset + 8;
      let trackTick = 0;
      let hasNotes = false;

      while (pos < trackEnd && pos < buf.length) {
        let delta = 0;
        let byte;
        do {
          byte = buf[pos++];
          delta = (delta << 7) | (byte & 0x7F);
        } while (byte & 0x80 && pos < buf.length);
        trackTick += delta;

        if (pos >= buf.length) break;
        let status = buf[pos++];
        if (status < 0x80) { pos--; status = 0; } // running status, skip back

        if (status === 0xFF) { // Meta event
          const metaType = buf[pos++];
          let metaLen = 0;
          let mbyte;
          do {
            mbyte = buf[pos++];
            metaLen = (metaLen << 7) | (mbyte & 0x7F);
          } while (mbyte & 0x80 && pos < buf.length);

          if (metaType === 0x51 && metaLen >= 3) { // tempo
            tempo = (buf[pos] << 16) | (buf[pos+1] << 8) | buf[pos+2];
          } else if (metaType === 0x03) { // track name
            let name = '';
            for (let i = 0; i < metaLen; i++) name += String.fromCharCode(buf[pos + i]);
            if (name.trim()) trackNames.push(name.trim());
          }
          pos += metaLen;
        } else if (status === 0xF0) { // SysEx
          let sysexLen = 0;
          let sbyte;
          do {
            sbyte = buf[pos++];
            sysexLen = (sysexLen << 7) | (sbyte & 0x7F);
          } while (sbyte & 0x80 && pos < buf.length);
          pos += sysexLen;
        } else {
          // Channel event
          const type = status & 0xF0;
          if (type === 0xC0 || type === 0xD0) {
            pos += 1;
          } else {
            if (type === 0x80 || type === 0x90) hasNotes = true;
            pos += 2;
          }
        }
      }
      totalTicks = Math.max(totalTicks, trackTick);
      offset = trackEnd;
    }

    const bpm = Math.round(60000000 / tempo);
    const seconds = (division > 0) ? (totalTicks * tempo) / (division * 1000000) : 0;
    const durStr = seconds > 0 ? (Math.floor(seconds / 60) + ':' + String(Math.floor(seconds % 60)).padStart(2, '0')) : '—';

    return { bpm, duration: durStr, tracks: ntrks, names: trackNames, hasNotes };
  } catch(e) {
    return null;
  }
}

async function loadMidis() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading"><div class="spinner"></div><div class="loading-text">Loading MIDI files...</div></div>';

  try {
    const res = await fetch(BUCKET_URL);
    const xml = await res.text();
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const contents = [...doc.querySelectorAll('Contents')];

    const midis = contents
      .map(c => ({
        key: c.querySelector('Key')?.textContent,
        modified: c.querySelector('LastModified')?.textContent,
        size: parseInt(c.querySelector('Size')?.textContent || '0'),
      }))
      .filter(m => m.key && m.key.endsWith('.mid'))
      .sort((a, b) => new Date(b.modified) - new Date(a.modified));

    document.getElementById('count-pill').textContent = midis.length + ' files';

    // Render cards immediately, then enhance with MIDI metadata
    content.innerHTML = '<div class="midi-grid" id="grid"></div>';
    const grid = document.getElementById('grid');

    midis.forEach((m, i) => {
      const card = document.createElement('div');
      card.className = 'midi-card';
      card.style.animationDelay = (i * 0.03) + 's';
      card.id = 'card-' + m.key.replace(/[^a-z0-9]/gi, '');
      card.innerHTML = `
        <div class="card-head">
          <div class="card-icon">🎹</div>
          <div class="card-info">
            <div class="card-name">${shortId(m.key)}</div>
            <div class="card-meta">
              <span>📅 ${formatDate(m.modified)}</span>
              <span>📦 ${formatSize(m.size)}</span>
              <span class="meta-extra">⏳</span>
            </div>
          </div>
        </div>
        <div class="card-tags" id="tags-${i}"></div>
        <div class="card-actions">
          <a class="action-btn primary" href="${playerUrl(m.key, 'watch')}" target="_blank">▶ Watch</a>
          <a class="action-btn" href="${playerUrl(m.key, 'learn')}" target="_blank">🎓 Learn</a>
          <a class="action-btn" href="${playerUrl(m.key, 'multiplayer')}" target="_blank">👥 Duet</a>
        </div>
      `;
      grid.appendChild(card);

      // Fetch MIDI metadata for display
      parseMidiMeta(BUCKET_URL + m.key + '?download=true').then(meta => {
        const metaSpan = card.querySelector('.meta-extra');
        const tagsDiv = document.getElementById('tags-' + i);
        if (meta) {
          metaSpan.textContent = `🎵 ${meta.duration} · ${meta.bpm} BPM`;
          if (meta.tracks) {
            const t = document.createElement('span');
            t.className = 'tag';
            t.textContent = `${meta.tracks} track${meta.tracks !== 1 ? 's' : ''}`;
            tagsDiv.appendChild(t);
          }
          if (meta.names && meta.names.length) {
            const t = document.createElement('span');
            t.className = 'tag green';
            t.textContent = meta.names.slice(0, 3).join(', ');
            tagsDiv.appendChild(t);
          }
        } else {
          metaSpan.textContent = '';
        }
      });
    });

  } catch (err) {
    content.innerHTML = `<div class="error-state"><h3>Failed to load</h3><p>${err.message}</p><p style="margin-top:12px;color:var(--text-subtle)">Try hitting Refresh.</p></div>`;
  }
}

loadMidis();
</script>
</body>
</html>
