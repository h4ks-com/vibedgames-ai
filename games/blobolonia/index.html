/* ── the game ───────────────────────────────────────────────
 * Everything below is what happens when a key is pressed: a step, a
 * climb, a fall, a bean thrown, a whistle, and then the creatures'
 * turn and the board's. */
let show_keys = 0, show_look = 0, show_items = 0, ask_dir = 0, show_intro = 0;
let walk_keys = 0;

function spawn(kind, r, c){
  if (being_n >= BEING_MAX) return null;
  if (beings.length <= being_n) beings.push(new_being());
  const b = beings[being_n++];
  b.kind = kind; b.room = r; b.cell = c; b.home = c;
  b.alive = 1; b.state = 0; b.timer = 0; b.cool = 0;
  b.dir = roll(0, 1);

  return b;
}
/* the creatures a board starts with: the marks the notes left, and Blobolonia's by kind */
function spawn_room(r){
  for (let c = 0; c < BOARD_SIZE; c++){
    const ch = RS[r].c[c].ch;
    if (ch >= '1' && ch <= '9') spawn(ch.charCodeAt(0) - 49, r, c);
  }
  if (r < BL_BASE) return;
  const kind = BLOB[r - BL_BASE].kind;
  if (kind === BL_BOUNCERS) for (let k = 0; k < 3; k++){ const b = spawn(BK_MARSHMALLOW, r, cell_near(6, 8 + 8 * k)); if (b) b.state = k % 4; }
  if (kind === BL_TEETH || kind === BL_TEETHFAST) for (let k = 0; k < 4; k++){ const b = spawn(BK_TOOTH, r, cell_near(5, 8 + 6 * k)); if (b) b.state = k; }
  if (kind === BL_GUARDS) for (let k = 0; k < 2; k++) spawn(BK_GINGERBREAD, r, cell_near(6, 10 + 12 * k));
  if (kind === BL_THRONE) spawn(BK_EMPEROR, r, cell_near(5, 32));
}
/* the creatures of a board, as they were: a life lost */
function respawn_room(r){
  let w = 0;
  for (let i = 0; i < being_n; i++) if (beings[i].room !== r || beings[i].kind === BK_BLOB){ const t = beings[w]; beings[w] = beings[i]; beings[i] = t; w++; }
  being_n = w;
  spawn_room(r);
}
function start_cell(){ return cell_near(6, 8); }
function init_world(){
  being_n = 0;
  build_world();
  for (let r = 0; r < ROOM_MAX; r++) spawn_room(r);
  lives = START_LIVES; money = 0; treasures = 0; mints = 0; vitamins[0] = vitamins[1] = vitamins[2] = 0; vitamin_sel = 0;
  for (let b = 0; b < B_N; b++) beans[b] = BEAN[b].start;
  bean_sel = B_LICORICE;
  room = ROOM_AT(HOUSE_COL, 0); cell = start_cell(); turn = 0; dead = 0; won = 0; gameover = 0;
  carrying = -1; shopped = 0; quiet_until = -1; last_cell = -1; deaths = 0; mercy = 0;
  form_room = -1; form_cell = -1; form_thing = -1;
  spawn(BK_BLOB, room, step_cell(cell, 0));
  message[0] = ""; message[1] = "";
  show_story = 0;
  room_enter(-1);
}
/* ── the blob's forms ──
 * A form lies on cells: the ladder on its cell and the four above,
 * the bridge on its cell and the four beyond, the rest on one.  Laid
 * cells are remembered so the whistle can take them up again. */
const FORM_MAX = 8;
const form_rooms = new Int16Array(FORM_MAX), form_cells = new Int16Array(FORM_MAX);
let form_n = 0;
function lay(r, c, t){
  if (form_n >= FORM_MAX || r < 0 || c < 0) return;
  form_rooms[form_n] = r; form_cells[form_n] = c; form_n++;
  RS[r].c[c].thing = t;
}
function blob_hide(r, c){
  const b = the_blob();
  if (!b) return;
  b.room = r; b.cell = c; b.state = 1;         /* state 1: he is the form */
}
function blob_show(r, c){
  const b = the_blob();
  if (!b) return;
  b.room = r; b.cell = c; b.state = 0; b.alive = 1;
}
/* the blob back to himself: the form taken up, and he stands where it was, or falls to the floor under it */
function unform(){
  for (let i = 0; i < form_n; i++){
    const k = RS[form_rooms[i]].c[form_cells[i]];
    if (k.thing >= 0 && (THING[k.thing].flags & TF_FORM)) k.thing = -1;
  }
  form_n = 0;
  let r = form_room, c = form_cell;
  if (r === HOLESCREEN && form_thing === T_HOLE){
    /* the floor here is thin, and the hole stays: the way down to the pot room, and up again */
    const tx = cell_tx(c);
    for (let i = 0; i < BOARD_SIZE; i++){
      if (row_of(i) >= 7 && cell_tx(i) >= tx - 4 && cell_tx(i) <= tx + 4){ RS[r].c[i].ground = G_AIR; RS[r].c[i].ch = '.'; }
      if (row_of(i) === 0 && cell_tx(i) >= tx - 6 && cell_tx(i) <= tx + 6){ RS[POTROOM].c[i].ground = G_AIR; RS[POTROOM].c[i].ch = '.'; }
    }
    RS[r].c[c].ground = G_AIR;
  }
  form_room = -1; form_cell = -1; form_thing = -1;
  if (r < 0 || c < 0) return;
  /* down to a floor, if the form was in the air */
  let guard = 0;
  while (guard++ < 12 && !standable(r, c)){ const d = down_cell(r, c), r2 = R2; if (d < 0 || solid(r2, d)) break; r = r2; c = d; }
  blob_show(r, c);
}

/* ── the bars ─────────────────────────────────────────────── */
function life_lost(how){
  if (dead) return;
  dead = 1;
  deaths++;
  dead_how = how;
  lives--;
  sound_say("bed off"); sound_bed = "";
  sound_say("jingle died");
  if (lives < 0){ gameover = 1; show_story = 4; }
  else show_story = 3;
}
function give_money(n, what){
  money += n; treasures++;
  sound_say("blow gold");
  say(what + ": $" + n + ".  $" + money + ", and " + treasures + " of " + TREASURE_N + " treasures.");
  cap_msg();
}
function take_item(r, c){
  const k = RS[r].c[c];
  const t = k.thing;
  if (t < 0 || !(THING[t].flags & TF_TAKE)) return;
  k.thing = -1;
  switch (t){
  case T_BAG: give_money(1000, "A bag of gold"); break;
  case T_CHEST: give_money(5000, "A treasure chest"); break;
  case T_GEM: give_money(7500, "A diamond"); break;
  case T_BEANBAG:
    treasures++;
    sound_say("blow gold");
    if (beans[B_ORANGE] === 0 && beans[B_LIME] === 0 && band_of(r) === 1){ beans[B_ORANGE] += 45; beans[B_LIME] += 2; say("A bag of jellybeans: two new flavours.  Orange, 45, the vitablaster; lime, 2, a key.  " + treasures + " of " + TREASURE_N + " treasures."); }
    else { beans[B_LICORICE] += 10; beans[B_STRAWBERRY] += 4; beans[B_VANILLA] += 6; beans[B_TANGERINE] += 6; beans[B_PUNCH] += 8; beans[B_HONEY] += 6; beans[B_KETCHUP] += 2; say("A bag of jellybeans: more of the flavours you have.  " + treasures + " of " + TREASURE_N + " treasures."); }
    break;
  case T_PEPPERMINT:
    mints++;
    if (mints % 5 === 0){ lives++; say("A peppermint, the fifth: an extra life.  " + lives + "."); }
    else say("A peppermint.  " + (mints % 5) + " of five.");
    break;
  default: break;
  }
}
/* the store: the treasure buys the vitamins, an assortment by how much there is */
function shop(){
  if (shopped){ say("The health food store.  You have what it sells."); return; }
  shopped = 1;
  vitamins[0] = Math.trunc(money / 1500); vitamins[1] = Math.trunc(money / 5000); vitamins[2] = Math.trunc(money / 1100);
  sound_say("blow gold");
  say("The health food store.  For $" + money + ": vitamin A " + vitamins[0] + ", vitamin B " + vitamins[1] + ", vitamin C " + vitamins[2] + ".  The blob can be a rocket now.");
}

/* ── the boy's step ─────────────────────────────────────────
 * Every move ends in settle(): if there is nothing under him he
 * falls, a row a turn, until there is, and eight rows is the most he
 * can fall and live, unless he carries the umbrella; a creature on the
 * way is a life, and so is the river without the bubble. */
function deadly_here(r, c){
  const b = being_at(r, c);
  if (b && !(BEAST[b.kind].flags & BF_HARMLESS) && b.state === 0) return b.kind;
  return -1;
}
function room_enter(from){
  const R = RS[room];
  R.entry = cell;
  if (is_earth(room)){
    const band = band_of(room);
    if (!R.seen){ say(BAND_NAME[band] + ": " + String.fromCharCode(65 + col_of(room)) + (band + 1) + "."); cap_msg(); }
    else say(String.fromCharCode(65 + col_of(room)) + (band + 1) + ".");
  } else {
    if (!R.seen){ say("Blobolonia: " + BLOB[room - BL_BASE].name + "."); }
    else { say(BLOB[room - BL_BASE].name + "."); cap_msg(); }
  }
  R.seen = 1;
  /* the blob comes along if he was beside you and himself */
  const b = the_blob();
  if (room === THRONE && b && !R.off){ R.off = 1; b.room = room; b.cell = cell_near(6, 18); b.state = 4; carrying = -1; say("The Emperor's hall.  The blob is in a cage, and there is a jar of vitamins on the shelf over the throne.  Whistle."); sound_scene(); sound_beasts(); return; }
  if (b && b.state === 0 && b.room !== room && from >= 0 && b.room === from && carrying < 0){
    let at = -1;
    for (let d = 0; d < 6 && at < 0; d++){ const n = step_cell(cell, d); if (n >= 0 && standable(room, n) && !being_at(room, n) && !solid(room, n)) at = n; }
    if (at >= 0){ b.room = room; b.cell = at; }
  }
  sound_scene();
  sound_beasts();
}
function go_to(r, c, fell){
  const from = room;
  room = r; cell = c; last_cell = -1;
  if (r !== from) room_enter(from);
  settle(fell);
}
/* the street is thicker than the blob is deep: a hole in it goes nowhere */
function over_pavement(r, c){ return is_earth(r) && band_of(r) === 0 ? 1 : 0; }
/* falling: from this cell down until there is floor */
function settle(fell){
  let guard = 0;
  while (!dead && guard++ < 40){
    const k = RS[room].c[cell];
    const kind = deadly_here(room, cell);
    if (kind >= 0){ const m = cap(BEAST[kind].name + " " + BEAST[kind].verb + " you."); say(m); life_lost(m); return; }
    if (k.thing === T_WEB){ say("You walk into the web."); life_lost("The spider's web."); return; }
    if (k.ground === G_WATER){
      if (k.thing >= 0 && (THING[k.thing].flags & TF_TAKE)) take_item(room, cell);
      if (carrying === T_BUBBLE){ if (fell) say("Into the river, in the bubble."); return; }
      say("Into the river, and under it."); life_lost("The river, without the bubble."); return;
    }
    if (k.thing >= 0 && (THING[k.thing].flags & TF_TAKE)) take_item(room, cell);
    if (k.thing >= 0 && (THING[k.thing].flags & TF_CARRY) && carrying < 0){
      carrying = k.thing; k.thing = -1;
      blob_hide(room, cell);
      say("You pick up " + THING[carrying].name + ".");
    }
    if (k.ground === G_STAIR || k.ground === G_DOOR) return;
    if (k.thing === T_HOLE && !over_pavement(room, cell)){
      /* through the floor: down through the slab to the air under it */
      let r2 = room, d = cell, g2 = 0;
      do { d = down_cell(r2, d); r2 = R2; } while (d >= 0 && solid(r2, d) && ++g2 < 4);
      if (d < 0){ say("The hole goes nowhere."); return; }
      say("Through the hole.");
      if (fell === 0) sound_say("whoosh fall");
      const from = room; room = r2; cell = d; fell++;
      if (room !== from) room_enter(from);
      continue;
    }
    if (standable(room, cell)){
      if (fell){
        sound_say("blow land");
        if (fell > 8 && carrying !== T_UMBRELLA){ say("You fall " + fell + " rows, and land badly."); life_lost("A fall too far."); return; }
        if (fell > 2) say(carrying === T_UMBRELLA ? "Down " + fell + " rows under the umbrella, like a leaf." : "Down " + fell + " rows, and on your feet.");
      }
      return;
    }
    const d = down_cell(room, cell), r2 = R2;
    if (d < 0 || solid(r2, d)) return;              /* nothing to fall into: the edge of the world holds you */
    if (fell === 0) sound_say("whoosh fall");
    const from = room; room = r2; cell = d; fell++;
    if (room !== from) room_enter(from);
  }
}
function arrive(r, c, fell){ go_to(r, c, fell); }
/* a way taken by walking onto it: the subway stairs, the store, the open manhole */
function take_way(){
  const k = RS[room].c[cell];
  if (k.ground === G_STAIR){
    if (band_of(room) === 0){ say("Down the stairs to the subway."); arrive(ROOM_AT(STAIRS_COL, 1), cell_near(3, 32), 0); }
    else { say("Up the stairs to the street."); arrive(ROOM_AT(STAIRS_COL, 0), cell_near(6, 24), 0); }
    return;
  }
  if (k.ground === G_DOOR && k.thing === T_STORE){ shop(); return; }
  if (k.thing === T_DOOROPEN){ say("Through the door."); return; }
}
function move_side(east){
  const n = side_cell(room, cell, east), r2 = R2;
  if (n < 0){ say("The edge of the world."); return; }
  const k = RS[r2].c[n];
  const in_water = RS[room].c[cell].ground === G_WATER && carrying === T_BUBBLE;
  if (k.ground === G_SPIKE){ if (in_water){ say("The bubble bursts on the rock."); life_lost("The spiked rock under the river."); } else say("Spiked rock."); return; }
  if (k.ground === G_VOID){ say("The edge of the board, and nothing there."); return; }
  if ((k.ground === G_DOOR || k.ground === G_STAIR) && !in_water){ turn++; sound_step(n); arrive(r2, n, 0); if (!dead) take_way(); if (!dead) end_turn(); return; }
  if (k.thing === T_KEYHOLE){
    if (carrying === T_KEY){ RS[r2].c[n].thing = T_DOOROPEN; carrying = -1; the_blob().state = 0; the_blob().room = r2; the_blob().cell = n; sound_say("blow click"); say("The key turns, and the door is open, and the blob was the key."); turn++; end_turn(); return; }
    say("A door with a keyhole the size of the blob."); return;
  }
  if (k.thing === T_ROCKET){
    if (!shopped){ say("The rocket, and nowhere to go yet.  The store first."); return; }
    if (room >= BL_BASE){ say("The rocket is for going to Blobolonia, and this is it."); return; }
    sound_say("whoosh rocket");
    unform();
    say("Into the rocket, and up, and Blobolonia.");
    turn++;
    arrive(BL_BASE, cell_near(6, 6), 0);
    const b = the_blob(); if (b){ b.room = BL_BASE; b.cell = cell_near(6, 10); b.state = 0; }
    if (!dead) end_turn();
    return;
  }
  if (solid(r2, n) && !(k.thing >= 0 && (THING[k.thing].flags & TF_STAND))){
    /* a step up onto a ledge one row up, if there is one */
    const up = up_cell(r2, n), r3 = R2;
    if (up >= 0 && !solid(r3, up) && standable(r3, up) && r3 === r2 && !in_water){ turn++; sound_step(up); arrive(r3, up, 0); if (!dead) end_turn(); return; }
    say((k.thing >= 0 ? THING[k.thing].name : k.ground === G_ROCK && RS[r2].kind === 1 ? "Concrete" : GROUND[k.ground].name) + "."); cap_msg(); return;
  }
  if (k.thing >= 0 && !(THING[k.thing].flags & (TF_PASS | TF_DEADLY))){ say(THING[k.thing].name + "."); cap_msg(); return; }
  const b = being_at(r2, n);
  if (b && b.kind === BK_BLOB && b.state === 0){ b.room = room; b.cell = cell; }   /* you walk past him: he takes your place */
  turn++;
  if (in_water && k.ground === G_WATER){ arrive(r2, n, 0); if (!dead) end_turn(); return; }
  sound_step(n);
  arrive(r2, n, 0);
  if (!dead) end_turn();
}
/* up: a ladder, a ledge a row up, the trampoline; in the water, just up */
function move_up(west){
  const k = RS[room].c[cell];
  const in_water = k.ground === G_WATER && carrying === T_BUBBLE;
  if (k.thing === T_TRAMPOLINE){ bounce(west); return; }
  let up = up_cell(room, cell), r2 = R2;
  if (up < 0){ say("Nothing up there."); return; }
  let u = RS[r2].c[up];
  if (in_water){
    /* the bubble goes up either way, w to the west and e to the east */
    const sw = step_cell(cell, west ? 4 : 5);
    if (sw >= 0){ r2 = room; up = sw; u = RS[r2].c[up]; }
    if (u.ground === G_SPIKE){ say("The bubble bursts on the rock."); life_lost("The spiked rock under the river."); return; }
    if (u.ground === G_WATER || (u.ground === G_AIR && !solid(r2, up))){ turn++; arrive(r2, up, 0); if (!dead) end_turn(); return; }
    say("Rock."); return;
  }
  if (u.thing === T_LIDOPEN && band_of(room) === 1){ turn++; say("Up the ladder and out of the manhole, onto the street."); arrive(ROOM_AT(MANHOLE_COL, 0), cell_near(6, MANHOLE_TX), 0); if (!dead) end_turn(); return; }
  if (u.thing === T_LADDER || (k.thing === T_LADDER && u.thing === T_LADDER)){ turn++; sound_step(up); arrive(r2, up, 0); if (!dead) end_turn(); return; }
  if (k.thing === T_LADDER && !solid(r2, up) && u.ground === G_STAIR){ turn++; arrive(r2, up, 0); take_way(); if (!dead) end_turn(); return; }
  if (u.ground === G_STAIR && standable(r2, up)){ turn++; arrive(r2, up, 0); if (!dead) take_way(); if (!dead) end_turn(); return; }
  /* a ledge: the cell up and to the side */
  const s = step_cell(cell, west ? 4 : 5);
  if (s >= 0 && !solid(room, s) && standable(room, s)){ turn++; sound_step(s); arrive(room, s, 0); if (!dead) end_turn(); return; }
  if (k.thing === T_LADDER){ say("The top of the ladder.  Step off it, east or west."); return; }
  say("Nothing to climb.  A boy cannot jump.");
}
function move_down(west){
  const k = RS[room].c[cell];
  const in_water = k.ground === G_WATER && carrying === T_BUBBLE;
  let d = down_cell(room, cell), r2 = R2;
  if (d < 0){ say("Nothing below."); return; }
  let u = RS[r2].c[d];
  if (in_water){
    const sw = step_cell(cell, west ? 2 : 1);
    if (sw >= 0){ r2 = room; d = sw; u = RS[r2].c[d]; }
    if (u.ground === G_SPIKE){ say("The bubble bursts on the rock."); life_lost("The spiked rock under the river."); return; }
    if (u.ground === G_WATER){ turn++; arrive(r2, d, 0); if (!dead) end_turn(); return; }
    say("The bottom."); return;
  }
  if (k.thing === T_HOLE){ turn++; arrive(room, cell, 0); if (!dead) end_turn(); return; }
  if (u.thing === T_LADDER){ turn++; sound_step(d); arrive(r2, d, 0); if (!dead) end_turn(); return; }
  /* off the ledge beside you, or straight down if there is air */
  const s = step_cell(cell, west ? 2 : 1);
  if (s >= 0 && !solid(room, s) && RS[room].c[s].ground !== G_VOID){ turn++; arrive(room, s, 1); if (!dead) end_turn(); return; }
  if (!solid(r2, d) && u.ground !== G_VOID){ turn++; arrive(r2, d, 1); if (!dead) end_turn(); return; }
  say("Solid ground.");
}
/* the trampoline: up the column, w a low bounce and e a high one, and onto the highest ledge within reach.
 * The C's two results besides the cell, the ledge's room and the rows risen, are BOUNCE_R and BOUNCE_ROWS. */
let BOUNCE_R = -1, BOUNCE_ROWS = 0;
function bounce_to(r0, c0, high, take){
  let r = r0, c = c0, best_r = -1, best_c = -1, rows = 0;
  const limit = high ? 24 : 8;
  for (let i = 0; i < limit; i++){
    const up = up_cell(r, c), r2 = R2;
    if (up < 0 || solid(r2, up)) break;
    r = r2; c = up; rows++;
    if (take && RS[r].c[c].thing >= 0 && (THING[RS[r].c[c].thing].flags & TF_TAKE)) take_item(r, c);   /* a peppermint, or a diamond floating there */
    for (let e = 0; e < 2; e++){
      const sc = side_cell(r, c, e), r3 = R2;
      if (sc >= 0 && r3 === r && !solid(r3, sc) && standable(r3, sc) && RS[r3].c[sc].thing !== T_TRAMPOLINE && RS[r3].c[sc].ground !== G_WATER){ best_r = r3; best_c = sc; }
    }
  }
  BOUNCE_R = best_r; BOUNCE_ROWS = rows;
  return best_c;
}
function bounce(west){
  const best_c = bounce_to(room, cell, !west ? 1 : 0, 1), best_r = BOUNCE_R, rows = BOUNCE_ROWS;
  turn++;
  sound_say("whoosh bounce");
  if (best_c < 0){ say("Up " + rows + " rows off the trampoline, and down again."); end_turn(); return; }
  say("Off the trampoline, up " + rows + " rows, and onto the ledge.");
  arrive(best_r, best_c, 0);
  if (!dead) end_turn();
}
function wait_turn(){ turn++; end_turn(); }
/* ── the jellybeans ─────────────────────────────────────────
 * A bean thrown lands two cells on, or one if something is in the
 * way, and falls from there to a floor; the blob walks to it if there
 * is floor to walk on, and eats it, and is what it says.  Ketchup he
 * does not walk to: he is there.  Honey makes him a hummingbird, and
 * he flies to you. */
function blob_can_reach(r, from, to){
  /* along standable cells, east and west, and down off ledges, never up */
  const seen = new Int8Array(BOARD_SIZE), q = new Int32Array(BOARD_SIZE);
  let qh = 0, qt = 0;
  if (from < 0 || to < 0) return 0;
  seen[from] = 1; q[qt++] = from;
  while (qh < qt){
    const c = q[qh++];
    if (c === to) return 1;
    for (let e = 0; e < 2; e++){
      let n = side_cell(r, c, e); const r2 = R2;
      if (n < 0 || r2 !== r || seen[n] || solid(r, n) || RS[r].c[n].ground === G_WATER) continue;
      /* a drop from there to the floor under it */
      let g = 0;
      while (n >= 0 && !standable(r, n) && g++ < 8){ const d = down_cell(r, n), rr = R2; if (d < 0 || rr !== r || solid(rr, d)){ n = -1; break; } n = d; }
      if (n < 0 || seen[n]) continue;
      seen[n] = 1; q[qt++] = n;
    }
    /* a step up onto a ledge one row up he can do, like the boy */
    for (let d = 4; d <= 5; d++){ const n = step_cell(c, d); if (n >= 0 && !seen[n] && !solid(r, n) && standable(r, n)){ seen[n] = 1; q[qt++] = n; } }
  }
  return 0;
}
/* where a bean thrown in direction d comes to rest; the room is LAND_R */
let LAND_R = 0;
function bean_lands(d){
  /* two cells the way it was thrown, stopping at solid; then down to a floor */
  let r = room, c = cell;
  const steps = (d === 0 || d === 3) ? 2 : 1;
  if ((d === 4 || d === 5) && standable(r, c)){ LAND_R = r; return c; }   /* tossed up, it comes down at your feet */

function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){
      if (s[p + len] === ' ') last_space = len;
      len++;
    }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}

function fb_hash(){
  let h = 2166136261 >>> 0;
  for (let row = 0; row < screen_h; row++)
    for (let col = 0; col < screen_w; col++){
      const at = FB(row, col);
      const ch = fb_ch[at] === FB_QUAD ? 1 : fb_ch[at];
      const q = fb_ch[at] === FB_QUAD ? (fb_q[at] & 15) : 0;
      const v = (fb_fg[at] | (fb_bg[at] << 8) | (q << 16) | (ch << 20)) >>> 0;
      h = Math.imul(h ^ v, 16777619) >>> 0;
      h = Math.imul(h ^ (v >>> 24), 16777619) >>> 0;
    }
  return h;
}

/* ── input ──────────────────────────────────────────────── */

/* One key.  Returns 0 to quit. */

    sound_bed = ""; sound_scene();

    if (c === 'n'){ new_game(); show_intro = 0; sound_bed = ""; sound_scene(); return 1; }

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same 2A03 and played
 * as a buffer; the tune loops until the next one. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);

    _css.set(c, hit);

}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the tune's intro once, then its loop */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left the boy and his blob.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: arrows are w x d a as in blobolonia.c, Escape
 * is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return 'w';
  if (e.key === "ArrowDown") return 'x';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();

</script>
