const BOOK_TEXT = {"99": "FROM THE MYTH OF THE GOLDEN FLEECE\n\n...and Perseus said to his companions: do not look on her, for whoever looks on the Gorgon is turned to stone where he stands.  Polish your shields until they shine like glass, and look only at what the shield shows you.  She cannot bear to see her own face, and it is her own face that will undo her.\n\nSomebody has turned down the corner of this page.", "100": "A LETTER, FOUND IN THE PIANO\n\nTo whoever reads this, and I pray it is Emily and I pray it is not.\n\nI have not been myself.  There is a Master in this house and he was here before the house was.  He speaks to me at night in a place of pillars under a black sky and he has shown me what he wants, which is a body, and mine is the one he has chosen.  He is patient.  He has been patient for a very long time.\n\nI have found only one way to refuse him, and I am going to take it tonight, in the loft, where I can see the stars.  Do not think it was despair.  It was the last thing I could do that was my own.\n\nLeave this house.  Do not go below it.  If you must, read what is in the library, and read carefully, and not everything.\n\n          -- Jeremy Hartwood", "101": "JEREMY HARTWOOD'S DIARY, SEPTEMBER 1924\n\nThe 3rd.  Walter tells me there is a draught in the cellar that should not be there, behind the racks, and that the candle leans to it.  I told him to leave it.  I have been dreaming again.\n\nThe 9th.  I went down myself.  Behind the third rack there is a passage, on hands and knees, and it goes down, and it goes on.  Father looked for this for thirty years and it was under his wine.\n\nThe 14th.  Caves.  A lake.  A tree, in the dark, that has never seen the sun, and something in it that has.  I did not go close.  I have been drawing it since, though I did not mean to.\n\nThe 20th.  The dreams are not dreams.  A desert of stone pillars.  A man whose look stops the heart.  A knife.  He has told me his name and it is not the name on the deeds.  He wants to come up, and he needs somebody to come up in.\n\nThe 27th.  I have unleashed something.  They are in the house at night now; I hear them on the stairs.  There is a room in the library that Father never found either.  I have put what I could in it.  God forgive me, I cannot stop drawing the tree.", "102": "FROM THE REPORT OF CAPT. J. W. NORTON, 14TH CORPS, 1862\n\nWe came on the house called Derceto at dusk on the 11th and its owner, one Pickford, received us with every civility and pressed cigars and brandy on the officers.  I record that the cigar had an acrid smoke and that my head spun with it, and that in that condition I saw the face of our host change, and lean to me, and leer, and it was not a face I can describe in a report.\n\nLt. Harris had the sense to break the window.  In the confusion there was firing and the drapes took light.  I discharged my revolver three times into Pickford at a range of four feet and he went down.  The house burned to the ground.  We saw his servants go back into the fire for him, which I put down to devotion, and did not then understand.", "103": "PAPERS OF ELIAH PICKFORD, 1818\n\nThe marsh is drained and the piles are driven.  The ground below is hollow -- caves, the surveyor says, and he does not like them, and he has been paid to like them.  The people who were here before us called it a holy place, because every star in the sky can be seen from it and no others.  That is why I chose it.\n\nI have named the house Derceto.  Derceto reminds me of Astarte, the fertility goddess, who was worshipped as a fish.  Around here the name is Shub-Niggurath, I believe.  The library goes in first, and the library is to be built of stone.", "104": "THE SONS OF THE SUN AND THE SHADOWS, by Lt. Lope de Vega\n\n...and in the temple stood the image of Chalchihuitlicue, she of the jade skirt, the goddess of the waters, clothed in gold and stones.  As we watched, the image moved.  Captain Cortez cried to us to strike, and we could not: our armour was become as though bolted to the floor of the temple, and none of us could lift a foot.  The Captain alone was free, and he took his dagger by the blade and threw it, and the priest fell, and the spell with him.\n\nThere is a plate of the goddess.  She is small, and green, and wears a skirt of water.  You have seen her, on a table, in the dark.", "105": "DE VERMIS MYSTERIIS\n\nThe letters are not in any alphabet and you can read them.  That is the first thing you notice.  The second is that you cannot stop.", "106": "THE BOOK OF ABDUL\n\nThat is not dead which can eternal lie, and with strange aeons even death may die.  The page turns itself.  You had not meant to turn it.", "107": "A NOTE IN THE LIBRARIAN'S HAND\n\nTwo books in this house are not to be read, or not to be read standing anywhere but on the sign cut in the floor of the inner room: the yellow book, and the one bound in what it is bound in.  A few pages of either are enough.  I have seen what a few pages did to Mr Howard Hartwood's man, and I had the burying of him.\n\nThe sign in the floor holds.  Nothing else does.", "108": "A PARCHMENT, ON THE KNIVES\n\nOf the blades on these shelves, only the serpentine one has been dipped in purified water and spoken over.  It will not cut bread.  It will send back where it came from a thing that walks in a coat and a hat and has no face under the hat, and it will do it in one stroke, and nothing else in the world will.", "109": "A PARCHMENT, ON THE SIGN OF MNAR\n\nThe talisman is a pentagram in a heavy circle of grey stone from the land of Mnar, whose people made it against what came up out of the lake at Sarnath.  It does nothing that you carry it.  Laid on the stone where a thing is fed, it stops the feeding, and what the thing throws it throws no more.", "110": "PRISONERS OF ICE\n\nA cheap novel about an expedition in the arctic that finds something under the ice which is better left there.  The pirate was reading it.  He had got as far as the chapter where they decide to dig.", "111": "THE LOG OF THE ASTARTE, PRIVATEER, 1620--\n\nHer master was Ezechiel Pregzt and he was hated on every sea, and not for the usual reasons.  He hid what he took where no man would find it, and the men who knew where did not live.  There was a passenger he took on at Marseilles, a man named Keith, who taught him a way to go on living that did not depend on the body, and the name of what he would have to serve to do it, and the name was Cthulhu.  After that Pregzt did not age.\n\nThe log ends in the Gulf, off the Louisiana shore.  He went ashore and did not come back.  In 1818 a man named Pickford built a house there.", "112": "THE TESTAMENT OF EZECHIEL PREGZT, taken down by his servant\n\nI have waited under this house since the Yankees burned it.  Damn them.  I have waited in a tree in the dark and I have grown into the tree and it into me, and I have waited for one of you to come down.  Hartwood came.  Hartwood would not do; he found the way out.  You will do.  When you are tired, my people will bring you to me, and I will come up in you, and you will see the sun again, though not with your own eyes.\n\nThe one who reads this is already mine.", "113": "A BOOK OF HERALDRY, opened at the Hartwoods\n\nArgent, two sabres in saltire, proper.  A note in pencil: the arms are in the study, over the stair Father never found, and one blade is off them since the fire.  Both must be up for the stair to open, so he said.  He would not say what stair.", "114": "A HISTORY OF DERCETO, in Howard Hartwood's hand\n\n1818: built by Eliah Pickford, ex-pirate, a most loathsome human, by slave labour, over caves.  1862: burned by Union troops; Pickford shot.  1875: the ruin bought by me, for the treasure that must be under it, and rebuilt to the old plan from the old drawings.  The library alone had not burned.  I have found no treasure.  I have found no caves.  Jeremy will have the house and I hope he has better luck with it.", "78": "A PHOTOGRAPH\n\nA man in his fifties in a painter's smock, and a young woman with her arm through his, on the front steps of this house, in the sun.  On the back, in pencil: Emily and me, June."};

const INTRO_TEXT = ["EDWARD CARNBY\n\nOn my door a dull brass plate says PRIVATE DETECTIVE.  The few friends I have call me Carnby; the others call me the Reptile.  When an antique dealer named Gloria Allen sent for me I put on my good shirt and my .38 and expected blackmail.  What she wanted was a piano.  An old piano, in the loft of a house called Derceto, with secret drawers in it, the kind her trade goes mad for.  She gave me a hundred and fifty dollars and a key.\n\nThe last owner, a painter named Hartwood, hanged himself in that loft last month.  The coroner called it suicide and the police have stopped thinking about it.  I read up on the place: murders, curses, lunacy, the kind of house ghosts run away from.  Devil worship makes me smile.  This is my idea of a paid holiday.\n\nI let myself in at dusk.  The doors closed behind me.  Draughts, in these old places.  I went up.", "EMILY HARTWOOD\n\nThe lawyer's letter said that my uncle Jeremy had died by his own hand, in the loft at Derceto, and I did not believe a word of it.  Uncle Jeremy was the least despairing man I knew.  He painted; he read too much, and the wrong things, in that library of his; he played with me on the old piano in the loft when I was small and showed me its secret drawers, and said: look at the piano, Emily.  Look harder.\n\nIf he left a word for anyone it is in that piano, and I am going to read it, whatever the house thinks about it.  The house has always had opinions.\n\nI came at dusk.  The doors closed behind me, the way they always did.  I went up."];
const DEATH_TEXT = "%s\n\nYou do not feel the floor.  Later -- there is a later -- something grey takes you by the ankles and drags you, down the stairs, down more stairs, down a passage on its knees, along the side of a black lake, and lays you on a flat stone in front of a tree that has never seen the sun.  The roots come over the stone.  Something in the tree opens its eyes, which are your eyes now.\n\nThe Master is patient.  He has waited a long time, and he is not waiting any more.";

      const b = Math.trunc(t / beat);
      const inb = t - b * beat;
      const w = 1.0 + 0.006 * tri(osc(wob, 1.3));
      let x = 0.0;
      if (b % 3 === 0) x += 0.9 * tri(osc(bph, root * w)) * env(inb, beat, 0.02);
      else for (let k = 0; k < 3; k++) x += 0.35 * pulse(osc(cph[k], root * chord[k] * w), 0.3) * env(inb, beat * 0.7, 0.02);
      x += 0.5 * tri(osc(tph, root * 4.0 * SEMI[TUNE[b] % 12] * (TUNE[b] >= 12 ? 2.0 : 1.0) * w)) * env(inb, beat, 0.1);
      x = svf_run(horn, x, 0) * 2.0;
      x += (noise() > 0.9975 ? 0.25 * noise() : 0.0) + 0.02 * noise();
      render_buf[i] = x;
    }
    return emit(n, 0.3);
  }
  const under = name.indexOf("cellar") >= 0 || name.indexOf("beneath") >= 0;
  const root = (under ? 41.0 : 55.0) + 5.0 * bst_pick(name, "root", 8);
  const f = [root, root * RATIO[bst_pick(name, "third", 5)], root * RATIO[bst_pick(name, "fifth", 5)] * 2.0];
  for (let k = 0; k < 3; k++) f[k] = Math.trunc(f[k] * 4.0 + 0.5) / 4.0;
  const ph = [[0.0], [0.0], [0.0]], lfo = [0.0], dph = [0.0];
  const wind = {};
  const wfc = 150.0 + 250.0 * bst_draw(name, "wind", 0);
  svf_set(wind, wfc, 1.0);
  const drops = 2 + bst_pick(name, "drops", 2), at = [];
  for (let k = 0; k < drops; k++) at[k] = Math.trunc(bst_draw(name, "drop", k) * (n - Math.trunc(FS / 4)));
  for (let i = 0; i < n; i++){
    const l = tri(osc(lfo, 0.25));
    wind.f = 2.0 * PI * wfc * (1.5 + l) / FS;
    let x = 0.0;
    for (let k = 0; k < 3; k++) x += tri(osc(ph[k], f[k])) * (0.5 - 0.1 * k) * (under ? 0.35 : 1.0);
    if (under){
      x += 0.5 * svf_run(wind, noise(), 1) * (0.6 + 0.4 * l);
      for (let k = 0; k < drops; k++){
        const t = (i - at[k]) / FS;
        if (t >= 0.0 && t < 0.08){
          const e = env(t, 0.08, 0.02);
          x += 1.5 * tri(osc(dph, 2400.0 - 1400.0 * t / 0.08)) * e;
        }
      }
    } else x += 2.0 * svf_run(wind, noise(), 1) * (0.6 + 0.4 * l);
    const edge = i < F20 ? i / F20 : n - i < F20 ? (n - i) / F20 : 1.0;
    render_buf[i] = x * edge;

/* the game side: one line, to whatever is listening */

/* ── the game ─────────────────────────────────────────────── */
let show_read = -1;

function build_ring(){
  const ang = [];

  for (let c = 0; c < BOARD_SIZE; c++)
    if (hex_dist(c, 30) === 2){
      const x = 4.0 * COORD_Q[c] + 2.0 * COORD_R[c], y = 2.0 * COORD_R[c];
      ang[ring2_n] = Math.atan2(y, x);
      ring2[ring2_n++] = c;
    }
  for (let i = 0; i < ring2_n; i++)
    for (let j = i + 1; j < ring2_n; j++)
      if (ang[j] < ang[i]){
        const ta = ang[i]; ang[i] = ang[j]; ang[j] = ta;
        const tc = ring2[i]; ring2[i] = ring2[j]; ring2[j] = tc;
      }
}
function ring_index(c){ for (let i = 0; i < ring2_n; i++) if (ring2[i] === c) return i; return -1; }

/* ── a step ───────────────────────────────────────────────── */
function hostile_near(within){

    if (b.kind === BK_GHOST && !(F.music && room === R_BALL)) continue;

}
function get_wet(){

}
function enter(r, c, from){

function take_way(w){

    say("You unlock " + w.word + " with " + THING[w.key].name + ".");
    break;
  case LK_INSIDE:
    if (!F.lib_lobby){ say(w.word + ": shut, and something holds them shut from the other side."); return 0; }
    break;
  case LK_HIDDEN:
    if (room === R_STUDY && !F.study_open) return -1;
    if (room === R_LIB && !F.secret_open) return -1;
    break;
  case LK_DEVOUR:

    die("You open the front doors, and the night is not on the other side of them.  " +
        "Something green and wet and the size of the porch is, with a mouth, and it " +
        "has been waiting for you since you came in.  You are knocked down, and you are eaten.");
    return 1;
  case LK_STONE:
    if (!F.gem_door){ say("A stone door, with a hole in it the shape of a stone."); return 0; }
    break;
  case LK_HOOK:

  default: break;
  }

  let c = cell_of_char(w.to, w.to_ch);

}
function step_onto(target){

  sound_step(target);
  if (k.ground === G_HOLE){
    if (room === R_TUNNEL2)
      die("The web gives, and you go down the spider's hole, and it is a long way down, and the spider comes down after you.");
    else
      die("The ground is not there.  You fall, and the falling does not stop for a long time.");
    return;
  }
  if (k.ground === G_BRIDGE){
    if (room === R_HALL3){
      die("The boards give way under you with a crack like a shot, and you go through the floor of the hallway, and the floor below it.");
      return;
    }

function move_dir(d){
  const target = step_cell(cell, d);
  if (target < 0){ say("The wall."); return; }
  const b = being_at(room, target);
  if (b){ player_attack(b); return; }
  if (worm_at(room, target)){ say("The worm is there, all of it."); return; }
  const k = RS[room].c[target];
  if (k.thing >= 0 && !(THING[k.thing].flags & TF_PASS)){
    if (k.thing === T_ARMOUR && !F.armour_broken){
      k.thing = -1;

/* ── pushing ──────────────────────────────────────────────── */
function push_thing(target, d){
  const k = RS[room].c[target];
  const t = k.thing;
  if (t === T_ROCK){
    k.thing = -1; F.rock_moved = 1;
    say("You put your shoulder to the boulder and it goes over with a crash, and there is a dark opening behind where it was.");
    return;
  }
  const beyond = step_cell(target, d);
  if (beyond < 0 || RS[room].c[beyond].thing >= 0 || being_at(room, beyond) ||
      !passable(room, beyond, 0, 0) || RS[room].c[beyond].ground === G_HOLE ||
      RS[room].c[beyond].ground === G_WATER || RS[room].c[beyond].ground === G_VOID ||
      way_at(room, beyond)){
    say(THING[t].name + " will not go that way.");
    return;
  }
  RS[room].c[beyond].thing = t;
  k.thing = -1;
  const c = container_at(room, target);
  if (c) c.cell = beyond;
  cell = target;
  say("You push " + THING[t].name + ".");
  if (room === R_ATTIC){
    if (t === T_WARDROBE){
      let near = 0;
      for (let dd = 0; dd < 6; dd++) if (step_cell(2, dd) === beyond) near = 1;
      if (near && !F.window_blocked){ F.window_blocked = 1; say("The wardrobe stands against the window now.  Nothing is coming in that way."); }
      else if (!near && F.window_blocked){ F.window_blocked = 0; }
    }
    if (t === T_CHEST){
      if (RS[room].c[beyond].ground === G_TRAP && !F.trap_blocked){ F.trap_blocked = 1; say("The chest sits square on the trapdoor.  Nothing is coming up that way."); }
      else if (RS[room].c[beyond].ground !== G_TRAP) F.trap_blocked = 0;
    }

    F.clock_moved = 1;
    RS[room].c[target].thing = T_HOLEWALL;
    add_container(room, target, T_KEY_STUDY, -1, 0);
    cell = step_cell(target, (d + 3) % 6);

  }
}

/* ── taking and dropping ──────────────────────────────────── */

      F.gaunts_gone = 1;
      for (const bb of beings) if (bb.alive && bb.kind === BK_NIGHTGAUNT) bb.alive = 0;
      say("The second mirror faces the first, and the two things see themselves, and shriek, and fold up into purple smoke.  The stairs are clear.");
    }
    break; }
  case T_STATUETTE:
    say("It is far too heavy to do anything with but throw.");
    break;
  case T_RECORD: case T_GRAMOPHONE:
    if (!have(T_RECORD) || !have(T_GRAMOPHONE)){ say(have(T_RECORD) ? "You have nothing to play it on." : "You have nothing to play."); break; }
    if (room === R_BALL){
      if (!F.music){
        F.music = 1;
        for (const b of beings)
          if (b.alive && b.room === R_BALL && b.kind === BK_GHOST){
            const slot = Math.trunc(b.state / 2) * 3 + (b.state & 1);
            b.state = slot;
            b.cell = ring2[slot % ring2_n];
          }
        say("You wind the gramophone and put the record on.  Danse Macabre.  The couples take hands and begin to dance, round and round the middle of the floor, and do not stop.");
        sound_scene();
      } else say("The record is playing.");
    } else say("You play the record.  Danse Macabre, thin and scratched, and nobody here dances.");
    break;
  case T_COVER:
    c = adjacent_thing(T_AXEPAINTING);
    if (c < 0){ say("An old Indian cover.  It would cover something."); break; }
    pack_remove(T_COVER); F.painting_covered = 1;
    say("You hang the cover over the trapper and his hatchet.  The gallery is only a gallery.");
    break;
  case T_FALSEBOOK:
    if (room === R_LIB && F.mechanism && (adjacent_thing(T_INDENT) >= 0 || hex_dist(cell, 10) <= 1 || hex_dist(cell, 25) <= 1)){
      pack_remove(T_FALSEBOOK); F.secret_open = 1;
      RS[R_LIB].c[17].thing = -1; RS[R_LIB].c[17].ground = G_DOOR;
      say("The false book goes into the space beside the lever, and the lever goes over, and the indentation in the books swings inward.");
    } else if (room === R_LIB && !F.mechanism) say("A book that is a box.  There will be somewhere it fits.");
    else say("A false book.  There is nothing here it fits.");
    break;
  case T_SABRE: case T_SABRE_BROKEN:
    c = adjacent_thing(T_COATOFARMS);
    if (c < 0){ if (t === T_SABRE){ set_wield(t); say("You take the sabre in hand."); } else say("Two halves of a sabre.  They belong somewhere."); break; }
    pack_remove(t); F.study_open = 1;
    { const s = cell_of_char(R_STUDY, 'S'); if (s >= 0) RS[R_STUDY].c[s].ground = G_STAIRS; }
    say("You set the sabre in the arms, " + (t === T_SABRE_BROKEN ? "both halves of it" : "and it fits") +
        ".  Something turns behind the wall, and the floor in the middle of the study opens on a flight of stone stairs.");
    break;
  case T_TALISMAN:
    c = adjacent_thing(T_ALTAR);
    if (c < 0){ say("A pentagram in a circle of grey stone.  It does nothing that you carry it."); break; }
    pack_remove(T_TALISMAN); F.talisman = 1;
    say("You lay the talisman on the altar.  The roots draw back from it.  The tree stops throwing fire.");
    break;
  case T_GEM:
    c = adjacent_thing(T_STONEDOOR);
    if (c < 0){ say("A stone the colour of nothing on earth."); break; }
    pack_remove(T_GEM); F.gem_door = 1;
    RS[room].c[c].thing = -1; RS[room].c[c].ground = G_DOOR;
    say("The gem goes into the hole in the door as if it had been cut for it, and the door swings open.");
    break;
  case T_HOOK:
    c = adjacent_thing(T_HOOKDOOR);
    if (c < 0){ say("An iron hook.  It would go through a ring."); break; }
    F.hook_door = 1;
    RS[room].c[c].thing = -1; RS[room].c[c].ground = G_DOOR;
    say("The hook goes through the ring and you heave, and the stone door grinds open on a stair going up.");
    break;
  case T_VASE:
    say("A vase.  Something rattles in it, and the neck is too narrow for a hand.  You could throw it.");
    break;
  case T_ARROW:
    say("An arrow.  The bow shoots them: f.");
    break;
  default:
    if (THING[t].flags & TF_READ){ read_thing(t); break; }
    if (THING[t].flags & TF_KEY){ say("It opens a lock.  Walk up to the lock."); break; }
    if (THING[t].flags & TF_WEAPON){
      set_wield(t);
      say("You take " + THING[t].name + " in hand.");
      break;
    }
    say(THING[t].desc);
  }
}

/* ── throwing ─────────────────────────────────────────────── */
function throw_thing(t, d){
  let c = cell, last = cell, hit_being = 0;
  let hit = null;
  let hit_thing = -1, hit_cell = -1;
  for (let n = 0; n < 5; n++){
    const nx = step_cell(c, d);
    if (nx < 0) break;
    const b = being_at(room, nx);
    if (b){ hit = b; hit_being = 1; hit_cell = nx; break; }
    const k = RS[room].c[nx];
    if (k.thing >= 0 && !(THING[k.thing].flags & TF_PASS)){ hit_thing = k.thing; hit_cell = nx; break; }
    if (k.ground === G_VOID) break;
    c = nx;
    if (k.ground !== G_HOLE) last = nx;
  }
  pack_remove(t);
  sound_say("whoosh throw");
  if (t === T_VASE){
    RS[room].c[last].thing = T_KEY_DRESSER;
    say("The vase breaks, and among the pieces there is a small brass key.");
    return;
  }
  if (t === T_STATUETTE && ((hit_thing === T_ARMOUR) || (hit_being && hit.kind === BK_ARMOUR))){
    if (hit_being) hit.alive = 0;
    RS[room].c[hit_cell].thing = T_SWORD;
    F.armour_broken = 1;
    RS[room].c[last].thing = T_STATUETTE;
    say("The statuette takes the armour in the chest and the armour comes apart with a crash like a dropped kitchen, and the sword clatters on the floor.");
    return;
  }
  if (t === T_LAMP){
    if (hit_thing === T_TREE && lamp_lit){
      F.tree_burned = 1;
      sound_say("whoosh fire"); sound_say("call the devourer");
      for (const b of beings) if (b.room === R_END) b.alive = 0;
      say("The lamp breaks against the trunk and the oil goes up, and the tree goes up, and something in the tree screams with a voice that has not been used since 1862.  The cavern shakes.  Rock is coming down.  Go.");
      return;
    }
    lamp_broken = 1;
    say("The lamp breaks" + (lamp_lit ? ", and the oil burns out on the floor," : "") + " and that is the end of the lamp.");
    return;
  }
  if (hit_being){
    const dmg = Math.trunc(THING[t].weight / 3) + 1;
    if (BEAST[hit.kind].flags & BF_IMMUNE){ say(THING[t].name + " bounces off " + BEAST[hit.kind].name + "."); }
    else {
      hit.hp -= dmg;
      say(THING[t].name + " hits " + BEAST[hit.kind].name + ".");
      if (hit.hp <= 0) kill_being(hit);
    }
    RS[room].c[last].thing = t;
    return;
  }
  if (RS[room].c[last].ground === G_WATER){ say(THING[t].name + " goes into the water."); return; }
  RS[room].c[last].thing = t;
  say("You throw " + THING[t].name + ".  It lands.");
}

/* ── shooting ─────────────────────────────────────────────── */
function fire(){
  const w = wielded();
  if (w !== T_RIFLE && w !== T_REVOLVER && w !== T_BOW){ say("You are not holding anything that fires.  i, then > on a gun or the bow."); return; }
  if (w === T_RIFLE && rifle_rounds <= 0){ say("The rifle is empty."); return; }
  if (w === T_REVOLVER && revolver_rounds <= 0){ say("The revolver is empty."); return; }
  if (w === T_BOW && !have(T_ARROW)){ say("You have no arrows."); return; }
  let best = null, bd = 99;
  for (const b of beings){
    if (!b.alive || b.room !== room) continue;
    if (b.kind === BK_GHOST) continue;
    const d = hex_dist(b.cell, cell);
    if (d < bd && visible(b.cell)){ bd = d; best = b; }
  }
  if (w === T_BOW && room === R_GALLERY && !F.painting_shot && !best){
    const p = cell_of_char(R_GALLERY, 'q');
    if (hex_dist(cell, p) > 6){ say("You are too far from the painting at the end for that."); return; }
    pack_remove(T_ARROW);
    sound_say("whoosh arrow");
    F.painting_shot = 1;
    RS[R_GALLERY].c[p].thing = -1;
    say("The arrow goes into the painting of the door, and the painting lets out a breath of purple smoke and is gone, and there is a door where it was.");
    turn++;
    return;
  }
  if (!best){ say("Nothing to shoot at."); return; }
  if (w === T_RIFLE) rifle_rounds--;
  else if (w === T_REVOLVER) revolver_rounds--;
  else pack_remove(T_ARROW);
  sound_say(w === T_RIFLE ? "shot rifle" : w === T_REVOLVER ? "shot revolver" : "whoosh arrow");
  const K = BEAST[best.kind];
  const r = roll(1, 20) + 4 + (bd <= 2 ? 3 : 0);
  if ((K.flags & BF_IMMUNE) && K.needs !== w){
    say("You " + (w === T_BOW ? "put an arrow into" : "shoot") + " " + K.name + " and it takes no notice.");
    if (w === T_BOW && roll(0, 1)) RS[room].c[best.cell].thing = T_ARROW;
    turn++; return;
  }
  if (r < K.dodge){
    say("You miss.  " + (w === T_RIFLE ? rifle_rounds : w === T_REVOLVER ? revolver_rounds : count_of(T_ARROW)) + " " + (w === T_BOW ? "arrows" : "rounds") + " left.");
    turn++; return;
  }
  const dmg = w === T_RIFLE ? roll(8, 14) : w === T_REVOLVER ? roll(5, 9) : roll(4, 8);
  best.hp -= dmg;
  say("You " + (w === T_BOW ? "put an arrow into" : "shoot") + " " + K.name + ".  " + (best.hp <= 0 ? "" : "It keeps coming."));
  if (best.hp <= 0) kill_being(best);
  turn++;
}

/* ── jumping ──────────────────────────────────────────────── */
function jump_dir(d){
  const over = step_cell(cell, d);
  const land = over >= 0 ? step_cell(over, d) : -1;
  if (over < 0 || land < 0){ say("There is nowhere to land."); return; }
  const k = RS[room].c[land];
  if (k.ground === G_VOID || k.ground === G_HOLE || k.ground === G_WATER || k.ground === G_BRIDGE ||
      (k.thing >= 0 && !(THING[k.thing].flags & TF_PASS)) || being_at(room, land)){
    say("You would not land on anything you could stand on.");
    return;
  }
  if (RS[room].c[over].ground !== G_WATER && RS[room].c[over].ground !== G_HOLE &&
      RS[room].c[over].ground !== G_BRIDGE && RS[room].c[over].thing < 0){
    say("There is nothing there to jump over.  You walk.");
    return;
  }
  if (roll(1, 10) === 1 && RS[room].c[over].ground === G_WATER){
    say("You jump short.");
    cell = over; get_wet();
    turn++;
    return;
  }
  cell = land;
  F.wet = 0;
  sound_step(land);
  say("You jump, and land.");
  turn++;
}

/* ── fighting ─────────────────────────────────────────────── */
let weapon_name = "";
function weapon_damage(w){
  switch (w){
  case T_KNIFE: weapon_name = "the knife"; return roll(2, 4);
  case T_SABRE: weapon_name = "the sabre"; return roll(3, 6);
  case T_SABRE_BROKEN: weapon_name = "the broken sabre"; return roll(1, 3);
  case T_SWORD: weapon_name = "the sword"; return roll(4, 8);
  case T_DAGGER: weapon_name = "the dagger"; return roll(1, 3);
  case T_POKER: weapon_name = "the poker"; return roll(2, 4);
  case T_RIFLE: weapon_name = "the rifle butt"; return roll(1, 3);
  case T_REVOLVER: weapon_name = "the revolver butt"; return roll(1, 2);
  case T_BOW: weapon_name = "the bow"; return 1;
  default: weapon_name = who === WHO_CARNBY ? "your fist" : "your boot";
           return roll(1, 2) + (who === WHO_CARNBY ? 1 : 0);
  }
}
function kill_being(b){
  b.alive = 0;
  const K = BEAST[b.kind];
  sound_say("call " + K.name);
  if (b.kind === BK_PIRATE){
    F.pirate_dead = 1;
    RS[b.room].c[b.cell].thing = T_KEY_BALL;
    say("The pirate goes down, and goes to dust, and out of the dust a key on a purple ribbon.");
    return;
  }
  if (b.kind === BK_VAGABOND){
    F.vagabond_dead = 1;
    say("One stroke of the curved blade and the vagabond stops, and thins, and is smoke, and the smoke is gone.");
    return;
  }
  if (b.kind === BK_DEEPONE){
    say(K.name + " goes under and does not come up.  Something else stirs in the water.");
    b.timer = 8;
    return;
  }
  say(K.name + " is dead.");
}
function player_attack(b){
  const K = BEAST[b.kind];
  const w = wielded();
  if (K.flags & BF_TOUCH){
    die(room === R_BALL
        ? "You touch one of the dancers.  The dancer turns, and is not in evening dress any more, and is not anything you have a word for, and the sound it makes is the last thing you hear."
        : "You touch the figure in the chair.  It turns its head.  It is very cold, and then so are you.");
    return;
  }
  if (b.kind === BK_GHOUL && b.state === 1){ say("It is eating.  It takes no notice of you."); return; }
  if (b.kind === BK_WORM){ say("You hit the worm.  The worm does not notice."); turn++; return; }
  if ((K.flags & BF_IMMUNE) && K.needs !== w){
    sound_say("blow " + (b.kind === BK_PIRATE || b.kind === BK_ARMOUR ? "steel" : "thud"));
    if (b.kind === BK_PIRATE) say("The pirate parries, steel on steel, and laughs.");
    else if (b.kind === BK_ARMOUR) say("Your blow rings on the plate and does nothing.");
    else if (b.kind === BK_NIGHTGAUNT) say("Your blow goes into it as into cold water, and it takes no notice.");
    else if (b.kind === BK_BATHTHING) say("You hit the thing and it is like hitting the bath.");
    else say((w >= 0 ? THING[w].name : "Your fist") + " goes through " + K.name + " as through smoke.");
    turn++;
    return;
  }
  if (b.kind === BK_VAGABOND){ kill_being(b); turn++; return; }
  const r = roll(1, 20) + 3 + (who === WHO_CARNBY ? 1 : 0);
  if (r < K.dodge){ sound_say("whoosh swing"); say("You swing at " + K.name + " and miss."); turn++; return; }
  let dmg = weapon_damage(w);
  const wn = weapon_name;
  sound_say("blow thud");
  if (w === T_SABRE){
    if (++sabre_wear >= 6){
      pack_remove(T_SABRE); pack_add(T_SABRE_BROKEN);
      say("The sabre breaks in two on the blow.  You keep both halves.");
    }
  }
  if (b.kind === BK_PIRATE){
    const d = dir_toward(cell, b.cell);
    const back = d >= 0 ? step_cell(b.cell, d) : -1;
    if (back >= 0 && passable(room, back, 1, BK_PIRATE) && !being_at(room, back)){
      b.cell = back;
      say("You hit the pirate with the sword and he gives ground.");
    } else {
      dmg *= 2;
      say("The pirate has the wall at his back and nowhere to go, and the sword goes home.");
    }
    b.hp -= dmg;
    if (b.hp <= 0) kill_being(b);
    turn++;
    return;
  }
  b.hp -= dmg;
  if (b.hp <= 0){ say("You hit " + K.name + " with " + wn + ".  "); kill_being(b); }
  else say("You hit " + K.name + " with " + wn + ".");
  turn++;
}
function beast_attack(b){
  const K = BEAST[b.kind];
  if (K.flags & BF_TOUCH){
    die("One of the dancers passes through you on the turn, and you feel every year of the two hundred it has been dead.");
    return;
  }
  const guard = 10 + (who === WHO_EMILY ? 2 : 0) + (wielded() === T_SWORD ? 1 : 0);
  const r = roll(1, 20) + K.hit;
  if (r < guard){ say(K.name + " " + K.verb + " at you and misses."); return; }
  const dmg = roll(K.lo, K.hi);
  hp -= dmg;
  sound_say("call " + K.name);
  say(K.name + " " + K.verb + " you.  " + dmg + ".");
  if (hp <= 0){
    let how = K.name + " " + K.verb + " you once more, and that is enough.";
    how = how.charAt(0).toUpperCase() + how.slice(1);
    die(how);
  }
}

/* ── the beasts' turn ─────────────────────────────────────── */
function beast_move_toward(b, target){
  let best = -1, bd = hex_dist(b.cell, target);
  for (let d = 0; d < 6; d++){
    const c = step_cell(b.cell, d);
    if (c < 0 || c === cell) continue;
    if (!passable(b.room, c, 1, b.kind) || being_at(b.room, c)) continue;
    const dd = hex_dist(c, target);
    if (dd < bd){ bd = dd; best = c; }
  }
  if (best >= 0) b.cell = best;
}
function beast_act(b){
  const K = BEAST[b.kind];
  const reach = (K.flags & BF_REACH2) ? 2 : 1;
  if (b.kind === BK_GHOUL && b.state === 1) return;
  if (b.kind === BK_GHOST){
    if (room !== R_BALL || !F.music) return;
    const slot = b.state;
    const next = ring2[(slot + 1) % ring2_n];
    b.state = (slot + 1) % ring2_n;
    if (next === cell){ beast_attack(b); return; }
    b.cell = next;
    return;
  }
  if (b.kind === BK_WORM){
    let i = ring_index(b.cell);
    if (i < 0) i = 0;
    const next = ring2[(i + 1) % ring2_n];
    b.trail[1] = b.trail[0]; b.trail[0] = b.cell;
    if (next === cell){
      hp -= roll(6, 10);
      say("The worm comes round and there is no room in the tunnel for both of you.");
      if (hp <= 0) die("The worm comes round the tunnel and you are in the tunnel, and then you are in the worm.");
      return;
    }
    b.cell = next;
    if (hex_dist(b.cell, cell) <= 1 || hex_dist(b.trail[0], cell) <= 1){
      hp -= roll(3, 6);
      say("The worm's flank scrapes you along the wall.");
      if (hp <= 0) die("The worm's flank scrapes you along the tunnel wall, and keeps scraping.");
    }
    return;
  }
  if (hex_dist(b.cell, cell) <= reach){
    if (!(K.flags & BF_SWIMS) || RS[room].c[b.cell].ground === G_WATER){ beast_attack(b); return; }
  }
  if (K.flags & BF_STILL) return;
  if (K.flags & BF_HUNT){
    if (room_dark(room) && hex_dist(b.cell, cell) > 3 && b.kind !== BK_VAGABOND) return;
    beast_move_toward(b, cell);
  }
}
function beasts_turn(){
  for (let i = 0; i < beings.length && !dead; i++){
    const b = beings[i];
    if (b.room !== room) continue;
    if (!b.alive){
      if (b.kind === BK_DEEPONE && b.timer > 0 && --b.timer === 0){
        let best = -1, bd = -1;
        for (let c = 0; c < BOARD_SIZE; c++)
          if (RS[room].c[c].ground === G_WATER && !being_at(room, c) && hex_dist(c, cell) > bd){ bd = hex_dist(c, cell); best = c; }
        if (best >= 0){ b.alive = 1; b.hp = BEAST[BK_DEEPONE].hp; b.cell = best; say("Something comes up out of the water."); }
      }
      continue;
    }
    const K = BEAST[b.kind];
    if ((K.flags & BF_SLOW) && (turn & 1)) continue;
    beast_act(b);
    if (!dead && (K.flags & BF_FAST) && b.alive) beast_act(b);
  }
}

/* ── the rooms' own doings ────────────────────────────────── */
function free_cell_near(c){
  if (!being_at(room, c) && passable(room, c, 1, BK_GHOUL) && c !== cell) return c;
  for (let d = 0; d < 6; d++){
    const n = step_cell(c, d);
    if (n >= 0 && n !== cell && !being_at(room, n) && passable(room, n, 1, BK_GHOUL)) return n;
  }
  return -1;
}
function room_enter(from){
  switch (room){
  case R_HALL3:
    if (from === R_SPARE && !F.hall_ghoul){
      F.hall_ghoul = 1;
      const c = free_cell_near(12);
      if (c >= 0){ spawn(BK_GHOUL, room, c); say("You open the door and a dead man is standing on the other side of it."); }
    }
    break;
  case R_DRESS: if (!F.dress_t) F.dress_t = 1; break;
  case R_BED3: if (!F.bed_t) F.bed_t = 1; break;
  case R_CLOSET: if (!F.closet_t) F.closet_t = 1; break;
  case R_LIB: if (!F.lib_t) F.lib_t = 1; break;
  case R_SMOKE: F.smoke_turns = 0; break;
  default: break;
  }
}
function room_tick(){
  switch (room){
  case R_ATTIC:
    F.attic_t++;
    if (F.attic_t === 10 && !F.beak_came){
      F.beak_came = 1;
      if (F.window_blocked) say("Something hits the wardrobe from outside, hard, twice, and stops.");
      else { const c = free_cell_near(8); if (c >= 0){ spawn(BK_BEAKED, room, c); say("The window comes in, in a burst of glass, and something comes in with it."); } }
    }
    if (F.attic_t === 20 && !F.ghoul_came){
      F.ghoul_came = 1;
      if (F.trap_blocked) say("Something pushes up at the trapdoor from below, and cannot lift the chest, and stops.");
      else { const c = free_cell_near(47); if (c >= 0){ spawn(BK_GHOUL, room, c); say("The trapdoor lifts and a dead man climbs up through it."); } }
    }
    break;
  case R_DRESS:
    if (F.dress_t > 0 && F.dress_t < 20){ F.dress_t++; if (F.dress_t === 4){ const c = free_cell_near(7); if (c >= 0){ spawn(BK_GHOUL, room, c); say("Another of them comes in from the hall behind you."); } } }
    break;
  case R_BED3:
    if (F.bed_t > 0 && F.bed_t < 20){ F.bed_t++; if (F.bed_t === 5){ const c = free_cell_near(16); if (c >= 0){ spawn(BK_BEAKED, room, c); say("The window goes, and something with a beak comes through it."); } } }
    break;
  case R_CLOSET:
    if (F.closet_t > 0 && F.closet_t < 20){ F.closet_t++; if (F.closet_t === 3){ const c = free_cell_near(26); if (c >= 0){ spawn(BK_GHOUL, room, c); say("A dead man comes into the closet after you, and there is no room in here for both of you."); } } }
    break;
  case R_LIB:
    if (F.lib_t > 0 && F.lib_t < 20 && !F.vagabond_dead){ F.lib_t++; if (F.lib_t === 4){ const c = free_cell_near(hex_dist(cell, 6) > 4 ? 6 : 44); if (c >= 0){ spawn(BK_VAGABOND, room, c); say("Between the shelves, at the far end, something tall in a hat turns towards you and starts to walk."); } } }
    break;
  case R_GALLERY:
    if (!F.painting_covered){
      const x = 16 + 4 * COORD_Q[cell] + 2 * COORD_R[cell];
      if (x >= 10 && roll(1, 10) <= 7){
        const dmg = roll(3, 5);
        hp -= dmg;
        sound_say("whoosh hatchet"); sound_say("blow thud");

const SHAPE_BRICK = 0, SHAPE_HEX = 1, SHAPE_FINE = 2, SHAPE_N = 3;
const SHAPE_NAME = ["brick", "hex", "fine"];
let tile_shape = SHAPE_FINE;
const TILE_W = 4, PIX_H = 4, BOARD_Y = 1;
let you_face = 223, you_shirt = 240, you_legs = 59;
function you_px(gx, gy, gw, gh){
  const hexed = tile_shape !== SHAPE_BRICK;
  const top = (gh >= 4 && hexed) ? 1 : 0;
  const hd = (gh - top >= 4) ? 2 : 1;
  const rest = gh - top - hd;
  const lg = rest >= 2 ? (rest >> 1) : rest;
  const sh = rest - lg;
  if (gy < top) return -1;
  const band = gy < top + hd ? 0 : gy < top + hd + sh ? 1 : 2;
  let w = band === 0 ? Math.trunc(gw * 3 / 8) : band === 1 ? Math.trunc(gw * 3 / 4) : (gw >> 1);
  if (w < 1) w = 1;
  const x = (gw - w) >> 1;
  if (gx < x || gx >= x + w) return -1;
  return band === 0 ? you_face : band === 1 ? you_shirt : you_legs;
}
function wall_colours(r){
  let cap, body;
  switch (ROOM[r].storey){
  case S_BENEATH: cap = 101; body = 59; break;
  case S_CELLAR: cap = 245; body = 239; break;
  default: cap = 187; body = 138; break;
  }
  if (r === R_SECRET){ cap = 245; body = 239; }
  return [cap, body];
}
function put_pixel(fine, tx, gx, y, c){

  else px(tx + gx, y, c);
}
function draw_cell(tx, ty, r, c, mark, lit){
  const k = RS[r].c[c];
  const G = GROUND[k.ground];
  let base = G.bg, acc = G.fg, sprinkle = 32 + G.prom * 10;
  const fine = tile_shape === SHAPE_FINE ? 1 : 0, hexed = tile_shape !== SHAPE_BRICK;
  const gw = fine ? TILE_W * 2 : TILE_W, gh = hexed ? PIX_H + 1 : PIX_H;
  const tip = gw >> 2, tipw = gw >> 1;
  const y0 = ty * 2 + (hexed ? 1 : 0);
  const tex = hash3u(Math.imul(r, 7919) >>> 0, Number(SEED & 0xFFFFFFFFn), 3);
  const t = k.thing;
  const solid = t >= 0 && !(THING[t].flags & (TF_PASS | TF_TAKE));
  let cap = 0, body = 0;
  if (t === T_WALL){ const wc = wall_colours(r); cap = wc[0]; body = wc[1]; }
  else if (solid){ cap = lighter(THING[t].fg); body = THING[t].fg; }
  const growing = t >= 0 && (THING[t].flags & TF_PLANT) && grow_tile(r, c, t, gw, gh);
  const b = being_at(r, c);
  const beasting = b && beast_pixels(BEAST[b.kind].name, BEAST[b.kind].fg, gw, gh);
  const wormy = worm_at(r, c);
  if (k.ground === G_VOID){ base = acc = 16; sprinkle = 0; }
  if (mark === 1) sprinkle = 0;
  const wfg = BEAST[BK_WORM].fg;
  for (let gy = 0; gy < gh; gy++){
    let lo = 0, hi = gw;
    if (hexed && (gy === 0 || gy === gh - 1)){ lo = tip; hi = tip + tipw; }
    for (let gx = lo; gx < hi; gx++){
      const h = hash3u(tex, c, gy * 8 + gx);
      let col = ((h & 0xFF) < sprinkle) ? acc : base;
      if (k.ground === G_PENTA){
        const cx = gx - (gw >> 1), cy = gy - (gh >> 1);
        if ((cx === 0) || (cy === 0) || (cx === cy) || (cx === -cy)) col = acc;
      }
      if (k.ground === G_TRAP) col = ((gx + gy) & 1) ? acc : base;
      if (k.ground === G_STAIRS) col = (gy & 1) ? acc : base;
      if (k.ground === G_BRIDGE && r === R_HALL3) col = shade(col, 0.7);
      if (k.ground === G_BRIDGE && r !== R_HALL3 && r !== R_CHASM) col = (gy & 1) ? 180 : 137;
      if (solid){
        col = gy === 0 ? cap : gy === gh - 1 ? darker(body) : body;
        if (t === T_WINDOW) col = ((gx ^ gy) & 1) ? 17 : 111;
        if (t === T_TREE) col = 58;
        if (t === T_FARPAINTING || t === T_AXEPAINTING || t === T_PAINTING_MAN || t === T_PAINTING_WOMAN)
          col = (gy === 0 || gy === gh - 1 || gx === lo || gx === hi - 1) ? 130 : ((h >>> 9) & 1 ? 138 : 102);
        if (t === T_ARMOUR) col = (gy === 0) ? 254 : ((h >>> 9) & 3) ? 251 : 245;
      } else if (t >= 0 && (THING[t].flags & TF_TAKE)){
        let w = THING[t].size >= 'K' ? (gw >> 1) : THING[t].size === 'J' ? Math.trunc(gw * 3 / 8) : (gw >> 2);
        const hh = THING[t].size >= 'K' ? 3 : THING[t].size === 'J' ? 2 : 1;
        if (w < 2) w = 2;
        const x0 = (gw - w) >> 1, yy0 = (gh - hh) >> 1;
        if (gx >= x0 && gx < x0 + w && gy >= yy0 && gy < yy0 + hh) col = THING[t].fg;
      }
      if (growing && grow_px[gy * GROW_MAXW + gx]) col = grow_px[gy * GROW_MAXW + gx];
      if (wormy) col = (gy === 0 || gy === gh - 1) ? darker(wfg) : ((h >>> 7) & 1) ? wfg : lighter(wfg);
      if (beasting && bst_px[gy * BST_MAXW + gx]) col = bst_px[gy * BST_MAXW + gx];
      if (mark === 1){ const me = you_px(gx, gy, gw, gh); if (me >= 0) col = me; }
      if (!lit) col = (t === T_WALL && hex_dist(c, cell) <= 2) ? 233 : 16;
      else if (room_dark(r)) col = shade(col, 0.75);
      put_pixel(fine, tx, gx, y0 + gy, col);
    }
  }
}

function draw_moon(x0, y0, w, rows){
  const fine = tile_shape === SHAPE_FINE ? 1 : 0, sx = fine ? 2 : 1;
  const pw = w * sx, ph = rows * 2;
  const cx = pw * 0.5, cy = ph * 0.46, R = ph * 0.42;
  const lx = 0.80, ly = -0.15, lz = 0.58;
  for (let y = 0; y < ph; y++)
    for (let x = 0; x < pw; x++){
      let col = 233;
      const h = hash3u(x, y, 99);
      const xf = x / pw;
      const roof = ph * (0.72 + 0.16 * Math.abs(Math.sin(xf * 9.0)) - (xf > 0.42 && xf < 0.58 ? 0.22 : 0.0));
      if (y > roof) col = 16;

      const nx = (x - cx) / (R * sx), ny = (y - cy) / R;
      const d2 = nx * nx + ny * ny;
      if (d2 <= 1.0 && y <= roof){
        const nz = Math.sqrt(1.0 - d2);
        let lam = nx * lx + ny * ly + nz * lz;
        if (lam < 0.0) lam = 0.0;
        let g = 232 + Math.trunc(2 + 21 * lam);
        if (((h >>> 12) & 0x1F) < 4) g -= 2;
        if (g < 232) g = 232;

function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){
      if (s[p + len] === ' ') last_space = len;
      len++;
    }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}

  case 'j': ask_dir = 'j'; break;
  case 'f': fire(); end_turn(); break;
  case 'c': show_look = 1; break;

/* the C's --keys: play a string, report where it left you, and the screen's hash */
function check_keys(seedText, whoName, keys){
  const out = [];
  start_game(seedText, whoName, 1);
  show_intro = 0; you_shirt = who === WHO_CARNBY ? 240 : 131;
  for (let i = 0; i < keys.length; i++){
    let c = keys[i];
    if (c === '\\' && i + 1 < keys.length){ i++; if (keys[i] === 'n'){ handle_key('\n'); continue; } c = keys[i]; }
    if (!handle_key(c)) break;
    if (dead || won) break;
  }
  out.push("room " + ROOM[room].name + "  cell " + cell + "  hp " + hp + "/" + maxhp + "  turn " + turn + "  " + (dead ? "DEAD: " : won ? "WON" : "") + (dead ? dead_how : ""));

  out.push("last: " + message[0]);
  out.push("      " + message[1]);
  for (const b of beings) if (b.alive && b.room === room) out.push("here: " + BEAST[b.kind].name + " at " + b.cell + " hp " + b.hp);
  screen_w = 80; screen_h = 25;
  compose_screen();
  out.push("screen " + pad0(fb_hash().toString(16), 8));
  return out;

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same synth and played
 * as a buffer. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left the house.\n\nClose the tab, or press n to go in again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: arrows are w x d a as in lonelydarkness.c, Enter
 * is the pack's >, Escape is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return 'w';
  if (e.key === "ArrowDown") return 'x';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
