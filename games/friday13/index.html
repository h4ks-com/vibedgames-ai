function at(){ return c_place[who]; }
function night(){ return tick >= Math.trunc(TURNS_A_DAY / 2); }
function when_it_is(){ return night() ? "night" : "day"; }
function alive_n(){ let n = 0; for (let i = 0; i < COUNSELOR_N; i++) if (c_alive[i]) n++; return n; }
function end_it(how, win){
  if (gameover) return;
  gameover = 1;
  won = win ? 1 : 0; lost = win ? 0 : 1;
  dead_how = how;
  sound_say(win ? "tune bell" : "blow toll");
  say(how);
  cap_msg();
}
function kill_counselor(i, how){
  if (!c_alive[i]) return;
  c_alive[i] = 0;
  sound_say("blow toll");
  say(COUNSELOR[i] + " is dead: " + how + ".");
  if (!alive_n()) end_it("All six counselors are dead.  Jason has the camp.", 0);
  else if (i === who){
    for (let k = 0; k < COUNSELOR_N; k++) if (c_alive[k]){ who = k; say("You are " + COUNSELOR[k] + " now."); break; }
  }
}
function popcount(x){ let n = 0; x = x >>> 0; while (x){ n += x & 1; x >>>= 1; } return n; }

/* ── the turn ─────────────────────────────────────────────── */
const P_PLAY = 0, P_OVER = 1;
let phase = P_PLAY;
function jason_here(){ return jason_place === at(); }
function muddled(p){ return PLACE[p].kind === PL_WOODS || PLACE[p].kind === PL_CAVE; }
function jason_move(){
  if (gameover) return;
  let want = -1;
  if (alarm_on === 1){ for (let p = 0; p < PLACE_N; p++) if (PLACE[p].kind === PL_SHORE){ want = p; break; } }
  else if (alarm_on === 2) want = c_place[alarm_who];
  if (want >= 0 && jason_place !== want && roll(0, 1)){
    for (let d = 0; d < 4; d++){ const e = PLACE[jason_place].exit[d]; if (e >= 0 && (e === want || roll(0, 3) === 0)){ jason_place = e; return; } }
  }
  if (roll(0, 2) === 0){
    for (let k = 0; k < 8; k++){ const d = roll(0, 3); const e = PLACE[jason_place].exit[d]; if (e >= 0 && PLACE[e].kind !== PL_LOCKED){ jason_place = e; return; } }
  }
}
function alarm_ring(){
  if (alarm_on || gameover) return;
  if (alarm_cool > 0){ alarm_cool--; return; }
  if (roll(0, 99) >= 6) return;
  if (children > 0 && roll(0, 1)){ alarm_on = 1; alarm_at = 8; sound_say("blow bell"); say("The alarm: Jason is at the children."); }
  else {
    let k = -1;
    for (let t = 0; t < 12; t++){ const i = roll(0, COUNSELOR_N - 1); if (c_alive[i] && i !== who){ k = i; break; } }
    if (k < 0) return;
    alarm_on = 2; alarm_who = k; alarm_at = 10; alarm_cool = 10;
    sound_say("blow bell");
    say("The alarm: Jason is at " + COUNSELOR[k] + ".");
  }
}
function alarm_tick(){
  if (!alarm_on) return;
  if (jason_here() || (alarm_on === 2 && who === alarm_who) ||
      (alarm_on === 1 && PLACE[at()].kind === PL_SHORE)){ alarm_on = 0; say("You are there, and Jason breaks off."); return; }
  if (--alarm_at > 0) return;
  if (alarm_on === 1){
    const n = roll(1, 3);
    children -= n;
    if (children < 0) children = 0;
    sound_say("blow toll");
    say("Too late.  " + n + " of the children are dead; " + children + " left.");
    if (!children) end_it("The children are all dead.  There is nothing left to save.", 0);
  } else kill_counselor(alarm_who, "Jason found him first");
  alarm_on = 0;
}
function end_turn(){
  tick++;
  if (tick >= TURNS_A_DAY){
    tick = 0; day++;
    if (day > DAYS_N){ end_it("The third night is over and Jason is still out there.", 0); return; }
    say("Day " + day + ".");
  }
  jason_move();
  alarm_tick();
  if (gameover){ phase = P_OVER; return; }
  alarm_ring();
  if (roll(0, 3) === 0){
    const i = roll(0, COUNSELOR_N - 1);
    if (c_alive[i] && i !== who && PLACE[c_place[i]].kind === PL_SMALL){
      for (let t = 0; t < 20; t++){ const p = roll(0, PLACE_N - 1); if (PLACE[p].kind === PL_SMALL){ c_place[i] = p; break; } }
    }
  }
  sound_scene();
}
function go(d){
  const here = at();
  let e = PLACE[here].exit[d];
  if (e < 0){ say("No way " + WAYS[d] + " from here."); return; }
  if (muddled(here) && roll(0, 7) === 0){
    for (let t = 0; t < 8; t++){ const d2 = roll(0, 3); if (PLACE[here].exit[d2] >= 0){ e = PLACE[here].exit[d2]; break; } }
    say("The trees close in, and you come out somewhere else.");
  }
  if (PLACE[e].kind === PL_LOCKED && !has_lighter){ say("The door is locked, and you have nothing to open it with."); return; }
  c_place[who] = e;
  sound_say("step " + GROUND[ground_of_place(e)].step);
  if (PLACE[e].kind === PL_SMALL){
    for (let i = 0; i < COUNSELOR_N; i++) if (c_alive[i] && c_place[i] === e && i !== who){ who = i; say(COUNSELOR[i] + " is here.  You are " + COUNSELOR[i] + " now."); cap_msg(); break; }
    if (PLACE[e].kind === PL_SMALL && c_place[who] !== e) c_place[who] = e;
  } else say(PLACE[e].name + ".");
  cap_msg();
  end_turn();
}
function search(){
  const p = at();
  if (PLACE[p].kind === PL_LARGE){
    if (PLACE[p].fire && has_lighter && !(fires & (1 << p))){
      fires |= 1 << p;
      let n = 0;
      for (let i = 0; i < PLACE_N; i++) if (PLACE[i].fire && (fires & (1 << i))) n++;
      sound_say("blow fire");
      say("The fire takes.  " + n + " of the " + LODGE_N + " fireplaces are lit.");
      if (n >= LODGE_N){ flashlight = 1; say("Every fireplace is lit: the flashlight and the torch are yours."); if (c_weapon[who] < W_TORCH) c_weapon[who] = W_TORCH; }
      end_turn(); return;
    }
    if (!has_lighter && roll(0, 2) === 0){ has_lighter = 1; sound_say("blow find"); say("A lighter, on the mantelpiece."); end_turn(); return; }
    if (c_weapon[who] < W_KNIFE && roll(0, 1)){ c_weapon[who] = W_KNIFE; sound_say("blow find"); say("A knife: better than a rock."); end_turn(); return; }
    say("Notes, and a cold hearth.");
    end_turn(); return;
  }
  if (PLACE[p].kind === PL_LOCKED){
    if (!pamela_dead && PLACE[p].name === "Pamela's room"){ say("A head comes off the wall and swoops at you."); end_turn(); return; }
    if (c_weapon[who] < W_MACHETE){ c_weapon[who] = W_MACHETE; sound_say("blow find"); say("Jason keeps his weapons here.  A machete."); }
    else if (c_weapon[who] < W_AXE){ c_weapon[who] = W_AXE; sound_say("blow find"); say("An axe, in the hoard."); }
    else say("The hoard is picked over.");
    end_turn(); return;
  }
  if (PLACE[p].kind === PL_WOODS && roll(0, 3) === 0 && c_weapon[who] < W_AXE){
    c_weapon[who] = W_AXE; sound_say("blow find"); say("An axe, leaning against a stump."); end_turn(); return;
  }
  if (PLACE[p].kind === PL_SHORE){ say("The children are here, and quiet."); end_turn(); return; }
  say("Nothing here.");
  end_turn();
}
function fight(){
  const p = at();
  if (!pamela_dead && PLACE[p].name === "Pamela's room"){
    const hit = WEAPON_HURT[c_weapon[who]] + roll(0, THROW[who]);
    if (hit < 6){ say("The head swoops past, and you are cut."); if (++c_hurt[who] >= 4) kill_counselor(who, "Pamela had him"); end_turn(); return; }
    pamela_dead = 1; pamela_day = day;
    sound_say("blow toll");
    if (day >= 3){ c_weapon[who] = W_PITCHFORK; say("Pamela Voorhees is dead, and on the third day: the pitchfork is yours."); }
    else if (c_weapon[who] === W_AXE){ c_weapon[who] = W_TORCH; say("Pamela Voorhees is dead: a torch is left where she fell."); }
    else { c_weapon[who] = W_MACHETE; say("Pamela Voorhees is dead: a machete is left where she fell."); }
    cap_msg();
    end_turn(); return;
  }
  if (!jason_here()){ say("Nothing to fight here."); return; }
  const hit = WEAPON_HURT[c_weapon[who]] + roll(0, SPEED[who]);
  if (c_weapon[who] < W_PITCHFORK && jason_beaten >= 2){
    say("Jason takes it and comes on.  Nothing but the pitchfork will finish him now.");
    if (++c_hurt[who] >= 4) kill_counselor(who, "Jason had him");
    end_turn(); return;
  }
  jason_hurt += hit;
  sound_say("blow hit");
  if (jason_hurt < 18){
    say("You hit him with " + WEAPON[c_weapon[who]] + ".  He does not go down.");
    if (roll(0, 2) === 0){ if (++c_hurt[who] >= 4) kill_counselor(who, "Jason had him"); else say("And he has you: " + COUNSELOR[who] + " is hurt."); }
    end_turn(); return;
  }
  jason_hurt = 0;
  jason_beaten++;
  sound_say("tune bell");
  if (jason_beaten >= 3){ end_it("Jason goes down for the third time, and does not get up.  The camp is quiet.", 1); return; }
  say("Jason goes down.  That is " + jason_beaten + " of three.");
  for (let t = 0; t < 20; t++){ const q = roll(0, PLACE_N - 1); if (PLACE[q].kind === PL_ROAD){ jason_place = q; break; } }
  end_turn();
}
function wait_turn(){ say("You wait, and listen."); end_turn(); }

/* ── what is written ──────────────────────────────────────── */
const SHAPE_BRICK = 0, SHAPE_HEX = 1, SHAPE_FINE = 2;
const TILE_W = 4, PIX_H = 4, BOARD_Y = 1;
let tile_shape = SHAPE_FINE;
let show_keys = 0, show_intro = 0, show_story = 0;
function put_pixel(fine, tx, gx, y, c){ if (fine) pxq(tx * 2 + gx, y, c); else px(tx + gx, y, c); }
function figure_px(gx, gy, gw, gh, fg){
  const top = gh >= 4 ? 1 : 0;
  if (gy < top) return -1;
  const band = gy < top + ((gh - top) >> 1) ? 0 : 1;
  const w = band === 0 ? ((gw * 3 / 8) | 0) : (gw >> 1);
  const x = (gw - w) >> 1;
  if (gx < x || gx >= x + w) return -1;
  return band === 0 ? 223 : fg;
}
function draw_cell(tx, ty, p, c, mark, lit){
  const k = RS[p].c[c];
  const G = GROUND[k.ground];
  const fine = tile_shape === SHAPE_FINE, hexed = tile_shape !== SHAPE_BRICK;
  const gw = fine ? TILE_W * 2 : TILE_W, gh = hexed ? PIX_H + 1 : PIX_H;
  const tip = gw >> 2, tipw = gw >> 1;
  const y0 = ty * 2 + (hexed ? 1 : 0);
  const tex = hash3u(Math.imul(p, 7919) >>> 0, Number(SEED & 0xFFFFFFFFn), 17);   /* the C truncates the seed to unsigned here */
  for (let gy = 0; gy < gh; gy++){
    let lo = 0, hi = gw;
    if (hexed && (gy === 0 || gy === gh - 1)){ lo = tip; hi = tip + tipw; }
    for (let gx = lo; gx < hi; gx++){
      const h = hash3u(tex, c, gy * 8 + gx);
      let col = ((h & 0xFF) < 20 + G.prom * 12) ? G.fg : G.bg;
      if (k.thing >= 0) col = (gy === (gh >> 1)) ? 226 : G.fg;
      if (k.ground === G_LAKE) col = (((gx + gy * 3 + tick) & 7) === 0) ? G.fg : G.bg;
      if (mark === 1){ const me = figure_px(gx, gy, gw, gh, 33); if (me >= 0) col = me; }
      if (mark === 2){ const me = figure_px(gx, gy, gw, gh, 196); if (me >= 0) col = me; }
      if (!lit) col = 16;
      put_pixel(fine, tx, gx, y0 + gy, col);
    }
  }
}
function draw_board(p){
  const dark = night() && !flashlight && PLACE[p].kind !== PL_SMALL && PLACE[p].kind !== PL_LARGE;
  const mid = BOARD_SIZE >> 1;
  for (let c = 0; c < BOARD_SIZE; c++){
    const tx = 16 + 4 * COORD_Q[c] + 2 * COORD_R[c];
    const ty = BOARD_Y + 8 + 2 * COORD_R[c];
    const mark = c === mid ? 1 : (jason_here() && c === mid + 3) ? 2 : 0;
    const lit = !dark || hex_dist(c, mid) <= 2;
    draw_cell(tx, ty, p, c, mark, lit);
  }
}
const AREA = ["roads", "cabins", "lodges", "woods", "cave", "locked", "lake", "shore"];
function draw_map(x0, y0){
  text(x0, y0, "THE MAP", 223, 0);
  let row = y0 + 1;
  for (let k = 0; k < 8 && row < screen_h - 6; k++, row++){
    let n = 0, mine = 0, his = 0;
    for (let p = 0; p < PLACE_N; p++) if (PLACE[p].kind === k){ n++; if (p === at()) mine = 1; if (p === jason_place) his = 1; }
    const line = padr(AREA[k], 8) + " " + padl(n, 2) + " " + (mine ? "you " : "    ") + (his ? "JASON" : "");
    text(x0, row, line, mine ? 33 : his ? 196 : 245, 0);
  }
}
function draw_status(x0, y0){
  text(x0, y0, "Day " + day + ", " + when_it_is(), 250, 0);
  text(x0, y0 + 1, COUNSELOR[who] + ", with " + WEAPON[c_weapon[who]], 223, 0);
  text(x0, y0 + 3, "counselors children  Jason", 245, 0);
  text(x0, y0 + 4, padr(alive_n(), 10) + " " + padr(children, 9) + " " + jason_beaten + " of 3", 250, 0);
  text(x0, y0 + 5, "fires " + popcount(fires) + " of " + LODGE_N + "  " + (has_lighter ? "lighter " : "") + (flashlight ? "torch" : ""), 245, 0);
  if (alarm_on) text(x0, y0 + 7, "THE ALARM: " + (alarm_on === 1 ? "the children" : COUNSELOR[alarm_who]) + ", " + alarm_at + " left", 196, 0);
  draw_map(x0, y0 + 9);
  /* where you are and the ways out go in the panel: on a 25-row screen the
   * board's nine rows reach to within five of the bottom, and the three
   * lines of what was last said want those */
  { const p = at();
    text(x0, y0 + 18, "here: " + GROUND[ground_of_place(p)].name + (jason_here() ? ".  JASON IS HERE." : ""), jason_here() ? 196 : 245, 0);
    let ways = "ways out:";
    for (let d = 0; d < 4; d++) if (PLACE[p].exit[d] >= 0) ways += " " + WAYS[d];
    text(x0, y0 + 19, ways, 223, 0); }
}
function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){ if (s[p + len] === ' ') last_space = len; len++; }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.substr(p, cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}
function draw_page(body, foot, fg){
  const x = 1, y = 1, w = screen_w - 2, h = screen_h - 2;
  fill(x, y, w, h, 235);
  for (let c = x; c < x + w; c++){ text(c, y, " ", 250, 240); text(c, y + h - 1, " ", 250, 240); }
  for (let r = y; r < y + h; r++){ text(x, r, " ", 250, 240); text(x + w - 1, r, " ", 250, 240); }
  const lines = wrap_lines(body, w - 6, 64);
  let row = y + 1;
  for (let i = 0; i < lines.length && row < y + h - 2; i++, row++) text(x + 3, row, lines[i], i === 0 ? 223 : fg, 235);
  text(x + 3, y + h - 2, foot, 245, 235);
}
function compose_screen(){
  fb_clear();
  const p = at();
  const when = "day " + day + ", " + when_it_is();
  let line = " Friday the 13th · " + PLACE[p].name;
  { const room_for = screen_w - when.length - 2;
    if (line.length > room_for) line = line.slice(0, room_for); }
  text(0, 0, line, 250, 52);
  for (let x = line.length; x < screen_w; x++) text(x, 0, " ", 232, 52);
  text(screen_w - when.length - 1, 0, when, 250, 52);

  build_board(p);
  draw_board(p);
  draw_status(panel_x + 1, 1);
  text(1, screen_h - 4, message[2], 240, 0);
  text(1, screen_h - 3, message[1], 245, 0);
  text(1, screen_h - 2, message[0], 223, 0);
  if (!gameover) text(1, screen_h - 1, "w d x a go  g search  f fight  . wait  S L save/load  T tiles  ? keys  q quit", 226, 0);
  else text(1, screen_h - 1, "n begins again  q leaves", 226, 0);
  if (show_keys) draw_page(KEYS_TEXT, "any key closes it", 250);
  else if (show_intro) draw_page(STORY[0], "any key begins        q  leave", 250);
  else if (show_story) draw_page(STORY[show_story - 1], "n  begins again        q  leave", 250);
}
function fb_hash(){
  let h = 2166136261 >>> 0;
  for (let row = 0; row < screen_h; row++)
    for (let col = 0; col < screen_w; col++){
      const at2 = FB(row, col);
      const ch = fb_ch[at2];                       /* the JS holds the code point the C's glyph index names */
      const q = fb_ch[at2] === FB_QUAD ? (fb_q[at2] & 15) : 0;
      const v = (fb_fg[at2] | (fb_bg[at2] << 8) | (q << 16) | (ch << 20)) >>> 0;
      h = Math.imul(h ^ v, 16777619) >>> 0;
      h = Math.imul(h ^ (v >>> 24), 16777619) >>> 0;
    }
  return h >>> 0;
}

/* ── saving, input and the checks ─────────────────────────── */
let save_store = {get: () => null, set: (s) => {}};
function save_game(){
  const s = {magic: "crystallake", seed: SEED.toString(), dice: dice_state.toString(), seedtext: SEEDTEXT,
    who, children, jason_place, jason_hurt, jason_beaten, has_lighter, flashlight, fires,
    pamela_dead, pamela_day, day, tick, alarm_on, alarm_at, alarm_kind, alarm_who, alarm_cool,
    won, lost, gameover, phase, tile_shape,
    c_place: Array.from(c_place), c_weapon: Array.from(c_weapon),
    c_alive: Array.from(c_alive), c_hurt: Array.from(c_hurt),
    dead_how, msg: message.slice()};
  try { save_store.set(JSON.stringify(s)); } catch (e) { return 0; }
  return 1;
}
function load_game(){
  let s;
  try { const j = save_store.get(); if (!j) return 0; s = JSON.parse(j); } catch (e) { return 0; }
  if (!s || s.magic !== "crystallake") return 0;
  SEED = BigInt(s.seed); dice_state = BigInt(s.dice); SEEDTEXT = s.seedtext;
  who = s.who; children = s.children; jason_place = s.jason_place; jason_hurt = s.jason_hurt;
  jason_beaten = s.jason_beaten; has_lighter = s.has_lighter; flashlight = s.flashlight; fires = s.fires >>> 0;
  pamela_dead = s.pamela_dead; pamela_day = s.pamela_day; day = s.day; tick = s.tick;
  alarm_on = s.alarm_on; alarm_at = s.alarm_at; alarm_kind = s.alarm_kind; alarm_who = s.alarm_who; alarm_cool = s.alarm_cool;
  won = s.won; lost = s.lost; gameover = s.gameover; phase = s.phase; tile_shape = s.tile_shape;
  for (let i = 0; i < COUNSELOR_N; i++){ c_place[i] = s.c_place[i]; c_weapon[i] = s.c_weapon[i]; c_alive[i] = s.c_alive[i]; c_hurt[i] = s.c_hurt[i]; }
  dead_how = s.dead_how; message[0] = s.msg[0]; message[1] = s.msg[1]; message[2] = s.msg[2];
  show_keys = show_intro = show_story = 0;
  return 1;
}
function new_game(){
  who = 1;                                     /* Mark, whom the guides recommend */
  children = CHILD_N;
  jason_hurt = jason_beaten = 0;
  has_lighter = flashlight = fires = 0;
  pamela_dead = pamela_day = 0;
  day = 1; tick = 0;
  alarm_on = alarm_at = alarm_kind = alarm_who = 0; alarm_cool = 0;
  won = lost = gameover = 0;
  phase = P_PLAY;
  dead_how = ""; message[0] = message[1] = message[2] = "";
  lay_rooms();
  { let k = 0;
    for (let p = 0; p < PLACE_N && k < COUNSELOR_N; p++) if (PLACE[p].kind === PL_SMALL){ c_place[k] = p; k++; } }
  for (let i = 0; i < COUNSELOR_N; i++){ c_weapon[i] = W_ROCK; c_alive[i] = 1; c_hurt[i] = 0; }
  for (let p = 0; p < PLACE_N; p++) if (PLACE[p].kind === PL_ROAD){ jason_place = p; break; }
  show_keys = 0; show_story = 0; show_intro = 1;
  say("Camp Crystal Lake, the first day.  Six of you, fifteen children, and him.");
}
function handle_key(ch){
  const c = typeof ch === "number" ? ch : ch.charCodeAt(0);
  const key = String.fromCharCode(c);
  if (show_intro){
    if (key === 'q' || c === 27 || c === 3) return 0;
    show_intro = 0;
    return 1;
  }
  if (show_keys){ show_keys = 0; return 1; }
  switch (key){
  case 'S': say(save_game() ? "Saved." : "It would not save."); return 1;
  case 'L': say(load_game() ? "Loaded." : "There is no saved night."); return 1;
  case 'T': tile_shape = (tile_shape + 1) % SHAPE_N; say(SHAPE_NAME[tile_shape] + " tiles."); return 1;
  case '?': show_keys = 1; return 1;
  case 'q': case '\x1b': case '\x03': case '\x04': return 0;
  default: break;
  }
  if (gameover){
    if (key === 'n'){ new_game(); show_intro = 0; return 1; }
    return 1;
  }
  switch (key){
  case 'w': go(0); return 1;
  case 'd': go(1); return 1;
  case 'x': go(2); return 1;
  case 'a': go(3); return 1;
  case 'g': search(); return 1;
  case 'f': fight(); return 1;
  case '.': wait_turn(); return 1;
  default: return 1;
  }
}
function start_game(seedText, dice){
  setSeed(seedText);
  dice_state = 0x243F6A8885A308D3n;
  if (dice) dice_state ^= SEED;
  else dice_state ^= (BigInt(Date.now()) * 0x9E3779B97F4A7C15n) & M64;
  new_game();
  tile_shape = SHAPE_FINE;
  grown_keep.fill(null); bst_keep.fill(null);
  sound_bed = "";
}
function legend_char(p, c){
  const k = RS[p].c[c];
  if (c === (BOARD_SIZE >> 1)) return '@';
  if (k.thing >= 0) return "nesw"[k.thing];
  switch (k.ground){
  case G_ROAD:   return '.';
  case G_CABIN:  return 'c';
  case G_LODGE:  return 'L';
  case G_WOODS:  return 't';
  case G_CAVE:   return '#';
  case G_LOCKED: return '+';
  case G_LAKE:   return '~';
  default:       return ',';
  }
}
const ROWN = [5, 6, 7, 8, 9, 8, 7, 6, 5];
function print_board(out, p){
  let i = 0;
  for (let row = 0; row < 9; row++){
    let line = "   " + " ".repeat(4 - (row < 4 ? row : 8 - row));
    for (let j = 0; j < ROWN[row]; j++, i++) line += legend_char(p, i) + " ";
    out.push(line);
  }
}
function reset_statics(){
  who = 1; children = CHILD_N;
  jason_place = 0; jason_hurt = jason_beaten = 0;
  has_lighter = flashlight = 0; fires = 0; alarm_cool = 0;
  pamela_dead = pamela_day = 0;
  day = 1; tick = 0;
  alarm_on = alarm_at = alarm_kind = alarm_who = 0;
  won = lost = gameover = 0;
  phase = P_PLAY; tile_shape = SHAPE_FINE;
  dead_how = ""; message[0] = message[1] = message[2] = "";
  for (let i = 0; i < COUNSELOR_N; i++){ c_place[i] = 0; c_weapon[i] = W_ROCK; c_alive[i] = 1; c_hurt[i] = 0; }
  show_keys = show_intro = show_story = 0;
  for (let p = 0; p < ROOM_MAX; p++) RS[p].built = 0;
  grown_keep.fill(null); bst_keep.fill(null);
  sound_bed = "";
}
function check_rooms(seedText, only){
  const out = [];
  reset_statics();
  setSeed(seedText);
  new_game();
  if (only === undefined || only === null) only = -1;
  for (let p = 0; p < PLACE_N; p++){
    if (only >= 0 && p !== only) continue;
    out.push("");
    out.push(PLACE[p].name + "  (" + p + ")");
    print_board(out, p);
  }
  return out;
}
function keys_report(out){
  out.push("at " + at() + " (" + PLACE[at()].name + ")  who " + who + " (" + COUNSELOR[who] + ")  day " + day +
           " tick " + tick + "  " + (gameover ? (won ? "WON" : "LOST: ") : "") + (gameover && !won ? dead_how : ""));
  out.push("counselors " + alive_n() + " children " + children + " jason " + jason_beaten + " of 3 at " + jason_place +
           "  weapon " + c_weapon[who] + " fires " + popcount(fires) + " has_lighter " + has_lighter + " torch " + flashlight);
  out.push("alarm_on " + alarm_on + " at " + alarm_at + " who " + alarm_who + "  pamela " + pamela_dead);
  out.push("last: " + message[0]);
  out.push("      " + message[1]);
  out.push("      " + message[2]);
  screen_w = 80; screen_h = 25;
  compose_screen();
  out.push("screen " + pad0(fb_hash().toString(16), 8));
}
function check_keys(seedText, keys_in){
  const out = [];
  reset_statics();
  start_game(seedText, 1);
  show_intro = 0;
  for (let i = 0; i < keys_in.length; i++){
    if (!handle_key(keys_in[i])) break;
    if (gameover) break;
  }
  keys_report(out);
  return out;
}
function check_trail(seedText, keys_in, marks){
  const out = [];
  reset_statics();
  start_game(seedText, 1);
  show_intro = 0;
  let mi = 0, stopped = 0;
  for (let i = 0; i < keys_in.length && !stopped; i++){
    while (mi < marks.length && marks[mi] <= i){ const rep = []; keys_report(rep); out.push(rep); mi++; }
    if (!handle_key(keys_in[i])) stopped = 1;
    if (gameover) stopped = 1;
  }
  while (mi < marks.length){ const rep = []; keys_report(rep); out.push(rep); mi++; }
  return out;
}

/* ── the walk ─────────────────────────────────────────────── */
let walk_out = [], walk_keys = 0, walk_keystring = [], walk_trace = 0;
const walk_seen = ["", "", ""];
function wprint(s){
  walk_out.push(padl(day, 3) + "." + pad0(tick, 2) + " " + padr(PLACE[at()].name, 26).slice(0, 26) + " " +
    padr(COUNSELOR[who], 8) + " " + padr(WEAPON[c_weapon[who]], 13) + " J" + jason_beaten + "  " + s);
}
function wk(c){
  handle_key(c);
  walk_keystring[walk_keys] = c;
  walk_keys++;
  if (walk_trace) walk_out.push(padl(day, 3) + "." + pad0(tick, 2) + " key " + c + "  at " + at() + " who " + who +
    " weapon " + c_weapon[who] + " alarm_on " + alarm_on + " | " + message[0]);
  for (let i = 2; i >= 0; i--)
    if (message[i].length && message[i] !== walk_seen[0] && message[i] !== walk_seen[1] && message[i] !== walk_seen[2]) wprint(message[i]);
  walk_seen[0] = message[0]; walk_seen[1] = message[1]; walk_seen[2] = message[2];
}
/* the shortest way from here to a place, as a first step: a breadth-first walk of
 * the camp.  A small cabin hands you the counselor waiting in it, and his rock with
 * him, so a walk with something in its hands goes round them when it can. */
const w_prev = new Int32Array(PLACE_N), w_seen = new Int32Array(PLACE_N), w_queue = new Int32Array(PLACE_N);
function step_toward(from, want, avoid_small){
  for (let i = 0; i < PLACE_N; i++){ w_prev[i] = -1; w_seen[i] = 0; }
  let head = 0, tail = 0;
  w_queue[tail++] = from; w_seen[from] = 1;
  while (head < tail){
    const p = w_queue[head++];
    if (p === want) break;
    for (let d = 0; d < 4; d++){
      const e = PLACE[p].exit[d];
      if (e < 0 || w_seen[e]) continue;
      if (avoid_small && e !== want && PLACE[e].kind === PL_SMALL) continue;
      w_seen[e] = 1; w_prev[e] = p; w_queue[tail++] = e;
    }
  }
  if (!w_seen[want]) return -1;
  let p = want;
  while (w_prev[p] >= 0 && w_prev[p] !== from) p = w_prev[p];
  if (w_prev[p] !== from) return -1;
  for (let d = 0; d < 4; d++) if (PLACE[from].exit[d] === p) return d;
  return -1;
}
const WAYKEY = ['w', 'd', 'x', 'a'];
/* what the walk is after, in the order the night wants it */
const searched = new Int32Array(PLACE_N);
function find_kind(kind, unsearched){
  for (let p = 0; p < PLACE_N; p++) if (PLACE[p].kind === kind && (!unsearched || !searched[p])) return p;
  return -1;
}
function find_named(n){
  for (let p = 0; p < PLACE_N; p++) if (PLACE[p].name === n) return p;
  return -1;
}
function pamelas_room(){ return find_named("Pamela's room"); }
/* a locked room with a hoard in it: Pamela's is locked too, and holds no weapon
 * until she is dead, so the walk leaves it out of the hunt for one */
function find_hoard(unsearched){
  for (let p = 0; p < PLACE_N; p++)
    if (PLACE[p].kind === PL_LOCKED && p !== pamelas_room() && (!unsearched || !searched[p])) return p;
  return -1;
}
/* is there anything here the walk has not had out of this place yet?  A counselor
 * taken over in a cabin comes with a rock, so the hoard is worth a second visit */
function worth_search(here){
  const k = PLACE[here].kind;
  if (k === PL_LARGE) return !has_lighter || !searched[here];
  if (k === PL_LOCKED) return here !== pamelas_room() && (c_weapon[who] < W_MACHETE || !searched[here]);
  if (k === PL_WOODS) return c_weapon[who] < W_AXE && !searched[here];
  return 0;
}
/* how far, in steps: the walk will not set out for an alarm it cannot reach in time */
const d_seen = new Int32Array(PLACE_N), d_queue = new Int32Array(PLACE_N), d_dist = new Int32Array(PLACE_N);
function walk_dist(from, want){
  for (let i = 0; i < PLACE_N; i++){ d_seen[i] = 0; d_dist[i] = 0; }
  let head = 0, tail = 0;
  d_queue[tail++] = from; d_seen[from] = 1;
  while (head < tail){
    const p = d_queue[head++];
    if (p === want) return d_dist[p];
    for (let d = 0; d < 4; d++){
      const e = PLACE[p].exit[d];
      if (e < 0 || d_seen[e]) continue;
      d_seen[e] = 1; d_dist[e] = d_dist[p] + 1; d_queue[tail++] = e;
    }
  }
  return -1;
}
/* an alarm is worth answering only if there is time to get there: a run to the
 * far shore and back is a sixth of a night, and the night is what runs out */
function in_reach(here, p){ const d = p < 0 ? -1 : walk_dist(here, p); return d >= 0 && d <= alarm_at; }
function want_place(here){
  if (alarm_on === 1){ const p = find_kind(PL_SHORE, 0); if (in_reach(here, p)) return p; }
  /* a counselor's alarm is answered in his cabin, and answering it costs the weapon
   * in hand: with the pitchfork there is nothing worth trading for it */
  if (alarm_on === 2 && c_weapon[who] < W_PITCHFORK){ const p = c_place[alarm_who]; if (in_reach(here, p)) return p; }
  /* the lighter opens the locked rooms and lights the fires: it comes first */
  if (!has_lighter){ const p = find_kind(PL_LARGE, 1); if (p >= 0) return p; }
  /* then something to fight him with */
  if (c_weapon[who] < W_MACHETE){ let p = find_hoard(1); if (p < 0) p = find_hoard(0); if (p >= 0) return p; }
  /* the pitchfork is Pamela's, and only if she is killed on the third day: before
   * that she leaves a machete or a torch, and the third beating wants the pitchfork */
  if (day >= DAYS_N && !pamela_dead && c_weapon[who] < W_PITCHFORK){ const p = pamelas_room(); if (p >= 0) return p; }
  /* while there is time, the fireplaces */
  if (day < DAYS_N && has_lighter) for (let p = 0; p < PLACE_N; p++) if (PLACE[p].fire && !(fires & (1 << p))) return p;
  /* he goes into the cabins too, and following him in would put the rock back in
   * your hand: wait for him at the door instead */
  if (c_weapon[who] > W_ROCK && PLACE[jason_place].kind === PL_SMALL)
    for (let d = 0; d < 4; d++){ const e = PLACE[jason_place].exit[d]; if (e >= 0 && PLACE[e].kind !== PL_SMALL) return e; }
  return jason_place;
}
function check_walk(seedText, trace){
  walk_out = []; walk_trace = trace ? 1 : 0; walk_keys = 0; walk_keystring = [];
  walk_seen[0] = walk_seen[1] = walk_seen[2] = "";
  reset_statics();
  start_game(seedText, 1);
  show_intro = 0;
  let guard = 0;
  searched.fill(0);
  while (!gameover && guard++ < 6000){
    const here = at();
    /* him, when there is anything in hand worth swinging */
    if (jason_here() && (jason_beaten < 2 ? c_weapon[who] > W_ROCK : c_weapon[who] >= W_PITCHFORK)){ wk('f'); continue; }
    if (jason_here()){ let d = -1; for (let k = 0; k < 4; k++) if (PLACE[here].exit[k] >= 0){ d = k; break; } if (d >= 0){ wk(WAYKEY[d]); continue; } }
    /* Pamela, on the third day, when the pitchfork is what she leaves */
    if (!pamela_dead && day >= DAYS_N && here === pamelas_room()){ wk('f'); continue; }
    /* the place worth searching: a fireplace to light, or somewhere not gone over yet */
    if (PLACE[here].fire && has_lighter && !(fires & (1 << here))){ wk('g'); continue; }
    if (worth_search(here)){ searched[here] = 1; wk('g'); continue; }
    const want = want_place(here);
    if (want === here){ wk('.'); continue; }
    const keep = c_weapon[who] > W_ROCK && PLACE[want].kind !== PL_SMALL;
    let d = step_toward(here, want, keep);
    if (d < 0 && keep) d = step_toward(here, want, 0);
    if (d < 0){ for (let k = 0; k < 4; k++) if (PLACE[here].exit[k] >= 0){ d = k; break; } }
    if (d < 0){ wk('.'); continue; }
    wk(WAYKEY[d]);
  }
  if (won){
    walk_out.push("");
    walk_out.push("WALK OK: Jason beaten three times on day " + day + "; " + alive_n() + " counselors and " +
      children + " children left, " + walk_keys + " keys");
    if (walk_trace) walk_out.push("keys " + walk_keystring.join(""));
    return 0;
  }
  walk_out.push("");
  walk_out.push("WALK FAILED on day " + day + " at " + PLACE[at()].name + ": " + (gameover ? dead_how : "the night would not end"));
  if (walk_trace) walk_out.push("keys " + walk_keystring.join(""));
  return 1;
}

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same 2A03 and played
 * as a buffer; the tune loops until the next one. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "tune") pcm = tune_render(arg, 0);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the tune's intro once, then its loop */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("crystallake.sav"),
  set: (s) => localStorage.setItem("crystallake.sav", s),
};
start_game(params.get("seed"));
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left Camp Crystal Lake.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: the four ways are w d x a as in crystallake.c,
 * and the arrow keys are the same four; Escape is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return 'w';
  if (e.key === "ArrowDown") return 'x';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
