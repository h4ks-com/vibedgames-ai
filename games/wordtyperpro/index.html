<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WordTyper Pro</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #1a1b26; --fg: #c0caf5; --accent: #7aa2f7; --accent2: #bb9af7;
  --panel: #16161e; --panel2: #1f2335; --border: #2a2e44; --hover: #282b42;
  --success: #9ece6a; --warn: #e0af68; --danger: #f7768e;
  --gold: #ffcc00;
}
html, body { height:100%; width:100%; overflow:hidden; font-family:'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; }

/* ── Layout ── */
#app { display:flex; height:100vh; width:100vw; }
#sidebar { width:300px; min-width:300px; background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
#editor-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }

/* ── Sidebar ── */
.sb-header { padding:10px 14px; background:var(--panel2); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
.sb-header .logo { font-size:18px; font-weight:700; color:var(--accent); }
.sb-header .currency-sym { font-size:18px; }
.sb-stats { padding:8px 14px; display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; font-size:12px; }
.sb-stats .stat-val { font-weight:700; color:var(--accent); font-size:13px; }
.sb-stats .stat-lbl { color:#888; font-size:10px; text-transform:uppercase; letter-spacing:0.5px; }

.sb-combo { padding:4px 14px 8px; }
.sb-combo .bar { height:6px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-top:4px; }
.sb-combo .bar-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width 0.2s; border-radius:3px; }
.sb-combo .combo-val { font-size:22px; font-weight:900; color:var(--accent2); display:inline; }
.sb-combo .combo-lbl { font-size:10px; color:#888; text-transform:uppercase; letter-spacing:1px; }
.sb-combo .wpm-val { font-size:22px; font-weight:900; color:var(--success); float:right; }
.sb-combo .wpm-lbl { font-size:10px; color:#888; text-transform:uppercase; letter-spacing:1px; float:right; text-align:right; line-height:1; margin-top:4px; }

.sb-section { border-top:1px solid var(--border); flex:1; overflow-y:auto; }
.sb-section::-webkit-scrollbar { width:6px; }
.sb-section::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.sb-tabs { display:flex; padding:0 10px; gap:2px; }
.sb-tab { padding:6px 14px; font-size:12px; cursor:pointer; border-radius:6px 6px 0 0; color:#888; background:none; border:none; border-bottom:2px solid transparent; font-family:inherit; }
.sb-tab.active { color:var(--accent); border-bottom-color:var(--accent); }

/* ── Upgrades ── */
.upgrade-list { padding:6px 10px; }
.upgrade-item { background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:6px; cursor:pointer; transition:all 0.15s; position:relative; overflow:hidden; }
.upgrade-item:hover { border-color:var(--accent); background:var(--hover); }
.upgrade-item.disabled { opacity:0.45; cursor:default; }
.upgrade-item.disabled:hover { border-color:var(--border); background:var(--panel2); }
.upgrade-item .up-name { font-size:12px; font-weight:600; }
.upgrade-item .up-desc { font-size:10px; color:#888; }
.upgrade-item .up-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
.upgrade-item .up-cost { font-size:12px; font-weight:700; color:var(--gold); }
.upgrade-item .up-count { font-size:10px; color:var(--accent); background:var(--bg); padding:2px 8px; border-radius:10px; }

/* ── Achievements ── */
.ach-list { padding:6px 10px; }
.ach-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; margin-bottom:4px; font-size:11px; }
.ach-item.unlocked { background:rgba(154,204,106,0.1); color:var(--success); }
.ach-item.locked { opacity:0.4; }
.ach-item .ach-icon { font-size:16px; }

/* ── Theme selector ── */
.sb-footer { padding:8px 14px; border-top:1px solid var(--border); background:var(--panel2); }
.theme-select { width:100%; padding:6px 10px; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; font-size:12px; font-family:inherit; }

/* ── Editor ── */
.toolbar { background:var(--panel2); border-bottom:1px solid var(--border); display:flex; flex-wrap:wrap; align-items:center; gap:2px; padding:4px 8px; }
.tb-group { display:flex; align-items:center; gap:2px; padding:0 4px; border-right:1px solid var(--border); }
.tb-group:last-child { border-right:none; }
.tb-btn { width:28px; height:28px; display:flex; align-items:center; justify-content:center; background:transparent; border:1px solid transparent; border-radius:4px; cursor:pointer; color:var(--fg); font-size:13px; font-family:inherit; transition:all 0.1s; }
.tb-btn:hover { background:var(--hover); border-color:var(--border); }
.tb-btn.active { background:var(--accent); color:#1a1b26; }
.tb-btn svg { width:14px; height:14px; }
.tb-select { padding:3px 6px; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:4px; font-size:11px; font-family:inherit; }
.tb-select option { background:var(--bg); }
.tb-color { width:28px; height:24px; border:1px solid var(--border); border-radius:4px; background:none; cursor:pointer; padding:2px; }

/* ── Document area ── */
.doc-scroll { flex:1; overflow-y:auto; display:flex; justify-content:center; padding:20px 10px; }
.doc-scroll::-webkit-scrollbar { width:8px; }
.doc-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
#doc-title { width:100%; background:none; border:none; color:var(--fg); font-size:22px; font-weight:700; padding:0 0 10px 0; outline:none; font-family:inherit; }
#page { width:210mm; max-width:100%; min-height:297mm; background:#fff; color:#1a1a1a; border-radius:2px; box-shadow:0 4px 24px rgba(0,0,0,0.4); padding:25.4mm 25.4mm 30mm 25.4mm; font-size:11pt; line-height:1.6; outline:none; overflow-y:auto; max-height:calc(100vh - 100px); }
#page:focus { box-shadow:0 4px 30px rgba(122,162,247,0.3); }

/* ── Status bar ── */
.statusbar { background:var(--panel2); border-top:1px solid var(--border); padding:4px 14px; display:flex; justify-content:space-between; font-size:11px; color:#888; }
.statusbar .sb-right { display:flex; gap:16px; }

/* ── Floating gains & particles ── */
.float-gain { position:fixed; pointer-events:none; font-weight:700; font-size:14px; z-index:9999; animation:floatUp 1s ease-out forwards; }
@keyframes floatUp { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-60px)} }
.particle { position:fixed; pointer-events:none; width:4px; height:4px; border-radius:50%; z-index:9998; }

/* ── Hidden input for mobile ── */
#hidden-input { position:fixed; top:0; left:0; width:1px; height:1px; opacity:0.01; border:none; outline:none; font-size:16px; }

/* ── Theme overrides ── */
body.theme-hacker { --bg:#0a0e0a; --fg:#33ff33; --accent:#33ff33; --accent2:#88ff88; --panel:#0d0d0d; --panel2:#1a1a1a; --border:#1a3a1a; --hover:#1a2a1a; --gold:#33ff33; }
body.theme-medieval { --bg:#2b1f0f; --fg:#d4c4a0; --accent:#c9a84c; --accent2:#d4af37; --panel:#241a0d; --panel2:#33291a; --border:#4a3a20; --hover:#3a2a15; --gold:#ffd700; }
body.theme-scifi { --bg:#0a0e1a; --fg:#88ddff; --accent:#00ddff; --accent2:#88aaff; --panel:#0d1424; --panel2:#15203a; --border:#1a3a5a; --hover:#1a2a4a; --gold:#00ffff; }
body.theme-candy { --bg:#2a0f2a; --fg:#ffb0d0; --accent:#ff69b4; --accent2:#ff8ec0; --panel:#220a22; --panel2:#3a1a3a; --border:#5a2a5a; --hover:#3a1a3a; --gold:#ff8ec0; }

/* ── Mobile ── */
@media (max-width: 768px) {
  #sidebar { position:fixed; left:-300px; z-index:100; height:100vh; transition:left 0.3s; }
  #sidebar.open { left:0; }
  #sidebar-toggle { display:flex !important; }
  #page { width:100%; padding:16px; min-height:auto; font-size:14px; }
}
#sidebar-toggle { display:none; position:fixed; top:8px; right:8px; z-index:101; width:36px; height:36px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; color:var(--fg); cursor:pointer; align-items:center; justify-content:center; font-size:18px; }
</style>

    {id:'singularity',name:'Sugar Singularity',desc:'×3 all income',baseCost:50000,costMult:3,effect:{incomeMult:3}},

// ═══════════════════════════════════════
// ACHIEVEMENTS
// ═══════════════════════════════════════
const ACHIEVEMENTS = [
  {id:'hello',name:'Hello World',desc:'Type your first word',icon:'🌍',check:s=>s.totalKeys>=5},
  {id:'typist',name:'Typist',desc:'100 keystrokes',icon:'⌨️',check:s=>s.totalKeys>=100},
  {id:'essay',name:'Essayist',desc:'500 keystrokes',icon:'📝',check:s=>s.totalKeys>=500},
  {id:'novelist',name:'Novelist',desc:'2000 keystrokes',icon:'📖',check:s=>s.totalKeys>=2000},
  {id:'machine',name:'Machine',desc:'5000 keystrokes',icon:'🤖',check:s=>s.totalKeys>=5000},
  {id:'combo5',name:'On Fire',desc:'×5 combo',icon:'🔥',check:s=>s.maxCombo>=5},
  {id:'combo10',name:'Blazing',desc:'×10 combo',icon:'⚡',check:s=>s.maxCombo>=10},
  {id:'combo25',name:'Unstoppable',desc:'×25 combo',icon:'💫',check:s=>s.maxCombo>=25},
  {id:'combo50',name:'Inhuman',desc:'×50 combo',icon:'🌟',check:s=>s.maxCombo>=50},
  {id:'wpm40',name:'Speed Typist',desc:'40 WPM',icon:'🏃',check:s=>s.maxWPM>=40},
  {id:'wpm70',name:'Pro',desc:'70 WPM',icon:'🚀',check:s=>s.maxWPM>=70},
  {id:'wpm100',name:'Superhuman',desc:'100 WPM',icon:'🧠',check:s=>s.maxWPM>=100},
  {id:'rich',name:'First Thousand',desc:'Earn 1,000 total',icon:'💰',check:s=>s.totalEarned>=1000},
  {id:'tycoon',name:'Tycoon',desc:'Earn 100,000 total',icon:'🏦',check:s=>s.totalEarned>=100000},
  {id:'god',name:'Keyboard God',desc:'Earn 1,000,000 total',icon:'👑',check:s=>s.totalEarned>=1000000},
];

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let state = {
  credits: 0, totalKeys: 0, totalEarned: 0,
  combo: 1, comboTimer: 0, maxCombo: 1,
  maxWPM: 0, playTime: 0, theme: 'tokyo',
  upgrades: {}, unlockedAch: {},
  recentKeys: [],
};
let currentSbTab = 'upgrades';
const page = document.getElementById('page');
const hiddenInput = document.getElementById('hidden-input');

// ═══════════════════════════════════════
// KEYSTROKE HANDLING — bulletproof
// ═══════════════════════════════════════
let lastPageLen = page.textContent.length;

function processKey(charCount) {
  if (charCount <= 0) return;
  const now = Date.now();
  const theme = THEMES[state.theme];
  
  // Calc per-key value
  let perKey = 1;
  for (const up of theme.upgrades) {
    const count = state.upgrades[up.id] || 0;
    if (count > 0) {
      if (up.effect.perKeyAdd) perKey += up.effect.perKeyAdd * count;
    }
  }
  
  // Combo
  let comboGain = 0.1;
  let comboDecayMult = 1;
  for (const up of theme.upgrades) {
    const count = state.upgrades[up.id] || 0;
    if (count > 0) {
      if (up.effect.comboGainAdd) comboGain += up.effect.comboGainAdd * count;
      if (up.effect.comboDecayMult) comboDecayMult *= Math.pow(up.effect.comboDecayMult, count);
    }
  }
  
  state.combo += comboGain * charCount;
  state.comboTimer = now;
  
  // WPM bonus
  const wpm = calcWPM();
  let wpmBonusMult = 1;
  for (const up of theme.upgrades) {
    const count = state.upgrades[up.id] || 0;
    if (count > 0 && up.effect.wpmBonus && wpm >= (up.effect.wpmThreshold||40)) {
      wpmBonusMult += up.effect.wpmBonus * count;
    }
  }
  
  // Income multiplier
  let incomeMult = 1;
  for (const up of theme.upgrades) {
    const count = state.upgrades[up.id] || 0;
    if (count > 0 && up.effect.incomeMult) incomeMult *= Math.pow(up.effect.incomeMult, count);
  }
  
  // Per-sec
  let perSec = 0;
  for (const up of theme.upgrades) {
    const count = state.upgrades[up.id] || 0;
    if (count > 0 && up.effect.perSecAdd) perSec += up.effect.perSecAdd * count;
  }
  
  const earned = Math.ceil(perKey * state.combo * wpmBonusMult * incomeMult * charCount);
  state.credits += earned;
  state.totalEarned += earned;
  state.totalKeys += charCount;
  
  state.recentKeys.push(now);
  state.recentKeys = state.recentKeys.filter(t => now - t < 60000);
  
  if (state.combo > state.maxCombo) state.maxCombo = state.combo;
  const currentWPM = calcWPM();
  if (currentWPM > state.maxWPM) state.maxWPM = currentWPM;
  
  // Visual feedback
  showFloatGain(earned);
  spawnParticles();
  updateUI();
  save();
}

function calcWPM() {
  const now = Date.now();
  const recent = state.recentKeys.filter(t => now - t < 60000);
  return Math.round(recent.length / 5);
}

// contenteditable input event — works on desktop AND mobile
page.addEventListener('input', function() {
  const newLen = page.textContent.length;
  const delta = Math.abs(newLen - lastPageLen);
  if (delta > 0 && delta < 50) {
    processKey(delta);
  }
  lastPageLen = newLen;
  updateWordCount();
});

// also handle keydown for Enter on mobile
page.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    // input event handles it, but ensure combo
    setTimeout(() => {
      const newLen = page.textContent.length;
      const delta = Math.abs(newLen - lastPageLen);
      if (delta > 0) processKey(delta);
      lastPageLen = newLen;
    }, 10);
  }
});

// Mobile focus
function focusPage() {
  page.focus();
}
page.addEventListener('click', focusPage);
document.addEventListener('touchstart', function(e) {
  if (e.target.closest('#sidebar') || e.target.closest('.toolbar') || e.target.closest('.statusbar')) return;
  setTimeout(focusPage, 100);
}, { passive: true });

// ═══════════════════════════════════════
// EDITOR COMMANDS
// ═══════════════════════════════════════
function exec(cmd, val) {
  page.focus();
  document.execCommand(cmd, false, val);
  page.focus();
  updateToolbar();
}
function applyHeading(tag) {
  exec('formatBlock', '<' + tag + '>');
}
function updateToolbar() {
  ['bold','italic','underline','strikeThrough'].forEach(cmd => {
    const btn = document.querySelector('[onclick*="\''+cmd+'\'"]');
    if (btn) {
      try { btn.classList.toggle('active', document.queryCommandState(cmd)); } catch(e){}
    }
  });
}
function updateWordCount() {
  const text = page.textContent.trim();
  const words = text ? text.split(/\s+/).length : 0;
  const chars = text.length;
  document.getElementById('word-count').textContent = words;
  document.getElementById('char-count').textContent = chars;
}

// ═══════════════════════════════════════
// UPGRADES
// ═══════════════════════════════════════
function getUpgradeCost(up, owned) {
  return Math.ceil(up.baseCost * Math.pow(up.costMult, owned));
}
function getEffectiveStats() {
  const theme = THEMES[state.theme];
  let perKey = 1, perSec = 0, incomeMult = 1, comboDecayMult = 1;
  for (const up of theme.upgrades) {
    const count = state.upgrades[up.id] || 0;
    if (count > 0) {
      if (up.effect.perKeyAdd) perKey += up.effect.perKeyAdd * count;
      if (up.effect.perSecAdd) perSec += up.effect.perSecAdd * count;
      if (up.effect.incomeMult) incomeMult *= Math.pow(up.effect.incomeMult, count);
      if (up.effect.comboDecayMult) comboDecayMult *= Math.pow(up.effect.comboDecayMult, count);
    }
  }
  return { perKey, perSec, incomeMult, comboDecayMult };
}
function buyUpgrade(id) {
  const theme = THEMES[state.theme];
  const up = theme.upgrades.find(u => u.id === id);
  if (!up) return;
  const owned = state.upgrades[id] || 0;
  const cost = getUpgradeCost(up, owned);
  if (state.credits >= cost) {
    state.credits -= cost;
    state.upgrades[id] = owned + 1;
    renderUpgrades();
    updateUI();
    save();
  }
}

// ═══════════════════════════════════════
// UI RENDERING
// ═══════════════════════════════════════
function fmt(n) {
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return Math.floor(n).toString();
}
function updateUI() {
  const theme = THEMES[state.theme];
  const stats = getEffectiveStats();
  document.getElementById('cur-sym').textContent = theme.sym;
  document.getElementById('credits-display').textContent = fmt(state.credits);
  document.getElementById('per-key-display').textContent = fmt(stats.perKey * stats.incomeMult);
  document.getElementById('per-sec-display').textContent = fmt(stats.perSec * stats.incomeMult);
  document.getElementById('total-keys-display').textContent = fmt(state.totalKeys);
  document.getElementById('combo-display').textContent = '×' + state.combo.toFixed(1);
  document.getElementById('combo-bar').style.width = Math.min(state.combo / 50 * 100, 100) + '%';
  const wpm = calcWPM();
  document.getElementById('wpm-display').textContent = wpm;
  document.getElementById('play-time-display').textContent = fmtTime(state.playTime);
  document.getElementById('max-combo-stat').textContent = 'Max Combo: ×' + state.maxCombo.toFixed(0);
  document.getElementById('total-earned-stat').textContent = 'Earned: ' + fmt(state.totalEarned);
}
function fmtTime(s) {
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  if (m >= 60) return Math.floor(m/60)+'h '+(m%60)+'m';
  return m+'m '+sec+'s';
}
function renderUpgrades() {
  const theme = THEMES[state.theme];
  const container = document.getElementById('tab-upgrades');
  container.innerHTML = '';
  for (const up of theme.upgrades) {
    const owned = state.upgrades[up.id] || 0;
    const cost = getUpgradeCost(up, owned);
    const affordable = state.credits >= cost;
    const div = document.createElement('div');
    div.className = 'upgrade-item' + (affordable ? '' : ' disabled');
    div.innerHTML = `<div class="up-name">${up.name}</div><div class="up-desc">${up.desc}</div><div class="up-bottom"><span class="up-cost">${THEMES[state.theme].sym}${fmt(cost)}</span><span class="up-count">×${owned}</span></div>`;
    if (affordable) div.onclick = () => buyUpgrade(up.id);
    container.appendChild(div);
  }
}
function renderAchievements() {
  const container = document.getElementById('tab-achievements');
  container.innerHTML = '';
  for (const ach of ACHIEVEMENTS) {
    const unlocked = state.unlockedAch[ach.id];
    const div = document.createElement('div');
    div.className = 'ach-item ' + (unlocked ? 'unlocked' : 'locked');
    div.innerHTML = `<span class="ach-icon">${unlocked ? ach.icon : '🔒'}</span><div><div style="font-weight:600">${ach.name}</div><div style="color:#888;font-size:10px">${ach.desc}</div></div>`;
    container.appendChild(div);
  }
}
function checkAchievements() {
  let changed = false;
  for (const ach of ACHIEVEMENTS) {
    if (!state.unlockedAch[ach.id] && ach.check(state)) {
      state.unlockedAch[ach.id] = true;
      changed = true;
      showAchievement(ach);
    }
  }
  if (changed) { renderAchievements(); save(); }
}
function showAchievement(ach) {
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:20px;right:20px;background:var(--panel2);border:1px solid var(--accent);border-radius:12px;padding:12px 20px;z-index:9999;display:flex;align-items:center;gap:10px;animation:floatUp 3s ease-out forwards;box-shadow:0 4px 20px rgba(0,0,0,0.4)';
  div.innerHTML = `<span style="font-size:24px">${ach.icon}</span><div><div style="font-weight:700;color:var(--accent)">Achievement!</div><div style="font-size:12px">${ach.name}</div></div>`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 3000);
}
function switchTab(tab) {
  currentSbTab = tab;
  document.querySelectorAll('.sb-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.sb-tab[onclick*="${tab}"]`).classList.add('active');
  document.getElementById('tab-upgrades').style.display = tab === 'upgrades' ? '' : 'none';
  document.getElementById('tab-achievements').style.display = tab === 'achievements' ? '' : 'none';
}

// ═══════════════════════════════════════
// VISUAL EFFECTS
// ═══════════════════════════════════════
function showFloatGain(amount) {
  const theme = THEMES[state.theme];
  const div = document.createElement('div');
  div.className = 'float-gain';
  div.textContent = '+' + fmt(amount) + theme.sym;
  div.style.color = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const rect = page.getBoundingClientRect();
  div.style.left = (rect.left + rect.width/2 + (Math.random()-0.5)*100) + 'px';
  div.style.top = (rect.top + 30 + Math.random()*60) + 'px';
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 1000);
}
function spawnParticles() {
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const rect = page.getBoundingClientRect();
  for (let i = 0; i < 3; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.background = accent;
    p.style.left = (rect.left + rect.width/2 + (Math.random()-0.5)*80) + 'px';
    p.style.top = (rect.top + 50 + Math.random()*40) + 'px';
    document.body.appendChild(p);
    const angle = Math.random() * Math.PI - Math.PI/2;
    const dist = 40 + Math.random() * 60;
    p.animate([
      { transform: 'translate(0,0)', opacity: 1 },
      { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist - 40}px)`, opacity: 0 }
    ], { duration: 800, easing: 'ease-out' });
    setTimeout(() => p.remove(), 800);
  }
}

// ═══════════════════════════════════════
// THEMES
// ═══════════════════════════════════════
function changeTheme(name) {
  state.theme = name;
  document.body.className = 'theme-' + name;
  const theme = THEMES[name];
  page.style.background = theme.pageBg;
  page.style.color = theme.pageColor;
  page.style.fontFamily = theme.pageFont;
  document.getElementById('doc-title').style.color = theme.pageBg === '#fff' ? '#fff' : theme.pageBg;
  renderUpgrades();
  updateUI();
  save();
}

// ═══════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════
let lastTick = Date.now();
function gameLoop() {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  state.playTime += dt;
  
  // Idle income
  const stats = getEffectiveStats();
  if (stats.perSec > 0) {
    const income = stats.perSec * stats.incomeMult * dt;
    state.credits += income;
    state.totalEarned += income;
  }
  
  // Combo decay
  const sinceKey = now - state.comboTimer;
  if (sinceKey > 1500 && state.combo > 1) {
    const decayRate = 0.5 * stats.comboDecayMult;
    state.combo = Math.max(1, state.combo - decayRate * dt);
  }
  
  updateUI();
  
  // Refresh upgrade affordability periodically
  if (Math.floor(state.playTime) % 2 === 0) {
    renderUpgrades();
    checkAchievements();
  }
  
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════
// SAVE / LOAD
// ═══════════════════════════════════════
let saveTimer = null;
function save() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem('wordtyper_pro', JSON.stringify(state));
    } catch(e) {}
  }, 500);
}
function load() {
  try {
    const saved = localStorage.getItem('wordtyper_pro');
    if (saved) {
      const loaded = JSON.parse(saved);
      Object.assign(state, loaded);
    }
  } catch(e) {}
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
load();
changeTheme(state.theme);
document.getElementById('theme-select').value = state.theme;
renderUpgrades();
renderAchievements();
updateUI();
updateWordCount();
page.focus();
gameLoop();

// Prevent context menu on toolbar buttons for mobile feel
document.querySelectorAll('.tb-btn').forEach(btn => {
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

// Periodic word count
page.addEventListener('keyup', updateWordCount);
page.addEventListener('mouseup', updateToolbar);
</script>
