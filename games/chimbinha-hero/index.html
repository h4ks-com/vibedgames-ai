<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Guitar Hero: Chimbinha Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0b0518;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;display:block}
.hidden{display:none!important}
/* MENU */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% -20%,#3b1560 0%,#0b0518 60%);z-index:30;padding:20px;text-align:center}
#menu h1{font-size:clamp(28px,6vw,54px);letter-spacing:4px;background:linear-gradient(90deg,#aaff00,#00e5ff,#ff2d95);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(255,45,149,.35)}
#menu .sub{font-size:clamp(14px,3vw,20px);color:#ffd76b;margin-top:-8px}
.diff{width:min(460px,92vw);padding:14px 18px;border-radius:14px;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);text-align:left;transition:transform .12s,border-color .12s,box-shadow .12s;font-size:clamp(14px,2.6vw,17px);line-height:1.35}
.diff:hover{transform:scale(1.03);border-color:#ffd76b;box-shadow:0 0 24px rgba(255,215,107,.25)}
.diff b{display:block;font-size:clamp(17px,3.2vw,22px)}
.diff .best{float:right;color:#8be9a8;font-size:12px;margin-top:4px}
#keysline{color:#aaa;font-size:clamp(11px,2.4vw,14px)}
#taunt{color:#777;font-size:clamp(11px,2.4vw,13px);font-style:italic}
/* PADS */
#pads{position:fixed;left:0;right:0;bottom:0;display:flex;z-index:20;height:19vh;min-height:70px}
#pads button{flex:1;border:none;border-top:2px solid rgba(255,255,255,.15);background:rgba(20,10,40,.85);color:#fff;font-size:clamp(18px,4vw,26px);font-weight:800;font-family:inherit}
#pads button:active{filter:brightness(2)}
/* OVERLAY */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,2,15,.86);z-index:25;padding:18px}
#overlay .card{max-width:520px;width:100%;text-align:center;background:rgba(30,15,60,.9);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:26px 22px}
#overlay h2{font-size:clamp(20px,5vw,34px);margin-bottom:10px}
#fc{color:#ffd76b;font-size:clamp(13px,3vw,17px);margin-bottom:8px;text-shadow:0 0 14px rgba(255,215,107,.5)}
.rank{font-size:clamp(60px,16vw,110px);font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#ffd76b);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;text-align:left;font-size:clamp(12px,2.8vw,15px);margin:10px 0 16px}
.stats div span{color:#9a8fc0}
#overlay .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#overlay button{padding:10px 22px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(90deg,#ff2d95,#b46bff);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
#overlay button.sec{background:none}
#pausehint{color:#999;font-size:13px;margin-bottom:6px}
#hud{position:fixed;top:8px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;z-index:10;font-weight:800;font-size:clamp(14px,3.4vw,20px);text-shadow:0 0 8px rgba(0,0,0,.8);pointer-events:none}
#hud .mid{position:absolute;left:50%;transform:translateX(-50%);text-align:center}
#combo{font-size:clamp(20px,6vw,34px);color:#ffd76b}
#mult{font-size:clamp(11px,2.6vw,14px);color:#8be9a8}
#pausebtn{position:fixed;top:8px;right:10px;z-index:26;background:none;border:1px solid rgba(255,255,255,.25);color:#ccc;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="menu">
  <h1>GUITAR HERO</h1>
  <div class="sub">🎧 GUITARRA PEQUENA TROPICAL 🎸</div>
  <button class="diff" data-d="0"><span class="best" id="best0"></span><b>🌴 FÁCIL</b>for gringos — quarter notes</button>
  <button class="diff" data-d="1"><span class="best" id="best1"></span><b>🔥 MÉDIO</b>eighth notes + chord stabs</button>
  <button class="diff" data-d="2"><span class="best" id="best2"></span><b>🌶️ INSANO — CHIMBINHA MODE</b>16th-note picking at 150 BPM. Boa sorte.</button>
  <div id="keysline">Keys: <b>A S D F G</b> (or 1–5) &nbsp;•&nbsp; mobile: tap the pads</div>
  <div id="taunt">Hit gems on the line. Combo ×2 ×3 ×4. Don't embarrass yourself.</div>
</div>

<div id="hud" class="hidden"><div id="score">0</div><div class="mid"><div id="combo"></div><div id="mult"></div></div><div id="acc">100.0%</div></div>
<button id="pausebtn" class="hidden">⏸</button>

<div id="pads" class="hidden">
  <button data-l="0">A</button><button data-l="1">S</button><button data-l="2">D</button><button data-l="3">F</button><button data-l="4">G</button>
</div>

<div id="overlay" class="hidden"><div class="card" id="ocard"></div></div>

<script>
"use strict";
const BPM=150, BEAT=60/BPM, BAR=4*BEAT, SIXT=BEAT/4, TOTAL_BARS=32, LEAD=1.6;
const PROG=[
 {root:45,tones:[57,60,64,69]},   // Am
 {root:41,tones:[53,57,60,65]},   // F
 {root:43,tones:[55,59,62,67]},   // G
 {root:40,tones:[52,56,59,64]},   // E
];
const LANECOL=['#aaff00','#00e5ff','#ff2d95','#ff9f1c','#b46bff'];
const KEYMAP={KeyA:0,KeyS:1,KeyD:2,KeyF:3,KeyG:4,Digit1:0,Digit2:1,Digit3:2,Digit4:3,Digit5:4};
const JUDGE={perfect:.07,great:.13,good:.19};
const DIFFN=['FÁCIL','MÉDIO','INSANO'];

let state='menu', diff=1, ac=null, songStart=0, nextStep=0, schedTimer=null;
let chart=[], notes=[], songTime=-LEAD, particles=[], shake=0;
let score=0, combo=0, maxCombo=0, mult=1, counts={perfect:0,great:0,good:0,miss:0}, lastHitT=-9, totalNotes=0;
let padFlash=[0,0,0,0,0];

const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();

function mtof(m){return 440*Math.pow(2,(m-69)/12)}

/* ---------------- AUDIO ---------------- */
let master,leadBus,bassBus,drumBus,noiseBuf;
function initAudio(){
  if(ac)return;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=.8;master.connect(ac.destination);
  leadBus=ac.createGain();leadBus.gain.value=.5;
  const dly=ac.createDelay(1);dly.delayTime.value=SIXT*3;
  const fb=ac.createGain();fb.gain.value=.22;
  leadBus.connect(master);leadBus.connect(dly);dly.connect(fb);fb.connect(dly);dly.connect(master);
  bassBus=ac.createGain();bassBus.gain.value=.55;bassBus.connect(master);
  drumBus=ac.createGain();drumBus.gain.value=.7;drumBus.connect(master);
  noiseBuf=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function lead(t,midi,dur,acc){
  const f0=mtof(midi),o=ac.createOscillator();o.type='sawtooth';
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=acc?2600:1900;f.Q.value=6;
  const g=ac.createGain();
  o.frequency.setValueAtTime(f0*.8,t);
  o.frequency.exponentialRampToValueAtTime(f0*(acc?1.0:.99),t+.045);
  const lfo=ac.createOscillator();lfo.frequency.value=5.5;
  const lg=ac.createGain();lg.gain.value=f0*.012;lfo.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(acc?.17:.12,t+.008);
  g.gain.setValueAtTime(acc?.17:.12,t+dur*.65);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(f);f.connect(g);g.connect(leadBus);
  o.start(t);o.stop(t+dur+.05);lfo.start(t);lfo.stop(t+dur+.05);
}
function bass(t,midi,dur){
  const f0=mtof(midi);
  const o=ac.createOscillator();o.type='square';o.frequency.value=f0;
  const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=f0/2;
  const g=ac.createGain();
  g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;
  o.connect(lp);lp.connect(g);o2.connect(g);g.connect(bassBus);
  o.start(t);o.stop(t+dur+.02);o2.start(t);o2.stop(t+dur+.02);
}
function noise(t,dur,type,freq,q,vol){
  const s=ac.createBufferSource();s.buffer=noiseBuf;
  const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=ac.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(drumBus);s.start(t);s.stop(t+dur+.02);
}
const hat=t=>noise(t,.035,'highpass',7500,1,.16);
const clap=t=>{noise(t,.008,'bandpass',1500,2,.5);noise(t+.012,.05,'bandpass',1300,1.5,.35)};
const kick=t=>{
  const o=ac.createOscillator(),g=ac.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.09);
  g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.connect(g);g.connect(drumBus);o.start(t);o.stop(t+.2);
};
const BPAT=[0,2,3,4,6,8,10,11,12,14], MPAT=[0,2,1,3], HATG=[.9,.25,.5,.25];
function playStep(step,t){
  const bar=Math.floor(step/16), s=step%16, ci=bar%4, ch=PROG[ci];
  if(s%4===0)kick(t);
  if(bar%2===1&&s===14)kick(t);
  hat(t);if(HATG[s%4]>.5)noise(t,.02,'highpass',9000,1,.08);
  if(s===4||s===12)clap(t);
  if(BPAT.includes(s)){
    const oct=(s===11||s===14)?12:0;
    bass(t,ch.root+(s===7?12:0)+oct,s===0?.22:.13);
  }
  const tone=ch.tones[MPAT[(s+bar)%4]]+((s%4===0)?12:0);
  lead(t,tone,SIXT*1.6,s%4===0);
}

/* ---------------- CHART ---------------- */
function makeChart(d){
  const out=[];
  const laneOf=(tone,ci)=>(ci*2+tone*3)%5;
  for(let bar=0;bar<TOTAL_BARS;bar++){
    const ci=bar%4;
    for(let s=0;s<16;s++){
      let hit=false;
      if(d===0)hit=(s%4===0)&&!(bar%2===1&&s===12);
      else if(d===1)hit=(s%2===0)&&s!==6&&s!==14;
      else hit=s!==13;
      if(!hit)continue;
      const t=bar*BAR+s*SIXT, l=laneOf(MPAT[(s+bar)%4],ci);
      out.push({t,lane:l,j:0});
      if(d===1&&s===0&&bar%4===0)out.push({t,lane:(l+2)%5,j:0});
    }
  }
  return out.sort((a,b)=>a.t-b.t||a.lane-b.lane);
}

/* ---------------- GAME FLOW ---------------- */
function startGame(d){
  diff=d;initAudio();ac.resume();
  chart=makeChart(d);notes=chart.map(n=>({...n}));
  totalNotes=notes.length;
  score=0;combo=0;maxCombo=0;mult=1;counts={perfect:0,great:0,good:0,miss:0};
  particles=[];shake=0;lastHitT=-9;
  songStart=ac.currentTime+LEAD;nextStep=0;
  state='play';
  $('menu').classList.add('hidden');$('overlay').classList.add('hidden');
  $('hud').classList.remove('hidden');$('pads').classList.remove('hidden');$('pausebtn').classList.remove('hidden');
  clearInterval(schedTimer);
  schedTimer=setInterval(()=>{
    if(state!=='play')return;
    while(nextStep<TOTAL_BARS*16){
      const t=songStart+nextStep*SIXT;
      if(t>ac.currentTime+.15)break;
      playStep(nextStep,Math.max(t,ac.currentTime+.005));nextStep++;
    }
  },30);
}
function songNow(){return ac?ac.currentTime-songStart:-LEAD}
function pauseGame(){
  if(state!=='play')return;
  pausedAt=songNow();ac.suspend();state='pause';
  showCard(`<h2>⏸ PAUSED</h2><div id="pausehint">click / tap to resume</div>`);
}
let pausedAt=0;
function resumeGame(){
  if(state!=='pause')return;
  ac.resume();songStart=ac.currentTime-pausedAt;state='play';
  $('overlay').classList.add('hidden');
}
function rank(){const a=accuracy();return a>=.95?'S':a>=.9?'A':a>=.8?'B':a>=.7?'C':'D'}
function accuracy(){const n=totalNotes||1;return (counts.perfect+counts.great*.75+counts.good*.4)/n}
function endGame(){
  state='end';clearInterval(schedTimer);
  const r=rank(),fc=counts.miss===0;
  try{
    const k='chimbinha-best-'+diff,prev=+localStorage.getItem(k)||0;
    if(score>prev)localStorage.setItem(k,score);
  }catch(e){}
  showCard(
    (fc?`<div id="fc">🎸 FULL COMBO — G.P.T. CERTIFIED (GUITARRA PEQUENA TROPICAL)</div>`:'')+
    `<div class="rank">${r}</div><h2>${DIFFN[diff]} — ${score.toLocaleString()}</h2>
     <div class="stats">
       <div><span>Accuracy</span> ${(accuracy()*100).toFixed(1)}%</div>
       <div><span>Max combo</span> ${maxCombo}</div>
       <div><span>Perfect / Great / Good</span> ${counts.perfect} / ${counts.great} / ${counts.good}</div>
       <div><span>Miss</span> ${counts.miss}</div>
     </div>
     <div class="btns"><button onclick="startGame(diff)">▶ PLAY AGAIN</button><button class="sec" onclick="toMenu()">☰ MENU</button></div>`);
}
function toMenu(){
  state='menu';clearInterval(schedTimer);
  $('overlay').classList.add('hidden');$('hud').classList.add('hidden');
  $('pads').classList.add('hidden');$('pausebtn').classList.add('hidden');
  $('menu').classList.remove('hidden');updateBests();
}
function showCard(html){$('ocard').innerHTML=html;$('overlay').classList.remove('hidden')}
function updateBests(){for(let i=0;i<3;i++){try{const b=+localStorage.getItem('chimbinha-best-'+i)||0;$('best'+i).textContent=b?('best '+b.toLocaleString()):''}catch(e){}}}
window.startGame=startGame;window.toMenu=toMenu;

/* ---------------- INPUT ---------------- */
function hitLane(lane){
  if(state==='pause'){resumeGame();return}
  if(state!=='play')return;
  padFlash[lane]=1;
  const now=songNow();let best=null,bd=1;
  for(const n of notes){
    if(n.j||n.lane!==lane)continue;
    const dt=n.t-now;
    if(dt>-.22&&dt<.22&&Math.abs(dt)<Math.abs(bd)){bd=dt;best=n}
  }
  if(!best)return;
  const a=Math.abs(bd);
  let pts,txt,col;
  if(a<=JUDGE.perfect){pts=100;txt='PERFECT';col='#aaff00';counts.perfect++}
  else if(a<=JUDGE.great){pts=70;txt='GREAT';col='#00e5ff';counts.great++}
  else{pts=40;txt='GOOD';col='#ff9f1c';counts.good++}
  best.j=1;combo++;maxCombo=Math.max(maxCombo,combo);lastHitT=now;
  mult=combo>=30?4:combo>=20?3:combo>=10?2:1;
  score+=pts*mult;
  const laneW=Math.min(W/5,140),x=lane*laneW+laneW/2,y=H*.82;
  for(let i=0;i<10;i++)particles.push({x,y,vx:(Math.random()-.5)*260,vy:-Math.random()*300-60,life:.5,col});
  judging={txt,col,t:now};
}
let judging=null;
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='Escape'||e.code==='KeyP'){state==='play'?pauseGame():state==='pause'&&resumeGame();return}
  const l=KEYMAP[e.code];if(l!==undefined)hitLane(l);
});
document.querySelectorAll('#pads button').forEach(b=>{
  const h=e=>{e.preventDefault();hitLane(+b.dataset.l)};
  b.addEventListener('touchstart',h,{passive:false});b.addEventListener('mousedown',h);
});
$('overlay').addEventListener('click',()=>{if(state==='pause')resumeGame()});
$('pausebtn').addEventListener('click',pauseGame);
document.querySelectorAll('.diff').forEach(b=>b.addEventListener('click',()=>startGame(+b.dataset.d)));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame()});

/* ---------------- RENDER ---------------- */
function draw(ts){
  requestAnimationFrame(draw);
  if(state==='menu'||state==='end'){/* menu covers */return}
  const now=songNow();
  // miss sweep
  if(state==='play')for(const n of notes){
    if(!n.j&&n.t<now-.19){n.j=2;counts.miss++;combo=0;mult=1;shake=Math.max(shake,5)}
    if(n.t>now+2)break;
  }
  if(state==='play'&&now>TOTAL_BARS*BAR+1.5){endGame();return}
  // bg
  ctx.fillStyle='#0b0518';ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(80,30,140,.35)');g.addColorStop(1,'rgba(10,5,25,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  let ox=0,oy=0;
  if(shake>0){ox=(Math.random()-.5)*shake;oy=(Math.random()-.5)*shake;shake*=.85}
  ctx.save();ctx.translate(ox,oy);
  const laneW=Math.min(W/5,140),boardX=(W-laneW*5)/2,hitY=H*.82;
  // lanes
  for(let i=0;i<5;i++){
    const x=boardX+i*laneW;
    ctx.fillStyle=i%2?'rgba(255,255,255,.02)':'rgba(255,255,255,.04)';
    ctx.fillRect(x,0,laneW,hitY);
    // hit pad
    const fl=padFlash[i];padFlash[i]*=.85;
    ctx.fillStyle=LANECOL[i];
    ctx.globalAlpha=.25+fl*.55;
    ctx.beginPath();ctx.roundRect(x+6,hitY-14,laneW-12,28,10);ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle=LANECOL[i];ctx.globalAlpha=.35+fl*.6;ctx.lineWidth=2;ctx.stroke();
    ctx.globalAlpha=.9;ctx.fillStyle='#ddd';ctx.font='700 14px sans-serif';ctx.textAlign='center';
    ctx.fillText('ASDFG'[i],x+laneW/2,hitY+42);ctx.globalAlpha=1;
  }
  const APP=1.35;
  for(const n of notes){
    if(n.j)continue;
    const dt=n.t-now;
    if(dt>APP)break;
    const y=hitY-(dt/APP)*hitY;
    if(y<-40)continue;
    const x=boardX+n.lane*laneW;
    ctx.fillStyle=LANECOL[n.lane];
    ctx.shadowColor=LANECOL[n.lane];ctx.shadowBlur=14;
    ctx.beginPath();ctx.roundRect(x+10,y-11,laneW-20,22,8);ctx.fill();
    ctx.shadowBlur=0;
  }
  // particles
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    p.life-=.016;p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy+=900*.016;
    ctx.globalAlpha=Math.max(p.life*2,0);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  // countdown
  ctx.textAlign='center';
  if(now<0){
    const n=Math.ceil(-now/BEAT*2)/2;
    ctx.fillStyle='#ffd76b';ctx.font='900 '+Math.min(W,H)*.18+'px sans-serif';
    ctx.fillText(n>1?Math.ceil(n):'VAI!',W/2,H*.4);
  }
  // judgment text
  if(judging&&now-judging.t<.4){
    const a=1-(now-judging.t)/.4;
    ctx.globalAlpha=a;ctx.fillStyle=judging.col;
    ctx.font='900 '+Math.min(W,H)*.06+'px sans-serif';
    ctx.fillText(judging.txt,W/2,hitY-Math.min(W,H)*.12);ctx.globalAlpha=1;
  }
  // combo
  const cs=1+.35*Math.exp(-Math.max(now-lastHitT,0)*8);
  if(combo>2){
    ctx.fillStyle='#ffd76b';ctx.font='900 '+(Math.min(W,H)*.07*cs)+'px sans-serif';
    ctx.fillText(combo,W/2,H*.24);
    ctx.font='700 '+Math.min(W,H)*.03+'px sans-serif';ctx.fillText('COMBO',W/2,H*.24+Math.min(W,H)*.04);
  }
  ctx.restore();
  // hud dom
  $('score').textContent=score.toLocaleString();
  $('acc').textContent=(accuracy()*100).toFixed(1)+'%';
  $('combo').textContent=combo>0?'×'+mult:'';
  $('mult').textContent=combo>=10?('combo '+combo):'';
}
requestAnimationFrame(draw);
updateBests();
</script>
</body>
</html>
