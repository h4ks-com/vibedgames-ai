  if (!s) return null;
  nz_state = (bst_fnv(name, 0x2a03) | 1) >>> 0;
  const tick = s.beat / TPB;
  let n = Math.trunc(s.beats * s.beat * FS);

  for (let t = 0; t < 4; t++){
    const tr = s.tr[t];
    if (!tr.ev || tr.vol <= 0.0) continue;

    let at = 0, k = 0;

    while (pos < total){

        const f = t < 3 ? note_hz(note) : 0.0;

  return emit(n, 0.32);
}
function bed_render(name){ return tune_render(name, 1); }
function jingle_render(name){ return tune_render(name, 0); }

/* ── the creatures ────────────────────────────────────────── */
function new_being(){ return {kind: 0, room: 0, cell: 0, alive: 0, state: 0, home: 0, timer: 0, cool: 0, hp: 0, dir: 0}; }

/* ── the worlds, built ──────────────────────────────────────
 * The tables above are read once into a state that can change: an

    if (!passable_ground(RS[r].c[c].ground) || RS[r].c[c].thing >= 0) continue;
    if (r < WORLD_N && is_mark(RS[r].c[c].ch)) continue;   /* a creature's mark */
    const d = (cell_tx(c) - tx) * (cell_tx(c) - tx) + (row_of(c) - row) * (row_of(c) - row) * 9;
    if (d < bd){ bd = d; best = c; }
  }

/* the planet an area belongs to, for the tune and the name */
function area_planet(a){
  const n = AREA[a].name;
  if (n === "forest" || n === "swamp" || n === "village") return P_MASABA;
  if (n.startsWith("lek") || n.startsWith("under")) return P_LEKYTHOS;
  if (n.startsWith("shroud")) return P_SHROUD;

  else if (n.startsWith("lek") || n === "lapith" || n === "ibex" || n === "temoku"){ floor = G_STONE; wall = G_CLIFF; }
  else if (n.startsWith("under")){ floor = G_DECK; wall = G_WALL; }

}
function reset_room(R){

function build_area(a){

    const R = RS[r];

    R.tune = planet_tune(area_planet(a));

      R.c[c].ch = w[c]; R.c[c].thing = -1; R.c[c].inside = -1;
      R.c[c].ground = w[c] === '.' ? floor : wall;

function build_drawn(d){

    const line = D.rows[row];

      const k = R.c[i];
      k.ch = p; k.thing = -1; k.inside = -1;

/* the temple: which tile of a row is the right one, from the walkthrough, and what symbol each shows */

    const r = DR(R_T1 + rm);
    const col = [0, 0, 0];
    for (let c = 0; c < BOARD_SIZE; c++) if (RS[r].c[c].thing === T_TILE){
      const trow = row_of(c) === 2 ? 2 : row_of(c) === 4 ? 1 : 0;     /* bottom row of tiles first */
      const k = col[trow]++;

    }
  }

    if (k.thing === T_GLYPH){ const g = k.inside, rm = Math.trunc(g / 3), trow = g % 3; k.inside = tile_symbol(rm, trow, TILE_RIGHT[rm][trow]) | (rm << 4) | (trow << 8); }
    k = RS[DR(R_TC2)].c[c];
    if (k.thing === T_GLYPH){ const g = k.inside - 9, rm = 3, trow = g; k.inside = tile_symbol(rm, trow, TILE_RIGHT[rm][trow]) | (rm << 4) | (trow << 8); }

function way_cell(r, ch){ for (let c = 0; c < BOARD_SIZE; c++) if (RS[r].c[c].ch === ch) return c; return -1; }

  for (let i = 0; i < NOTE_N; i++){

    if (r < 0) continue;
    if (N.kind === N_LANDING || N.kind === N_LANDING2) continue;
    let c = floor_near(r, N.row, N.tx);
    if (N.kind === N_THING && N.what === T_DEADROBOT){ c = cell_near(N.row, N.tx); RS[r].c[c].ground = G_STONE; RS[r].c[c].ch = '.'; }   /* the map draws the robot in the gap it blocks */
    if (c < 0) continue;

        /* the cliff face is the wall over the stones */
        let best = -1, bd = 999;
        for (let k = 0; k < BOARD_SIZE; k++) if (RS[r].c[k].ground === G_CLIFF && row_of(k) <= N.row){ const d = Math.abs(cell_tx(k) - N.tx) + 3 * (N.row - row_of(k)); if (d < bd){ bd = d; best = k; } }
        if (best >= 0){ RS[r].c[best].thing = T_CLIFFFACE; RS[r].c[best].inside = 0; }
        continue;
      }
      RS[r].c[c].thing = N.what;
      if (N.what === T_TERMINAL) RS[r].c[c].inside = (N.board % 4) - 1;     /* red, blue, yellow, by board */
      if (N.what === T_SWITCH) RS[r].c[c].inside = N.board === 2 + 1 * 4 ? 0 : 1;   /* security, maintenance */
      if (N.what === T_DEADROBOT){ /* the path is the robot's cell alone */ for (let k = 0; k < BOARD_SIZE; k++) if (k !== c && row_of(k) === row_of(c) && passable_ground(RS[r].c[k].ground)){ RS[r].c[k].ground = G_CLIFF; RS[r].c[k].ch = '#'; } }
    } else if (N.kind === N_ITEM){ RS[r].c[c].thing = T_ITEM; RS[r].c[c].inside = N.what; }

  }

  { const r = area_room("underb", 0);
    if (r >= 0) for (let c = 0; c < BOARD_SIZE; c++) if (passable_ground(RS[r].c[c].ground) && RS[r].c[c].thing < 0 && cell_tx(c) === ((row_of(c) & 1) ? 14 : 12)) RS[r].c[c].thing = T_FORCEFIELD; }

    if (p === P_MASABA || p === P_LEKYTHOS || p === P_SHROUD || p === P_IOTIA || !PLANET[p].area.length) continue;
    const a = area_of_name(PLANET[p].area);
    const r = AREA[a].first + Math.trunc((AREA[a].cols * AREA[a].rows) / 2);
    const c = floor_near(r, 4, 20);
    if (c >= 0) RS[r].c[c].thing = T_YOUNG;
  }
}
function build_world(){
  room_n = ROOM_MAX;
  for (let a = 0; a < AREA_N; a++) build_area(a);

/* the landing of a planet: the board and the cell the transporter puts you on; [room, cell] */
function landing(p, second){
  for (let i = 0; i < NOTE_N; i++){
    const N = NOTE[i];
    if (N.kind !== (second ? N_LANDING2 : N_LANDING)) continue;
    const r = area_room(N.area, N.board);
    if (r < 0 || area_planet(RS[r].area) !== p) continue;
    return [r, floor_near(r, N.row, N.tx)];
  }
  if (!PLANET[p].area.length) return [-1, -1];
  const a = area_of_name(PLANET[p].area);
  const r = AREA[a].first + Math.trunc((AREA[a].cols * AREA[a].rows) / 2);
  return [r, floor_near(r, 4, 16)];

let orbit = P_MASABA;                  /* the planet the Enterprise is over */
let aboard = 1;                        /* on the Enterprise, not on a planet */
let room = 0, cell = 0;                /* where you are, on a planet */
let turn = 0;
let dead = 0, won = 0, gameover = 0;
let dead_how = "";
let deaths = 0;
let last_cell = -1;
let hall_step = 0;                     /* the pillar hall: how many wall symbols touched in order */
let bet_on = 0;                        /* Malone has the money and is dealing */
let gorn_timer = 0, alarm_timer = 0, robot_hold = 0;
let torpedoes = 6, ship_shields = 8, foe_shields = 8, blue_hp = 30;
let flags = 0n;                        /* the story's flags, one bit each */
function HAS(f){ return Number((flags >> BigInt(f)) & 1n); }
function SET(f){ flags |= 1n << BigInt(f); }

const message = ["", ""];
/* the C's say() keeps 159 characters of a message */
function say(s){ message[1] = message[0]; message[0] = s.slice(0, 159); }
function cap_msg(){ const c = message[0].charCodeAt(0); if (c >= 97 && c <= 122) message[0] = message[0][0].toUpperCase() + message[0].slice(1); }
function being_at(r, c){
  for (let i = 0; i < being_n; i++)
    if (beings[i].alive && beings[i].room === r && beings[i].cell === c) return beings[i];
  return null;
}
function officer_being(slot){
  for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].kind === OFFICER[team[slot]].kind && (BEAST[beings[i].kind].flags & BF_CREW)) return beings[i];
  return null;
}
function has_officer(kind){ for (let s = 0; s < 2; s++) if (OFFICER[team[s]].kind === kind && team_hp[team[s]] > 0) return 1; return 0; }
function visible(c){ return 1; }
function solid(r, c){
  if (r < 0 || c < 0) return 1;
  const k = RS[r].c[c];
  if (!passable_ground(k.ground)) return 1;
  if (k.thing >= 0 && !(THING[k.thing].flags & TF_PASS)) return 1;
  return 0;
}
/* ── what the worlds say ──
 * The bed is the planet's tune on a planet, the bridge's on the ship,
 * the map's over the map, the fight's in the fight, the title over the
 * story; a step is the ground stepped on; when a board is entered the
 * worst thing on it calls; a beam is the transporter's jingle.  The C
 * forks a child and writes lines down a pipe; here the lines go to
 * sound_sink, which the page sets and a check leaves null. */
let sound_sink = null;                 /* function(line) or null */
function sound_say(line){ if (sound_sink) sound_sink(line); }
let sound_bed = "";
let show_story = 0;                    /* a page of story, or 0: STORY[show_story - 1] */
let show_map = 0, show_team = 0, show_bridge = 0;
function sound_scene(){
  if (!sound_sink) return;
  let key;
  if (show_story) key = won ? "ending" : "title";
  else if (aboard) key = show_map ? "space" : "bridge";
  else if (room === DR(R_SPACE)) key = "battle";
  else key = TUNE_OF[RS[room].tune];
  if (key !== sound_bed){ sound_bed = key; sound_say("bed " + key); }
}
function sound_step(c){
  if (!sound_sink) return;
  sound_say("step " + GROUND[RS[room].c[c].ground].name);
}
function sound_beasts(){
  if (!sound_sink) return;
  let worst = null;
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (!b.alive || b.room !== room || (BEAST[b.kind].flags & (BF_CREW | BF_TALK))) continue;
    if (!worst || BEAST[b.kind].dmg > BEAST[worst.kind].dmg) worst = b;
  }
  if (worst) sound_say("call " + BEAST[worst.kind].name);
}

/* ── the game ───────────────────────────────────────────────
 * Everything below is what happens when a key is pressed: a step, a
 * talk, a shot, an item used, and then the creatures' turn and the
 * board's. */
let show_keys = 0, show_look = 0, show_items = 0, ask_dir = 0, ask_item = 0, show_intro = 0;
let walk_keys = 0;

function spawn(kind, r, c){
  if (being_n >= BEING_MAX) return null;
  if (beings.length <= being_n) beings.push(new_being());
  const b = beings[being_n++];
  b.kind = kind; b.room = r; b.cell = c; b.home = c;
  b.alive = 1; b.state = 0; b.timer = 0; b.cool = 0; b.hp = (BEAST[kind].flags & BF_HARDY) ? 3 : 1;
  if (kind === BK_WARBIRD) b.hp = 8;
  b.dir = roll(0, 1);
  if (room === r && !(BEAST[kind].flags & (BF_CREW | BF_TALK)) && !aboard) sound_say("call " + BEAST[kind].name);
  return b;
}
/* the creatures a board starts with: the marks the notes and the legends left */
function spawn_room(r){
  for (let c = 0; c < BOARD_SIZE; c++){
    const ch = RS[r].c[c].ch;
    if (r < WORLD_N){ const code = ch.charCodeAt(0); if (code >= 49 && code <= 57 + 26){ const kind = code - 49; spawn(kind, r, c); } continue; }
    const D = DRAWN[r - WORLD_N];
    for (let l = 0; l < D.legend.length; l++) if (D.legend[l].ch === ch && D.legend[l].beast >= 0) spawn(D.legend[l].beast, r, c);
  }
}
/* the creatures of a board, as they were: a mission begun again */
function respawn_room(r){
  let w = 0;
  for (let i = 0; i < being_n; i++) if (beings[i].room !== r || (BEAST[beings[i].kind].flags & BF_CREW)){ const t = beings[w]; beings[w] = beings[i]; beings[i] = t; w++; }
  being_n = w;
  spawn_room(r);
}
function init_world(){
  being_n = 0;
  build_world();
  for (let r = 0; r < ROOM_MAX; r++) spawn_room(r);
  hp = KIRK_HP; for (let i = 0; i < 6; i++) team_hp[i] = OFFICER_HP; redshirts_lost = 0;
  team[0] = 0; team[1] = 1; full_power = 0; have.fill(0); dilithium = 0; orbit = P_MASABA; aboard = 1;
  room = 0; cell = 0; turn = 0; dead = 0; won = 0; gameover = 0; deaths = 0; last_cell = -1; flags = 0n;
  hall_step = 0; bet_on = 0; gorn_timer = 0; alarm_timer = 0; robot_hold = 0; torpedoes = 6; ship_shields = 8; foe_shields = 8; blue_hp = 30;
  message[0] = message[1] = "";
  show_story = 0; show_map = 0; show_team = 0; show_bridge = 1;
}

/* ── the Enterprise ─────────────────────────────────────────
 * The ship is pages: the bridge and its reports, the map and a
 * course, the transporter room where the away team is chosen.  The
 * transporter is the only way down and the only way up. */
function planet_here(){ return PLANET[orbit].name; }
function clear_crew(){
  let w = 0;
  for (let i = 0; i < being_n; i++) if (!(BEAST[beings[i].kind].flags & BF_CREW)){ const t = beings[w]; beings[w] = beings[i]; beings[i] = t; w++; }
  being_n = w;
}
function free_cell_near(r, near){
  for (let d = 0; d < 6; d++){ const n = step_cell(near, d); if (n >= 0 && !solid(r, n) && !being_at(r, n)) return n; }
  for (let c = 0; c < BOARD_SIZE; c++) if (!solid(r, c) && !being_at(r, c) && hex_dist(c, near) <= 2) return c;
  return -1;
}
/* a free cell near with nothing on it, for dropping items */
function drop_cell_near(r, near){
  for (let d = 0; d < 6; d++){ const n = step_cell(near, d); if (n >= 0 && !solid(r, n) && !being_at(r, n) && RS[r].c[n].thing < 0 && !(r === room && n === cell)) return n; }
  for (let c = 0; c < BOARD_SIZE; c++) if (!solid(r, c) && !being_at(r, c) && RS[r].c[c].thing < 0 && !(r === room && c === cell) && hex_dist(c, near) <= 3) return c;
  return -1;
}
function place_crew(){
  clear_crew();
  for (let s = 0; s < 2; s++){
    if (team_hp[team[s]] <= 0) continue;
    let c = free_cell_near(room, cell);
    if (c < 0) c = cell;
    spawn(OFFICER[team[s]].kind, room, c);
  }
}
function beam_up(why){
  if (aboard) return;
  sound_say("whoosh beam");
  sound_say("jingle beam");
  aboard = 1; show_bridge = 1;
  clear_crew();
  hp = KIRK_HP;
  for (let i = 0; i < 6; i++) if (team_hp[i] <= 0){ if (i === 5) redshirts_lost++; team_hp[i] = OFFICER_HP; }
  if (why !== null && why !== undefined) say(why);
  sound_bed = ""; sound_scene();
}
function beam_down(){
  const second = ((orbit === P_SHROUD && HAS(F_DISTRESS)) || (orbit === P_IOTIA && HAS(F_PAST))) ? 1 : 0;

  if (r < 0 || c < 0){ say("Spock: " + PLANET[orbit].why + ", Captain; there is nowhere to beam down to."); cap_msg(); return; }
  sound_say("whoosh beam");
  sound_say("jingle beam");
  aboard = 0; show_bridge = 0; show_map = 0; show_team = 0;
  room = r; cell = c; last_cell = -1;
  place_crew();
  room_enter(-1);
  turn++;
  if (orbit === P_MASABA && !HAS(F_LOWGRADE)) say("Spock: a large structure to the north, Captain, about a hundred and fifty metres, and a settlement to the south.");
  else if (orbit === P_LEKYTHOS && !HAS(F_MELD)) say("Spock: something is coming out of the crater, Captain.  It resembles a creature of Terran mythology.");
  else if (orbit === P_SHROUD && second) say("Scotty put you down twenty-five kilometres north.  There is a communicator on the ground beside you.");
  else if (orbit === P_IOTIA && !second) say("Iotia, in ruins.  Spock: a communicator left here led to this, Captain.");
  else if (orbit === P_IOTIA) say("Iotia, before.  Streets, sidewalks, cars, and a great many hats.");
  else if (orbit !== P_MASABA && orbit !== P_LEKYTHOS && orbit !== P_SHROUD) say("Spock: the geological age of this planet is too short for any substantial deposit, Captain.  Kirk: young crystals are better than none.");
  if (has_officer(BK_GEOLOGIST) && orbit === P_LEKYTHOS) say("The geologist: there is a small deposit of dilithium to the south-west of here, Captain, under the cliff.");

}
/* the map: a course to a planet costs a crystal, and the story has its say on the way */
function warp_to(p){
  if (p === orbit){ say("The Enterprise is in orbit over " + PLANET[p].name + " already."); return 0; }
  if (dilithium <= 0){ say("Scotty: there is no dilithium to warp with, Captain.  Not a crystal."); return 0; }
  if (PLANET[p].zone === Z_ROMULAN && !HAS(F_HIGHGRADE) && p !== P_LEKYTHOS){ say("Spock: that is Romulan space, Captain, and we have not the crystals to get out of it again."); return 0; }
  if (PLANET[p].zone === Z_FEDERATION && !HAS(F_MUDDDIL)){ say("Spock: the Federation is beyond the Neutral Zone, Captain, and we have not the crystals for the crossing."); return 0; }
  dilithium--;
  sound_say("whoosh warp");
  orbit = p;
  show_map = 0; show_bridge = 1;
  say("Warp " + (2 + p % 4) + ", Mr. Sulu.  " + PLANET[p].name + ".");
  if (p === P_LEKYTHOS && !HAS(F_HIGHGRADE)){ dilithium = 0; say("Spock: the crystals are deteriorating, Captain.  We cannot leave Lekythos.  There is high-grade dilithium on the surface."); }
  if (p === P_SHROUD && !HAS(F_ESCORT)){ SET(F_ESCORT); say("Uhura: a Romulan armada, uncloaking, Captain.  They ask why we have violated the treaty.  Yellow alert.  Hail them (h)."); }
  if (p === P_IOTIA && HAS(F_MUDDDIL) && !HAS(F_BATTLEWON) && !HAS(F_ATTACKED)){
    SET(F_ATTACKED);
    say("Spock: a cloaked warbird on the scanner, Captain.  The Romulans have not forgiven Mudd.  Red alert.");
    aboard = 0; show_bridge = 0;
    room = DR(R_SPACE); cell = cell_near(4, 16); last_cell = -1;
    clear_crew();
    respawn_room(room);
    ship_shields = 8; foe_shields = 8; torpedoes = 6;
    const b = spawn(BK_WARBIRD, room, cell_near(1, 24));
    if (b) b.hp = 8;
    room_enter(-1);
  }
  sound_bed = ""; sound_scene();
  return 1;
}
function hail(){
  if (orbit === P_SHROUD && HAS(F_ESCORT) && !HAS(F_MUDDDIL)){ say("Kirk: we are here for reasons beyond our control.  The Romulan commander: your account will be verified.  You are escorted to Shroud IV."); return; }
  say("Uhura: nobody answers, Captain.  Starfleet is out of range.");
}
function report(who){
  switch (who){
  case 1:
    if (!HAS(F_LOWGRADE)) say("Spock: we are in uncharted space, Captain, in a decaying orbit.  The planet below has dilithium at its large structure.");
    else if (!HAS(F_MAPDATA)) say("Spock: the temple's computer had a map of the region.  It is in the ship's computer now.");
    else if (!HAS(F_HIGHGRADE)) say("Spock: the crystals from Masaba are low grade.  Lekythos, to the east, reads dilithium.");
    else if (!HAS(F_MUDDDIL)) say("Spock: the nearest dilithium is on Shroud IV, in the Neutral Zone.  The Romulans will object.");
    else if (!HAS(F_HISTORY)) say("Spock: Sigma Iotia, Captain.  The disturbance is centred there, and so was the Enterprise, once.");
    else if (!HAS(F_PAST)) say("Spock: the library's record says a communicator was left on Iotia and undid the planet.  The warp-speed breakaway manoeuvre would take us back to before it.");
    else say("Spock: we are in Iotia's past, Captain.  The communicator is in somebody's pocket down there.");
    break;
  case 2: say("Sulu: standing orbit over " + planet_here() + ", Captain.  Dilithium for " + dilithium + " more course" + (dilithium === 1 ? "" : "s") + "."); break;
  case 3: say(HAS(F_ESCORT) && orbit === P_SHROUD ? "Uhura: the Romulans are holding station, Captain.  They have verified nothing yet." : "Uhura: nothing on any channel, Captain."); break;
  case 4: say(dilithium ? "Scotty: the crystals will hold for " + dilithium + " jump" + (dilithium === 1 ? "" : "s") + ", Captain, and not one more." : "Scotty: no crystals at all, Captain.  I cannae change the laws of physics."); break;
  case 5: say("McCoy: the crew is fine, Jim.  It's you I worry about.  " + hp + " bars."); break;

  }
}

/* ── the away team's step ───────────────────────────────────
 * A step is a cell in one of the six directions.  Off the rim of an
 * outdoor board is the next board of the area, or the area joined to
 * it there; into a thing is a look or a take or a way; into a person
 * is a talk; into one of your officers is what they know. */
function link_room(r, side){
  /* the board an area's grid joins at this board's side, by LINK, or -1 */
  for (let i = 0; i < LINK_N; i++){
    if (LINK[i].side !== side) continue;
    const a = area_of_name(LINK[i].area);
    if (a < 0 || AREA[a].first + LINK[i].board !== r) continue;
    return area_room(LINK[i].to, LINK[i].to_board);
  }
  return -1;
}
/* the cell a step off the board lands on: the neighbour board, and its opposite rim; [cell, room] */
const NEAR = [0, -4, 4, -8, 8];
function cross_edge(r, c, d){
  if (r >= WORLD_N) return [-1, -1];
  const q = COORD_Q[c] + ANGLE_DQ[d], rr = COORD_R[c] + ANGLE_DR[d];
  let side; const a = RS[r].area, ax = RS[r].ax, ay = RS[r].ay;
  if (rr < -4) side = 3; else if (rr > 4) side = 1; else side = q > COORD_Q[row_last(rr)] ? 0 : 2;
  /* off a corner: a step up out of the top row's ends is north, a step down out of the bottom row's ends is south */
  if ((d === 4 || d === 5) && rr === -4) side = 3;
  if ((d === 1 || d === 2) && rr === 4) side = 1;
  let to = -1;
  if (side === 0 && ax + 1 < AREA[a].cols) to = r + 1;
  else if (side === 2 && ax > 0) to = r - 1;
  else if (side === 1 && ay + 1 < AREA[a].rows) to = r + AREA[a].cols;
  else if (side === 3 && ay > 0) to = r - AREA[a].cols;
  else to = link_room(r, side);
  if (to < 0) return [-1, -1];
  const tx = cell_tx(c) + ANGLE_DQ[d] * 4 + ANGLE_DR[d] * 2; let row = row_of(c) + ANGLE_DR[d];
  if (row < 0) row = 0;
  if (row > 8) row = 8;
  /* the seam is forgiving: the cell straight across, or the nearest open one beside it, or one row further in, since the maps' paths do not stop at board edges */
  for (let depth = 0; depth < 2; depth++)
    for (let i = 0; i < 5; i++){
      let n = -1;
      if (side === 3) n = cell_near(8 - depth, tx + NEAR[i]);
      else if (side === 1) n = cell_near(depth, tx + NEAR[i]);
      else { const rw = row + Math.trunc(NEAR[i] / 4); if (rw < 0 || rw > 8) continue; n = side === 0 ? row_first(rw - 4) : row_last(rw - 4); if (depth){ n = step_cell(n, side === 0 ? 0 : 3); } }
      if (n < 0) continue;
      if (passable_ground(RS[to].c[n].ground) && (RS[to].c[n].thing < 0 || (THING[RS[to].c[n].thing].flags & TF_PASS))) return [n, to];
    }
  return [side === 3 ? cell_near(8, tx) : side === 1 ? cell_near(0, tx) : side === 0 ? row_first(row - 4) : row_last(row - 4), to];
}
/* where a door goes: the WAY table, or an OUTDOOR door going in, or a LINK door going on; [cell, room] */
function way_dest(r, c){
  const k = RS[r].c[c];
  if (r >= WORLD_N){
    for (let i = 0; i < WAY_N; i++) if (DR(WAY[i].room) === r && WAY[i].ch === k.ch){
      if (WAY[i].to >= 0){ const to = DR(WAY[i].to); const tc = way_cell(to, WAY[i].to_ch); const at = free_cell_near(to, tc); return [at >= 0 ? at : tc, to]; }
      const to = area_room(WAY[i].area, WAY[i].board);
      /* out of a building onto the board: the cell beside the door */
      let door = -1;
      for (let j = 0; j < OUTDOOR_N; j++) if (OUTDOOR[j].to === WAY[i].room && OUTDOOR[j].to_ch === WAY[i].ch){ const rr = area_room(OUTDOOR[j].area, OUTDOOR[j].board); for (let cc = 0; cc < BOARD_SIZE; cc++) if (RS[rr].c[cc].thing === OUTDOOR[j].thing && RS[rr].c[cc].inside === j) door = cc; }
      if (door < 0) door = floor_near(to, WAY[i].row, WAY[i].tx);
      const at = free_cell_near(to, door);
      return [at >= 0 ? at : door, to];
    }
    return [-1, -1];
  }
  if (k.thing >= 0 && k.inside >= 0 && k.inside < OUTDOOR_N){
    const O = OUTDOOR[k.inside];
    if (O.to >= 0){ const to = DR(O.to); const tc = way_cell(to, O.to_ch); const at = free_cell_near(to, tc); return [at >= 0 ? at : tc, to]; }
    /* a door between outdoor areas: this door's LINK names the board; land by the door that leads back, if there is one */
    let L = null;
    for (let i = 0; i < LINK_N; i++) if (LINK[i].side === O.side && area_room(LINK[i].area, LINK[i].board) === r){ L = LINK[i]; break; }
    if (!L) return [-1, -1];
    const to = area_room(L.to, L.to_board); let at = -1;
    for (let i = 0; i < LINK_N && at < 0; i++) if (LINK[i].side >= 100 && area_room(LINK[i].area, LINK[i].board) === to && area_room(LINK[i].to, LINK[i].to_board) === r){
      for (let cc = 0; cc < BOARD_SIZE && at < 0; cc++) if (RS[to].c[cc].thing === T_DOOR && RS[to].c[cc].inside >= 0 && OUTDOOR[RS[to].c[cc].inside].area === LINK[i].area && OUTDOOR[RS[to].c[cc].inside].board === LINK[i].board) at = free_cell_near(to, cc);
    }
    if (at < 0) at = floor_near(to, 4, 16);
    return [at, to];
  }
  return [-1, -1];
}
function go_way(r, c){
  if (r === DR(R_PCELLS) && HAS(F_MUDDFREE) && !HAS(F_CAUGHT)){
    /* leaving with Mudd freed: whatever you do, you are shot and put in the brig */
    SET(F_CAUGHT);
    say("A disruptor on stun, from behind.  You wake in the brig, behind a field, and " + (has_officer(BK_SPOCK) ? "Spock" : "your officers") + " with you.");
    arrive(DR(R_BRIG), cell_near(1, 12));
    return;
  }
  const [d, r2] = way_dest(r, c);
  if (d >= 0) arrive(r2, d);
}
function room_enter(from){
  const R = RS[room];
  R.entry = cell;
  if (room < WORLD_N){
    const a = RS[room].area, p = area_planet(a);
    if (!R.seen){ say((p >= 0 ? PLANET[p].name : "?") + ": " + AREA[a].name + ", board " + RS[room].ax + "," + RS[room].ay + "."); cap_msg(); }
  } else if (!R.seen){ say(DRAWN[room - WORLD_N].name + "."); cap_msg(); }
  R.seen = 1;
  /* the officers come along */
  for (let s = 0; s < 2; s++){
    const b = officer_being(s);
    if (!b) continue;
    if (b.room !== room){ const at = free_cell_near(room, cell); if (at >= 0){ b.room = room; b.cell = at; } }
  }
  /* out of the prison: Mudd's note, and his crystals */
  if (from === DR(R_BRIG) && HAS(F_GUARDMELD) && !HAS(F_MUDDDIL)){
    SET(F_MUDDDIL); dilithium += 6;
    sound_say("jingle found");
    say("A note on a rock, from Harry Mudd: thanks, Kirk; there is dilithium in my room at the Inn.  Scotty beams you there, and up, with it: " + dilithium + " courses.");
    beam_up(null);
    return;
  }
  /* what a room says on being entered */
  if (room === DR(R_BARMEET) && !HAS(F_MUDDSEEN)){ SET(F_MUDDSEEN); say("Harry Mudd, at a table with two Romulans: Federation codes, he says, for dilithium and a cloaking device.  The Romulans leave.  Mudd goes out the other way."); for (let i = 0; i < being_n; i++){ const b = beings[i]; if (b.room !== room || !b.alive) continue; if (b.kind === BK_ROMULAN) b.alive = 0; if (b.kind === BK_MUDD){ const to = DR(R_BARMAIN); const at = free_cell_near(to, way_cell(to, 'W')); if (at >= 0){ b.room = to; b.cell = at; } } } }
  if (room === DR(R_ROOM24) && HAS(F_CONFESSED) && !HAS(F_DISTRESS)){ SET(F_DISTRESS); sound_say("blow talk"); say("Spock: phaser fire on the wall, and signs of a struggle.  Mudd was taken alive.  Uhura: a distress call, Captain, Mudd's voice, from the north."); }
  if (room === DR(R_PCELLS) && !HAS(F_MUDDFREE)) say("Harry Mudd, in a cell behind a force field.  The panel on the left holds the fields.");
  if (room === DR(R_HANGOUT) && !HAS(F_PLATES)) say("Sparky's men, two of them.  They do not mind you unless you mind the door at the back.");
  sound_scene();
  sound_beasts();
}
function take_item_at(r, c){
  const k = RS[r].c[c];
  if (k.thing === T_ITEM){
    const it = k.inside;
    have[it] = 1; k.thing = -1; k.inside = -1;

/* ── the creatures' turn ────────────────────────────────── */
function in_line(from, to){
  /* the direction from `from` down which `to` lies within six cells, or -1 */
  for (let d = 0; d < 6; d++){ let c = from; for (let i = 0; i < 6; i++){ c = step_cell(c, d); if (c < 0) break; if (c === to) return d; } }
  return -1;
}
function hurt_kirk(dmg, what){
  hp -= dmg;
  sound_say("blow hit");
  if (hp <= 0){ hp = 0; injured(what); }
}
function hurt_officer(slot, dmg, what){
  const o = team[slot];
  team_hp[o] -= dmg;
  if (team_hp[o] <= 0){
    team_hp[o] = 0;
    const b = officer_being(slot);
    if (b) b.alive = 0;
    if (o === 5){ sound_say("jingle lost"); say(what + ": the security officer is dead."); }
    else { sound_say("jingle lost"); say(what + ": " + OFFICER[o].name + " is down.  Kirk to Enterprise: beam the injured crew member up."); }
  } else say(what + ": " + OFFICER[o].name + ", " + team_hp[o] + " bars.");
}
function officer_slot_at(r, c){ for (let s = 0; s < 2; s++){ const b = officer_being(s); if (b && b.room === r && b.cell === c) return s; } return -1; }
function beast_move_toward(b, target){
  let best = -1, bd = hex_dist(b.cell, target);
  const mist = b.kind === BK_DRAGON;                     /* an illusion goes through rock */
  for (let d = 0; d < 6; d++){
    const n = step_cell(b.cell, d);
    if (n < 0 || (!mist && solid(b.room, n)) || (mist && RS[b.room].c[n].ground === G_VOID) || being_at(b.room, n) || n === cell) continue;
    const dist = hex_dist(n, target);
    if (dist < bd){ bd = dist; best = n; }
  }
  if (best >= 0) b.cell = best;
}
function beast_move_away(b, from){
  let best = -1, bd = hex_dist(b.cell, from);
  for (let d = 0; d < 6; d++){
    const n = step_cell(b.cell, d);
    if (n < 0 || solid(b.room, n) || being_at(b.room, n)) continue;
    const dist = hex_dist(n, from);
    if (dist > bd){ bd = dist; best = n; }
  }
  if (best >= 0) b.cell = best;
}
function beast_wander(b){
  const d = roll(0, 5);
  const n = step_cell(b.cell, d);
  if (n >= 0 && !solid(b.room, n) && !being_at(b.room, n) && n !== cell && hex_dist(n, b.home) <= 3) b.cell = n;
}
function officer_follow(b){
  if (hex_dist(b.cell, cell) <= 1) return;
  beast_move_toward(b, cell);
}
function capital(m){ return m[0].toUpperCase() + m.slice(1); }
function touch_near(b){
  /* a touching creature hurts whoever it stands beside, Kirk first */
  if (hex_dist(b.cell, cell) <= 1){ const m = capital(BEAST[b.kind].name + " " + BEAST[b.kind].verb + " you."); say(m + "  " + (hp - BEAST[b.kind].dmg < 0 ? 0 : hp - BEAST[b.kind].dmg) + " bars."); hurt_kirk(BEAST[b.kind].dmg, m); if (b.kind === BK_DRAGON) SET(F_DRAGONHIT); return; }
  for (let s = 0; s < 2; s++){ const o = officer_being(s); if (o && o.room === b.room && hex_dist(b.cell, o.cell) <= 1){ const m = capital(BEAST[b.kind].name + " " + BEAST[b.kind].verb + " " + OFFICER[team[s]].name); hurt_officer(s, BEAST[b.kind].dmg, m); if (b.kind === BK_DRAGON) SET(F_DRAGONHIT); return; } }
}
function beast_act(b){
  const f = BEAST[b.kind].flags;
  if (f & BF_CREW){ officer_follow(b); return; }
  if (b.state === 2){ if (b.timer > 0 && --b.timer === 0) b.state = 0; return; }        /* stunned */
  if (b.kind === BK_GORN){ if (b.state === 3){ if (gorn_timer > 0 && --gorn_timer === 0) b.state = 0; } return; }
  if (b.kind === BK_MAINTROBOT){
    /* back and forth across its room, through the fields; with the module, dropped when shot */
    b.cool = (b.cool + 1) & 1;
    if (b.cool) return;
    const n = step_cell(b.cell, b.dir === 0 ? 0 : 3);
    if (n < 0 || (!passable_ground(RS[b.room].c[n].ground)) || (RS[b.room].c[n].thing >= 0 && RS[b.room].c[n].thing !== T_FORCEFIELD && RS[b.room].c[n].thing !== T_ITEM)){ b.dir = 1 - b.dir; return; }
    if (n === cell || officer_slot_at(b.room, n) >= 0){ if (n === cell) touch_near(b); return; }
    b.cell = n;
    return;
  }
  if (f & BF_SHOOTS){
    let d;
    b.cool = (b.cool + 1) & 1;
    if (b.cool === 0 && (d = in_line(b.cell, cell)) >= 0 && hex_dist(b.cell, cell) <= 5){
      /* a clear line to you */
      let clear = 1, c = b.cell;
      for (let i = 0; i < 6 && c !== cell; i++){ c = step_cell(c, d); if (c < 0 || c === cell) break; if (solid(b.room, c) || being_at(b.room, c)){ clear = 0; break; } }
      if (clear){
        sound_say(b.kind === BK_SHOOTER ? "shot phaser" : "shot disruptor");
        if (roll(0, 9) < 6){ const m = capital(BEAST[b.kind].name + " " + BEAST[b.kind].verb + " you."); say(m + "  " + (hp - BEAST[b.kind].dmg < 0 ? 0 : hp - BEAST[b.kind].dmg) + " bars."); hurt_kirk(BEAST[b.kind].dmg, m); }
        else { say(BEAST[b.kind].name + " fires, and misses."); cap_msg(); }
        return;
      }
    }
    if (f & BF_STILL) return;
  }
  if (f & BF_STILL) return;
  if (f & BF_HUNT){
    if ((f & BF_FLEES) && have[I_REPELLANT]){ beast_move_away(b, cell); return; }
    if (hex_dist(b.cell, cell) > 8) return;
    beast_move_toward(b, cell);
    if (b.kind === BK_WORM && hex_dist(b.cell, cell) > 1) beast_move_toward(b, cell);
    if (f & BF_TOUCH) touch_near(b);
    return;
  }
  if (f & BF_PATROL){
    b.cool = (b.cool + 1) & 1;
    if (b.cool){ if (f & BF_TOUCH) touch_near(b); return; }
    const n = step_cell(b.cell, b.dir === 0 ? 0 : 3);
    if (n < 0 || solid(b.room, n) || being_at(b.room, n) || n === cell || hex_dist(n, b.home) > 4){ b.dir = 1 - b.dir; }
    else b.cell = n;
    if (f & BF_TOUCH) touch_near(b);
    return;
  }
  if (f & BF_WANDER){ beast_wander(b); return; }
}
function warbird_act(b){
  /* the fight: it keeps two or three cells off and fires down a line */
  const dist = hex_dist(b.cell, cell);
  b.cool = (b.cool + 1) % 3;
  if (dist > 3) beast_move_toward(b, cell);
  else if (dist < 2) beast_move_away(b, cell);
  else if (b.cool === 0){ const n = step_cell(b.cell, roll(0, 5)); if (n >= 0 && !being_at(b.room, n) && n !== cell && hex_dist(n, cell) >= 2) b.cell = n; }
  if (in_line(b.cell, cell) >= 0 && roll(0, 9) < 5){
    sound_say("shot disruptor");
    ship_shields--;
    say("The warbird fires.  Shields at " + ship_shields + ".");
    if (ship_shields <= 0){ dead = 1; gameover = 1; deaths++; show_story = 4; dead_how = "The warbird."; sound_say("bed off"); sound_bed = ""; sound_say("jingle injured"); }
  }
}
function beasts_turn(){
  for (let i = 0; i < being_n && !dead && !won; i++){
    const b = beings[i];
    if (!b.alive || b.room !== room) continue;
    if (b.kind === BK_WARBIRD) warbird_act(b); else beast_act(b);
  }
}

/* ── the boards' own doings ─────────────────────────────── */
function count_kind(r, kind){ let n = 0; for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].room === r && beings[i].kind === kind) n++; return n; }
function room_tick(){
  if (dead || won || aboard) return;
  /* the craters of Lekythos let out a dragon now and then, until Spock has melded */

/* the fight: phasers four cells, a torpedo eight, down a line at the warbird */
function battle_fire(d, torpedo){
  let w = null;
  for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].room === room && beings[i].kind === BK_WARBIRD) w = beings[i];
  if (torpedo && torpedoes <= 0){ say("No torpedoes left."); return; }
  turn++;
  if (torpedo) torpedoes--;
  sound_say(torpedo ? "shot torpedo" : "shot phaser");
  let c = cell, hit = 0;
  for (let i = 0; i < (torpedo ? 8 : 4); i++){ c = step_cell(c, d); if (c < 0) break; if (w && w.cell === c){ hit = 1; break; } }
  if (hit && w){
    foe_shields -= torpedo ? 2 : 1;
    sound_say("blow hit");
    if (foe_shields <= 0){
      w.alive = 0; SET(F_BATTLEWON);
      sound_say("jingle found");
      say("The warbird's shields go, and the warbird goes.  Sulu: course for Sigma Iotia, Captain.");

    }

/* ── the screen ─────────────────────────────────────────────
 * hanb.c's board, cut to the fine hexagon: a cell is four characters
 * by two, which on the fine skin is eight pixels by five with the top
 * and bottom rows pointed.  The ground is its colour, a thing is its
 * shape, a creature is grown, and Kirk is the gold shirt. */
const SHAPE_BRICK = 0, SHAPE_HEX = 1, SHAPE_FINE = 2, SHAPE_N = 3;
let tile_shape = SHAPE_FINE;
const TILE_W = 4, PIX_H = 4, BOARD_Y = 1;
function you_px(gx, gy, gw, gh){
  const hexed = tile_shape !== SHAPE_BRICK;
  const top = (gh >= 4 && hexed) ? 1 : 0;
  const hd = (gh - top >= 4) ? 2 : 1;
  const rest = gh - top - hd;
  const lg = rest >= 2 ? Math.trunc(rest / 2) : rest;
  const sh = rest - lg;
  if (gy < top) return -1;
  const band = gy < top + hd ? 0 : gy < top + hd + sh ? 1 : 2;
  let w = band === 0 ? Math.trunc(gw * 3 / 8) : band === 1 ? Math.trunc(gw * 3 / 4) : Math.trunc(gw / 2);
  if (w < 1) w = 1;
  const x = Math.trunc((gw - w) / 2);
  if (gx < x || gx >= x + w) return -1;
  if (room === DR(R_SPACE)) return band === 1 ? 254 : 250;
  return band === 0 ? 137 : band === 1 ? 220 : 16;
}
function put_pixel(fine, tx, gx, y, c){
  if (fine) pxq(tx * 2 + gx, y, c);
  else      px(tx + gx, y, c);
}
function draw_cell(tx, ty, r, c, mark, lit){
  const k = RS[r].c[c];
  const G = GROUND[k.ground];
  let base = G.bg, acc = G.fg, sprinkle = 32 + G.prom * 10;
  const fine = tile_shape === SHAPE_FINE, hexed = tile_shape !== SHAPE_BRICK;
  const gw = fine ? TILE_W * 2 : TILE_W, gh = hexed ? PIX_H + 1 : PIX_H;
  const tip = Math.trunc(gw / 4), tipw = Math.trunc(gw / 2);
  const y0 = ty * 2 + (hexed ? 1 : 0);
  const tex = hash3u(Math.imul(r, 7919) >>> 0, Number(SEED & 0xFFFFFFFFn) >>> 0, 3);
  const t = k.thing;
  const solidt = t >= 0 && !(THING[t].flags & (TF_PASS | TF_TAKE)) && !(THING[t].flags & TF_PLANT);
  let cap_c = 0, body = 0;
  if (solidt){ cap_c = lighter(THING[t].fg); body = THING[t].fg; }
  const growing = t >= 0 && (THING[t].flags & TF_PLANT) && grow_tile(r, c, t, gw, gh);
  const b = being_at(r, c);
  const beasting = b ? beast_pixels(BEAST[b.kind].name, BEAST[b.kind].fg, gw, gh) : 0;
  if (k.ground === G_VOID){ base = acc = 16; sprinkle = 0; }
  if (k.ground === G_SPACE) sprinkle = 6;
  if (mark === 1) sprinkle = 0;
  for (let gy = 0; gy < gh; gy++){
    let lo = 0, hi = gw;
    if (hexed && (gy === 0 || gy === gh - 1)){ lo = tip; hi = tip + tipw; }
    for (let gx = lo; gx < hi; gx++){
      const h = hash3u(tex, c, gy * 8 + gx);
      let col = ((h & 0xFF) < sprinkle) ? acc : base;
      if (k.ground === G_WATER) col = (((gx + gy * 3 + Math.trunc(turn / 2)) & 7) === 0) ? acc : base;
      if (!G.pass && k.ground !== G_WATER && k.ground !== G_VOID) col = gy === 0 ? lighter(base) : ((h >>> 9) & 3) === 0 ? acc : base;
      if (k.ground === G_SPACE && ((h & 0xFF) < 6)) col = ((h >>> 10) & 1) ? 254 : 250;
      if (solidt){
        col = gy === 0 ? cap_c : gy === gh - 1 ? darker(body) : body;
        if (t === T_HUT) col = gy < 2 ? 178 : ((gx >> 1) & 1) ? 137 : 94;
        if (t === T_FIRE) col = ((h >>> 9) & 3) === 0 ? 226 : ((h >>> 11) & 1) ? 202 : 196;
        if (t === T_CRATER) col = (gx === lo || gx === hi - 1 || gy === 0 || gy === gh - 1) ? 240 : 16;
        if (t === T_GLYPH || t === T_WALLSYM){ const sym = k.inside & 7; col = ((gx + gy) & 1) ? SYMBOL_C[sym] : 94; }
        if (t === T_CELLFIELD || t === T_FORCEFIELD) col = ((gx + gy + turn) & 1) ? 117 : 39;
        if (t === T_BLUEDOOR) col = ((gx + gy) & 1) ? 33 : 39;
        if (t === T_TERMINAL){ const cc = k.inside & 3; col = gy === Math.trunc(gh / 2) && gx >= Math.trunc(gw / 2) - 1 && gx <= Math.trunc(gw / 2) ? (cc === 0 ? 196 : cc === 1 ? 33 : 226) : 45; }
        if (t === T_BOULDER) col = gy === 0 ? 180 : 172;
        if (t === T_CASHPILE) col = ((gx + gy) & 1) ? 34 : 28;
        if (t === T_TEMPLEDOOR) col = gy === Math.trunc(gh / 2) && gx === Math.trunc(gw / 2) ? 226 : 178;
      } else if (t === T_TILE){
        const sym = k.inside & 7;
        col = ((gx + gy) & 1) ? SYMBOL_C[sym] : 94;
      } else if (t === T_DOOR || t === T_STAIRS || t === T_DOOR22 || t === T_DOOR24){
        col = (gx === lo || gx === hi - 1) ? 240 : 233;
      } else if (t === T_ITEM || t === T_YOUNG){
        let w = Math.trunc(gw * 3 / 8); const hh = 2;
        if (w < 2) w = 2;
        const x0 = Math.trunc((gw - w) / 2), yy0 = Math.trunc((gh - hh) / 2);
        if (gx >= x0 && gx < x0 + w && gy >= yy0 && gy < yy0 + hh) col = t === T_YOUNG ? 213 : ITEM[k.inside].fg;
      }
      if (growing && grow_px[gy * GROW_MAXW + gx]) col = grow_px[gy * GROW_MAXW + gx];
      if (beasting === 1 && bst_px[gy * BST_MAXW + gx]) col = b.state === 2 ? darker(bst_px[gy * BST_MAXW + gx]) : bst_px[gy * BST_MAXW + gx];
      if (mark === 1){ const me = you_px(gx, gy, gw, gh); if (me >= 0) col = me; }
      if (!lit) col = 16;
      put_pixel(fine, tx, gx, y0 + gy, col);
    }
  }
}
function draw_board(){
  for (let c = 0; c < BOARD_SIZE; c++){
    const tx = 16 + 4 * COORD_Q[c] + 2 * COORD_R[c];

/* ── a page of text over everything ───────────────────────── */
function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){
      if (s[p + len] === ' ') last_space = len;
      len++;
    }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}

  for (let r = y; r < y + h; r++){ text(x, r, " ", 250, 240); text(x + w - 1, r, " ", 250, 240); }
  const lines = wrap_lines(body, w - 6, 64);
  let row = y + 1;
  for (let i = 0; i < lines.length && row < y + h - 2; i++, row++)
    text(x + 3, row, lines[i], i === 0 ? 223 : fg, 235);
  text(x + 3, y + h - 2, foot, 245, 235);
}

function fb_hash(){
  let h = 2166136261 >>> 0;
  for (let row = 0; row < screen_h; row++)
    for (let col = 0; col < screen_w; col++){
      const at = FB(row, col);
      const ch = fb_ch[at] === FB_QUAD ? 1 : fb_ch[at];
      const q = fb_ch[at] === FB_QUAD ? (fb_q[at] & 15) : 0;
      const v = (fb_fg[at] | (fb_bg[at] << 8) | (q << 16) | (ch << 20)) >>> 0;
      h = Math.imul(h ^ v, 16777619) >>> 0;
      h = Math.imul(h ^ (v >>> 24), 16777619) >>> 0;
    }
  return h;
}

/* ── saving ────────────────────────────────────────────────
 * Everything that is not a function of the seed, as JSON.  The page
 * keeps it in localStorage; a check keeps it in a variable. */
let save_store = {get: () => null, set: (s) => {}};
function save_game(){
  const s = {
    magic: "trek", seed: SEED.toString(), seedtext: SEEDTEXT,
    rs: RS.map(r => ({c: r.c.map(k => [k.ground, k.thing, k.inside, k.ch]), area: r.area, seen: r.seen, entry: r.entry, tune: r.tune, ax: r.ax, ay: r.ay})),
    room_n: room_n,
    beings: beings.slice(0, being_n).map(b => Object.assign({}, b)),
    flags: flags.toString(),
    hp: hp, team: [team[0], team[1]], team_hp: team_hp.slice(), redshirts_lost: redshirts_lost, full_power: full_power,
    dilithium: dilithium, orbit: orbit, aboard: aboard, room: room, cell: cell, deaths: deaths, hall_step: hall_step, bet_on: bet_on,
    gorn_timer: gorn_timer, alarm_timer: alarm_timer, torpedoes: torpedoes, ship_shields: ship_shields, foe_shields: foe_shields, blue_hp: blue_hp,
    have: Array.from(have),
    turn: turn, msg: message.slice(),
  };
  try { save_store.set(JSON.stringify(s)); } catch (e) { return 0; }
  return 1;
}
function load_game(){
  let s;
  try { const j = save_store.get(); if (!j) return 0; s = JSON.parse(j); } catch (e) { return 0; }
  if (!s || s.magic !== "trek") return 0;
  SEED = BigInt(s.seed); SEEDTEXT = s.seedtext;
  for (let r = 0; r < ROOM_MAX; r++){
    const R = RS[r], q = s.rs[r];
    for (let i = 0; i < BOARD_SIZE; i++){ const k = q.c[i]; R.c[i].ground = k[0]; R.c[i].thing = k[1]; R.c[i].inside = k[2]; R.c[i].ch = k[3]; }
    R.area = q.area; R.seen = q.seen; R.entry = q.entry; R.tune = q.tune; R.ax = q.ax; R.ay = q.ay;
  }
  room_n = s.room_n;
  beings.length = 0; for (const b of s.beings) beings.push(Object.assign({}, b)); being_n = beings.length;
  flags = BigInt(s.flags);
  hp = s.hp; team[0] = s.team[0]; team[1] = s.team[1]; for (let i = 0; i < 6; i++) team_hp[i] = s.team_hp[i]; redshirts_lost = s.redshirts_lost; full_power = s.full_power;
  dilithium = s.dilithium; orbit = s.orbit; aboard = s.aboard; room = s.room; cell = s.cell; deaths = s.deaths; hall_step = s.hall_step; bet_on = s.bet_on;
  gorn_timer = s.gorn_timer; alarm_timer = s.alarm_timer; torpedoes = s.torpedoes; ship_shields = s.ship_shields; foe_shields = s.foe_shields; blue_hp = s.blue_hp;
  for (let i = 0; i < I_N; i++) have[i] = s.have[i];
  turn = s.turn;
  message[0] = s.msg[0]; message[1] = s.msg[1];
  dead = 0; won = 0; gameover = 0; show_story = 0; show_items = 0; show_look = 0; ask_dir = 0; ask_item = -1; show_keys = 0; show_map = 0; show_team = 0; show_bridge = aboard;
  grown_keep.length = 0; bst_keep.length = 0;
  sound_bed = ""; sound_scene();
  return 1;
}

/* ── input ──────────────────────────────────────────────── */
function dir_of_key(c){
  switch (c){
  case 'd': return 0; case 'x': return 1; case 'z': return 2;
  case 'a': return 3; case 'w': return 4; case 'e': return 5;
  default: return -1;
  }
}
function new_game(){
  init_world();
  show_intro = 1; show_items = 0; show_look = 0; show_keys = 0; ask_dir = 0; ask_item = -1; show_story = 0;
}
/* One key.  Returns 0 to quit. */
function handle_key(c){
  if (show_intro){
    if (c === 'q' || c === '\x1b' || c === '\x03') return 0;
    show_intro = 0;
    say("The bridge.  Spock: the planet below reads dilithium, Captain, at a large structure.  The transporter room is ready (b).");
    sound_bed = ""; sound_scene();
    return 1;
  }
  if (dead || won){
    if (c === 'n'){ new_game(); show_intro = 0; sound_bed = ""; sound_scene(); return 1; }
    if (c === 'L' && dead){ if (!load_game()) say("There is no saved game."); return 1; }
    if (c === 'c' && dead){ continue_game(); return 1; }
    if (c === 'q' || c === '\x1b' || c === '\x03') return 0;
    return 1;
  }
  if (show_story){ show_story = 0; sound_scene(); return 1; }
  if (show_keys){ show_keys = 0; return 1; }
  if (show_map){
    const p = c.charCodeAt(0) - 97;
    if (p >= 0 && p < P_N){ warp_to(p); show_map = 0; sound_scene(); return 1; }
    if (c === 'q') return 0;
    show_map = 0; sound_scene(); return 1;
  }
  if (show_team){
    for (let i = 0; i < 6; i++) if (c === OFFICER[i].key){
      if (team[1] === i){ say(OFFICER[i].name + " is in the party already."); cap_msg(); return 1; }
      if (team[0] === i){ team[0] = team[1]; team[1] = i; say(OFFICER[i].name + " stays in the party."); cap_msg(); return 1; }
      team[0] = team[1]; team[1] = i;
      say(OFFICER[team[0]].name + " and " + OFFICER[team[1]].name + "."); cap_msg(); return 1;
    }
    if (c === 'd' || c === '\n' || c === '\r' || c === ' '){ show_team = 0; beam_down(); return 1; }
    if (c === 'q') return 0;
    show_team = 0; return 1;
  }
  if (show_items){
    const it = c.charCodeAt(0) - 97;
    if (ask_item === 0 && it >= 0 && it < I_N && have[it]){ ask_item = it + 1; show_items = 0; ask_dir = 'u'; return 1; }
    if (c === 'q') return 0;
    show_items = 0; ask_item = -1; return 1;
  }
  if (ask_dir){
    const d = dir_of_key(c);
    const what = ask_dir;
    ask_dir = 0;
    if (d < 0){ say("Never mind."); ask_item = -1; return 1; }
    if (what === 'f'){ if (room === DR(R_SPACE)) battle_fire(d, 0); else fire(d); }
    else if (what === 'p') battle_fire(d, 1);
    else { const it = ask_item - 1; ask_item = -1; if (it >= 0 && have[it]) use_item(it, d); }
    return 1;
  }
  if (show_look){
    if (c === 'c'){ show_look = show_look >= 3 ? 0 : show_look + 1; return 1; }
    if (c === 'q') return 0;
    show_look = 0;
    return 1;
  }
  if (aboard){
    switch (c){
    case 'b': show_team = 1; break;
    case 'm': show_map = 1; sound_scene(); break;
    case 'h': hail(); break;
    case '1': case '2': case '3': case '4': case '5': case '6': report(c.charCodeAt(0) - 48); break;
    case 'S': say(save_game() ? "Saved." : "It would not save."); break;
    case 'L': say(load_game() ? "Loaded." : "There is no saved game."); break;
    case 'T': tile_shape = (tile_shape + 1) % SHAPE_N; say(SHAPE_NAME[tile_shape] + " tiles."); break;
    case '?': show_keys = 1; break;
    case 't': show_look = 4; break;
    case 'q': case '\x1b': case '\x03': case '\x04': return 0;
    default: break;
    }
    return 1;
  }
  if (room === DR(R_SPACE)){
    switch (c){
    case 'f': ask_dir = 'f'; break;
    case 't': ask_dir = 'p'; break;
    case '.': case 's': turn++; end_turn(); break;
    case '?': show_keys = 1; break;
    case 'S': say(save_game() ? "Saved." : "It would not save."); break;
    case 'L': say(load_game() ? "Loaded." : "There is no saved game."); break;
    case 'q': case '\x1b': case '\x03': case '\x04': return 0;
    default: break;
    }
    return 1;
  }
  const d = dir_of_key(c);
  if (d >= 0){ move_dir(d); return 1; }
  switch (c){
  case '.': case 's': turn++; end_turn(); break;
  case 'f': ask_dir = 'f'; break;
  case 'k': full_power = full_power ? 0 : 1; say("Phaser on " + (full_power ? "full" : "stun") + "."); break;
  case 'u': show_items = 1; ask_item = 0; break;
  case 'i': show_items = 1; ask_item = -1; break;
  case 't': show_look = 4; break;
  case 'B': beam_up("Kirk to Enterprise.  Three to beam up."); turn++; break;
  case 'c': show_look = 1; break;
  case 'S': say(save_game() ? "Saved." : "It would not save."); break;
  case 'L': say(load_game() ? "Loaded." : "There is no saved game."); break;
  case 'T': tile_shape = (tile_shape + 1) % SHAPE_N; say(SHAPE_NAME[tile_shape] + " tiles."); break;
  case '?': show_keys = 1; break;
  case 'q': case '\x1b': case '\x03': case '\x04': return 0;
  default: break;
  }
  return 1;
}

function start_game(seedText, dice){
  setSeed(seedText);
  dice_state = 0x243F6A8885A308D3n;
  if (dice) dice_state ^= SEED;
  else dice_state ^= (BigInt(Date.now()) * 0x9E3779B97F4A7C15n) & M64;
  init_world();
  show_intro = 1; show_items = 0; show_look = 0; show_keys = 0; ask_dir = 0; ask_item = -1; show_story = 0;
  tile_shape = SHAPE_FINE;
  sound_bed = "";
  sound_scene();
}

/* ── checks ─────────────────────────────────────────────────
 * --rooms prints every board as its legend; --keys plays a string of
 * keys with no screen and prints where they left you; --walk, below,
 * plays the whole game the same way. */
function legend_char(r, c){
  const k = RS[r].c[c];
  const b = being_at(r, c);
  if (b && (BEAST[b.kind].flags & BF_CREW)) return 'K';
  if (b) return String.fromCharCode(65 + b.kind);
  if (k.thing === T_ITEM || k.thing === T_YOUNG) return '*';

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same 2A03 and played
 * as a buffer; the tune loops until the next one. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the tune's intro once, then its loop */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */

{

}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left the Enterprise.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: arrows are w x d a as in sigmaiotia.c, Escape
 * is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return 'w';
  if (e.key === "ArrowDown") return 'x';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
