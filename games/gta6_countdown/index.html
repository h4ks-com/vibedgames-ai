<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA 6 Countdown</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.5rem;
    background: radial-gradient(circle at top, #3a0a4a 0%, #120818 60%, #050208 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; text-align: center; padding: 1rem;
  }
  h1 { font-size: clamp(1.6rem, 5vw, 3rem); margin: 0; letter-spacing: 0.05em; text-transform: uppercase; color: #ff5ec8; text-shadow: 0 0 18px #ff2f9a; }
  .sub { opacity: 0.75; margin: 0; font-size: 1rem; }
  .grid { display: flex; gap: clamp(0.6rem, 2vw, 1.5rem); flex-wrap: wrap; justify-content: center; }
  .box {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,94,200,0.35); border-radius: 14px;
    padding: 1rem 1.2rem; min-width: 110px; box-shadow: 0 0 20px rgba(255,47,154,0.15);
  }
  .num { font-size: clamp(2.2rem, 8vw, 4.5rem); font-weight: 800; font-variant-numeric: tabular-nums; }
  .label { text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.15em; opacity: 0.7; }
  #done { display: none; font-size: clamp(1.8rem, 6vw, 3.5rem); color: #7dffb2; text-shadow: 0 0 20px #3aff8a; }
</style>
</head>
<body>
  <h1>GTA VI</h1>
  <p class="sub">Release date: 19 November 2026</p>
  <div class="grid" id="counter">
    <div class="box"><div class="num" id="d">--</div><div class="label">Days</div></div>
    <div class="box"><div class="num" id="h">--</div><div class="label">Hours</div></div>
    <div class="box"><div class="num" id="m">--</div><div class="label">Minutes</div></div>
    <div class="box"><div class="num" id="s">--</div><div class="label">Seconds</div></div>
  </div>
  <div id="done">IT'S OUT NOW!</div>
<script>
  // 19 November 2026, 00:00 local time
  const target = new Date(2026, 10, 19, 0, 0, 0).getTime();
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      document.getElementById('counter').style.display = 'none';
      document.getElementById('done').style.display = 'block';
      clearInterval(timer);
      return;
    }
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);
    document.getElementById('d').textContent = days;
    document.getElementById('h').textContent = pad(hours);
    document.getElementById('m').textContent = pad(mins);
    document.getElementById('s').textContent = pad(secs);
  }
  tick();
  const timer = setInterval(tick, 1000);
</script>
</body>
</html>
