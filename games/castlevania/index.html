const STORY = ["Transylvania, 1691.  Every hundred years the power of Count Dracula wakes, and the Belmonts have taken it on every time.  This time it is Simon Belmont, with the whip his family calls Vampire Killer, and the castle on the hill has its lights on again.\n\nEighteen stages in six blocks, a boss at the end of each block, and the Count at the top of the tower.  You begin in the courtyard, with the leather whip, five hearts and three lives, and the candles on the fence have what you need.","The Count's demon falls, and the sun comes up over the castle, and the castle comes down: stone by stone, tower by tower, into the lake.\n\nSimon Belmont stands on the hill and watches it go.\n\nTHE END\n\nCastlevania II: Simon's Quest is the next game in the chronology.","Simon is down.\n\nThe stage begins again, with the leather whip, five hearts and no sub-weapon, and one life fewer.","GAME OVER\n\nYou may continue, from the start of the stage you died in, with three lives."];

/* ── the 2A03 ──
 * The tunes are Yamashita's and Terashima's, from the transcriptions in castle-work/midi,
 * in twelfths of a beat; a bed loops from its loop beat. */
const TPB = 12;
/* the sample a bed loops back to: its loop beat */
function tune_loop_from(name){
  for (let i = 0; i < TUNE_N; i++) if (TUNES[i].name === name) return Math.trunc(TUNES[i].loop * TUNES[i].beat * FS);
  return 0;
}
function note_hz(n){
  let f = 440.0;
  while (n >= 12){ f *= 2.0; n -= 12; }
  while (n < 0){ f *= 0.5; n += 12; }
  return f * SEMI[n];
}
function tune_render(name, loop){
  let s = null;
  for (let i = 0; i < TUNE_N; i++) if (TUNES[i].name === name) s = TUNES[i];
  if (!s) return null;
  nz_state = (bst_fnv(name, 0x2a03) | 1) >>> 0;
  const tick = s.beat / TPB;
  let n = Math.trunc(s.beats * s.beat * FS);
  if (n > RENDER_MAX) n = RENDER_MAX;
  for (let i = 0; i < n; i++) render_buf[i] = 0.0;
  const kick = {}, snare = {};
  svf_set(kick, 90.0, 0.9);
  svf_set(snare, 1800.0, 0.5);
  const F200 = Math.trunc(FS / 200);
  for (let t = 0; t < 4; t++){
    const tr = s.tr[t];
    if (!tr.ev || tr.vol <= 0.0) continue;
    const ph = [0.0];
    let at = 0, k = 0;
    const total = s.beats * TPB;
    let pos = 0;
    while (pos < total){
      const note = tr.ev[k], len = tr.ev[k + 1];
      if (note === END || len <= 0){ if (k === 0) break; k = 0; continue; }
      k += 2;
      const len_s = Math.trunc(len * tick * FS);
      let end = at + len_s;
      if (end > n) end = n;
      if (note !== REST){
        const f = t < 3 ? note_hz(note) : 0.0;
        ph[0] = 0.0;
        kick.low = 0.0; kick.band = 0.0; snare.low = 0.0; snare.band = 0.0;
        for (let i = at; i < end; i++){
          const tt = (i - at) / FS;
          let x;
          const gate = (end - i) < F200 ? (end - i) / F200 : 1.0;
          if (t < 2){
            const e = tt < 0.012 ? tt / 0.012 : (tt < 0.15 ? 1.0 - 0.45 * (tt - 0.012) / 0.138 : 0.55);
            x = pulse(osc(ph, f), tr.duty) * e;
          } else if (t === 2) x = tri(osc(ph, f));
          else {
            const w = noise();
            if (note === 0) x = 4.0 * svf_run(kick, w, 1) * env(tt, 0.12, 0.01) + 0.3 * w * env(tt, 0.02, 0.01);
            else if (note === 1) x = 1.4 * svf_run(snare, w, 0) * env(tt, 0.14, 0.01) + 0.5 * w * env(tt, 0.06, 0.01);

    /* the seams faded, at the start, at the end, and where the loop comes back to */

    for (let i = 0; i < edge && from + i < n && from > 0; i++) render_buf[from + i] *= i / edge;
  }
  return emit(n, 0.32);
}
function bed_render(name){ return tune_render(name, 1); }
function jingle_render(name){ return tune_render(name, 0); }

/* ── the beasts ───────────────────────────────────────────── */
function new_being(){ return {kind: 0, room: 0, cell: 0, alive: 0, state: 0, home: 0, hp: 0, timer: 0, cool: 0, dir: 0}; }
const BEING_MAX = 900;
const beings = [];
let being_n = 0;

/* ── the castle, built ──────────────────────────────────────
 * The boards are read once into a state that can change: a candle is
 * put out, a block is broken, a drop is taken, a boss dies.  This is
 * the only state in the game that is not a function of the seed, and
 * it is what a save holds. */
function new_cell(){ return {ground: 0, thing: 0, inside: 0, ch: '\0'}; }
function new_room(){
  const R = {c: [], stage: 0, seen: 0, cleared: 0, locked: 0};
  for (let i = 0; i < BOARD_SIZE; i++) R.c.push(new_cell());
  return R;
}
const RS = [];
for (let r = 0; r < R_N; r++) RS.push(new_room());
let room_n = 0;
function way_of(r, ch){
  for (let i = 0; i < 5 && ROOM[r].ways[i] && ROOM[r].ways[i].ch; i++) if (ROOM[r].ways[i].ch === ch) return ROOM[r].ways[i];
  return null;
}
function way_cell(r, ch){
  for (let c = 0; c < BOARD_SIZE; c++) if (RS[r].c[c].ch === ch) return c;
  return -1;
}
/* what an unmarked candle holds: mostly a small heart, sometimes money, now and then more */
function candle_draw(r, c){
  const d = draw("candle" + r, c);
  return d < 0.55 ? T_HEART : d < 0.70 ? T_BIGHEART : d < 0.80 ? T_BAGRED : d < 0.86 ? T_BAGPURPLE : d < 0.90 ? T_BAGWHITE : d < 0.94 ? T_DAGGER : d < 0.98 ? T_AXE : T_ROSARY;
}
function build_room(r){
  const D = ROOM[r];
  const R = RS[r];
  for (let i = 0; i < BOARD_SIZE; i++){ const k = R.c[i]; k.ground = 0; k.thing = 0; k.inside = 0; k.ch = '\0'; }
  R.stage = D.stage; R.seen = 0; R.cleared = 0; R.locked = 0;
  let i = 0;
  for (let row = 0; row < 9; row++)
    for (const ch of D.rows[row]){
      if (ch === ' ') continue;
      if (i >= BOARD_SIZE) break;
      const k = R.c[i];
      k.ch = ch; k.ground = D.floor; k.thing = -1; k.inside = -1;
      switch (ch){
      case '.': break;
      case '_': k.ground = G_VOID; break;
      case ':': k.ground = G_PIT; break;
      case '~': k.ground = G_WATER; break;
      case '=': k.ground = G_PLATFORM; break;
      case '^': k.ground = G_SPIKES; break;
      case '@': k.ground = G_GEAR; k.thing = T_MACHINE; break;
      default: {
        let found = 0;
        for (let L = 0; L < D.legend.length && D.legend[L].ch; L++)
          if (D.legend[L].ch === ch){ k.thing = D.legend[L].thing; k.inside = D.legend[L].inside; found = 1; }
        for (let L = 0; L < LEGEND.length && !found; L++)

function build_world(){
  room_n = R_N;
  for (let r = 0; r < R_N; r++) build_room(r);
}

/* ── Simon ──────────────────────────────────────────────────
 * One man.  Sixteen bars; the whip in three states; the sub-weapon,
 * one at a time; hearts to feed it; the shot multiplier; three lives;
 * the score, and the stage's clock. */
const HP_MAX = 16, START_HEARTS = 5, START_LIVES = 3, STAGE_TIME = 300;
let hp = HP_MAX, hearts = START_HEARTS, lives = START_LIVES, score = 0, whip = 0, weapon = -1, shots = 1, weapon_hits = 0;
let room = 0, cell = 0;                /* where you are */
let stage = 1;                         /* the stage you are in, 1..18 */
let clock_left = STAGE_TIME;           /* the stage's timer */
let turn = 0;
let dead = 0, won = 0, gameover = 0;
let dead_how = "";
let frozen = 0, invisible = 0, mercy = 0, crystals = 0;
let last_cell = -1;
let fire_cell = -1, fire_room = -1, fire_t = 0;   /* the holy water burning, and for how long */
let spike_clock = 0;                   /* the spike traps' own clock: the stopwatch stops it */
let next_life = 30000;                 /* the score the next extra life comes at */
let deaths = 0;

const message = ["", ""];
function say(s){ message[1] = message[0]; message[0] = s.slice(0, 159); }
function cap_msg(){ if (message[0].length && message[0][0] >= 'a' && message[0][0] <= 'z') message[0] = message[0][0].toUpperCase() + message[0].slice(1); }
function cap(s){ return s.length && s[0] >= 'a' && s[0] <= 'z' ? s[0].toUpperCase() + s.slice(1) : s; }
function whip_dmg(){ return whip === 0 ? 2 : 3; }
function whip_reach(){ return whip === 2 ? 2 : 1; }
function whip_name(){ return whip === 2 ? "the long chain whip" : whip === 1 ? "the chain whip" : "the leather whip"; }
function weapon_dmg(t){ return t === T_DAGGER ? 2 : t === T_WATER ? 2 : 3; }

/* ── the ground under you, and what may stand where ─────── */
function being_at(r, c){
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (b.alive && b.room === r && b.cell === c) return b;
  }
  return null;
}
function deadly(g){ return g === G_PIT || g === G_WATER; }
function passable(r, c, for_beast, kind){
  if (c < 0) return 0;
  const k = RS[r].c[c];
  if (k.ground === G_VOID) return 0;
  if (k.thing >= 0 && !(THING[k.thing].flags & TF_PASS)){ if (for_beast && (BEAST[kind].flags & BF_PHASE) && k.thing !== T_WALL) return 1; return 0; }
  if (for_beast){
    const f = BEAST[kind].flags;
    if (k.ground === G_WATER){ if (!(f & (BF_FLIES | BF_SWIMS))) return 0; }
    else if (f & BF_SWIMS) return 0;
    if (k.ground === G_PIT && !(f & BF_FLIES)) return 0;
    if (k.ground === G_STAIR || k.ground === G_DOOR) return 0;   /* beasts keep to their boards */
    if (k.thing === T_FIRE && (f & BF_BOSS) === 0 && (f & BF_FLIES)) return 1;
  } else {
    if (deadly(k.ground)) return 0;
  }
  return 1;
}
function visible(c){ return 1; }
function spikes_down(){ return (spike_clock % 6) < 2; }

/* ── sound: the game side ───────────────────────────────────
 * One line at a time to whatever the page wired in; a check leaves it
 * unwired.  The bed is the block's tune, the boss's in a boss room,
 * the Count's in his chamber and Black Night when his head is off,
 * the prologue over the story; a step is the ground stepped on; when
 * a board is entered, the worst thing on it calls; a beast that lands
 * a blow calls; a blow, a shot, a throw say so. */
let sound_sink = null;                 /* function(line) or null */
function sound_say(line){ if (sound_sink) sound_sink(line); }
let sound_bed = "";
let show_story = 0;                    /* a page of story, or 0: STORY[show_story - 1] */
function demon_form(){ for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].room === room && beings[i].kind === BK_DEMON) return 1; return 0; }
function sound_scene(){
  if (!sound_sink) return;
  let key;
  if (show_story) key = "title";
  else if (demon_form()) key = "night";
  else if (stage === 18 && room === R_18B) key = "nothing";
  else if (ROOM[room].boss >= 0 && room_boss_alive(room)) key = "boss";
  else key = BLOCK_BED[block_of(stage)];
  if (key !== sound_bed){ sound_bed = key; sound_say("bed " + key); }
}
function sound_step(c){ if (sound_sink) sound_say("step " + GROUND[RS[room].c[c].ground].name); }
function sound_beasts(){
  if (!sound_sink) return;
  let worst = null;
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (!b.alive || b.room !== room) continue;
    if (!worst || BEAST[b.kind].points > BEAST[worst.kind].points) worst = b;
  }
  if (worst) sound_say("call " + BEAST[worst.kind].name);
}

/* ── the game ───────────────────────────────────────────────
 * Everything below is what happens when a key is pressed: a step, a
 * blow, a throw, a way taken, and then the beasts' turn and the
 * board's. */
let show_keys = 0, show_look = 0, show_items = 0, ask_dir = 0, show_intro = 0;
let walk_keys = 0;

function spawn(kind, r, c){
  if (being_n >= BEING_MAX) return null;
  if (beings.length <= being_n) beings.push(new_being());
  const b = beings[being_n++];
  b.kind = kind; b.room = r; b.cell = c; b.home = c;
  b.alive = 1; b.state = 0; b.hp = BEAST[kind].hp; b.timer = 0; b.cool = 0;
  b.dir = roll(0, 5);
  if (room === r) sound_say("call " + BEAST[kind].name);      /* it announces itself */
  return b;
}
/* the beasts of a board, from its legend */
function spawn_room(r){
  const D = ROOM[r];
  for (let c = 0; c < BOARD_SIZE; c++){
    const ch = RS[r].c[c].ch;
    if (ch < '0' || ch > '9') continue;
    for (let L = 0; L < D.legend.length && D.legend[L].ch; L++)
      if (D.legend[L].ch === ch && D.legend[L].beast >= 0) spawn(D.legend[L].beast, r, c);
  }
}
/* the beasts of a stage's boards, killed and brought back as they were: a life lost */
function rebuild_stage(st){
  let w = 0;
  for (let i = 0; i < being_n; i++) if (RS[beings[i].room].stage !== st){ if (w !== i) Object.assign(beings[w], beings[i]); w++; }
  being_n = w;
  for (let r = 0; r < R_N; r++) if (ROOM[r].stage === st){ build_room(r); spawn_room(r); }
}
function init_world(){
  being_n = 0;
  build_world();
  hp = HP_MAX; hearts = START_HEARTS; lives = START_LIVES; score = 0; whip = 0; weapon = -1; shots = 1; weapon_hits = 0;
  stage = 1; room = R_1A; cell = 26; clock_left = STAGE_TIME; turn = 0; dead = 0; won = 0; gameover = 0;
  frozen = 0; invisible = 0; mercy = 0; crystals = 0; last_cell = -1; fire_cell = -1; fire_room = -1; fire_t = 0;
  spike_clock = 0; next_life = 30000; deaths = 0;
  message[0] = ""; message[1] = "";
  show_story = 0;
  for (let r = 0; r < R_N; r++) spawn_room(r);
  room_enter(-1);
}

/* ── the bars ─────────────────────────────────────────────── */
function give_score(n){
  score += n;
  while (score >= next_life){ lives++; say("An extra life: " + lives + "."); next_life += next_life === 30000 ? 50000 : 50000; }
}
function life_lost(how){
  if (dead) return;
  dead = 1;
  deaths++;
  dead_how = how.slice(0, 299);
  lives--;
  sound_say("bed off"); sound_bed = "";
  if (lives < 0){ gameover = 1; sound_say("jingle over"); show_story = 4; }
  else { sound_say("jingle miss"); show_story = 3; }
}
/* a blow lands: the stage's bars, and the throw back, which may end in a pit */
function hurt(how, from){
  if (dead) return;
  if (mercy > 0 || invisible > 0) return;
  const dmg = block_damage(stage);
  hp -= dmg;
  mercy = 2;
  if (hp <= 0){ hp = 0; life_lost(how); return; }
  if (from >= 0 && from !== cell){
    const d = dir_toward(from, cell);
    const back = step_cell(cell, d);
    if (back >= 0){

function beasts_turn(){

/* ── the boards' own doings ─────────────────────────────── */
function room_tick(){
  if (dead || won) return;
  const D = ROOM[room];
  /* the holy fire burns down */
  if (fire_t > 0 && --fire_t === 0 && fire_room >= 0 && fire_cell >= 0){ if (RS[fire_room].c[fire_cell].thing === T_FIRE) RS[fire_room].c[fire_cell].thing = -1; fire_cell = -1; fire_room = -1; }
  /* the spikes */
  if (frozen <= 0) spike_clock++;
  if (RS[room].c[cell].ground === G_SPIKES && spikes_down()){ say("The spikes come down on you."); life_lost("The spikes."); return; }
  for (let i = 0; i < being_n; i++){ const b = beings[i]; if (b.alive && b.room === room && RS[room].c[b.cell].ground === G_SPIKES && spikes_down() && !(BEAST[b.kind].flags & (BF_FLIES | BF_IMMUNE))){ say("The spikes come down on " + BEAST[b.kind].name + "."); kill_being(b); } }
  /* what keeps coming in from the edge */
  if (D.spawn_kind >= 0 && frozen <= 0 && (turn % D.spawn_every) === 0){
    let n = 0;
    for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].room === room && beings[i].kind === D.spawn_kind) n++;
    if (n < D.spawn_max){
      const kind = D.spawn_kind;
      let at = -1, dirn = 0;
      for (let tries = 0; tries < 20 && at < 0; tries++){
        const c = roll(0, BOARD_SIZE - 1);
        const r = COORD_R[c];
        const west = c === row_first(r), east = c === row_last(r);
        if (!west && !east) continue;
        if (hex_dist(c, cell) < 3 || being_at(room, c) || !passable(room, c, 1, kind)) continue;
        at = c; dirn = west ? 0 : 3;

      if (at >= 0){ const b = spawn(kind, room, at); if (b){ b.home = -1; b.dir = dirn; } }
    }
  }
  /* the clock */
  if (--clock_left <= 0){ clock_left = 0; say("The clock runs out."); life_lost("Out of time."); return; }
  /* a drop fades if it is not taken */
  if ((turn % 20) === 0) for (let c = 0; c < BOARD_SIZE; c++){ const t = RS[room].c[c].thing; if (t >= 0 && (THING[t].flags & TF_DROP) && c !== cell && roll(1, 3) === 1) RS[room].c[c].thing = -1; }
}

/* ── the turn's end ─────────────────────────────────────── */
function end_turn(){
  if (dead || won) return;
  if (mercy > 0) mercy--;

  if (frozen > 0) frozen--;

}

/* ── the screen ─────────────────────────────────────────────
 * hanb.c's board, cut to the fine hexagon: a cell is four characters by

const WALL_CAPS = [245,247,167,146,109,247,178], WALL_BODY = [238,240,88,61,66,240,94];

/* ── the right-hand column ───────────────────────────────── */

function draw_panel(){

/* ── a page of text over everything ───────────────────────── */
function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){
      if (s[p + len] === ' ') last_space = len;
      len++;
    }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}

  for (let r = y; r < y + h; r++){ text(x, r, " ", 250, 240); text(x + w - 1, r, " ", 250, 240); }
  const lines = wrap_lines(body, w - 6, 64);
  let row = y + 1;
  for (let i = 0; i < lines.length && row < y + h - 2; i++, row++)
    text(x + 3, row, lines[i], i === 0 ? 223 : fg, 235);
  text(x + 3, y + h - 2, foot, 245, 235);
}

function fb_hash(){
  let h = 2166136261 >>> 0;
  for (let row = 0; row < screen_h; row++)
    for (let col = 0; col < screen_w; col++){
      const at = FB(row, col);
      const ch = fb_ch[at] === FB_QUAD ? 1 : fb_ch[at];
      const q = fb_ch[at] === FB_QUAD ? (fb_q[at] & 15) : 0;
      const v = (fb_fg[at] | (fb_bg[at] << 8) | (q << 16) | (ch << 20)) >>> 0;
      h = Math.imul(h ^ v, 16777619) >>> 0;
      h = Math.imul(h ^ (v >>> 24), 16777619) >>> 0;
    }
  return h;
}

    fire_cell: fire_cell, fire_room: fire_room, fire_t: fire_t, spike_clock: spike_clock,

function load_game(){
  let s;

  if (!s || s.magic !== "castle") return 0;
  SEED = BigInt(s.seed); SEEDTEXT = s.seedtext;
  for (let r = 0; r < R_N; r++){
    const R = RS[r], q = s.rs[r];
    for (let i = 0; i < BOARD_SIZE; i++){ const k = q.c[i]; R.c[i].ground = k[0]; R.c[i].thing = k[1]; R.c[i].inside = k[2]; R.c[i].ch = k[3]; }

  }

  beings.length = 0; for (const b of s.beings) beings.push(Object.assign({}, b)); being_n = beings.length;
  hp = s.hp; hearts = s.hearts; lives = s.lives; score = s.score; whip = s.whip; weapon = s.weapon; shots = s.shots; weapon_hits = s.weapon_hits;
  stage = s.stage; clock_left = s.clock_left; crystals = s.crystals; next_life = s.next_life; deaths = s.deaths;
  room = s.room; cell = s.cell; frozen = s.frozen; invisible = s.invisible; mercy = s.mercy; last_cell = s.last_cell;
  fire_cell = s.fire_cell; fire_room = s.fire_room; fire_t = s.fire_t; spike_clock = s.spike_clock;
  turn = s.turn;

  dead = 0; won = 0; gameover = 0; show_story = 0; show_items = 0; show_look = 0; ask_dir = 0; show_keys = 0;

/* ── input ──────────────────────────────────────────────── */
function dir_of_key(c){
  switch (c){
  case 'd': return 0; case 'x': return 1; case 'z': return 2;
  case 'a': return 3; case 'w': return 4; case 'e': return 5;
  default: return -1;
  }
}
function new_game(){
  init_world();
  show_intro = 1; show_items = 0; show_look = 0; show_keys = 0; ask_dir = 0; show_story = 0;
}
/* One key.  Returns 0 to quit. */
function handle_key(c){
  if (show_intro){
    if (c === 'q' || c === '\x1b' || c === '\x03') return 0;
    show_intro = 0;
    say("The courtyard.  The candles on the fence have hearts and morning stars in them; the gate is east.");
    sound_bed = ""; sound_scene();
    return 1;
  }
  if (dead || won){
    if (c === 'n'){ new_game(); show_intro = 0; sound_bed = ""; sound_scene(); return 1; }
    if (c === 'L' && dead){ if (!load_game()) say("There is no saved game."); return 1; }
    if (c === 'c' && dead){ continue_game(); return 1; }
    if (c === 'q' || c === '\x1b' || c === '\x03') return 0;
    return 1;
  }
  if (show_story){ show_story = 0; sound_scene(); return 1; }
  if (show_keys){ show_keys = 0; return 1; }
  if (show_items){ if (c === 'q') return 0; show_items = 0; return 1; }
  if (ask_dir){
    const d = dir_of_key(c);
    const what = ask_dir;
    ask_dir = 0;
    if (d < 0){ say("Never mind."); return 1; }
    if (what === 'f') whip_line(d);
    else use_weapon(d);
    return 1;
  }
  if (show_look){
    if (c === 'c'){ show_look = (show_look + 1) % 4; return 1; }
    if (c === 'q') return 0;
    show_look = 0;
    return 1;
  }
  const d = dir_of_key(c);
  if (d >= 0){ move_dir(d); return 1; }
  switch (c){
  case '.': case 's': wait_turn(); break;
  case 'f': ask_dir = 'f'; break;
  case 't': if (weapon < 0) say("You have no sub-weapon.  The candles have them."); else if (weapon_needs_dir(weapon)) ask_dir = 't'; else use_weapon(-1); break;
  case 'i': show_items = 1; break;
  case 'c': show_look = 1; break;
  case 'S': say(save_game() ? "Saved." : "It would not save."); break;
  case 'L': say(load_game() ? "Loaded." : "There is no saved game."); break;
  case 'T': tile_shape = (tile_shape + 1) % SHAPE_N; say(SHAPE_NAME[tile_shape] + " tiles."); break;
  case '?': show_keys = 1; break;
  case 'q': case '\x1b': case '\x03': case '\x04': return 0;
  default: break;
  }
  return 1;
}
function start_game(seedText, dice){
  setSeed(seedText);
  dice_state = 0x243F6A8885A308D3n;
  if (dice) dice_state ^= SEED;
  else dice_state ^= (BigInt(Date.now()) * 0x9E3779B97F4A7C15n) & M64;
  init_world();
  show_intro = 1; show_items = 0; show_look = 0; show_keys = 0; ask_dir = 0; show_story = 0;
  tile_shape = SHAPE_FINE;
  sound_bed = "";

/* ── checks ─────────────────────────────────────────────────
 * --keys plays a string of keys with no screen and prints where they
 * left you; --walk, below, plays the whole castle the same way. */
function check_keys(seedText, keys_in){
  const out = [];
  start_game(seedText, 1);

    let c = keys_in[i];
    if (c === '\\' && i + 1 < keys_in.length){ i++; if (keys_in[i] === 'n'){ handle_key('\n'); continue; } c = keys_in[i]; }
    if (!handle_key(c)) break;

  }

  return out;
}
/* what --keys prints about where the keys left you */
function keys_report(out){

  out.push("last: " + message[0]);
  out.push("      " + message[1]);
  for (let i = 0; i < being_n; i++){ const b = beings[i]; if (b.alive && b.room === room) out.push("here: " + BEAST[b.kind].name + " at " + b.cell + " hp " + b.hp); }

/* the same, along one long string of keys: the report at each of the

  if (k.thing >= 0 && !(THING[k.thing].flags & TF_PASS)) return 0;
  if (k.ground === G_SPIKES && frozen <= 0 && spikes_bad_next() && !walk_hurt) return 0;

/* a jump: one cell of pit or water, with floor beyond */

let goto_until = null;

    const f = adjacent_foe();
    if (f){ fight(f); continue; }
    bfs(target);

  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the overworld's intro once, then the theme */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("castle.sav"),
  set: (s) => localStorage.setItem("castle.sav", s),
};
start_game(params.get("seed"), 0);
if (SOUND.on) SOUND.command("bed title");
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left the castle.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: arrows are w x d a as in draculacastle.c, Escape
 * is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return 'w';
  if (e.key === "ArrowDown") return 'x';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
