<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MetaTyper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
--bg:#1a1b26;--panel:#16171e;--panel2:#1e2030;--fg:#c0caf5;--fg-dim:#565f89;
--accent:#7aa2f7;--accent2:#bb9af7;--green:#9ece6a;--red:#f7768e;--yellow:#e0af68;
--orange:#ff9e64;--cyan:#7dcfff;--pink:#f7768e;
--page:#ffffff;--page-fg:#1a1a1a;--font:'Segoe UI',system-ui,sans-serif;
--currency:'¢';--currency-name:'Credits';
--radius:6px;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;height:100vh;display:flex;user-select:none;}

/* ═══ SIDEBAR ═══ */
#sidebar{width:300px;min-width:300px;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06);overflow-y:auto;overflow-x:hidden;}
#sidebar::-webkit-scrollbar{width:4px;}#sidebar::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}

#sb-header{padding:12px 14px 8px;display:flex;align-items:center;gap:8px;}
#sb-logo{font-size:18px;font-weight:800;letter-spacing:-.5px;flex:1;}
#sb-logo span{color:var(--accent);}
#theme-select{background:var(--panel2);color:var(--fg);border:1px solid rgba(255,255,255,.1);border-radius:4px;padding:4px 6px;font-size:10px;cursor:pointer;max-width:90px;}

#stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 14px 8px;}
.stat-card{background:var(--panel2);border-radius:var(--radius);padding:8px 10px;position:relative;overflow:hidden;}
.stat-card .lbl{font-size:8px;text-transform:uppercase;color:var(--fg-dim);letter-spacing:1px;}
.stat-card .val{font-size:18px;font-weight:700;color:var(--accent);}
.stat-card.full{grid-column:span 2;}
.stat-card.full .val{font-size:22px;}

#combo-bar-wrap{padding:0 14px 8px;}
#combo-bar-bg{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
#combo-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;width:0%;transition:width .3s;}
#combo-display{display:flex;justify-content:space-between;font-size:10px;color:var(--fg-dim);margin-top:4px;}
#combo-mult{font-weight:700;color:var(--yellow);font-size:14px;}
#wpm-display{font-weight:700;color:var(--green);font-size:14px;}

#tabs{display:flex;padding:0 14px 6px;gap:4px;}
.tab-btn{flex:1;padding:6px;text-align:center;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;background:var(--panel2);border:none;color:var(--fg-dim);border-radius:4px;cursor:pointer;transition:.2s;}
.tab-btn.active{background:var(--accent);color:#fff;}

#tab-content{flex:1;overflow-y:auto;padding:0 14px 8px;}
#tab-content::-webkit-scrollbar{width:4px;}#tab-content::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}

.shop-item{background:var(--panel2);border-radius:var(--radius);padding:10px;margin-bottom:6px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:.15s;border:1px solid transparent;}
.shop-item:hover{border-color:rgba(255,255,255,.08);}
.shop-item.affordable{border-color:var(--green);}
.shop-item.disabled{opacity:.4;cursor:not-allowed;}
.shop-item .icon{font-size:20px;width:28px;text-align:center;}
.shop-item .info{flex:1;min-width:0;}
.shop-item .name{font-size:11px;font-weight:700;}
.shop-item .desc{font-size:9px;color:var(--fg-dim);}
.shop-item .cost{font-size:11px;font-weight:700;color:var(--yellow);white-space:nowrap;}
.shop-item .owned{font-size:9px;color:var(--fg-dim);text-align:right;}

#ach-container{padding:0 14px 8px;display:none;}
.ach-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:10px;border-bottom:1px solid rgba(255,255,255,.04);}
.ach-item.locked{opacity:.3;}
.ach-item .a-icon{font-size:16px;}
.ach-item .a-name{font-weight:700;}
.ach-item .a-desc{color:var(--fg-dim);font-size:9px;}

#toasts{position:fixed;bottom:16px;left:320px;z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{background:var(--panel2);border:1px solid var(--accent);border-radius:var(--radius);padding:8px 14px;font-size:11px;display:flex;align-items:center;gap:8px;animation:toastIn .4s,toastOut .4s 2.5s forwards;}
@keyframes toastIn{from{opacity:0;transform:translateX(-20px);}to{opacity:1;transform:none;}}
@keyframes toastOut{to{opacity:0;transform:translateX(-20px);}}

/* ═══ MAIN ═══ */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}

/* ── Mode switch ── */
#mode-switch{display:flex;align-items:center;padding:4px 10px;background:var(--panel);gap:2px;border-bottom:1px solid rgba(255,255,255,.06);}
.ms-btn{padding:5px 16px;font-size:11px;font-weight:600;background:transparent;border:none;color:var(--fg-dim);cursor:pointer;border-radius:4px;transition:.15s;}
.ms-btn:hover{color:var(--fg);}
.ms-btn.active{background:var(--accent);color:#fff;}
#doc-title{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--fg-dim);background:transparent;border:none;outline:none;text-overflow:ellipsis;}
#doc-title:focus{color:var(--fg);}

/* ── Word processor ── */
#wp-view{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#wp-toolbar{background:var(--panel);border-bottom:1px solid rgba(255,255,255,.06);padding:4px 8px;display:flex;flex-wrap:wrap;gap:3px;align-items:center;overflow-x:auto;}
#wp-toolbar::-webkit-scrollbar{height:2px;}
.tb-group{display:flex;align-items:center;gap:1px;padding:0 3px;border-right:1px solid rgba(255,255,255,.05);}
.tb-group:last-child{border-right:none;}
.tb-btn{width:26px;height:24px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--fg-dim);cursor:pointer;border-radius:3px;font-size:13px;transition:.1s;}
.tb-btn:hover{background:rgba(255,255,255,.06);color:var(--fg);}
.tb-btn.active{background:var(--accent);color:#fff;}
.tb-btn.sm{font-size:10px;width:auto;padding:0 6px;font-weight:600;}
.tb-select{background:var(--panel2);color:var(--fg);border:1px solid rgba(255,255,255,.08);border-radius:3px;height:24px;font-size:11px;padding:0 4px;cursor:pointer;}
.tb-select option{background:var(--panel2);}
.tb-color{width:24px;height:18px;border:none;border-radius:2px;background:none;cursor:pointer;padding:0;overflow:hidden;}

#wp-scroll{flex:1;overflow-y:auto;padding:20px;display:flex;justify-content:center;background:rgba(0,0,0,.15);}
#wp-scroll::-webkit-scrollbar{width:8px;}#wp-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px;}
#page{background:var(--page);color:var(--page-fg);width:210mm;max-width:100%;min-height:297mm;padding:25mm 25mm 20mm;box-shadow:0 2px 20px rgba(0,0,0,.4);font-family:var(--font);font-size:14px;line-height:1.6;outline:none;white-space:pre-wrap;word-wrap:break-word;border-radius:2px;}
#page:empty:before{content:attr(data-placeholder);color:#aaa;font-style:italic;}
#page:focus{outline:none;}

#wp-status{background:var(--panel);border-top:1px solid rgba(255,255,255,.06);padding:3px 12px;display:flex;gap:16px;font-size:10px;color:var(--fg-dim);}
#wp-status span b{color:var(--fg);}

/* ── Terminal ── */
#term-view{flex:1;display:none;flex-direction:column;background:#0c0c14;overflow:hidden;}
#term-output{flex:1;overflow-y:auto;padding:12px 16px;font-family:'Consolas','Courier New',monospace;font-size:13px;line-height:1.5;color:#a9b1d6;}
#term-output::-webkit-scrollbar{width:6px;}#term-output::-webkit-scrollbar-thumb{background:var(--accent);}
.term-line{white-space:pre-wrap;word-break:break-word;}
.term-prompt{color:var(--green);}
.term-error{color:var(--red);}
.term-info{color:var(--cyan);}
.term-success{color:var(--green);}
.term-warn{color:var(--yellow);}
.term-ascii{color:var(--accent2);white-space:pre;font-size:11px;line-height:1.2;}
#term-input-line{display:flex;align-items:center;padding:4px 16px 12px;font-family:'Consolas','Courier New',monospace;font-size:13px;gap:0;}
#term-prompt-text{color:var(--green);white-space:nowrap;}
#term-input{flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-family:inherit;font-size:inherit;caret-color:var(--accent);}
#term-input::placeholder{color:var(--fg-dim);opacity:.5;}

/* ── Particles & floats ── */
.float-gain{position:fixed;pointer-events:none;font-size:13px;font-weight:700;color:var(--yellow);z-index:300;animation:floatUp 1.2s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);}}
.particle{position:fixed;pointer-events:none;width:4px;height:4px;border-radius:50%;z-index:299;animation:partFly .6s ease-out forwards;}
@keyframes partFly{0%{opacity:1;}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0.3);}}

/* ── Mobile ── */
@media(max-width:840px){
#sidebar{position:fixed;left:0;top:0;bottom:0;z-index:100;transform:translateX(-100%);transition:.3s;width:280px;min-width:280px;}
#sidebar.open{transform:translateX(0);}
#main{width:100%;}
#mobile-toggle{display:flex!important;}
#toasts{left:10px;right:10px;}
#page{padding:16px;min-height:auto;}
}
#mobile-toggle{display:none;position:fixed;top:8px;right:8px;z-index:150;width:36px;height:36px;background:var(--accent);border:none;border-radius:6px;color:#fff;font-size:18px;cursor:pointer;align-items:center;justify-content:center;}
</style>
</head>
<body>
<button id="mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

<!-- ═══ SIDEBAR ═══ -->
<div id="sidebar">
  <div id="sb-header">
    <div id="sb-logo">⌨️ <span>Meta</span>Typer</div>
    <select id="theme-select" onchange="applyTheme(this.value)">
      <option value="tokyo">🌃 Tokyo</option>
      <option value="hacker">💀 Hacker</option>
      <option value="scribe">📜 Scribe</option>
      <option value="scifi">🚀 Sci-Fi</option>
      <option value="candy">🍬 Candy</option>
    </select>
  </div>

  <div id="stats-grid">
    <div class="stat-card full"><div class="lbl">💰 Balance</div><div class="val" id="stat-credits">0</div></div>
    <div class="stat-card"><div class="lbl">Per Key</div><div class="val" id="stat-perkey">1</div></div>
    <div class="stat-card"><div class="lbl">Per Sec</div><div class="val" id="stat-persec">0</div></div>
    <div class="stat-card"><div class="lbl">Total Keys</div><div class="val" id="stat-totalkeys">0</div></div>
    <div class="stat-card"><div class="lbl">Play Time</div><div class="val" id="stat-playtime">0m</div></div>
  </div>

  <div id="combo-bar-wrap">
    <div id="combo-bar-bg"><div id="combo-bar-fill"></div></div>
    <div id="combo-display">
      <span>🔥 Combo <span id="combo-mult">×1</span></span>
      <span>⚡ <span id="wpm-display">0</span> WPM</span>
    </div>
  </div>

  <div id="tabs">
    <button class="tab-btn active" onclick="switchTab('shop')">🛒 Shop</button>
    <button class="tab-btn" onclick="switchTab('ach')">🏆 Awards</button>
  </div>

  <div id="tab-content"></div>
  <div id="ach-container"></div>
</div>

<!-- ═══ MAIN ═══ -->
<div id="main">
  <div id="mode-switch">
    <button class="ms-btn active" data-mode="wp" onclick="switchMode('wp')">📝 Document</button>
    <button class="ms-btn" data-mode="term" onclick="switchMode('term')">🐧 Terminal</button>
    <input type="text" id="doc-title" value="Untitled Document" spellcheck="false">
  </div>

  <!-- Word Processor -->
  <div id="wp-view">
    <div id="wp-toolbar">
      <div class="tb-group">
        <select class="tb-select" id="font-family" onchange="execFmt('fontName',this.value);this.selectedIndex=0">
          <option value="">Font…</option>
          <option value="Segoe UI">Segoe UI</option><option value="Arial">Arial</option><option value="Calibri">Calibri</option>
          <option value="Times New Roman">Times</option><option value="Georgia">Georgia</option><option value="Courier New">Courier</option>
          <option value="Verdana">Verdana</option><option value="Comic Sans MS">Comic Sans</option>
        </select>
        <select class="tb-select" id="font-size" onchange="execFmt('fontSize',this.value);this.selectedIndex=0">
          <option value="">Size…</option><option value="1">8</option><option value="2">10</option><option value="3">12</option>
          <option value="4">14</option><option value="5">18</option><option value="6">24</option><option value="7">36</option>
        </select>
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="btn-bold" onclick="execFmt('bold');toggleBtn(this)" title="Bold"><b>B</b></button>
        <button class="tb-btn" id="btn-italic" onclick="execFmt('italic');toggleBtn(this)" title="Italic"><i>I</i></button>
        <button class="tb-btn" id="btn-under" onclick="execFmt('underline');toggleBtn(this)" title="Underline"><u>U</u></button>
        <button class="tb-btn" id="btn-strike" onclick="execFmt('strikeThrough');toggleBtn(this)" title="Strike"><s>S</s></button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="btn-sub" onclick="execFmt('subscript');toggleBtn(this)" title="Sub">X₂</button>
        <button class="tb-btn" id="btn-sup" onclick="execFmt('superscript');toggleBtn(this)" title="Super">X²</button>
      </div>
      <div class="tb-group">
        <input type="color" class="tb-color" title="Text color" onchange="execFmt('foreColor',this.value)" value="#1a1a1a">
        <input type="color" class="tb-color" title="Highlight" onchange="execFmt('hiliteColor',this.value)" value="#ffff00">
      </div>
      <div class="tb-group">
        <button class="tb-btn" onclick="execFmt('justifyLeft')" title="Left">≡</button>
        <button class="tb-btn" onclick="execFmt('justifyCenter')" title="Center">≣</button>
        <button class="tb-btn" onclick="execFmt('justifyRight')" title="Right">≡</button>
        <button class="tb-btn" onclick="execFmt('justifyFull')" title="Justify">☰</button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" onclick="execFmt('insertUnorderedList')" title="Bullets">•≡</button>
        <button class="tb-btn" onclick="execFmt('insertOrderedList')" title="Numbered">1≡</button>
      </div>
      <div class="tb-group">
        <button class="tb-btn sm" onclick="execFmt('indent')">→|</button>
        <button class="tb-btn sm" onclick="execFmt('outdent')">|←</button>
      </div>
      <div class="tb-group">
        <select class="tb-select" onchange="applyHeading(this.value);this.selectedIndex=0">
          <option value="">Style…</option>
          <option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option><option value="blockquote">Quote</option><option value="pre">Code</option>
        </select>
      </div>
      <div class="tb-group">
        <button class="tb-btn sm" onclick="execFmt('undo')" title="Undo">↶</button>
        <button class="tb-btn sm" onclick="execFmt('redo')" title="Redo">↷</button>
        <button class="tb-btn sm" onclick="execFmt('removeFormat')" title="Clear">⌫</button>
      </div>
    </div>
    <div id="wp-scroll">
      <div id="page" contenteditable="true" spellcheck="true" data-placeholder="Start typing… every keystroke earns you credits. Switch to Terminal mode for shell action."></div>
    </div>
    <div id="wp-status">
      <span>Words: <b id="word-count">0</b></span>
      <span>Characters: <b id="char-count">0</b></span>
      <span>Lines: <b id="line-count">0</b></span>
      <span style="flex:1"></span>
      <span id="save-status">💾 Auto-saved</span>
    </div>
  </div>

  <!-- Terminal -->
  <div id="term-view">
    <div id="term-output"></div>
    <div id="term-input-line">
      <span id="term-prompt-text"></span>
      <input type="text" id="term-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type a command…">
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>

// KEYSTROKE HANDLING (works on desktop + mobile)
// ═══════════════════════════════════════
let lastPageLen = 0;
const page = document.getElementById('page');
const termInput = document.getElementById('term-input');

function onKeyTyped(charCount){
  if(charCount <= 0) return;
  const earn = state.perKey * state.combo * charCount;
  state.credits += earn;
  state.totalEarned += earn;
  state.totalKeys += charCount;

  // Combo
  state.combo = Math.min(state.combo + 0.2 * charCount, 100);
  state.comboTimer = Date.now();
  if(state.combo > state.maxCombo) state.maxCombo = state.combo;

  // WPM tracking
  const now = Date.now();
  state.recentKeys.push(now);
  state.recentKeys = state.recentKeys.filter(t => now - t < 60000);
  const wpm = Math.round(state.recentKeys.length / 5);
  if(wpm > state.maxWPM) state.maxWPM = wpm;

  // Particles
  if(charCount === 1) spawnFloat(earn);
  updateStats();
  checkAchievements();
  saveDebounced();
}

// Word processor: input event (fires on desktop + mobile)
page.addEventListener('input', function(e){
  const len = page.textContent.length;
  const diff = len - lastPageLen;
  if(diff > 0){
    onKeyTyped(diff);
  }
  lastPageLen = len;
  updateWordCount();
});

// Terminal: track actual characters typed
let lastTermLen = 0;
termInput.addEventListener('input', function(){
  const len = termInput.value.length;
  const diff = len - lastTermLen;
  if(diff > 0){
    onKeyTyped(diff);
  }
  lastTermLen = len;
});

termInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    runCommand(termInput.value);
    termInput.value = '';
    lastTermLen = 0;
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(state.termHistory.length > 0){
      state.termHistIdx = Math.max(0, state.termHistIdx - 1);
      termInput.value = state.termHistory[state.termHistIdx] || '';
      lastTermLen = termInput.value.length;
    }
  } else if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(state.termHistory.length > 0){
      state.termHistIdx = Math.min(state.termHistory.length, state.termHistIdx + 1);
      termInput.value = state.termHistory[state.termHistIdx] || '';
      lastTermLen = termInput.value.length;
    }
  } else if(e.key === 'Tab'){
    e.preventDefault();
    tabComplete();
  }
});

// Tab completion
function tabComplete(){
  const val = termInput.value;
  const parts = val.split(' ');
  const last = parts[parts.length - 1];
  const cmds = ['help','ls','cd','pwd','cat','echo','mkdir','touch','rm','neofetch','whoami','date','uname','clear','history','stats','shop','credits','buy','ascii','fortune','cowsay','sudo','exit','themes','theme'];
  const matches = cmds.filter(c => c.startsWith(last));
  if(matches.length === 1){
    parts[parts.length - 1] = matches[0];
    termInput.value = parts.join(' ') + ' ';
    lastTermLen = termInput.value.length;
  }
}

}

function runCommand(input){
  const cmd = input.trim();
  if(!cmd) { termPrintHTML('<span style="color:var(--fg-dim)">' + termPromptText.textContent + '</span>'); return; }
  state.termHistory.push(cmd);
  state.termHistIdx = state.termHistory.length;

  termPrintHTML('<span style="color:var(--green)">' + termPromptText.textContent + '</span>' + cmd);

  const parts = cmd.split(/\s+/);
  const main = parts[0].toLowerCase();
  const args = parts.slice(1);

  switch(main){
    case 'help':
      termPrint('Available commands:','term-info');
      termPrint('  help          Show this message');
      termPrint('  ls [path]     List files');
      termPrint('  cd <path>     Change directory');
      termPrint('  pwd           Print working directory');
      termPrint('  cat <file>    Show file contents');
      termPrint('  echo <text>   Print text');
      termPrint('  mkdir <name>  Create directory');
      termPrint('  touch <name>  Create file');
      termPrint('  rm <name>     Remove file');
      termPrint('  neofetch      System info + stats');
      termPrint('  whoami        Current user');
      termPrint('  date          Current date/time');
      termPrint('  uname         System info');
      termPrint('  clear         Clear terminal');
      termPrint('  history       Command history');
      termPrint('  stats         Game stats');
      termPrint('  credits       Show balance');
      termPrint('  shop          List upgrades');
      termPrint('  buy <id>      Buy upgrade');
      termPrint('  themes        List themes');
      termPrint('  theme <name>  Switch theme');
      termPrint('  ascii         ASCII art');
      termPrint('  fortune       Random fortune');
      termPrint('  cowsay <msg>  Cow says...');
      termPrint('  sudo <cmd>    Gain root powers');
      break;
    case 'ls': cmdLs(args); break;
    case 'cd': cmdCd(args); break;
    case 'pwd': termPrint('/home/user' + (state.termCwd === '~' ? '' : '/' + state.termCwd.slice(2))); break;
    case 'cat': cmdCat(args); break;
    case 'echo': termPrint(args.join(' ')); break;
    case 'mkdir': cmdMkdir(args); break;
    case 'touch': cmdTouch(args); break;
    case 'rm': cmdRm(args); break;
    case 'neofetch': cmdNeofetch(); break;
    case 'whoami': termPrint('user'); break;
    case 'date': termPrint(new Date().toString()); break;
    case 'uname': termPrint('MetaTyper 2.0-generic #1 SMP typing x86_64 GNU/Meta'); break;
    case 'clear': termOutput.innerHTML = ''; break;
    case 'history': state.termHistory.forEach((h,i) => termPrint(`  ${i+1}  ${h}`)); break;
    case 'stats': cmdStats(); break;
    case 'credits': termPrint(`${formatNum(state.credits)} ${THEMES[state.theme].currency} (${THEMES[state.theme].name})`,'term-success'); break;
    case 'shop': cmdShop(); break;
    case 'buy': cmdBuy(args); break;
    case 'themes': Object.entries(THEMES).forEach(([k,t]) => termPrint(`  ${k.padEnd(10)} ${t.name} (${t.currency})`)); break;
    case 'theme': if(args[0] && THEMES[args[0]]){ applyTheme(args[0]); document.getElementById('theme-select').value = args[0]; termPrint(`Theme switched to ${args[0]}`,'term-success'); } else termPrint('Usage: theme <tokyo|hacker|scribe|scifi|candy>','term-error'); break;
    case 'ascii':
      termPrintPre(`  ╔═╗╔═╗╦╦╔╦╗  ╔╦╗╔═╗╔╦╗╔═╗╦ ╦\n  ╚═╗╠═╝║║ ║   ║║║╣  ║ ╠═╣║ ║\n  ╚═╝╩  ╩╩ ╩   ╩ ╚═╝ ╩ ╩ ╩╚═╝\n  M E T A   T Y P E R   2 . 0`,'term-success');
      break;
    case 'fortune':
      const fortunes = ['The best time to type was yesterday. The second best is now.','A journey of a thousand keystrokes begins with a single key.','He who types fast, earns fast.','The keyboard is mightier than the sword.','Type as if no one is watching. Earn as if everyone is.','Code is poetry. Keystrokes are rhythm.','To type or not to type — that is not a question.'];
      termPrint('🥠 ' + fortunes[Math.floor(Math.random()*fortunes.length)],'term-warn');
      break;
    case 'cowsay':
      const msg = args.join(' ') || 'Moo!';
      const len = msg.length;
      termPrint(' ' + '_'.repeat(len+2));
      termPrint('< ' + msg + ' >');
      termPrint(' ' + '-'.repeat(len+2));
      termPrintPre(`        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w |\n                ||     ||`,'term-info');
      break;
    case 'sudo':
      const bonus = Math.floor(state.perKey * 50 * state.combo);
      state.credits += bonus;
      state.totalEarned += bonus;
      termPrint(`[sudo] password for user: ********`,'term-warn');
      termPrint(`Root access granted! Bonus: ${formatNum(bonus)} ${THEMES[state.theme].currency} 🎉`,'term-success');
      spawnFloat(bonus);
      updateStats();
      break;
    case 'exit':
      termPrint('Nice try. You can never leave MetaTyper.','term-error');
      break;
    default:
      termPrint(`${main}: command not found. Type "help" for available commands.`,'term-error');
  }
  updateTermPrompt();
}

function cmdLs(args){
  const dir = getDir(state.termCwd);
  if(!dir || dir.type !== 'dir'){ termPrint('ls: cannot access directory','term-error'); return; }
  const entries = Object.entries(dir.children);
  if(entries.length === 0){ termPrint(''); return; }
  const names = entries.map(([name,node]) => node.type === 'dir' ? name + '/' : name);
  termPrintHTML(names.map(n => n.endsWith('/') ? `<span style="color:var(--accent)">${n}</span>` : `<span style="color:var(--fg)">${n}</span>`).join('   '));
}

function cmdCd(args){
  if(!args[0] || args[0] === '~' || args[0] === '/home/user'){ state.termCwd = '~'; updateTermPrompt(); return; }
  const dir = getDir(state.termCwd);
  if(!dir || !dir.children[args[0]] || dir.children[args[0]].type !== 'dir'){ termPrint(`cd: ${args[0]}: Not a directory`,'term-error'); return; }
  state.termCwd = state.termCwd === '~' ? '~/'+args[0] : state.termCwd + '/' + args[0];
  updateTermPrompt();
}

function cmdCat(args){
  if(!args[0]){ termPrint('cat: missing file operand','term-error'); return; }
  const dir = getDir(state.termCwd);
  if(!dir || !dir.children[args[0]]){ termPrint(`cat: ${args[0]}: No such file`,'term-error'); return; }
  termPrint(dir.children[args[0]].content || '(empty)');
}

function cmdMkdir(args){
  if(!args[0]){ termPrint('mkdir: missing operand','term-error'); return; }
  const dir = getDir(state.termCwd);
  if(dir && dir.children[args[0]]){ termPrint(`mkdir: cannot create '${args[0]}': File exists`,'term-error'); return; }
  if(dir){ dir.children[args[0]] = { type:'dir', children:{} }; }
}

function cmdTouch(args){
  if(!args[0]){ termPrint('touch: missing operand','term-error'); return; }
  const dir = getDir(state.termCwd);
  if(dir && !dir.children[args[0]]){ dir.children[args[0]] = { type:'file', content:'' }; }
}

function cmdRm(args){
  if(!args[0]){ termPrint('rm: missing operand','term-error'); return; }
  const dir = getDir(state.termCwd);
  if(dir && dir.children[args[0]]){ delete dir.children[args[0]]; }
  else { termPrint(`rm: cannot remove '${args[0]}': No such file`,'term-error'); }
}

function getDir(path){
  if(path === '~') return state.fs['~'];
  const parts = path.replace(/^~\/?/,'').split('/');
  let cur = state.fs['~'];
  for(const p of parts){ if(p && cur && cur.children && cur.children[p]) cur = cur.children[p]; else return null; }
  return cur;
}

}

function cmdStats(){
  termPrint('═══ MetaTyper Stats ═══','term-info');
  termPrint(`Balance: ${formatNum(state.credits)} ${THEMES[state.theme].currency}`);
  termPrint(`Per key: ${formatNum(state.perKey)}`);
  termPrint(`Per sec: ${formatNum(state.perSec)}`);
  termPrint(`Total keys: ${formatNum(state.totalKeys)}`);
  termPrint(`Total earned: ${formatNum(state.totalEarned)}`);
  termPrint(`Combo: ×${state.combo.toFixed(1)} (max ×${state.maxCombo})`);
  termPrint(`WPM: ${state.maxWPM} (peak)`);
  termPrint(`Play time: ${formatTime((Date.now()-state.startTime)/1000)}`);
}

function cmdShop(){
  const t = THEMES[state.theme];
  termPrint('═══ Shop ═══','term-info');
  t.upgrades.forEach(u => {
    const owned = state.owned[u.id] || 0;
    const cost = Math.floor(u.cost * Math.pow(u.costMult, owned));
    const aff = state.credits >= cost ? '✓' : '✗';
    termPrint(`[${aff}] ${u.id.padEnd(14)} ${u.name.padEnd(22)} ${formatNum(cost).padStart(8)} ${t.currency} (owned: ${owned})`, state.credits >= cost ? 'term-success' : '');
  });
  termPrint(`Use: buy <id>`,'term-warn');
}

function cmdBuy(args){
  if(!args[0]){ termPrint('Usage: buy <upgrade-id>','term-error'); return; }
  buyUpgrade(args[0]);
}

// ═══════════════════════════════════════
// MODE SWITCHING
// ═══════════════════════════════════════
function switchMode(mode){
  state.mode = mode;
  document.querySelectorAll('.ms-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  document.getElementById('wp-view').style.display = mode === 'wp' ? 'flex' : 'none';
  document.getElementById('term-view').style.display = mode === 'term' ? 'flex' : 'none';
  if(mode === 'term'){ termInput.focus(); }
  else { page.focus(); }
}

// ═══════════════════════════════════════
// SHOP
// ═══════════════════════════════════════
function getUpgradeCost(u){
  const owned = state.owned[u.id] || 0;
  return Math.floor(u.cost * Math.pow(u.costMult, owned));
}

function buyUpgrade(id){
  const t = THEMES[state.theme];
  const u = t.upgrades.find(x => x.id === id);
  if(!u){ termPrint(`Unknown upgrade: ${id}`,'term-error'); return; }
  const cost = getUpgradeCost(u);
  if(state.credits < cost){ termPrint(`Not enough credits (${formatNum(cost)} needed, ${formatNum(state.credits)} available)`,'term-error'); return; }
  state.credits -= cost;
  state.owned[u.id] = (state.owned[u.id] || 0) + 1;
  recalcStats();
  updateStats();
  renderShop();
  toast(`✅ Bought ${u.name}!`, u.icon);
  checkAchievements();
  saveDebounced();
}

function recalcStats(){
  const t = THEMES[state.theme];
  let pk = 1, ps = 0, cd = 5;
  t.upgrades.forEach(u => {
    const n = state.owned[u.id] || 0;
    if(u.eff.perKey) pk += u.eff.perKey * n;
    if(u.eff.perSec) ps += u.eff.perSec * n;
    if(u.eff.comboDecay) cd += u.eff.comboDecay * n;
  });
  state.perKey = pk;
  state.perSec = ps;
  state.comboDecay = cd;
}

// ═══════════════════════════════════════
// SIDEBAR TABS
// ═══════════════════════════════════════
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if(tab === 'shop'){
    document.getElementById('tab-content').style.display = 'block';
    document.getElementById('ach-container').style.display = 'none';
    renderShop();
  } else {
    document.getElementById('tab-content').style.display = 'none';
    document.getElementById('ach-container').style.display = 'block';
    renderAchievements();
  }
}

function renderShop(){
  const tc = document.getElementById('tab-content');
  const t = THEMES[state.theme];
  let html = '';
  t.upgrades.forEach(u => {
    const owned = state.owned[u.id] || 0;
    const cost = getUpgradeCost(u);
    const aff = state.credits >= cost;
    html += `<div class="shop-item ${aff?'affordable':''}" onclick="buyUpgrade('${u.id}')">
      <div class="icon">${u.icon}</div>
      <div class="info">
        <div class="name">${u.name}</div>
        <div class="desc">${u.desc}</div>
      </div>
      <div>
        <div class="cost">${formatNum(cost)}${t.currency}</div>
        <div class="owned">×${owned}</div>
      </div>
    </div>`;
  });
  tc.innerHTML = html;
}

function renderAchievements(){
  const ac = document.getElementById('ach-container');
  let html = '';
  ACHIEVEMENTS.forEach(a => {
    const unlocked = state.achievements[a.id];
    html += `<div class="ach-item ${unlocked?'':'locked'}">
      <div class="a-icon">${a.icon}</div>
      <div>
        <div class="a-name">${a.name}</div>
        <div class="a-desc">${a.desc}</div>
      </div>
    </div>`;
  });
  ac.innerHTML = html;
}

function checkAchievements(){
  ACHIEVEMENTS.forEach(a => {
    if(!state.achievements[a.id] && a.check(state)){
      state.achievements[a.id] = true;
      toast(`🏆 Achievement: ${a.name}!`, a.icon);
    }
  });
}

// ═══════════════════════════════════════
// UI UPDATE
// ═══════════════════════════════════════
function updateStats(){
  const t = THEMES[state.theme];
  document.getElementById('stat-credits').innerHTML = formatNum(state.credits) + ' <span style="font-size:13px;color:var(--fg-dim)">' + t.currency + '</span>';
  document.getElementById('stat-perkey').textContent = formatNum(state.perKey);
  document.getElementById('stat-persec').textContent = formatNum(state.perSec);
  document.getElementById('stat-totalkeys').textContent = formatNum(state.totalKeys);
  document.getElementById('combo-mult').textContent = '×' + state.combo.toFixed(1);
  document.getElementById('combo-bar-fill').style.width = Math.min(100, state.combo) + '%';
  const wpm = Math.round(state.recentKeys.length / 5);
  document.getElementById('wpm-display').textContent = wpm;
  // Refresh shop affordability
  document.querySelectorAll('.shop-item').forEach(el => {
    // simplified re-render
  });
  renderShop();
}

function updatePlayTime(){
  const secs = (Date.now() - state.startTime) / 1000;
  document.getElementById('stat-playtime').textContent = formatTime(secs);
}

// ═══════════════════════════════════════
// PARTICLES & EFFECTS
// ═══════════════════════════════════════
function spawnFloat(amount){
  const t = THEMES[state.theme];
  const el = document.createElement('div');
  el.className = 'float-gain';
  el.textContent = '+' + formatNum(amount) + t.currency;
  const x = window.innerWidth * (state.mode === 'term' ? 0.6 : 0.55) + (Math.random()*80-40);
  const y = window.innerHeight * 0.4 + (Math.random()*60-30);
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}

// ═══════════════════════════════════════
// TOASTS
// ═══════════════════════════════════════
function toast(msg, icon){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span style="font-size:18px">${icon||'ⓘ'}</span> ${msg}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function formatNum(n){
  if(n >= 1e9) return (n/1e9).toFixed(1) + 'B';
  if(n >= 1e6) return (n/1e6).toFixed(1) + 'M';
  if(n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return Math.floor(n).toString();
}
function formatTime(secs){
  const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = Math.floor(secs%60);
  if(h > 0) return h + 'h ' + m + 'm';
  return m + 'm ' + s + 's';
}

// ═══════════════════════════════════════
// SAVE / LOAD
// ═══════════════════════════════════════
let saveTimer = null;
function saveDebounced(){
  clearTimeout(saveTimer);
  document.getElementById('save-status').textContent = '✏️ Saving…';
  saveTimer = setTimeout(() => {
    try {
      const save = {
        credits: state.credits, perKey: state.perKey, perSec: state.perSec,
        totalKeys: state.totalKeys, startTime: state.startTime,
        maxCombo: state.maxCombo, maxWPM: state.maxWPM, totalEarned: state.totalEarned,
        owned: state.owned, achievements: state.achievements, theme: state.theme,
        docTitle: document.getElementById('doc-title').value,
        docContent: page.innerHTML
      };
      localStorage.setItem('metatyper_save', JSON.stringify(save));
      document.getElementById('save-status').textContent = '💾 Saved';
    } catch(e){
      document.getElementById('save-status').textContent = '⚠️ Save failed';
    }
  }, 1500);
}

function loadSave(){
  try {
    const raw = localStorage.getItem('metatyper_save');
    if(!raw) return false;
    const save = JSON.parse(raw);
    Object.assign(state, {
      credits: save.credits || 0, perKey: save.perKey || 1, perSec: save.perSec || 0,
      totalKeys: save.totalKeys || 0, startTime: save.startTime || Date.now(),
      maxCombo: save.maxCombo || 1, maxWPM: save.maxWPM || 0, totalEarned: save.totalEarned || 0,
      owned: save.owned || {}, achievements: save.achievements || {}, theme: save.theme || 'tokyo'
    });
    if(save.docTitle) document.getElementById('doc-title').value = save.docTitle;
    if(save.docContent){ page.innerHTML = save.docContent; lastPageLen = page.textContent.length; }
    document.getElementById('theme-select').value = state.theme;
    return true;
  } catch(e){ return false; }
}

// ═══════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════
function gameLoop(){
  const now = Date.now();
  const dt = (now - (state._lastTick || now)) / 1000;
  state._lastTick = now;

  // Idle income
  if(state.perSec > 0){
    const earn = state.perSec * dt;
    state.credits += earn;
    state.totalEarned += earn;
  }

  // Combo decay
  const sinceKey = now - state.comboTimer;
  if(sinceKey > 2000 && state.combo > 1){
    state.combo = Math.max(1, state.combo - state.comboDecay * dt);
  }

  // WPM decay
  state.recentKeys = state.recentKeys.filter(t => now - t < 60000);

  updateStats();
  updatePlayTime();
  checkAchievements();

  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
function init(){
  loadSave();
  applyTheme(state.theme);
  recalcStats();
  bootSequence();
  updateTermPrompt();
  renderShop();
  renderAchievements();
  updateWordCount();
  updateStats();
  page.focus();
  gameLoop();
}

// Click terminal area to focus input
document.getElementById('term-view').addEventListener('click', e => {
  if(e.target !== termInput) termInput.focus();
});

// Doc title save
document.getElementById('doc-title').addEventListener('input', saveDebounced);

// Prevent zoom on double-tap mobile
document.addEventListener('touchend', e => {
  const now = Date.now();
  if(now - (window._lastTap || 0) < 300){ e.preventDefault(); }
  window._lastTap = now;
}, { passive: false });

init();
</script>
