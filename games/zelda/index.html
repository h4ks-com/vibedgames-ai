const has = new Int8Array(T_N);
let bitem = -1;
let potion_doses = 0;                  /* what is in the bottle: 0, 1, 2 */
let room = 0, cell = 0;                /* where you are */
let screen = SCREEN(7,7);              /* the overworld screen you are on or under */
let level = 0;                         /* the labyrinth you are in, or 0 */
let turn = 0;
let dead = 0, won = 0;
let dead_how = "";
let stunned = 0, frozen = 0, candle_used = 0, wand_fire = 0;
let mercy = 0;                         /* the blink after a blow: nothing lands for three turns, as the original had it */
let woods_step = 0, hills_step = 0;    /* how far along the Lost Woods and Hills you are */
let last_cell = -1;
let bomb_cell = -1, bomb_room = -1, bomb_t = 0;   /* a bomb on the floor, and when it goes */
let kills = 0;                         /* the tenth enemy has the bomb */
const lvl_map = new Int8Array(10), lvl_compass = new Int8Array(10);

const message = ["", ""];
function say(s){ message[1] = message[0]; message[0] = s.slice(0, 159); }
function cap_msg(){ if (message[0].length && message[0][0] >= 'a' && message[0][0] <= 'z') message[0] = message[0][0].toUpperCase() + message[0].slice(1); }
function cap(s){ return s.length && s[0] >= 'a' && s[0] <= 'z' ? s[0].toUpperCase() + s.slice(1) : s; }
function sword_level(){ return has[T_MAGICSWORD] ? 3 : has[T_WHITESWORD] ? 2 : has[T_WOODSWORD] ? 1 : 0; }
function sword_dmg(){ const s = sword_level(); return s === 3 ? 8 : s === 2 ? 4 : s === 1 ? 2 : 0; }
function sword_name(){ const s = sword_level(); return s === 3 ? "the magical sword" : s === 2 ? "the white sword" : s === 1 ? "the wooden sword" : "no sword"; }
function ring_level(){ return has[T_REDRING] ? 2 : has[T_BLUERING] ? 1 : 0; }

/* ── the ground under you, and what may stand where ─────── */
function being_at(r, c){
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (b.alive && b.room === r && b.cell === c) return b;
  }
  return null;
}
function passable(r, c, for_beast, kind){
  if (c < 0) return 0;
  const k = RS[r].c[c];
  if (k.ground === G_VOID) return 0;
  if (k.thing >= 0 && !(THING[k.thing].flags & TF_PASS)) return 0;
  if (for_beast){
    const f = BEAST[kind].flags;
    if (k.ground === G_WATER || k.ground === G_LAKE){ if (!(f & (BF_FLIES | BF_SWIMS))) return 0; }
    else if (f & BF_SWIMS) return 0;
    if (k.ground === G_CAVE || k.ground === G_DOOR || k.ground === G_DOORWAY || k.ground === G_STAIR) return 0;   /* beasts keep to their boards */
    if (k.thing === T_DOCK) return 0;
  } else {
    if (k.ground === G_WATER || k.ground === G_LAKE) return 0;
  }
  return 1;
}
function room_dark(r){ return RS[r].dark && !RS[r].used; }
function visible(c){
  if (!room_dark(room)) return 1;
  return hex_dist(c, cell) <= 1 ? 1 : 0;
}

/* ── sound: the game side ───────────────────────────────────
 * One line at a time to whatever the page wired in; a check leaves it
 * unwired.  The bed is Hyrule's tune outside, the labyrinth's under it,
 * the ninth's in the ninth, the title's over the story; a step is the
 * ground stepped on; when a board is entered, the worst thing on it
 * calls; a beast that lands a blow calls; a blow, a shot, a throw say
 * so. */
let sound_sink = null;                 /* function(line) or null */
function sound_say(line){ if (sound_sink) sound_sink(line); }
let sound_bed = "";
let show_story = 0;                    /* a page of story, or 0: STORY[show_story - 1] */
function sound_scene(){
  if (!sound_sink) return;
  let key;
  if (show_story) key = "title";
  else if (level === 9) key = "skull";
  else if (level) key = "labyrinth";
  else key = "hyrule";
  if (key !== sound_bed){ sound_bed = key; sound_say("bed " + key); }
}
function sound_step(c){ if (sound_sink) sound_say("step " + GROUND[RS[room].c[c].ground].name); }
function sound_beasts(){
  if (!sound_sink) return;
  let worst = null;
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (!b.alive || b.room !== room) continue;
    if (!worst || BEAST[b.kind].hi > BEAST[worst.kind].hi) worst = b;
  }
  if (worst) sound_say("call " + BEAST[worst.kind].name);
}

/* ── the game ───────────────────────────────────────────────
 * Everything below is what happens when a key is pressed: a step, a
 * blow, a throw, a scroll, and then the beasts' turn and the board's.
 * The scripts -- the secrets opening, the doors, the bosses' one rule
 * each, the Lost Woods -- are kept together in scroll_to, room_enter,
 * use_item and room_tick so the whole quest can be read in one place. */
let show_keys = 0, show_look = 0, show_items = 0, show_map = 0, ask_dir = 0, show_intro = 0;
let entry_cell = -1;                   /* the cave mouth you came down: where the way out puts you */
let in_passage_from = -1;

function region_of(s){
  const x = s % 16, y = Math.trunc(s / 16);
  for (let i = REGION_N - 1; i >= 0; i--)
    if (x >= REGION[i].x0 && x <= REGION[i].x1 && y >= REGION[i].y0 && y <= REGION[i].y1) return i;
  return 0;
}
function spawn(kind, r, c){
  if (being_n >= BEING_MAX) return null;
  if (beings.length <= being_n) beings.push(new_being());
  const b = beings[being_n++];
  b.kind = kind; b.room = r; b.cell = c; b.home = c;
  b.alive = 1; b.state = 0; b.hp = BEAST[kind].hp; b.timer = 0; b.cool = 0;
  b.dir = roll(0, 5);
  if (room === r) sound_say("call " + BEAST[kind].name);      /* it announces itself */
  return b;
}
/* a free cell of a board for a beast, drawn by the seed */
function free_cell_for(r, kind, tag, i){
  for (let tries = 0; tries < 40; tries++){
    const c = Math.trunc(draw(tag, i * 64 + tries) * BOARD_SIZE);
    if (!passable(r, c, 1, kind) || being_at(r, c)) continue;
    if (RS[r].kind === RK_OVER && (hex_dist(c, 30) < 2 || hex_dist(c, 30) === 4) && tries < 20) continue;   /* not where you stand, not on the rim where you come in */
    if (RS[r].kind !== RK_OVER && hex_dist(c, 58) <= 1) continue;
    return c;
  }
  return -1;
}
function spawn_droom(r){
  const D = DROOM[RS[r].spec];
  const tag = "droom" + r;
  for (let f = 0; f < 3; f++)
    for (let i = 0; i < D.foes[f].n; i++){
      const kind = D.foes[f].kind;
      let c = kind === BK_HUNGRY ? -1 : free_cell_for(r, kind, tag, f * 8 + i);
      if (kind === BK_HUNGRY){ for (let k = 0; k < BOARD_SIZE; k++) if (RS[r].c[k].ch === 'G') c = k; }
      if ((BEAST[kind].flags & BF_BOSS) && kind !== BK_PATRA) c = 30;
      if (c < 0) continue;
      const b = spawn(kind, r, c);
      if (b && kind === BK_PATRA)
        for (let e = 0; e < 4; e++){ const ec = free_cell_for(r, BK_PATRAEYE, tag, 40 + e); if (ec >= 0) spawn(BK_PATRAEYE, r, ec); }
    }
  for (let c = 0; c < BOARD_SIZE; c++) if (RS[r].c[c].ch === 'T') spawn(BK_TRAP, r, c);
}
function spawn_screen(s){
  const G = REGION[region_of(s)];
  const tag = "screen" + s;
  let n = G.n + (draw(tag, 0) < 0.4 ? 1 : 0);
  const fi = screen_secret(s, SH_FAIRY);
  if (fi >= 0) n = 0;                      /* nothing lives where a fairy does */
  for (let i = 0; i < n; i++){
    const kind = G.kinds[Math.trunc(draw(tag, 1 + i) * 4)];
    const c = free_cell_for(s, kind, tag, 8 + i);
    if (c >= 0) spawn(kind, s, c);
  }
  /* a Zola in any water big enough */
  let wet = 0;
  for (let c = 0; c < BOARD_SIZE; c++) if (RS[s].c[c].ground === G_WATER) wet++;
  if (wet >= 18 && screen_secret(s, SH_FAIRY) < 0 && draw(tag, 70) < 0.5){ const c = free_cell_for(s, BK_ZOLA, tag, 60); if (c >= 0) spawn(BK_ZOLA, s, c); }
  if (fi >= 0 && sec_cell[fi] >= 0) spawn(BK_FAIRY, s, sec_cell[fi]);
}
function init_world(){
  being_n = 0;
  build_world();
  has.fill(0);
  has[T_SHIELD] = 1;                       /* the small shield, as the original began you with it */
  lvl_map.fill(0); lvl_compass.fill(0);
  hp = START_HP; max_hp = START_HP; rupees = 0; keys = 0; bombs = 0; bomb_max = 8; triforce = 0; deaths = 0;
  bitem = -1; potion_doses = 0; stunned = 0; frozen = 0; mercy = 0; candle_used = 0; wand_fire = 0;
  woods_step = 0; hills_step = 0; last_cell = -1; bomb_cell = -1; bomb_room = -1; bomb_t = 0; kills = 0;
  screen = SCREEN(7,7); room = screen; cell = 30; level = 0; turn = 0; dead = 0; won = 0;
  entry_cell = -1; in_passage_from = -1;
  message[0] = ""; message[1] = "";
  show_story = 0;
  for (let s = 0; s < OW_N; s++) spawn_screen(s);
  for (let i = 0; i < DROOM_N; i++) spawn_droom(DR_BASE + i);
  room_enter(-1);
}

/* ── hearts ───────────────────────────────────────────────── */
function game_dead(how){
  if (dead) return;
  dead = 1;
  dead_how = how.slice(0, 299);
  sound_say("jingle over");
  sound_say("bed off"); sound_bed = "";
  show_story = 3;
}
function hurt(dmg, how){
  if (dmg <= 0 || dead) return;
  if (mercy > 0) return;
  const div = ring_level() === 2 ? 4 : ring_level() === 1 ? 2 : 1;
  dmg = Math.trunc((dmg + div - 1) / div);
  hp -= dmg;
  mercy = 3;
  if (hp <= 0){ hp = 0; game_dead(how); }
}
function heal(n){ hp += n; if (hp > max_hp) hp = max_hp; }

/* ── going from board to board ── */
function count_foes(r){
  let n = 0;
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (!b.alive || b.room !== r) continue;
    if (b.kind === BK_TRAP || b.kind === BK_BUBBLE || b.kind === BK_HUNGRY || b.kind === BK_GLEEOKHEAD || b.kind === BK_ROCK || b.kind === BK_FAIRY || b.kind === BK_GHOST) continue;
    n++;
  }
  return n;
}
function room_boss_alive(r){
  for (let i = 0; i < being_n; i++)
    if (beings[i].alive && beings[i].room === r && (BEAST[beings[i].kind].flags & BF_BOSS)) return 1;
  return 0;
}
/* the beasts of a board come back: all of them, if all of them are dead */
function revive_board(r, only_if_empty){
  let any_alive = 0, any = 0;
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (b.room !== r || b.home < 0) continue;
    if (b.kind === BK_GHOST || b.kind === BK_ROCK || b.kind === BK_PATRAEYE || b.kind === BK_GLEEOKHEAD || b.kind === BK_DIGSMALL || b.kind === BK_GEL || b.kind === BK_KEESE){ if (b.alive) any_alive = 1; continue; }
    any = 1;
    if (b.alive) any_alive = 1;
  }
  if (!any || (only_if_empty && any_alive)) return;
  for (let i = 0; i < being_n; i++){
    const b = beings[i];
    if (b.room !== r || b.home < 0 || b.alive) continue;
    if (BEAST[b.kind].flags & BF_BOSS) continue;
    if (b.kind === BK_GHOST || b.kind === BK_ROCK || b.kind === BK_ARMOS) continue;
    if (being_at(r, b.home)) continue;
    b.alive = 1; b.hp = BEAST[b.kind].hp; b.cell = b.home; b.state = 0; b.timer = 0; b.cool = 0;
  }
}
function revive_level(lv){
  for (let r = DR_BASE; r < room_n; r++) if (RS[r].level === lv) revive_board(r, 0);
}
function droom_name(r){ return "level " + RS[r].level + ", room " + String.fromCharCode(78 + RS[r].gx) + (RS[r].gy + 1); }
function room_enter(from){
  const R = RS[room];
  candle_used = 0;
  if (R.kind === RK_OVER){
    screen = room; level = 0;
    revive_board(room, 1);
    if (!R.seen){ R.seen = 1; const g = region_of(room); say("Screen " + (room % 16) + "," + Math.trunc(room / 16) + ": " + REGION_NAME[g] + "."); cap_msg(); }
    else say("Screen " + (room % 16) + "," + Math.trunc(room / 16) + ".");
  } else if (R.kind === RK_CAVE){
    level = 0;
    if (room === PASSAGE_ROOM) say("An underground passage, with a stairwell up to each of four screens.");
    else {
      const S = SECRET[R.spec];
      const K = CAVEK[S.kind];
      let line = cave_line(S);
      if (S.kind === CV_MEDICINE && !has[T_LETTER]) line = 33;
      if ((S.kind === CV_LOSTWOODS || S.kind === CV_LOSTHILLS) && R.used) line = S.kind === CV_LOSTWOODS ? 12 : 13;
      say(THING[K.man].name + ": \"" + LINE[line] + "\""); cap_msg();
      if (S.kind === CV_REPAIR && !R.used){ R.used = 1; const pay = rupees < 20 ? rupees : 20; rupees -= pay; if (pay) say(message[0] + "  He takes " + pay + " rupees."); }
      if (S.kind === CV_GAMBLE) for (let c = 0; c < BOARD_SIZE; c++) if (R.c[c].ch >= '1' && R.c[c].ch <= '3') R.c[c].thing = T_GAMBLE;
      if (S.kind === CV_MEDICINE) for (let c = 0; c < BOARD_SIZE; c++) if (R.c[c].ch === '1' || R.c[c].ch === '3') R.c[c].thing = has[T_LETTER] ? K.items[R.c[c].ch.charCodeAt(0) - 49] : -1;
    }
  } else {
    const was_out = from < 0 || RS[from].kind !== RK_DUNGEON;
    level = R.level;
    if (was_out) revive_level(level);
    const D = DROOM[R.spec];
    if (was_out) say("Level " + level + ", " + LEVEL[level].name + ".");
    else if (D.line >= 0 && R.c[22].thing === T_OLDMAN) say("The old man: \"" + LINE[D.line] + "\"");
    else if (D.line >= 0 && R.c[22].thing === T_ZELDA) say("Zelda, between two fires.");
    else if (room_boss_alive(room)){ let b = null; for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].room === room && (BEAST[beings[i].kind].flags & BF_BOSS)) b = beings[i]; say(droom_name(room) + ".  " + (b ? BEAST[b.kind].name : "")); cap_msg(); }
    else { say(droom_name(room) + "."); cap_msg(); }
    R.seen = 1;
  }
  sound_scene();
  sound_beasts();
}
/* off the edge of a screen: the next screen, or the same one in the Lost Woods */
const WOODS_SEQ = [0, 3, 2, 3];
function scroll_to(d){
  const r = COORD_R[cell];
  const x = screen % 16, y = Math.trunc(screen / 16);
  let way;   /* 0 N, 1 E, 2 S, 3 W */
  if ((d === 4 || d === 5) && r === -4) way = 0;
  else if ((d === 1 || d === 2) && r === 4) way = 2;
  else if (d === 0 || d === 5 || d === 1) way = 1;
  else way = 3;
  let nx = x + (way === 1 ? 1 : 0) - (way === 3 ? 1 : 0), ny = y + (way === 2 ? 1 : 0) - (way === 0 ? 1 : 0);
  let loop = 0;
  if (screen === SCREEN(1,6) && way !== 1){
    if (way === WOODS_SEQ[woods_step]){ woods_step++; if (woods_step < 4) loop = 1; else { woods_step = 0; nx = 0; ny = 6; } }
    else { woods_step = 0; loop = 1; }
  } else if (screen === SCREEN(10,1) && (way === 0 || way === 1)){
    if (way === 0){ hills_step++; if (hills_step < 4) loop = 1; else { hills_step = 0; nx = 10; ny = 0; } }
    else { hills_step = 0; loop = 1; }
  } else { woods_step = 0; hills_step = 0; }
  if (loop){ nx = x; ny = y; }
  if (nx < 0 || nx > 15 || ny < 0 || ny > 7){ say("The edge of the world."); return 0; }
  const to = SCREEN(nx, ny);
  let at;
  if (way === 0) at = cell + 56;
  else if (way === 2) at = cell - 56;
  else if (way === 1) at = row_first(r);
  else at = row_last(r);
  let sailed = 0;
  if (!passable(to, at, 0, 0) && has[T_RAFT] && (RS[to].c[at].ground === G_WATER) && screen_secret(to, SH_DOCK) >= 0){
    /* off the board into water, with the raft: it carries you to the dock over there */
    at = sec_cell[screen_secret(to, SH_DOCK)]; sailed = 1;
  }
  if (!passable(to, at, 0, 0)){
    /* the rim there is not open at this cell: the nearest cell of the rim that is */
    let best = -1, bd = 99;
    for (let c = 0; c < BOARD_SIZE; c++){
      const rc = COORD_R[c];
      const on_rim = way === 0 ? rc === 4 : way === 2 ? rc === -4 : way === 1 ? c === row_first(rc) : c === row_last(rc);
      if (!on_rim || !passable(to, c, 0, 0)) continue;
      const dd = hex_dist(c, at);
      if (dd < bd){ bd = dd; best = c; }
    }
    if (best < 0 || bd > 2){ say("The way off the screen is blocked there."); return 0; }
    at = best;
  }
  const from = room;
  room = to; cell = at; last_cell = -1;
  arrive_clear();
  room_enter(from);
  if (loop) say(message[0] + "  The same screen.");
  if (sailed) say(message[0] + "  The raft brings you to the dock.");
  return 1;
}
function enter_cave(c){
  const S = secret_at(screen, c);
  const from = room;
  let lv = 0;
  if (S && S.kind === CV_LEVEL) lv = S.arg;
  if (!S){ let li = -1; for (let i = 0; i < SECRET_N; i++) if (SCREEN(SECRET[i].x, SECRET[i].y) === screen && SECRET[i].kind === CV_LEVEL) li = i; if (li >= 0) lv = SECRET[li].arg; }
  entry_cell = c;
  if (lv){
    room = level_room(lv); cell = 58;
    room_enter(from);
    return;
  }
  if (S && S.kind === CV_PASSAGE){
    in_passage_from = screen;
    room = PASSAGE_ROOM;
    for (let k = 0; k < BOARD_SIZE; k++){ const ch = RS[room].c[k].ch; if (ch >= 'A' && ch <= 'D' && PASSAGE_SCREEN[ch.charCodeAt(0) - 65] === screen) cell = k; }
    room_enter(from);
    return;
  }
  if (cave_room[screen] < 0){ say("An empty cave."); return; }
  room = cave_room[screen]; cell = 58;
  room_enter(from);
}
/* arriving on a board where something stands on the cell: a step beside it, or it gives way */
function arrive_clear(){
  let b = being_at(room, cell);
  if (b){ for (let dd = 0; dd < 6; dd++){ const n = step_cell(cell, dd); if (n >= 0 && passable(room, n, 0, 0) && !being_at(room, n)){ cell = n; break; } } }
  if ((b = being_at(room, cell)) !== null){
    let moved = 0;
    for (let n = 0; n < BOARD_SIZE && !moved; n++) if (n !== cell && passable(room, n, 1, b.kind) && !being_at(room, n) && hex_dist(n, cell) > 1){ b.cell = n; moved = 1; }
    if (!moved) b.alive = 0;
  }
}
function leave_to_screen(s, c){
  const from = room;
  room = s; screen = s; level = 0;
  cell = c >= 0 && c < BOARD_SIZE ? c : 30;
  arrive_clear();
  room_enter(from);
}
function take_door(side){
  const R = RS[room];
  const to = droom_room(R.level, R.gx + (side === 1 ? 1 : 0) - (side === 3 ? 1 : 0), R.gy + (side === 2 ? 1 : 0) - (side === 0 ? 1 : 0));
  if (to < 0){ say("The door opens on rock."); return; }
  const from = room;
  room = to; cell = door_cell((side + 2) % 4); last_cell = -1;
  room_enter(from);
}
function take_stair(){
  const R = RS[room];
  if (room === PASSAGE_ROOM){
    const ch = R.c[cell].ch;
    if (ch < 'A' || ch > 'D') return;
    const s = PASSAGE_SCREEN[ch.charCodeAt(0) - 65];
    const i = screen_secret(s, SH_PUSH);
    const c = i >= 0 ? sec_cell[i] : 30;
    if (i >= 0 && !sec_found[i]){ sec_found[i] = 1; RS[s].c[c].thing = -1; RS[s].c[c].ground = G_CAVE; }
    say("Up the stairs, and out from under the rock.");
    leave_to_screen(s, c);
    return;
  }
  if (R.kind !== RK_DUNGEON) return;
  const D = DROOM[R.spec];
  if (D.stair >= 0){
    if (has[D.stair]){ say("The stairwell, and nothing more down it."); return; }
    has[D.stair] = 1;
    sound_say("jingle item");
    say("Down the stairs, and up again with " + THING[D.stair].name + ".");
    if ((THING[D.stair].flags & TF_BITEM) && bitem < 0) bitem = D.stair;
    return;
  }
  if (D.pgx >= 0){
    const to = droom_room(R.level, D.pgx, D.pgy);
    if (to < 0) return;
    let at = -1;
    for (let c = 0; c < BOARD_SIZE; c++) if (RS[to].c[c].ground === G_STAIR) at = c;
    if (at < 0){
      /* the stairwell there is still under its block: the block is pushed aside */
      for (let c = 0; c < BOARD_SIZE; c++) if (RS[to].c[c].thing === T_PUSHBLOCK && at < 0){
        RS[to].c[c].thing = -1; RS[to].c[c].ground = G_STAIR; RS[to].pushed = 1; at = c;
      }
    }
    if (at < 0) at = 30;
    const from = room;
    room = to; cell = at; last_cell = -1;
    say("The underground passage, and up at the other end.");
    room_enter(from);
    return;
  }
  say("A stairwell that goes nowhere.");
}

/* ── taking things ────────────────────────────────────────── */
function give_rupees(n){ rupees += n; if (rupees > RUPEE_MAX) rupees = RUPEE_MAX; if (rupees < 0) rupees = 0; }
function take_item(c){
  const R = RS[room];
  const k = R.c[c];
  const t = k.thing;
  if (t < 0 || !(THING[t].flags & TF_TAKE)) return;
  const price = R.kind === RK_CAVE ? R.price[c] : 0;
  const nm = THING[t].name;
  if (price > 0 && t !== T_GAMBLE){
    if (rupees < price){ say(nm + " costs " + price + " rupees, and you have " + rupees + "."); cap_msg(); return; }
    if ((THING[t].flags & TF_ITEM) && has[t]){ say("You have " + nm + " already."); return; }
    if (t === T_BOMBS && bombs >= bomb_max){ say("You cannot carry more bombs."); return; }

  }
  switch (t){
  case T_RUPEE: give_rupees(1); say("A rupee.  " + rupees + "."); break;
  case T_RUPEE5: give_rupees(5); say("A blue rupee: five.  " + rupees + "."); break;
  case T_RUPEES10: give_rupees(10); say("Ten rupees.  " + rupees + "."); sound_say("jingle key"); break;
  case T_RUPEES30: give_rupees(30); say("Thirty rupees.  " + rupees + "."); sound_say("jingle key"); break;
  case T_RUPEES100: give_rupees(100); say("A hundred rupees.  " + rupees + "."); sound_say("jingle secret"); break;
  case T_HEART: heal(2); say("A heart."); break;
  case T_FAIRYDROP: heal(HP_MAX); say("A fairy.  All the hearts back."); sound_say("jingle fairy"); break;
  case T_BOMBDROP: bombs += 4; if (bombs > bomb_max) bombs = bomb_max; say("Bombs: " + bombs + "."); if (bitem < 0) bitem = T_BOMBS; break;
  case T_BOMBS: bombs += 4; if (bombs > bomb_max) bombs = bomb_max; has[T_BOMBS] = 1; say("Four bombs.  " + bombs + "."); if (bitem < 0) bitem = T_BOMBS; break;
  case T_BOMBUP: bomb_max += 4; say("The bag holds " + bomb_max + " bombs now."); break;
  case T_CLOCK: frozen = 30; say("A clock.  Everything on the screen stops."); break;
  case T_KEY: keys++; say("A key.  " + keys + "."); sound_say("jingle key"); break;
  case T_MAP: lvl_map[level] = 1; say("The map of level " + level + "."); sound_say("jingle key"); break;
  case T_COMPASS: lvl_compass[level] = 1; say("The compass of level " + level + "."); sound_say("jingle key"); break;
  case T_HEARTCONTAINER:
    if (max_hp < HP_MAX) max_hp += 2;
    hp = max_hp;
    say("A heart container.  " + Math.trunc(max_hp / 2) + " hearts."); sound_say("jingle item");
    if (R.kind === RK_CAVE) for (let i = 0; i < BOARD_SIZE; i++) if (R.c[i].thing === T_REDPOTION && i !== c) R.c[i].thing = -1;
    break;
  case T_TRIFORCE:
    triforce++;
    sound_say("jingle triforce");
    say("A piece of the Triforce: " + triforce + " of eight.");
    k.thing = -1;
    leave_level_won();
    return;
  case T_WHITESWORD:
    if (max_hp < 10){ say("\"Master using it and you can have this.\"  Five hearts, and you have " + Math.trunc(max_hp / 2) + "."); return; }
    has[t] = 1; say("The white sword.  Twice the wooden one."); sound_say("jingle item"); break;
  case T_MAGICSWORD:
    if (max_hp < 24){ say("Twelve hearts for this sword, and you have " + Math.trunc(max_hp / 2) + "."); return; }
    has[t] = 1; say("The magical sword."); sound_say("jingle item"); break;
  case T_GAMBLE: {
    const r = roll(1, 4);

    return; }
  case T_INFO:
    R.used = 1;

    break;
  case T_REDPOTION: has[T_REDPOTION] = 1; has[T_POTION] = 0; potion_doses = 2; say("The red potion: twice, all the hearts."); if (bitem < 0 || bitem === T_POTION) bitem = T_REDPOTION; break;
  case T_POTION: if (!has[T_REDPOTION]){ has[T_POTION] = 1; potion_doses = 1; if (bitem < 0) bitem = T_POTION; } say("The water of life: once, all the hearts."); break;
  default:
    if (THING[t].flags & TF_ITEM){
      has[t] = 1;
      say(nm + "."); cap_msg();
      sound_say("jingle item");
      if (t === T_MAGICBOOMERANG && bitem === T_BOOMERANG) bitem = t;
      if (t === T_REDCANDLE && bitem === T_BLUECANDLE) bitem = t;
      if (t === T_SILVERARROWS && bitem === T_ARROWS) bitem = t;
      if ((THING[t].flags & TF_BITEM) && bitem < 0) bitem = t;

      if (t === T_LETTER) say("The letter.  Show it to the old women who sell medicine.");

  }

  if (!(R.kind === RK_CAVE && price > 0) || t === T_INFO) k.thing = -1;
  if (R.kind === RK_CAVE && SECRET[R.spec].kind === CV_HEART && t === T_REDPOTION) for (let i = 0; i < BOARD_SIZE; i++) if (R.c[i].thing === T_HEARTCONTAINER) R.c[i].thing = -1;
}
/* the piece taken: out of the labyrinth, hearts full, as the original warped you */
function leave_level_won(){
  const lv = level;
  hp = max_hp;
  const s = SCREEN(LEVEL[lv].sx, LEVEL[lv].sy);
  let c = -1;
  for (let i = 0; i < SECRET_N; i++) if (SCREEN(SECRET[i].x, SECRET[i].y) === s && SECRET[i].kind === CV_LEVEL) c = sec_cell[i];
  say("The piece rises, and you are outside level " + lv + " with all your hearts.");
  leave_to_screen(s, c);
}

/* ── a step ─────────────────────────────────────────────── */
function reveal_secret(i, how){
  const S = SECRET[i];
  const s = SCREEN(S.x, S.y), c = sec_cell[i];
  if (sec_found[i] || c < 0) return;
  sec_found[i] = 1;
  const k = RS[s].c[c];
  k.thing = -1; k.ground = G_CAVE;
  if (S.how === SH_WALKIN && S.kind === CV_NONE) k.ground = grey_screen(s) ? G_GREY : G_GROUND;
  if (S.how === SH_WHISTLE){
    for (let j = 0; j < BOARD_SIZE; j++) if (RS[s].c[j].ground === G_LAKE){ RS[s].c[j].ground = G_GROUND; RS[s].c[j].ch = '.'; }
    k.ground = G_CAVE;
    for (let j = 0; j < being_n; j++) if (beings[j].room === s && beings[j].kind === BK_FAIRY) beings[j].alive = 0;
  }
  sound_say("jingle secret");
  say(how);
}
function arrive(c){
  const k = RS[room].c[c];
  last_cell = cell;
  cell = c;
  sound_step(c);
  if (k.thing >= 0 && (THING[k.thing].flags & TF_TAKE)) take_item(c);
  if (dead) return;
  if (k.ground === G_CAVE && room < OW_N){ enter_cave(c); return; }
  if (k.ground === G_DOORWAY){
    if (level){ say("Out of the labyrinth."); leave_to_screen(SCREEN(LEVEL[level].sx, LEVEL[level].sy), entry_cell); }
    else { leave_to_screen(screen, entry_cell); }
    return;
  }
  if (k.ground === G_DOOR && RS[room].kind === RK_DUNGEON){
    for (let side = 0; side < 4; side++) if (door_cell(side) === c){ take_door(side); return; }
  }
  if (k.ground === G_STAIR) take_stair();
}
function open_door(r, side){
  const R = RS[r];
  if (R.door[side] === '-' || R.door[side] === '.' || R.door[side] === 'e') return;
  R.door[side] = '.'; set_door_cell(r, side);
  const to = droom_room(R.level, R.gx + (side === 1 ? 1 : 0) - (side === 3 ? 1 : 0), R.gy + (side === 2 ? 1 : 0) - (side === 0 ? 1 : 0));
  if (to >= 0){ const back = (side + 2) % 4; if (RS[to].door[back] !== '-' && RS[to].door[back] !== 'e'){ RS[to].door[back] = '.'; set_door_cell(to, back); } }
}
function push_block(c, d){
  const R = RS[room];
  if (count_foes(room) > 0){ say("The block will not move while anything is alive in the room."); return; }
  let beyond = step_cell(c, d);
  const free_ok = beyond >= 0 && passable(room, beyond, 0, 0) && !being_at(room, beyond) && RS[room].c[beyond].ground === G_FLOOR && RS[room].c[beyond].thing < 0;
  if (!free_ok){
    /* it will not go that way: it slides aside, to the first free cell round it */
    beyond = -1;
    for (let k = 1; k < 6 && beyond < 0; k++){
      const n = step_cell(c, (d + k) % 6);
      if (n >= 0 && n !== cell && passable(room, n, 0, 0) && !being_at(room, n) && RS[room].c[n].ground === G_FLOOR && RS[room].c[n].thing < 0) beyond = n;
    }
    if (beyond < 0){ say("The block will not move."); return; }
  }
  R.c[beyond].thing = T_BLOCK; R.c[beyond].ch = 'B';
  R.c[c].thing = -1;
  R.pushed = 1;
  const D = DROOM[R.spec];
  let opened = 0;
  let stair_already = 0;
  for (let i = 0; i < BOARD_SIZE; i++) if (R.c[i].ground === G_STAIR) stair_already = 1;
  if ((D.stair >= 0 || D.pgx >= 0) && !stair_already){ R.c[c].ground = G_STAIR; R.c[c].ch = 'S'; say("The block slides, and there is a stairwell under it."); opened = 1; }
  for (let side = 0; side < 4; side++) if (R.door[side] === 'x'){ open_door(room, side); say("The block slides, and a door opens."); opened = 1; }
  if (!opened) say("The block slides.");
  else sound_say("jingle secret");
  turn++; end_turn();
}
function wake_armos(c){
  const R = RS[room];
  const S = secret_at(room, c);
  const idx = secret_idx;
  R.c[c].thing = -1;
  let at = -1;
  for (let d = 0; d < 6; d++){ const n = step_cell(c, d); if (n >= 0 && n !== cell && passable(room, n, 1, BK_ARMOS) && !being_at(room, n)){ at = n; break; } }
  const b = spawn(BK_ARMOS, room, at >= 0 ? at : c);
  if (b) b.home = -1;
  if (S && S.how === SH_ARMOS && !sec_found[idx]) reveal_secret(idx, "The Armos wakes and steps off a stairwell.");
  else say("The Armos wakes.");
}
function touch_grave(c){
  const S = secret_at(room, c);
  const idx = secret_idx;
  if (S && S.how === SH_PUSH && !sec_found[idx]){ reveal_secret(idx, "The tombstone slides, and there are stairs under it."); return; }
  let ghosts = 0;
  for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].room === room && beings[i].kind === BK_GHOST) ghosts++;
  if (ghosts >= 3){ say("The tombstone does not move."); return; }
  let at = -1;
  for (let d = 0; d < 6; d++){ const n = step_cell(c, d); if (n >= 0 && n !== cell && passable(room, n, 1, BK_GHOST) && !being_at(room, n)){ at = n; break; } }
  if (at >= 0){ const b = spawn(BK_GHOST, room, at); if (b) b.home = -1; say("Something comes out of the tombstone."); }
}
/* where the raft lands on screen `to`: its dock, or failing that its southmost floor */
function raft_landing(to){
  const di = screen_secret(to, SH_DOCK);
  if (di >= 0 && sec_cell[di] >= 0) return sec_cell[di];
  let at = -1, bs = 1 << 30;
  for (let i = 0; i < BOARD_SIZE; i++) if (passable(to, i, 0, 0) && RS[to].c[i].ground !== G_CAVE){ const sc = pick_score(P_S, i); if (sc < bs){ bs = sc; at = i; } }
  return at;
}
function move_dir(d){
  const c = step_cell(cell, d);
  if (c < 0){
    if (RS[room].kind === RK_OVER){ if (scroll_to(d)){ turn++; end_turn(); } return; }
    say("The wall."); return;
  }
  const k = RS[room].c[c];
  const b = being_at(room, c);
  if (b){ player_attack(b); if (!dead) end_turn(); return; }
  const t = k.thing;
  if (t === T_PUSHBLOCK){ push_block(c, d); return; }
  if (t === T_ARMOS){ wake_armos(c); turn++; end_turn(); return; }
  if (t === T_GRAVE){ touch_grave(c); turn++; end_turn(); return; }
  if (t === T_LOCKEDDOOR){
    if (!keys && !has[T_MAGICKEY]){ say("A locked door, and no key."); return; }
    if (!has[T_MAGICKEY]) keys--;
    for (let side = 0; side < 4; side++) if (door_cell(side) === c) open_door(room, side);
    say(has[T_MAGICKEY] ? "The magic key opens it." : "A key turns, and the door is open.  " + keys + " left.");
    sound_say("jingle key");
    turn++; end_turn(); return;
  }
  if (t === T_SHUTTER){ say(count_foes(room) ? "The door is shut until the room is empty." : "The door is shut."); return; }

    if (RS[room].c[22].thing === T_ZELDA && sword_level()){
      k.thing = -1; say("The sword puts the fire out.");
      let left = 0; for (let i = 0; i < BOARD_SIZE; i++) if (RS[room].c[i].thing === T_FIRE) left++;
      if (!left){ won = 1; show_story = 2; sound_say("jingle triforce"); sound_say("bed off"); sound_bed = ""; }
      turn++; if (!won) end_turn(); return;
    }
    hurt(2, "The fire."); say("The fire burns."); turn++; end_turn(); return;
  }
  if (t === T_ROCK || t === T_STONE || t === T_WHITEROCK || t === T_TREE){
    const S = secret_at(room, c);
    const idx = secret_idx;
    if (S && S.how === SH_PUSH && !sec_found[idx]){
      if (!has[T_BRACELET]){ say("The rock does not move.  Something stronger than you would move it."); return; }
      reveal_secret(idx, "With the bracelet the rock slides aside, and there are stairs under it.");
      turn++; end_turn(); return;
    }
    if (S && S.how === SH_WALKIN && !sec_found[idx]){
      reveal_secret(idx, S.kind === CV_NONE ? "You walk into the rock, and through it." : "You walk into the waterfall, and there is a cave behind it.");
      turn++; arrive(c); if (!dead) end_turn(); return;
    }
    say(THING[t].name + "."); cap_msg(); return;
  }
  if (k.ground === G_WATER || k.ground === G_LAKE){
    if (RS[room].c[cell].thing === T_DOCK && has[T_RAFT]){
      const idx = screen_secret(room, SH_DOCK);
      const to = SECRET[idx].arg;
      const at = raft_landing(to);
      say("The raft, from the dock, across the water.");
      sound_say("step water");
      turn++;
      leave_to_screen(to, at);
      end_turn(); return;
    }
    if (has[T_LADDER]){
      const beyond = step_cell(c, d);
      if (beyond >= 0 && passable(room, beyond, 0, 0) && !being_at(room, beyond)){
        say("The ladder goes over the water.");
        sound_say("step water");
        turn++; arrive(beyond); if (!dead) end_turn(); return;
      }
      if (beyond < 0 && RS[room].kind === RK_OVER){ say("The ladder is one cell of water, and the edge is past it."); return; }
      say("The ladder is one cell of water, and there is more than one."); return;
    }
    say("Water."); return;
  }
  if (!passable(room, c, 0, 0)){ if (t >= 0 && t !== T_WALL){ say(THING[t].name + "."); cap_msg(); } else say("The wall."); return; }
  turn++;
  arrive(c);
  if (!dead) end_turn();
}
function wait_turn(){ turn++; end_turn(); }

/* ── fighting ───────────────────────────────────────────── */
function drop_at(r, c){
  /* what a beast leaves: the tenth has the bomb, the rest is the dice */
  if (RS[r].c[c].thing >= 0 || RS[r].c[c].ground !== (RS[r].kind === RK_OVER ? (grey_screen(r) ? G_GREY : G_GROUND) : G_FLOOR)) return;
  let t = -1;
  if (kills % 10 === 0 && has[T_BOMBS]) t = T_BOMBDROP;
  else {
    const d = roll(1, 20);
    t = d <= 4 ? -1 : d <= 9 ? T_RUPEE : d <= 13 ? T_RUPEE5 : d <= 19 ? T_HEART : (kills % 16 === 0 ? T_FAIRYDROP : has[T_BOMBS] ? T_BOMBDROP : T_CLOCK);
  }
  if (t >= 0) RS[r].c[c].thing = t;
}
function open_shutters(r){
  for (let side = 0; side < 4; side++) if (RS[r].door[side] === 's') open_door(r, side);
  RS[r].cleared = 1;
}
function kill_being(b){
  const K = BEAST[b.kind];
  b.alive = 0;
  kills++;
  sound_say("call " + K.name);
  switch (b.kind){
  case BK_ZOL:
    if (sword_level() < 2){
      say("The Zol comes apart in two Gels.");
      for (let d = 0; d < 6; d++){ const c = step_cell(b.cell, d); if (c >= 0 && c !== cell && passable(room, c, 1, BK_GEL) && !being_at(room, c)){ const u = spawn(BK_GEL, room, c); if (u) u.home = -1; if (d >= 3) break; d = 2; } }
      return;
    }
    break;
  case BK_VIRE:
    if (sword_level() < 3){
      say("The Vire comes apart in two Keese.");
      let made = 0;
      for (let d = 0; d < 6 && made < 2; d++){ const c = step_cell(b.cell, d); if (c >= 0 && c !== cell && passable(room, c, 1, BK_KEESE) && !being_at(room, c)){ const u = spawn(BK_KEESE, room, c); if (u) u.home = -1; made++; } }
      return;
    }
    break;
  case BK_GHINI:
    for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].room === room && beings[i].kind === BK_GHOST) beings[i].alive = 0;
    say("The Ghini is down, and the ghosts go with it.");
    return;
  case BK_GANON:
    say("Ganon is ashes, and the Triforce of Power is in them.  The door to the room above opens.");
    open_shutters(room);
    return;
  default: break;
  }
  if (K.flags & BF_BOSS){
    if (room_boss_alive(room)){ say(K.name + " is down."); cap_msg(); return; }
    if (b.kind !== BK_PATRA){ RS[room].c[30].thing = T_HEARTCONTAINER; if (being_at(room, 30) === null && cell === 30) take_item(30); }
    say(K.name + " is down, and a heart container is left where it was."); cap_msg();
    sound_say("jingle item");
    return;
  }
  drop_at(b.room, b.cell);
  say(K.name + " is down."); cap_msg();
}
/* a blow lands: what the kind makes of it */
function hit_being(b, dmg, withw){
  const K = BEAST[b.kind];
  if (K.flags & BF_IMMUNE){ sound_say("blow clang"); say(withw + " does nothing to " + K.name + "."); return; }
  if ((K.flags & BF_PATRA)){
    let eyes = 0;
    for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].room === room && beings[i].kind === BK_PATRAEYE) eyes++;
    if (eyes){ sound_say("blow clang"); say(withw + " glances off the Patra.  " + eyes + " eyes still go round it."); return; }
  }
  b.hp = b.hp - dmg;
  sound_say("blow hit");
  if ((K.flags & BF_INVIS) && b.state < 2){ b.state = 1; b.timer = 3; }
  if (K.flags & BF_HEADS){
    const heads_before = Math.trunc((b.hp + dmg + 11) / 12), heads_after = Math.trunc((b.hp + 11) / 12);
    if (heads_after < heads_before && b.hp > 0){
      for (let d = 0; d < 6; d++){ const c = step_cell(b.cell, d); if (c >= 0 && c !== cell && passable(room, c, 1, BK_GLEEOKHEAD) && !being_at(room, c)){ const u = spawn(BK_GLEEOKHEAD, room, c); if (u) u.home = -1; break; } }
      say(withw + ": " + dmg + ".  A head comes off the Gleeok and flies.");
      return;
    }
  }
  if (b.hp <= 0){
    if (K.flags & BF_INVIS){ b.hp = 1; b.state = 2; b.timer = 99; say(withw + ": " + dmg + ".  Ganon staggers and is seen, and stays seen.  Now the silver arrow."); return; }
    say(withw + ": " + dmg + ".  "); kill_being(b);
  }
  else say(withw + ": " + dmg + ".  " + K.name + " is " + (b.hp > Math.trunc(K.hp / 2) ? "hurt" : "badly hurt") + ".");
  cap_msg();
}
function beast_hidden(b){
  const K = BEAST[b.kind];
  if ((K.flags & BF_HIDE) && b.state < 3) return 1;
  if ((K.flags & BF_TELEPORT) && b.state === 0) return 1;
  if ((K.flags & BF_INVIS) && b.state === 0) return 1;
  return 0;
}
function player_attack(b){
  const K = BEAST[b.kind];
  turn++;
  if (K.flags & BF_HEAL){ heal(HP_MAX); sound_say("jingle fairy"); say("The fairy.  Every heart is back."); return; }
  if (K.flags & BF_STUN){ stunned = 4; say("The Bubble goes through you, and your sword arm is nothing for a while."); return; }
  if (!sword_level()){ say("You have no sword.  There is a cave on the first screen."); return; }
  if (stunned > 0){ say("Your sword arm is still nothing.  " + stunned + " more turns."); return; }
  if (b.kind === BK_TRAP){ sound_say("blow clang"); say("The sword rings on the trap."); return; }
  const withw = cap(sword_name());
  sound_say("blow " + (sword_level() === 3 ? "magic" : sword_level() === 2 ? "white" : "wood"));
  if (beast_hidden(b) && !(K.flags & BF_INVIS)){ say("The sword goes through where " + K.name + " was."); return; }     /* Ganon unseen is still there to be hit */
  if ((K.flags & BF_PEAHAT) && b.state < 6){ sound_say("blow clang"); say("The Peahat is in the air, and the sword does nothing to it there."); return; }
  if ((K.flags & BF_FACE) && dir_toward(b.cell, cell) === b.dir){ sound_say("blow clang"); say("The blow rings on the " + (K.name.indexOf("Darknut") >= 0 ? "Darknut" : "beast") + "'s shield.  Not from the front."); return; }
  if ((K.flags & BF_DODONGO) && b.timer <= 0){ sound_say("blow clang"); say("The sword is nothing to Dodongo.  Dodongo dislikes smoke."); return; }
  if (K.flags & BF_EYE){ sound_say("blow clang"); say("The sword is nothing to Gohma.  Aim at the eye."); return; }
  if ((K.flags & BF_INVIS) && b.state === 2){ say("Ganon stands stunned.  The sword is done; now the silver arrow."); return; }
  const need = K.dodge;
  const r = roll(1, 20) + 5 + sword_level() * 2;
  if (r < need){ say("Link swings and misses " + K.name + "."); return; }
  let dmg = sword_dmg();
  if ((K.flags & BF_DODONGO) && b.timer > 0) dmg = 99;
  hit_being(b, dmg, withw);
}
/* a line from you in a direction: the cell of the first beast on it within `range`, or -1; stops at a wall */
function line_first(d, range){
  let c = cell;
  for (let i = 0; i < range; i++){
    c = step_cell(c, d);
    if (c < 0) return -1;
    const k = RS[room].c[c];

function beast_move_toward(b, target){

/* ── the screen ─────────────────────────────────────────────
 * hanb.c's board, cut to the fine hexagon: a cell is four characters by
 * two, which on the fine skin is eight pixels by five with the top and
 * bottom rows pointed.  The ground is sprinkled, a made thing stands
 * solid with a lit cap, a plant is grown, a beast is grown, and you are
 * three bands over all of it: the cap, the tunic, and the boots.  A
 * dark room shows you seven cells. */
const SHAPE_BRICK = 0, SHAPE_HEX = 1, SHAPE_FINE = 2, SHAPE_N = 3;
let tile_shape = SHAPE_FINE;

function you_px(gx, gy, gw, gh){
  const hexed = tile_shape !== SHAPE_BRICK;
  const top = (gh >= 4 && hexed) ? 1 : 0;
  const hd = (gh - top >= 4) ? 2 : 1;
  const rest = gh - top - hd;
  const lg = rest >= 2 ? Math.trunc(rest / 2) : rest;
  const sh = rest - lg;

  const band = gy < top + hd ? 0 : gy < top + hd + sh ? 1 : 2;
  let w = band === 0 ? Math.trunc(gw * 3 / 8) : band === 1 ? Math.trunc(gw * 3 / 4) : Math.trunc(gw / 2);
  if (w < 1) w = 1;
  const x = Math.trunc((gw - w) / 2);
  if (gx < x || gx >= x + w) return -1;

}
const WALL_CAPS = [103,110,68,152,114,150,110,152,110,145], WALL_BODY = [60,61,23,66,64,101,61,66,61,59];
/* the wall's colours of a room: [cap, body] */
function wall_colours(r){
  if (RS[r].kind === RK_DUNGEON){ const lv = RS[r].level; return [WALL_CAPS[lv], WALL_BODY[lv]]; }
  return [245, 238];
}
function put_pixel(fine, tx, gx, y, c){

function beast_drawn(b){ return b && !beast_hidden(b); }
function draw_cell(tx, ty, r, c, mark, lit){

  const t = k.thing;

  if (RS[r].kind === RK_DUNGEON && k.ground === G_FLOOR){ const wc = wall_colours(r); base = darker(wc[1]); acc = wc[1]; }
  if (t === T_TREE){ base = 22; acc = 28; sprinkle = 60; }
  const growing = t >= 0 && (THING[t].flags & TF_PLANT) && grow_tile(r, c, t, gw, gh);

  let beasting = 0;
  if (beast_drawn(b)){
    if (BEAST[b.kind].flags & BF_PLANT) beasting = grow_tile(1000, b.kind, b.kind === BK_MANHANDLA ? T_MANHANDLA : T_PEAHAT, gw, gh) ? 2 : 0;
    else beasting = beast_pixels(BEAST[b.kind].name, BEAST[b.kind].fg, gw, gh);
  }

  if (mark === 1) sprinkle = 0;

    let lo = 0, hi = gw;

    for (let gx = lo; gx < hi; gx++){
      const h = hash3u(tex, c >>> 0, (gy * 8 + gx) >>> 0);

      if (k.ground === G_WATER || k.ground === G_LAKE) col = (((gx + gy * 3 + Math.trunc(turn / 2)) & 7) === 0) ? acc : base;
      if (k.ground === G_BRIDGE) col = (gy & 1) ? 172 : 130;
      if (k.ground === G_CAVE || k.ground === G_DOORWAY) col = (gy === 0 || gy === gh - 1) ? 236 : 16;
      if (k.ground === G_DOOR) col = (gy === 0) ? 240 : (gx === lo || gx === hi - 1) ? 240 : 233;
      if (k.ground === G_STAIR) col = (gy & 1) ? 246 : 233;

        if (t === T_ROCK) col = ((h >>> 9) & 3) === 0 ? darker(body) : col;
        if (t === T_GRAVE) col = gy === 0 ? 253 : (gx === Math.trunc(gw / 2) || gx === Math.trunc(gw / 2) - 1) && gy < gh - 1 ? 33 : 250;
        if (t === T_ARMOS) col = gy === 0 ? 254 : gy === 1 ? 33 : gy === gh - 1 ? 240 : 250;
        if (t === T_SHUTTER) col = ((gx + gy) & 1) ? 240 : 236;
        if (t === T_LOCKEDDOOR) col = gy === Math.trunc(gh / 2) && gx === Math.trunc(gw / 2) ? 226 : ((gx === lo || gx === hi - 1) ? 178 : 137);
        if (t === T_FIRE) col = ((h >>> 9) & 3) === 0 ? 226 : ((h >>> 11) & 1) ? 202 : 196;

          const w = Math.trunc(gw / 2), x0 = Math.trunc((gw - w) / 2);

        }
        if (t === T_STATUE) col = gy === 0 ? 250 : gy === 1 && gx === Math.trunc(gw / 2) ? 196 : 244;
        if (t === T_BLOCK || t === T_PUSHBLOCK) col = gy === 0 ? cap : (gx === lo || gx === hi - 1 || gy === gh - 1) ? darker(body) : body;
      } else if (t >= 0 && (THING[t].flags & TF_TAKE)){
        /* a small thing on the floor, the size its letter says */
        let w = THING[t].size >= 'K' ? Math.trunc(gw / 2) : THING[t].size === 'J' ? Math.trunc(gw * 3 / 8) : Math.trunc(gw / 4);
        const hh = THING[t].size >= 'K' ? 3 : THING[t].size === 'J' ? 2 : 1;
        if (w < 2) w = 2;
        const x0 = Math.trunc((gw - w) / 2), yy0 = Math.trunc((gh - hh) / 2);
        if (gx >= x0 && gx < x0 + w && gy >= yy0 && gy < yy0 + hh) col = THING[t].fg;
      } else if (t === T_DOCK){
        col = (gy === Math.trunc(gh / 2)) ? 172 : (gy & 1) ? 130 : base;
      }
      if (bomb_room === r && bomb_cell === c && gx >= Math.trunc(gw / 2) - 1 && gx <= Math.trunc(gw / 2) && gy >= Math.trunc(gh / 2) - 1 && gy <= Math.trunc(gh / 2)) col = (turn & 1) ? 226 : 33;
      if (growing && grow_px[gy * GROW_MAXW + gx]) col = grow_px[gy * GROW_MAXW + gx];
      if (beasting === 2 && grow_px[gy * GROW_MAXW + gx]) col = grow_px[gy * GROW_MAXW + gx];
      if (beasting === 1 && bst_px[gy * BST_MAXW + gx]) col = bst_px[gy * BST_MAXW + gx];
      if (mark === 1){ const me = you_px(gx, gy, gw, gh); if (me >= 0) col = me; }
      if (!lit) col = (t === T_WALL && hex_dist(c, cell) <= 2) ? 233 : 16;
      else if (room_dark(r)) col = shade(col, 0.75);
      put_pixel(fine, tx, gx, y0 + gy, col);
    }
  }
}
function draw_board(){
  for (let c = 0; c < BOARD_SIZE; c++){
    const tx = 16 + 4 * COORD_Q[c] + 2 * COORD_R[c];

/* ── a page of text over everything ───────────────────────── */
function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){
      if (s[p + len] === ' ') last_space = len;
      len++;
    }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}

  for (let r = y; r < y + h; r++){ text(x, r, " ", 250, 240); text(x + w - 1, r, " ", 250, 240); }
  const lines = wrap_lines(body, w - 6, 64);

/* the framebuffer, hashed: what --keys prints, and what this must
 * print for the same keys */
function fb_hash(){
  let h = 2166136261 >>> 0;
  for (let row = 0; row < screen_h; row++)
    for (let col = 0; col < screen_w; col++){
      const at = FB(row, col);
      const ch = fb_ch[at] === FB_QUAD ? 1 : fb_ch[at];
      const q = fb_ch[at] === FB_QUAD ? (fb_q[at] & 15) : 0;
      const v = (fb_fg[at] | (fb_bg[at] << 8) | (q << 16) | (ch << 20)) >>> 0;
      h = Math.imul(h ^ v, 16777619) >>> 0;
      h = Math.imul(h ^ (v >>> 24), 16777619) >>> 0;
    }
  return h;
}

function dir_of_key(c){
  switch (c){
  case 'd': return 0; case 'x': return 1; case 'z': return 2;
  case 'a': return 3; case 'w': return 4; case 'e': return 5;
  default: return -1;
  }
}
function new_game(){

}
/* One key.  Returns 0 to quit. */
function handle_key(c){
  const quit = c === 'q' || c === '\x1b' || c === '\x03';
  if (show_intro){
    if (quit) return 0;
    show_intro = 0;
    say("Screen 7,7: " + REGION_NAME[region_of(screen)] + ".  There is a cave on this screen.");
    sound_bed = ""; sound_scene();
    return 1;
  }
  if (dead || won){
    if (c === 'n'){ new_game(); show_intro = 0; sound_bed = ""; sound_scene(); return 1; }
    if (c === 'L' && dead){ if (!load_game()) say("There is no saved game."); return 1; }
    if (c === 'c' && dead){ continue_game(); return 1; }
    if (quit) return 0;
    return 1;
  }
  if (show_story){ show_story = 0; sound_scene(); return 1; }
  if (show_keys){ show_keys = 0; return 1; }
  if (show_map){ show_map = 0; return 1; }
  if (show_items){
    const list = bitem_list();
    if (c >= '1' && c <= '9' && c.charCodeAt(0) - 49 < list.length){ bitem = list[c.charCodeAt(0) - 49]; say("B: " + THING[bitem].name + "."); show_items = 0; return 1; }
    if (c === 'q') return 0;
    show_items = 0; return 1;
  }
  if (ask_dir){
    const d = dir_of_key(c);
    const what = ask_dir;
    ask_dir = 0;
    if (d < 0){ say("Never mind."); return 1; }
    if (what === 'f') sword_beam(d);
    else use_item(d);
    return 1;
  }
  if (show_look){
    if (c === 'c'){ show_look = (show_look + 1) % 4; return 1; }
    if (c === 'q') return 0;
    show_look = 0;
    return 1;
  }
  const d = dir_of_key(c);
  if (d >= 0){ move_dir(d); return 1; }
  switch (c){
  case '.': case 's': wait_turn(); break;
  case 'f': ask_dir = 'f'; break;
  case 't': if (bitem < 0) say("You have nothing for the B button.  i chooses one."); else if (item_needs_dir(bitem)) ask_dir = 't'; else use_item(-1); break;
  case 'i': show_items = 1; break;
  case 'm': show_map = 1; break;
  case 'c': show_look = 1; break;
  case 'S': say(save_game() ? "Saved." : "It would not save."); break;
  case 'L': say(load_game() ? "Loaded." : "There is no saved game."); break;
  case 'T': tile_shape = (tile_shape + 1) % SHAPE_N; say(SHAPE_NAME[tile_shape] + " tiles."); break;
  case '?': show_keys = 1; break;
  case 'q': case '\x1b': case '\x03': case '\x04': return 0;
  default: break;
  }
  return 1;
}

/* ── checks ─────────────────────────────────────────────────
 * --keys plays a string of keys with no screen and prints where they

function check_keys(seedText, keys_in){
  const out = [];

  show_intro = 0;
  for (let i = 0; i < keys_in.length; i++){
    let c = keys_in[i];
    if (c === '\\' && i + 1 < keys_in.length){ i++; if (keys_in[i] === 'n'){ handle_key('\n'); continue; } c = keys_in[i]; }
    if (!handle_key(c)) break;

/* what --keys prints about where the keys left you */
function keys_report(out){
  out.push("room " + room + "  cell " + cell + "  hearts " + hp + "/" + max_hp + "  turn " + turn + "  " + (dead ? "DEAD: " : won ? "WON" : "") + (dead ? dead_how : ""));
  out.push("rupees " + rupees + " keys " + keys + " bombs " + bombs + " triforce " + triforce + " deaths " + deaths + " level " + level + " screen " + (screen % 16) + "," + Math.trunc(screen / 16) + " B " + bitem);
  out.push("last: " + message[0]);
  out.push("      " + message[1]);
  for (let i = 0; i < being_n; i++){ const b = beings[i]; if (b.alive && b.room === room) out.push("here: " + BEAST[b.kind].name + " at " + b.cell + " hp " + b.hp); }

  compose_screen();

/* the same, along one long string of keys: the report at each of the
 * marks (indices into the keys), as --keys would print it for that
 * prefix, from one pass instead of a pass a prefix */
function check_trail(seedText, keys_in, marks){
  const out = [];
  start_game(seedText, 1);
  show_intro = 0;
  let mi = 0, stopped = 0;
  for (let i = 0; i < keys_in.length && !stopped; i++){
    while (mi < marks.length && marks[mi] <= i){ const rep = []; keys_report(rep); out.push(rep); mi++; }
    if (!handle_key(keys_in[i])) stopped = 1;
    if (won) stopped = 1;
  }
  while (mi < marks.length){ const rep = []; keys_report(rep); out.push(rep); mi++; }
  return out;
}

        else if (tok === "bombs"){ if (bombs < bomb_max) take_thing(T_BOMBS, "the bombs"); }
        else if (tok === "rupees"){ take_thing(T_RUPEES10, "ten rupees"); }
        else if (tok.startsWith("item:")){ const t = parseInt(tok.slice(5), 10); if (!has[t]) take_thing(t, THING[t].name); }
        else if (tok === "push") wpush();
        else if (tok === "stair"){ clear_room(); wstair(); }
        else if (tok === "boss") wboss();
        else if (tok === "tri"){ take_thing(T_TRIFORCE, "the piece of the Triforce"); wexpect(!level, "out of the labyrinth"); }
        else if (tok === "bait"){ const g = find_kind(BK_HUNGRY); if (g){ clear_room(); const best = beside(g.cell); if (best < 0) wfail("cannot reach the Goriya"); goto_cell(best, "the hungry Goriya"); wselect(T_BAIT); wk('t'); } }
        else if (tok === "potion") wpotion_if_low();
        else if (tok.startsWith("up:")){
          const side = tok[3] === 'N' ? 0 : tok[3] === 'E' ? 1 : tok[3] === 'S' ? 2 : 3;
          if (rupees >= 120 && bomb_max < 16 && bombs > 0){ wdoor(side); take_thing(T_BOMBUP, "the bomb bag"); wdoor((side + 2) % 4); }
        }
        else if (tok === "zelda"){
          let guard = 0;
          while (!won && guard++ < 20){
            const f = find_thing(T_FIRE);
            if (f < 0) wfail("no fire round Zelda");
            const best = beside(f);
            if (best < 0) wfail("cannot reach the fires");
            goto_cell(best, "beside the fire");
            wk(DIRKEY[dir_toward(cell, f)]);
          }
        }
        else wfail("unknown route token " + tok);
      }
      in_route = 0;
      return;
    } catch (e){
      if (!(e instanceof RouteRestart)) throw e;
      /* the C's setjmp(route_jb) took: the token in hand is done again */
      if (++again > 30) wfail("the route restarted too often");
      walk_out.push("       (the route again from room " + String.fromCharCode(78 + tgx) + (tgy + 1) + ", after " + (e.why === 2 ? "the Wallmaster" : "a death") + ")");
      goto_until = null; goto_failed = 0; walk_hurt = 0; clearing = 0; healing = 0; walk_shy = 0;
      in_route = 0;
      if (!level) wfail("outside the labyrinth after a death");
      if (hp * 2 < max_hp && potion_doses === 0 && max_hp >= 8) wretreat(tgx, tgy);
      else wgoto_room(tgx, tgy);
    }
  }
}

/* ── the stages of the quest ── */
const lvl_done = new Int8Array(10);
/* the hearts back: the potion, or the nearest fairy if she is not far */
function wheal(){ if (hp >= max_hp - 1 || healing) return; healing = 1; wheal_(); healing = 0; }
const FAIRY = [[9, 3], [3, 4]];
const HEARTSHOP = [[6, 4], [13, 4], [6, 2], [2, 1]];
function wheal_(){
  if (potion_doses > 0){ wselect(has[T_REDPOTION] ? T_REDPOTION : T_POTION); wk('t'); return; }
  if (level) return;
  let best = -1, bd = 99;
  const x = screen % 16, y = Math.trunc(screen / 16);
  for (let i = 0; i < 2; i++){ const d = Math.abs(FAIRY[i][0] - x) + Math.abs(FAIRY[i][1] - y); if (d < bd){ bd = d; best = i; } }
  /* a hidden shop that is found, and sells hearts for ten: nearer than the fairy, and the purse full enough */
  let shop = -1, sd = 99;
  for (let i = 0; i < 4; i++){
    let si = -1;
    for (let k = 0; k < SECRET_N; k++) if (SECRET[k].x === HEARTSHOP[i][0] && SECRET[k].y === HEARTSHOP[i][1] && SECRET[k].kind === CV_SHOP_C) si = k;
    if (si < 0 || !sec_found[si]) continue;
    const d = Math.abs(HEARTSHOP[i][0] - x) + Math.abs(HEARTSHOP[i][1] - y);
    if (d < sd){ sd = d; shop = i; }
  }
  if (shop >= 0 && sd <= 5 && rupees >= 10 * Math.trunc((max_hp - hp) / 2) && sd <= bd){
    wgo(HEARTSHOP[shop][0], HEARTSHOP[shop][1]);
    wenter_cave();
    const c = find_thing(T_HEART);
    for (let guard = 0; guard < 16 && hp < max_hp && rupees >= 10 && c >= 0; guard++){ step_off(c); goto_cell(c, "a heart for ten"); }
    wleave_cave();
    return;
  }
  if (best < 0 || bd > 7) return;
  { const fi = screen_secret(SCREEN(FAIRY[best][0], FAIRY[best][1]), SH_FAIRY); wgo_near(FAIRY[best][0], FAIRY[best][1], fi >= 0 ? sec_cell[fi] : -1); }
  const f = find_kind(BK_FAIRY);
  let guard = 0;
  while (f && hp < max_hp && guard++ < 80){
    if (hex_dist(cell, f.cell) <= 1){ wk(DIRKEY[dir_toward(cell, f.cell)]); continue; }
    const b2 = beside(f.cell);
    if (b2 < 0){ wk('.'); continue; }
    bfs(b2, 1);
    const m = first_move(b2);
    if (m < 0){ wk('.'); continue; }
    wk(DIRKEY[m]);
  }
}
function wmedicine(){
  if (level || !has[T_LETTER] || potion_doses > 0) return;
  let best = -1, bd = 99;
  const x = screen % 16, y = Math.trunc(screen / 16);
  for (let i = 0; i < SECRET_N; i++){
    if (SECRET[i].kind !== CV_MEDICINE || !sec_found[i]) continue;
    const d = Math.abs(SECRET[i].x - x) + Math.abs(SECRET[i].y - y);
    if (d < bd){ bd = d; best = i; }
  }
  if (best < 0) return;
  wcave(SECRET[best].x, SECRET[best].y, SECRET[best].how, T_REDPOTION);
  wexpect(potion_doses === 2, "the red potion");
}
function wlevel(lv){
  if (lvl_done[lv]) return;
  const route = ROUTE[lv].replace("%d", String(lv === 1 ? T_BOOMERANG : lv === 2 ? T_MAGICBOOMERANG : 0));
  let li = -1;
  for (let i = 0; i < SECRET_N; i++) if (SECRET[i].kind === CV_LEVEL && SECRET[i].arg === lv) li = i;
  wexpect(li >= 0, "the level's entrance");
  wstage("level " + lv + ", " + LEVEL[lv].name);
  if (!level){
    wmedicine();
    wheal();
    wgo_near(SECRET[li].x, SECRET[li].y, sec_cell[li]);
    if (!sec_found[li]) wsecret(li);
    wenter_cave();
  }
  wexpect(level === lv, "being in the level");
  /* after a death: three hearts at the entrance; out for the rest of them first */
  if (hp * 2 < max_hp && potion_doses === 0 && max_hp >= 8) wretreat(LEVEL[lv].egx, LEVEL[lv].egy);
  wpotion_if_low();
  wroute(route);
  if (lv < 9){ wexpect(!level, "out of the labyrinth with the piece"); lvl_done[lv] = 1; wstory(); }
}
function wbombs(n){
  if (level || bombs >= n || bombs >= bomb_max) return;
  for (let k = 0; k < 3 && bombs < n && bombs < bomb_max; k++) wbuy(10, 4, T_BOMBS);
}
function stage_sword(){ wstage("the wooden sword"); wcave(7, 7, SH_OPEN, T_WOODSWORD); wexpect(has[T_WOODSWORD], "the sword"); }
function stage_candle(){ wstage("sixty rupees, and the blue candle"); if (!has[T_BLUECANDLE]){ wgo(7, 7); wgrind(60); wbuy(6, 6, T_BLUECANDLE); } }
function stage_burn1(){ wstage("the trees near home"); wcave(6, 5, SH_BURN, -1); wcave(6, 4, SH_BURN, T_HEART); wcave(7, 4, SH_BURN, -1); }
function stage_l1(){ wlevel(1); }
function stage_money2(){ wstage("the money in the trees"); wcave(8, 2, SH_BURN, -1); wcave(8, 4, SH_BURN, -1); wcave(11, 5, SH_BURN, -1); wcave(11, 6, SH_BURN, -1); }
function stage_bombs(){ wstage("bombs"); wbombs(8); wcave(13, 4, SH_BURN, T_HEART); wcave(13, 2, SH_BOMB, -1); wcave(12, 2, SH_BOMB, -1); wcave(11, 7, SH_BOMB, -1); wbombs(8); }
function stage_l2(){ wlevel(2); }
function stage_arrows(){ wstage("arrows"); wbuy(10, 4, T_ARROWS); wbombs(8); }
function stage_l3(){ if (!level && rupees >= 250 && !has[T_BLUERING]) wcave(4, 3, SH_ARMOS, T_BLUERING); wlevel(3); }
function stage_raft(){ wstage("the raft: the heart on the island"); wcave(15, 2, SH_OPEN, -1); }
function stage_l4(){ wlevel(4); }
function stage_ladder(){ wstage("the ladder: the heart on the far dock"); if (!has[T_LADDER]) wfail("no ladder"); wgo(15, 5); { const c = row_last(0); if (RS[room].c[c].thing === T_HEARTCONTAINER) goto_cell(c, "the far dock"); } }
function stage_white(){ if (has[T_WHITESWORD] || max_hp < 10) return; wstage("the white sword, up the Lost Hills"); wcave(10, 0, SH_OPEN, T_WHITESWORD); wexpect(has[T_WHITESWORD], "the white sword"); }
function stage_letter(){ wstage("the letter, and the eastmost peninsula"); wcave(14, 0, SH_OPEN, T_LETTER); wcave(15, 0, SH_OPEN, -1); }
function stage_money3(){ if (level) return; wstage("the money in the west"); wcave(7, 6, SH_BOMB, -1); wcave(2, 6, SH_BURN, -1); wcave(1, 7, SH_BOMB, -1); wcave(3, 1, SH_BOMB, -1); wcave(1, 5, SH_BURN, -1); wbombs(8); }
function stage_ring(){ if (level || has[T_BLUERING]) return; wstage("the blue ring"); if (rupees < 250) wgrind(250); wcave(4, 3, SH_ARMOS, T_BLUERING); wexpect(has[T_BLUERING], "the blue ring"); }
function stage_l5(){ wbombs(8); wlevel(5); }
function stage_potion(){ wstage("medicine"); wcave(13, 0, SH_BOMB, T_REDPOTION); wcave(13, 3, SH_ARMOS, -1); wbombs(8); }
function stage_bait(){ wstage("bait"); wcave(13, 4, SH_BURN, T_BAIT); wbombs(8); }
function stage_l6(){ if (!level && rupees >= 250 && !has[T_BLUERING]) wcave(4, 3, SH_ARMOS, T_BLUERING); wlevel(6); }
function stage_l7(){ wbombs(8); wlevel(7); }
function stage_l8(){ wbombs(8); wlevel(8); }
function stage_magic(){ if (level || has[T_MAGICSWORD] || max_hp < 24) return; wstage("the magical sword, under the tombstone"); wcave(1, 2, SH_PUSH, T_MAGICSWORD); }
function stage_bracelet(){ wstage("the power bracelet"); wcave(4, 2, SH_ARMOS, T_BRACELET); }
function stage_l9(){ wbombs(8); wlevel(9); wexpect(won, "Zelda freed"); }
const STAGES = [
  stage_sword, stage_candle, stage_burn1, stage_l1, stage_money2, stage_bombs, stage_l2, stage_arrows,
  stage_white, stage_letter, stage_potion, stage_l3,
  stage_raft, stage_l4, stage_ladder, stage_white, stage_money3, stage_ring, stage_l5, stage_magic, stage_bait, stage_l6, stage_l7, stage_l8,
  stage_magic, stage_bracelet, stage_l9,
];
const STAGE_N = STAGES.length;
function check_walk(seedText, trace){
  walk_out = []; walk_keys = 0; walk_keystring = ""; walk_seen = ["", ""]; walk_trace = trace ? 1 : 0;
  walk_stage = 0; walk_restarts = 0; walk_in_stage = 0; in_route = 0; clearing = 0; healing = 0;
  walk_hurt = 0; walk_shy = 0; goto_until = null; goto_failed = 0; wgo_cell = -1; wgo_rad = 1; wsite = ""; grabbed = 0;
  start_game(seedText, 1);
  show_intro = 0;
  lvl_done.fill(0);
  try {
    for (walk_stage = 0; walk_stage < STAGE_N; walk_stage++){
      for (;;){
        try {
          walk_in_stage = 1;
          if (!level && hp * 3 <= max_hp * 2) wheal();
          STAGES[walk_stage]();
          walk_in_stage = 0;
          break;
        } catch (e){
          if (!(e instanceof StageRestart)) throw e;
          /* the C's setjmp(stage_jb) took: the stage again */
          walk_restarts++;
          if (walk_restarts > 40) wfail("too many restarts");
          walk_out.push("       (stage " + walk_stage + " again, after " + (e.why === 2 ? "the Wallmaster" : "a death") + ")");
          goto_until = null; goto_failed = 0; walk_hurt = 0; clearing = 0; healing = 0; walk_shy = 0;
        }
      }
    }
  } catch (e){
    if (!(e instanceof WalkFail)) throw e;
    walk_out.push("keys " + walk_keys + "  deaths " + deaths);
    if (walk_trace) walk_out.push("keys " + walk_keystring);
    return 1;
  }
  walk_out.push("");
  walk_out.push("WALK OK: " + walk_keys + " keys, " + turn + " turns, " + deaths + " deaths, " + Math.trunc(max_hp / 2) + " hearts, " + rupees + " rupees; Zelda is free");
  if (walk_trace) walk_out.push("keys " + walk_keystring);
  return 0;
}

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same 2A03 and played
 * as a buffer; the tune loops until the next one. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("hyrule.sav"),
  set: (s) => localStorage.setItem("hyrule.sav", s),
};
start_game(params.get("seed"), 0);
if (SOUND.on) SOUND.command("bed title");
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left Hyrule.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: arrows are w x d a as in hyrulelegend.c, Escape
 * is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return 'w';
  if (e.key === "ArrowDown") return 'x';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
