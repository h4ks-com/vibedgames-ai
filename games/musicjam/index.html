<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>musicjam</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #080808; --panel: #151515; --panel-2: #1c1c1c; --line: #2a2a2a; --text: #f0f0f0; --muted: #8a8a8a; --accent: #3bb8f2; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  .wrap { width: min(1100px, 100%); margin: 0 auto; padding: 20px 16px 140px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 18px; }
  h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); line-height: 1; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
  input[type=search] { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 12px; width: min(320px, 100%); font: inherit; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); gap: 20px; align-items: start; }
  .info { display: none; }
  .close { display: none; float: right; background: none; border: 0; color: var(--muted); font-size: 1.4rem; cursor: pointer; padding: 0 4px; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--panel-2); }
  .row.active { background: rgba(59, 184, 242, 0.12); }
  .row .n { color: var(--muted); font-size: 0.8rem; text-align: right; }
  .row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .p { color: var(--muted); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .d { color: var(--muted); font-size: 0.8rem; }
  .detail { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; position: sticky; top: 16px; }
  .detail h2 { font-size: 1.25rem; margin-bottom: 6px; }
  .detail .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
  .detail .prompt { font-style: italic; margin-bottom: 12px; line-height: 1.4; }
  .detail .text { color: #cfcfcf; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; max-height: 42vh; overflow-y: auto; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .links a { color: var(--bg); background: var(--accent); padding: 7px 11px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
  .links a.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .detail video[hidden] { display: none; }
  .detail video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; margin-bottom: 12px; cursor: pointer; }
  .row .tag { color: var(--accent); font-size: 0.7rem; border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: #0f0f0f; border-top: 1px solid var(--line); padding: 10px 16px; }
  .bar .in { width: min(1100px, 100%); margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
  .controls { display: flex; gap: 6px; }
  .controls button { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1rem; }
  .controls button.on { color: var(--accent); border-color: var(--accent); }
  .now { min-width: 0; }
  .now .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .seek { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  .track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; cursor: pointer; position: relative; }
  .track div { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; width: 0; }
  /* On phones the list fills the screen and the song's details open as a sheet from the player bar. */
  @media (max-width: 820px) {
    .wrap { padding: 14px 12px calc(150px + env(safe-area-inset-bottom)); }
    header { flex-direction: column; align-items: stretch; }
    input[type=search] { width: 100%; font-size: 16px; }
    .grid { grid-template-columns: 1fr; }
    .detail { display: none; }
    .detail.open { display: block; position: fixed; inset: auto 0 calc(118px + env(safe-area-inset-bottom)) 0; top: 12vh;
      border-radius: 16px 16px 0 0; overflow-y: auto; z-index: 5; box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.6); }
    .detail .text { max-height: none; }
    .row { grid-template-columns: minmax(0, 1fr) auto; padding: 13px 12px; }
    .row .n { display: none; }
    .controls button { width: 44px; height: 44px; }
    .bar { padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
    .now { cursor: pointer; }
    .close { display: inline-block; }
    .info { display: inline-block; }
    .controls { gap: 4px; }
    .row .p { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .row .t { font-weight: 600; }
    .bar .in { grid-template-columns: 1fr; gap: 6px; }
    .controls { justify-content: center; order: 2; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span>♪</span> musicjam</h1>
      <p class="sub">Every song made by the musicjam job on <a href="https://workflows.h4ks.com" style="color:var(--accent)">workflows.h4ks.com</a>.</p>
    </div>
    <input type="search" id="q" placeholder="Search titles">
  </header>
  <div class="grid">
    <div class="list" id="list"><p class="empty">Loading songs…</p></div>
    <aside class="detail" id="detail"><p class="empty">Pick a song to play it.</p></aside>
  </div>
</div>
<div class="bar">
  <div class="in">
    <div class="controls">
      <button id="prev" title="Play previous song">⏮</button>
      <button id="play" title="Play or pause">▶</button>
      <button id="next" title="Play next song">⏭</button>
      <button id="shuffle" title="Turn shuffle on or off">⤨</button>
      <button id="info" class="info" title="Show the song's details">ⓘ</button>
    </div>
    <div class="now">
      <div class="t" id="nowTitle" title="Show the song's details">Nothing playing</div>
      <div class="seek"><span id="cur">0:00</span><div class="track" id="seek"><div id="fill"></div></div><span id="dur">0:00</span></div>
    </div>
  </div>
</div>
<audio id="audio" preload="none"></audio>
<script>
  // Songs are public objects in the workflows bucket, found with one listing: each musicjam/<day>/<slug>-<time>.mp3 has a .json beside it,
  // and its project zip lives at <slug>-project-<time>.zip with its own .json. A song made with a video also has
  // <slug>-video-<time>.mp4, stored a little later, which plays muted in step with the player. A song made with karaoke
  // has <slug>-karaoke-<time>.mp4, which carries its own backing track and plays on its own.
  const S3 = "https://s3-api.t3ks.com/workflows/";
  const PREFIX = "musicjam/";
  const $ = (id) => document.getElementById(id);
  const audio = $("audio");
  let songs = [], shown = [], current = -1, shuffle = false;
  const modified = {};

  const esc = (text) => { const node = document.createElement("div"); node.textContent = text == null ? "" : String(text); return node.innerHTML; };
  const clock = (seconds) => { seconds = Math.max(0, Math.round(seconds || 0)); return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0"); };

  async function listKeys() {
    const keys = [];
    let token = null;
    do {
      const url = S3 + "?list-type=2&prefix=" + encodeURIComponent(PREFIX) + (token ? "&continuation-token=" + encodeURIComponent(token) : "");
      const xml = new DOMParser().parseFromString(await (await fetch(url)).text(), "application/xml");
      for (const node of xml.getElementsByTagName("Contents")) {
        const key = node.getElementsByTagName("Key")[0].textContent;
        keys.push(key);
        modified[key] = node.getElementsByTagName("LastModified")[0].textContent;
      }
      const next = xml.getElementsByTagName("NextContinuationToken")[0];
      token = next ? next.textContent : null;
    } while (token);
    return keys;
  }

  async function load() {
    const keys = await listKeys();
    const all = new Set(keys);
    const songKeys = keys.filter((key) => key.endsWith(".mp3") && !key.startsWith(PREFIX + "spike/"));
    const results = songKeys.map((key) => {
      const projectKey = key.replace(/-(\d{6})\.mp3$/, "-project-$1");
      const project = [".zip", ".erk"].map((ext) => projectKey + ext).find((candidate) => all.has(candidate));
      const videoPrefix = key.replace(/-\d{6}\.mp3$/, "-video-");
      const video = keys.find((candidate) => candidate.startsWith(videoPrefix) && /-video-\d{6}\.mp4$/.test(candidate));
      const karaokePrefix = key.replace(/-\d{6}\.mp3$/, "-karaoke-");
      const karaoke = keys.find((candidate) => candidate.startsWith(karaokePrefix) && /-karaoke-\d{6}\.mp4$/.test(candidate));
      const meta = key.replace(/\.mp3$/, ".json");
      const name = key.split("/").pop().replace(/-\d{6}\.mp3$/, "").replace(/-/g, " ");
      return { key, url: S3 + key, title: name.charAt(0).toUpperCase() + name.slice(1), prompt: "", details: "", seconds: 0,
        created: modified[key] || key.split("/")[1] || "", project: project ? S3 + project : null, video: video ? S3 + video : null, karaoke: karaoke ? S3 + karaoke : null,
        meta: all.has(meta) ? S3 + meta : null, projectMeta: all.has(projectKey + ".json") ? S3 + projectKey + ".json" : null };
    });
    songs = results.sort((a, b) => String(b.created).localeCompare(String(a.created)));
    filter();
    const wanted = location.hash.slice(1);
    const fromHash = shown.findIndex((song) => song.key === decodeURIComponent(wanted));
    if (fromHash >= 0) select(fromHash, false);
  }

  function filter() {
    const query = $("q").value.trim().toLowerCase();
    shown = songs.filter((song) => !query || (song.title + " " + song.prompt + " " + song.details).toLowerCase().includes(query));
    render();
  }

  function render() {
    if (!shown.length) { $("list").innerHTML = '<p class="empty">No songs match.</p>'; return; }
    $("list").innerHTML = shown.map((song, index) => `<div class="row${shown[index] === songs[current] ? " active" : ""}" data-i="${index}">
      <span class="n">${index + 1}</span><div style="min-width:0"><div class="t">${esc(song.title)}${song.video ? '<span class="tag">video</span>' : ""}${song.karaoke ? '<span class="tag">karaoke</span>' : ""}</div><div class="p">${esc(song.prompt)}</div></div>
      <span class="d">${song.seconds ? clock(song.seconds) : ""}</span></div>`).join("");
    for (const row of $("list").querySelectorAll(".row")) row.onclick = () => select(Number(row.dataset.i), true);
  }

  // A song's prompt, details and viewer link come from the JSON files beside it, fetched only when it is opened: a
  // visitor that fetched every song's files at once looked like a crawler to the bucket's firewall and got banned.
  async function describe(song) {
    if (!song.described) {
      const meta = song.meta ? await fetch(song.meta).then((r) => r.json()).catch(() => ({})) : {};
      const projectMeta = song.projectMeta ? await fetch(song.projectMeta).then((r) => r.json()).catch(() => ({})) : {};
      const match = String(projectMeta.details || "").match(/https:\/\/emerick\.t3ks\.com\/projects\/[^\s"]+/);
      Object.assign(song, { title: meta.title || song.title, prompt: meta.prompt || "", details: meta.details || "",
        seconds: meta.seconds || song.seconds, viewer: match ? match[0] : null, described: true });
    }
    if (songs[current] !== song) return;
    $("nowTitle").textContent = song.title;
    $("songTitle").textContent = song.title;
    $("meta").textContent = String(song.created).slice(0, 16).replace("T", " ") + (song.seconds ? " · " + clock(song.seconds) : "");
    $("prompt").textContent = song.prompt ? `“${song.prompt}”` : "";
    $("text").textContent = song.details;
    $("viewer").innerHTML = song.viewer ? `<a href="${esc(song.viewer)}" target="_blank" rel="noopener">Open in Emerick</a>` : "";
    render();
  }

  function select(index, play) {
    const song = shown[index];
    if (!song) return;
    current = songs.indexOf(song);
    history.replaceState(null, "", "#" + encodeURIComponent(song.key));
    audio.src = song.url;
    $("nowTitle").textContent = song.title;
    $("detail").innerHTML = `<button class="close" id="close" title="Close the details">✕</button><h2 id="songTitle">${esc(song.title)}</h2>
      <p class="meta" id="meta"></p>
      ${song.video ? `<video id="video" src="${esc(song.video)}" muted playsinline preload="metadata" title="Play or pause"></video>` : ""}
      ${song.karaoke ? `<video id="karaoke" src="${esc(song.karaoke)}" controls playsinline preload="none" hidden></video>` : ""}
      <p class="prompt" id="prompt"></p>
      <div class="links">
        ${song.karaoke ? `<a href="#" id="singAlong">Sing along</a>` : ""}
        <span id="viewer"></span>
        ${song.project ? `<a class="ghost" href="${esc(song.project)}">Download project</a>` : ""}
        <a class="ghost" href="${esc(song.url)}" download>Download MP3</a>
        ${song.video ? `<a class="ghost" href="${esc(song.video)}" download>Download video</a>` : ""}
        ${song.karaoke ? `<a class="ghost" href="${esc(song.karaoke)}" download>Download karaoke</a>` : ""}
      </div>
      <p class="text" id="text"></p>`;
    $("close").onclick = () => $("detail").classList.remove("open");
    if ($("video")) $("video").onclick = () => $("play").click();
    // The karaoke video has its own sound, so it takes the place of the song while it plays.
    if ($("singAlong")) $("singAlong").onclick = (event) => {
      event.preventDefault();
      audio.pause();
      if ($("video")) $("video").hidden = true;
      $("karaoke").hidden = false;
      $("karaoke").play();
    };
    if ($("karaoke")) $("karaoke").onplay = () => audio.pause();
    render();
    if (play) audio.play();
    describe(song);
  }

  function step(direction) {
    if (!shown.length) return;
    const at = shown.indexOf(songs[current]);
    const index = shuffle ? Math.floor(Math.random() * shown.length) : (at + direction + shown.length) % shown.length;
    select(index, true);
  }

  $("q").oninput = filter;
  const toggleDetail = () => { if (current >= 0) $("detail").classList.toggle("open"); };
  $("nowTitle").onclick = toggleDetail;
  $("info").onclick = toggleDetail;
  $("play").onclick = () => { if (current < 0) select(0, true); else if (audio.paused) audio.play(); else audio.pause(); };
  $("next").onclick = () => step(1);
  $("prev").onclick = () => step(-1);
  $("shuffle").onclick = () => { shuffle = !shuffle; $("shuffle").classList.toggle("on", shuffle); };
  $("seek").onclick = (event) => { const box = $("seek").getBoundingClientRect(); if (audio.duration) audio.currentTime = ((event.clientX - box.left) / box.width) * audio.duration; };
  // The audio element leads and the video follows it, so the player bar, seeking and shuffle work the same with or without one.
  const follow = () => {
    const video = $("video");
    if (!video) return;
    if (Math.abs(video.currentTime - audio.currentTime) > 0.25) video.currentTime = audio.currentTime;
    if (audio.paused !== video.paused) audio.paused ? video.pause() : video.play().catch(() => {});
  };
  audio.onplay = () => { $("play").textContent = "⏸"; if ($("karaoke")) $("karaoke").pause(); follow(); };
  audio.onpause = () => { $("play").textContent = "▶"; follow(); };
  audio.onseeked = follow;
  audio.onended = () => step(1);
  audio.ontimeupdate = () => { $("cur").textContent = clock(audio.currentTime); $("dur").textContent = clock(audio.duration); $("fill").style.width = (audio.duration ? (audio.currentTime / audio.duration) * 100 : 0) + "%"; follow(); };
  load().catch((error) => { $("list").innerHTML = `<p class="empty">Could not list the songs: ${esc(error.message)}</p>`; });
</script>
</body>
</html>
