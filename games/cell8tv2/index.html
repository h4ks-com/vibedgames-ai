<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>CELL-8 3x3 TV Grid</title>
<style>
body{margin:0;background:#050805;color:#9f9;font-family:monospace;display:flex;flex-direction:column;align-items:center}
h3{margin:8px}
#status{font-size:13px;color:#7c7}
#tv{display:grid;grid-template-columns:repeat(3,270px);gap:10px;margin:8px}
.screen{position:relative;background:#000;border:6px solid #222;border-radius:14px;padding:4px;box-shadow:0 0 14px #040;transition:border-color .3s}
.screen.new{border-color:#ff4}
.label{font-size:11px;display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
canvas{width:100%;height:auto;image-rendering:pixelated;display:block;background:#000}
.scan{position:absolute;left:10px;right:10px;top:26px;bottom:10px;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
#board{width:860px;font-size:12px;white-space:pre;color:#8c8;background:#0a0f0a;padding:6px;border:1px solid #232}
#log{width:860px;font-size:11px;white-space:pre;color:#aa6;background:#0a0a06;padding:6px;border:1px solid #223;margin-top:6px}
</style></head><body>
<h3>CELL-8 · 3×3 TV GRID · autorank by class-4 heuristic</h3>
<div id="status"></div>
<div id="tv"></div>
<pre id="board"></pre>
<pre id="log"></pre>
<script>
const W=64,H=48,N=W*H,SCREENS=9,WARM=200,WIN=200,EVOLVE_MS=15000,STEPS=2;
const MSG="HELLO CELL8 ";
const bits=[];
for(const ch of MSG){const c=ch.charCodeAt(0);for(let b=7;b>=0;b--)bits.push((c>>b)&1);}
let inputPos=0,ticks=0;
const logLines=[];
function log(m){logLines.unshift(new Date().toLocaleTimeString()+"  "+m);if(logLines.length>6)logLines.pop();}

function randGenome(){const g=new Uint8Array(28);for(let i=0;i<28;i++)g[i]=Math.random()<0.5?1:0;return g;}

// Hex neighbourhood (odd-r offset layout), toroidal wrap
const DIRS_EVEN=[[-1,0],[1,0],[0,-1],[-1,-1],[0,1],[-1,1]];
const DIRS_ODD=[[-1,0],[1,0],[0,-1],[1,-1],[0,1],[1,1]];
const NB=new Int32Array(N*6);
for(let r=0;r<H;r++)for(let c=0;c<W;c++){
  const d=(r&1)?DIRS_ODD:DIRS_EVEN;
  for(let k=0;k<6;k++){
    const rr=(r+d[k][1]+H)%H, cc=(c+d[k][0]+W)%W;
    NB[(r*W+c)*6+k]=rr*W+cc;
  }
}

function hash(a){let h=0x811c9dc5;for(let k=0;k<a.length;k++){h^=a[k];h=Math.imul(h,0x01000193);}return h>>>0;}

const tv=document.getElementById('tv');
const screens=[];
for(let i=0;i<SCREENS;i++){
  const wrap=document.createElement('div');
  wrap.className='screen';
  wrap.innerHTML='<div class="label"><span class="a"></span><span class="b"></span></div><canvas></canvas><div class="scan"></div>';
  tv.appendChild(wrap);
  const canvas=wrap.querySelector('canvas');
  canvas.width=W*4;canvas.height=H*4;
  const s={i,el:wrap,la:wrap.querySelector('.a'),lb:wrap.querySelector('.b'),ctx:canvas.getContext('2d'),
    g:randGenome(),cur:new Uint8Array(N),next:new Uint8Array(N),hist:[],act:[],age:0,
    score:null,stats:null,rank:0,flash:0,origin:'initial'};
  randomize(s);
  screens.push(s);
}

function randomize(s){
  for(let k=0;k<N;k++)s.cur[k]=Math.random()<0.3?1:0;
  s.hist=[];s.act=[];s.age=0;s.score=null;s.stats=null;
}

// One CA step. Genome index = self*14 + neighbourCount*2 + wildcard (2*7*2 = 28 bits).
// Row 0 receives the streamed input bit as its wildcard; other rows get 0.
function stepScreen(s,inBit){
  const cur=s.cur,next=s.next,g=s.g;
  let changed=0;
  for(let idx=0;idx<N;idx++){
    let n=0;const base=idx*6;
    for(let k=0;k<6;k++)n+=cur[NB[base+k]];
    const wild=idx<W?inBit:0;
    const v=g[cur[idx]*14+n*2+wild];
    next[idx]=v;
    if(v!==cur[idx])changed++;
  }
  s.act.push(changed/N);
  s.hist.push(hash(next));
  if(s.act.length>WIN){s.act.shift();s.hist.shift();}
  s.cur=next;s.next=cur;
  s.age++;
}

// Heuristic class-4 score:
//  - novelty: fraction of distinct states in the window (class 1/2 repeat, class 3 mostly novel)
//  - activity band: peaks near 0.2 changed-cells/step (class 4 sits between frozen and noise)
//  - periodicity penalty: current state already seen at a short lag => settled into a cycle
function score(s){
  if(s.age<WARM){s.score=null;return;}
  const recent=s.hist, acts=s.act;
  const distinct=new Set(recent).size/recent.length;
  const a=acts.reduce((x,y)=>x+y,0)/acts.length;
  const last=recent[recent.length-1];
  const earlier=recent.lastIndexOf(last,recent.length-2);
  const period=earlier>=0?(recent.length-1-earlier):0;
  const actFit=Math.exp(-Math.pow((a-0.2)/0.15,2));
  let sc=distinct*actFit;
  if(period)sc*=0.2;
  if(a<0.001)sc=0;
  s.score=sc;
  s.stats={a,distinct,period};
}

function ranking(){
  const ready=screens.filter(s=>s.score!==null).sort((x,y)=>y.score-x.score);
  screens.forEach(s=>s.rank=0);
  ready.forEach((s,i)=>s.rank=i+1);
}

function draw(s){
  const ctx=s.ctx;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W*4,H*4);
  for(let r=0;r<H;r++){
    const off=(r&1)*2;
    for(let c=0;c<W;c++){
      const idx=r*W+c;
      if(s.cur[idx]){
        ctx.fillStyle=r===0?'#6cf':'#6f6';
        ctx.fillRect(c*4+off,r*4,3,3);
      }
    }
  }
  if(s.flash>0.02){
    ctx.fillStyle='rgba(255,255,255,'+s.flash.toFixed(3)+')';
    ctx.fillRect(0,0,W*4,H*4);
    s.flash*=0.9;
  }
  s.el.classList.toggle('new',s.flash>0.05);
  const ch='CH'+(s.i+1);
  const tag=s.rank?('#'+s.rank):'warming '+Math.min(s.age,WARM)+'/'+WARM;
  const sc=s.score!==null?s.score.toFixed(3):'--';
  s.la.textContent=ch+' '+tag;
  s.lb.textContent='score '+sc;
}

let lastStatusTick=0;
function renderBoard(){
  const hdr='rk  ch   score  act    distinct period  genome(28 bits)            origin\n';
  let out=hdr;
  const sorted=[...screens].sort((x,y)=>(x.rank||99)-(y.rank||99));
  for(const s of sorted){
    const st=s.stats;
    const row=(s.rank?String(s.rank):'-').padEnd(4)+('CH'+(s.i+1)).padEnd(5)+
      (s.score!==null?s.score.toFixed(3):'  --  ').padEnd(8)+
      (st?st.a.toFixed(3):'  -  ').padEnd(7)+
      (st?st.distinct.toFixed(2):' - ').padEnd(9)+
      (st?(st.period?String(st.period):'-'):'-').padEnd(8)+
      Array.from(s.g).join('').padEnd(29)+s.origin;
    out+=row+'\n';
  }
  document.getElementById('board').textContent=out;
  document.getElementById('log').textContent=logLines.join('\n');
}

function tickAll(){
  for(let t=0;t<STEPS;t++){
    const inBit=bits[inputPos];
    inputPos=(inputPos+1)%bits.length;
    for(const s of screens)stepScreen(s,inBit);
  }
  for(const s of screens)score(s);
  ranking();
  for(const s of screens)draw(s);
  ticks++;
  const cur=MSG[Math.floor(((inputPos-1+bits.length)%bits.length)/8)];
  document.getElementById('status').textContent=
    'shared input stream: "'+MSG+'"  now sending: '+JSON.stringify(cur)+'  bit '+bits[(inputPos-1+bits.length)%bits.length]+
    '  |  step '+(ticks*STEPS)+'  |  evolve every '+(EVOLVE_MS/1000)+'s';
  if(ticks%5===0)renderBoard();
}

// Replace the lowest-ranked screen with a mutant of a top-3 genome (or a fresh random one).
function evolve(){
  const ready=screens.filter(s=>s.score!==null);
  if(ready.length<SCREENS)return;
  const sorted=[...ready].sort((a,b)=>b.score-a.score);
  const worst=sorted[sorted.length-1];
  const top=sorted.slice(0,3);
  if(Math.random()<0.7){
    const parent=top[Math.floor(Math.random()*top.length)];
    worst.g=Uint8Array.from(parent.g);
    const flips=1+Math.floor(Math.random()*3);
    for(let f=0;f<flips;f++)worst.g[Math.floor(Math.random()*28)]^=1;
    worst.origin='mut of CH'+(parent.i+1);
  }else{
    worst.g=randGenome();
    worst.origin='random';
  }
  randomize(worst);
  worst.flash=1;
  worst.rank=0;
  log('CH'+(worst.i+1)+' replaced ('+worst.origin+')');
}

// Show a grid-wide pass at boot so the grid doesn't look empty
for(let t=0;t<40;t++){for(const s of screens)stepScreen(s,bits[inputPos]);inputPos=(inputPos+1)%bits.length;}
setInterval(tickAll,60);
setInterval(evolve,EVOLVE_MS);
tickAll();
</script></body></html>
