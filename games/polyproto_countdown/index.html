<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown — Datenspuren 2026: polyproto talk</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #f78166;
    --accent2: #a371f7;
    --green: #3fb950;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at 50% -20%, #1c2431 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    max-width: 640px;
    width: 100%;
    text-align: center;
    box-shadow: 0 16px 48px rgba(0,0,0,.5);
  }
  .badge {
    display: inline-block;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }
  h1 { font-size: 22px; line-height: 1.3; margin-bottom: 6px; }
  .speaker { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .speaker a { color: var(--accent2); text-decoration: none; }
  .speaker a:hover { text-decoration: underline; }
  .tz-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  label { color: var(--muted); font-size: 13px; }
  select {
    background: #0d1117;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    cursor: pointer;
    outline: none;
  }
  select:focus { border-color: var(--accent2); }
  .when { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  .when b { color: var(--text); }
  .countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .unit {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 8px;
  }
  .unit .num {
    font-size: clamp(28px, 8vw, 44px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #fff, #9aa4b2);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
  }
  .unit .lbl {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-top: 6px;
  }
  .status { font-size: 15px; margin-bottom: 24px; min-height: 20px; }
  .live {
    color: var(--green);
    font-weight: 700;
    font-size: 18px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .45; } }
  .ended { color: var(--muted); }
  .soon { color: var(--accent); font-weight: 600; }
  .btn {
    display: inline-block;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 12px 28px;
    border-radius: 10px;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(247,129,102,.35); }
  .foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
  @media (max-width: 420px) {
    .countdown { grid-template-columns: repeat(2, 1fr); }
    .card { padding: 22px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="badge">Datenspuren 2026 · Live talk</div>
  <h1>How to outlive your home server:<br>The polyproto federation protocol</h1>
  <div class="speaker">Flori Ava Star · <a href="https://talks.datenspuren.de/ds26/talk/QSC7DP/" target="_blank">talk page</a></div>

  <div class="tz-row">
    <label for="tz">Show in timezone:</label>
    <select id="tz"></select>
  </div>
  <div class="when" id="when"></div>

  <div class="countdown">
    <div class="unit"><div class="num" id="d">–</div><div class="lbl">days</div></div>
    <div class="unit"><div class="num" id="h">–</div><div class="lbl">hours</div></div>
    <div class="unit"><div class="num" id="m">–</div><div class="lbl">mins</div></div>
    <div class="unit"><div class="num" id="s">–</div><div class="lbl">secs</div></div>
  </div>

  <div class="status" id="status"></div>
  <a class="btn" href="https://streaming.media.ccc.de/datenspuren" target="_blank">▶ Open livestream</a>
  <div class="foot">16:30–17:15 CEST (14:30–15:15 UTC) · Sun 20 Sep 2026</div>
</div>

<script>
  // Event times as UTC epochs (CEST = UTC+2)
  var START = Date.UTC(2026, 8, 20, 14, 30, 0); // 16:30 CEST
  var END   = Date.UTC(2026, 8, 20, 15, 15, 0); // 17:15 CEST

  var TZS = [
    'Europe/Moscow', 'Europe/Berlin', 'Europe/Kyiv', 'Europe/London',
    'Europe/Istanbul', 'America/New_York', 'America/Chicago',
    'America/Los_Angeles', 'Asia/Dubai', 'Asia/Kolkata',
    'Asia/Shanghai', 'Asia/Tokyo', 'Australia/Sydney', 'UTC'
  ];

  var localTz;
  try { localTz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { localTz = null; }
  if (localTz && TZS.indexOf(localTz) === -1) TZS.unshift(localTz);

  var sel = document.getElementById('tz');
  TZS.forEach(function (tz) {
    var o = document.createElement('option');
    o.value = tz;
    o.textContent = tz === localTz ? tz + ' (local)' : tz;
    sel.appendChild(o);
  });
  // default: Moscow (requested), falls back to local if absent
  var def = TZS.indexOf('Europe/Moscow') !== -1 ? 'Europe/Moscow' : (localTz || 'UTC');
  sel.value = def;

  function fmt(epoch, tz) {
    try {
      return new Intl.DateTimeFormat('en-GB', {
        weekday: 'short', day: '2-digit', month: 'short',
        hour: '2-digit', minute: '2-digit', timeZone: tz
      }).format(new Date(epoch));
    } catch (e) {
      return new Date(epoch).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
    }
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function tick() {
    var tz = sel.value;
    document.getElementById('when').innerHTML =
      '<b>' + fmt(START, tz) + '</b> – ' + fmt(END, tz).split(' ').slice(3).join(' ') +
      ' · ' + tz.replace('_', ' ');

    var now = Date.now();
    var d = document.getElementById('d'),
        h = document.getElementById('h'),
        m = document.getElementById('m'),
        s = document.getElementById('s'),
        st = document.getElementById('status');

    if (now < START) {
      var left = Math.floor((START - now) / 1000);
      d.textContent = pad(Math.floor(left / 86400));
      h.textContent = pad(Math.floor(left % 86400 / 3600));
      m.textContent = pad(Math.floor(left % 3600 / 60));
      s.textContent = pad(left % 60);
      st.className = 'status' + (left < 3600 ? ' soon' : '');
      st.textContent = left < 3600 ? '⚡ Starting very soon!' : 'Until the talk starts';
    } else if (now < END) {
      d.textContent = '0'; h.textContent = '0'; m.textContent = '0'; s.textContent = '0';
      st.className = 'status';
      st.innerHTML = '<span class="live">● LIVE NOW</span>';
    } else {
      d.textContent = '0'; h.textContent = '0'; m.textContent = '0'; s.textContent = '0';
      st.className = 'status ended';
      st.textContent = 'Talk has ended — replay may be available on the media.ccc.de archive';
    }
  }

  sel.addEventListener('change', tick);
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
