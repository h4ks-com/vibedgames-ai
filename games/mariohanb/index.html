/* the square of a hit on a block from below */

/* off the top of a vine, or off the bottom of the clouds: where the area's pointer says */
function leave_by_pointer(mode){

function move_key(key){

/* ── a page of text over everything ───────────────────────── */
function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){
      if (s[p + len] === ' ') last_space = len;
      len++;
    }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}

  for (let r = y; r < y + h; r++){ text(x, r, " ", 250, 240); text(x + w - 1, r, " ", 250, 240); }
  const lines = wrap_lines(body, w - 6, 64);
  let row = y + 1;
  for (let i = 0; i < lines.length && row < y + h - 2; i++, row++)
    text(x + 3, row, lines[i], i === 0 ? 223 : fg, 235);
  text(x + 3, y + h - 2, foot, 245, 235);

  }
  if (!supported(room, cell) || in_water() || rise > 0 || here_deadly()) return;
  for (let d = 0; d < 6; d += 3){
    const n = way_cell(room, cell, d), rr = R2;
    if (n < 0 || being_at(rr, n)) continue;
    const m = way_cell(rr, n, d), r3 = R2;
    const b = m >= 0 ? being_at(r3, m) : null;
    if (!b || !(BEAST[b.kind].flags & BF_HARM) || !(BEAST[b.kind].flags & (BF_STOMP | BF_SHELL)) || !(BEAST[b.kind].flags & BF_WALK) || b.kind === BK_PARAJUMP) continue;
    if ((BEAST[b.kind].flags & BF_SHELL) && b.state !== 0) continue;
    if (b.dir === (d === 0 ? 1 : 0)) continue;                /* walking away: let it */
    const up = way_cell(room, cell, d === 0 ? 5 : 4), r4 = R2;
    if (up < 0 || solid(r4, up) || cell_cost(r4, up) < 0 || burns_at(r4, up, 1)) continue;
    stomp_dir = d;
    wsite = "stomp"; wk(d === 0 ? 'e' : 'w');
    return;
  }
}
/* the cost of a step's landing, with the cell before the fall counted too, -1 for a wall or worse */
function step_cost(r2, c2){
  let cc = cell_cost(r2, c2);
  if (cc >= 0 && (sim_mid_r !== r2 || sim_mid_c !== c2)){ const cm = cell_cost(sim_mid_r, sim_mid_c); if (cm < 0) cc = -1; else if (cm > cc) cc = cm; }
  return cc;
}
function wplan_run(goal, what){
  const lv0 = cur_level, a0 = area; let waits = 0, stuck = 0;
  let plan_pos = 0, plan_live = 0;         /* the plan in hand, and how far along it Mario is */
  for (let attempt = 0; attempt < 3000; attempt++){
    walk_died = 0;
    if (cur_level !== lv0 || area !== a0 || won) return;         /* somewhere else: the script decides again */
    goal_rise = rise;
    if (goal(room, cell)) return;
    /* a plan in hand is kept to, step by step, as long as its steps come true: the plans of successive
     * turns, equally good and differently begun, would otherwise dither */
    if (plan_live && plan_pos < plan_n){ hz_build(); }
    else if (!plan_to(goal)){
      /* no way for now: something is in it; the safest of the seven keys, until it moves */
      if (wsoft && stuck > 8){ wsoft = 0; return; }
      if (stuck++ < 90){
        /* a plan with the creatures as costs, followed as far as its first step is not into one */
        plan_soft = 1; cost_gen++; const soft_ok = plan_to(goal); plan_soft = 0; cost_gen++;
        if (soft_ok && plan_n > 0){
          plan_sim(room, cell, rise, plan_keys[0]);
          const r2 = sim_r2, c2 = sim_c2;
          if (r2 >= 0 && cell_cost(r2, c2) >= 0 && cell_cost(sim_mid_r, sim_mid_c) >= 0 && !burns_at(r2, c2, 1) && !burns_at(sim_mid_r, sim_mid_c, 1)){ wsite = "soft"; wk(plan_keys[0]); continue; }
          if (cell_cost(room, cell) >= 0 && cell_cost(room, cell) < 20 && !burns_at(room, cell, 1) && (supported(room, cell) || in_water())){ wsafe_wait(); continue; }
        }
        let bestk = 6, bestc = 1 << 30;
        for (let k = 6; k >= 0; k--){ if (!plan_sim(room, cell, rise, PLAN_KEYS[k])) continue; const r2 = sim_r2, c2 = sim_c2; let cc = step_cost(r2, c2); if (cc < 0 || burns_at(r2, c2, 1) || burns_at(sim_mid_r, sim_mid_c, 1)) cc = 999; if (cc < bestc){ bestc = cc; bestk = k; } }
        wsite = "wait"; wk(PLAN_KEYS[bestk]); continue;
      }
      if (wsoft){ wsoft = 0; return; }
      wfail("no way to " + what);
    }
    else { plan_pos = 0; plan_live = 1; }
    const lives0 = lives;
    const i0 = plan_pos;
    for (let i = plan_pos; i < plan_n && !walk_died; i++, plan_pos++){
      { const lv1 = cur_level, a1 = area, k0 = walk_keys; wstomp(); if (walk_keys !== k0 || cur_level !== lv1 || area !== a1 || walk_died){ plan_live = 0; break; } }
      wdefend();
      if (walk_died){ plan_live = 0; break; }
      if (i > i0){ hz_build(); if (goal(room, cell)) break; }
      const r0 = room, c0 = cell, rs0 = rise;
      plan_sim(r0, c0, rs0, plan_keys[i]);
      let er = sim_r2, ec = sim_c2, ers = sim_rs2;
      const mr = sim_mid_r, mc = sim_mid_c;
      if (er !== plan_er[i] || ec !== plan_ec[i]){ plan_live = 0; break; }     /* the world has moved: a lift, a shell; plan again */
      { /* and the three steps after it, looked at from here: a lift that will not be there is seen before the leap */
        let r3 = er, c3 = ec, rs3 = ers, bad = 0;
        for (let j = i + 1; j < plan_n && j <= i + 3 && !bad; j++){ sim_phase = j - i; const ok = plan_sim(r3, c3, rs3, plan_keys[j]); sim_phase = 0; const r4 = sim_r2, c4 = sim_c2, rs4 = sim_rs2; if (!ok || r4 !== plan_er[j] || c4 !== plan_ec[j] || burns_at(r4, c4, j - i + 1) || burns_at(sim_mid_r, sim_mid_c, j - i + 1)) bad = 1; r3 = r4; c3 = c4; rs3 = rs4; }
        plan_sim(r0, c0, rs0, plan_keys[i]);      /* sim_mid back to this step */
        if (bad){ plan_live = 0; break; }
      }
      /* a step into what is about to burn or bite: wait for it to pass when standing still is safe,
       * or step aside to the safest cell about when it is not (a fish beside you in the water) */
      let nc = er >= 0 ? cell_cost(er, ec) : -1;
      if (nc >= 0 && (mr !== er || mc !== ec)){ const cm = cell_cost(mr, mc); if (cm < 0) nc = -1; else if (cm > nc) nc = cm; }
      const lethal = er < 0 || nc < 0 || burns_at(er, ec, 1) || burns_at(mr, mc, 1);
      if ((lethal || nc >= 30) && waits++ < 60){
        let herec = cell_cost(r0, c0);
        if (herec < 0 || burns_at(r0, c0, 1) || !(supported(r0, c0) || in_water())) herec = 999;
        if (herec < 20){ wsafe_wait(); if (!lethal) plan_live = 0; break; }
        if (lethal){
          let bestk = -1, bestc = herec;
          for (let k = 0; k < 7; k++){ if (!plan_sim(r0, c0, rs0, PLAN_KEYS[k]) || sim_r2 < 0) continue; const r2 = sim_r2, c2 = sim_c2; const cc = step_cost(r2, c2); if (cc < 0 || burns_at(r2, c2, 1) || burns_at(sim_mid_r, sim_mid_c, 1)) continue; if (cc < bestc){ bestc = cc; bestk = k; } }
          if (bestk >= 0){ wsite = "dodge"; wk(PLAN_KEYS[bestk]); plan_live = 0; break; }
          if (herec < 999){ wsafe_wait(); break; }
        }
        /* costly but not deadly, and no safe place to wait: on with it */
      }
      wsite = "walk"; wk(plan_keys[i]); waits = 0;
      if (walk_died){ plan_live = 0; break; }
      if (lives !== lives0){ plan_live = 0; break; }
      if (room !== er || cell !== ec){
        if (room === r0 && cell === c0) wsafe_wait();
        plan_live = 0;
        break;
      }
      if (i - i0 >= 5){ plan_pos++; break; }      /* and a breath between runs of steps, for the loop's other cares */
    }
  }
  if (wsoft){ wsoft = 0; return; }
  wfail("could not " + what);
}
let found_r = 0, found_c = 0;
function find_thing_in_area(t, after_x){
  /* the first thing of the kind in the area east of a tile: its cell */
  let best = -1, bx = 1 << 30;
  for (let r = AREA[area].first; r < AREA[area].first + 3 * AREA[area].cols; r++) for (let c = 0; c < BOARD_SIZE; c++) if (RS[r].c[c].thing === t && row_of(c) >= 2 && row_of(c) <= 6){ const x = cell_tile(r, c)[0]; if (x >= after_x && x < bx){ bx = x; best = r; found_r = r; found_c = c; } }
  return best;
}
function goal_under_block(r, c){
  /* a cell to hit the block from: the block is up-left or up-right of it, and there is a jump left, or something to stand on */
  if (!supported(r, c) && goal_rise === 0 && AREA[RS[r].area].type !== 0) return 0;
  for (let d = 4; d <= 5; d++){ const n = way_cell(r, c, d), rr = R2; if (n >= 0 && rr === goal_target_room && n === goal_target_cell) return 1; }
  return 0;
}
let goal_kind = -1;
function goal_on_kind(r, c){ const b = being_at(r, c); return b && b.kind === goal_kind && b.alive ? 1 : 0; }
/* a mushroom, or a flower: the nearest block ahead that holds one, hit, and what comes out, caught */
function wpower(){
  if (big >= 2 || AREA[area].type === 3) return;
  const x0 = tile_of_x(); let best = -1, bx = 1 << 30, bc = -1;
  for (let r = AREA[area].first; r < AREA[area].first + 3 * AREA[area].cols; r++) for (let c = 0; c < BOARD_SIZE; c++){
    const k = RS[r].c[c];
    if (!((k.thing === T_QBLOCK || k.thing === T_BRICK) && k.inside === IN_POWER) || row_of(c) < 2 || row_of(c) > 6) continue;
    const x = cell_tile(r, c)[0];
    if (x < x0 - 6 || x > x0 + 90 || x >= bx) continue;
    bx = x; best = r; bc = c;
  }
  if (best < 0) return;
  const lv0 = cur_level, a0 = area, lives0 = lives;
  goal_target_room = best; goal_target_cell = bc;
  wsoft = 1;
  wplan_run(goal_under_block, "under the block");
  wsoft = 0;
  goal_rise = rise;
  if (cur_level !== lv0 || area !== a0 || lives !== lives0 || !goal_under_block(room, cell)) return;
  let d = -1; for (let dd = 4; dd <= 5; dd++){ const n = way_cell(room, cell, dd), rr = R2; if (n >= 0 && rr === best && n === bc) d = dd; }
  if (d < 0) return;
  wsite = "block"; wk("dxzawe"[d]);
  if (RS[best].c[bc].inside === IN_POWER){ wsafe_wait(); wk("dxzawe"[d]); }
  goal_kind = big === 0 ? BK_MUSHROOM : BK_FLOWER;
  const big0 = big;
  for (let t = 0; t < 40 && big === big0 && cur_level === lv0 && area === a0 && lives === lives0; t++){
    let it = null;
    for (let i = 0; i < being_n; i++) if (beings[i].alive && beings[i].kind === goal_kind && RS[beings[i].room].area === area) it = beings[i];
    if (!it) break;
    if (!plan_to(goal_on_kind) || plan_n === 0){ if (!supported(room, cell) && !in_water()) break; wsafe_wait(); continue; }   /* mid-air: the level's own plan steers the fall */
    wsite = "the power-up"; wk(plan_keys[0]);
  }
}
function wlevel(){
  /* one level, whatever it is made of: the intro pipe, the pipe out, the flagpole or the axe.  A
   * life lost puts Mario back at the start, and the loop decides again from there. */
  let guard = 0;
  const lv = cur_level;
  while (!won && cur_level === lv && guard++ < 40){
    wpower(); if (big === 1 && cur_level === lv) wpower();
    if (cur_level !== lv) break;
    if (AREA[area].type === 3){
      /* the castle: the axe */
      goal_thing = T_AXE;
      wplan_run(goal_on_thing, "the axe");
      continue;
    }
    if (LEVELS[cur_level].area2 >= 0 && area === LEVELS[cur_level].area){
      /* the intro: walk into its pipe */
      goal_thing = T_PIPESIDE;
      wplan_run(goal_beside_thing, "the intro pipe");
      if (!goal_beside_thing(room, cell)) continue;
      let d = -1; for (let dd = 0; dd < 6; dd += 3){ const n = way_cell(room, cell, dd), rr = R2; if (n >= 0 && RS[rr].c[n].thing === T_PIPESIDE) d = dd; }
      wexpect(d >= 0, "the pipe's mouth"); wsite = "intro pipe"; wk("dxzawe"[d]);
      continue;
    }
    if (find_thing_in_area(T_POLE, 0) < 0 && find_thing_in_area(T_PIPESIDE, 0) >= 0){
      /* underground or underwater: the pipe out, to the east */
      goal_thing = T_PIPESIDE;
      wplan_run(goal_beside_thing, "the pipe out");
      if (!goal_beside_thing(room, cell)) continue;
      let d = -1; for (let dd = 0; dd < 6; dd += 3){ const n = way_cell(room, cell, dd), rr = R2; if (n >= 0 && RS[rr].c[n].thing === T_PIPESIDE) d = dd; }
      wexpect(d >= 0, "the pipe's mouth"); wsite = "exit pipe"; wk("dxzawe"[d]);
      continue;
    }
    goal_thing = T_POLE;
    wplan_run(goal_on_thing, "the flagpole");
  }
  if (cur_level < lv) walk_out.push("       (game over: back to the world's first level)");
  wexpect(cur_level !== lv || won, "the level cleared");
}
function check_walk(seedText, trace){
  walk_out = [];
  walk_trace = trace ? 1 : 0;
  walk_keys = 0; walk_keystring = "";
  stomp_dir = -1; wsoft = 0; plan_soft = 0; pred_room = -1; sim_phase = 0;
  start_game(seedText, 1);
  show_intro = 0; show_level = 0;
  walk_seen[0] = walk_seen[1] = "";
  try {
    for (let lv = 0; lv < 200 && !won; lv++){
      wstage("World " + LEVELS[cur_level].world + "-" + LEVELS[cur_level].level);
      wlevel();
    }
    wexpect(won, "the princess");
  } catch (e){
    if (!(e instanceof WalkFail)) throw e;
    walk_out.push("keys " + walk_keys + "  deaths " + deaths);
    if (walk_trace) walk_out.push("keys " + walk_keystring);
    return walk_out;
  }
  walk_out.push("");
  walk_out.push("WALK OK: " + walk_keys + " keys, " + turn + " turns, " + deaths + " lives lost, score " + score + ", " + coins + " coins; the princess is saved");
  if (walk_trace) walk_out.push("keys " + walk_keystring);
  return walk_out;
}

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same 2A03 and played
 * as a buffer; the tune loops until the next one. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the tune's intro once, then its loop */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("mario.sav"),
  set: (s) => localStorage.setItem("mario.sav", s),
};
start_game(params.get("seed"), 0);
if (SOUND.on) SOUND.command("bed overworld");
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left the Mushroom Kingdom.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: arrows are w x d a as in mushroomkingdom.c, Escape
 * is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return 'w';
  if (e.key === "ArrowDown") return 'x';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
