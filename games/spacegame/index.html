/* ── the PC speaker ──

 * Hz/10) pairs; a tick 54.9 ms, a 2 ms gap between notes. */
function tune_loop_from(name){ return 0; }
function tune_render(name, loop){
  let s = null;
  for (let i = 0; i < TRACK_N; i++) if (TRACKS[i].name === name) s = TRACKS[i];
  if (!s) return 0;
  const nn = s.notes.length >> 1;
  let n = 0;
  for (let k = 0; k < nn; k++) n += Math.trunc(s.notes[2 * k] * TICK_S * FS);
  if (n > RENDER_MAX) n = RENDER_MAX;
  for (let i = 0; i < n; i++) render_buf[i] = 0.0;
  let at = 0; const gap = Math.trunc(FS / 500);
  const ph = [0.0];
  for (let k = 0; k < nn && at < n; k++){
    const len = Math.trunc(s.notes[2 * k] * TICK_S * FS); let end = at + len;
    const f = s.notes[2 * k + 1] * 10.0;
    if (end > n) end = n;
    if (f > 0.0){
      ph[0] = 0.0;
      for (let i = at; i < end - gap; i++) render_buf[i] = pulse(osc(ph, f), 0.5);
    }
    at = end;
  }
  if (loop){
    const edge = Math.trunc(FS / 100);
    for (let i = 0; i < edge && i < n; i++){ render_buf[i] *= i / edge; render_buf[n - 1 - i] *= i / edge; }

}

/* ── geometry ── */
function isqrt(n){

}

function arrival_cell(from, to){
  let sy = (from >> 3) - (to >> 3), sx = (from & 7) - (to & 7);
  if (sy) sy = sy < 0 ? -1 : 1;

  if (!sx && !sy) sy = 1;

    const x = 2 * COORD_Q[c] + COORD_R[c], y = COORD_R[c];

  let near = -1, nd = 99;
  for (let c = 0; c < BOARD_SIZE; c++) if (sec[c] === C_EMPTY && hex_dist(c, best) < nd){ nd = hex_dist(c, best); near = c; }

}

}

  for (let d = 0; d < 6; d++){
    const q = COORD_Q[a] + ANGLE_DQ[d], r = COORD_R[a] + ANGLE_DR[d];

    if (s < 0) s = -s;

/* ── time ─────────────────────────────────────────────────── */
function schedule(kind, offset){ sched[kind] = stardate + offset; }

function pass_time(t){
  if (t <= 0) return;
  stardate += t;
  const cool = Math.trunc((t > 1800 ? 1800 : t) * 360 / 1000);
  laser_heat = cool >= laser_heat ? 0 : laser_heat - cool;
  const gain = Math.trunc(Math.trunc(Math.trunc(t * 400 / 1000) * sys[SYS_CONVERTER]) / 100);
  if (energy < ENERGY_MAX){ energy += gain; if (energy > ENERGY_MAX) energy = ENERGY_MAX; }
  const dk = docked === B_STARBASE;
  const rate = dk ? 50 : 20, frate = dk ? 100 : 60;
  let rt = t > 10000 ? 10000 : t;
  if (repair_focus){
    const f = repair_focus - 1;
    const v = sys[f] + Math.trunc(frate * rt / 1000);
    if (v > 100){
      const used = (v - 100) * 10;
      rt = rt > used ? rt - used : 0;
      sys[f] = 100; repair_focus = 0;
    } else { sys[f] = v; rt = 0; }
  }
  const mend = Math.trunc(rate * rt / 1000);
  if (mend) for (let i = 0; i < SYS_N; i++) if (sys[i] < 100){ sys[i] += mend; if (sys[i] > 100) sys[i] = 100; }
  if (sys[SYS_LIFE] < 90 && docked === B_NONE){
    if (life_reserve >= t) life_reserve -= t;
    else { life_reserve = 0; if (!lost){ lost = 1; lost_how = 2; } }
  }
}

/* ── entering a quadrant ─────────────────────────────────── */
function reveal_around(q){
  const qy = q >> 3, qx = q & 7;
  for (let y = qy - 1; y <= qy + 1; y++) for (let x = qx - 1; x <= qx + 1; x++)
    if (y >= 0 && y < 8 && x >= 0 && x < 8) GX[y * 8 + x].known = 1;
}

  if (GX[q].nova) for (let c = 0; c < BOARD_SIZE; c++) if (sec[c] === C_STAR || sec[c] === C_BASE || sec[c] === C_PLANET) sec[c] = C_EMPTY;
  if (GX[q].base === B_NONE) for (let c = 0; c < BOARD_SIZE; c++) if (sec[c] === C_BASE) sec[c] = C_EMPTY;
  { let g = GX[q].gone; for (let c = 0; c < BOARD_SIZE && g > 0; c++) if (sec[c] === C_STAR){ sec[c] = C_NOVA; g--; } }
  cell = from < 0 ? -1 : arrival_cell(from, q);

  for (let n = 0; n < GX[q].enemies; n++){
    const c = free_cell();
    if (c < 0) break;
    if (n < GX[q].commander) sec[c] = C_COMMAND;

    ehp[c] = hp_of(sec[c]);

  if ((q & 7) + 1 === 8 && GX[q].enemies < 5 && rnd(10) > 5){
    const c = free_cell();

  }
  if (union_quad === q && union_cell < 0 && union_hp > 0){
    const late = stardate - union_when;
    if (late > 2200){ say("SCANNER REPORT: wreckage of a Union ship present in the quadrant."); union_quad = -1; union_hp = 0; }
    else {
      const c = free_cell();
      if (c >= 0){ sec[c] = C_UNION; union_cell = c; union_hp = 1100 - rnd(50) * Math.trunc(late / 1000); if (union_hp < 100) union_hp = 100; }
    }

/* ── the pools, the weapons ─────────────────────────────── */

function erode_chart(){

  }

function wreck_system(which, hits){

  const divisor = 200 + rnd(300);
  const off = Math.trunc((hits * factor + Math.trunc(divisor / 2)) / divisor) + rnd(5);
  let left = sys[which] - off;
  if (left > 90) left -= 10 + rnd(10);
  sys[which] = left < 0 ? 0 : left;
  if (which === SYS_COMPUTER) erode_chart();

function combat_damage(){

  }

  const rounds = Math.trunc((turn_hits + 175) / 350) + 1;
  for (let i = 0; i < rounds; i++){

  }

}
function take_hit(amount){
  let absorbed = 0;
  if (shields_up && shields){
    const charge = Math.trunc(shields / 25);
    absorbed = Math.trunc((amount * charge + 50) / 100);
    absorbed = Math.trunc((absorbed * sys[SYS_SHIELDS] + 50) / 100);
    let drain = Math.trunc(absorbed * 4 / 5);
    if (absorbed > shields) absorbed = shields;
    if (drain > shields) drain = shields;
    shields -= drain;
  }
  const through = amount - absorbed;
  turn_hits += amount; turn_absorbed += absorbed;
  if (!through) return;
  if (through >= energy){ energy = 0; lost = 1; lost_how = 1; casualties = 430; return; }
  energy -= through;
}

/* ── the enemy's turn ──────────────────────────────────── */
function enemy_fire_energy(hp){ const pct = 90 + rnd(16); return Math.trunc(hp / 100) * pct + Math.trunc(((hp % 100) * pct) / 100); }

}

      say("SCANNER REPORT: the scout escapes to quadrant " + qn + ".");

        const d = away ? dir_away(at, cell) : dir_toward(at, cell);
        const n = d < 0 ? -1 : step_cell(at, d);
        if (n < 0){
          if (!away) break;

            GX[nq].enemies++; GX[quad].enemies--; GX[nq].moved++; GX[quad].moved--;

function enemy_turn(){

  if (fired_this_turn) enemy_moves();
  for (let c = 0; c < BOARD_SIZE; c++){
    if (!IS_ENEMY(sec[c]) || lost) continue;
    if (level >= 3 && bolt_cell < 0 && rnd(100) > 93 && (sec[c] === C_BATTLESHIP || sec[c] === C_COMMAND)){
      bolt_cell = cell; bolt_quad = quad;
      say("SCANNER REPORT: " + CLASS_NAME[sec[c]] + " has fired a plasma bolt at us!");
    }

      const du = hex_dist(c, union_cell);
      const dmg = laser_damage(enemy_fire_energy(ehp[c]), 100, du);
      if (dmg > 0){
        union_hp -= dmg;
        if (union_hp <= 0){ sec[union_cell] = C_EMPTY; union_cell = -1; union_quad = -1; union_hp = 0; say("SCANNER REPORT: the Union ship is destroyed."); }

    const d = hex_dist(c, cell);
    const dmg = laser_damage(enemy_fire_energy(ehp[c]), 100, d);

    if (docked === B_STARBASE){ say("ENGINEERING: the StarBase's shields take " + dmg + " units from " + CLASS_NAME[sec[c]] + "."); continue; }
    sound_say("jingle hit");
    const before = energy;
    take_hit(dmg);
    if (lost){ say(dmg + " units from " + CLASS_NAME[sec[c]] + ".  The Lexington is destroyed."); return; }
    if (energy === before) say(dmg + " units from " + CLASS_NAME[sec[c]] + "; the shields hold.");
    else say(dmg + " units from " + CLASS_NAME[sec[c]] + "; " + (before - energy) + " through the shields.");
  }

/* ── the events ────────────────────────────────────────── */
function pick_base(){

  return -1;
}

function run_boarders(){

  boarders = 1 + rnd(3);

const MUTANT_SAY = ["the mutants have taken the viewer", "the mutants are at the doors of the bridge", "the mutants demand to speak to the captain", "the mutants have found the galley", "the mutants are quiet, for now"];

function run_pod(){

    if (!IS_ENEMY(sec[c])) continue;

function run_wear(){

  run_mutants();

/* ── the end of a turn ─────────────────────────────────── */

/* ── the commands ─────────────────────────────────────── */
function impulse_ok(){ return sys[SYS_IMPULSE] >= 50; }
function leave_place(){ docked = B_NONE; orbiting = -1; }
function enter_hole(){
  if (rnd(5) === 0){ lost = 1; lost_how = 4; casualties = 430; say("The Lexington is pulled into the black hole."); return 1; }
  let q = quad;
  for (let tries = 0; tries < 100; tries++){ q = rnd(GAL); if (!GX[q].nova) break; }
  const from = quad;
  quad = q;
  say("NAVIGATION: a black hole!  The Lexington is thrown to quadrant " + quadname(q) + ".");
  sound_say("whoosh warp");
  enter_quadrant(from);
  return 1;
}
function move_dir(d){
  if (gameover) return;
  const n = step_cell(cell, d);
  if (n < 0){ say("NAVIGATION: that is the edge of the quadrant; warp (m) takes us further."); return; }
  if (!impulse_ok()){ say("ENGINEERING: move aborted; the impulse engines are too damaged to use."); return; }
  if (impulse < 6){ say("ENGINEERING: move aborted; the impulse pool has too little energy."); return; }
  if (sec[n] !== C_EMPTY && sec[n] !== C_HOLE){ say("NAVIGATION: " + CLASS_NAME[sec[n]] + " is in the way."); return; }
  moved_this_turn = 1;
  leave_place();
  sec[cell] = C_EMPTY;
  impulse -= 6;
  pass_time(42);
  if (sec[n] === C_HOLE){ cell = n; if (enter_hole()){ end_turn(); return; } }
  else { cell = n; sec[n] = C_SHIP; }
  end_turn();
}
function warp_energy(d16){
  const d88 = d16 * 2, d44 = d88 >> 4;
  let wc = Math.trunc((warp * warp) / 10);
  { const q = Math.trunc(wc / 100), r = wc % 100; wc = q * warp + Math.trunc((r * warp) / 100); }
  const f = 128 + d44 * 14, g = f >> 5;
  return (wc >> 3) * g + (((wc & 7) * g) >> 3);
}
function warp_time(d16){
  const den = warp * warp;
  return Math.trunc((859375 * d16 + den * 50) / (den * 100));
}
function warp_strain(d16){
  const d10 = Math.trunc(d16 * 5 / 64);

  const over = d10 - 15;
  if (over < 25 && rnd(25) >= over) return;
  let loss = 10 + rnd(d10 + 1);
  if (loss > sys[SYS_WARP]) loss = sys[SYS_WARP];

}

  moved_this_turn = 1;
  leave_place();
  const from = quad;
  energy -= cost;

  { const y0 = (from >> 3) < (q >> 3) ? (from >> 3) : (q >> 3), y1 = (from >> 3) < (q >> 3) ? (q >> 3) : (from >> 3);

      const c = y * 8 + x;

      quad = c; done = 1;
      say("NAVIGATION: the Lexington is caught in a long range tractor beam and pulled to quadrant " + quadname(c) + ".");
    } }

function fire_torpedo(d){
  if (gameover) return;
  if (boarders === 3){ say("TORPEDO CONTROL: the boarding party holds torpedo control!"); return; }
  if (torps <= 0){ say("TORPEDO CONTROL: no torpedoes left."); return; }
  if (tubes() === 0){ say("TORPEDO CONTROL: the tubes are too damaged to fire."); return; }
  torps--;
  sound_say("jingle torpedo");
  fired_this_turn = 1;
  let at = cell, dir = d, hit = -1;
  for (let step = 0; step < 12; step++){
    if (shields_up && shields > 0 && rnd(25000) < shields) dir = (dir + (rnd(2) ? 1 : 5)) % 6;
    const n = step_cell(at, dir);
    if (n < 0) break;
    at = n;
    if (sec[at] !== C_EMPTY && sec[at] !== C_SHIP){ hit = at; break; }
  }
  if (hit < 0){ say("TORPEDO CONTROL: the torpedo misses and is lost."); end_turn(); return; }
  const c = sec[hit];
  if (c === C_STAR){
    if (rnd(100) > 95){ star_supernova(hit); end_turn(); return; }
    if (rnd(100) < 40){ say("TORPEDO CONTROL: the torpedo is absorbed by the star."); end_turn(); return; }
    sec[hit] = C_NOVA; if (GX[quad].gone < GX[quad].stars) GX[quad].gone++; stars_gone++;
    say("TORPEDO CONTROL: the star is destroyed.  Starfleet will hear of it.");
    end_turn(); return;
  }
  if (c === C_NOVA){ say("TORPEDO CONTROL: the torpedo goes into the burnt star."); end_turn(); return; }
  if (c === C_PLANET){ say("TORPEDO CONTROL: the torpedo hit a planet."); end_turn(); return; }
  if (c === C_BASE){ say("TORPEDO CONTROL: are you mad?  You have damaged the base!"); GX[quad].base = B_NONE; sec[hit] = C_EMPTY; bases_lost++; docked = B_NONE; end_turn(); return; }
  if (c === C_POD){ say("TORPEDO CONTROL: the torpedo passes through where the pod was; it is cloaked."); end_turn(); return; }
  if (c === C_HOLE){ say("TORPEDO CONTROL: the torpedo is swallowed by something."); end_turn(); return; }
  if (c === C_UNION){ union_hp -= 200; say("TORPEDO CONTROL: that was the Union ship!"); if (union_hp <= 0){ sec[hit] = C_EMPTY; union_cell = -1; union_quad = -1; union_hp = 0; say("The Union ship is destroyed."); } end_turn(); return; }
  if (rnd(50) === 0){ say("TORPEDO CONTROL: the torpedo fails to detonate."); end_turn(); return; }
  const dmg = (level + 4) * 15 + 250;
  if (dmg < ehp[hit]){ ehp[hit] -= dmg; say("TORPEDO CONTROL: " + dmg + " units on " + CLASS_NAME[c] + "; it has " + ehp[hit] + " left."); }
  else { say("TORPEDO CONTROL: " + CLASS_NAME[c] + " is destroyed."); kill_enemy(hit); }
  end_turn();
}
function shields_toggle(){
  if (gameover) return;
  if (shields_up){ shields_up = 0; say("ENGINEERING: shields down."); }
  else {
    if (boarders === 1){ say("ENGINEERING: the boarding party holds engineering!"); return; }
    if (energy < 50){ say("ENGINEERING: not enough energy to raise the shields."); return; }
    energy -= 50; shields_up = 1; say("ENGINEERING: shields up.");
  }
  end_turn();
}
const POOL_NAME = ["", "main energy", "the impulse engines", "the shields"];
function pool_get(w){ return w === 1 ? energy : w === 2 ? impulse : shields; }
function pool_set(w, v){ if (w === 1) energy = v; else if (w === 2) impulse = v; else shields = v; }
function divert(from, to, amount){
  const cap = to === 1 ? ENERGY_MAX : to === 2 ? IMPULSE_MAX : SHIELD_MAX;
  if (from === to) return;
  if (pool_get(from) < amount) amount = pool_get(from);
  if (pool_get(to) + amount > cap) amount = cap - pool_get(to);
  if (amount <= 0){ say("ENGINEERING: nothing to transfer that way."); return; }
  pool_set(from, pool_get(from) - amount); pool_set(to, pool_get(to) + amount);
  say("ENGINEERING: " + amount + " units from " + POOL_NAME[from] + " to " + POOL_NAME[to] + ".");
}
function max_shields(){
  if (gameover) return;
  if (shields >= SHIELD_MAX){ say("ENGINEERING: the shields are at full strength."); return; }
  divert(1, 3, SHIELD_MAX - shields);
}
function base_cell(){ for (let c = 0; c < BOARD_SIZE; c++) if (sec[c] === C_BASE) return c; return -1; }
function dock(){
  if (gameover) return;

  const b = base_cell();
  if (b < 0 || hex_dist(b, cell) > 1 || GX[quad].base === B_NONE){ say("ENGINEERING: no base beside us to dock with."); return; }
  docked = GX[quad].base;
  life_reserve = 2000;
  if (docked === B_STARBASE){ if (energy < ENERGY_MAX) energy = ENERGY_MAX; impulse = IMPULSE_MAX; shields = SHIELD_MAX; torps = TORPS_MAX; }
  else if (docked === B_SUPPLY) torps = TORPS_MAX;
  say("ENGINEERING: docked at " + BASE_NAME[docked] + (docked === B_STARBASE ? "; all supplies replenished" : docked === B_SUPPLY ? "; torpedoes and life support replenished" : "; life support replenished") + ".");

  end_turn();

function hail(){
  if (gameover) return;
  const qy = quad >> 3, qx = quad & 7; let best = 64, fq = -1;
  for (let y = qy - 4; y <= qy + 4; y++) for (let x = qx - 4; x <= qx + 4; x++){
    if (y < 0 || y > 7 || x < 0 || x > 7) continue;
    const c = y * 8 + x;
    if (GX[c].base !== B_STARBASE) continue;
    const d = (y - qy) * (y - qy) + (x - qx) * (x - qx);
    if (d < best){ best = d; fq = c; }
  }
  if (rnd(10) < 2){ say("COMMUNICATIONS: subspace interference; no reply."); return; }
  if (fq < 0 || best > 4){
    if (fq >= 0){ schedule(SCH_HAIL, (isqrt(25 * best) - 5) * 100); hail_quad = fq; }
    say("COMMUNICATIONS: no StarBase close enough to answer at once.");
    return;
  }

}
function planet_here(){ return GX[quad].planet; }

}
function land(shuttle){
  if (gameover) return;
  if (orbiting < 0){ say("NAVIGATION: not orbiting a planet."); return; }
  if (shields_up){ say("TRANSPORTER: cannot beam through the shields."); return; }
  if (shuttle ? sys[SYS_SHUTTLE] < 100 : sys[SYS_TRANSPORTER] < 100){ say("ENGINEERING: the " + (shuttle ? "shuttlecraft" : "transporter") + " is not at 100%."); return; }
  const p = PL[orbiting];
  sound_say("whoosh beam");
  if (p.flags & PL_SETTLED){
    p.flags = (p.flags & ~PL_SETTLED) | PL_TAKEN;
    rescues++; evac_end = -1;
    say("TRANSPORTER: the settlers are aboard.  Evacuation complete.");
    end_turn(); return;
  }
  if (shuttle) pass_time(200);
  if (rnd(5) === 0){
    const lost_ = 2 + rnd(5);
    casualties += lost_; p.flags |= PL_TAKEN;

    end_turn(); return;
  }
  if (p.flags & PL_TAKEN){ say("SCIENCE: nothing more found."); end_turn(); return; }
  p.flags |= PL_TAKEN;
  if (p.find === PF_ENERGIUM){ have[I_ENERGIUM]++; say("SCIENCE: energium successfully mined."); }
  else if (p.find === PF_MONGOL){
    enemy_bases++;
    if (rnd(4) !== 0){ for (let i = 0; i < 3; i++) if (rnd(i + 3) <= 1) have[i]++; have[I_LIFE] += 2; say("SECURITY: the Mongol supply station is taken; supplies captured."); }
    else say("SECURITY: the Mongol supply station is taken, and nothing in it worth carrying.");
  } else say("SCIENCE: nothing found.");
  end_turn();
}
function use_item(it){

  if (it < 0 || it >= I_N || !have[it]){ say("Nothing of that to use."); return; }
  if (it === I_ENERGIUM){
    if (energy >= Math.trunc(ENERGY_MAX / 5) || shields >= Math.trunc(SHIELD_MAX / 2)){ say("FIRST OFFICER: regulations prohibit raw energium unless shields are under 50% and main energy under 20%."); return; }
    have[it]--;
    const r = rnd(6);
    if (r === 0){ const loss = rnd(1000); energy = loss >= energy ? 0 : energy - loss; say("ENGINEERING: the crystal is defective!  Main energy systems damaged."); }
    else if (r <= 2) say("ENGINEERING: the crystal is loaded... nothing happens.");

      const gain = 5 * (700 + rnd(700)), sg = 5 * (300 + rnd(300));
      energy += gain; shields += sg; if (shields > SHIELD_MAX) shields = SHIELD_MAX;
      say("ENGINEERING: the crystal is loaded: " + gain + " units to main energy, " + sg + " to the shields.");
    }
  } else if (it === I_MENERGIUM){ have[it]--; energy += 1000; if (energy > ENERGY_MAX) energy = ENERGY_MAX; say("ENGINEERING: Mongol energium loaded: main energy " + energy + "."); }
  else if (it === I_BOLTS){
    if (target < 0 || !IS_ENEMY(sec[target])) target = nearest_enemy();

    have[it]--;
    if (rnd(3) === 0){ say("TORPEDO CONTROL: the plasma bolt is a dud."); end_turn(); return; }
    const d = hex_dist(target, cell), burst = d === 0 ? 4000 : Math.trunc(1000 / (d * d));
    for (let c = 0; c < BOARD_SIZE; c++) if (IS_ENEMY(sec[c])){
      const dc = hex_dist(c, target), b = dc === 0 ? 4000 : Math.trunc(1000 / (dc * dc));
      if (b >= ehp[c]){ say("TORPEDO CONTROL: the bolt destroys " + CLASS_NAME[sec[c]] + "."); kill_enemy(c); } else ehp[c] -= b;
    }
    if (burst >= 200){ say("TORPEDO CONTROL: the plasma bolt bursts " + d + " away; " + burst + " units on us."); take_hit(burst); }
    else say("TORPEDO CONTROL: the plasma bolt bursts among them.");
    end_turn();
  } else if (it === I_PSHIELD){ have[it]--; plasma_shield = 1; shields = SHIELD_MAX; say("ENGINEERING: the plasma shield is up; the shields are at full charge."); }
  else if (it === I_LIFE){
    if (sys[SYS_LIFE] >= 100){ say("ENGINEERING: not on reserve life support."); return; }
    have[it]--; life_reserve += 1000; if (life_reserve > 2000) life_reserve = 2000;
    say("ENGINEERING: a canister of life support supplies opened; the reserve is " + Math.trunc(life_reserve / 1000) + "." + (Math.trunc(life_reserve / 100) % 10) + " stardates.");
  }
}
function death_ray(){

  if (r === 0){
    for (let c = 0; c < BOARD_SIZE; c++) if (IS_ENEMY(sec[c])){ sec[c] = C_EMPTY; ehp[c] = 0; if (GX[quad].enemies) GX[quad].enemies--; if (enemies_left) enemies_left--; }

  else if (r === 3){
    for (let c = 0; c < BOARD_SIZE; c++) if (sec[c] === C_EMPTY && rnd(100) > 50) sec[c] = C_HOLE;

/* ── the evaluation ───────────────────────────────────── */
function score_total(){
  const elapsed = Math.trunc((stardate - STARDATE_START) / 100);
  const kills = killed + killed_cmd;
  let s = 0;
  s += lost ? -200 : rescues * 200;
  s += enemies_left ? -300 : 0;
  s += killed * 10 + killed_cmd * 20 + enemy_bases * 50;
  if (elapsed >= 30) s += Math.trunc((500 * kills * 10) / elapsed);
  s -= casualties;
  s += stars_gone * -5;
  s += bases_lost * -200;
  return s;
}
function evaluation_text(){
  const elapsed = Math.trunc((stardate - STARDATE_START) / 100);
  const kills = killed + killed_cmd;
  const rate = elapsed >= 30 ? Math.trunc((500 * kills * 10) / elapsed) : 0;
  const rh = elapsed >= 30 ? Math.trunc(kills * 1000 / elapsed) : 0;
  return "DETAILED EVALUATION\n\nStardate " + datestr(stardate) + ", " + RANK[level] + " of the U.S.S. Lexington, command level " + level + ".\n" +
    (lost ? LOST_HOW[lost_how] : enemies_left ? "The mission is not complete." : "The sector is secured.") + "\n\n" +
    padl(rescues, 4) + "  Rescues @ 200 each ............ " + padl(lost ? 0 : rescues * 200, 6) + "\n" +
    "      Penalty for incomplete mission  " + padl(enemies_left ? -300 : 0, 6) + "\n" +
    "      Penalty for loss of ship ...... " + padl(lost ? -200 : 0, 6) + "\n" +
    padl(killed, 4) + "  Mongols killed @ 10 each ...... " + padl(killed * 10, 6) + "\n" +
    padl(killed_cmd, 4) + "  Commanders killed @ 20 each ... " + padl(killed_cmd * 20, 6) + "\n" +
    padl(enemy_bases, 4) + "  Enemy bases destroyed @ 50 each " + padl(enemy_bases * 50, 6) + "\n" +
    Math.trunc(rh / 100) + "." + pad0(rh % 100, 2) + "  Kill/day ratio @ 500 per day .. " + padl(rate, 6) + "\n" +
    padl(casualties, 4) + "  Casualties @ -1 each .......... " + padl(-casualties, 6) + "\n" +
    padl(stars_gone, 4) + "  Stars destroyed @ -5 each ..... " + padl(stars_gone * -5, 6) + "\n" +
    padl(bases_lost, 4) + "  Bases hit @ -200 each ......... " + padl(bases_lost * -200, 6) + "\n\n" +
    "      SCORE ......................... " + padl(score_total(), 6) + "\n";
}

/* ── the screen ───────────────────────────────────────── */
const SHAPE_BRICK = 0, SHAPE_HEX = 1, SHAPE_FINE = 2;
let tile_shape = SHAPE_FINE;
const TILE_W = 4, PIX_H = 4, BOARD_Y = 1;
let show_intro = 0, show_keys = 0, show_map = 0, show_log = 0, show_repair = 0, show_pools = 0, show_items = 0, show_look = 0, show_eval = 0, show_story = 0;
let ask_dir = 0, ask_confirm = 0, ask_land = 0, ask_focus = 0, ask_use = 0;
let map_cur = -1, map_digits = 0;
function put_pixel(fine, tx, gx, y, c){
  if (fine) pxq(tx * 2 + gx, y, c);
  else px(tx + gx, y, c);
}
function you_px(gx, gy, gw, gh){
  const hexed = tile_shape !== SHAPE_BRICK;
  const top = (gh >= 4 && hexed) ? 1 : 0;
  const hd = (gh - top >= 4) ? 2 : 1;
  const rest = gh - top - hd;
  const lg = rest >= 2 ? Math.trunc(rest / 2) : rest;
  const sh = rest - lg;
  if (gy < top) return -1;
  const band = gy < top + hd ? 0 : gy < top + hd + sh ? 1 : 2;
  let w = band === 0 ? Math.trunc(gw * 3 / 4) : band === 1 ? Math.trunc(gw / 2) : Math.trunc(gw * 3 / 8);
  if (w < 1) w = 1;
  const x = Math.trunc((gw - w) / 2);
  if (gx < x || gx >= x + w) return -1;
  const hull = shields_up ? 226 : 254;
  return band === 0 ? hull : band === 1 ? (shields_up ? 220 : 250) : 245;
}
function draw_cell(tx, ty, c, mark){
  const fine = tile_shape === SHAPE_FINE, hexed = tile_shape !== SHAPE_BRICK;
  const gw = fine ? TILE_W * 2 : TILE_W, gh = hexed ? PIX_H + 1 : PIX_H;
  const tip = Math.trunc(gw / 4), tipw = Math.trunc(gw / 2);
  const y0 = ty * 2 + (hexed ? 1 : 0);
  const tex = hash3u(Math.imul(quad, 7919) >>> 0, Number(SEED & 0xFFFFFFFFn) >>> 0, 3);
  let k = sec[c]; const scan = srscan();
  if (scan === 0 && c !== cell) k = C_EMPTY;
  if (scan === 1 && (IS_ENEMY(k) || k === C_POD || k === C_UNION)) k = C_EMPTY;
  const beasting = (IS_ENEMY(k) || k === C_POD || k === C_UNION) ? beast_pixels(CLASS_NAME[k], CLASS_FG[k], gw, gh) : 0;
  let planetc = 0;
  if (k === C_PLANET && GX[quad].planet >= 0){ const cls = PL[GX[quad].planet].cls; planetc = cls === 0 ? 34 : cls === 1 ? 130 : 245; }
  for (let gy = 0; gy < gh; gy++){
    let lo = 0, hi = gw;
    if (hexed && (gy === 0 || gy === gh - 1)){ lo = tip; hi = tip + tipw; }
    for (let gx = lo; gx < hi; gx++){
      const h = hash3u(tex, c, gy * 8 + gx);
      let col = 16;
      if ((h & 0xFF) < 5) col = ((h >>> 10) & 1) ? 245 : 240;
      if (c === target && (IS_ENEMY(sec[c]) || sec[c] === C_POD) && (gx === lo || gx === hi - 1 || gy === 0 || gy === gh - 1)) col = 196;
      const cx = (gw - 1) * 0.5, cy = (gh - 1) * 0.5, nx = (gx - cx) / (gw * 0.36), ny = (gy - cy) / (gh * 0.42);
      const disc = nx * nx + ny * ny <= 1.0;
      if (k === C_STAR && disc) col = ((h >>> 6) & 3) === 0 ? 231 : 226;
      if (k === C_NOVA && disc) col = ((h >>> 6) & 3) === 0 ? 88 : 52;
      if (k === C_PLANET && disc) col = ((h >>> 6) & 3) === 0 ? lighter(planetc) : planetc;
      if (k === C_BASE){ const dd = gy === Math.trunc(gh / 2) || gx === Math.trunc(gw / 2) || gx === Math.trunc(gw / 2) - 1; col = dd ? 45 : ((gx + gy) & 1) ? 39 : 24; if (gy === 0 || gy === gh - 1) col = ((gx + gy) & 1) ? 39 : 24; }
      if (beasting === 1 && bst_px[gy * BST_MAXW + gx]) col = bst_px[gy * BST_MAXW + gx];
      if (mark === 1){ const me = you_px(gx, gy, gw, gh); if (me >= 0) col = me; }
      put_pixel(fine, tx, gx, y0 + gy, col);
    }
  }
}
function draw_board(){
  for (let c = 0; c < BOARD_SIZE; c++){
    const tx = 16 + 4 * COORD_Q[c] + 2 * COORD_R[c];
    const ty = BOARD_Y + 8 + 2 * COORD_R[c];

  }
}
function condition(){

}

  text(x0, y0, line, 250, 0);
  line = "warp " + Math.trunc(warp / 10) + "." + (warp % 10) + "  lasers " + padl(laser_set, 4) + "  heat " + padl(laser_heat, 3) + "  eff " + padl(laser_eff(), 3) + "%  life " + Math.trunc(life_reserve / 1000) + "." + (Math.trunc(life_reserve / 100) % 10);
  text(x0, y0 + 1, line, 250, 0);

function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){
      if (s[p + len] === ' ') last_space = len;
      len++;
    }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}

function fb_hash(){
  let h = 2166136261 >>> 0;
  for (let row = 0; row < screen_h; row++)
    for (let col = 0; col < screen_w; col++){
      const a = FB(row, col);
      const ch = fb_ch[a] === FB_QUAD ? 1 : fb_ch[a];
      const q = fb_ch[a] === FB_QUAD ? (fb_q[a] & 15) : 0;
      const v = (fb_fg[a] | (fb_bg[a] << 8) | (q << 16) | (ch << 20)) >>> 0;
      h = Math.imul(h ^ v, 16777619) >>> 0;
      h = Math.imul(h ^ (v >>> 24), 16777619) >>> 0;
    }
  return h;
}

          let worst = -1;
          for (let i = 0; i < 7; i++) if (sys[KEY[i]] < (KEY[i] === SYS_LIFE ? 90 : 70) && (worst < 0 || sys[KEY[i]] < sys[worst])) worst = KEY[i];
          if (worst >= 0 && repair_focus !== worst + 1){ wk('F'); wk(worst < 10 ? String.fromCharCode(48 + worst) : String.fromCharCode(97 + worst - 10)); continue; }
          wk('R'); continue;
        }
      }
      if (docked === B_NONE && sys[SYS_LIFE] < 90){
        const b = base_cell();
        if (b >= 0 && GX[quad].base !== B_NONE && impulse_ok()){
          if (hex_dist(b, cell) <= 1){ wk('D'); continue; }
          if (step_toward_goal(b, 1)) continue;
        }
        if (have[I_LIFE] && life_reserve < 1000){ wk('u'); wk(String.fromCharCode(97 + I_LIFE)); continue; }
        const halves = Math.trunc((90 - sys[SYS_LIFE] + 29) / 30);
        if (halves * 500 > life_reserve - 100){
          const nb = nearest_quad(want_base_any);
          if (nb >= 0 && wset_warp(nb, shields_up)){ wwarp(nb); continue; }
        }
        if (repair_focus !== SYS_LIFE + 1){ wk('F'); wk(String.fromCharCode(48 + SYS_LIFE)); }
        wk('R'); continue;
      }
      if (docked === B_NONE && max_warp() < 30 && GX[quad].base !== B_STARBASE){
        if (repair_focus !== SYS_WARP + 1){ wk('F'); wk(String.fromCharCode(48 + SYS_WARP)); }
        wk('R'); continue;
      }
      if (needs_base()){
        if (GX[quad].base === B_STARBASE){
          const b = base_cell();
          if (b >= 0 && docked === B_NONE){
            if (hex_dist(b, cell) <= 1){ wk('D'); continue; }
            if (step_toward_goal(b, 1)) continue;
            if (!impulse_ok()){ if (repair_focus !== SYS_IMPULSE + 1){ wk('F'); wk(String.fromCharCode(48 + SYS_IMPULSE)); } wk('R'); continue; }
          }
        }
        const b = wbase();
        if (b >= 0 && b !== quad){
          const hot = wtrip_hot(b) && energy > 800;
          if ((shields_up ? 1 : 0) !== (hot ? 1 : 0) && energy > 400){ wk('s'); continue; }
          if (wset_warp(b, shields_up)){ wwarp(b); continue; }
          wk('R'); continue;
        }
        if (b < 0 && have[I_ENERGIUM] && energy < 1000 && shields < 1250){ wk('u'); wk(String.fromCharCode(97 + I_ENERGIUM)); continue; }
      }
      { const p = nearest_quad(want_planet_settled);
        if (p >= 0 && qdist16(quad, p) <= 16 * 24 && sys[SYS_TRANSPORTER] >= 100){ if (shields_up){ wk('s'); continue; } if (wset_warp(p, 0)){ wwarp(p); continue; } }
        if (GX[quad].planet >= 0 && want_planet_settled(quad) && sys[SYS_TRANSPORTER] >= 100){
          const pc = PL[GX[quad].planet].cell;
          if (shields_up){ wk('s'); continue; }
          if (orbiting >= 0){ wk('l'); wk('t'); continue; }
          if (hex_dist(pc, cell) <= 1){ wk('o'); continue; }
          if (step_toward_goal(pc, 1)) continue;
        } }
      const m = nearest_quad(want_mongols);
      if (m >= 0){
        let want_e = 1800 + 700 * GX[m].enemies;
        if (want_e > ENERGY_MAX - 400) want_e = ENERGY_MAX - 400;
        if (energy < want_e){
          const b = wbase();
          if (b >= 0 && b !== quad && GX[b].enemies === 0){ const hot = wtrip_hot(b) && energy > 800; if ((shields_up ? 1 : 0) !== (hot ? 1 : 0) && energy > 400){ wk('s'); continue; } if (wset_warp(b, shields_up)){ wwarp(b); continue; } }
          if (sys[SYS_CONVERTER] > 0 && energy < ENERGY_MAX){ wk('R'); continue; }
        }
        if (shields < 1500 && wcharge(2500)) continue;
        if (!shields_up && energy > 400){ wk('s'); continue; }
        if (wset_warp(m, shields_up)){ wwarp(m); continue; }
        wk('R'); continue;
      }
      const u = nearest_quad(want_unknown);
      if (u >= 0){
        const hot = energy > 2200 || (wtrip_hot(u) && energy > 800);
        if ((shields_up ? 1 : 0) !== (hot ? 1 : 0) && energy > 400){ wk('s'); continue; }
        if (wset_warp(u, shields_up)){ wwarp(u); continue; }
        wk('R'); continue;
      }
      if (shields_up){ wk('s'); continue; }
      if (enemies_left > 0){
        let best = -1, bd = 999999;
        for (let q = 0; q < GAL; q++) if (q !== quad && GX[q].enemies > 0){ const dd = qdist16(quad, q); if (dd < bd){ bd = dd; best = q; } }
        if (best >= 0){ GX[best].known = 1; continue; }
        wfail("Mongols left but none anywhere");
      }
      wk('.');
    }
    if (!won) wfail(lost ? LOST_HOW[lost_how] : "the mission is not over");
    walk_out.push("WALK OK: level " + level + ", " + walk_keys + " keys, " + turn + " turns, stardate " + datestr(stardate) + ", " + killed + "+" + killed_cmd + " killed, " + rescues + " rescues, " + bases_lost + " bases lost, " + casualties + " casualties, score " + score_total());
    return 1;
  } catch (e) {
    if (e instanceof WalkFail) return 0;
    throw e;
  }
}

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the briefing is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same PC speaker and
 * played as a buffer; the title music loops until the game begins. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the tune's intro once, then its loop */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("lexington.sav"),
  set: (s) => localStorage.setItem("lexington.sav", s),
};
{
  const l = parseInt(params.get("level") || "0", 10);
  start_game(params.get("seed"), 0, l >= 1 && l <= 5 ? l : 0);
}
if (SOUND.on) SOUND.command("bed title");
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("The Lexington has stood down.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: the six ways are d x z a w e as in lexington.c;
 * the arrows are east and west, and north-west and south-east; Escape
 * is escape, Enter is Enter (it warps, on the chart) */
function keyOf(e){
  if (e.key === "ArrowUp") return 'w';
  if (e.key === "ArrowDown") return 'x';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
