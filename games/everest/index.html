const M64 = (1n << 64n) - 1n;

/* ── the mountain, laid on boards ────────────────────────────── */
const RS = [];
for (let i = 0; i < ROOM_MAX; i++){
  const c = [];
  for (let k = 0; k < BOARD_SIZE; k++) c.push({ground: 0, place: -1, ch: ' '});
  RS.push({c: c, col: 0, built: 0});
}
let room_n = 0;
function row_of(c){ return COORD_R[c] + 4; }
function cell_tx(c){ return 16 + 4 * COORD_Q[c] + 2 * COORD_R[c]; }
function cell_near_slow(row, tx){
  let best = -1, bd = 1 << 30;
  for (let c = 0; c < BOARD_SIZE; c++) if (row_of(c) === row){ let d = cell_tx(c) - tx; if (d < 0) d = -d; if (d < bd){ bd = d; best = c; } }
  return best;
}
const near_cell = new Int8Array(9 * 37);
let near_ready = 0;
function cell_near(row, tx){
  if (!near_ready){ for (let rr = 0; rr < 9; rr++) for (let t = 0; t <= 36; t++) near_cell[rr * 37 + t] = cell_near_slow(rr, t); near_ready = 1; }
  if (row < 0) row = 0;
  if (row > 8) row = 8;
  if (tx < 0) tx = 0;
  if (tx > 36) tx = 36;
  return near_cell[row * 37 + tx];
}
function board_n(){ return Math.floor((CLIMB_COLS + BOARD_TILES - 1) / BOARD_TILES); }
let tr_cell = 0;
function tile_room(x, row){
  if (row < 0) row = 0;
  if (row >= BAND_ROWS) row = BAND_ROWS - 1;
  let col = Math.floor(x / BOARD_TILES);
  if (col < 0) col = 0;
  if (col >= board_n()) col = board_n() - 1;
  const tx = 2 * (x - col * BOARD_TILES) + 8;
  tr_cell = cell_near(row + 2, tx);
  return col;
}
let ct_x = 0, ct_row = 0;
function cell_tile(r, c){
  ct_x = RS[r].col * BOARD_TILES + (cell_tx(c) >> 1) - 4;
  ct_row = row_of(c) - 2;
}
function place_at(col){
  for (let i = 0; i < CAMP_N; i++) if (Math.floor((CAMP[i].feet - FOOT0) / FEET_A_COLUMN) === col) return i;
  return -1;
}
function country_of(col){
  if (col < 0) col = 0;
  if (col >= CLIMB_COLS) col = CLIMB_COLS - 1;
  switch (CLIMB_GROUND[col]){
  case 'm': return G_MORAINE;
  case 'i': return G_ICEFALL;
  case 'w': return G_CWM;
  case 'f': return G_FACE;
  case 'c': return G_COL;
  case 'r': return G_RIDGE;
  default:  return G_CREST;
  }
}
function build_board(r){
  const R = RS[r];
  if (R.built) return;
  for (let c = 0; c < BOARD_SIZE; c++){
    cell_tile(r, c);
    const x = ct_x, row = ct_row;
    const p = place_at(x);
    let g = country_of(x);
    if (row === ROUTE_ROW){
      g = G_ROUTE;
      if (p >= 0) g = G_CAMP;
    }
    R.c[c].ground = g;
    R.c[c].place = (row === ROUTE_ROW ? p : -1);
    R.c[c].ch = CLIMB_GROUND[x < 0 ? 0 : x >= CLIMB_COLS ? CLIMB_COLS - 1 : x];
  }
  R.built = 1;
}
function lay_rooms(){
  room_n = board_n();
  for (let i = 0; i < room_n && i < ROOM_MAX; i++){ RS[i].col = i; RS[i].built = 0; }
  for (let i = 0; i < room_n && i < ROOM_MAX; i++) build_board(i);
}



/* ── the expedition ───────────────────────────────────────── */
let climbers = CLIMBER_N, sherpas = SHERPA_N;
let high = 0, at = 0, bottles = 0, fit = 0, weather = 0, spent = 0;
let summited = 0, turned_back = 0, dead = 0, gameover = 0;
let day = 0;
const loads = new Int32Array(CAMP_N);
let dead_how = "";
const message = ["", "", ""];
let sound_sink = null, sound_bed = "";
function sound_say(line){ if (sound_sink) sound_sink(line); }
function sound_scene(){ const key = "off"; if (key !== sound_bed){ sound_bed = key; sound_say("bed " + key); } }
function say(s){ message[2] = message[1]; message[1] = message[0]; message[0] = s.slice(0, 159); }
function cap_msg(){ if (message[0].length && message[0][0] >= 'a' && message[0][0] <= 'z') message[0] = message[0][0].toUpperCase() + message[0].slice(1); }
function date_day(d){ let x = 12 + d; if (x <= 30) return x; x -= 30; if (x <= 31) return x; return x - 31; }
function date_month(d){ const x = 12 + d; return x <= 30 ? MONTHS[0] : x <= 61 ? MONTHS[1] : MONTHS[2]; }
function feet_now(){ return at < 0 ? FOOT0 : CAMP[at].feet; }   /* the checks put the party nowhere */
function climb_col(){ const c = Math.floor((feet_now() - FOOT0) / FEET_A_COLUMN); return c < 0 ? 0 : c >= CLIMB_COLS ? CLIMB_COLS - 1 : c; }
function monsoon_near(){ return day >= DAYS_N - 12; }
function die(how){
  if (dead) return;
  dead = 1; gameover = 1;
  dead_how = how;
  sound_say("blow toll");
  say("The expedition is over: " + how + ".");
}

/* ── the day ──────────────────────────────────────────────── */
const P_DAY = 0, P_OVER = 1;
let phase = P_DAY;
function weather_roll(){
  const hard = CAMP[at].feet >= 25000 ? 30 : CAMP[at].feet >= 22000 ? 18 : 10;
  const r = roll(0, 99);
  weather = r < hard ? 2 : r < hard + 25 ? 1 : 0;
}
function carry_rate(){
  const men = climbers + sherpas - spent;
  let r = Math.trunc(men / 3);
  if (weather === 1) r = Math.trunc(r * 2 / 3);
  if (weather === 2) r = 0;
  if (CAMP[at].feet >= 25000) r = Math.trunc(r / 2);
  if (fit < 4) r = Math.trunc(r * 3 / 4);
  return r;
}
function wear(hard){
  const r = roll(0, 99);
  if (r < hard){
    spent++;
    say("A man is worn out and goes down.  " + (climbers + sherpas - spent) + " still on the mountain.");
    if (climbers + sherpas - spent < 8) die("too few men left to carry");
  }
}
function day_end(){
  day++;
  if (day >= DAYS_N){ say("The monsoon breaks over the Western Cwm."); die("the monsoon"); phase = P_OVER; return; }
  weather_roll();
  if (weather === 2) say("A storm: nothing moves today.");
  else if (weather === 1) say("Wind on the ridge, and spindrift in the cwm.");
  if (fit < 10 && CAMP[at].feet < 22000 && roll(0, 2) === 0) fit++;
  if (CAMP[at].feet >= 25000 && fit > 0 && roll(0, 1) === 0) fit--;
  phase = P_DAY;
}
function do_carry(){
  if (weather === 2){ say("Nothing goes up in this."); day_end(); return; }
  const r = carry_rate();
  if (!r){ say("No one fit to carry today."); day_end(); return; }
  loads[high] += r;
  sound_say("step " + GROUND[country_of(climb_col())].step);
  say(r + " loads up to " + CAMP[high].name + ".  It holds " + loads[high] + ".");
  if (CAMP[high].feet >= 23000) bottles += Math.trunc(r / 3);
  wear(CAMP[high].feet >= 25000 ? 22 : 8);
  day_end();
}
function do_pitch(){
  if (high + 1 >= CAMP_N){ say("There is nothing above but the summit."); return; }
  if (loads[high] < LOAD_FULL){ say(CAMP[high].name + " is not stocked: " + loads[high] + " loads of " + LOAD_FULL + "."); return; }
  if (weather === 2){ say("Not in this weather."); return; }
  if (CAMP[high + 1].kind === CK_TOP){ say("The summit is climbed, not pitched."); return; }
  loads[high] -= LOAD_FULL;
  high++;
  loads[high] += 2;
  sound_say("blow peg");
  say(CAMP[high].name + " pitched, at " + CAMP[high].feet + " feet.");
  cap_msg();
  wear(CAMP[high].feet >= 25000 ? 25 : 10);
  day_end();
}
function do_rest(){
  say("A day in camp: brews, and the men sleep.");
  if (fit < 10) fit++;
  if (spent > 0 && CAMP[at].feet < 21000 && roll(0, 1) === 0){ spent--; say("A man comes back up, fit again."); }
  day_end();
}
function do_push(){
  if (at >= high){ say("The party is already as high as the camps go."); return; }
  if (weather === 2){ say("Nothing moves in this."); day_end(); return; }
  at++;
  sound_say("step " + GROUND[country_of(climb_col())].step);
  say("Up to " + CAMP[at].name + ", " + CAMP[at].feet + " feet.");
  cap_msg();
  if (fit < 4 && CAMP[at].feet > 22000){ say("The party is not acclimatised to this; the night is a bad one."); wear(30); }
  else wear(CAMP[at].feet >= 25000 ? 20 : 6);
  day_end();
}
function do_summit(){
  if (CAMP[at].feet < 27000){ say("The summit is not to be had from here.  Camp IX first."); return; }
  if (bottles < 4){ say("Not enough oxygen: " + bottles + " bottles, and four are wanted."); return; }
  if (weather === 2){ say("No one goes up in a storm."); day_end(); return; }
  bottles -= 4;
  if (weather === 1 || fit < 5){
    turned_back++;
    say("Wind, and the going slow.  The pair turn back at the South Summit, within three hundred feet of the top.");
    wear(35);
    day_end();
    return;
  }
  if (roll(0, 99) < 18){
    turned_back++;
    say("A valve fails, as Evans's did.  The pair turn back at the South Summit.");
    wear(35);
    day_end();
    return;
  }
  summited = 1; gameover = 1;
  at = CAMP_N - 1;
  sound_say("tune bell");
  say("Half past eleven, and the ridge runs out under their feet.  The summit of Everest.");
  phase = P_OVER;
}

/* ── the screen ───────────────────────────────────────────── */
const SHAPE_BRICK = 0, SHAPE_HEX = 1, SHAPE_FINE = 2;
let tile_shape = SHAPE_FINE;
const TILE_W = 4, PIX_H = 4, BOARD_Y = 1;
let show_keys = 0, show_intro = 0, show_story = 0;
function put_pixel(fine, tx, gx, y, c){ if (fine) pxq(tx * 2 + gx, y, c); else px(tx + gx, y, c); }
function party_px(gx, gy, gw, gh){
  const top = gh >= 4 ? 1 : 0;
  if (gy < top) return -1;
  const band = gy < top + (((gh - top) / 2) | 0) ? 0 : 1;
  const w = band === 0 ? ((gw * 3 / 8) | 0) : ((gw / 2) | 0);
  const x = ((gw - w) / 2) | 0;
  if (gx < x || gx >= x + w) return -1;
  return band === 0 ? 196 : 231;
}
function draw_cell(tx, ty, r, c, mark, lit){
  const k = RS[r].c[c];
  const G = GROUND[k.ground];
  const fine = tile_shape === SHAPE_FINE, hexed = tile_shape !== SHAPE_BRICK;
  const gw = fine ? TILE_W * 2 : TILE_W, gh = hexed ? PIX_H + 1 : PIX_H;
  const tip = (gw / 4) | 0, tipw = (gw / 2) | 0;
  const y0 = ty * 2 + (hexed ? 1 : 0);
  const tex = hash3u((r * 7919) >>> 0, Number(SEED & 0xFFFFFFFFn), 13);
  for (let gy = 0; gy < gh; gy++){
    let lo = 0, hi = gw;
    if (hexed && (gy === 0 || gy === gh - 1)){ lo = tip; hi = tip + tipw; }
    for (let gx = lo; gx < hi; gx++){
      const h = hash3u(tex, c >>> 0, (gy * 8 + gx) >>> 0);
      let col = ((h & 0xFF) < (20 + G.prom * 12)) ? G.fg : G.bg;
      if (k.ground === G_ROUTE) col = (gy === ((gh / 2) | 0)) ? 180 : G.bg;
      if (k.ground === G_CAMP) col = (gy >= 1 && gy <= gh - 2 && gx > lo && gx < hi - 1) ? 223 : G.bg;
      if (mark){ const me = party_px(gx, gy, gw, gh); if (me >= 0) col = me; }
      if (!lit) col = 16;
      put_pixel(fine, tx, gx, y0 + gy, col);
    }
  }
}
function draw_board(r){
  const a = climb_col();
  for (let c = 0; c < BOARD_SIZE; c++){
    cell_tile(r, c);
    const x = ct_x, row = ct_row;
    const tx = 16 + 4 * COORD_Q[c] + 2 * COORD_R[c];
    const ty = BOARD_Y + 8 + 2 * COORD_R[c];
    draw_cell(tx, ty, r, c, (row === ROUTE_ROW && x === a) ? 1 : 0, 1);
  }
}
function draw_strip(x0, y0, w){
  for (let i = 0; i < w; i++){
    const x = ((CLIMB_COLS * i) / w) | 0;
    const p = place_at(x);
    const g = country_of(x);
    const ch = p >= 0 ? (CAMP[p].kind === CK_TOP ? "A" : CAMP[p].kind === CK_MARK ? "*" : "C") : "-";
    text(x0 + i, y0, ch, p >= 0 ? 231 : 180, GROUND[g].bg);
  }
  const me = ((climb_col() * w) / CLIMB_COLS) | 0;
  if (me >= 0 && me < w) text(x0 + me, y0, "#", 255, 232);
}
function draw_status(x0, y0){
  text(x0, y0, date_day(day) + " " + date_month(day) + " 1953", 250, 0);
  text(x0, y0 + 1, CAMP[at].name + ", " + CAMP[at].feet + " feet", 223, 0);
  text(x0, y0 + 3, "men       loads here  bottles", 245, 0);
  text(x0, y0 + 4, padr(climbers + sherpas - spent, 9) + " " + padr(loads[high], 11) + " " + bottles, 250, 0);
  text(x0, y0 + 5, "highest             fitness", 245, 0);
  text(x0, y0 + 6, padr(CAMP[high].name.slice(0, 19), 19) + " " + fit + " of 10", 250, 0);
  text(x0, y0 + 8, "THE DAY", 223, 0);
  text(x0, y0 + 9, "1  carry loads up", weather === 2 ? 240 : 245, 0);
  text(x0, y0 + 10, "2  pitch the next camp (" + loads[high] + "/" + LOAD_FULL + ")", loads[high] >= LOAD_FULL ? 245 : 240, 0);
  text(x0, y0 + 11, "3  rest", 245, 0);
  text(x0, y0 + 12, "4  move up", at < high ? 245 : 240, 0);
  text(x0, y0 + 13, "5  go for the summit", (CAMP[at].feet >= 27000 && bottles >= 4) ? 226 : 240, 0);
  text(x0, y0 + 15, weather === 2 ? "a storm" : weather === 1 ? "wind" : "fine", weather ? 196 : 40, 0);
  if (monsoon_near()) text(x0, y0 + 16, "the monsoon is close", 196, 0);
  if (spent) text(x0, y0 + 17, spent + " men gone down", 245, 0);
}
function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){ if (s[p + len] === ' ') last_space = len; len++; }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}
function draw_page(body, foot, fg){
  const x = 1, y = 1, w = screen_w - 2, h = screen_h - 2;
  fill(x, y, w, h, 235);
  for (let c = x; c < x + w; c++){ text(c, y, " ", 250, 240); text(c, y + h - 1, " ", 250, 240); }
  for (let r = y; r < y + h; r++){ text(x, r, " ", 250, 240); text(x + w - 1, r, " ", 250, 240); }
  const lines = wrap_lines(body, w - 6, 64);
  let row = y + 1;
  for (let i = 0; i < lines.length && row < y + h - 2; i++, row++) text(x + 3, row, lines[i], i === 0 ? 223 : fg, 235);
  text(x + 3, y + h - 2, foot, 245, 235);
}
function compose_screen(){
  fb_clear();
  const col = climb_col();
  const p = place_at(col);
  let line = " Everest 1953 · " + (p >= 0 ? CAMP[p].name : GROUND[country_of(col)].name) + " · " + feet_now() + " feet";
  const when = date_day(day) + " " + date_month(day);
  { const room_for = screen_w - when.length - 2; if (line.length > room_for) line = line.slice(0, room_for); }
  text(0, 0, line, 250, 23);
  for (let x = line.length; x < screen_w; x++) text(x, 0, " ", 232, 23);
  text(screen_w - when.length - 1, 0, when, 250, 23);

  const r = tile_room(col, ROUTE_ROW), cellc = tr_cell;
  build_board(r);
  draw_board(r);
  draw_status(panel_x + 1, 1);
  draw_strip(1, screen_h - 7, screen_w - 2);
  text(1, screen_h - 6, c_bytes(" here: " + GROUND[RS[r].c[cellc].ground].name, screen_w - 1), 245, 0);
  text(1, screen_h - 5, message[2], 240, 0);
  text(1, screen_h - 4, message[1], 245, 0);
  text(1, screen_h - 3, message[0], 223, 0);
  if (!gameover) text(1, screen_h - 2, "1 carry  2 pitch  3 rest  4 move up  5 the summit", 226, 0);
  else text(1, screen_h - 2, "n tries again  q leaves", 226, 0);
  text(1, screen_h - 1, "S L save/load  T tiles  ? keys  q quit", 245, 0);
  if (show_keys) draw_page(KEYS_TEXT, "any key closes it", 250);
  else if (show_intro) draw_page(STORY[0], "any key begins        q  leave", 250);
  else if (show_story) draw_page(STORY[show_story - 1], "n  tries again        q  leave", 250);
}
function fb_hash(){
  let h = 2166136261 >>> 0;
  for (let row = 0; row < screen_h; row++)
    for (let col2 = 0; col2 < screen_w; col2++){
      const a = FB(row, col2);
      const ch = fb_ch[a] === FB_QUAD ? 1 : fb_ch[a];
      const q = fb_ch[a] === FB_QUAD ? (fb_q[a] & 15) : 0;
      const v = (fb_fg[a] | (fb_bg[a] << 8) | (q << 16) | (ch << 20)) >>> 0;
      h = Math.imul(h ^ v, 16777619) >>> 0;
      h = Math.imul(h ^ (v >>> 24), 16777619) >>> 0;
    }
  return h;
}

/* ── saving, input and the checks ─────────────────────────── */
let save_store = {get: () => null, set: (s) => {}};
function save_game(){
  const s = {magic: "southcol", seed: SEED.toString(), dice: dice_state.toString(), seedtext: SEEDTEXT,
    climbers, sherpas, high, at, bottles, fit, weather, spent, summited, turned_back,
    dead, gameover, phase, tile_shape, day, loads: Array.from(loads), dead_how, msg: message.slice()};
  try { save_store.set(JSON.stringify(s)); } catch (e) { return 0; }
  return 1;
}
function load_game(){
  let s;
  try { const j = save_store.get(); if (!j) return 0; s = JSON.parse(j); } catch (e) { return 0; }
  if (!s || s.magic !== "southcol") return 0;
  SEED = BigInt(s.seed); dice_state = BigInt(s.dice); SEEDTEXT = s.seedtext;
  climbers = s.climbers; sherpas = s.sherpas; high = s.high; at = s.at; bottles = s.bottles; fit = s.fit;
  weather = s.weather; spent = s.spent; summited = s.summited; turned_back = s.turned_back;
  dead = s.dead; gameover = s.gameover; phase = s.phase; tile_shape = s.tile_shape; day = s.day;
  for (let i = 0; i < CAMP_N; i++) loads[i] = s.loads[i];
  dead_how = s.dead_how; message[0] = s.msg[0]; message[1] = s.msg[1]; message[2] = s.msg[2];
  show_keys = show_intro = show_story = 0;
  return 1;
}
function new_game(){
  climbers = CLIMBER_N; sherpas = SHERPA_N;
  high = 0; at = 0; bottles = 0; fit = 2; weather = 0; spent = 0;
  summited = turned_back = dead = gameover = 0;
  day = 0;
  loads.fill(0);
  loads[0] = 40;
  dead_how = ""; message[0] = message[1] = message[2] = "";
  phase = P_DAY;
  show_keys = 0; show_story = 0; show_intro = 1;
  lay_rooms();
  say("12 April 1953.  Base Camp on the Khumbu glacier, and the Icefall above it.");
}
function handle_key(ch){
  const c = typeof ch === "number" ? ch : ch.charCodeAt(0);
  const key = String.fromCharCode(c);
  if (show_intro){
    if (key === 'q' || c === 27 || c === 3) return 0;
    show_intro = 0;
    return 1;
  }
  if (show_keys){ show_keys = 0; return 1; }
  switch (key){
  case 'S': say(save_game() ? "Saved." : "It would not save."); return 1;
  case 'L': say(load_game() ? "Loaded." : "There is no saved climb."); return 1;
  case 'T': tile_shape = (tile_shape + 1) % SHAPE_N; say(SHAPE_NAME[tile_shape] + " tiles."); return 1;
  case '?': show_keys = 1; return 1;
  case 'q': case '\x1b': case '\x03': case '\x04': return 0;
  default: break;
  }
  if (gameover){
    if (key === 'n'){ new_game(); show_intro = 0; return 1; }
    return 1;
  }
  switch (key){
  case '1': do_carry(); return 1;
  case '2': do_pitch(); return 1;
  case '3': do_rest(); return 1;
  case '4': do_push(); return 1;
  case '5': do_summit(); return 1;
  default: return 1;
  }
}
function start_game(seedText, dice){
  setSeed(seedText);
  dice_state = 0x243F6A8885A308D3n;
  if (dice) dice_state ^= SEED;
  else dice_state ^= (BigInt(Date.now()) * 0x9E3779B97F4A7C15n) & M64;
  new_game();
  tile_shape = SHAPE_FINE;
  grown_keep.fill(null); bst_keep.fill(null);
  sound_bed = "";
}
function legend_char(r, c){
  const k = RS[r].c[c];
  cell_tile(r, c);
  const x = ct_x, row = ct_row;
  if (at >= 0 && row === ROUTE_ROW && x === climb_col()) return '#';
  if (k.place >= 0) return CAMP[k.place].kind === CK_TOP ? 'A' : CAMP[k.place].kind === CK_MARK ? '*' : 'C';
  if (k.ground === G_ROUTE) return '-';
  if (k.ground === G_CAMP) return 'C';
  return CLIMB_GROUND[x < 0 ? 0 : x >= CLIMB_COLS ? CLIMB_COLS - 1 : x];
}
const ROWN = [5, 6, 7, 8, 9, 8, 7, 6, 5];
function print_board(out, r){
  let i = 0;
  for (let row = 0; row < 9; row++){
    let line = "   " + " ".repeat(4 - (row < 4 ? row : 8 - row));
    for (let j = 0; j < ROWN[row]; j++, i++) line += legend_char(r, i) + " ";
    out.push(line);
  }
}
function reset_statics(){
  climbers = CLIMBER_N; sherpas = SHERPA_N;
  high = 0; at = 0; bottles = 0; fit = 0; weather = 0; spent = 0;
  summited = turned_back = dead = gameover = 0;
  day = 0; loads.fill(0);
  dead_how = ""; message[0] = message[1] = message[2] = "";
  phase = P_DAY; tile_shape = SHAPE_FINE;
  show_keys = show_intro = show_story = 0;
  for (let r = 0; r < ROOM_MAX; r++) RS[r].built = 0;
  grown_keep.fill(null); bst_keep.fill(null);
}
function check_rooms(seedText, only){
  const out = [];
  setSeed(seedText);
  reset_statics();
  lay_rooms();
  at = -1;
  if (only === undefined || only === null) only = -1;
  for (let r = 0; r < room_n; r++){
    if (only >= 0 && r !== only) continue;
    out.push("");
    out.push((FOOT0 + r * BOARD_TILES * FEET_A_COLUMN) + " feet  (" + r + ")");
    print_board(out, r);
  }
  return out;
}
function keys_report(out){
  out.push("at " + at + " (" + (at >= 0 ? CAMP[at].name : "-") + ")  high " + high + "  day " + day + "  " +
           (dead ? "OVER: " : summited ? "SUMMIT" : "") + (dead ? dead_how : ""));
  out.push("men " + (climbers + sherpas - spent) + " loads " + (at >= 0 ? loads[high] : 0) + " bottles " + bottles +
           " fit " + fit + " weather " + weather + " spent " + spent + " turned " + turned_back);
  out.push("last: " + message[0]);
  out.push("      " + message[1]);
  out.push("      " + message[2]);
  screen_w = 80; screen_h = 25;
  compose_screen();
  out.push("screen " + pad0(fb_hash().toString(16), 8));
}
function check_keys(seedText, keys_in){
  const out = [];
  reset_statics();
  start_game(seedText, 1);
  show_intro = 0;
  for (let i = 0; i < keys_in.length; i++){
    if (!handle_key(keys_in[i])) break;
    if (gameover) break;
  }
  keys_report(out);
  return out;
}
function check_trail(seedText, keys_in, marks){
  const out = [];
  reset_statics();
  start_game(seedText, 1);
  show_intro = 0;
  let mi = 0, stopped = 0;
  for (let i = 0; i < keys_in.length && !stopped; i++){
    while (mi < marks.length && marks[mi] <= i){ const rep = []; keys_report(rep); out.push(rep); mi++; }
    if (!handle_key(keys_in[i])) stopped = 1;
    if (gameover) stopped = 1;
  }
  while (mi < marks.length){ const rep = []; keys_report(rep); out.push(rep); mi++; }
  return out;
}

/* ── the walk ─────────────────────────────────────────────── */
let walk_out = [], walk_keys = 0, walk_keystring = [], walk_trace = 0;
const walk_seen = ["", "", ""];
function wprint(s){
  walk_out.push(padl(day, 3) + "  " + padl(date_day(day), 2) + " " + padr(date_month(day), 5) + "  " +
    padr(CAMP[at < 0 ? 0 : at].name, 14) + " " + padl(CAMP[at < 0 ? 0 : at].feet, 5) + " ft  men " +
    padr(climbers + sherpas - spent, 3) + " loads " + padr(loads[high], 3) + " O2 " + padr(bottles, 3) + " " + s);
}
function wk(c){
  handle_key(c);
  walk_keystring[walk_keys] = c;
  walk_keys++;
  if (walk_trace) walk_out.push(padl(day, 3) + "  key " + c + "  at " + at + " high " + high + " loads " + loads[high] + " fit " + fit + " weather " + weather + " | " + message[0]);
  for (let i = 2; i >= 0; i--)
    if (message[i].length && message[i] !== walk_seen[0] && message[i] !== walk_seen[1] && message[i] !== walk_seen[2]) wprint(message[i]);
  walk_seen[0] = message[0]; walk_seen[1] = message[1]; walk_seen[2] = message[2];
}
function check_walk(seedText, trace){
  walk_out = []; walk_trace = trace ? 1 : 0; walk_keys = 0; walk_keystring = [];
  reset_statics();
  setSeed(seedText);
  dice_state = 0x243F6A8885A308D3n ^ SEED;
  new_game();
  show_intro = 0;
  walk_seen[0] = walk_seen[1] = walk_seen[2] = "";
  let guard = 0;
  while (!gameover && guard++ < 400){
    if (weather === 2){ wk('3'); continue; }
    if (CAMP[at].feet >= 27000 && bottles >= 4 && weather === 0 && fit >= 5){ wk('5'); continue; }
    if (at < high && (fit >= 5 || CAMP[at + 1].feet < 22000)){ wk('4'); continue; }
    if (fit < 5 && CAMP[at].feet < 24000){ wk('3'); continue; }
    if (loads[high] >= LOAD_FULL && high + 1 < CAMP_N && CAMP[high + 1].kind !== CK_TOP){ wk('2'); continue; }
    wk('1');
  }
  if (summited){
    walk_out.push("");
    walk_out.push("WALK OK: the summit on " + date_day(day) + " " + date_month(day) + ", day " + day + "; " +
                  (climbers + sherpas - spent) + " men still on the mountain, " + turned_back + " attempts turned back");
  } else {
    walk_out.push("");
    walk_out.push("WALK FAILED at " + CAMP[at < 0 ? 0 : at].name + " on day " + day + ": " + (dead ? dead_how : "the climb would not end"));
  }
  if (walk_trace) walk_out.push("keys " + walk_keystring.slice(0, walk_keys).join(""));
  return walk_out;
}

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same 2A03 and played
 * as a buffer; the tune loops until the next one. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the tune's intro once, then its loop */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("southcol.sav"),
  set: (s) => localStorage.setItem("southcol.sav", s),
};
start_game(params.get("seed"));
if (SOUND.on) SOUND.command("bed title");
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left the Mushroom World.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: the six ways are d x z a w e as in
 * mushroomworld.c; the arrows are left and right, and up and down the
 * way you face; Escape is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return facing ? 'e' : 'w';
  if (e.key === "ArrowDown") return facing ? 'x' : 'z';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
