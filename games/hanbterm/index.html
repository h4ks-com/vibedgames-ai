    const letter = (g.raw || tileGrain === GRAIN_LETTERS) ? data.chars[i] : 0;
    if (tileGrain === GRAIN_DEEP && view < DEPTHS){
      const child = g.address.slice(0, view).concat([i]);
      tileSource(w.board(child), boardTurnAt(view + 1, g.facing),
                 boardTurnedAt(view + 1));
    } else tileSource(null, 0, 0);
    madeSource(-1);
    grownSource(null, null);
    if (view >= DEPTHS - 1){
      if (data.ground[i] && data.ground[i].key === "road")  madeSource(94);
      if (data.ground[i] && data.ground[i].key === "floor") madeSource(58);
      if (data.item[i] && data.item[i].key === "ruin")      madeSource(240);
      if (data.item[i] && (data.item[i].key === "wall" ||
                           data.item[i].key === "building")) madeSource(145);
      const seen = w.occupants(data, i);
      if (seen.length) accent = seen[0].fg;
      /* a road with nothing standing on it is the whole cell, so it is
         laid on thicker than a scatter of bare earth */
      if (seen.length && seen[0].key === "road") accent |= 0x100;
      if (tileGrain === GRAIN_GROWN && data.plant[i] &&
          sizeVisible(data.level, data.plant[i].size))
        grownSource(g.address.slice(0, view), data.plant[i]);
    } else if (view === ROAD_DEPTH && data.road && data.road[i]){
      /* A road is a metre across and this cell is a hundred, so it is not
         the thing in the cell -- but it is the one mark people leave that
         runs far enough to be worth seeing from up here. */
      accent = THING_BY_KEY.road.fg | 0x100;
    }
    let mark = (i === g.address[view]) ? 1 : 0;
    if (!mark && routeOn){
      if (i === routeGoalCell(g, view)) mark = 3;
      else if (view === routeDepth && routeCells.indexOf(i) > 0) mark = 2;
    }
    drawTileN(tx, ty, tw, th, data.terrain[i], accent, tex, i, mark, letter);
  }
  if (view !== DEPTHS) return;
  ensureBeings(g);
  for (const b of beings){
    if (!b.alive) continue;
    const i = turnCell(b.x, -turn);
    let tx, ty;
    if (turned) [tx, ty] = turnedTileAt(i);
    else { tx = BOARD_X + 16 + 4 * COORDS[i][0] + 2 * COORDS[i][1];
           ty = BOARD_Y + 8 + 2 * COORDS[i][1]; }
    text(tx + 1, ty, b.glyph, b.fg, data.terrain[i].bg);
  }
}

/* ── the ladder, and the whole screen ────────────────────────*/
const RUNGS = "SRQPONML";
const CELL_LEVEL = "RQPONMLK";
const CELL_NAME  = ["continent","kingdom","province","borough","district",
                    "hamlet","lot","person"];
const BOARD_NAME_T = ["planet","continent","kingdom","province","borough",
                      "district","hamlet","lot"];
const SIZE_NAME_T = ["100 Mm","10 Mm","1 Mm","100 km","10 km","1 km",
                     "100 m","10 m","1 m"];
const PANEL_X = 38;

/* A rung is named for the cell chosen at that depth, which is the place
   one level down.  > is the board on screen; * the rung a step crosses a
   whole cell of.  Afoot they are the same rung, the lowest one. */
function drawLadder(g, x, y){
  const w = g.w;
  for (let depth = 0; depth < ADDRESS_LEN; depth++){
    let what;
    if (depth === DEPTHS){
      const b = w.layers(g.address.slice(0, DEPTHS), g.when);
      const gr = b.ground[g.address[DEPTHS]];
      what = "you, on " + (gr ? gr.name : "nothing");
    } else {
      what = w.nameOf(g.address.slice(0, depth + 1));
    }
    const line = CELL_LEVEL[depth] + " " + pad(CELL_NAME[depth], 9) + " " +
                 padL(SIZE_NAME_T[depth + 1], 6) + " " +
                 ALPHABET[g.address[depth] & 63] + "  " + what;
    const on = depth === g.view, walking = g.stance >= 0 && depth === g.stance;
    text(x, y + depth, line.slice(0, Math.min(63, SCREEN_W - x - 1)),
         on ? 223 : 245, 0);
    if (walking) text(x - 2, y + depth, "*", 215, 0);
    else if (on) text(x - 2, y + depth, ">", 215, 0);
  }
}
function drawScreen(g){
  fbClear();
  const w = g.w;
  g.when = gWhen(g);
  /* what you are looking at */
  let place = "";
  try { place = g.view === 0 ? w.worldName() : w.nameOf(g.address.slice(0, g.view)); }
  catch (e) { place = ""; }
  let bar = " " + place + "   " + RUNGS[g.view] + " " +
            BOARD_NAME_T[g.view] + ", cells of " + SIZE_NAME_T[g.view + 1] + " ";
  for (let x = 0; x < SCREEN_W; x++)
    text(x, 0, x < bar.length ? bar[x] : " ", 232, 180);
  /* the date sits at the right-hand end of the bar */
  let when = dateLong(g.when);
  let dx = SCREEN_W - when.length - 1;
  if (dx < bar.length + 2){ when = dateShort(g.when); dx = SCREEN_W - when.length - 1; }
  if (dx > bar.length) text(dx, 0, when, 232, 180);
  drawBoardArea(g);
  if (g.showBag) drawBag(g);
  if (!showTasks && !showKeys)
    drawGlobe(g, PANEL_X + 1, 1, SCREEN_W - PANEL_X - 2, 10, viewFrame(g),
              g.address[0]);
  if (routeOn && !showTasks){
    const rl = routeCells.length > 1
      ? "> " + routeName.slice(0, 20) + "  " + (routeCells.length - 1) +
        " of " + SIZE_NAME_T[routeDepth + 1]
      : "> " + routeName.slice(0, 28);
    text(PANEL_X + 2, 11, rl.slice(0, SCREEN_W - PANEL_X - 3),
         routeStuck ? 174 : 215, 0);
  }
  if (!showTasks && !showKeys) drawLadder(g, PANEL_X + 2, 12);
  if (showTasks) drawTasks(g);
  if (showKeys) drawKeys();

  /* what you are standing on */
  const data = g.view === 0 ? null : w.board(g.address.slice(0, g.view));
  const terr = data ? data.terrain[g.address[g.view]] : null;
  const ch = data ? data.chars[g.address[g.view]] : "a";
  let town = "";
  if (g.view >= DEPTHS - 1){
    const here = w.settlement(g.address.slice(0, DEPTHS - 1), g.when);
    const gone = here ? null : w.ruin(g.address.slice(0, DEPTHS - 1), g.when);
    if (here) town = "  ·  " + here.name + " · " + here.kind + " · " +
                     here.population + " souls · " + here.standingAt(g.when) +
                     ", " + here.ageAt(g.when) + " years old";
    else if (gone) town = "  ·  the ruins of " + gone.name + ", empty " +
                          gone.emptiedAt(g.when) + " years";
  }
  text(1, SCREEN_H - 5, " " + (terr ? terr.name : "the planet") +
       " - hanb '" + ch + "'" + (ch === "a" ? " — nothing there" : "") + town,
       252, 0);
  const lb = w.layers(g.address.slice(0, DEPTHS), g.when);
  const seen = w.occupants(lb, g.address[DEPTHS]);
  const f = data ? data.fields[g.address[g.view]] : null;
  text(1, SCREEN_H - 4, " here: " + seen.map(t => t.name).join(", ") +
       (f ? " - elevation " + Math.trunc(f.elevation) +
            "  moisture " + Math.trunc(f.moisture) +
            "  warmth " + Math.trunc(f.temperature) : ""), 245, 0);
  const alive = g.view === DEPTHS ? beings.filter(b => b.alive).length : 0;
  text(1, SCREEN_H - 3, " " + g.address.map(i => ALPHABET[i & 63]).join("") +
       " - " + g.hp + "/" + g.maxHp + " hp - carrying " + g.carried.length +
       " - " + alive + " alive" +
       " - " + (g.stance < 0 ? "afoot" : "travelling, " +
                SIZE_NAME_T[g.stance + 1] + " a step") +
       " - " + TERM_SPEED[g.speed] + " - seed " + WORLD_SEED_TEXT, 240, 0);
  text(1, SCREEN_H - 2, typing
       ? "go to: " + typing.text + "_" : (g.message || ""), 223, 0);
  text(1, SCREEN_H - 1,
       "weadzx move S out s wait <> scale , take i bag n tasks f travel ? keys q quit",
       245, 0);
}

/* ── the walker, and starting somewhere ──────────────────────
 * The same start the terminal picks: a continent with dry land on it,
 * and then down, choosing a cell above the waterline at every rung. */
function startGame(seedText){
  WORLD_SEED_TEXT = /^[0-9]+$/.test(seedText) ? seedText
                  : String(seedFromText(seedText));
  const w = new HanbWorld(WORLD_SEED_TEXT);
  const rng = new PyRandom(bytesBig(blake2b(WORLD_SEED_TEXT, 8)));
  const address = [];
  const sky = w.board([]);            /* the planet: thirty-two faces */
  const faces = [];
  for (let i = 0; i < FACES; i++)
    if (sky.fields[i].elevation >= SEA_LEVEL) faces.push(i);
  address.push(faces.length ? faces[rng._randbelow(faces.length)] : 0);
  for (let depth = 1; depth < ADDRESS_LEN; depth++){
    const b = w.board(address.slice());
    let opts = [];
    for (let i = 0; i < BOARD_SIZE; i++)
      if (b.fields[i].elevation >= SEA_LEVEL && b.terrain[i].key !== "void") opts.push(i);
    if (!opts.length)
      for (let i = 0; i < BOARD_SIZE; i++) if (b.terrain[i].key !== "void") opts.push(i);
    if (depth === DEPTHS){
      /* on the lot board, stand on something you can stand on */
      const lb = w.layers(address.slice(), 0);
      const keep = opts.filter(i => w.passable(lb, i));
      if (keep.length) opts = keep;
    }
    address.push(opts[rng._randbelow(opts.length)]);
  }
  return {w: w, address: address, view: DEPTHS, facing: 0, stance: -1,
          seconds: 0, when: EPOCH_START, raw: false, showBag: false,
          speed: 0, heldSpeed: 3,
          hp: 74, maxHp: 74, skill: 0, guard: 0, carried: [],
          message: "Nothing is here until you look at it.  Walk."};
}

/* ── a check, because a misspelt field is silent ─────────────
 * The engine is copied from hanb.html and the renderer reaches into its
 * objects by name.  A name that is wrong gives undefined, which makes a
 * NaN, which makes every comparison false -- and the picture comes out
 * blank rather than wrong, which is much harder to notice.  Three of
 * these got through by hand; this catches the fourth. */
function checkEngineFields(){
  const want = {
    "terrain": [T.grass, ["key","name","fg","bg","prominence","passable","water"]],
    "thing":   [THING_BY_KEY.road, ["key","name","fg","size","layer","cover"]],
    "fields":  [new Fields(1, 2, 3), ["elevation","moisture","temperature"]],
    "being":   [makeCreature(WILDLIFE.FOREST[0], new PyRandom(1)),
                ["name","glyph","fg","attack","dodge","danger","verb","max_hp","hp"]]
  };
  const missing = [];
  for (const [what, [obj, keys]] of Object.entries(want))
    for (const k of keys)
      if (obj === undefined || obj[k] === undefined) missing.push(what + "." + k);
  if (missing.length)
    throw new Error("the engine has no " + missing.join(", ") +
                    " -- the renderer and the engine disagree about names");
}
checkEngineFields();

/* ── the planet, drawn as a lit ball ─────────────────────────
 * A pixel at a time: unproject it onto the sphere, ask which of the
 * thirty-two faces it lands on, and light it.  The fine skin halves the
 * width of a pixel and the ball is worth having at that width too --
 * twice as many samples across it, the same down, so the terminator
 * comes out smooth rather than stepped. */
function gcross(a, b){
  return [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
}
let camTrack = true, camLat = 0, camLon = 0;
function viewFrame(g){
  if (camTrack){
    const c = PLANET[g.address[0]].n;
    camLat = Math.asin(Math.max(-1, Math.min(1, c[2])));
    camLon = Math.atan2(c[1], c[0]);
  }
  const la = Math.max(-1.48, Math.min(1.48, camLat));
  const n = [Math.cos(la) * Math.cos(camLon),
             Math.cos(la) * Math.sin(camLon),
             Math.sin(la)];
  const u = norm3(gcross([0, 0, 1], n));        /* east, along the screen */
  const v = gcross(u, n);                       /* south, so y runs down */
  return {n: n, u: u, v: v};
}
function drawGlobe(g, x0, y0, w, rows, F, here){
  const sky = g.w.board([]);
  const fine = tileShape === SHAPE_FINE, sx = fine ? 2 : 1;
  const cx = (x0 + w / 2.0) * sx, cy = y0 * 2 + rows;
  const R = Math.min(w / 2.0, rows) - 0.5;
  const light = [0, 1, 2].map(k => F.n[k] * 0.78 - F.u[k] * 0.42 - F.v[k] * 0.46);
  for (let y = y0 * 2; y < (y0 + rows) * 2; y++)
    for (let x = x0 * sx; x < (x0 + w) * sx; x++){
      const nx = (x - cx) / (R * sx), ny = (y - cy) / R;
      const d2 = nx * nx + ny * ny;
      if (d2 > 1.0) continue;
      const nz = Math.sqrt(1.0 - d2);
      const p = [0, 1, 2].map(k => F.n[k] * nz + F.u[k] * nx + F.v[k] * ny);
      let best = 0, bd = -2.0;
      for (let j = 0; j < FACES; j++){
        const d = dot3(p, PLANET[j].n);
        if (d > bd){ bd = d; best = j; }
      }
      let lam = dot3(p, light);
      if (lam < 0.15) lam = 0.15;
      const terr = sky.terrain[best];
      let c = terr.bg;
      if (sky.fields[best].elevation >= SEA_LEVEL) c = terr.fg;
      if (best === here){ c = shade(c, 1.0); lam = lam * 0.6 + 0.5; }
      const lit = shade(c, 0.45 + 0.55 * lam);
      if (fine) pxq(x, y, lit); else px(x, y, lit);
    }
}

/* ── walking ─────────────────────────────────────────────────
 * The keys are in your frame and the lattice is in the face's, so a key
 * is turned by how far you are facing before it becomes a direction.  You
 * walk on the board you stand on and not the one you are looking at, so a
 * step brings the view back to it.  And what a stride costs is what it
 * costs on good going: rough ground costs more of it, a road least. */
const KEY_DIR = {w: "NW", e: "NE", a: "W", d: "E", z: "SW", x: "SE"};
const walkDepth = g => (g.stance < 0 ? DEPTHS : g.stance);
const gWhen = g => { g.w.now = EPOCH_START + g.seconds; return g.w.now; };
const strideAt = depth => Math.pow(LADDER, DEPTHS - depth);

function moveDir(g, key){
  const depth = walkDepth(g);
  g.view = depth;
  const dir = turnDir(KEY_DIR[key], g.facing);
  const next = g.w.step(g.address.slice(0, depth).concat(
                          g.address.slice(depth)), dir, depth);
  if (!next){ g.message = "That is the edge of the planet."; return; }
  const board = depth === DEPTHS ? g.w.layers(next.slice(0, DEPTHS), gWhen(g))
                                 : g.w.board(next.slice(0, depth));
  if (depth === DEPTHS){
    const same = next.slice(0, DEPTHS).join(",") ===
                 g.address.slice(0, DEPTHS).join(",");
    if (same){
      ensureBeings(g);
      const other = beingAt(next[DEPTHS]);
      if (other){ strike(g, other); creatureTurns(g); g.seconds += 2.0; return; }
    }
    if (!g.w.passable(board, next[DEPTHS])){
      const b = g.w.blocker(board, next[DEPTHS]);
      g.message = (b ? b.name : "Something") + " is in the way.";
      g.message = g.message[0].toUpperCase() + g.message.slice(1);
      return;
    }
  } else if (!board.terrain[next[depth]].passable){
    g.message = board.terrain[next[depth]].name +
                " lies that way.  You would need a boat.";
    g.message = g.message[0].toUpperCase() + g.message.slice(1);
    return;
  }
  if (depth === ROAD_DEPTH) g.w.roadsFor(board, gWhen(g));
  g.seconds += strideAt(depth) * Math.max(0.2, goingAt(board, next[depth]));
  g.address = next;
  g.message = "";
  if (depth === DEPTHS){ ensureBeings(g); creatureTurns(g); }
  else settleHere(g);
  questCheck(g);
}
/* The position is the truth and the address is a reading of it: after a
   long stride, step across to a cell you can stand on rather than
   jumping to its address. */
function settleHere(g){
  const b = g.w.layers(g.address.slice(0, DEPTHS), gWhen(g));
  if (g.w.passable(b, g.address[DEPTHS])) return;
  let best = -1, bd = 99;
  for (let i = 0; i < BOARD_SIZE; i++){
    if (!g.w.passable(b, i)) continue;
    const d = hexDistance(COORDS[i], COORDS[g.address[DEPTHS]]);
    if (d < bd){ bd = d; best = i; }
  }
  if (best >= 0) g.address[DEPTHS] = best;
  else g.message = "Nothing to stand on here.  You are at sea.";
}
/* what is underfoot, into the bag */
function takeHere(g){
  const b = g.w.layers(g.address.slice(0, DEPTHS), gWhen(g));
  const i = g.address[DEPTHS], t = b.item[i];
  if (!t){ g.message = "There is nothing here to pick up."; return; }
  if (!t.portable){
    g.message = t.name + " is not something you can carry.";
    g.message = g.message[0].toUpperCase() + g.message.slice(1);
    return;
  }
  if (g.carried.length >= 8){ g.message = "You cannot carry any more."; return; }
  g.carried.push(t);
  g.w.takeItem(g.address.slice(0, ADDRESS_LEN), gWhen(g));
  g.seconds += 2.0;
  g.message = "You pick up " + t.name + ". (item, size " + t.size + ")";
}
function gameKey(g, k){
  if (typing){
    if (k === "Enter"){ typedAddress(g, typing.walk); typing = null; return true; }
    if (k === "Escape"){ typing = null; g.message = ""; return true; }
    if (k === "Backspace"){ typing.text = typing.text.slice(0, -1); return true; }
    if (k.length === 1 && ALPHABET.indexOf(k) >= 0 &&
        typing.text.length < ADDRESS_LEN) typing.text += k;
    return true;
  }
  if (KEY_DIR[k]) { moveDir(g, k); return true; }
  if (k === "s"){ g.seconds += strideAt(DEPTHS); g.message = "You wait."; return true; }
  if (k === "S"){
    if (g.stance < 0){
      g.stance = DEPTHS - 2; g.view = g.stance;
      g.message = "You set out.  A step is " + SIZE_NAME_T[g.stance + 1] +
                  " of country.  < and > change your stride; S stops you.";
    } else { g.stance = -1; g.view = DEPTHS; g.message = "You stop."; }
    return true;
  }
  if (k === "<"){ if (g.stance < 0) g.view = Math.max(0, g.view - 1);
                  else { g.stance = Math.max(1, g.stance - 1); g.view = g.stance; }
                  return true; }
  if (k === ">"){ if (g.stance < 0) g.view = Math.min(DEPTHS, g.view + 1);
                  else { g.stance = Math.min(DEPTHS - 1, g.stance + 1); g.view = g.stance; }
                  return true; }
  if (k === "t"){ tileShape = (tileShape + 1) % 3;
                  g.message = "Tiles: " + SHAPE_NAME[tileShape] + "."; return true; }
  if (k === "T"){ tileGrain = (tileGrain + 1) % 4;
                  g.message = "Grain: " + GRAIN_NAME[tileGrain] + "."; return true; }
  if (k === "v"){ g.raw = !g.raw; return true; }
  if (k === ","){ takeHere(g); return true; }
  if (k === "i"){ g.showBag = !g.showBag; return true; }
  if (k === "n"){ showTasks = !showTasks; if (showTasks) townOffer(g, gWhen(g));
                  return true; }
  if (k === "y"){ takeOffer(g); return true; }
  if (k === "f"){
    /* follow it: it stops when you arrive, when the way runs out, or when
       something hostile is close */
    for (let i = 0; i < 200; i++){
      if (!routeStep(g)) break;
      questCheck(g);
      ensureBeings(g);
      if (beings.some(b => b.alive && b.hostile &&
          hexDistance(COORDS[b.x], COORDS[g.address[DEPTHS]]) <= 2)) break;
      if (!routeOn) break;
    }
    if (routeOn && routeTarget.join(",") === g.address.join(","))
      { g.message = "You arrive."; clearRoute(); }
    return true;
  }
  if (k >= "1" && k <= "6"){
    const i = k.charCodeAt(0) - 49;
    if (quests[i] && quests[i].stage !== 2){ activeQuest = i; routeToQuest(g, i);
      g.message = "The way is set to " + routeName + "."; }
    else g.message = "There is no such task.";
    return true;
  }
  if (k === "0"){ activeQuest = -1; clearRoute(); g.message = "No way set."; return true; }
  if (k === "?"){ showKeys = !showKeys; return true; }
  if (k === "g" || k === "F"){ typing = {text: "", walk: k === "F"}; return true; }
  if (k === "D"){ dropHere(g); return true; }
  if (k === "["){ g.speed = Math.max(0, g.speed - 1);
                  g.message = "The world runs " + TERM_SPEED[g.speed] + "."; return true; }
  if (k === "]"){ g.speed = Math.min(5, g.speed + 1);
                  g.message = "The world runs " + TERM_SPEED[g.speed] + "."; return true; }
  if (k === "p"){ if (g.speed){ g.heldSpeed = g.speed; g.speed = 0; }
                  else g.speed = g.heldSpeed || 3;
                  g.message = "The world runs " + TERM_SPEED[g.speed] + "."; return true; }
  if (k === "o"){ camTrack = true; return true; }
  if (k === "h"){ camTrack = false; camLon -= 0.3; return true; }
  if (k === "l"){ camTrack = false; camLon += 0.3; return true; }
  if (k === "j"){ camTrack = false; camLat -= 0.2; return true; }
  if (k === "k"){ camTrack = false; camLat += 0.2; return true; }
  return false;
}

/* ── plants, grown ───────────────────────────────────────────
 * The fourth grain.  A plant is a row of THINGS with one colour on it,
 * and until now that colour was the whole of what reached the screen.
 * This grows the plant instead -- nine productions of an L-system and a
 * turtle, into the sixteen or thirty-two pixels the cell has got -- and
 * draws the genome from the cell's own path, so no two shrubs on a board
 * are the same shrub.
 *
 *   axiom            A
 *   A (upright)  ->  F[+B][-B]A        A (forked)  ->  F[+A][-A]T
 *   A (alternate)->  F[+B]F[-B]A       A (rosette) ->  [+++B][+B][-B][---B]
 *   B            ->  F[+L][-L]T   or   F T
 *   T            ->  L | [O] | [Q] | L[O]
 *
 * F stem  + - turn  [ ] push and pop  L leaf  O flower  Q fruit.  The
 * variety is the numbers underneath, not the productions. */
const GROW_HABIT = ["F[+B][-B]A", "F[+B]F[-B]A", "F[+A][-A]T",
                    "[+++B][+B][-B][---B]"];
const GROW_TIP = ["L", "[O]", "[Q]", "L[O]"];
/* a flower is one of the colours flowers are, not one of the two hundred
   and sixteen the cube has got */
const BLOOM = [231, 230, 228, 226, 220, 214, 211, 213, 219, 183, 177, 168, 203, 197];
const BERRY = [124, 160, 196, 130, 166, 100, 92, 54, 52];

const growDraw = (path, cell, tag, i) =>
  (noiseAt(path, cell, tag.slice(0, 6) + i) + 1.0) * 0.5;

function growGenome(path, cell, thing, tIndex){
  const base = tIndex * 16, d = (tag) => growDraw(path, cell, tag, base);
  const g = {};
  g.habit = Math.floor(d("hab") * 4);
  /* Most things are in leaf most of the time.  Drawing the tip evenly put
     a flower on a quarter of everything and a hillside came out as
     confetti. */
  const t = d("tip");
  g.tip = t < 0.58 ? 0 : t < 0.80 ? 1 : t < 0.90 ? 2 : 3;
  g.leafy = d("lfy") < 0.62;
  g.alt = g.habit === 1;
  g.angle = (12.0 + d("ang") * 34.0) * Math.PI / 180.0;
  g.seg = 2.4 + d("seg") * 3.6;
  g.taper = 0.62 + d("tap") * 0.32;
  g.wob = d("wob") * 0.34;
  g.leafLen = g.seg * (0.55 + d("lln") * 1.15);
  g.leafWide = g.leafLen * (0.16 + d("lwd") * 0.36);
  g.flowerR = g.seg * (0.30 + d("flr") * 0.55);
  g.fruitR = g.seg * (0.20 + d("frr") * 0.35);
  g.petals = 3 + Math.floor(d("pet") * 6);
  /* The colours stay near the ones the table already gives the thing, so
     a stand of grass is still a stand of grass and not a riot. */
  g.leafC = thing.fg;
  g.stemC = 58 + Math.floor(d("stm") * 4) * 6;
  g.flowerC = BLOOM[Math.floor(d("flc") * 14)];
  g.eyeC = 226;
  g.fruitC = BERRY[Math.floor(d("frc") * 9)];
  return g;
}
function growString(g, age){
  let s = "A";
  for (let step = 0; step < age; step++){
    let out = "";
    for (const c of s){
      let rep = null;
      if (c === "A") rep = GROW_HABIT[g.habit];
      else if (c === "B") rep = "F" + (g.leafy ? "[+L][-L]" : "") + "T";
      else if (c === "T") rep = GROW_TIP[g.tip];
      out += rep !== null ? rep : c;
      if (out.length > 4000) break;
    }
    s = out;
  }
  return s;
}
/* The turtle draws into the cell's own little grid, twice: once to find
   out how big the plant came out, once at whatever scale stands it in the
   tile.  That is what lets one genome be a four-pixel tile and a plate. */
const growPx = [];
for (let y = 0; y < 8; y++) growPx.push(new Uint8Array(16));
let growW = 0, growH = 0, growMeasuring = false;
let growSc = 1, growOx = 0, growOy = 0, gbx0 = 0, gby0 = 0, gbx1 = 0, gby1 = 0;

function growDot(cx, cy, r, c){
  if (growMeasuring){
    if (cx - r < gbx0) gbx0 = cx - r;
    if (cx + r > gbx1) gbx1 = cx + r;
    if (cy - r < gby0) gby0 = cy - r;
    if (cy + r > gby1) gby1 = cy + r;
    return;
  }
  cx = growOx + cx * growSc; cy = growOy + cy * growSc; r *= growSc;
  if (r < 0.42) r = 0.42;
  for (let y = Math.floor(cy - r); y <= Math.ceil(cy + r); y++)
    for (let x = Math.floor(cx - r); x <= Math.ceil(cx + r); x++){
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      if (dx*dx + dy*dy <= r*r && x >= 0 && x < growW && y >= 0 && y < growH &&
          y < 8 && x < 16)
        growPx[y][x] = c;
    }
}
function growStroke(x0, y0, x1, y1, t, c){
  const dx = x1 - x0, dy = y1 - y0;
  const n = Math.floor((Math.abs(dx) + Math.abs(dy)) *
                       (growMeasuring ? 1.0 : growSc)) * 2 + 1;
  for (let i = 0; i <= n; i++) growDot(x0 + dx*i/n, y0 + dy*i/n, t * 0.5, c);
}
function growWalk(g, s, path, cell){
  const st = [];
  let t = {x: 0, y: 0, a: -Math.PI / 2, depth: 0}, node = 0, side = 1;
  for (const c of s){
    if (c === "F"){
      const len = g.seg * Math.pow(g.taper, t.depth);
      let th = 1.6 * Math.pow(0.72, t.depth);
      if (th < 0.9) th = 0.9;
      t.a += (growDraw(path, cell, "wb", node++) - 0.5) * 2.0 * g.wob;
      const nx = t.x + Math.cos(t.a) * len, ny = t.y + Math.sin(t.a) * len;
      growStroke(t.x, t.y, nx, ny, th, g.stemC);
      t.x = nx; t.y = ny;
    } else if (c === "+") t.a -= g.angle * side;
    else if (c === "-") t.a += g.angle * side;
    else if (c === "["){ st.push({x: t.x, y: t.y, a: t.a, depth: t.depth}); t.depth++; }
    else if (c === "]"){
      if (st.length){ const p = st.pop(); t.x = p.x; t.y = p.y; t.a = p.a; t.depth = p.depth; }
      if (g.alt) side = -side;
    } else if (c === "L"){
      const ll = g.leafLen * Math.pow(0.86, t.depth);
      const lw = g.leafWide * Math.pow(0.86, t.depth);
      for (let i = 0; i <= 8; i++){
        const f = i / 8.0, w = lw * Math.pow(Math.sin(Math.PI * f), 0.75);
        growDot(t.x + Math.cos(t.a)*ll*f, t.y + Math.sin(t.a)*ll*f,
                w < 0.4 ? 0.4 : w, g.leafC);
      }
    } else if (c === "O"){
      const r = g.flowerR * Math.pow(0.9, t.depth);
      for (let k = 0; k < g.petals; k++){
        const a = t.a + 2.0 * Math.PI * k / g.petals;
        growDot(t.x + Math.cos(a)*r*0.8, t.y + Math.sin(a)*r*0.8,
                r * 0.45 + 0.3, g.flowerC);
      }
      growDot(t.x, t.y, r * 0.34 + 0.3, g.eyeC);
    } else if (c === "Q"){
      growDot(t.x + Math.cos(t.a) * g.fruitR * 1.4,
              t.y + Math.sin(t.a) * g.fruitR * 1.4, g.fruitR, g.fruitC);
    }
  }
}
/* Growing a plant is much the dearest thing a tile can be asked to do,
   and a board is redrawn far more often than it changes -- so the pixels
   are kept, keyed on the cell they were grown for. */
const grownKeep = new Map();
function growTile(path, level, cell, thing, w, h){
  if (!thing || thing.layer !== "plant") return false;
  if (w > 16 || h > 8) return false;
  const key = path.join(",") + "/" + cell + "/" + thing.key + "/" + w + "x" + h;
  const hit = grownKeep.get(key);
  if (hit){ for (let y = 0; y < 8; y++) growPx[y].set(hit[y]); return true; }
  const tIndex = THINGS.indexOf(thing);
  const g = growGenome(path, cell, thing, tIndex);
  /* how far along the alphabet the thing is above the smallest visible
     size, which is as good an age as a plant needs */
  const age = 2 + (ALPHABET.indexOf(thing.size) % 3);
  const s = growString(g, age);
  growW = w; growH = h;
  for (let y = 0; y < 8; y++) growPx[y].fill(0);
  growMeasuring = true;
  gbx0 = gby0 = 1e9; gbx1 = gby1 = -1e9;
  growSc = 1.0; growOx = growOy = 0.0;
  growWalk(g, s, path, cell);
  growMeasuring = false;
  let bw = gbx1 - gbx0, bh = gby1 - gby0;
  if (!(bw > 1e-6)) bw = 1.0;
  if (!(bh > 1e-6)) bh = 1.0;
  /* Not the whole tile: a plant standing in a cell is not the cell, and
     the ground it stands on has to stay visible round it. */
  const sx = w * 0.70 / bw, sy = (h - 0.4) * 0.82 / bh;
  growSc = sx < sy ? sx : sy;
  growOx = w * 0.5 - (gbx0 + gbx1) * 0.5 * growSc;
  growOy = h - 0.7 - gby1 * growSc;
  growWalk(g, s, path, cell);
  if (grownKeep.size > 512) grownKeep.clear();
  grownKeep.set(key, growPx.map(r => r.slice()));
  return true;
}

/* ── what else is on the lot ─────────────────────────────────
 * The terminal's wildlife, which is not the browser's: hanb.c puts beasts
 * on a lot and no townspeople, off a salt of its own, so this is its own
 * layer and not the engine's denizens().  The tables are the same ones,
 * in the same order, so a wolf is the same wolf. */
const MAX_BEINGS = 24;
let beings = [], beingsPath = null, beingsEpoch = null;

function spawnBeings(g){
  const path = g.address.slice(0, DEPTHS);
  const data = g.w.layers(path, gWhen(g));
  const ep = layerEpoch("animal", cellLevel(DEPTHS), gWhen(g));
  beings = []; beingsPath = path.join(","); beingsEpoch = ep;
  const table = WILDLIFE[WILDLIFE_FOR[data.terrain[CENTRE].key]];
  if (!table) return;
  const rng = rngFor(path, "L" + ep);
  const groups = rng.randint(0, 3);
  for (let gi = 0; gi < groups; gi++){
    const k = table[rng._randbelow(table.length)];
    const many = rng.randint(k[7][0], k[7][1]);
    for (let m = 0; m < many; m++){
      /* somewhere free to stand: not the player's cell, not taken */
      const opts = [];
      for (let i = 0; i < BOARD_SIZE; i++){
        if (!g.w.passable(data, i) || i === g.address[DEPTHS]) continue;
        if (beings.some(b => b.x === i)) continue;
        opts.push(i);
      }
      if (!opts.length || beings.length >= MAX_BEINGS) return;
      const spot = opts[rng._randbelow(opts.length)];
      const b = makeCreature(k, rng);
      b.hostile = b.danger >= 3 || (b.danger === 2 && rng.random() < 0.4);
      b.x = spot; b.dead = false; b.fleeing = false;
      beings.push(b);
    }
  }
}
function ensureBeings(g){
  const ep = layerEpoch("animal", cellLevel(DEPTHS), gWhen(g));
  if (beingsPath === g.address.slice(0, DEPTHS).join(",") && beingsEpoch === ep)
    return;
  spawnBeings(g);
}
const beingAt = i => beings.find(b => b.alive && b.x === i) || null;

/* A little generator of its own for the blow-by-blow, so that fighting
   does not disturb the stream the world is made from. */
let fightState = 0x2545f491 >>> 0;
function fightNext(){
  let s = fightState;
  s = (s ^ (s << 13)) >>> 0;
  s = (s ^ (s >>> 17)) >>> 0;
  s = (s ^ (s << 5)) >>> 0;
  fightState = s;
  return s;
}
const fightRange = (lo, hi) => hi <= lo ? lo : lo + (fightNext() % (hi - lo + 1));
const BODY = ["head", "upper body", "lower body", "left arm", "right arm",
              "left leg", "right leg", "throat"];
const WEAPON_HURT = {"a sword":13, "an axe":14, "a dagger":7, "a knife":6,
                 "a rock":5, "a bone":4};
function weaponDamage(g){
  let best = 3, name = "your fists";               /* fists */
  for (const t of g.carried){
    const d = WEAPON_HURT[t.name] || 0;
    if (d > best){ best = d; name = t.name; }
  }
  return [best, name];
}
function strike(g, b){
  const [dmgBase, wname] = weaponDamage(g);
  const roll = fightRange(1, 20) + Math.trunc(11 / 3) + g.skill;
  const evade = b.dodge + fightRange(0, 4);
  if (roll <= evade){
    g.message = "You swing " + wname + " at the " + b.name + ", but it dodges away.";
    return;
  }
  let damage = fightRange(Math.trunc(dmgBase / 2), dmgBase) +
               Math.trunc(11 / 4) - fightRange(0, 2);
  if (damage < 1) damage = 1;
  const crit = roll >= evade + 12;
  if (crit) damage = Math.trunc(damage * 1.6);
  b.hp -= damage;
  const part = BODY[fightNext() % 8];
  if (b.hp <= 0){
    b.dead = true;               /* `alive` is a getter over this one */
    questKilled(g);
    g.message = "You strike the " + b.name + " in the " + part + ". It is dead.";
  } else {
    g.message = "You strike the " + b.name + " in the " + part + "." +
                (crit ? "  A critical hit!" : "");
    b.hostile = true;
    if (b.danger === 0) b.fleeing = true;
  }
}
function creatureTurns(g){
  const bd = g.w.layers(g.address.slice(0, DEPTHS), gWhen(g));
  const here = g.address[DEPTHS];
  for (const b of beings){
    if (!b.alive) continue;
    if (b.hp < b.max_hp * 0.35) b.fleeing = true;      /* it wants out */
    const d = hexDistance(COORDS[b.x], COORDS[here]);
    if (b.hostile && !b.fleeing && d <= 1){
      const roll = fightRange(1, 20) + Math.trunc(b.attack / 3);
      const evade = 7 + g.guard + fightRange(0, 4);
      if (roll <= evade){
        g.message = "The " + b.name + " " + b.verb + " you, but you dodge away.";
      } else {
        let damage = fightRange(Math.trunc(b.attack / 2), b.attack) - fightRange(0, 2);
        if (damage < 1) damage = 1;
        g.hp -= damage;
        g.message = "The " + b.name + " " + b.verb + " you in the " +
                    BODY[fightNext() % 8] + ".";
      }
      continue;
    }
    const want = (b.hostile && !b.fleeing && d <= 4) ? 1
               : (b.fleeing ? -1 : ((fightNext() % 100) < 35 ? 0 : 2));
    if (want === 2) continue;
    let best = b.x, bd2 = want < 0 ? -1 : 99;
    for (let k = 0; k < 6; k++){
      const j = cellAt(COORDS[b.x][0] + DIRS[k][1], COORDS[b.x][1] + DIRS[k][2]);
      if (j < 0 || j === here || !g.w.passable(bd, j)) continue;
      if (beingAt(j)) continue;
      const dd = hexDistance(COORDS[j], COORDS[here]);
      if (want > 0 && dd < bd2){ bd2 = dd; best = j; }
      else if (want < 0 && dd > bd2){ bd2 = dd; best = j; }
      else if (want === 0){ best = j; break; }
    }
    b.x = best;
  }
}

/* What you are carrying, over the board. */
function drawBag(g){
  const x = 4, y = 3, w = 30;
  for (let r = y; r < y + 12; r++)
    for (let c = x; c < x + w; c++) text(c, r, " ", 250, 234);
  text(x + 2, y + 1, "WHAT YOU ARE CARRYING", 223, 234);
  if (g.skill || g.guard)
    text(x + 2, y + 9, "your arm +" + g.skill + ", your guard +" + g.guard,
         215, 234);
  if (!g.carried.length){
    text(x + 2, y + 3, "Nothing yet.  Things lie", 245, 234);
    text(x + 2, y + 4, "about: a rock, a bone, now", 245, 234);
    text(x + 2, y + 5, "and then a coin or a blade.", 245, 234);
    text(x + 2, y + 7, ", picks up what is underfoot", 215, 234);
  } else {
    for (let i = 0; i < g.carried.length && i < 8; i++)
      text(x + 2, y + 3 + i,
           pad(g.carried[i].name, 22) + " " + g.carried[i].size, 252, 234);
  }
}
/* A kill may be the point of somebody's errand. */
function questKilled(g){
  for (const q of quests){
    if (!q || q.stage !== 0 || q.kind !== Q_SLAY) continue;
    let same = true;
    for (let i = 0; i < GOAL_N; i++) if (g.address[i] !== q.goal[i]) same = false;
    if (same) q.got++;
  }
}
/* What you have to do: the whole width, the way the terminal draws it. */
function drawTasks(g){
  const x = 0, y = 2, w = SCREEN_W, h = 17;
  for (let r = y; r < y + h; r++)
    for (let c = x; c < x + w; c++) text(c, r, " ", 250, 234);
  text(x + 2, y + 1, "WHAT YOU HAVE TO DO", 223, 234);
  let row = y + 3, any = false;
  for (let i = 0; i < quests.length; i++){
    const q = quests[i];
    if (!q) continue;
    any = true;
    const how = q.stage === 2 ? "done" : q.stage === 1 ? "owed you" : "";
    const tail = (q.stage === 0 && q.kind === Q_SLAY)
               ? q.got + " of " + q.need : how;
    text(x + 2, row, (i + 1) + " " + pad(q.line.slice(0, 48), 48) + " " + tail,
         i === activeQuest ? 223 : 250, 234);
    text(x + 2, row + 1, "   for " + pad(rewardText(q).slice(0, 40), 40) + "  " +
         (q.stage === 2 ? "" : q.townName.slice(0, 24)), 245, 234);
    row += 2;
    if (row > y + h - 6) break;
  }
  if (!any) text(x + 2, row, "Nothing yet.  Towns want things done.", 245, 234);
  row = y + h - 5;
  const o = townOffer(g, gWhen(g));
  if (o){
    const taken = quests.some(q => q && q.epoch === o.epoch && q.town === o.town);
    text(x + 2, row, o.townName.slice(0, 52) + " wants somebody to", 215, 234);
    text(x + 2, row + 1, "  " + o.line.slice(0, 68), 223, 234);
    text(x + 2, row + 2, "  and will give you " + rewardText(o).slice(0, 48), 223, 234);
    text(x + 2, row + 3, taken ? "you have taken this on already" : "y takes it on",
         245, 234);
  } else {
    text(x + 2, row + 2, "Nobody here wants anything of you.", 245, 234);
  }
  text(x + 2, y + h - 1, "1-6 sets the way to a task    f follows it", 245, 234);
}
/* The world runs whether or not you do -- or it holds still, which is
   what it does to begin with. */
/* SPEEDS is the engine's own and identical to the C's; the wording is
   not -- the browser spells them out and the terminal does not. */
const TERM_SPEED = ["turn-based", "real time", "a minute a second",
                    "1095x - three years a day", "10950x", "109500x"];
/* what you carry, back onto the ground */
function dropHere(g){
  if (!g.carried.length){
    g.message = "You are carrying nothing you could put down."; return;
  }
  const t = g.carried.pop();
  g.w.dropItem(g.address.slice(0, ADDRESS_LEN), t, gWhen(g));
  g.seconds += 2.0;
  g.message = "You put down " + t.name + ". It will be here when you come back.";
}

/* ── going somewhere by name ─────────────────────────────────*/
let showKeys = false, typing = null;
const KEYS_HELP = [
  "w e a d z x   move, six ways",
  "S             set out, or stop: a step becomes a whole coarse cell",
  "s             wait where you are",
  "< >           the scale you look at, or the length of your stride",
  ", D           pick up what is here, put down what you carry",
  "i n           what you carry, what you have to do",
  "y             take on what the town here wants",
  "f             follow the way that is planned",
  "F g           walk to an address, or go there at once",
  "1-6           set the way to one of your tasks   0 clears it",
  "h j k l  o    turn the planet, and let it follow you again",
  "t T           the shape of a tile, and what fills it",
  "v             the hanb character of every cell",
  "[ ] p         slower, faster, hold the world still",
  "? q           this, and out"
];
function drawKeys(){
  const n = KEYS_HELP.length, x = 0, y = 2, w = SCREEN_W, h = n + 4;
  for (let r = y; r < y + h; r++)
    for (let c = x; c < x + w; c++) text(c, r, " ", 250, 234);
  text(x + 2, y + 1, "KEYS", 223, 234);
  for (let i = 0; i < n; i++) text(x + 2, y + 3 + i, KEYS_HELP[i], 250, 234);
}
/* g goes to an address at once; F walks to it. */
function typedAddress(g, walk){
  const s = typing.text;
  if (s.length !== ADDRESS_LEN){
    g.message = "An address is " + ADDRESS_LEN + " hanb characters.";
    return;
  }
  const out = [];
  for (const c of s){
    const i = ALPHABET.indexOf(c);
    if (i < 0 || i >= (out.length ? BOARD_SIZE : FACES)){
      g.message = "That is not an address.";
      return;
    }
    out.push(i);
  }
  if (walk){ setRoute(g, out, s); g.message = "The way is set to " + s + "."; }
  else {
    g.address = out;
    g.stance = -1; g.view = DEPTHS;
    settleHere(g);
    g.message = "You are there.";
    questCheck(g);
  }
}

/* ── what towns want ─────────────────────────────────────────
 * A want is a function of the place, like everything else: a town's need
 * is drawn on its path and a four-month epoch, so it is stable while you
 * work on it and different next year, and no council is simulated. */
LIFE_OFFSET.need = 15;                 /* ~ four months, on the same ladder */
const MAX_QUESTS = 6;
const Q_SLAY = 0, Q_FETCH = 1, Q_REACH = 2;
const R_ITEM = 0, R_HEART = 1, R_SKILL = 2, R_GUARD = 3;
const SITE_N = DEPTHS - 1, GOAL_IDX = DEPTHS - 3, GOAL_N = DEPTHS - 2;
const ASK_NAMES = ["a coin","a ring","a knife","a dagger","a sword","an axe",
                   "a shield","a cup","a bone","a rock","a glass bead","a potsherd"];
const GIFT_NAMES = ["a sword","an axe","a dagger","a shield","a ring","a cup","a knife"];
const thingNamed = n => THINGS.find(t => t.name === n) || THINGS[0];
quests = []; activeQuest = -1; showTasks = false;
offer = null; offerEpoch = null; lastTown = null;
routeOn = false; routeTarget = null; routeName = ""; routeCells = [];
routeDepth = DEPTHS; routeDir = -1; routeStuck = false;

function rewardText(q){
  if (q.reward === R_ITEM) return q.rewardThing.name;
  if (q.reward === R_HEART) return q.rewardN + " more of the wind you have";
  if (q.reward === R_SKILL) return "what they know of fighting";
  return "how to stand and not be hit";
}
function townOffer(g, when){
  const s = g.w.settlement(g.address.slice(0, SITE_N), when);
  if (!s){ offer = null; return null; }
  const ep = layerEpoch("need", cellLevel(DEPTHS), when);
  if (offer && offerEpoch === ep && offer.town === s.path.join(",")) return offer;
  const rng = rngFor(s.path, "n" + ep);
  const q = {epoch: ep, town: s.path.join(","), townPath: s.path.slice(),
             townName: s.name};
  const roll = rng.random();
  q.kind = roll < 0.40 ? Q_SLAY : roll < 0.75 ? Q_FETCH : Q_REACH;
  /* somewhere on the same board of districts, a few kilometres off */
  const pb = g.w.board(s.path.slice(0, GOAL_IDX));
  const home = s.path[GOAL_IDX];
  const lo = q.kind === Q_REACH ? 3 : 2, hi = q.kind === Q_REACH ? 8 : 5;
  let opts = [];
  for (let i = 0; i < BOARD_SIZE; i++){
    const dd = hexDistance(COORDS[i], COORDS[home]);
    if (i === home || dd < lo || dd > hi) continue;
    if (!pb.terrain[i].passable) continue;
    opts.push(i);
  }
  if (!opts.length)
    for (let i = 0; i < BOARD_SIZE; i++)
      if (i !== home && pb.terrain[i].passable) opts.push(i);
  q.goal = s.path.slice(0, SITE_N);
  q.goal[GOAL_IDX] = opts.length ? opts[rng._randbelow(opts.length)] : home;
  for (let i = GOAL_IDX + 1; i < ADDRESS_LEN; i++) q.goal[i] = CENTRE;
  q.goalName = g.w.nameOf(q.goal.slice(0, GOAL_N));
  if (q.kind === Q_SLAY){
    q.need = rng.randint(2, 4);
    q.line = "kill " + q.need + " beasts in " + q.goalName;
  } else if (q.kind === Q_FETCH){
    q.thing = thingNamed(ASK_NAMES[rng._randbelow(ASK_NAMES.length)]);
    q.need = 1;
    q.line = "bring " + q.thing.name + " back here";
  } else {
    q.need = 1;
    q.line = "go to " + q.goalName + " and come back";
  }
  const rr = rng.random();
  if (rr < 0.45){ q.reward = R_ITEM;
                  q.rewardThing = thingNamed(GIFT_NAMES[rng._randbelow(GIFT_NAMES.length)]); }
  else if (rr < 0.70){ q.reward = R_HEART; q.rewardN = rng.randint(3, 8); }
  else if (rr < 0.88){ q.reward = R_SKILL; q.rewardN = 1; }
  else               { q.reward = R_GUARD; q.rewardN = 1; }
  offer = q; offerEpoch = ep;
  return q;
}

/* ── the way ─────────────────────────────────────────────────
 * Cheapest across one board, over the cells a step would actually be
 * allowed onto, counting the same going it will cost when it is walked.
 * That is the whole of why a way follows a road.  It is a ladder of
 * searches rather than one, and remade after every single step. */
function boardRoute(g, path, depth, from, to){
  if (from === to) return [from];
  const b = depth === DEPTHS ? g.w.layers(path, gWhen(g))
                             : g.w.roadsAt(path, gWhen(g));
  const dist = new Array(BOARD_SIZE).fill(ROAD_FAR);
  const prev = new Array(BOARD_SIZE).fill(-1);
  const done = new Array(BOARD_SIZE).fill(false);
  dist[from] = 0;
  for (let turn = 0; turn < BOARD_SIZE; turn++){
    let i = -1, best = ROAD_FAR;
    for (let j = 0; j < BOARD_SIZE; j++)
      if (!done[j] && dist[j] < best){ best = dist[j]; i = j; }
    if (i < 0 || i === to) break;
    done[i] = true;
    for (let k = 0; k < 6; k++){
      const j = cellAt(COORDS[i][0] + DIRS[k][1], COORDS[i][1] + DIRS[k][2]);
      if (j < 0 || done[j]) continue;
      if (!(depth === DEPTHS ? g.w.passable(b, j) : b.terrain[j].passable)) continue;
      let gg = goingAt(b, j);
      if (gg < 0) gg = 9.0;
      if (dist[i] + gg < dist[j]){ dist[j] = dist[i] + gg; prev[j] = i; }
    }
  }
  if (dist[to] >= ROAD_FAR) return [];
  const stack = [];
  for (let i = to; i >= 0 && stack.length < BOARD_SIZE; i = prev[i]){
    stack.push(i);
    if (i === from) break;
  }
  return stack.reverse();
}
function stepAngle(from, to){
  const dq = COORDS[to][0] - COORDS[from][0], dr = COORDS[to][1] - COORDS[from][1];
  for (let a = 0; a < 6; a++) if (DIRS[a][1] === dq && DIRS[a][2] === dr) return a;
  return -1;
}
/* Breadth-first over the solid: the next continent on the way. */
function faceStep(from, to){
  const prev = new Array(FACES).fill(-1), seen = new Array(FACES).fill(false);
  const q = [from]; seen[from] = true;
  for (let h = 0; h < q.length; h++){
    const i = q[h];
    if (i === to) break;
    for (let k = 0; k < 6; k++){
      const j = PLANET[i].nbr[k];
      if (j === null || j === undefined || seen[j]) continue;
      seen[j] = true; prev[j] = i; q.push(j);
    }
  }
  if (!seen[to]) return -1;
  let cur = to;
  while (prev[cur] !== from && prev[cur] >= 0) cur = prev[cur];
  return cur;
}
function planRoute(g){
  routeCells = []; routeDir = -1; routeStuck = false;
  if (!routeOn) return false;
  if (g.address.join(",") === routeTarget.join(",")) return false;
  if (g.address[0] !== routeTarget[0]){
    const nxt = faceStep(g.address[0], routeTarget[0]);
    let a = -1;
    for (let k = 0; k < 6; k++)
      if (nxt >= 0 && PLANET[g.address[0]].nbr[k] === nxt) a = k;
    if (a < 0){ routeStuck = true; return false; }
    routeDepth = 1;
    const b = g.w.board(g.address.slice(0, 1));
    const dx = DIRS[a][1] + DIRS[a][2] * 0.5, dy = DIRS[a][2] * 0.8660254;
    let best = -1, bd = 0;
    for (let i = 0; i < BOARD_SIZE; i++){
      if (!b.terrain[i].passable) continue;
      const x = COORDS[i][0] + COORDS[i][1] * 0.5, y = COORDS[i][1] * 0.8660254;
      const d = x * dx + y * dy;
      if (best < 0 || d > bd){ bd = d; best = i; }
    }
    if (best < 0){ routeStuck = true; return false; }
    if (g.address[1] === best){ routeCells = [best]; routeDir = a; return true; }
    routeCells = boardRoute(g, g.address.slice(0, 1), 1, g.address[1], best);
    if (routeCells.length < 2){ routeStuck = true; routeCells = []; return false; }
    routeDir = stepAngle(routeCells[0], routeCells[1]);
    return routeDir >= 0;
  }
  let d = 1;
  while (d < ADDRESS_LEN && g.address[d] === routeTarget[d]) d++;
  if (d >= ADDRESS_LEN) return false;
  routeDepth = d;
  routeCells = boardRoute(g, g.address.slice(0, d), d, g.address[d], routeTarget[d]);
  if (routeCells.length < 2){ routeStuck = true; routeCells = []; return false; }
  routeDir = stepAngle(routeCells[0], routeCells[1]);
  return routeDir >= 0;
}
function setRoute(g, target, name){
  routeTarget = target.slice(); routeName = name; routeOn = true;
  planRoute(g);
}
function clearRoute(){ routeOn = false; routeCells = []; routeDir = -1; }
/* Which cell of the board now on screen the way ends in, so the planet
   shows which continent you are bound for and the lot which square metre. */
function routeGoalCell(g, v){
  if (!routeOn) return -1;
  if (v === 0) return routeTarget[0];
  for (let i = 0; i < v; i++) if (g.address[i] !== routeTarget[i]) return -1;
  return routeTarget[v];
}
/* Take the next step of the way.  The stance follows the rung the stretch
   is on, so a long leg is walked in long strides. */
function routeStep(g){
  if (!planRoute(g)) return false;
  if (routeDepth === DEPTHS){
    if (g.stance >= 0){ g.stance = -1; g.view = DEPTHS; settleHere(g); }
  } else if (g.stance !== routeDepth){ g.stance = routeDepth; g.view = routeDepth; }
  const before = g.address.join(",");
  const key = Object.keys(KEY_DIR).find(
    kk => turnDir(KEY_DIR[kk], g.facing) === DIRS[routeDir][0]);
  if (!key) return false;
  moveDir(g, key);
  return g.address.join(",") !== before;
}
function routeToQuest(g, i){
  const q = quests[i];
  if (!q || q.stage === 2) return;
  if (q.stage === 0 && q.kind !== Q_FETCH){ setRoute(g, q.goal, q.goalName); return; }
  const t = q.townPath.slice(0, SITE_N);
  for (let k = SITE_N; k < ADDRESS_LEN; k++) t[k] = CENTRE;
  setRoute(g, t, q.townName);
}
function questPay(g, q){
  if (q.reward === R_ITEM){ if (g.carried.length < 8) g.carried.push(q.rewardThing); }
  else if (q.reward === R_HEART){ g.maxHp += q.rewardN; g.hp = g.maxHp; }
  else if (q.reward === R_SKILL) g.skill += q.rewardN;
  else g.guard += q.rewardN;
}
function questCheck(g){
  const when = gWhen(g);
  const at = (a, b, n) => { for (let i = 0; i < n; i++) if (a[i] !== b[i]) return false;
                            return true; };
  for (let i = 0; i < quests.length; i++){
    const q = quests[i];
    if (!q || q.stage === 2) continue;
    if (q.stage === 0){
      let done = false;
      if (q.kind === Q_FETCH) done = g.carried.indexOf(q.thing) >= 0;
      else if (q.kind === Q_SLAY) done = q.got >= q.need;
      else done = at(g.address, q.goal, GOAL_N);
      if (!done) continue;
      q.stage = 1;
      g.message = "That is done.  " + (q.kind === Q_FETCH ? "Carry it back" : "A word") +
                  " is owed you at " + q.townName + ".";
      if (i === activeQuest) routeToQuest(g, i);
    }
    if (q.stage === 1 && at(g.address, q.townPath, SITE_N)){
      if (q.kind === Q_FETCH){
        const k = g.carried.indexOf(q.thing);
        if (k < 0){ q.stage = 0; continue; }
        g.carried.splice(k, 1);
      }
      questPay(g, q);
      g.message = q.townName + " thanks you, and gives you " + rewardText(q) + ".";
      q.stage = 2;
      if (i === activeQuest){ activeQuest = -1; clearRoute(); }
    }
  }
  /* Walking into a town that wants something is worth being told once. */
  const here = g.w.settlement(g.address.slice(0, SITE_N), when);
  if (!here){ lastTown = null; return; }
  if (lastTown === here.path.join(",")) return;
  lastTown = here.path.join(",");
  const o = townOffer(g, when);
  if (!o) return;
  if (quests.some(q => q && q.epoch === o.epoch && q.town === o.town)) return;
  g.message = o.townName + " wants something done.  (n to read it)";
}
function takeOffer(g){
  const o = townOffer(g, gWhen(g));
  if (!o){ g.message = "There is nobody here to want anything of you."; return; }
  if (quests.some(q => q && q.epoch === o.epoch && q.town === o.town)){
    g.message = "You have taken that on already."; return;
  }
  let slot = quests.findIndex(q => !q);
  if (slot < 0 && quests.length < MAX_QUESTS) slot = quests.length;
  if (slot < 0) slot = quests.findIndex(q => q.stage === 2);
  if (slot < 0){ g.message = "You have as much to do as you can hold."; return; }
  quests[slot] = Object.assign({}, o, {stage: 0, got: 0});
  activeQuest = slot;
  routeToQuest(g, slot);
  g.message = "You take it on: " + o.line + ".  They will give you " +
              rewardText(o) + ".  f follows the way.";
}


/* ── boot ─────────────────────────────────────────────────── */
const params = new URLSearchParams(location.search);
const GAME = startGame(params.get("seed") || "12345");
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){ drawScreen(GAME); paint(ctx, CW, CH); }
window.addEventListener("resize", resize);
resize();
window.addEventListener("keydown", ev => {
  const k = ev.key;
  if ((k.length === 1 || k === "Enter" || k === "Escape" || k === "Backspace") &&
      gameKey(GAME, k)){ ev.preventDefault(); redraw(); }
});
/* However long has really passed, times however fast the world runs. */
let last = performance.now();
function tick(now){
  const dt = (now - last) / 1000; last = now;
  if (GAME.speed){ GAME.seconds += Math.min(3600, dt) * SPEEDS[GAME.speed]; redraw(); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.HANB = GAME;
</script>
