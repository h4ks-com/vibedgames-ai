    for (const thing of [data.item[i], data.plant[i], data.ground[i]]){
      if (!thing) continue;
      /* The ground is the cell, not something in it, so it is always
       * there to be seen however small a board says it is. */
      if (visibleOnly && thing.layer !== "terrain" &&
          !sizeVisible(data.level, thing.size)) continue;
      out.push(thing);
    }
    out.sort((a, b) => indexOfChar(b.size) - indexOfChar(a.size));
    return out;
  }
  cellChar(data, i){
    const seen = this.occupants(data, i);
    return seen.length ? seen[0].size : "a";
  }
  passable(data, i){
    for (const thing of [data.ground[i], data.plant[i], data.item[i]])
      if (thing && !thing.passable) return false;
    return true;
  }
  blocker(data, i){
    for (const thing of [data.item[i], data.plant[i], data.ground[i]])
      if (thing && !thing.passable) return thing;
    return null;
  }

  /* --- what the player has changed --------------------------------
   * The only mutable thing in the world, and the only thing that would
   * ever need saving: what has been picked up and what has been put down. */
  takeItem(address, when){
    const key = address.join(",");
    const data = this.layers(address.slice(0, DEPTHS), when);
    const epochNow = layerEpoch("item", cellLevel(DEPTHS), when || 0);
    const i = address[DEPTHS];
    let thing;
    const stack = this._dropped.get(key);
    if (stack && stack.length){
      thing = THING_BY_KEY[stack.pop()];
      if (!stack.length) this._dropped.delete(key);
    } else {
      thing = data.item[i];
      if (!thing || !thing.portable) return null;
    }
    const rest = this._dropped.get(key);
    if (rest && rest.length){
      data.item[i] = THING_BY_KEY[rest[rest.length - 1]];
      this._taken.delete(key);
    } else {
      data.item[i] = null;
      this._taken.set(key, epochNow);
    }
    data.chars[i] = this.cellChar(data, i);
    return thing;
  }
  dropItem(address, thing, when){
    const key = address.join(",");
    const data = this.layers(address.slice(0, DEPTHS), when);
    const i = address[DEPTHS];
    if (!this._dropped.has(key)) this._dropped.set(key, []);
    if (data.item[i]) this._dropped.get(key).push(data.item[i].key);
    this._dropped.get(key).push(thing.key);
    data.item[i] = thing;
    this._taken.delete(key);
    data.chars[i] = this.cellChar(data, i);
  }
  _applyChanges(data, itemEpoch){
    for (let i = 0; i < BOARD_SIZE; i++){
      const key = data.path.concat([i]).join(",");
      const whenTaken = this._taken.get(key);
      if (whenTaken !== undefined){
        if (whenTaken === itemEpoch) data.item[i] = null;
        else this._taken.delete(key);       /* a lifetime has passed */
      }
      const stack = this._dropped.get(key);
      if (stack && stack.length) data.item[i] = THING_BY_KEY[stack[stack.length - 1]];
    }
  }

  /* --- addresses --------------------------------------------------- */
  static formatAddress(address){ return address.map(i => charAt(i)).join(""); }
  static parseAddress(text){
    const out = [];
    for (const c of text) if (ALPHABET.indexOf(c) >= 0) out.push(ALPHABET.indexOf(c));
    return out;
  }

  /** Pick somewhere to start: a continent with dry land on it, then down. */
  randomAddress(rng){
    const planet = this.board([]);
    let faces = [];
    for (let i = 0; i < FACES; i++)
      if (planet.fields[i].elevation >= SEA_LEVEL) faces.push(i);
    if (!faces.length) faces = Array.from({length: FACES}, (_, i) => i);
    const address = [rng.choice(faces)];
    for (let depth = 1; depth < ADDRESS_LEN; depth++){
      const data = this.board(address.slice());
      let options = [];
      for (let i = 0; i < BOARD_SIZE; i++)
        if (data.fields[i].elevation >= SEA_LEVEL &&
            data.terrain[i] !== T.void) options.push(i);
      if (!options.length)
        for (let i = 0; i < BOARD_SIZE; i++)
          if (data.terrain[i] !== T.void) options.push(i);
      if (depth === DEPTHS){
        const board = this.layers(address.slice());
        const walkable = options.filter(i => this.passable(board, i));
        if (walkable.length) options = walkable;
      }
      address.push(rng.choice(options));
    }
    return address;
  }

  /** The address of a point: which face, and where on it.
   *
   *  Position is kept in axial coordinates in whole person-sized cells,
   *  so this is the point written in base sixty-one -- at each level take
   *  the cell whose centre is nearest, subtract it, carry the remainder
   *  down -- with every subtraction exact. */
  addressAt(face, q, r){
    const moved = this.onFace(face, q, r);
    if (moved === null) return null;
    face = moved[0]; q = moved[1]; r = moved[2];
    const out = [face];
    for (let depth = 1; depth < ADDRESS_LEN; depth++){
      const scale = Math.pow(DIAGONAL, DEPTHS - depth);
      let [cq, cr] = axialRound(q / scale, r / scale);
      if (!inBoard(cq, cr)){
        /* The hierarchical digits overlap slightly -- a board reaches
         * four ninths of a parent cell from its middle -- so a remainder
         * can land just off the board.  Take the nearest cell that is on
         * it, which is at most a cell or two away. */
        const [mx, my] = axialMetres(q / scale, r / scale);
        const c = COORDS[nearestCell(mx, my)];
        cq = c[0]; cr = c[1];
      }
      out.push(idx(cq, cr));
      q -= cq * scale; r -= cr * scale;
    }
    return out;
  }

  /** Carry a position onto whichever face it is actually on.
   *
   *  Boards meet corner to corner at four and a half cells from each
   *  centre, so a step past that rim belongs to the face next door.  The
   *  transfer is a turn by a whole number of sixty-degree steps plus a
   *  shift of nine cells -- exact in axial coordinates, and its own
   *  inverse read the other way, so a walk across a seam and back comes
   *  home to the very same metre. */
  onFace(face, q, r){
    const m = this.onFaceTurned(face, q, r);
    return m === null ? null : [m[0], m[1], m[2]];
  }
  /** The same, and how far it turned the coordinates doing it.  The next
   *  face's frame does not point where this one's does, so a walker who
   *  wants to keep going the way they were going has to turn with it. */
  onFaceTurned(face, q, r){
    const scale = Math.pow(DIAGONAL, DEPTHS - 1);
    let turn = 0;
    for (let guard = 0; guard < 8; guard++){
      const [cq, cr] = axialRound(q / scale, r / scale);
      if (inBoard(cq, cr)) return [face, q, r, pyMod(turn, 6)];
      const d = wedgeAt(cq, cr);
      const j = PLANET[face].nbr[d];
      if (j === null) return null;          /* into the missing sixth */
      const back = PLANET[j].nbr.indexOf(face);
      const step = pyMod(back + 3 - d, 6);
      const t = axialRot(q, r, step);
      const [ux, uy] = DIR_BY_NAME[DIR_ORDER[back]];
      q = t[0] + ux * DIAGONAL * scale;
      r = t[1] + uy * DIAGONAL * scale;
      face = j;
      turn += step;
    }
    return null;
  }

  /** Where a position actually is: the face it belongs to, the position
   *  in that face's frame, and the address that reads off it.  Refuses
   *  the two places there is nothing to stand on -- past the planet
   *  altogether, and inside the sixth a pentagon is missing. */
  locate(face, q, r){
    const m = this.onFaceTurned(face, q, r);
    if (m === null) return { ok: false, why: "void" };
    const address = this.addressAt(m[0], m[1], m[2]);
    if (address === null) return { ok: false, why: "edge" };
    if (this.board([address[0]]).terrain[address[1]] === T.void)
      return { ok: false, why: "void" };
    return { ok: true, face: m[0], q: m[1], r: m[2], address: address,
             turned: m[3] };
  }

  /** How far one cell of movement at this scale moves you, in axial cells. */
  static offset(direction, depth, turn = 0){
    let [dq, dr] = DIR_BY_NAME[direction];
    if (turn) [dq, dr] = axialRot(dq, dr, turn);
    const scale = Math.pow(DIAGONAL, DEPTHS - depth);
    return [dq * scale, dr * scale];
  }
  stepAxial(q, r, direction, depth, turn = 0){
    const [dq, dr] = HanbWorld.offset(direction, depth, turn);
    return [q + dq, r + dr];
  }
  step(address, direction, depth){
    const [q, r] = this.position(address);
    const [nq, nr] = this.stepAxial(q, r, direction, depth);
    return this.addressAt(address[0], nq, nr);
  }

  /* --- where things are ---------------------------------------------
   * Each level contributes its cell's offset from the middle of its
   * board, scaled by how big that cell is.  Every one of those is a whole
   * number of person-sized cells, so a position is a pair of integers and
   * a walk of any length is exactly reversible. */
  position(address){
    let q = 0, r = 0;
    const n = Math.min(address.length, ADDRESS_LEN);
    for (let depth = 1; depth < n; depth++){
      const [cq, cr] = COORDS[address[depth]];
      /* Nine cells to the parent, not the nominal ten: it keeps distance
       * consistent with movement, so no step jumps at a board edge. */
      const scale = Math.pow(DIAGONAL, DEPTHS - depth);
      q += cq * scale; r += cr * scale;
    }
    return [q, r];
  }

  /** Where b lies as seen from a: metres east and metres south, in a's
   *  own frame.  On one face that is plain subtraction; across faces it
   *  goes round the planet. */
  offsetBetween(a, b){
    const [aq, ar] = this.position(a), [bq, br] = this.position(b);
    if (a[0] === b[0]){
      const [ax, ay] = axialMetres(aq, ar), [bx, by] = axialMetres(bq, br);
      return [bx - ax, by - ay];
    }
    const pa = this.spacePoint(a), pb = this.spacePoint(b);
    const fa = PLANET[a[0]];
    const along = add3(pb, mul3(pa, -dot3(pa, pb)));
    const arc = Math.acos(Math.max(-1, Math.min(1, dot3(pa, pb)))) * PLANET_RADIUS;
    const len = Math.sqrt(dot3(along, along));
    if (len < 1e-12) return [0, 0];
    const t = mul3(along, arc / len);
    return [dot3(t, fa.u), dot3(t, fa.v)];
  }

  /** A position as a unit vector out of the planet's middle. */
  spacePoint(address){
    const f = PLANET[address[0]];
    const [q, r] = this.position(address);
    const [x, y] = axialMetres(q, r);
    return norm3(add3(f.n, add3(mul3(f.u, x / PLANET_RADIUS),
                                mul3(f.v, y / PLANET_RADIUS))));
  }

  separation(a, b){
    const [dx, dy] = this.offsetBetween(a, b);
    return hypot(dx, dy);
  }
  bearing(a, b, turn = 0){
    let [dx, dy] = this.offsetBetween(a, b);
    if (turn){
      const [c, s] = UNTURN[pyMod(turn, 6)];
      [dx, dy] = [dx * c - dy * s, dx * s + dy * c];
    }
    if (Math.abs(dx) < 1e-9 && Math.abs(dy) < 1e-9) return "here";
    /* Screen rows run north to south, so a positive dy is southward. */
    const angle = pyMod(Math.atan2(-dy, dx) * 180 / Math.PI, 360.0);
    const points = ["east","northeast","north","northwest",
                    "west","southwest","south","southeast"];
    return points[Math.floor(pyMod(angle + 22.5, 360.0) / 45.0)];
  }

  /** Every settlement within a district or two, nearest first. */
  nearbySettlements(address, spread = 1, turn = 0, when = 0.0){
    const seen = new Set();
    const bases = [address.slice(0, DEPTHS - 2)];
    if (spread){
      for (const [name] of DIRS){
        const moved = this.step(address, name, DEPTHS - 3);
        if (moved !== null) bases.push(moved.slice(0, DEPTHS - 2));
      }
    }
    const out = [];
    for (const base of bases){
      const bk = base.join(",");
      if (seen.has(bk)) continue;
      seen.add(bk);
      for (let cell = 0; cell < BOARD_SIZE; cell++){
        const path = base.concat([cell]);
        const site = this.settlement(path, when);
        if (!site) continue;
        const where = path.concat([CENTRE]);   /* a settlement sits in the middle */
        out.push({site, path, dist: this.separation(address, where),
                  brg: this.bearing(address, where, turn)});
      }
    }
    out.sort((a, b) => a.dist - b.dist);
    return out;
  }

  /** Somewhere to begin: a settlement, preferably of your own people. */
  findStart(rng, race, tries = 30, when = 0.0){
    let fallback = null;
    for (let attempt = 0; attempt < tries; attempt++){
      const address = this.randomAddress(rng);
      for (const {site, path} of this.nearbySettlements(address, 1, 0, when)){
        const where = this.doorstep(path, rng, when);
        if (race === null || site.race === race) return [where, site];
        if (fallback === null) fallback = [where, site];
      }
      if (fallback !== null && attempt > Math.floor(tries / 2)) break;
    }
    if (fallback !== null) return fallback;
    return [this.randomAddress(rng), null];
  }

  /** A full address standing somewhere inside a settlement. */
  doorstep(sitePath, rng, when = 0.0){
    const site = this.settlement(sitePath, when);
    this.layers(sitePath, when);                /* lays out the lots */
    const cells = (site && site.cells.length) ? site.cells : [CENTRE];
    const lot = rng.choice(cells);
    const lotPath = sitePath.concat([lot]);
    const board = this.layers(lotPath, when);
    const walkable = [];
    for (let i = 0; i < BOARD_SIZE; i++) if (this.passable(board, i)) walkable.push(i);
    return lotPath.concat([walkable.length ? rng.choice(walkable) : CENTRE]);
  }

  /* --- naming ------------------------------------------------------ */
  /** Which tongue names things here.  One per Q-sized land. */
  languageFor(path){
    const rng = rngFor(path.slice(0, 2), "tongue");
    return this.languages[rng.choice(PHON_KEYS)];
  }

  /** The name of the cell that `path` points at, made once and kept. */
  nameOf(path){
    const key = path.join(",");
    const got = this._names.get(key);
    if (got !== undefined) return got;
    const depth = path.length;
    /* A cell of the L board is a metre across.  It holds a shrub or a
     * person, not a named country. */
    if (depth > DEPTHS) return "";
    if (depth === 0){
      const rng = rngFor([], "world");
      const lang = this.languages.DWARF;
      const noun = rng.choice(wordsWith("EARTH", "NOUNS"));
      const adj = rng.choice(wordsWith("NATURE", "ADJECTIVES"));
      const name = lang.word(noun) + lang.word(adj).toLowerCase();
      this._names.set(key, name);
      return name;
    }
    const parent = this.board(path.slice(0, -1));
    const terrain = parent.terrain[path[depth - 1]];
    const rng = rngFor(path, "name");
    /* Big places are named for their landscape, small ones for what they
     * are; mixing the pools by depth keeps a district and the hamlet
     * inside it from landing on the same words. */
    const terrainNouns = TERRAIN_NOUNS[terrain.key] || ["Land"];
    const placeNouns = PLACE_AT_DEPTH[depth] || ["Land"];
    let pool;
    if (depth <= 3) pool = terrainNouns.concat(terrainNouns, terrainNouns, placeNouns);
    else if (depth <= 4) pool = terrainNouns.concat(terrainNouns, placeNouns, placeNouns);
    else pool = terrainNouns.concat(placeNouns, placeNouns, placeNouns);
    const noun = rng.choice(pool);
    const sym = TERRAIN_SYMBOL[terrain.key] || "NATURE";
    /* Draw from the whole vocabulary some of the time, or every tundra in
     * the world ends up ancient. */
    const adjectives = rng.random() < 0.45 ? ALL_ADJECTIVES
      : (wordsWith(sym, "ADJECTIVES").length ? wordsWith(sym, "ADJECTIVES") : ALL_ADJECTIVES);
    const nouns = rng.random() < 0.45 ? ALL_NOUNS
      : (wordsWith(sym, "NOUNS").length ? wordsWith(sym, "NOUNS") : ALL_NOUNS);
    const roll = rng.random();
    let name;
    if (roll < 0.42) name = "The " + cap(rng.choice(adjectives)) + " " + noun;
    else if (roll < 0.84) name = "The " + noun + " of " + cap(rng.choice(nouns));
    else name = cap(rng.choice(nouns)) + noun.toLowerCase();
    this._names.set(key, name);
    return name;
  }

  /** The same place in the tongue spoken there. */
  nativeName(path){
    const rng = rngFor(path, "name");
    const lang = this.languageFor(path);
    let parentTerrain = "grass";
    if (path.length){
      const parent = this.board(path.slice(0, -1));
      parentTerrain = parent.terrain[path[path.length - 1]].key;
    }
    const sym = TERRAIN_SYMBOL[parentTerrain] || "NATURE";
    const a = rng.choice(wordsWith(sym, "NOUNS").length ? wordsWith(sym, "NOUNS") : ["stone"]);
    const b = rng.choice(wordsWith(sym, "ADJECTIVES").length ? wordsWith(sym, "ADJECTIVES") : ["wild"]);
    return lang.word(a) + lang.word(b).toLowerCase();
  }

  /* --- settlements -------------------------------------------------- */
  /** Is there a hamlet in this M-sized cell?  Decided from the land itself. */
  settlement(path, when = 0.0){
    if (path.length !== DEPTHS - 1) return null;
    const key = path.join(",");
    if (this._settlements.has(key))
      return HanbWorld.alive(this._settlements.get(key), when);
    const parent = this.board(path.slice(0, -1));
    const cell = path[path.length - 1];
    const terrain = parent.terrain[cell], fields = parent.fields[cell];
    let result = null;
    if (terrain.water < 2 &&
        ["ice","glacier","deep","sea","void"].indexOf(terrain.key) < 0){
      const rng = rngFor(path, "settle");
      let bestRace = null, bestScore = 0.0;
      for (const [race, taste] of RACE_TASTE){
        let score = 0.0;
        for (const [k, v] of taste) if (k === terrain.key){ score = v; break; }
        if (!score) continue;
        score *= 0.6 + rng.random() * 0.8;
        if (score > bestScore){ bestScore = score; bestRace = race; }
      }
      /* Water and mild weather help; nobody settles every hollow. */
      let chance = bestScore / 46.0;
      if (parent.river[cell]) chance *= 2.1;
      if (fields.temperature >= 30 && fields.temperature <= 82) chance *= 1.4;
      if (bestRace && rng.random() < Math.min(0.5, chance)){
        const kind = rng.choice(SETTLEMENT_KINDS[bestRace]);
        const lang = this.languages[bestRace];
        const sym = {DWARF:"EARTH", ELF:"PLANT", HUMAN:"CRAFT",
                     GOBLIN:"EVIL", KOBOLD:"DARK"}[bestRace];
        const pool = wordsWith(sym, "NOUNS").length ? wordsWith(sym, "NOUNS")
                                                    : ["stone", "hall"];
        const a = rng.choice(pool);
        let b = rng.choice(pool);
        for (let i = 0; i < 8; i++){        /* "Hammerhammer" is not a name */
          if (b !== a) break;
          b = rng.choice(pool);
        }
        const english = cap(a + b);
        const native = lang.word(a) + lang.word(b).toLowerCase();
        const pop = SITE_POP[kind] || [25, 160];
        const peak = rng.randint(pop[0], pop[1]);
        /* Most towns were already old when the story starts, a few have
           yet to be founded, and rather less than half of them will empty
           again rather than stand for good. */
        const founded = rng.randint(0, 1000) - 900;
        const rise = rng.randint(40, 240);
        const hold = rng.randint(150, 1500);
        const fall = rng.random() < 0.62 ? 0 : rng.randint(80, 600);
        const weathers = rng.randint(300, 2200);
        result = new Settlement(path, english, native, bestRace, kind, peak,
                                founded * YEAR, rise * YEAR, hold * YEAR,
                                fall * YEAR, weathers * YEAR);
      }
    }
    this._settlements.set(key, result);
    return HanbWorld.alive(result, when);
  }

  /** The site as it stands at that moment, or nothing at all. */
  static alive(site, when){
    if (!site) return null;
    const pop = site.sizeAt(when);
    if (pop <= 0) return null;
    site.population = pop;
    return site;
  }
  /** How many of an M board's lots a town of that size covers. */
  static footprint(population){
    return Math.max(3, Math.min(30, Math.floor(population / 24)));
  }
  /** The town that stood here, if its ruins are still standing.  A site
   *  holds one or the other and never both. */
  ruin(path, when = 0.0){
    if (path.length !== DEPTHS - 1) return null;
    const key = path.join(",");
    if (!this._settlements.has(key)) this.settlement(path, when);
    const site = this._settlements.get(key);
    if (!site || site.sizeAt(when) > 0) return null;
    return this.ruinFootprint(site, when) ? site : null;
  }
  /** How many lots of the old town still have anything on them. */
  ruinFootprint(site, when){
    return Math.trunc(HanbWorld.footprint(site.peak) * site.ruinAt(when) + 0.5);
  }
  /** The footprint of whatever town this board belongs to, which is what
   *  has to change before its buildings are laid out again. */
  /* The roads on a country board, made when they are looked at like
     everything else.  A year is fine enough to read them at: a town is
     founded and empties over centuries, and no road moves inside one. */
  roadsFor(data, when){
    const stamp = 1 + Math.floor(when / YEAR);
    if (data.roadStamp === stamp) return data;
    data.roadStamp = stamp;
    if (data.depth !== ROAD_DEPTH){
      data.road = new Array(BOARD_SIZE).fill(0);
      data.wear = new Array(BOARD_SIZE).fill(0);
      return data;
    }
    roadNet(this, data, when);
    return data;
  }
  /** The country board a cell belongs to, roads and all. */
  roadsAt(path, when){ return this.roadsFor(this.board(path), when); }
  /** What the board above says about this cell: which ways a road leaves
   *  it by, and how worn that road is.  Above the country board there is
   *  nothing to say; below it, the stretch the parent walked. */
  roadAbove(path, depth, when){
    if (depth <= ROAD_DEPTH) return [0, 0];
    const up = depth - 1 === ROAD_DEPTH
             ? this.roadsAt(path.slice(0, -1), when)
             : this.layers(path.slice(0, -1), when);
    const cell = path[path.length - 1];
    return [up.road ? up.road[cell] : 0, up.wear ? up.wear[cell] : 0];
  }
  /* The lots a town with streets stands on.  The streets first, grown
     from the roads that arrive; then the buildings that face them,
     nearest the heart first -- so growth still adds at the edge, decline
     still contracts to the middle, and how many there are is still
     exactly what the population says.  Only *which* has changed. */
  layTown(data, count, when, left){
    planClear();
    growStreets(data, PLAN_N * 0.46);
    const street = [];
    for (let i = 0; i < BOARD_SIZE; i++){
      street.push(planAt(i) === PL_STREET);
      if (!street[i] || data.terrain[i].water >= 2) continue;
      /* a street nobody walks any more goes back to grass in patches, at
         the same rate the walls come down */
      if (left < 1.0 && (noiseAt(data.path, i, "worn") + 1.0) * 0.5 >= left) continue;
      data.ground[i] = THING_BY_KEY.road;
      data.plant[i] = null;
    }
    const era = townEra(when);
    const cq = 2.2 * noiseAt(data.path, 0, "heart" + era);
    const cr = 2.2 * noiseAt(data.path, 1, "heart" + era);
    const rng = rngFor(data.path, "lots");
    const order = Array.from({length: BOARD_SIZE}, (_, i) => i);
    const keys = order.map(i => {
      const dq = COORDS[i][0] - cq, dr = COORDS[i][1] - cr;
      let d = (Math.abs(dq) + Math.abs(dq + dr) + Math.abs(dr)) / 2.0
            + 0.85 * noiseAt(data.path, i, "lobe" + era);
      let faces = false;
      for (let k = 0; k < 6; k++){
        const j = cellAt(COORDS[i][0] + DIRS[k][1], COORDS[i][1] + DIRS[k][2]);
        if (j >= 0 && street[j]){ faces = true; break; }
      }
      /* back land is built on last: a house wants a way to its own door */
      if (!faces) d += 6.0;
      return [d, rng.random()];
    });
    order.sort((a, b) => (keys[a][0] - keys[b][0]) || (keys[a][1] - keys[b][1]));
    const keep = [];
    for (const c of order){
      if (keep.length >= count) break;
      if (data.terrain[c].water >= 2) continue;
      if ((data.road && data.road[c]) || street[c]) continue;
      keep.push(c);
    }
    return keep;
  }
  townSize(path, depth, when){
    let here;
    if (depth === DEPTHS - 1) here = path;
    else if (depth === DEPTHS) here = path.slice(0, -1);
    else return 0;
    const site = this.settlement(here, when);
    if (site) return HanbWorld.footprint(site.builtAt(when));
    const dead = this.ruin(here, when);   /* negative, so a town and the
                                             ruin of one are not confused */
    return dead ? -this.ruinFootprint(dead, when) : 0;
  }

  /** Lay a settlement's streets and buildings across the boards below. */
  _buildSettlementCells(data, when = 0.0, itemEpoch = 0){
    const depth = data.depth;
    let site;
    if (depth === DEPTHS - 1) site = this.settlement(data.path, when);
    else if (depth === DEPTHS) site = this.settlement(data.path.slice(0, -1), when);
    else return;
    data.settlement = site;
    if (!site){
      /* Nobody lives here; the stones may still be standing though. */
      this._buildRuinCells(data, when, itemEpoch);
      return;
    }
    const rng = rngFor(data.path, "town");

    if (depth === DEPTHS - 1){
      /* The M board: which of its L cells the settlement occupies. */
      const count = HanbWorld.footprint(site.builtAt(when));
      const keep = this.layTown(data, count, when, 1.0);
      site.cells = keep;
      /* A building is not a special case: it is an inorganic item that
       * happens to be ten metres across. */
      for (const i of keep){
        data.item[i] = THING_BY_KEY.building;
        data.plant[i] = null;
      }
      return;
    }
    /* The L board: a house, if this L cell is part of the town. */
    const up = this.layers(data.path.slice(0, -1), when);
    const lot = data.path[data.path.length - 1];
    if (site.cells.indexOf(lot) < 0) return;
    /* Which way out of this lot the street lies: the door goes in that
       wall, so a house can always be walked into from the road. */
    let door = 0;
    for (let k = 0; k < 6; k++){
      const j = cellAt(COORDS[lot][0] + DIRS[k][1], COORDS[lot][1] + DIRS[k][2]);
      if (j >= 0 && ((up.road && up.road[j]) ||
                     (up.ground && up.ground[j] === THING_BY_KEY.road))){
        door = k; break;
      }
    }
    /* A house is a bounded piece of ground cut up, so it is cut up in the
       flat and the lot's sixty-one square metres are then asked what room
       they are standing in. */
    planClear();
    layHouse(data.path, door, 1.0);
    for (let i = 0; i < BOARD_SIZE; i++){
      if (data.terrain[i].water >= 2) continue;
      const what = planAt(i);
      if (what === PL_FLOOR || what === PL_DOOR){
        data.ground[i] = THING_BY_KEY.floor; data.plant[i] = null;
      } else if (what === PL_HEARTH){
        data.item[i] = THING_BY_KEY.hearth; data.plant[i] = null;
      } else if (what === PL_YARD){
        data.ground[i] = THING_BY_KEY.soil;
      } else if (what === PL_WALL && !(data.road && data.road[i])){
        /* a wall, unless the road goes through here: then a gap */
        data.item[i] = THING_BY_KEY.wall; data.plant[i] = null;
      }
    }
  }

  /** What a town leaves behind: broken walls, and what was dropped.
   *
   *  The same streets as the living town, only most of them gone -- the
   *  lots are ranked from the middle outwards either way, so a ruin sits
   *  where the town's heart was and shrinks towards it as it weathers. */
  _buildRuinCells(data, when, itemEpoch){
    const depth = data.depth;
    const here = depth === DEPTHS - 1 ? data.path : data.path.slice(0, -1);
    const site = this.ruin(here, when);
    if (!site) return;
    const left = site.ruinAt(when);
    const rng = rngFor(data.path, "ruin");

    if (depth === DEPTHS - 1){
      const count = this.ruinFootprint(site, when);
      const keep = this.layTown(data, count, when, left);
      site.cells = keep;
      for (const i of keep) data.item[i] = THING_BY_KEY.ruin;  /* plants stay */
      return;
    }

    /* The L board: what is left of one lot of it -- the same house it
       always was, with that many of its rooms still standing, so a ruin
       is the plan of the house and not a different broken building. */
    const up = this.layers(data.path.slice(0, -1), when);
    const lot = data.path[data.path.length - 1];
    if (site.cells.indexOf(lot) < 0) return;
    let door = 0;
    for (let k = 0; k < 6; k++){
      const j = cellAt(COORDS[lot][0] + DIRS[k][1], COORDS[lot][1] + DIRS[k][2]);
      if (j >= 0 && ((up.road && up.road[j]) ||
                     (up.ground && up.ground[j] === THING_BY_KEY.road))){
        door = k; break;
      }
    }
    planClear();
    layHouse(data.path, door, left);
    for (let i = 0; i < BOARD_SIZE; i++){
      if (data.terrain[i].water >= 2) continue;
      const what = planAt(i);
      if (what === PL_FLOOR || what === PL_DOOR){
        data.ground[i] = THING_BY_KEY.floor;      /* a floor still swept */
      } else if (what === PL_HEARTH){
        data.item[i] = THING_BY_KEY.hearth;
      } else if (what === PL_WALL && !(data.road && data.road[i])){
        data.item[i] = THING_BY_KEY.ruin;
      }
      /* and whatever was too old or too heavy to carry off */
      if (!data.item[i]){
        const roll = (noiseAt(data.path, i, "relic" + itemEpoch) + 1.0) * 0.5;
        const got = relicFor(roll);
        if (got) data.item[i] = got;
      }
    }
  }
}

  let r = roll * total, last = table[table.length - 1][1];
  for (const [w, t] of table){ r -= w; last = t; if (r <= 0) break; }
  return last < 0 ? null : THINGS[last];
}

/* ====================================================================
 * 5b.  The calendar.
 *
 * Twelve months, three hundred and sixty-five days, seven-day weeks --
 * Earth's, for now, on a planet that is not.  There are no leap years,
 * so a year is exactly 365 days and the weekday walks forward by one
 * every year, which is what 365 mod 7 = 1 means.
 * ==================================================================== */
const SECONDS_PER_DAY = 86400, DAYS_PER_YEAR = 365;
const MONTHS = [["January",31],["February",28],["March",31],["April",30],
                ["May",31],["June",30],["July",31],["August",31],
                ["September",30],["October",31],["November",30],["December",31]];
const WEEKDAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday",
                  "Saturday","Sunday"];
/* Year 1, the first of January, is a Monday, and every world starts at
 * eight in the morning of it. */
const EPOCH_START = 8 * 3600;

function calendar(secs){
  let t = Math.floor(secs);
  let day = Math.floor(t / SECONDS_PER_DAY);
  const rest = t - day * SECONDS_PER_DAY;
  const weekday = WEEKDAYS[pyMod(day, 7)];
  const year = Math.floor(day / DAYS_PER_YEAR) + 1;
  let doy = pyMod(day, DAYS_PER_YEAR);
  let month = 0;
  while (doy >= MONTHS[month][1]){ doy -= MONTHS[month][1]; month++; }
  return {
    year: year, month: month, day: doy + 1, weekday: weekday,
    hour: Math.floor(rest / 3600), minute: Math.floor((rest % 3600) / 60),
    second: rest % 60,
  };
}
const two = n => (n < 10 ? "0" : "") + n;
function dateLong(secs){
  const c = calendar(secs);
  return c.weekday + " " + c.day + " " + MONTHS[c.month][0] +
         ", Year " + c.year;
}
/** As much of the date as a phone's bar can spare. */
function dateShort(secs){
  const c = calendar(secs);
  return c.weekday.slice(0, 3) + " " + c.day + " " +
         MONTHS[c.month][0].slice(0, 3) + " y" + c.year;
}
/* Seconds included: a step is one, so without them the clock would sit
 * still through most of what you do. */
function clockOf(secs){
  const c = calendar(secs);
  return two(c.hour) + ":" + two(c.minute) + ":" + two(c.second);
}

    this.talked = false; this.bleed = 0;
    /* Things with names of their own take no article. */
    this.proper = !this.animal;

  }
  get alive(){ return !this.dead; }
  label(){
    if (this.kind === "beast" && this.title) return this.name + " the " + this.title;
    if (this.title) return this.name + ", " + this.title;

    if (!this.animal) return this.name;

    if (f >= 0.99) return "unhurt";
    if (f >= 0.75) return "scratched";
    if (f >= 0.50) return "wounded";
    if (f >= 0.25) return "badly hurt";
    return "near death";
  }
  woundPenalty(){ return this.wounds.reduce((a, w) => a + w.severity, 0); }
}

function makeCreature(entry, rng){
  const [name, glyph, fg, hp, atk, dodge, danger, , verb] = entry;
  const b = new Being(name, "animal", glyph, fg, hp, atk, dodge, danger, verb, true);
  /* Individuals vary; two wolves are not identical. */
  /* Python floors toward minus infinity: (-hp)//6, not -(hp//6). */
  b.max_hp = Math.max(2, hp + rng.randint(Math.floor(-hp / 6), Math.floor(hp / 6)));
  b.hp = b.max_hp;
  b.speed = 1.0 + (danger >= 3 ? 0.25 : 0.0);
  return b;
}

function severityOf(damage, target){
  const frac = damage / Math.max(1, target.max_hp);
  if (frac >= 0.35) return 4;
  if (frac >= 0.22) return 3;
  if (frac >= 0.10) return 2;
  return 1;
}

/** One blow.  Returns the lines to print. */
function attackBeing(attacker, defender, rng){
  const out = [];
  let [dmgBase, verbYou, verbThey] = WEAPONS[attacker.weapon] ||
      [attacker.attack, "strike", attacker.verb];
  if (attacker.animal){ verbYou = verbThey = attacker.verb; }

  const skill = attacker.attack - attacker.woundPenalty();
  const roll = rng.randint(1, 20) + Math.floor(skill / 3);
  const evade = defender.dodge + rng.randint(0, 4) -
                Math.floor(defender.woundPenalty() / 2);
  const subject = attacker.player ? "You" : cap(attacker.theName());
  const obj = defender.player ? "you" : defender.theName();
  const verb = attacker.player ? verbYou : verbThey;

  if (roll <= evade){
    out.push(subject + " " + verb + " " + obj + ", but " +
      (defender.player ? "you" : (defender.animal ? "it" : "they")) + " " +
      (defender.player ? "dodge" : "dodges") + " away.");
    return out;
  }
  const part = rng.choice(defender.parts());
  let damage = Math.max(1, rng.randint(Math.floor(dmgBase / 2), dmgBase) +
                        Math.floor(attacker.attack / 4) - rng.randint(0, 2));
  const crit = roll >= evade + 12;
  if (crit) damage = Math.trunc(damage * 1.6);

  defender.hp -= damage;
  const sev = severityOf(damage, defender);
  const wound = new Wound(part, sev, sev >= 2 ? 1 : 0);
  defender.wounds.push(wound);
  if (wound.bleeding) defender.bleed += sev - 1;

  const effect = ({1:"bruising it", 2:"tearing the flesh",
                   3:"shattering the bone", 4:"severing it"})[sev];
  out.push(subject + " " + verb + " " + obj + " in the " + part + ", " + effect +
           "!" + (crit ? "  A critical hit!" : ""));

  if (defender.hp <= 0){
    defender.dead = true;
    out.push(defender.player ? "You have been slain."
                             : cap(defender.theName()) + " is dead!");
  } else if (!defender.hostile && !defender.player){
    /* Being hit makes enemies of the previously indifferent. */
    defender.hostile = true;
    if (defender.animal && defender.danger === 0 && rng.random() < 0.7)
      defender.state = "flee";
  }
  return out;
}

function stepBleeding(being, rng){
  if (being.bleed <= 0 || being.dead) return [];
  if (rng.random() < 0.22){
    being.hp -= 1;
    if (being.hp <= 0){
      being.dead = true;
      return [being.player ? "You bleed to death."
                           : cap(being.theName()) + " bleeds to death."];
    }
    if (being.player && rng.random() < 0.3) return ["You are bleeding."];
  }
  return [];
}

/* Which wildlife table suits which hanb terrain. */
const WILDLIFE_FOR = {
  forest:"FOREST", taiga:"FOREST", jungle:"FOREST", dry_forest:"FOREST",
  grass:"GRASSLAND", savanna:"GRASSLAND", steppe:"GRASSLAND", scrub:"GRASSLAND",
  desert:"DESERT", badland:"DESERT", hills:"HILLS", mountain:"MOUNTAINS",
  peak:"MOUNTAINS", tundra:"TUNDRA", glacier:"GLACIER", ice:"GLACIER",
  marsh:"SWAMP", swamp:"SWAMP", river:"LAKE", lake:"LAKE", shore:"LAKE",
};

/* ====================================================================
 * 7.  The game: one 61-cell board at a time, and the ladder of scales
 *     it hangs from.
 * ==================================================================== */
const LEVEL_TITLE = {S:"planet", R:"continent", Q:"kingdom", P:"province",
                     O:"borough", N:"district", M:"hamlet", L:"lot", K:"person"};
const RACE_HP = {DWARF:74, ELF:62, HUMAN:68, GOBLIN:66, KOBOLD:52};

function distanceLabel(m){
  return m >= 1000 ? (m / 1000).toFixed(1) + " km" : pyRound(m) + " m";
}

class Game {
  constructor(world, address, seedBig, player, home){
    this.w = world;
    this.rng = new PyRandom(seedBig);
    this.address = address;
    this.home = home || null;
    this.seconds = 0.0;
    /* Position on the ground is the real state; the address is a reading
     * of it.  That makes walking exact and exactly reversible -- the
     * position is a pair of whole numbers of person-sized cells, kept in
     * the frame of whichever face you are standing on. */
    const p = world.position(address);
    this.q = p[0]; this.r = p[1];
    this.view = DEPTHS;
    /* Afoot, a step is a metre.  Set out and it is a whole cell of a
     * coarser board, and costs what the scale table says that cell
     * costs -- a hundred metres, a hundred seconds. */
    this.stance = null;          /* null afoot; else the walking depth */
    /* Which way you are facing, in sixths, measured against the frame of
     * the face you are on.  Neighbouring faces do not agree about which
     * way is which, so crossing a seam turns the ground under you --
     * carrying this is what keeps you walking the way you were walking,
     * and what makes the opposite key bring you back. */
    this.facing = 0;
    this.raw = false;
    /* The world runs whether or not you do: the clock advances with real
     * time, and what you do costs time on top of it. */
    this.speed = DEFAULT_SPEED;
    this.lastReal = Date.now();
    /* Where the planet is being looked at from.  It follows your own
     * continent until you turn it, and h j k l turn it. */
    this.camTrack = true;
    this.camLon = 0; this.camLat = 0;
    this.heldSpeed = 3;          /* p resumes at 1095x */
    this.log = [];
    this.creatures = new Map();
    this.player = player;
    this.kills = [];
    this.steps = 0;
    this.settle();
    this.say("You stand in " + this.w.nameOf(this.address.slice(0, 1)) + ".");
    this.arrive();
  }

  /* --- helpers ------------------------------------------------------ */
  path(depth){ return this.address.slice(0, depth === undefined ? this.view : depth); }
  data(depth){ return this.w.board(this.path(depth)); }
  cell(depth){ return this.address[depth === undefined ? this.view : depth]; }
  /** A metre a second, read off the scale table rather than the ground:
   *  a K is a person and an S is a second, so crossing a cell of any
   *  size takes the duration eight places along the alphabet from it --
   *  ten metres ten seconds, a hundred a hundred. */
  spend(secs){ this.seconds += secs; }
  /** Said when a seam turns the ground: the walker keeps their heading
   *  and the map comes round under them, so the board on screen turns. */
  get turnedMsg(){
    return "  The map comes round under you — you keep walking the way " +
           "you were walking.";
  }
  /** Is this board drawn the other way up?  A board's outline hexagon
   *  stands a quarter turn from its cells, and a board is itself a cell
   *  of the board above, so the orientation alternates all the way up.
   *  The L board is the one the hanb project prints. */
  boardTurned(view){
    return pyMod(DEPTHS - (view === undefined ? this.view : view), 2) === 1;
  }
  /** How far the cells turn before they are drawn: the seams you have
   *  crossed, and the quarter turn of the board itself.  A quarter turn
   *  is a sixth plus a thirtieth, and only the sixth is something a
   *  hexagonal lattice can do -- taking it puts the six movement keys
   *  within thirty degrees of where they point on a turned board, which
   *  is as close as the shape allows. */
  boardTurn(view){
    return pyMod(this.facing + (this.boardTurned(view) ? TURNED_LATTICE : 0), 6);
  }
  /** Which board a step crosses a whole cell of: L afoot, a coarser one
   *  once you have set out. */
  walkDepth(){ return this.stance === null ? DEPTHS : this.stance; }
  /** What one step costs there, in seconds.  A cell is nine child cells
   *  wide and a child cell is a second, so it is nine to the power of
   *  however many levels up you are walking. */
  stride(depth){ return Math.pow(LADDER, DEPTHS - depth); }
  strideLabel(depth){
    return sizeLabel(cellLevel(depth)) + " of country, " +
           timeLabel(this.stride(depth)) + " of walking";
  }
  /** Take longer strides: walk a whole cell of a coarser board. */
  setOut(depth){
    if (depth === undefined) depth = TRAVEL_DEPTH;
    this.stance = Math.max(1, Math.min(DEPTHS - 1, depth));
    this.view = this.stance;
    this.say("You set out.  A step is " + this.strideLabel(this.stance) +
             ".  < and > lengthen and shorten your stride; S stops you.");
  }
  /** Stop walking and stand where you have got to. */
  halt(){
    this.stance = null;
    this.view = DEPTHS;
    this.settle();
    this.say("You stop, and the country comes back down to a metre at a time.");
    this.arrive();
  }
  /** However long has really passed, times however fast the world runs.
   *  A single jump is capped at an hour of real time -- come back to a
   *  tab left open for a week and the world has moved on, but not by
   *  twenty thousand years. */
  advance(){
    const now = Date.now();
    let dt = (now - this.lastReal) / 1000.0;
    this.lastReal = now;
    if (dt <= 0) return;
    if (dt > 3600) dt = 3600;
    this.seconds += dt * SPEEDS[this.speed];
  }
  /** The date, which is the same date for everyone on the planet. */
  /* The world keeps its own copy of the clock, because the watercourses
     are laid out by the board and not by the layers, and a board is asked
     for without a date.  Setting it here means every reader refreshes it,
     which is the only way it stays true. */
  when(){ this.w.now = EPOCH_START + this.seconds; return this.w.now; }

  /** The frame the planet is seen in: north up, centred on wherever the
   *  camera is pointing -- your own continent, until you turn it. */
  viewFrame(){
    if (this.camTrack){
      const c = PLANET[this.address[0]].n;
      this.camLat = Math.asin(Math.max(-1, Math.min(1, c[2])));
      this.camLon = Math.atan2(c[1], c[0]);
    }
    const la = Math.max(-1.48, Math.min(1.48, this.camLat)), lo = this.camLon;
    const n = [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)];
    const u = norm3(cross3([0, 0, 1], n));      /* east, along the screen */
    const v = cross3(u, n);                     /* south, so y runs down */
    return {n: n, u: u, v: v};
  }
  turnPlanet(dlon, dlat){
    this.viewFrame();                            /* start from where it is */
    this.camTrack = false;
    this.camLon = pyMod(this.camLon + dlon, Math.PI * 2);
    this.camLat = Math.max(-1.48, Math.min(1.48, this.camLat + dlat));
  }
  faceCamera(){
    this.camTrack = true;
    this.say("The planet turns back to " + this.w.nameOf([this.address[0]]) + ".");
  }
  setSpeed(delta){
    this.speed = Math.max(0, Math.min(SPEEDS.length - 1, this.speed + delta));
    this.lastReal = Date.now();
    this.say("The world runs at " + SPEED_NAME[this.speed] + ".");
  }
  elapsed(){ return this.seconds ? timeLabel(this.seconds) : "no time"; }
  say(text){
    if (!text) return;
    this.log.push(text);
    if (this.log.length > 200) this.log.splice(0, 50);
  }
  warp(address){
    this.facing = 0;                /* you arrive facing the local map */
    this.address = address.slice();
    const p = this.w.position(this.address);
    this.q = p[0]; this.r = p[1];
  }
  /** Make sure the person-sized cell we occupy can be stood in. */
  /** The board under our feet, its layers as of now. */
  /** The town that stood here, if its stones are still standing. */
  hereRuin(){
    if (this.view < DEPTHS - 1) return null;
    return this.w.ruin(this.path(DEPTHS - 1), this.when());
  }
  hereBoard(depth){
    return this.w.layers(this.path(depth === undefined ? DEPTHS : depth),
                         this.when());
  }
  settle(){
    const path = this.address.slice(0, DEPTHS);
    const board = this.w.layers(path, this.when());
    const here = this.address[DEPTHS];
    if (this.w.passable(board, here)) return;
    const order = Array.from({length: BOARD_SIZE}, (_, i) => i);
    const keys = order.map(i => hexDistance(COORDS[i], COORDS[here]));
    order.sort((a, b) => keys[a] - keys[b]);
    for (const i of order)
      if (this.w.passable(board, i)){
        /* Step across to that cell rather than jumping to its address.
         * The position is the truth and the address is a reading of it,
         * and the reading is lossy at the fringe of a board -- so
         * recomputing the position from it can put you a whole parent
         * cell from where you actually are, which at a province a stride
         * is a hundred kilometres. */
        this.q += COORDS[i][0] - COORDS[here][0];
        this.r += COORDS[i][1] - COORDS[here][1];
        this.address = path.concat([i]);
        return;
      }
    /* An ocean lot has nowhere to put a person down.  Crossing whole
     * provinces at a stride will land you in one sooner or later. */
    this.say("There is nothing to stand on here. You are at sea.");
  }

  /* --- creatures ---------------------------------------------------- */
  /** Whatever lives on this L board, made once and remembered. */
  denizens(path){
    path = path || this.address.slice(0, DEPTHS);
    const key = path.join(",");
    const got = this.creatures.get(key);
    if (got !== undefined) return got;
    const data = this.w.layers(path, this.when());
    /* The wildlife of a lot is a layer like any other, and its epoch is
     * twelve days: come back within one and it is the same beasts. */
    const rng = rngFor(path, "life" +
      layerEpoch("animal", cellLevel(DEPTHS), this.when()));
    const out = [];

    const site = this.w.settlement(path.slice(0, -1), this.when());
    if (site && data.settlement){
      const race = RACES[site.race];
      const lang = this.w.languages[site.race];
      const n = rng.randint(0, 4);
      for (let i = 0; i < n; i++){
        const spot = this._free(data, out, rng);
        if (spot === null) break;
        const b = new Being(rng.choice(lang.givenNames()), "person",
          race ? race.glyph : "h", race ? race.color : 250,
          rng.randint(26, 44), 6, 5, 0, "strikes", false);
        b.race = site.race;
        b.profession = rng.choice(["farmer","smith","herder","trader","guard","child"]);
        b.hostile = site.race === "GOBLIN";
        b.x = spot;
        out.push(b);
      }
    }
    const terrain = data.terrain[CENTRE];
    const table = WILDLIFE[WILDLIFE_FOR[terrain.key]];
    if (table){
      const n = rng.randint(0, 3);
      for (let i = 0; i < n; i++){
        const entry = rng.choice(table);
        const m = rng.randint(entry[7][0], entry[7][1]);
        for (let k = 0; k < m; k++){
          const spot = this._free(data, out, rng);
          if (spot === null) break;
          const beast = makeCreature(entry, rng);
          beast.hostile = beast.danger >= 3 ||
                          (beast.danger === 2 && rng.random() < 0.4);
          beast.x = spot;
          out.push(beast);
        }
      }
    }
    this.creatures.set(key, out);
    return out;
  }
  _free(board, taken, rng){
    const used = new Set(taken.map(b => b.x));
    const options = [];
    for (let i = 0; i < BOARD_SIZE; i++)
      if (this.w.passable(board, i) && !used.has(i) && i !== this.address[DEPTHS])
        options.push(i);
    return options.length ? rng.choice(options) : null;
  }
  beingAt(index){
    for (const b of this.denizens()) if (b.alive && b.x === index) return b;
    return null;
  }
  arrive(){
    const data = this.w.board(this.path(DEPTHS));
    const site = this.w.settlement(this.path(DEPTHS - 1), this.when());
    if (site && data.settlement){
      const race = RACES[site.race];
      this.say("This is " + site.name + ", " + site.kind.toLowerCase() +
               " of the " + (race ? race.plural : "folk") + ".");
    }
    const gone = this.hereRuin();
    if (gone && !this.data(DEPTHS - 1).settlement){
      const race = RACES[gone.race];
      this.say("These are the ruins of " + gone.name + ", a " +
               gone.kind.toLowerCase() + " of the " +
               (race ? race.plural : "folk") + ", empty these " +
               gone.emptiedAt(this.when()) + " years.");
    }
    const hostile = this.denizens().filter(b => b.alive && b.hostile);
    if (hostile.length) this.say(cap(hostile[0].theName()) + " is here.");
  }

  /* --- moving, fighting, resting ------------------------------------ */
  move(direction){
    /* You walk on the board you stand on, not on the one you happen to be
     * looking at -- so a step brings the view back to it. */
    const depth = this.walkDepth();
    this.view = depth;
    const [nq, nr] = this.w.stepAxial(this.q, this.r, direction, depth,
                                      this.facing);
    const got = this.w.locate(this.address[0], nq, nr);
    if (!got.ok){
      this.say(got.why === "void"
        ? "Nothing lies that way. This continent is a pentagon, and the " +
          "sixth of it that would have been there is missing."
        : "That is the edge of the planet.");
      return;
    }
    const nxt = got.address;
    /* Walking off a face carries you onto the next one, the way walking
     * off a board carries you into the cell next door. */
    const crossed = nxt[0] !== this.address[0];

    if (depth === DEPTHS){
      const board = this.w.layers(nxt.slice(0, DEPTHS), this.when());
      const target = nxt[DEPTHS];
      const sameBoard = nxt.slice(0, DEPTHS).join(",") ===
                        this.address.slice(0, DEPTHS).join(",");
      if (sameBoard){
        const other = this.beingAt(target);
        if (other){ this.strike(other); return; }
      }
      if (!this.w.passable(board, target)){
        this.say(cap(this.w.blocker(board, target).name) + " is in the way.");
        return;
      }
      this.address = nxt; this.q = got.q; this.r = got.r;
      this.facing = pyMod(this.facing + got.turned, 6);
      this.steps += 1;
      this.spend(this.stride(DEPTHS));
      if (crossed) this.say("You walk over the seam onto " +
                            this.w.nameOf([nxt[0]]) + "." +
                            (got.turned ? this.turnedMsg : ""));
      if (!sameBoard) this.arrive();
      this.creatureTurns();
    } else {
      /* A cell this size is still country you have to walk over, so what
       * is in it can refuse you the same way a boulder does. */
      const terr = this.w.board(nxt.slice(0, depth)).terrain[nxt[depth]];
      if (!terr.passable){
        this.say(terr === T.void
          ? "That is the sixth this continent is missing."
          : cap(terr.name) + " lies that way.  You would need a boat.");
        return;
      }
      /* Crossing a cell costs what the scale table says it costs: a
       * hundred metres a hundred seconds, and so on up. */
      this.spend(this.stride(depth));
      this.address = nxt; this.q = got.q; this.r = got.r;
      this.facing = pyMod(this.facing + got.turned, 6);
      this.settle();
      if (crossed && depth > 0)
        this.say("You cross onto " + this.w.nameOf([nxt[0]]) + "." +
                 (got.turned ? this.turnedMsg : ""));
      this.say("You are in " +
        this.w.nameOf(this.path(depth).concat([this.address[depth]])) + ".");
    }
  }
  /** Pick up whatever is lying here, if it can be carried. */
  take(){
    const board = this.hereBoard();
    const here = this.address[DEPTHS];
    const there = board.item[here];
    if (!there){ this.say("There is nothing here to pick up."); return; }
    if (!there.portable){
      this.say(cap(there.name) + " is not something you can carry."); return;
    }
    const got = this.w.takeItem(this.address, this.when());
    if (!got){ this.say("There is nothing here to pick up."); return; }
    this.player.carried.push(got);
    this.spend(2);
    this.say("You pick up " + got.name + ". (" + got.layer +
             ", size " + got.size + ")");
  }
  /** Put the last thing you picked up back on the ground. */
  drop(){
    if (!this.player.carried.length){
      this.say("You are carrying nothing you could put down."); return;
    }
    const thing = this.player.carried.pop();
    this.w.dropItem(this.address, thing, this.when());
    this.spend(2);
    this.say("You put down " + thing.name +
             ". It will be here when you come back.");
  }

  /** Stand still for a second and let the world move around you. */
  wait(){
    this.spend(this.stride(DEPTHS));
    this.say("You wait.");
    this.creatureTurns();
  }
  strike(other){
    for (const line of attackBeing(this.player, other, this.rng)) this.say(line);
    if (other.dead){
      this.kills.push(other);
      this.say("You have killed " + this.kills.length + " thing" +
               (this.kills.length === 1 ? "" : "s") + ".");
    }
    this.spend(2);
    this.creatureTurns();
  }
  /** Sit still and mend, if nothing is hunting you. */
  rest(hours){
    hours = hours || 1;
    const here = this.address[DEPTHS];
    const threats = this.denizens().filter(b => b.alive && b.hostile &&
      hexDistance(COORDS[b.x], COORDS[here]) <= 4);
    if (threats.length){
      this.say("You cannot rest with " + threats[0].theName() + " so close.");
      return;
    }
    const p = this.player;
    for (let i = 0; i < hours * 4; i++){
      this.creatureTurns();
      if (p.dead) return;
    }
    const healed = Math.min(p.max_hp - p.hp, 3 + hours * 4);
    p.hp += healed;
    if (p.wounds.length && this.rng.random() < 0.5) p.wounds.shift();
    p.bleed = Math.max(0, p.bleed - 1);
    this.spend(hours * 3600);
    this.say("You rest for " + hours + " hour" + (hours === 1 ? "" : "s") + ". " +
             (healed ? "You feel better." : "Nothing mends."));
  }
  /** Whoever is standing beside you, if they will talk. */
  talkTarget(){
    const here = this.address[DEPTHS];
    for (const b of this.denizens()){
      if (!b.alive || b.animal) continue;
      if (hexDistance(COORDS[b.x], COORDS[here]) > 1) continue;
      if (b.hostile){
        this.say(b.name + " has no interest in talking.");
        return null;
      }
      return b;
    }
    this.say("There is nobody beside you to talk to.");
    return null;
  }
  creatureTurns(){
    const here = this.address[DEPTHS];
    const details = this.hereBoard();
    for (const line of stepBleeding(this.player, this.rng)) this.say(line);
    if (this.player.dead) return;
    for (const b of this.denizens()){
      if (!b.alive) continue;
      const d = hexDistance(COORDS[b.x], COORDS[here]);
      for (const line of stepBleeding(b, this.rng)) this.say(line);
      if (!b.alive) continue;
      /* A wounded animal wants out, not a fight to the death. */

    const site = w.settlement(this.path(DEPTHS - 1), this.when());
    const out = [];
    const race = RACES[npc.race];

    let lines = ['"I am ' + npc.name + '. I am a ' + npc.profession + '."'];
    const age = rng.randint(14, npc.race !== "ELF" ? 70 : 300);
    lines.push('"I have seen ' + age + ' winters."');
    if (site){
      lines.push(rng.random() < 0.5
        ? '"I was born in ' + site.name + ' and I have not left it."'
        : '"I came to ' + site.name + ' when I was young."');

    const kin = rng.choice(w.languages[npc.race || "HUMAN"].givenNames());
    lines.push('"' + kin + ' is my ' +
      rng.choice(["mother","father","sister","brother","child","cousin"]) + '."');
    lines.push('"' + rng.choice([
      "There is little to tell. The seasons come round.",
      "I work, and then I sleep. That is the whole of it.",
      "Ask me about the land. That I do know.",
      "You are the first stranger here in a long while."]) + '"');
    out.push(["Yourself", lines]);

    lines = [];
    if (site){
      lines.push('"This is ' + site.name + '. In our own tongue, ' + site.native + '."');
      lines.push('"A ' + site.kind.toLowerCase() + ' of the ' +
                 (race ? race.plural : "folk") + '. ' + site.population +
                 ' of us live here."');
      const age = site.ageAt(this.when());
      lines.push(age > 0 ? '"It was founded ' + age + ' years ago."'
                         : '"We are only just here."');

        "new": '"The place is barely built. Ask again in a lifetime."',
        "growing": '"More come every year. We are running out of room."',
        "thriving": '"It has been so as long as anyone remembers."',
        "ancient": '"Older than the tongue you are asking in."',
        "failing": '"Fewer of us every year. The young ones leave."',
      }[site.standingAt(this.when())] || "");
    }
    lines.push('"The ground you stand on is ' + w.nameOf(this.path(DEPTHS)) + '."');
    lines.push('"It is one of sixty-one lots in ' + w.nameOf(this.path(DEPTHS - 1)) + '."');
    lines.push('"This is ' + this.data(DEPTHS).terrain[this.address[DEPTHS]].name +
               ' country. It is what it is."');
    out.push(["This place", lines]);

    lines = ['"Everything sits inside something larger. Listen:"'];
    for (let depth = DEPTHS - 1; depth >= 0; depth--){
      const level = cellLevel(depth);
      const name = w.nameOf(this.path(depth).concat([this.address[depth]]));
      lines.push('"' + name + ' — ' + sizeLabel(level) + ' across, and ' +
        (depth ? "sixty-one of them make " + w.nameOf(this.path(depth))
               : "thirty-two of them make " + w.nameOf([])) + '."');
    }
    lines.push('"Your address is ' + HanbWorld.formatAddress(this.address) +
               '. Eight marks, one for each."');
    lines.push('"Say it to anyone and they will know the very metre you were standing on."');
    out.push(["The land", lines]);

    lines = [];
    const hereKey = this.address.slice(0, DEPTHS - 1).join(",");
    for (const {site: other, path, dist, brg} of
         w.nearbySettlements(this.address, 1, this.facing,
                             this.when()).slice(0, 6)){
      if (path.join(",") === hereKey) continue;
      lines.push('"' + other.name + ', a ' + other.kind.toLowerCase() + ' of the ' +
        (RACES[other.race] ? RACES[other.race].plural : "folk") + ', lies ' + brg +
        ' — ' + distanceLabel(dist) + ' away, ' + timeLabel(dist) + ' of walking."');
    }
    if (!lines.length) lines.push('"Nothing within a day\'s walk. We are alone here."');
    else lines.push('"Beyond that I could not say. I have not been."');
    out.push(["Directions", lines]);

    lines = [];
    const seen = new Set();
    for (const b of this.denizens()){
      if (!(b.alive && b.animal && b.danger >= 2)) continue;
      if (seen.has(b.name)) continue;
      seen.add(b.name);
      lines.push('"There is ' + b.aName() + ' about, close by. Mind yourself."');
      if (seen.size >= 3) break;
    }
    const hazard = {
      peak:"The high ground kills men who go up it unprepared.",
      mountain:"The mountainside is loose. It moves under you.",
      glacier:"The ice is thin in places and the cold is patient.",
      ice:"The ice is thin in places and the cold is patient.",
      swamp:"The mire will take a horse whole. Keep to the reeds.",
      marsh:"The mire will take a horse whole. Keep to the reeds.",
      desert:"Carry water. There is none out there.",
      badland:"Carry water. There is none out there.",
      jungle:"Everything in the green wants something from you.",
    }[this.data(DEPTHS).terrain[CENTRE].key];
    if (hazard) lines.push('"' + hazard + '"');
    if (!lines.length) lines.push('"Quiet enough, lately. That never lasts."');
    out.push(["Dangers", lines]);
    return out;
  }
}

function seedFromText(text){
  text = (text || "").trim();
  if (!text){
    const a = new Uint32Array(2);
    if (typeof crypto !== "undefined" && crypto.getRandomValues) crypto.getRandomValues(a);
    else { a[0] = (Math.random() * 4294967296) >>> 0; a[1] = (Math.random() * 65536) >>> 0; }
    return (BigInt(a[0]) << 16n) | BigInt(a[1] & 0xffff);   /* 48 bits, as Python does */
  }
  if (/^[+-]?\d+$/.test(text)) return BigInt(text);
  return bytesBig(blake2b(text, 6));
}

/** The character-creation screen's own state, rolled from the world seed. */

    this.w = world;

    this.raceI = 0; this.profI = 0;
    this.name = "";

  }
  raceKey(){ return this.races[this.raceI]; }
  profession(){
    const list = PROFESSIONS[this.raceKey()];
    return list[this.profI % list.length];
  }
  reroll(){
    const lang = this.w.languages[this.raceKey()];
    const given = this.rng.choice(lang.givenNames());
    const a = this.rng.choice(ALL_NOUNS);
    const b = this.rng.choice(ALL_ADJECTIVES);
    let surname = lang.word(a) + lang.word(b).toLowerCase();
    if (surname.length > 15) surname = lang.word(a);
    this.name = given + " " + surname;
  }
  adjustRace(delta){
    this.raceI = pyMod(this.raceI + delta, this.races.length);
    this.profI = 0;

  }
  adjustProfession(delta){
    this.profI = pyMod(this.profI + delta, PROFESSIONS[this.raceKey()].length);
  }
  begin(){
    const race = this.raceKey();
    const rng = new PyRandom(this.seed ^ nameSeed(this.name));
    const [address, site] = this.w.findStart(rng, race);
    const player = new Being(this.name, "player", "@", 231,
      RACE_HP[race] || 68, 11, 7, 0, "strike", false);
    player.player = true;
    player.race = race;
    player.profession = this.profession();
    player.weapon = PROFESSION_WEAPON[player.profession] || "short sword";
    player.inventory = [player.weapon, "a pack", "three days' rations", "a waterskin"];
    return new Game(this.w, address, this.seed, player, site);
  }
}

/* ====================================================================
 * The terminal, in a browser.
 *
 * hanb.c keeps an eighty by twenty-five framebuffer in which every
 * character cell is one of three things: a ▀ half block, where the
 * foreground is the upper pixel and the background the lower; a quarter
 * block, where a four-bit mask says which quarters take the foreground;
 * or a literal character.  It then writes that out with SGR colours.
 *
 * This is the same framebuffer, painted onto a canvas.  The blocks are
 * drawn as rectangles rather than as glyphs, which is what they are --
 * so the page cannot be broken by a font that has no ▀ or ▖▗▘▝ in it,
 * and the picture is exactly the one the terminal draws.
 * ==================================================================== */

                  [255,0,0],[0,255,0],[255,255,0],[0,0,255],[255,0,255],

/* ── putting the framebuffer on a canvas ─────────────────────
 * One character is CW by CH device pixels; a half block is two stacked
 * rectangles and a quarter block is four.  Anything else is a glyph in
 * the terminal's own monospace, drawn over its background. */

    for (let col = 0; col < SCREEN_W; col++){

      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];

        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){          /* ▖▗▘▝ and their combinations */
        const m = fb_q[at];

          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);

        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
