<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Beano & Cromulus12 Show</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Courier New', monospace;
    background: #0a0a12;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }

  .chat-container {
    width: 100%;
    max-width: 550px;
    background: #111118;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 90vh;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }

  .header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    padding: 14px 20px;
    border-bottom: 1px solid #2a2a3a;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-icon {
    font-size: 28px;
  }

  .header h1 {
    font-size: 16px;
    color: #7b8cff;
    letter-spacing: 1px;
  }

  .header p {
    font-size: 11px;
    color: #555;
    margin-top: 2px;
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-beano {
    align-self: flex-start;
    background: #1a1a30;
    border: 1px solid #2a2a4a;
    border-bottom-left-radius: 3px;
  }

  .msg-cromulus {
    align-self: flex-end;
    background: #0d1f1a;
    border: 1px solid #1a3a2a;
    border-bottom-right-radius: 3px;
  }

  .msg-system {
    align-self: center;
    background: transparent;
    border: 1px dashed #333;
    color: #666;
    font-size: 11px;
    text-align: center;
    max-width: 90%;
    padding: 6px 14px;
    border-radius: 6px;
  }

  .nick {
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .nick-beano { color: #6677ff; }
  .nick-cromulus { color: #44cc88; }

  .typing-indicator {
    padding: 8px 14px;
    color: #555;
    font-size: 12px;
    font-style: italic;
    display: none;
  }

  .input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: #0d0d15;
    border-top: 1px solid #2a2a3a;
  }

  .input-bar button {
    flex: 1;
    padding: 10px;
    background: #1a1a2e;
    border: 1px solid #333;
    color: #888;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.2s;
  }

  .input-bar button:hover {
    background: #2a2a4a;
    color: #ccc;
    border-color: #555;
  }

  .input-bar button.active {
    background: #1a2a1a;
    border-color: #2a4a2a;
    color: #44cc88;
  }

  /* Scrollbar */
  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }

  .briefcase-emoji {
    position: absolute;
    top: -8px;
    right: -8px;
    font-size: 16px;
    opacity: 0;
    transition: opacity 1s;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <div class="header-icon">🌌</div>
    <div>
      <h1>THE BEANO & CROMULUS12 SHOW</h1>
      <p>#lobby — original h4ks.com content</p>
    </div>
  </div>
  
  <div class="chat-area" id="chatArea">
    <div class="message msg-system">
      🎬 Scene: Beano's apartment, evening. A closet door is visible in the background.
    </div>
  </div>

  <div class="typing-indicator" id="typingIndicator"></div>

  <div class="input-bar">
    <button id="nextBtn" onclick="advance()">▶ Next line</button>
    <button id="autoBtn" onclick="toggleAuto()">⏵ Auto-play</button>
  </div>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const typingIndicator = document.getElementById('typingIndicator');
const nextBtn = document.getElementById('nextBtn');

const script = [
  { type: 'system', text: '🎵 Scene: Beano\'s apartment. The closet door is slightly ajar.' },
  
  { speaker: 'cromulus', text: "Beano. You're staring at the closet again." },
  
  { speaker: 'beano', text: "What? No I'm not. I was looking at... the wall. Near the closet. Different thing." },
  
  { speaker: 'cromulus', text: "You've looked at that closet six times in the last ten minutes. I counted. I am very good at counting." },
  
  { speaker: 'beano', text: "It's nothing. Anyway — you want some snacks? I think I have some... stuff. In the kitchen." },
  
  { speaker: 'cromulus', text: "I brought my own. Dried Lochlorian sand worms. Fresh batch." },
  
  { speaker: 'beano', text: "Those smell like a tire fire, man." },
  
  { speaker: 'cromulus', text: "That is how you know they are quality." },
  
  { type: 'system', text: '⏳ A long silence. Beano glances at the closet again.' },
  
  { speaker: 'beano', text: "Crom... can I ask you something? Hypothetically." },
  
  { speaker: 'cromulus', text: "I am from possibly Betelgeuse. Nothing you ask will surprise me." },
  
  { speaker: 'beano', text: "If you had a... thing. Like an object. And when you opened it, it connected you to another version of reality — would you open it?" },
  
  { speaker: 'cromulus', text: "Another version of reality as in... what kind?" },
  
  { speaker: 'beano', text: "Like a version where everything is almost the same. But slightly different. A version of YOU that's almost you but isn't." },
  
  { speaker: 'cromulus', text: "Ah. You mean like how Earth people think Vegans don't eat meat because of a supply chain misunderstanding? That kind of almost-the-same-but-different?" },
  
  { speaker: 'beano', text: "...sure. Yeah. Like that." },
  
  { speaker: 'cromulus', text: "My uncle sells Vegan sausages across four star systems. He would say: the problem is not the product, it is the courage to open the door. Metaphorically." },
  
  { speaker: 'beano', text: "Right. Yeah. Metaphorically." },
  
  { type: 'system', text: '🔇 Another long silence. Beano is sweating.' },
  
  { speaker: 'cromulus', text: "Beano. What is on the top shelf of your closet?" },
  
  { speaker: 'beano', text: "Luggage. Old luggage. Very normal luggage that is definitely not anything else. Can we talk about something else? How's your uncle? The butcher?" },
  
  { speaker: 'cromulus', text: "Doing well. Expanding into the Rigel sector. The Vegan sausage market is very strong right now — turns out people love real meat made by someone from Vega." },
  
  { speaker: 'beano', text: "That's great. That's really great. Hey look at the time." },
  
  { speaker: 'cromulus', text: "It is 7:15 PM, Beano. In Earth time, that is not late." },
  
  { speaker: 'beano', text: "I should check on my... luggage." },
  
  { type: 'system', text: '🚶 Beano walks to the closet. Reaches up to the top shelf. Hesitates.' },
  
  { speaker: 'cromulus', text: "...I will pretend I am looking at my sand worms." },
  
  { type: 'system', text: '🧳 Beano opens something. A faint shimmer of impossible light fills the room for half a second. He slams it shut immediately.' },
  
  { speaker: 'beano', text: "OK. We don't talk about this. Ever. To anyone." },
  
  { speaker: 'cromulus', text: "Talk about what? I am eating sand worms. I saw nothing. Very delicious sand worms." },
  
  { speaker: 'beano', text: "...thanks, Crom." },
  
  { speaker: 'cromulus', text: "You are my best friend, Beano. Even if your diet is terrible. Blue goo is not food." },
  
  { speaker: 'beano', text: "It MIGHT have been blue cheese." },
  
  { speaker: 'cromulus', text: "It was not." },
  
  { type: 'system', text: '🎙️ END SCENE — The Beano & Cromulus12 Show' },
];

let index = 0;
let autoMode = false;
let autoTimer = null;

function addMessage(entry) {
  const div = document.createElement('div');
  
  if (entry.type === 'system') {
    div.className = 'message msg-system';
    div.textContent = entry.text;
  } else {
    div.className = entry.speaker === 'beano' ? 'message msg-beano' : 'message msg-cromulus';
    const nickDiv = document.createElement('div');
    nickDiv.className = entry.speaker === 'beano' ? 'nick nick-beano' : 'nick nick-cromulus';
    nickDiv.textContent = entry.speaker === 'beano' ? '● Beano' : '● Cromulus12';
    div.appendChild(nickDiv);
    
    const textDiv = document.createElement('div');
    textDiv.textContent = entry.text;
    div.appendChild(textDiv);
    
    if (entry.speaker === 'beano' && entry.text.includes('closet')) {
      const bc = document.createElement('div');
      bc.className = 'briefcase-emoji';
      bc.textContent = '🧳';
      div.appendChild(bc);
      setTimeout(() => bc.style.opacity = '0.6', 500);
    }
  }
  
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function advance() {
  if (index >= script.length) {
    nextBtn.textContent = '✓ The End';
    nextBtn.disabled = true;
    return;
  }
  
  const entry = script[index];
  
  // Show typing indicator for dialogue
  if (entry.speaker) {
    typingIndicator.style.display = 'block';
    typingIndicator.textContent = (entry.speaker === 'beano' ? 'Beano' : 'Cromulus12') + ' is typing...';
    
    const delay = 600 + Math.random() * 800;
    setTimeout(() => {
      typingIndicator.style.display = 'none';
      addMessage(entry);
    }, delay);
  } else {
    typingIndicator.style.display = 'none';
    setTimeout(() => addMessage(entry), 300);
  }
  
  index++;
  
  if (index >= script.length) {
    setTimeout(() => {
      nextBtn.textContent = '✓ The End';
    }, 1500);
  }
}

function toggleAuto() {
  const btn = document.getElementById('autoBtn');
  autoMode = !autoMode;
  
  if (autoMode) {
    btn.textContent = '⏸ Pause';
    btn.classList.add('active');
    autoPlay();
  } else {
    btn.textContent = '⏵ Auto-play';
    btn.classList.remove('active');
    if (autoTimer) clearTimeout(autoTimer);
  }
}

function autoPlay() {
  if (!autoMode || index >= script.length) return;
  advance();
  autoTimer = setTimeout(autoPlay, 2200);
}

// Start with first system message visible
advance();
</script>

</body>
</html>
