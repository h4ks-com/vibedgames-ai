    if (want < -2) want = -2;

  }

    const a = R_[i], b = R_[j];

function rider_px(b, gx, gy, gw, gh){
  const lean = b.air > 0 ? b.pitch : 0;
  const top = gh >= 4 ? 1 : 0;
  const hd = 1, rest = gh - top - hd;
  const band = gy < top ? -1 : gy < top + hd ? 0 : gy < top + hd + (((rest + 1) / 2) | 0) ? 1 : 2;
  if (band < 0) return -1;
  let w = band === 0 ? ((gw * 3 / 8) | 0) : band === 1 ? ((gw * 5 / 8) | 0) : ((gw * 7 / 8) | 0);
  if (w < 1) w = 1;
  const x = (((gw - w) / 2) | 0) + (band === 2 ? 0 : lean);
  if (gx < x || gx >= x + w) return -1;
  if (b.down) return 244;
  if (band === 2) return 16;
  return band === 0 ? 250 : RIDER_FG[R_.indexOf(b)];
}
function rider_at(r, c){

function put_pixel(fine, tx, gx, y, c){ if (fine) pxq(tx * 2 + gx, y, c); else px(tx + gx, y, c); }
function draw_cell(tx, ty, r, c, mark, lit){
  const k = RS[r].c[c];

  const fine = tile_shape === SHAPE_FINE, hexed = tile_shape !== SHAPE_BRICK;
  const gw = fine ? TILE_W * 2 : TILE_W, gh = hexed ? PIX_H + 1 : PIX_H;
  const tip = (gw / 4) | 0, tipw = (gw / 2) | 0;
  const y0 = ty * 2 + (hexed ? 1 : 0);
  const tex = hash3u((r * 7919) >>> 0, Number(SEED & 0xFFFFFFFFn), 5);
  const b = mark ? null : rider_at(r, c);
  let base = G.bg, acc = G.fg, sprinkle = 20 + G.prom * 12;
  if (k.ground === G_HOLE){ base = acc = 16; sprinkle = 0; }
  for (let gy = 0; gy < gh; gy++){
    let lo = 0, hi = gw;
    if (hexed && (gy === 0 || gy === gh - 1)){ lo = tip; hi = tip + tipw; }
    for (let gx = lo; gx < hi; gx++){
      const h = hash3u(tex, c >>> 0, (gy * 8 + gx) >>> 0);
      let col = ((h & 0xFF) < sprinkle) ? acc : base;
      if (k.ground === G_LINE) col = ((gx + gy) & 1) ? 255 : 16;
      if (k.ground === G_ARROW) col = (gy === ((gh / 2) | 0) && gx >= lo + 1 && gx < hi - 1) ? 226 : base;
      if (k.ground === G_OFF) col = (((h >>> 5) & 7) === 0) ? lighter(base) : base;
      if (k.rise > 0 && k.ground !== G_HOLE && gy === 0) col = 250;
      if (b){ const me = rider_px(b, gx, gy, gw, gh); if (me >= 0) col = me; }

}

function wrap_lines(s, width, max){

function fb_hash(){

let save_store = {get: () => null, set: (s) => {}};

    track_no: track_no, laps_to_do: laps_to_do, race_on: race_on, race_over: race_over,
    designing: designing, deaths: deaths, stalled: stalled, tile_shape: tile_shape, turn: turn,

function load_game(){
  let s;

  if (!s || s.magic !== "designmode") return 0;
  SEED = BigInt(s.seed); SEEDTEXT = s.seedtext;
  track_no = s.track_no; laps_to_do = s.laps_to_do; race_on = s.race_on; race_over = s.race_over;
  designing = s.designing; deaths = s.deaths; stalled = s.stalled; tile_shape = s.tile_shape; turn = s.turn;
  for (let i = 0; i < RIDER_N; i++) Object.assign(R_[i], s.riders[i]);
  message[0] = s.msg[0]; message[1] = s.msg[1];

}
function handle_key(ch){
  const c = typeof ch === "number" ? ch : ch.charCodeAt(0);
  const key = String.fromCharCode(c);
  if (show_intro){
    if (key === 'q' || c === 27 || c === 3) return 0;
    show_intro = 0;
    sound_scene();
    return 1;
  }
  if (show_keys){ show_keys = 0; return 1; }
  if (race_over || show_story){
    if (key === 'n'){ new_game(); show_intro = 0; sound_scene(); return 1; }
    if (key === 'c'){ show_story = 0; new_game(); show_intro = 0; return 1; }
    if (key === 'q' || c === 27 || c === 3) return 0;
    if (key === 'L'){ say(load_game() ? "Loaded." : "There is no saved race."); return 1; }
    return 1;
  }
  if (key_dir(key) >= 0){ move_key(key); return 1; }
  switch (key){
  case '.': case 's': end_turn(); break;
  case 'g': turbo_key(); break;
  case 'S': say(save_game() ? "Saved." : "It would not save."); break;
  case 'L': say(load_game() ? "Loaded." : "There is no saved race."); break;
  case 'T': tile_shape = (tile_shape + 1) % SHAPE_N; say(SHAPE_NAME[tile_shape] + " tiles."); break;
  case '?': show_keys = 1; break;

  return 1;
}

 * --walk rides all five tracks with no screen, the same keys a player

let walk_out = [];

function wprint(s){
  walk_out.push(padl(turn, 6) + "  T" + (track_no + 1) + " c" + padr(YOU.x, 4) + " L" + YOU.lap + " lane " + (YOU.lane + 1) + " sp" + padr(YOU.speed, 2) + " t" + padr(YOU.temp, 2) + " " + s);

function wk(c){
  if (show_keys || show_intro){ handle_key(' '); walk_keystring[walk_keys] = ' '; walk_keys++; }
  handle_key(c);

  walk_keys++;

  if (message[1] !== walk_seen[0] && message[1] !== walk_seen[1] && message[1].length) wprint(message[1]);
  if (message[0] !== walk_seen[0] && message[0].length) wprint(message[0]);

function lane_run(lane, from, ahead){

    const nearer = Math.abs(l - YOU.lane) < Math.abs(best - YOU.lane);

    const at = b.x + b.speed * b.air;
    let want = rise_under(at) - rise_under(at + 1);
    if (want > 2) want = 2;
    if (want < -2) want = -2;
    wsite = "pitch";
    if (b.pitch < want) wk('e');
    else if (b.pitch > want) wk('x');
    else wk('.');
    return 1;
  }
  if (stalled){ wsite = "cool"; wk('.'); return 1; }
  const run = lane_run(b.lane, b.x, b.speed + 3);
  if (run <= b.speed + 1){
    const to = best_lane(b.speed + 3);
    if (to !== b.lane){ wsite = "lane"; wk(to < b.lane ? 'w' : 'e'); return 1; }
    if (run <= 1 && b.speed > 2){ wsite = "slow"; wk('a'); return 1; }
  }
  if (b.temp < TEMP_MAX - 6 && b.speed < SPEED_MAX - 2 && run > b.speed + 2){ wsite = "turbo"; wk('g'); return 1; }
  if (b.speed < SPEED_RUN){ wsite = "throttle"; wk('d'); return 1; }
  wsite = "hold"; wk('.');
  return 1;
}
function check_walk(seedText, trace){
  walk_out = [];
  walk_trace = trace ? 1 : 0;
  walk_keys = 0; walk_keystring = [];
  reset_statics();
  setSeed(seedText);
  dice_state = 0x243F6A8885A308D3n ^ SEED;
  lay_rooms();
  show_intro = 0;
  walk_seen[0] = walk_seen[1] = "";
  let failed = 0;
  for (let t = 0; t < TRACK_N; t++){
    laps_to_do = 2;
    deaths = 0;
    race_start(t);
    show_intro = 0;
    walk_out.push("");
    walk_out.push("-- " + TRACK[t].name + ": " + cols_of() + " columns, " + laps_to_do + " laps");
    let guard = 0;
    while (!race_over && guard++ < 40000) wride_one();
    if (!race_over){ walk_out.push(""); walk_out.push(padl(turn, 6) + "  WALK FAILED on " + TRACK[t].name + " at column " + YOU.x + ", lane " + (YOU.lane + 1) + ": the race would not end"); failed = 1; break; }
    walk_out.push(padl(turn, 6) + "  " + TRACK[t].name + " done: " + turn + " turns, " + deaths + " spills");
    if (deaths > 40){ walk_out.push(""); walk_out.push(padl(turn, 6) + "  WALK FAILED on " + TRACK[t].name + ": down " + deaths + " times"); failed = 1; break; }
  }
  if (!failed){ walk_out.push(""); walk_out.push("WALK OK: " + walk_keys + " keys over " + TRACK_N + " tracks; every one ridden to the end"); }
  if (walk_trace) walk_out.push("keys " + walk_keystring.slice(0, walk_keys).join(""));
  return walk_out;
}

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same 2A03 and played
 * as a buffer; the tune loops until the next one. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the tune's intro once, then its loop */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("designmode.sav"),
  set: (s) => localStorage.setItem("designmode.sav", s),
};
start_game(params.get("seed"));
if (SOUND.on) SOUND.command("bed title");
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left the Mushroom World.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: the six ways are d x z a w e as in
 * mushroomworld.c; the arrows are left and right, and up and down the
 * way you face; Escape is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return facing ? 'e' : 'w';
  if (e.key === "ArrowDown") return facing ? 'x' : 'z';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
