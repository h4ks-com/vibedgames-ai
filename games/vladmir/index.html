<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Putin Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141a2e; color: #fff; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #141a2e; z-index: 2; }
  #start { font-size: 20px; padding: 14px 28px; border: 0; border-radius: 8px; background: #3b5bdb; color: #fff; cursor: pointer; }
  #status { opacity: .8; font-size: 14px; min-height: 1em; }
  #hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: .6; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@latest/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="overlay">
  <button id="start">Start</button>
  <div id="status">Loading…</div>
</div>
<div id="hint">drag to orbit · scroll to zoom</div>
<audio id="music" src="music.mp3" loop preload="auto"></audio>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');
const statusEl = document.getElementById('status');
const music = document.getElementById('music');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141a2e);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.5, 4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x334466, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(3, 5, 4);
scene.add(sun);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(4, 64),
  new THREE.MeshStandardMaterial({ color: 0x222c48, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

let mixer = null;
const clock = new THREE.Clock();

const loader = new GLTFLoader();
loader.load(
  'character.glb',
  (gltf) => {
    const model = gltf.scene;
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const scale = 2 / Math.max(size.x, size.y, size.z || 1);
    model.scale.setScalar(scale);
    model.position.x -= center.x * scale;
    model.position.z -= center.z * scale;
    model.position.y -= box.min.y * scale;
    scene.add(model);
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      mixer.clipAction(gltf.animations[0]).play();
    }
    statusEl.textContent = 'Ready';
    startBtn.disabled = false;
  },
  (xhr) => {
    if (xhr.total) statusEl.textContent = 'Loading model… ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
  },
  (err) => {
    console.error('GLB load failed', err);
    statusEl.textContent = 'Failed to load character.glb (see console)';
    startBtn.disabled = true;
  }
);

startBtn.disabled = true;
startBtn.addEventListener('click', () => {
  overlay.remove();
  music.play().catch((e) => console.warn('audio blocked', e));
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
