<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Putin Playground</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:sans-serif;color:#fff}
canvas{display:block}
#ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:2}
#bar{width:240px;height:10px;background:#333;border-radius:5px;overflow:hidden;margin:12px 0}
#fill{height:100%;width:0;background:#e33;transition:width .1s}
button{font-size:20px;padding:10px 28px;border:0;border-radius:6px;background:#e33;color:#fff;cursor:pointer}
button:disabled{background:#555;cursor:default}
#err{color:#f88;max-width:80vw;text-align:center;margin-top:12px;white-space:pre-wrap}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@latest/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="ui">
  <div id="status">Loading model…</div>
  <div id="bar"><div id="fill"></div></div>
  <button id="start" disabled>Start</button>
  <div id="err"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const statusEl = document.getElementById('status');
const fill = document.getElementById('fill');
const startBtn = document.getElementById('start');
const errEl = document.getElementById('err');
const ui = document.getElementById('ui');

function showError(msg) {
  console.error(msg);
  errEl.textContent = msg;
  statusEl.textContent = 'Something went wrong';
}
window.addEventListener('error', e => showError(String(e.message || e)));

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202830);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 1.5, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(3, 5, 4);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 64),
  new THREE.MeshStandardMaterial({ color: 0x333a40, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Audio (starts on Start click, since browsers block autoplay)
const music = new Audio('music.mp3');
music.loop = true;
music.preload = 'auto';

// Model
let mixer = null;
const clock = new THREE.Clock();

const loader = new GLTFLoader();
// Must be set BEFORE loading, or compressed (meshopt) GLBs fail to load.
loader.setMeshoptDecoder(MeshoptDecoder);

loader.load(
  'character.glb',
  gltf => {
    const model = gltf.scene;

    // Center on the ground and scale to ~2 units tall
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const scale = 2 / (size.y || 1);
    model.scale.setScalar(scale);
    model.position.x -= center.x * scale;
    model.position.z -= center.z * scale;
    model.position.y -= box.min.y * scale;

    model.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
    scene.add(model);

    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      mixer.clipAction(gltf.animations[0]).play();
    }

    fill.style.width = '100%';
    statusEl.textContent = 'Ready';
    startBtn.disabled = false;
  },
  xhr => {
    if (xhr.total) {
      fill.style.width = Math.round((xhr.loaded / xhr.total) * 100) + '%';
      statusEl.textContent = 'Loading model… ' + Math.round((xhr.loaded / xhr.total) * 100) + '%';
    }
  },
  err => showError('GLB load failed: ' + (err && err.message ? err.message : err))
);

startBtn.addEventListener('click', () => {
  ui.style.display = 'none';
  music.play().catch(e => console.warn('Audio play failed:', e));
});

// Loop
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
