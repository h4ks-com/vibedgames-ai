<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⌨️ Typist — The Idle Keystroke Game</title>
<style>
:root {
  --bg: #1a1b26; --fg: #c0caf5; --muted: #565f89; --accent: #7aa2f7;
  --accent2: #bb9af7; --gold: #e0af68; --panel: #24283b; --border: #2a2e46;
  --green: #9ece6a; --red: #f7768e; --cursor: #7aa2f7;
  --paper-bg: #16161e; --paper-fg: #c0caf5;
  --font: 'Courier New', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--fg); font-family:var(--font); height:100vh; overflow:hidden; display:flex; flex-direction:column; -webkit-tap-highlight-color:transparent; }

#topbar { display:flex; align-items:center; justify-content:space-between; padding:6px 16px; background:var(--panel); border-bottom:1px solid var(--border); font-size:12px; z-index:100; gap:12px; flex-shrink:0; }
#topbar .title { font-size:16px; font-weight:bold; color:var(--accent); white-space:nowrap; }
#stats { display:flex; gap:20px; flex-wrap:wrap; }
.stat { display:flex; flex-direction:column; align-items:center; gap:1px; }
.stat .label { font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
.stat .val { font-size:16px; font-weight:bold; }
#themeSelect { background:var(--bg); color:var(--fg); border:1px solid var(--border); padding:4px 8px; font-family:var(--font); font-size:11px; border-radius:4px; cursor:pointer; }
#themeSelect:hover { border-color:var(--accent); }

#main { display:flex; flex:1; overflow:hidden; }

#paperContainer { flex:1; overflow:hidden; display:flex; flex-direction:column; background:var(--paper-bg); position:relative; }
#paper { flex:1; overflow-y:auto; padding:32px 48px; font-family:var(--font); font-size:15px; line-height:1.8; color:var(--paper-fg); outline:none; white-space:pre-wrap; word-wrap:break-word; cursor:text; position:relative; }
#paper::after { content:'▎'; color:var(--cursor); animation:blink 1s infinite; }
@keyframes blink { 0%,50%{opacity:1;} 51%,100%{opacity:0;} }

/* Hidden input for mobile keyboard */
#mobileInput {
  position:absolute; top:0; left:0; width:1px; height:1px;
  opacity:0; border:none; outline:none; font-size:16px;
  caret-color:transparent; z-index:-1;
}

.floatGain { position:absolute; font-size:13px; font-weight:bold; color:var(--gold); pointer-events:none; animation:floatUp 1.2s ease-out forwards; z-index:10; text-shadow:0 0 6px rgba(224,175,104,0.4); }
@keyframes floatUp { 0%{transform:translateY(0);opacity:1;} 100%{transform:translateY(-40px);opacity:0;} }

#inputBar { padding:8px 16px; background:var(--panel); border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; flex-shrink:0; }
#inputBar .hint { font-size:10px; color:var(--muted); white-space:nowrap; }
#clearBtn { background:transparent; border:1px solid var(--border); color:var(--muted); padding:4px 10px; font-family:var(--font); font-size:10px; border-radius:4px; cursor:pointer; }
#clearBtn:hover { border-color:var(--red); color:var(--red); }

#sidebar { width:300px; background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
#sidebarTabs { display:flex; border-bottom:1px solid var(--border); }
.sidebarTab { flex:1; padding:8px; text-align:center; font-size:11px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; }
.sidebarTab:hover { color:var(--fg); }
.sidebarTab.active { color:var(--accent); border-bottom-color:var(--accent); }
#shopContent, #achievementsContent { overflow-y:auto; padding:8px; flex:1; }
#achievementsContent { display:none; }
.shopItem { padding:8px; margin-bottom:4px; border:1px solid var(--border); border-radius:6px; cursor:pointer; transition:border-color 0.2s, opacity 0.2s; }
.shopItem:hover { border-color:var(--accent); }
.shopItem.disabled { opacity:0.45; cursor:not-allowed; }
.shopItem.disabled:hover { border-color:var(--border); }
.itemName { font-size:12px; font-weight:bold; color:var(--fg); }
.itemDesc { font-size:10px; color:var(--muted); margin-top:1px; }
.itemBottom { display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
.itemCost { font-size:12px; color:var(--gold); font-weight:bold; }
.itemCount { font-size:10px; color:var(--accent); }
.achItem { padding:6px 8px; margin-bottom:4px; border-radius:6px; }
.achItem.locked { opacity:0.5; }
.achItem.unlocked { background:rgba(158,206,106,0.1); border:1px solid var(--green); }
.achName { font-size:11px; font-weight:bold; }
.achDesc { font-size:10px; color:var(--muted); }

#wpmDisplay { position:absolute; top:8px; left:16px; z-index:50; text-align:center; }
#wpmLabel { font-size:9px; color:var(--muted); text-transform:uppercase; }
#wpmValue { font-size:20px; font-weight:bold; color:var(--green); }
#comboDisplay { position:absolute; top:8px; right:16px; z-index:50; text-align:center; }
#comboText { font-size:9px; color:var(--muted); text-transform:uppercase; }
#comboMult { font-size:20px; font-weight:bold; color:var(--accent); }
#comboTimer { width:60px; height:3px; background:var(--border); border-radius:2px; overflow:hidden; margin-top:2px; }
#comboTimerBar { height:100%; background:var(--accent); width:0%; transition:width 0.1s linear; }
.particle { position:absolute; width:4px; height:4px; border-radius:50%; pointer-events:none; z-index:5; }

@media (max-width:700px) {
  #sidebar { width:200px; }
  #paper { padding:20px 16px; font-size:13px; }
  #stats { gap:10px; }
  .stat .val { font-size:13px; }
  #topbar .title { font-size:14px; }
  .stat .label { font-size:8px; }
}
</style>
</head>

// ═══════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════
function fmt(n) {
  if(n>=1e12)return(n/1e12).toFixed(2)+'T';
  if(n>=1e9)return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return Math.floor(n).toString();
}
function getUpgradeCost(up,owned){return Math.ceil(up.baseCost*Math.pow(up.costMult,owned));}
function getActiveUpgrades(){return THEMES[state.theme].upgrades;}

function recalcStats() {
  let perKey=1,perSec=0,comboDecay=2.5,mult=1;
  for(const up of getActiveUpgrades()){
    const owned=state.upgrades[up.id]||0;
    if(owned>0){
      if(up.effect.perKey)perKey+=up.effect.perKey*owned;
      if(up.effect.perSec)perSec+=up.effect.perSec*owned;
      if(up.effect.comboDecayAdd)comboDecay+=up.effect.comboDecayAdd*owned;
      if(up.effect.mult)mult*=Math.pow(up.effect.mult,owned);
    }
  }
  state.perKey=perKey*mult;
  state.perSec=perSec*mult;
  state.comboDecay=comboDecay;
}

function getCurrentWPM() {
  const now=Date.now();
  const recent=state.recentKeys.filter(t=>now-t<60000);
  return Math.round(recent.length/5);
}

// ═══════════════════════════════════════
// THEME
// ═══════════════════════════════════════
function applyTheme(name) {
  state.theme=name;
  state.themesTried.add(name);
  const theme=THEMES[name];
  for(const[k,v]of Object.entries(theme.vars)){
    document.documentElement.style.setProperty(k,v);
  }
  document.body.style.fontFamily=theme.vars['--font']||"'Courier New',monospace";
  recalcStats();
  renderShop();
}

function buildThemeSelect() {
  const sel=document.getElementById('themeSelect');
  sel.onchange=()=>applyTheme(sel.value);
}

    state.combo=1;
  }
  state.comboMax=Math.max(state.comboMax,state.combo);
  state.comboTimer=state.comboDecay;
  state.lastKeyTime=now;

  // Track for WPM
  state.recentKeys.push(now);
  state.recentKeys=state.recentKeys.filter(t=>now-t<60000);

  // Calculate earnings
  const earn=state.perKey*state.combo;
  state.credits+=earn;
  state.totalEarned+=earn;
  state.totalKeys++;

  // Show text
  state.paperContent+=char;
  if(state.paperContent.length>5000){
    state.paperContent=state.paperContent.slice(-3000);
  }
  renderPaper();

  // Floating gain + particles
  showFloatGain(earn);
  spawnParticles();
}

// Desktop: keydown
document.addEventListener('keydown',(e)=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT')return;
  if(e.target===mobileInput)return; // handled by input event
  if(e.ctrlKey||e.metaKey||e.altKey)return;

  let char=e.key;
  if(char.length!==1){
    if(char==='Enter')char='\n';
    else if(char==='Tab'){e.preventDefault();char='  ';}
    else return;
  }
  e.preventDefault();
  processChar(char);
});

// Mobile: hidden input captures keystrokes
mobileInput.addEventListener('input',(e)=>{
  const val=mobileInput.value;
  // Process all new characters since last check
  if(val.length>state.mobileInputVal.length){
    const newChars=val.slice(state.mobileInputVal.length);
    for(const char of newChars){
      if(char==='\n'){
        processChar('\n');
      } else if(char.length===1){
        processChar(char);
      }
    }
  }
  // Clear input periodically to prevent it growing unbounded
  if(val.length>50){
    mobileInput.value='';
    state.mobileInputVal='';
  } else {
    state.mobileInputVal=val;
  }
  // Keep mobile input focused
  mobileInput.focus();
});

mobileInput.addEventListener('keydown',(e)=>{
  // Handle Enter on mobile
  if(e.key==='Enter'){
    e.preventDefault();
    processChar('\n');
    mobileInput.value='';
    state.mobileInputVal='';
  }
});

// Tap on paper focuses hidden input (mobile)
paperContainer.addEventListener('click',(e)=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;
  if(e.target.classList.contains('sidebarTab'))return;
  // Focus hidden input for mobile keyboard
  mobileInput.focus();
  // Also focus paper for desktop
  paper.focus();
});

// Touch handler for mobile — bring up keyboard
paperContainer.addEventListener('touchstart',(e)=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;
  setTimeout(()=>mobileInput.focus(),100);
},{passive:true});

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function renderPaper(){
  paper.textContent=state.paperContent;
  paper.scrollTop=paper.scrollHeight;
}

function showFloatGain(amount){
  const el=document.createElement('div');
  el.className='floatGain';
  el.textContent='+'+fmt(amount);
  const rect=paper.getBoundingClientRect();
  el.style.left=(rect.width/2-30+Math.random()*60)+'px';
  el.style.top=(rect.height/2-20+Math.random()*40)+'px';
  paperContainer.appendChild(el);
  setTimeout(()=>el.remove(),1200);
}

function spawnParticles(){
  const colors=[getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(),getComputedStyle(document.documentElement).getPropertyValue('--gold').trim(),getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim()];
  const rect=paperContainer.getBoundingClientRect();
  const cx=rect.width/2,cy=rect.height/2;
  for(let i=0;i<4;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.background=colors[i%colors.length];
    p.style.left=cx+'px';
    p.style.top=cy+'px';
    paperContainer.appendChild(p);
    const angle=Math.random()*Math.PI*2;
    const dist=30+Math.random()*50;
    const dx=Math.cos(angle)*dist;
    const dy=Math.sin(angle)*dist;
    p.animate([
      {transform:'translate(0,0)',opacity:1},
      {transform:`translate(${dx}px,${dy}px)`,opacity:0},
    ],{duration:600,easing:'ease-out'});
    setTimeout(()=>p.remove(),600);
  }
}

// ═══════════════════════════════════════
// UI UPDATE
// ═══════════════════════════════════════
function updateUI(){
  document.getElementById('creditsVal').textContent=fmt(state.credits);
  document.getElementById('perKeyVal').textContent=fmt(state.perKey);
  document.getElementById('perSecVal').textContent=fmt(state.perSec);
  document.getElementById('totalKeysVal').textContent=fmt(state.totalKeys);
  document.getElementById('wpmValue').textContent=getCurrentWPM();
  document.getElementById('comboMult').textContent='×'+state.combo.toFixed(1);
  const pct=state.comboTimer>0?(state.comboTimer/state.comboDecay)*100:0;
  document.getElementById('comboTimerBar').style.width=pct+'%';
}

// ═══════════════════════════════════════
// SHOP
// ═══════════════════════════════════════
function renderShop(){
  const c=document.getElementById('shopContent');
  c.innerHTML='';
  for(const up of getActiveUpgrades()){
    const owned=state.upgrades[up.id]||0;
    const cost=getUpgradeCost(up,owned);
    const canAfford=state.credits>=cost;
    const el=document.createElement('div');
    el.className='shopItem'+(canAfford?'':' disabled');
    el.innerHTML=`<div class="itemName">${up.name}</div><div class="itemDesc">${up.desc}</div><div class="itemBottom"><span class="itemCost">${fmt(cost)} ⛁</span><span class="itemCount">×${owned}</span></div>`;
    el.onclick=()=>buyUpgrade(up.id);
    c.appendChild(el);
  }
}

function buyUpgrade(id){
  const up=getActiveUpgrades().find(u=>u.id===id);
  if(!up)return;
  const owned=state.upgrades[id]||0;
  const cost=getUpgradeCost(up,owned);
  if(state.credits<cost)return;
  state.credits-=cost;
  state.upgrades[id]=owned+1;
  recalcStats();
  renderShop();
  updateUI();
}

// ═══════════════════════════════════════
// ACHIEVEMENTS
// ═══════════════════════════════════════
function renderAchievements(){
  const c=document.getElementById('achievementsContent');
  c.innerHTML='';
  const playTime=Math.floor((Date.now()-state.startTime)/1000);
  const statsEl=document.createElement('div');
  statsEl.style.cssText='padding:8px 4px;margin-bottom:8px;border-bottom:1px solid var(--border);';
  statsEl.innerHTML=`<div style="font-size:11px;color:var(--muted);margin-bottom:6px;">SESSION STATS</div><div style="font-size:11px;line-height:1.8;">Play time: <b>${Math.floor(playTime/60)}m ${playTime%60}s</b><br>Total keys: <b>${fmt(state.totalKeys)}</b><br>Total earned: <b>${fmt(state.totalEarned)}</b><br>Max combo: <b>×${state.comboMax.toFixed(1)}</b><br>Upgrades owned: <b>${Object.values(state.upgrades).reduce((a,b)=>a+b,0)}</b><br>WPM: <b>${getCurrentWPM()}</b></div>`;
  c.appendChild(statsEl);
  const header=document.createElement('div');
  header.style.cssText='font-size:11px;color:var(--muted);padding:4px;margin-bottom:4px;';
  const unlocked=ACHIEVEMENTS.filter(a=>state.achievements[a.id]).length;
  header.textContent=`ACHIEVEMENTS (${unlocked}/${ACHIEVEMENTS.length})`;
  c.appendChild(header);
  for(const ach of ACHIEVEMENTS){
    const u=state.achievements[ach.id];
    const el=document.createElement('div');
    el.className='achItem '+(u?'unlocked':'locked');
    el.innerHTML=`<div class="achName">${u?'✅':'🔒'} ${ach.name}</div><div class="achDesc">${ach.desc}</div>`;
    c.appendChild(el);
  }
}

function checkAchievements(){
  for(const ach of ACHIEVEMENTS){
    if(!state.achievements[ach.id]&&ach.check(state)){
      state.achievements[ach.id]=true;
      showAchievementPopup(ach);
    }
  }
}

function showAchievementPopup(ach){
  const el=document.createElement('div');
  el.style.cssText=`position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:20px 40px;z-index:9999;text-align:center;box-shadow:0 0 40px rgba(224,175,104,0.5);animation:achPop 3s ease forwards;`;
  el.innerHTML=`<div style="font-size:32px;margin-bottom:8px;">🏆</div><div style="font-size:18px;font-weight:bold;color:var(--gold);margin-bottom:4px;">${ach.name}</div><div style="font-size:12px;color:var(--muted);">${ach.desc}</div>`;
  if(!document.getElementById('achStyle')){
    const s=document.createElement('style');
    s.id='achStyle';
    s.textContent='@keyframes achPop{0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}10%{opacity:1;transform:translate(-50%,-50%) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-60%) scale(1);}}';
    document.head.appendChild(s);
  }
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

// ═══════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════
let lastTick=Date.now();
let lastShopRender=0;

function gameLoop(){
  const now=Date.now();
  const dt=(now-lastTick)/1000;
  lastTick=now;

  if(state.perSec>0){
    const idleEarn=state.perSec*dt;
    state.credits+=idleEarn;
    state.totalEarned+=idleEarn;
  }

  if(state.comboTimer>0){
    state.comboTimer-=dt;
    if(state.comboTimer<=0){state.combo=1;state.comboTimer=0;}
  }

  updateUI();

  if(now-lastShopRender>500){
    renderShop();
    renderAchievements();
    checkAchievements();
    lastShopRender=now;
  }
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════
// SIDEBAR TABS
// ═══════════════════════════════════════
document.querySelectorAll('.sidebarTab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.sidebarTab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const target=tab.dataset.tab;
    document.getElementById('shopContent').style.display=target==='shop'?'block':'none';
    document.getElementById('achievementsContent').style.display=target==='ach'?'block':'none';
  };
});

// Clear button
document.getElementById('clearBtn').onclick=()=>{
  state.paperContent='';
  renderPaper();
};

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
buildThemeSelect();
applyTheme('tokyonight');
recalcStats();
renderShop();
renderAchievements();

// Focus management — try to bring up keyboard on mobile
mobileInput.focus();
paper.focus();

// Welcome text
state.paperContent='Welcome to Typist.\n\nEvery keystroke earns credits.\nType anything — notes, code, your thoughts.\nThe faster you type, the more you earn.\n\nStart typing to begin...\n\n';
renderPaper();

// Re-focus mobile input on any touch/click in the paper area
document.addEventListener('touchend',()=>{
  setTimeout(()=>{if(document.activeElement!==mobileInput&&document.activeElement.tagName!=='SELECT')mobileInput.focus();},200);
},{passive:true});

gameLoop();
</script>
