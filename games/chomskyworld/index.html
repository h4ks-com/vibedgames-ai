// procedural grass texture (one canvas, tiled)
function groundTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#4f9a3a';
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2500; i++) {
    const dark = rnd() < 0.5;
    g.fillStyle = dark ? 'rgba(30,90,30,0.35)' : 'rgba(110,170,70,0.3)';
    g.fillRect(rnd() * 256, rnd() * 256, 2 + rnd() * 2, 2 + rnd() * 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(30, 30);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const ground = new THREE.Mesh(

// ---------- world layout (collision list shared by everything) ----------
const PLAYER_R = 0.45;
const SPAWN_CLEAR = 9;
const PROF_SPOTS = [[9, 6], [-11, 5], [-6, -12], [12, -10], [0, 18]];
const obstacles = [];   // {x, z, r}

// six stone pillars near spawn (also solid)
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const x = Math.cos(a) * 7, z = Math.sin(a) * 7;
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.8, 3, 0.8), new THREE.MeshStandardMaterial({ color: 0xbfb8a8 }));
  p.position.set(x, 1.5, z);
  scene.add(p);
  obstacles.push({ x, z, r: 0.55 });
}
PROF_SPOTS.forEach(([x, z]) => obstacles.push({ x, z, r: 0.7 }));

function placeable(x, z, r) {
  const d = Math.hypot(x, z);
  if (d < SPAWN_CLEAR || d > 105 || Math.hypot(x, z) < 0) return false;
  for (const p of PROF_SPOTS) if (Math.hypot(x - p[0], z - p[1]) < 4) return false;
  if (Math.hypot(x - (-26), z - 20) < 6.5) return false;   // keep the pond clear
  for (const o of obstacles) if (Math.hypot(x - o.x, z - o.z) < o.r + r + 0.6) return false;
  return true;
}

const treeSpots = [], rockSpots = [];
for (let i = 0; i < 150; i++) {
  const a = rnd() * Math.PI * 2, r = 10 + rnd() * 95;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  const isTree = rnd() < 0.68;
  const sc = 0.8 + rnd() * 0.5;
  const rr = isTree ? 0.45 * sc : 0.8 * sc;
  if (!placeable(x, z, rr)) continue;
  obstacles.push({ x, z, r: rr });
  (isTree ? treeSpots : rockSpots).push({ x, z, sc, rot: rnd() * Math.PI * 2 });
}

// ---------- instancing helpers (GLB parts -> InstancedMesh, one draw call per part) ----------
function placementMatrix(s) {
  return new THREE.Matrix4().compose(
    new THREE.Vector3(s.x, 0, s.z),
    new THREE.Quaternion().setFromAxisAngle(Y_AXIS, s.rot),
    new THREE.Vector3(s.sc, s.sc, s.sc)
  );
}

// Normalise a loaded GLB so its base sits at y=0 and its height is targetH.
// Returns one {geo, mat, base} per static mesh part.
function bakeParts(gltfScene, targetH) {
  const root = gltfScene;
  root.position.set(0, 0, 0);
  root.rotation.set(0, 0, 0);
  root.scale.set(1, 1, 1);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  const s = targetH / Math.max(size.y, 1e-3);
  const N = new THREE.Matrix4().makeScale(s, s, s).multiply(
    new THREE.Matrix4().makeTranslation(-c.x, -box.min.y, -c.z)
  );
  const parts = [];
  root.traverse((o) => {
    if (o.isMesh && !o.isSkinnedMesh) {
      parts.push({ geo: o.geometry, mat: o.material, base: new THREE.Matrix4().multiplyMatrices(N, o.matrixWorld) });
    }
  });
  return parts;
}

function addInstanced(parts, spots) {
  const mats = spots.map(placementMatrix);
  for (const p of parts) {
    const im = new THREE.InstancedMesh(p.geo, p.mat, mats.length);
    const tmp = new THREE.Matrix4();
    mats.forEach((M, i) => im.setMatrixAt(i, tmp.multiplyMatrices(M, p.base)));
    im.instanceMatrix.needsUpdate = true;
    im.frustumCulled = false;
    scene.add(im);
  }
}

// procedural fallback if a GLB fails to load
function addProceduralTrees(spots) {
  const trunkGeo = new THREE.CylinderGeometry(0.3, 0.45, 2.5, 8);
  const topGeo = new THREE.ConeGeometry(2.2, 4.5, 8);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b });
  const topMat = new THREE.MeshStandardMaterial({ color: 0x2d7a33, flatShading: true });
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, spots.length);
  const tops = new THREE.InstancedMesh(topGeo, topMat, spots.length);
  const m = new THREE.Matrix4();
  spots.forEach((s, i) => {
    const pos = new THREE.Vector3(s.x, 0, s.z);
    const q = new THREE.Quaternion().setFromAxisAngle(Y_AXIS, s.rot);
    const sc = new THREE.Vector3(s.sc, s.sc, s.sc);
    m.compose(new THREE.Vector3(s.x, 1.25 * s.sc, s.z), q, sc); trunks.setMatrixAt(i, m);
    m.compose(new THREE.Vector3(s.x, 4.2 * s.sc, s.z), q, sc); tops.setMatrixAt(i, m);
  });
  scene.add(trunks, tops);
}
function addProceduralRocks(spots) {
  const geo = new THREE.DodecahedronGeometry(0.9);
  const mat = new THREE.MeshStandardMaterial({ color: 0x8a8a8a, flatShading: true });
  const im = new THREE.InstancedMesh(geo, mat, spots.length);
  const m = new THREE.Matrix4();
  spots.forEach((s, i) => {
    m.compose(new THREE.Vector3(s.x, 0.4 * s.sc, s.z), new THREE.Quaternion().setFromAxisAngle(Y_AXIS, s.rot), new THREE.Vector3(s.sc, s.sc, s.sc));
    im.setMatrixAt(i, m);
  });
  scene.add(im);
}

// ---------- grass, flowers, clouds (cheap instanced decoration) ----------
{
  const grassGeo = new THREE.ConeGeometry(0.12, 0.5, 4);
  grassGeo.translate(0, 0.25, 0);
  const grass = new THREE.InstancedMesh(grassGeo, new THREE.MeshStandardMaterial({ color: 0x3d8c2b, flatShading: true }), 2500);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1);
  let n = 0;
  while (n < 2500) {
    const a = rnd() * Math.PI * 2, r = 2 + Math.sqrt(rnd()) * 100;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x, z) < 2) continue;
    q.setFromAxisAngle(Y_AXIS, rnd() * 6.28);
    s.set(0.8 + rnd() * 0.6, 0.7 + rnd() * 0.8, 0.8 + rnd() * 0.6);
    m.compose(new THREE.Vector3(x, 0, z), q, s);
    grass.setMatrixAt(n++, m);
  }
  grass.frustumCulled = false;
  scene.add(grass);

  const flowerGeo = new THREE.SphereGeometry(0.11, 6, 4);
  flowerGeo.translate(0, 0.12, 0);
  const flowers = new THREE.InstancedMesh(flowerGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true }), 400);
  const palette = [0xff6b8a, 0xffe066, 0xffffff, 0xb388ff, 0x74c0fc];
  const col = new THREE.Color();
  n = 0;
  while (n < 400) {
    const a = rnd() * Math.PI * 2, r = 3 + Math.sqrt(rnd()) * 95;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (placeable(x, z, 0.2) === false) continue;
    m.makeTranslation(x, 0, z);
    flowers.setMatrixAt(n, m);
    flowers.setColorAt(n, col.set(palette[Math.floor(rnd() * palette.length)]));
    n++;
  }
  flowers.frustumCulled = false;
  scene.add(flowers);
}

const clouds = [];
{
  const cloudGeo = new THREE.IcosahedronGeometry(1, 0);
  const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1 });
  for (let i = 0; i < 9; i++) {
    const g = new THREE.Group();
    const puffs = 3 + Math.floor(rnd() * 3);
    for (let j = 0; j < puffs; j++) {
      const p = new THREE.Mesh(cloudGeo, cloudMat);
      p.position.set(j * 2.2 - puffs, rnd() * 0.8, rnd() * 1.5);
      p.scale.setScalar(2 + rnd() * 1.5);
      g.add(p);
    }
    g.position.set(-150 + rnd() * 300, 45 + rnd() * 15, -150 + rnd() * 300);
    g.userData.speed = 0.8 + rnd() * 1.2;
    scene.add(g);
    clouds.push(g);
  }
}

// ---------- animation rig helper ----------
class Rig {
  constructor(root, clips) {
    this.root = root;
    this.mixer = new THREE.AnimationMixer(root);
    this.clips = clips;
    this.cur = null;
    this.onFinished = null;
    this.mixer.addEventListener('finished', (e) => {
      if (e.action === this.cur && this.onFinished) this.onFinished();
    });
  }
  find(name) {
    const key = name.toLowerCase();
    const c = this.clips.find((c) => c.name.toLowerCase().includes(key));
    return c ? this.mixer.clipAction(c) : null;
  }
  play(name, loop = true) {
    const a = this.find(name);
    if (!a || a === this.cur) return;
    a.reset();
    a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
    a.clampWhenFinished = !loop;
    if (this.cur) this.cur.fadeOut(0.2);
    a.fadeIn(0.2).play();
    this.cur = a;
  }
  update(dt) { this.mixer.update(dt); }
}

// Put the model's feet on y = 0, measured while the Idle pose is applied
function seatOnGround(model, rig) {
  model.position.y = 0;
  rig.play('Idle', true);
  rig.mixer.update(0);
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model, true);
  model.position.y = -box.min.y;
  model.updateMatrixWorld(true);
}

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const loadGLB = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));

// ---------- player ----------
const player = new THREE.Group();
scene.add(player);
let playerRig = null;
let vy = 0, onGround = true, jumpAnimTimer = 0;
let dancing = false, running = false;

// ---------- professors ----------
const profs = [];

// ---------- input ----------
const keys = {};
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (k === ' ') jump();
  if (k === 'e') dance();
  if (k === 'f') talk();
  if (k === 'shift') running = true;
});
addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === 'shift') running = false;
});

let yaw = 0, pitch = 0.35, dist = 6;
let joyId = null, joyVec = { x: 0, y: 0 }, joyCenter = { x: 0, y: 0 };
let lookId = null, lookLast = { x: 0, y: 0 };
let pinchD = null;

const isCoarse = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isCoarse) {
  joy.style.display = 'block';
  bj.style.display = bd.style.display = br.style.display = 'block';
}

function setKnob(dx, dy) {
  const r = 60;
  const len = Math.hypot(dx, dy);
  const s = len > r ? r / len : 1;
  const kx = dx * s, ky = dy * s;
  knob.style.left = 35 + kx + 'px';
  knob.style.top = 35 + ky + 'px';
  joyVec = { x: kx / r, y: ky / r };
}
function resetJoy() {
  joyId = null;
  joyVec = { x: 0, y: 0 };
  knob.style.left = '35px';
  knob.style.top = '35px';
}

addEventListener('touchstart', (e) => {
  for (const t of e.changedTouches) {
    const rect = joy.getBoundingClientRect();
    const inJoy = isCoarse && t.clientX >= rect.left - 20 && t.clientX <= rect.right + 20 && t.clientY >= rect.top - 20 && t.clientY <= rect.bottom + 20;
    if (inJoy && joyId === null) {
      joyId = t.identifier;
      joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      setKnob(t.clientX - joyCenter.x, t.clientY - joyCenter.y);
    } else if (!inJoy && lookId === null && !e.target.classList?.contains('btn')) {
      lookId = t.identifier;
      lookLast = { x: t.clientX, y: t.clientY };
    }
  }
}, { passive: true });

addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) setKnob(t.clientX - joyCenter.x, t.clientY - joyCenter.y);
    else if (t.identifier === lookId) {
      yaw -= (t.clientX - lookLast.x) * 0.008;
      pitch = Math.min(1.3, Math.max(0.05, pitch + (t.clientY - lookLast.y) * 0.005));
      lookLast = { x: t.clientX, y: t.clientY };
    }
  }
  if (e.touches.length >= 2) {
    const a = e.touches[0], b = e.touches[1];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (pinchD) dist = Math.min(14, Math.max(2, dist * (pinchD / d)));
    pinchD = d;
  }
}, { passive: true });

addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) resetJoy();
    if (t.identifier === lookId) lookId = null;
  }
  if (e.touches.length < 2) pinchD = null;
});

addEventListener('wheel', (e) => { dist = Math.min(14, Math.max(2, dist + e.deltaY * 0.01)); }, { passive: true });

let mouseDrag = false;
renderer.domElement.addEventListener('mousedown', () => mouseDrag = true);
addEventListener('mouseup', () => mouseDrag = false);
addEventListener('mousemove', (e) => {
  if (!mouseDrag) return;
  yaw -= e.movementX * 0.005;
  pitch = Math.min(1.3, Math.max(0.05, pitch + e.movementY * 0.004));
});

function jump() {
  if (!onGround) return;
  vy = 6.5;
  onGround = false;
  dancing = false;
  jumpAnimTimer = 0;
}
function dance() {
  if (!onGround) return;
  dancing = !dancing;
}
function nearestProf() {
  let best = null, bd2 = 3.5 * 3.5;
  for (const p of profs) {
    const dx = p.group.position.x - player.position.x;
    const dz = p.group.position.z - player.position.z;
    const d2 = dx * dx + dz * dz;
    if (d2 < bd2) { bd2 = d2; best = p; }
  }
  return best;
}
let bubbleTimer = 0;
function talk() {
  const p = nearestProf();
  if (!p) return;
  const act = PROF_ACTIONS[Math.floor(Math.random() * PROF_ACTIONS.length)];
  p.rig.play(act, false);
  p.busyUntil = performance.now() + 4000;
  bubble.textContent = 'Professor: "' + LINES[Math.floor(Math.random() * LINES.length)] + '"';
  bubble.style.display = 'block';
  bubbleTimer = performance.now() + 5000;
}
bj.addEventListener('click', jump);
bd.addEventListener('click', dance);
br.addEventListener('click', () => { running = !running; br.textContent = running ? 'RUN: ON' : 'RUN'; });
bt.addEventListener('click', talk);
['bj','bd','br','bt'].forEach((id) => document.getElementById(id).addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true }));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

// push the player out of any solid obstacle (trees, rocks, pillars, professors)
function resolveCollisions() {
  for (const o of obstacles) {
    const dx = player.position.x - o.x, dz = player.position.z - o.z;
    const d2 = dx * dx + dz * dz, minD = o.r + PLAYER_R;
    if (d2 < minD * minD && d2 > 1e-6) {
      const d = Math.sqrt(d2), push = (minD - d) / d;
      player.position.x += dx * push;
      player.position.z += dz * push;
    }
  }
}

// ---------- update loop ----------
const clock = new THREE.Clock();
const tmpFwd = new THREE.Vector3(), tmpRight = new THREE.Vector3();
const moveDir = new THREE.Vector3();

function update(dt) {
  let fwdIn = 0, rightIn = 0;
  if (keys['w'] || keys['arrowup']) fwdIn += 1;
  if (keys['s'] || keys['arrowdown']) fwdIn -= 1;
  if (keys['d'] || keys['arrowright']) rightIn += 1;
  if (keys['a'] || keys['arrowleft']) rightIn -= 1;
  rightIn += joyVec.x;
  fwdIn += -joyVec.y;
  const mag = Math.hypot(rightIn, fwdIn);
  if (mag > 1) { rightIn /= mag; fwdIn /= mag; }

  tmpFwd.set(-Math.sin(yaw), 0, -Math.cos(yaw));
  tmpRight.set(Math.cos(yaw), 0, -Math.sin(yaw));
  moveDir.set(0, 0, 0).addScaledVector(tmpRight, rightIn).addScaledVector(tmpFwd, fwdIn);
  const moving = moveDir.lengthSq() > 0.0001;

  if (moving) {
    dancing = false;
    const speed = running ? 5 : 2.2;
    moveDir.normalize();
    player.position.addScaledVector(moveDir, speed * dt);
    const targetRot = Math.atan2(moveDir.x, moveDir.z);
    let dr = targetRot - player.rotation.y;
    dr = Math.atan2(Math.sin(dr), Math.cos(dr));
    player.rotation.y += dr * Math.min(1, dt * 12);
  }

  resolveCollisions();

  const r = Math.hypot(player.position.x, player.position.z);
  if (r > 110) { player.position.x *= 110 / r; player.position.z *= 110 / r; }

  // vertical motion: ground at y = 0
  if (!onGround) {
    vy -= 16 * dt;
    player.position.y += vy * dt;
    jumpAnimTimer += dt;
    if (player.position.y <= 0) {
      player.position.y = 0;
      vy = 0;
      onGround = true;
      playerRig.play('Jump Land', false);
    }
  }

  if (!onGround) {
    if (jumpAnimTimer < 0.15) playerRig.play('Jump Start', false);
    else playerRig.play('Jump Air', true);
  } else if (playerRig.cur && playerRig.cur.getClip().name.toLowerCase().includes('land') && playerRig.cur.isRunning()) {
    // let landing finish
  } else if (dancing && !moving) {
    playerRig.play('Dance', true);
  } else if (moving) {
    playerRig.play(running ? 'Run' : 'Walk', true);
  } else {
    playerRig.play('Idle', true);
  }
  playerRig.update(dt);

  const now = performance.now();
  for (const p of profs) {
    if (now > p.busyUntil && now > p.nextAct) {
      const act = PROF_ACTIONS[Math.floor(Math.random() * PROF_ACTIONS.length)];
      p.rig.play(act, false);
      p.busyUntil = now + 3500;
      p.nextAct = now + 6000 + Math.random() * 6000;
    }
    p.rig.onFinished = () => p.rig.play('Idle', true);
    if (now > p.busyUntil) p.rig.play('Idle', true);
    p.rig.update(dt);
  }

  const near = nearestProf();
  bt.style.display = near && isCoarse ? 'block' : 'none';
  if (bubble.style.display === 'block' && now > bubbleTimer) bubble.style.display = 'none';

  // slow cloud drift (cheap, no physics)
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt;
    if (c.position.x > 170) c.position.x = -170;
  }

  // camera orbits the player and stays above the ground plane
  const target = new THREE.Vector3(player.position.x, player.position.y + 1.3, player.position.z);
  const off = new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch)
  ).multiplyScalar(dist);
  camera.position.copy(target).add(off);
  if (camera.position.y < 0.4) camera.position.y = 0.4;
  camera.lookAt(target);

  statusEl.textContent = (onGround ? '' : 'Airborne - ') + (moving ? (running ? 'Running' : 'Walking') : dancing ? 'Dancing' : 'Standing');
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- load assets ----------
(async () => {
  try {
    statusEl.textContent = 'Loading world...';
    // Sketchfab nature models: fall back to procedural meshes if they fail
    const [treeGltf, rockGltf] = await Promise.all([
      loadGLB(TREE_URL).catch(() => null),
      loadGLB(ROCK_URL).catch(() => null)
    ]);
    if (treeGltf) addInstanced(bakeParts(treeGltf.scene, 6.5), treeSpots); else addProceduralTrees(treeSpots);
    if (rockGltf) addInstanced(bakeParts(rockGltf.scene, 1.4), rockSpots); else addProceduralRocks(rockSpots);

    statusEl.textContent = 'Loading characters...';
    const [playerGltf, profGltf] = await Promise.all([loadGLB(PLAYER_URL), loadGLB(PROF_URL)]);

    const pModel = playerGltf.scene;
    player.add(pModel);
    playerRig = new Rig(pModel, playerGltf.animations);
    seatOnGround(pModel, playerRig);

    PROF_SPOTS.forEach(([x, z], i) => {
      const model = cloneSkel(profGltf.scene);
      const group = new THREE.Group();
      group.add(model);
      group.position.set(x, 0, z);
      group.rotation.y = Math.atan2(-x, -z);
      scene.add(group);
      const rig = new Rig(model, profGltf.animations);
      seatOnGround(model, rig);
      profs.push({ group, rig, busyUntil: 0, nextAct: performance.now() + 3000 + i * 1000 });
    });

    window.__dbg = { player, profs: profs.map(p => p.group), ground, obstacles, treeSpots: treeSpots.length, rockSpots: rockSpots.length, scene, renderer };
    statusEl.textContent = 'Ready';
    requestAnimationFrame(frame);
  } catch (err) {
    statusEl.textContent = 'Load failed: ' + err.message;
    console.error(err);
  }
})();
</script>
</body></html>
