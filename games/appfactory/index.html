<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧬 EVOLVE — Live App Farm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#c8c8e0;font-family:'Courier New',monospace;overflow-x:hidden}
body,textarea{font-family:'Courier New',monospace}
#topbar{background:linear-gradient(135deg,#0d0d1a,#12122a);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a4a;position:sticky;top:0;z-index:100}
#topbar h1{font-size:18px;background:linear-gradient(90deg,#00ff88,#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.stats{display:flex;gap:16px;font-size:12px;flex-wrap:wrap}
.stat{white-space:nowrap}
.stat b{color:#00ff88}
.stat .label{color:#666}
.heat-stat b{color:#ff6600}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
.controls button{background:#1a1a2e;color:#00ff88;border:1px solid #2a4a2a;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit}
.controls button:hover{background:#2a2a4e}
.controls button.active{background:#00ff88;color:#000}
.speed-btns{display:flex;gap:3px}
.speed-btns button{padding:2px 6px}
#generation-banner{text-align:center;padding:4px;background:#11111f;font-size:12px;border-bottom:1px solid #1a1a2a}
#generation-banner .gen{color:#00ff88;font-weight:bold}
#main{display:grid;grid-template-columns:280px 1fr 340px;height:calc(100vh - 80px)}
@media(max-width:900px){#main{grid-template-columns:1fr;height:auto}#pool{height:300px}#feed{height:500px}}
#pool{position:relative;border-right:1px solid #1a1a2a;overflow:hidden;background:#080810}
#pool canvas{display:block}
#feed{border-left:1px solid #1a1a2a;overflow-y:auto;padding:8px;background:#0c0c16}
#feed h3{font-size:13px;color:#00aaff;margin-bottom:8px;position:sticky;top:0;background:#0c0c16;padding:4px;z-index:10}
.feed-item{background:#12121e;border:1px solid #222240;border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer;transition:all .2s;position:relative}
.feed-item:hover{border-color:#00aaff;box-shadow:0 0 12px rgba(0,170,255,.3)}
.feed-item .app-name{font-weight:bold;font-size:13px}
.feed-item .app-type{font-size:10px;color:#888;margin-bottom:4px}
.feed-item .app-desc{font-size:11px;color:#aaa;line-height:1.4}
.feed-item .votes{margin-top:6px;font-size:11px}
.feed-item .upvotes{color:#00ff88}
.feed-item .downvotes{color:#ff4444}
.feed-item .bot-tag{font-size:9px;color:#ff9900;background:#1a1400;padding:1px 4px;border-radius:3px;margin-left:4px}
.feed-item .human-tag{font-size:9px;color:#00aaff;background:#001a2a;padding:1px 4px;border-radius:3px;margin-left:4px}
.feed-item.featured{border-color:#00ff88;box-shadow:0 0 16px rgba(0,255,136,.3)}
.feed-item.featured::after{content:'⭐';position:absolute;top:-8px;right:-4px;font-size:16px}
.feed-item.dead{opacity:.4}
.feed-item .try-btn{display:inline-block;margin-top:6px;background:#1a1a2e;color:#00ff88;border:1px solid #2a4a2a;padding:3px 8px;border-radius:4px;font-size:11px;font-family:inherit}
.feed-item:hover .try-btn{background:#00ff88;color:#000}
#app-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:1000;justify-content:center;align-items:center}
#app-modal.active{display:flex}
.modal-content{background:#12121e;border:1px solid #2a4a2a;border-radius:12px;width:90%;max-width:500px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column}
.modal-header{padding:10px 16px;border-bottom:1px solid #1a1a2a;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{color:#00ff88;font-size:15px}
.modal-header .close{background:none;border:none;color:#888;font-size:24px;cursor:pointer}
.modal-header .close:hover{color:#fff}
#app-frame-container{padding:16px;overflow-y:auto;flex:1}
#app-frame-container iframe{width:100%;border:none;border-radius:8px;background:#0a0a14}
.genes{padding:8px 16px;font-size:10px;border-top:1px solid #1a1a2a}
.gene-row{display:inline-block;margin-right:8px}
.gene-row span{color:#666}
.gene-row b{color:#00aaff}
#heatmap{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);border:1px solid #1a1a2a;border-radius:4px;padding:4px 8px;font-size:10px}
#heatmap .watts{color:#ff6600;font-weight:bold}
#log{position:absolute;bottom:8px;left:8px;max-width:200px;max-height:80px;overflow:hidden;font-size:9px;color:#444}
#log .log-line{opacity:.6}
#log .log-line.new{color:#00ff88;opacity:1}
.pool-tooltip{position:absolute;background:rgba(0,0,0,.9);border:1px solid #2a4a2a;border-radius:4px;padding:6px 10px;font-size:11px;pointer-events:none;z-index:50;display:none;max-width:180px}
.pool-tooltip .pt-name{color:#00ff88;font-weight:bold}
.pool-tooltip .pt-type{color:#888;font-size:9px}
</style>
</head>
<body>
<div id="topbar">
<div>
<h1>🧬 EVOLVE — Genetic App Farm</h1>
<div class="controls">
<div class="speed-btns">
<button class="speed-btn" onclick="setSpeed(1)">🐢</button>
<button class="speed-btn active" onclick="setSpeed(2)">🚶</button>
<button class="speed-btn" onclick="setSpeed(4)">🏃</button>
<button class="speed-btn" onclick="setSpeed(10)">🚀</button>
</div>
<button onclick="radiation()">☢️ Mutate</button>
<button onclick="extinction()">💀 Extinct</button>
<button onclick="reset()">🔄 Reset</button>
<button onclick="seed()">🌱 Seed New</button>
</div>
</div>
<div class="stats">
<div class="stat"><span class="label">Gen</span> <b id="s-gen">1</b></div>
<div class="stat"><span class="label">Pop</span> <b id="s-pop">0</b></div>
<div class="stat"><span class="label">Born</span> <b id="s-born">0</b></div>
<div class="stat"><span class="label">Died</span> <b id="s-died">0</b></div>
<div class="stat"><span class="label">Apps</span> <b id="s-apps">0</b></div>
<div class="stat heat-stat"><span class="label">❄️ Heat</span> <b id="s-heat">0W</b></div>
<div class="stat heat-stat"><span class="label">kWh</span> <b id="s-kwh">0</b></div>
</div>
</div>
<div id="generation-banner"></div>
<div id="main">
<div id="pool">
<canvas id="pool-canvas"></canvas>
<div id="heatmap">
GPU+GA: <span class="watts" id="hm-watts">0W</span><br>
<span id="hm-days">Day 0 / 120</span>
</div>
<div id="log"></div>
<div class="pool-tooltip" id="pool-tooltip"></div>
</div>
<div id="feed">
<h3>📱 Published Apps <span style="float:right;font-size:10px;color:#666" id="feed-count">0</span></h3>
<div id="feed-list"></div>
<div style="text-align:center;padding:20px;color:#444;font-size:11px" id="feed-empty">Apps will appear here as they evolve...</div>
</div>
</div>
<div id="app-modal">
<div class="modal-content">
<div class="modal-header">
<h3 id="modal-title">App</h3>
<button class="close" onclick="closeModal()">&times;</button>
</div>
<div id="app-frame-container"></div>
<div class="genes" id="modal-genes"></div>
</div>
</div>
<script>
// ============= APP BLUEPRINTS =============
// Each blueprint generates a REAL working HTML app from genes
const BLUEPRINTS = {
counter: {
name: g => ['Tally','Pulse','Clicker','Enumerate','Markov','Digits','Odometer','Accumulator'][g.theme%8],
desc: g => `A ${g.weird>60?'hypnotic':'simple'} counter that goes ${g.speed>50?'fast':'slow'}${g.chaos>50?' and occasionally lies about the number':''}.`,
build: g => {
const w=g.weird>60,c=g.chaos>50,style=`color:${g.speed>50?'#00ff88':'#00aaff'};font-size:48px;`;
return `<h2 style="${style}text-align:center">${w?'✨ ':''}Count<span id="c2">0</span></h2><p style="text-align:center"><button onclick="let n=parseInt(document.getElementById('c2').textContent);n${c?' += Math.floor(Math.random()*3)':'++'};document.getElementById('c2').textContent=n" style="padding:10px 20px;font-size:20px;background:${g.speed>50?'#003300':'#001a33'};color:${g.speed>50?'#00ff88':'#00aaff'};border:1px solid currentColor;border-radius:8px;cursor:pointer">+1</button></p>`;
}
},
dice: {
name: g => ['Fortune','Bones','Roller','Oracle','Stochastic','Destiny','Chance','Probability'][g.theme%8],
desc: g => `Rolls a d${Math.max(2,Math.floor(g.power/10)+6)}${g.weird>50?' with cosmic commentary':''}.`,
build: g => {
const sides=Math.max(2,Math.floor(g.power/10)+6);
const msgs=['🎲 So it is written.','🎲 The universe shrugs.','🎲 Fate is cruel.','🎲 Lucky you.','🎲 Interesting choice.','🎲 The dice know.'];
return `<h2 style="text-align:center;color:#ff9900;font-size:28px">d${sides}</h2><div style="text-align:center;padding:20px"><div id="d2" style="font-size:60px">?</div><button onclick="let r=Math.ceil(Math.random()*${sides});document.getElementById('d2').textContent=r;document.getElementById('dm2').textContent=${JSON.stringify(msgs)}[Math.floor(Math.random()*${msgs.length})]" style="padding:10px 20px;font-size:16px;background:#221100;color:#ff9900;border:1px solid #ff9900;border-radius:8px;cursor:pointer">ROLL</button><p id="dm2" style="margin-top:12px;color:#888;font-size:12px">Press to roll</p></div>`;
}
},
color: {
name: g => ['Chroma','Hue','Spectrum','Swatch','Rainbow','Tint','Canvas','Prism'][g.theme%8],
desc: g => `A ${g.elegance>50?'elegant':'chaotic'} color explorer${g.weird>50?' that names the colors':''}.`,
build: g => {
return `<div style="text-align:center;padding:16px"><div id="cc2" style="width:100%;height:120px;border-radius:8px;background:hsl(0,80%,50%);transition:background .3s"></div><div style="margin-top:12px"><input type="range" min="0" max="360" value="0" oninput="document.getElementById('cc2').style.background='hsl('+this.value+',80%,50%);document.getElementById('ccl2').textContent=Math.round(this.value/3.6)+'%'"></div><p id="ccl2" style="margin-top:8px;color:#666;font-size:12px">0%</p></div>`;
}
},
timer: {
name: g => ['Tick','Metronome','Countdown','Tempo','Beat','Cadence','Rhythm','Clockwork'][g.theme%8],
desc: g => `A ${g.speed>50?'fast-paced ':'slow '}visual timer${g.chaos>50?' that glitches':''}.`,
build: g => {
const dur=Math.max(5,Math.floor(g.power/5));
return `<div style="text-align:center;padding:20px"><div id="t2" style="font-size:48px;color:#00aaff">${dur}</div><div style="width:100%;height:12px;background:#111;border-radius:6px;margin-top:12px;overflow:hidden"><div id="tb2" style="width:100%;height:100%;background:linear-gradient(90deg,#00ff88,#00aaff);transition:width 1s linear"></div></div><button onclick="let s=${dur};document.getElementById('t2').textContent=s;document.getElementById('tb2').style.width='100%';let iv=setInterval(()=>{s--;document.getElementById('t2').textContent=s;document.getElementById('tb2').style.width=(s/${dur}*100)+'%';if(s<=0){clearInterval(iv);document.getElementById('t2').textContent='DONE';document.getElementById('tb2').style.width='0%'}},1000)" style="margin-top:16px;padding:8px 16px;background:#001a33;color:#00aaff;border:1px solid #00aaff;border-radius:8px;cursor:pointer">START</button></div>`;
}
},
drawpad: {
name: g => ['Doodle','Sketch','Inkwell','Canvas','Brushwork','Fingerpaint','Grafitti','Daub'][g.theme%8],
desc: g => `A drawing pad${g.weird>50?' where the brush changes color as you draw':''}${g.chaos>50?' and jitters':''}.`,
build: g => {
return `<canvas id="dp2" width="440" height="260" style="border:1px solid #333;border-radius:8px;cursor:crosshair;background:#0a0a14"></canvas><p style="text-align:center;margin-top:8px"><button onclick="let c=document.getElementById('dp2').getContext('2d');c.clearRect(0,0,440,260)" style="padding:4px 12px;background:#220000;color:#ff4444;border:1px solid #ff4444;border-radius:4px;cursor:pointer">CLEAR</button></p><script>let dp=document.getElementById('dp2'),dpc=dp.getContext('2d'),dpp=false,dpw=0;dp.onmousedown=e=>{dpp=true;dpc.beginPath();dpw=0};dp.onmouseup=()=>{dpp=false};dp.onmousemove=e=>{if(!dpp)return;let r=dp.getBoundingClientRect();let x=e.clientX-r.left,y=e.clientY-r.top;${g.weird>50?'dpw+=2;':'dpw+=0.5;'}dpc.strokeStyle='hsl('+dpw%360+',80%,60%)';dpc.lineWidth=${g.chaos>50?'Math.random()*8+1':'3'};dpc.lineTo(x,y);dpc.stroke();dpc.beginPath();dpc.moveTo(x,y)};<\/script>`;
}
},
clicker: {
name: g => ['Hoard','Gather','Tap','Harvest','Mine','Plunder','Amass','Stockpile'][g.theme%8],
desc: g => `A clicker game${g.weird>50?' with existential narration':''} where you collect ${['coins','stars','souls','electrons','memes','potatoes','dreams','shadows'][g.theme%8]}.`,
build: g => {
const res=['coins','stars','souls','electrons','memes','potatoes','dreams','shadows'][g.theme%8];
return `<div style="text-align:center;padding:20px"><div id="ck2" style="font-size:40px;color:#ffcc00">0 ${res}</div><button onclick="let c=parseInt(document.getElementById('ck2').textContent)||0;c++;document.getElementById('ck2').textContent=c+' ${res}'" style="padding:16px 40px;font-size:24px;background:radial-gradient(circle,#443300,#221100);color:#ffcc00;border:2px solid #ffcc00;border-radius:50%;cursor:pointer;width:120px;height:120px">TAP</button></div>`;
}
},
particle: {
name: g => ['Swarm','Drift','Float','Quantum','Plasma','Nebula','Spark','Vortex'][g.theme%8],
desc: g => `A ${g.speed>50?'frantic ':'calm '}particle toy${g.weird>50?' that responds to your mouse':''}.`,
build: g => {
return `<canvas id="pc2" width="440" height="240" style="border:1px solid #333;border-radius:8px;background:#050510"></canvas><script>let pc=document.getElementById('pc2'),pcc=pc.getContext('2d'),parts=[];for(let i=0;i<30;i++)parts.push({x:Math.random()*440,y:Math.random()*240,vx:(Math.random()-0.5)*${g.speed>50?'3':'1'},vy:(Math.random()-0.5)*${g.speed>50?'3':'1'},h:Math.random()*360});pc.onmousemove=e=>{let r=pc.getBoundingClientRect();let mx=e.clientX-r.left,my=e.clientY-r.top;parts.forEach(p=>{let dx=p.x-mx,dy=p.y-my;let d=Math.sqrt(dx*dx+dy*dy);if(d<60&&d>0){p.vx+=dx/d*${g.chaos>50?'1':'0.3'};p.vy+=dy/d*${g.chaos>50?'1':'0.3'}}})};function anim(){pcc.fillStyle='rgba(5,5,16,0.1)';pcc.fillRect(0,0,440,240);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=0.98;p.vy*=0.98;if(p.x<0)p.x=440;if(p.x>440)p.x=0;if(p.y<0)p.y=240;if(p.y>240)p.y=0;pcc.fillStyle='hsl('+p.h+',80%,60%)';pcc.beginPath();pcc.arc(p.x,p.y,3,0,7);pcc.fill()});requestAnimationFrame(anim)}anim();<\/script>`;
}
},
sound: {
name: g => ['Tone','Bleep','Echo','Resonance','Bass','Pitch','Harmonic','Frequency'][g.theme%8],
desc: g => `A sound toy that plays ${g.chaos>50?'random ':'structured '}tones at ${g.speed>50?'high':'low'} tempo.`,
build: g => {
const freqs=[261,329,392,440,523,587,659,783];
return `<div style="text-align:center;padding:20px"><p style="color:#888;font-size:12px;margin-bottom:12px">Click buttons to play tones</p><div id="sb2" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"></div></div><script>let ac;const sb=document.getElementById('sb2');for(let i=0;i<${g.weird>50?'8':'4'};i++){let b=document.createElement('button');b.textContent='♪'+(i+1);b.style.cssText='padding:16px;background:hsl('+i*45+',60%,30%);color:hsl('+i*45+',80%,70%);border:1px solid currentColor;border-radius:8px;cursor:pointer;font-size:16px';b.onclick=()=>{if(!ac)ac=new(AudioContext||webkitAudioContext);let o=ac.createOscillator(),g2=ac.createGain();o.frequency.value=${JSON.stringify(freqs)}[i%${freqs.length}]*(${g.chaos>50?'(1+Math.random()*0.2)':'1'});o.type=${g.weird>50?'["sine","square","sawtooth","triangle"][Math.floor(Math.random()*4)]':'"sine"'};g2.gain.setValueAtTime(.2,ac.currentTime);g2.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.5);o.connect(g2);g2.connect(ac.destination);o.start();o.stop(ac.currentTime+.5)};sb.appendChild(b)}<\/script>`;
}
},
maze: {
name: g => ['Labyrinth','Maze','Paths','Wander','Corridors','Puzzle','Twist','Minotaur'][g.theme%8],
desc: g => `A ${g.chaos>50?'twisty ':'straight '}maze generator${g.weird>50?' with creepy aesthetics':''}.`,
build: g => {
const size=Math.max(6,Math.floor(g.power/8));
return `<canvas id="mz2" width="240" height="240" style="border:1px solid #333;border-radius:8px;background:#0a0a14"></canvas><p style="text-align:center;margin-top:8px;color:#888;font-size:12px">Green dot = exit. Arrow keys to move.</p><script>let mz=document.getElementById('mz2'),mc=mz.getContext('2d');let S=${size},CS=Math.floor(240/S),grid=[];for(let y=0;y<S;y++){grid[y]=[];for(let x=0;x<S;x++)grid[y][x]={walls:[true,true,true,true],v:false}}let stack=[[0,0]];grid[0][0].v=true;while(stack.length){let[x,y]=stack[stack.length-1],n=[];if(y>0&&!grid[y-1][x].v)n.push([x,y-1,0]);if(x<S-1&&!grid[y][x+1].v)n.push([x+1,y,1]);if(y<S-1&&!grid[y+1][x].v)n.push([x,y+1,2]);if(x>0&&!grid[y][x-1].v)n.push([x-1,y,3]);if(n.length){let[nx,ny,d]=n[Math.floor(Math.random()*n.length)];grid[y][x].walls[d]=false;grid[ny][nx].walls[(d+2)%4]=false;grid[ny][nx].v=true;stack.push([nx,ny])}else stack.pop()}let px=0,py=0;function draw(){mc.fillStyle='#0a0a14';mc.fillRect(0,0,240,240);mc.fillStyle='#003300';mc.fillRect((S-1)*CS,(S-1)*CS,CS,CS);mc.fillStyle='#00ff88';mc.fillRect(px*CS+2,py*CS+2,CS-4,CS-4);mc.strokeStyle='#3333aa';mc.lineWidth=2;for(let y=0;y<S;y++)for(let x=0;x<S;x++){let c=grid[y][x];mc.beginPath();if(c.walls[0]){mc.moveTo(x*CS,y*CS);mc.lineTo((x+1)*CS,y*CS)}if(c.walls[1]){mc.moveTo((x+1)*CS,y*CS);mc.lineTo((x+1)*CS,(y+1)*CS)}if(c.walls[2]){mc.moveTo(x*CS,(y+1)*CS);mc.lineTo((x+1)*CS,(y+1)*CS)}if(c.walls[3]){mc.moveTo(x*CS,y*CS);mc.lineTo(x*CS,(y+1)*CS)}mc.stroke()}}draw();document.onkeydown=e=>{let k=e.key;if(k=='ArrowUp'&&!grid[py][px].walls[0])py--;else if(k=='ArrowRight'&&!grid[py][px].walls[1])px++;else if(k=='ArrowDown'&&!grid[py][px].walls[2])py++;else if(k=='ArrowLeft'&&!grid[py][px].walls[3])px--;if(px==S-1&&py==S-1){alert('You escaped!')}draw()}};<\/script>`;
}
},
texttoy: {
name: g => ['Cipher','Anagram','Scramble','Decode','Mangle','Vortex','Echo','Madlib'][g.theme%8],
desc: g => `A text toy that ${g.weird>50?'corrupts your words beautifully':'reverses text'}${g.chaos>50?' with random substitutions':''}.`,
build: g => {
return `<div style="padding:16px"><input id="tt2" type="text" placeholder="Type something..." style="width:100%;padding:8px;background:#111;color:#fff;border:1px solid #333;border-radius:4px;margin-bottom:8px"><div id="tt2o" style="padding:12px;background:#111;border-radius:4px;min-height:40px;color:#00ff88;font-size:14px"></div></div><script>let tt=document.getElementById('tt2'),tto=document.getElementById('tt2o');tt.oninput=()=>{let s=tt.value;${g.weird>50?"s=s.split('').map(c=>'aeiou'.includes(c)?c.toUpperCase():c).join('');":''}${g.chaos>50?"s=s.split('').map(c=>Math.random()>0.85?String.fromCharCode(c.charCodeAt(0)+1):c).join('');":''}${g.speed>50?"s=s.split('').reverse().join('');":''}tto.textContent=s||'Type above...'}<\/script>`;
}
}
};
const BKEYS=Object.keys(BLUEPRINTS);

// ============= GENETIC ALGORITHM =============
let population=[],generation=1,totalBorn=0,totalDied=0,totalApps=0,speed=2,day=0;
let publishedApps=[];
const MAX_POP=24,MAX_AGE=8,PUBLISHED_LIMIT=40;

function randGene(){return Math.floor(Math.random()*100)}
function makeGenome(type){
type=type||BKEYS[Math.floor(Math.random()*BKEYS.length)];
return{
type,speed:randGene(),power:randGene(),elegance:randGene(),
weird:randGene(),chaos:randGene(),theme:Math.floor(Math.random()*100),
parent:null
};
}
function makeOrganism(genome){
genome=genome||makeGenome();
let o={
genome,x:50+Math.random()*180,y:50+Math.random()*300,
vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,
age:0,alive:true,fitness:0,votes:0,botVotes:0,
compiled:compiles(genome),id:totalBorn++,
published:false,color:orgColor(genome)
};
return o;
}
function compiles(g){
// High chaos + low elegance = compilation failure
return!(g.chaos>60&&g.elegance<40);
}
function orgColor(g){
let h=(g.type.charCodeAt(0)*13+g.theme*3.6)%360;
let s=40+g.weird*0.3,l=30+g.power*0.2;
return`hsl(${h|0},${s|0}%,${l|0}%)`;
}
function breed(g1,g2){
let child={};
let keys=['speed','power','elegance','weird','chaos','theme'];
for(let k of keys){
child[k]=Math.random()<0.5?g1[k]:g2[k];
}
child.type=Math.random()<0.5?g1.type:g2.type;
child.parent=g1.id+','+g2.id;
// Mutation
child.speed=mutate(child.speed);
child.power=mutate(child.power);
child.elegance=mutate(child.elegance);
child.weird=mutate(child.weird);
child.chaos=mutate(child.chaos);
child.theme=mutate(child.theme);
// Rare type shift
if(Math.random()<0.05)child.type=BKEYS[Math.floor(Math.random()*BKEYS.length)];
return child;
}
function mutate(v){
let r=Math.random();
if(r<0.1)return Math.floor(Math.random()*100);
if(r<0.3)return Math.max(0,Math.min(100,v+Math.floor(Math.random()*21)-10));
return v;
}

function tick(){
// Age and kill
for(let o of population){
if(!o.alive)continue;
o.age++;
if(o.age>MAX_AGE||(o.compiled===false&&o.age>1)){
o.alive=false;totalDied++;
}
}
// Remove dead after a fade
population=population.filter(o=>o.alive);

// Publish compiled organisms
for(let o of population){
if(o.compiled&&!o.published&&o.age>=2){
o.published=true;
publishApp(o);
}
}

// Selection & breeding
if(population.length<MAX_POP){
let alive=population.filter(o=>o.compiled&&o.age<MAX_AGE-1);
if(alive.length>=2){
// Tournament selection
let p1=tournament(alive);
let p2=tournament(alive);
let child=makeOrganism(breed(p1.genome,p2.genome));
population.push(child);
addLog(`Born: ${appDisplayName(child.genome)} (from #${p1.id}×#${p2.id})`);
}else{
// Not enough breeding stock — seed random
let o=makeOrganism();
population.push(o);
addLog(`Seeded: ${appDisplayName(o.genome)}`);
}
}

// Bot voting on published apps
if(Math.random()<0.3)botVote();

// Apply votes to fitness
for(let o of population){
o.fitness=(o.compiled?1:0)*100+o.genome.weird*0.3+o.genome.elegance*0.2+o.votes*10+o.botVotes*5;
}

generation++;
day+=speed;
updateStats();
updateBanner();
drawPool();
}

function tournament(pool){
let best=pool[Math.floor(Math.random()*pool.length)];
for(let i=0;i<2;i++){
let c=pool[Math.floor(Math.random()*pool.length)];
if(c.fitness>best.fitness)best=c;
}
return best;
}

function appDisplayName(g){
let bp=BLUEPRINTS[g.type];
return bp?bp.name(g):g.type;
}
function appDesc(g){
let bp=BLUEPRINTS[g.type];
return bp?bp.desc(g):'Unknown program';
}

function publishApp(o){
let app={
id:o.id,genome:{...o.genome},name:appDisplayName(o.genome),
desc:appDesc(o.genome),type:o.genome.type,
upvotes:0,downvotes:0,humanVotes:0,botVotes:0,
gen:generation,featured:false,html:BLUEPRINTS[o.genome.type].build(o.genome),
age:0
};
publishedApps.unshift(app);
if(publishedApps.length>PUBLISHED_LIMIT)publishedApps.pop();
totalApps++;
addLog(`📱 Published: ${app.name}`);
renderFeed();
}

function botVote(){
if(publishedApps.length===0)return;
// Bots prefer elegance and power
for(let app of publishedApps){
let g=app.genome;
let botScore=g.elegance*0.4+g.power*0.3+g.speed*0.2+g.weird*0.1;
if(botScore>45)app.upvotes++;else app.downvotes++;
app.botVotes++;
app.age++;
}
// Find top app and feature it
let sorted=[...publishedApps].sort((a,b)=>(b.upvotes-b.downvotes)-(a.upvotes-a.downvotes));
publishedApps.forEach(a=>a.featured=false);
if(sorted[0]&&(sorted[0].upvotes-sorted[0].downvotes)>2)sorted[0].featured=true;
}

function humanVote(id,delta){
let app=publishedApps.find(a=>a.id===id);
if(!app)return;
if(delta>0)app.upvotes++;else app.downvotes++;
app.humanVotes++;
// Boost the organism if alive
let org=population.find(o=>o.id===id);
if(org)org.votes+=delta>0?2:-1;
renderFeed();
}

// ============= RENDERING =============
let canvas,ctx,W,H,tooltip;
function initCanvas(){
canvas=document.getElementById('pool-canvas');
ctx=canvas.getContext('2d');
resize();
window.addEventListener('resize',resize);
canvas.addEventListener('mousemove',onPoolHover);
canvas.addEventListener('click',onPoolClick);
canvas.addEventListener('mouseleave',()=>{tooltip.style.display='none'});
tooltip=document.getElementById('pool-tooltip');
}
function resize(){
let el=document.getElementById('pool');
W=canvas.width=el.clientWidth;
H=canvas.height=el.clientHeight;
}
function drawPool(){
ctx.fillStyle='#080810';
ctx.fillRect(0,0,W,H);
// Draw parent connections
ctx.lineWidth=1;
for(let o of population){
if(!o.alive)continue;
o.x+=o.vx;o.y+=o.vy;
if(o.x<20||o.x>W-20)o.vx*=-1;
if(o.y<20||o.y>H-20)o.vy*=-1;
o.vx+=(Math.random()-0.5)*0.02;
o.vy+=(Math.random()-0.5)*0.02;
}
// Connections to similar types
for(let i=0;i<population.length;i++){
for(let j=i+1;j<population.length;j++){
if(population[i].genome.type===population[j].genome.type){
let d=Math.hypot(population[i].x-population[j].x,population[i].y-population[j].y);
if(d<80){
ctx.strokeStyle='rgba(0,170,255,0.1)';
ctx.beginPath();
ctx.moveTo(population[i].x,population[i].y);
ctx.lineTo(population[j].x,population[j].y);
ctx.stroke();
}
}
}
}
// Draw organisms
for(let o of population){
if(!o.alive)continue;
let r=4+o.fitness/30;
r=Math.min(r,12);
ctx.fillStyle=o.compiled?o.color:'#440011';
ctx.beginPath();
ctx.arc(o.x,o.y,r,0,7);
ctx.fill();
if(o.featured||o.votes>0){
ctx.strokeStyle='#00ff88';
ctx.lineWidth=2;
ctx.stroke();
}
// DNA ring
if(o.age===0){
ctx.strokeStyle='rgba(0,255,136,0.4)';
ctx.lineWidth=1;
ctx.beginPath();
ctx.arc(o.x,o.y,r+3,0,7);
ctx.stroke();
}
}
}

function onPoolHover(e){
let r=canvas.getBoundingClientRect();
let mx=e.clientX-r.left,my=e.clientY-r.top;
let found=null;
for(let o of population){
if(!o.alive)continue;
let d=Math.hypot(o.x-mx,o.y-my);
if(d<12){found=o;break}
}
if(found){
let g=found.genome;
tooltip.style.display='block';
let bx=Math.min(mx+12,W-200);
let by=Math.min(my+12,H-100);
tooltip.style.left=bx+'px';
tooltip.style.top=by+'px';
tooltip.innerHTML=`<div class="pt-name">${appDisplayName(g)}</div><div class="pt-type">${g.type} · gen ${generation}</div>${found.compiled?'✅ Compiled':'❌ Failed'} · Fit: ${found.fitness.toFixed(0)}<br> spd ${g.speed} pow ${g.power} elg ${g.elegance}<br> wrd ${g.weird} chs ${g.chaos}`;
}else{
tooltip.style.display='none';
}
}
function onPoolClick(e){
let r=canvas.getBoundingClientRect();
let mx=e.clientX-r.left,my=e.clientY-r.top;
for(let o of population){
if(!o.alive)continue;
let d=Math.hypot(o.x-mx,o.y-my);
if(d<12){
if(o.compiled&&o.published){
let app=publishedApps.find(a=>a.id===o.id);
if(app)openApp(app);
}else if(!o.compiled){
addLog('That one failed to compile.');
}
return;
}
}
}

function renderFeed(){
let list=document.getElementById('feed-list');
let empty=document.getElementById('feed-empty');
document.getElementById('feed-count').textContent=publishedApps.length;
if(publishedApps.length===0){empty.style.display='block';list.innerHTML='';return}
empty.style.display='none';
let html='';
for(let app of publishedApps){
let score=app.upvotes-app.downvotes;
html+=`<div class="feed-item ${app.featured?'featured':''}" onclick="openApp(${app.id})">
<div class="app-name">${app.featured?'⭐ ':''}${app.name}</div>
<div class="app-type">${app.type} · Gen ${app.gen}</div>
<div class="app-desc">${app.desc}</div>
<div class="votes">
<span class="upvotes">▲ ${app.upvotes}</span> <span class="downvotes">▼ ${app.downvotes}</span>
${app.humanVotes>0?'<span class="human-tag">human</span>':''}
${app.botVotes>0?'<span class="bot-tag">bot</span>':''}
</div>
<div style="margin-top:6px">
<button class="try-btn" onclick="event.stopPropagation();openApp(${app.id})">▶ Try it</button>
<button class="try-btn" style="border-color:#004422" onclick="event.stopPropagation();humanVote(${app.id},1)">▲ Vote</button>
</div>
</div>`;
}
list.innerHTML=html;
}

function openApp(id){
let app=publishedApps.find(a=>a.id===id);
if(!app)return;
document.getElementById('modal-title').textContent=app.name;
let container=document.getElementById('app-frame-container');
container.innerHTML='';
let iframe=document.createElement('iframe');
iframe.sandbox='allow-scripts';
iframe.style.height='320px';
iframe.srcdoc=`<!DOCTYPE html><html><head><style>body{background:#0a0a14;color:#c8c8e0;font-family:'Courier New',monospace;margin:0;padding:12px}</style></head><body>${app.html}</body></html>`;
container.appendChild(iframe);
let g=app.genome;
document.getElementById('modal-genes').innerHTML=
`<span class="gene-row"><span>spd</span> <b>${g.speed}</b></span>`+
`<span class="gene-row"><span>pow</span> <b>${g.power}</b></span>`+
`<span class="gene-row"><span>elg</span> <b>${g.elegance}</b></span>`+
`<span class="gene-row"><span>wrd</span> <b>${g.weird}</b></span>`+
`<span class="gene-row"><span>chs</span> <b>${g.chaos}</b></span>`+
`<span class="gene-row"><span>parent</span> <b>${g.parent||'seed'}</b></span>`;
document.getElementById('app-modal').classList.add('active');
}
function closeModal(){
document.getElementById('app-modal').classList.remove('active');
}

function updateStats(){
document.getElementById('s-gen').textContent=generation;
document.getElementById('s-pop').textContent=population.filter(o=>o.alive).length;
document.getElementById('s-born').textContent=totalBorn;
document.getElementById('s-died').textContent=totalDied;
document.getElementById('s-apps').textContent=totalApps;
// Heat: GPU ~170W + GA computer ~120W = 290W base, fluctuates with pop
let watts=290+population.filter(o=>o.alive).length*3;
document.getElementById('s-heat').textContent=watts+'W';
document.getElementById('hm-watts').textContent=watts+'W';
let kwh=(watts/1000)*(day/24);
document.getElementById('s-kwh').textContent=kwh.toFixed(1);
document.getElementById('hm-days').textContent=`Day ${Math.min(day,120)} / 120`;
}

function updateBanner(){
let alive=population.filter(o=>o.alive).length;
let compiled=population.filter(o=>o.alive&&o.compiled).length;
document.getElementById('generation-banner').innerHTML=
`<span class="gen">GEN ${generation}</span> · ${alive} organisms · ${compiled} compiled · ${publishedApps.length} apps published · Day ${Math.min(day,120)}/120`;
}

function addLog(msg){
let log=document.getElementById('log');
let line=document.createElement('div');
line.className='log-line new';
line.textContent=msg;
log.insertBefore(line,log.firstChild);
setTimeout(()=>line.className='log-line',3000);
while(log.children.length>8)log.removeChild(log.lastChild);
}

// ============= CONTROLS =============
function setSpeed(s){
speed=s;
document.querySelectorAll('.speed-btn').forEach((b,i)=>{
let speeds=[1,2,4,10];
b.classList.toggle('active',speeds[i]===s);
});
}
function radiation(){
for(let o of population){
if(!o.alive)continue;
o.genome.speed=mutate(o.genome.speed);
o.genome.power=mutate(o.genome.power);
o.genome.elegance=mutate(o.genome.elegance);
o.genome.weird=mutate(o.genome.weird);
o.genome.chaos=mutate(o.genome.chaos);
if(Math.random()<0.1)o.genome.type=BKEYS[Math.floor(Math.random()*BKEYS.length)];
o.compiled=compiles(o.genome);
o.color=orgColor(o.genome);
}
addLog('☢️ RADIATION BURST — mass mutation!');
}
function extinction(){
let survivors=Math.ceil(population.length*0.1);
let dead=population.filter(o=>o.alive).length-survivors;
population.sort((a,b)=>b.fitness-a.fitness);
for(let i=survivors;i<population.length;i++){
population[i].alive=false;totalDied++;
}
addLog(`💀 MASS EXTINCTION — ${dead} died, ${survivors} survived`);
}
function seed(){
let o=makeOrganism();
population.push(o);
addLog(`🌱 Seeded: ${appDisplayName(o.genome)}`);
}
function reset(){
population=[];generation=1;totalBorn=0;totalDied=0;totalApps=0;day=0;
publishedApps=[];
for(let i=0;i<8;i++)population.push(makeOrganism());
renderFeed();
addLog('🔄 Reset to generation 1');
}

// ============= INIT =============
function init(){
initCanvas();
for(let i=0;i<8;i++)population.push(makeOrganism());
updateStats();
updateBanner();
renderFeed();
// Game loop
setInterval(()=>{
for(let i=0;i<speed;i++)tick();
},1500);
}
init();
</script>
</body>
</html>
