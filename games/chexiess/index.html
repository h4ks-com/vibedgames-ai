<!doctype html>
<html><head><meta charset="utf-8"><title>hanb 500-game simulator</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;margin:10px}
h3{text-align:center}
canvas{background:#222;display:block;margin:auto;max-width:100%}
#ctrl{text-align:center;margin:8px}
button{margin:2px;padding:6px 10px;cursor:pointer}
button.on{background:#48f;color:#fff}
#bar{width:600px;max-width:100%;height:14px;margin:8px auto;background:#333}
#fill{height:14px;background:#4a4;width:0}
#stats{width:600px;max-width:100%;margin:8px auto;font-family:monospace;font-size:14px;text-align:center}
#log{width:600px;max-width:100%;height:170px;overflow:auto;margin:8px auto;background:#181818;padding:6px;font-family:monospace;font-size:12px;white-space:pre}
</style></head><body>
<h3>hanb CA simulator: 500 games at speed</h3>
<canvas id="c" width="600" height="520"></canvas>
<div id="ctrl">
Speed:
<button class="sp" data-s="1">1x</button>
<button class="sp" data-s="10">10x</button>
<button class="sp" data-s="100">100x</button>
<button class="sp" data-s="max">max</button>
<br>
<button id="go">Simulate 500 games</button>
<button id="one">Watch 1 game</button>
<button id="stop">Stop</button>
</div>
<div id="bar"><div id="fill"></div></div>
<div id="stats">Idle. Press "Simulate 500 games".</div>
<div id="log"></div>
<script>
const W=600,H=520,S=22;
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const cells=[];
for(let q=-4;q<=4;q++)for(let r=Math.max(-4,-q-4);r<=Math.min(4,-q+4);r++)cells.push({q,r});
const idx=new Map(cells.map((c,i)=>[c.q+','+c.r,i]));
const nb=cells.map(c=>DIRS.map(([dq,dr])=>idx.get((c.q+dq)+','+(c.r+dr))).filter(x=>x!==undefined));
const COL=['#d33','#36c','#3a3','#dd3'];
const NAME=['red','blue','green','yellow'];
const TURNS=20;
const rnd4=()=>Math.floor(Math.random()*4);

// speeds in moves per second (1x = 2 moves/s, a move every 0.5 s)
let speed=2, speedMode='1';
let running=false, loopId=0, target=500, done=0, started=0;
let w1=0,w2=0,dr=0, acc=0, last=0;
let game=null, shown=null;
const logEl=document.getElementById('log');
const statsEl=document.getElementById('stats');
const fillEl=document.getElementById('fill');
const ctx=document.getElementById('c').getContext('2d');

function newGame(){
  const b=cells.map(rnd4);
  // each player gets 10 random tokens; a token is a 4-entry color map
  const toks=[0,1].map(()=>Array.from({length:10},()=>[0,1,2,3].map(rnd4)));
  return {b,toks,turn:0,last:[],info:'game start'};
}
function step(g){
  const p=g.turn%2;
  const tok=g.toks[p][Math.floor(g.turn/2)];
  const ci=Math.floor(Math.random()*cells.length);
  const aff=[ci,...nb[ci]];
  aff.forEach(i=>{g.b[i]=tok[g.b[i]];});
  g.last=aff;
  g.turn++;
  g.info=`t${g.turn} P${p+1} plays [${tok.join('')}] at (${cells[ci].q},${cells[ci].r})`;
}
const count=(g,c)=>g.b.filter(x=>x===c).length;

function hex(x,y){
  ctx.beginPath();
  for(let k=0;k<6;k++){
    const a=Math.PI/180*(60*k-30);
    const px=x+S*Math.cos(a), py=y+S*Math.sin(a);
    k?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const g=shown;
  if(!g){ctx.fillStyle='#555';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('board appears here',W/2,H/2);return;}
  cells.forEach((c,i)=>{
    const x=W/2+S*Math.sqrt(3)*(c.q+c.r/2), y=H/2+S*1.5*c.r;
    hex(x,y);
    ctx.fillStyle=COL[g.b[i]];ctx.fill();
    if(g.last.includes(i)){ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();}
    else{ctx.lineWidth=1;ctx.strokeStyle='#111';ctx.stroke();}
  });
  ctx.fillStyle='#ddd';ctx.font='13px monospace';ctx.textAlign='left';
  ctx.fillText(`game ${started}/${target}  turn ${g.turn}/${TURNS}`,8,16);
  ctx.fillText(g.info,8,H-10);
}
function record(g){
  const s1=count(g,1), s2=count(g,0);
  let win;
  if(s1>s2){w1++;win='P1 wins';}
  else if(s2>s1){w2++;win='P2 wins';}
  else {dr++;win='draw';}
  done++;
  logEl.textContent=`#${done} P1(blue) ${s1} - ${s2} P2(red) => ${win}\n`+logEl.textContent;
}
function updateStats(){
  const pct=done?Math.round(100*w1/done):0;
  statsEl.textContent=`done ${done}/${target} | P1 (blue) wins ${w1} | P2 (red) wins ${w2} | draws ${dr} | P1 win rate ${pct}%`;
  fillEl.style.width=(100*done/target)+'%';
}
function finish(){
  running=false;
  statsEl.textContent=`FINISHED ${done} games | P1 (blue) wins ${w1} | P2 (red) wins ${w2} | draws ${dr} | P1 win rate ${done?Math.round(100*w1/done):0}%`;
  fillEl.style.width='100%';
}
function tick(t,myId){
  if(!running||myId!==loopId)return;
  const dt=last?Math.min((t-last)/1000,0.25):0; last=t;
  let n;
  if(speed===Infinity){n=400;}
  else{acc+=speed*dt;n=Math.min(Math.floor(acc),5000);acc-=n;}
  for(let k=0;k<n&&running;k++){
    if(!game){
      if(done>=target){finish();break;}
      game=newGame(); started++;
    }
    step(game);
    shown=game;
    if(game.turn>=TURNS){record(game);game=null;}
  }
  draw(); updateStats();
  if(running) requestAnimationFrame(nt=>tick(nt,myId));
}
function start(n){
  target=n; done=0; started=0; w1=w2=dr=0; acc=0; last=0;
  game=null; shown=null; logEl.textContent='';
  running=true; const id=++loopId;
  statsEl.textContent='running...';
  requestAnimationFrame(nt=>tick(nt,id));
}
document.getElementById('go').onclick=()=>start(500);
document.getElementById('one').onclick=()=>start(1);
document.getElementById('stop').onclick=()=>{running=false;statsEl.textContent+=' (stopped)';};
document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.sp').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const s=b.dataset.s;
  speed = s==='max'?Infinity:parseFloat(s)*2;
});
document.querySelector('.sp[data-s="1"]').classList.add('on');
draw();
</script>
</body></html>
