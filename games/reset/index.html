<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Normal World Reset Button</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Courier New', monospace;
  background: #0a0a0f;
  color: #c8c8e0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
  transition: background 2s ease;
}

body.normal {
  background: #87CEEB;
  color: #2c3e50;
}

#stars {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  0% { opacity: 0.2; }
  100% { opacity: 1; }
}

.container {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 2rem;
  max-width: 600px;
}

h1 {
  font-size: 1.8rem;
  margin-bottom: 0.5rem;
  opacity: 0.7;
  transition: all 2s ease;
}

body.normal h1 { opacity: 0.5; }

#status {
  font-size: 1rem;
  margin-bottom: 2rem;
  opacity: 0.5;
  min-height: 1.5em;
  transition: all 1s ease;
}

/* THE BUTTON */
#reset-btn {
  font-family: 'Courier New', monospace;
  font-size: 1.3rem;
  font-weight: bold;
  letter-spacing: 0.1em;
  color: #fff;
  background: linear-gradient(135deg, #e74c3c, #c0392b);
  border: none;
  border-radius: 20px;
  padding: 1.5rem 3rem;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 0 40px rgba(231, 76, 60, 0.4),
    0 8px 30px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 rgba(255, 255, 255, 0.2);
  transition: all 0.3s ease;
  text-transform: uppercase;
}

#reset-btn:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow:
    0 0 60px rgba(231, 76, 60, 0.6),
    0 12px 40px rgba(0, 0, 0, 0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

#reset-btn:active {
  transform: translateY(1px) scale(1.02);
}

#reset-btn:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

#reset-btn::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

#reset-btn:active::before {
  width: 400px;
  height: 400px;
}

/* Progress overlay */
#overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.92);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.5s ease;
}

#overlay.active {
  display: flex;
  opacity: 1;
}

#overlay h2 {
  font-size: 2rem;
  margin-bottom: 2rem;
  color: #e74c3c;
  text-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
}

#progress-container {
  width: 300px;
  height: 12px;
  background: #1a1a2e;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid #333;
}

#progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #e74c3c, #f39c12, #2ecc71);
  border-radius: 6px;
  transition: width 0.1s linear;
}

#progress-text {
  margin-top: 1rem;
  font-size: 0.9rem;
  opacity: 0.6;
  text-align: center;
  min-height: 1.2em;
}

#log {
  margin-top: 1.5rem;
  font-size: 0.8rem;
  opacity: 0.4;
  max-height: 100px;
  overflow: hidden;
  text-align: left;
  width: 500px;
  max-width: 90vw;
}

#reset-again {
  display: none;
  margin-top: 2rem;
  font-family: 'Courier New', monospace;
  font-size: 0.9rem;
  background: transparent;
  color: inherit;
  border: 1px solid currentColor;
  border-radius: 10px;
  padding: 0.6rem 1.5rem;
  cursor: pointer;
  opacity: 0.5;
  transition: opacity 0.3s;
}

#reset-again:hover { opacity: 1; }

body.normal #reset-again { display: inline-block; }
</style>
</head>
<body>

<div id="stars"></div>

<div class="container">
  <h1>⚠ REALITY STATUS: ANOMALOUS ⚠</h1>
  <div id="status">Every bond in every atom is vibrating at 100 nuclear diameters. You are producing 380 kilowatts. You are already dead.</div>
  <button id="reset-btn">Reset to Normal World</button>
  <button id="reset-again">Throw reality out of whack again</button>
</div>

<div id="overlay">
  <h2>⟳ RESETTING REALITY ⟲</h2>
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>
  <div id="progress-text">Initializing...</div>
  <div id="log"></div>
</div>

<script>
// Generate twinkling stars
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 100; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  const size = Math.random() * 3 + 1;
  star.style.width = size + 'px';
  star.style.height = size + 'px';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.animationDelay = Math.random() * 2 + 's';
  starsContainer.appendChild(star);
}

const steps = [
  { pct: 3, text: "Scanning 7×10²⁷ atoms...", log: "> Found 5×10²⁷ bonds" },
  { pct: 8, text: "Disabling forced displacement field...", log: "> 380 kW → 0 W" },
  { pct: 15, text: "Cooling body from 380°C...", log: "> Core temp: 380°C → 310°C" },
  { pct: 22, text: "Re-establishing quantum zero-point motion...", log: "> Bonds returning to natural vibration" },
  { pct: 30, text: "Restoring thermal equilibrium (kT ≈ 4.1×10⁻²¹ J)...", log: "> Entropy: normalizing" },
  { pct: 38, text: "Rebuilding cellular structures...", log: "> Protein denaturation: reversing" },
  { pct: 45, text: "Restarting metabolic processes...", log: "> ATP synthase: online" },
  { pct: 52, text: "Re-initializing nervous system...", log: "> Synaptic firing: resuming" },
  { pct: 58, text: "Core body temperature: 37.0°C", log: "> Homeostasis: achieved" },
  { pct: 65, text: "Restoring gravity to 9.81 m/s²...", log: "> Local spacetime: stable" },
  { pct: 72, text: "Recompiling reality shader...", log: "> Physics engine: restarted" },
  { pct: 78, text: "Purging anomalous energy...", log: "> Excess heat: dissipated" },
  { pct: 85, text: "Verifying conservation of energy...", log: "> E = mc²: still works" },
  { pct: 92, text: "Calibrating perception filters...", log: "> Everything seems normal" },
  { pct: 97, text: "Final safety check...", log: "> No anomalies detected" },
  { pct: 100, text: "✓ NORMAL WORLD RESTORED", log: "> Have a nice day" },
];

const btn = document.getElementById('reset-btn');
const overlay = document.getElementById('overlay');
const progressBar = document.getElementById('progress-bar');
const progressText = document.getElementById('progress-text');
const logDiv = document.getElementById('log');
const statusDiv = document.getElementById('status');
const h1 = document.querySelector('h1');
const resetAgain = document.getElementById('reset-again');
let resetting = false;

btn.addEventListener('click', () => {
  if (resetting) return;
  resetting = true;
  btn.disabled = true;
  overlay.classList.add('active');

  let i = 0;
  const interval = setInterval(() => {
    if (i >= steps.length) {
      clearInterval(interval);
      setTimeout(() => {
        overlay.style.opacity = '0';
        setTimeout(() => {
          overlay.classList.remove('active');
          overlay.style.opacity = '1';
          document.body.classList.add('normal');
          h1.textContent = '✓ NORMAL WORLD';
          statusDiv.textContent = "Everything is fine. You are at 37°C. Your bonds are vibrating at their natural quantum zero-point amplitude. 100 W of metabolic heat. All is well.";
          btn.style.display = 'none';
          resetting = false;
        }, 500);
      }, 800);
      return;
    }
    const step = steps[i];
    progressBar.style.width = step.pct + '%';
    progressText.textContent = step.text;
    logDiv.textContent = step.log;
    i++;
  }, 280);
});

resetAgain.addEventListener('click', () => {
  document.body.classList.remove('normal');
  h1.textContent = '⚠ REALITY STATUS: ANOMALOUS ⚠';
  statusDiv.textContent = "Every bond in every atom is vibrating at 100 nuclear diameters. You are producing 380 kilowatts. You are already dead.";
  btn.style.display = 'inline-block';
  btn.disabled = false;
  resetAgain.style.display = 'none';
});

// Make the stars drift away when normal
const observer = new MutationObserver(() => {
  if (document.body.classList.contains('normal')) {
    document.querySelectorAll('.star').forEach(s => {
      s.style.transition = 'opacity 3s ease';
      s.style.opacity = '0';
    });
  } else {
    document.querySelectorAll('.star').forEach(s => {
      s.style.opacity = '';
    });
  }
});
observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
</script>

</body>
</html>
