const RS = [];
for (let i = 0; i < ROOM_MAX; i++){
  const c = [];
  for (let k = 0; k < BOARD_SIZE; k++) c.push({ground: 0, place: -1, ch: ' '});

  let best = -1, bd = 1 << 30;
  for (let c = 0; c < BOARD_SIZE; c++) if (row_of(c) === row){ let d = cell_tx(c) - tx; if (d < 0) d = -d; if (d < bd){ bd = d; best = c; } }

}

let near_ready = 0;
function cell_near(row, tx){
  if (!near_ready){ for (let rr = 0; rr < 9; rr++) for (let t = 0; t <= 36; t++) near_cell[rr * 37 + t] = cell_near_slow(rr, t); near_ready = 1; }

  if (row > 8) row = 8;
  if (tx < 0) tx = 0;
  if (tx > 36) tx = 36;

function board_n(){ return Math.floor((TRAIL_COLS + BOARD_TILES - 1) / BOARD_TILES); }

  if (row < 0) row = 0;

  if (col < 0) col = 0;
  if (col >= board_n()) col = board_n() - 1;

  tr_cell = cell_near(row + 2, tx);
  return col;
}

  for (let i = 0; i < PLACE_N; i++) if (Math.floor(PLACE[i].mile / MILES_A_COLUMN) === col) return i;

}
function country_of(col){
  if (col < 0) col = 0;

  switch (TRAIL_COUNTRY[col]){
  case 'g': return G_PRAIRIE;
  case 'p': return G_PLAINS;
  case 'h': return G_HIGH;
  case '^': return G_PASS;
  case 'b': return G_BASIN;
  case 's': return G_SNAKE;
  case 'B': return G_BLUE;

function build_board(r){
  const R = RS[r];
  if (R.built) return;
  for (let c = 0; c < BOARD_SIZE; c++){
    cell_tile(r, c);
    const x = ct_x, row = ct_row;
    const p = place_at(x);
    let g = country_of(x);
    if (row === TRAIL_ROW){
      g = G_TRAIL;
      if (p >= 0 && PLACE[p].kind === PK_FORD) g = G_RIVER;
      if (p >= 0 && PLACE[p].kind === PK_FORT) g = G_FORT;

    R.c[c].place = (row === TRAIL_ROW ? p : -1);

function lay_rooms(){
  room_n = board_n();
  for (let i = 0; i < room_n && i < ROOM_MAX; i++){ RS[i].col = i; RS[i].built = 0; }
  for (let i = 0; i < room_n && i < ROOM_MAX; i++) build_board(i);

function cap_msg(){ if (message[0].length && message[0][0] >= 'a' && message[0][0] <= 'z') message[0] = message[0][0].toUpperCase() + message[0].slice(1); }
function date_of(t){ return DATES[t < 1 ? 0 : t > 15 ? 14 : t - 1]; }
function trail_col(){ const c = Math.floor(miles / MILES_A_COLUMN); return c < 0 ? 0 : c >= TRAIL_COLS ? TRAIL_COLS - 1 : c; }
function next_fort(){ for (let i = 0; i < PLACE_N; i++) if (PLACE[i].kind === PK_FORT && PLACE[i].mile > miles) return i; return -1; }
function die(how){
  if (dead) return;
  dead = 1; gameover = 1;
  dead_how = how;
  sound_say("blow toll");
  say("You died of " + how + ".");
}
function illness(){
  if (100 * rnd() < 10 + 35 * (eat - 1)){ say("Mild illness---medicine used."); miles -= 5; misc -= 2; }
  else if (100 * rnd() < 100 - (40 / Math.pow(4.0, eat - 1))){ say("Bad illness---medicine used."); miles -= 5; misc -= 5; }
  else { say("Serious illness---you must stop for medical attention."); misc -= 10; ill = 1; }
  if (misc < 0){ say("You ran out of medical supplies."); die(hurt_flag ? "injuries" : "pneumonia"); }
}
function shoot(careful){
  const r = rnd();
  if (careful) shot = r < 0.55 ? 0 : r < 0.85 ? 2 : r < 0.97 ? 4 : 7;
  else         shot = r < 0.25 ? 0 : r < 0.60 ? 3 : r < 0.90 ? 5 : 7;
  sound_say("shot rifle");
}

/* ── the turn, as the program runs it ─────────────────────── */
const P_SHOP = 0, P_ACTION = 1, P_FORT = 2, P_HUNT = 3, P_EAT = 4, P_RIDERS = 5, P_DONE = 6, P_OVER = 7;
let phase = P_SHOP;
let shop_at = 0;
const shop_spend = [0, 0, 0, 0, 0];
let fort_at = 0;
const fort_spend = [0, 0, 0, 0];
function shop_done(){
  oxen = shop_spend[0];
  food = shop_spend[1];
  bullets = shop_spend[2] * 50;
  clothing = shop_spend[3];
  misc = shop_spend[4];
  cash = START_CASH - WAGON_COST;
  for (let i = 0; i < 5; i++) cash -= shop_spend[i];
  miles = miles_was = 0;
  turn = 0;
  phase = P_ACTION;
  sound_say("blow wagon");
  say("Independence, Missouri.  Two thousand and forty miles to Oregon City.");
  turn_step();
}
function fort_done(){
  let p;
  p = fort_spend[0]; cash -= p; food     += Math.trunc(2 * p / 3);
  p = fort_spend[1]; cash -= p; bullets  += Math.trunc(2.0 / 3.0 * p * 50);
  p = fort_spend[2]; cash -= p; clothing += Math.trunc(2 * p / 3);
  p = fort_spend[3]; cash -= p; misc     += Math.trunc(2 * p / 3);
  miles -= 45;
  sound_say("blow coin");
  say("Out of the fort, and forty-five miles the poorer for it.");
  phase = P_EAT;
  turn_step();
}
function hunt_done(careful){
  miles -= 45;
  shoot(careful);
  if (shot <= 1){
    say("Right between the eyes---you got a big one!");
    food += Math.trunc(52 + rnd() * 6);
    bullets -= Math.trunc(10 + rnd() * 4);
  } else if (100 * rnd() < 13 * shot){
    say("Sorry---no luck today.");
  } else {
    say("Nice shot--right through the neck--feast tonight!");
    food += 48 - 2 * shot;
    bullets -= 10 + 3 * shot;
  }
  phase = P_EAT;
  turn_step();
}
function riders_done(tactic){
  if (!hostile){
    if (tactic === T_RUN){ miles += 20; misc -= 15; bullets -= 150; oxen -= 40; }
    else if (tactic === T_ATTACK){
      shoot(1);
      bullets -= shot * 40 + 80;
      if (shot <= 1) say("Nice shooting---you drove them off.");
      else if (shot <= 4) say("Kinda slow with your Colt .45.");
      else { say("Lousy shot---you got knifed.  You have to see ol' Doc Blanchard."); hurt_flag = 1; }
    }
    else if (tactic === T_KEEP_ON){
      if (rnd() > 0.8){ say("They did not attack."); phase = P_DONE; turn_step(); return; }
      bullets -= 150; misc -= 15;
    }
    else { shoot(1); bullets -= shot * 30 + 80; miles -= 25;
           if (shot <= 1) say("Nice shooting---you drove them off.");
           else if (shot <= 4) say("Kinda slow with your Colt .45.");
           else { say("Lousy shot---you got knifed.  You have to see ol' Doc Blanchard."); hurt_flag = 1; } }
    say("Riders were hostile--check for losses.");
  } else {
    if (tactic === T_RUN){ miles += 15; oxen -= 10; }
    else if (tactic === T_ATTACK){ miles -= 5; bullets -= 100; }
    else if (tactic === T_CIRCLE) miles -= 20;
    say("Riders were friendly, but check for possible losses.");
  }
  if (bullets < 0){ say("You ran out of bullets and got massacred by the riders."); die("the riders"); phase = P_OVER; return; }
  phase = P_DONE;
  turn_step();
}
function events(){
  const r1 = 100 * rnd();
  let d1 = 0;
  while (d1 < 15 && r1 > EVENT_AT[d1]) d1++;
  switch (d1){
  case 0: say("Wagon breaks down--lose time and supplies fixing it."); miles -= Math.trunc(15 + 5 * rnd()); misc -= 8; break;
  case 1: say("Ox injures leg---slows you down rest of trip."); miles -= 25; oxen -= 20; break;
  case 2: say("Bad luck---your daughter broke her arm.  You had to stop and use supplies to make a sling.");
          miles -= Math.trunc(5 + 4 * rnd()); misc -= Math.trunc(2 + 3 * rnd()); break;
  case 3: say("Ox wanders off---spend time looking for it."); miles -= 17; break;
  case 4: say("Your son gets lost---spend half the day looking for him."); miles -= 10; break;
  case 5: say("Unsafe water--lose time looking for clean spring."); miles -= Math.trunc(10 * rnd() + 2); break;
  case 6:
    if (miles > 950){
      cold = clothing > 22 + 4 * rnd() ? 0 : 1;
      say("Cold weather---brrrrrrr!---you " + (cold ? "don't " : "") + "have enough clothing to keep you warm.");
      if (cold) illness();
      break;
    }
    say("Heavy rains---time and supplies lost."); food -= 10; bullets -= 500; misc -= 15;
    miles -= Math.trunc(10 * rnd() + 5); break;
  case 7:
    say("Bandits attack!");
    shoot(1);
    bullets -= 20 * shot;
    if (bullets < 0){ say("You ran out of bullets---they get lots of cash."); cash = Math.trunc(cash / 3); }
    if (bullets < 0 || shot > 1){
      say("You got shot in the leg and they took one of your oxen.  Better have a doc look at your wound.");
      hurt_flag = 1; misc -= 5; oxen -= 20;
    } else say("Quickest draw outside of Dodge City!  You got 'em!");
    break;
  case 8: say("There was a fire in your wagon--food and supplies damaged."); food -= 40; bullets -= 400;
          misc -= Math.trunc(rnd() * 8 + 3); miles -= 15; break;
  case 9: say("Lose your way in heavy fog---time is lost."); miles -= Math.trunc(10 + 5 * rnd()); break;
  case 10: say("You killed a poisonous snake after it bit you."); bullets -= 10; misc -= 5;
           if (misc < 0){ say("You die of snakebite since you have no medicine."); die("snakebite"); phase = P_OVER; return; }
           break;
  case 11: say("Wagon gets swamped fording river--lose food and clothes."); food -= 30; clothing -= 20;
           miles -= Math.trunc(20 + 20 * rnd()); break;
  case 12:
    say("Wild animals attack!");
    shoot(1);
    if (bullets <= 39){ say("You were too low on bullets--the wolves overpowered you."); hurt_flag = 1; die("injuries"); phase = P_OVER; return; }
    if (shot <= 2) say("Nice shootin' pardner---they didn't get much.");
    else say("Slow on the draw---they got at your food and clothes.");
    bullets -= 20 * shot; clothing -= shot * 4; food -= shot * 8;
    break;
  case 13: say("Hail storm---supplies damaged."); miles -= Math.trunc(5 + rnd() * 10); bullets -= 200;
           misc -= Math.trunc(4 + rnd() * 3); break;
  case 14:
    if (eat === 1){ illness(); break; }
    if (eat === 3){ if (rnd() < 0.5) illness(); break; }
    if (rnd() > 0.25) illness();
    break;
  default: say("Helpful indians show you where to find more food."); food += 14; break;
  }
}
function mountains(){
  if (miles <= 950) return;
  const m = miles / 100.0;
  if (rnd() * 10 <= 9 - ((m - 15) * (m - 15) + 72) / ((m - 15) * (m - 15) + 12)){
    say("Rugged mountains.");
    if (rnd() <= 0.1){ say("You got lost---lose valuable time trying to find trail!"); miles -= 60; }
    else if (rnd() <= 0.11){ say("Wagon damaged!---lose time and supplies."); misc -= 5; bullets -= 200; miles -= Math.trunc(20 + 30 * rnd()); }
    else { say("The going gets slow."); miles -= Math.trunc(45 + rnd() * 50); }
  }
  let snowed = 0;
  if (!past_pass){
    past_pass = 1;
    if (rnd() < 0.8) snowed = 1;
    else say("You made it safely through South Pass--no snow.");
  }
  if (!snowed && miles >= 1700 && !past_blue){
    past_blue = 1;
    if (rnd() < 0.7) snowed = 1;
  }
  if (snowed){
    say("Blizzard in mountain pass--time and supplies lost.");
    blizzard = 1; food -= 25; misc -= 10; bullets -= 300;
    miles -= Math.trunc(30 + 40 * rnd());
    if (clothing < 18 + 2 * rnd()) illness();
  }
  if (miles <= 950) pass_fix = 1;
}
function turn_step(){
  for (;;){
    if (dead || arrived){ phase = P_OVER; return; }
    switch (phase){
    case P_SHOP: case P_ACTION: case P_FORT: case P_HUNT: case P_EAT: case P_RIDERS: case P_OVER:
      return;
    case P_DONE:
      events();
      if (phase === P_OVER) return;
      mountains();
      if (food < 0) food = 0;
      if (bullets < 0) bullets = 0;
      if (clothing < 0) clothing = 0;
      if (misc < 0) misc = 0;
      if (miles >= TRAIL_MILES){ arrived = 1; gameover = 1; sound_say("tune bell"); say("You finally arrived at Oregon City after 2040 long miles---hooray!"); phase = P_OVER; return; }
      phase = P_ACTION;
      turn++;
      if (turn > 15){ say("Winter has closed the passes.  You did not reach Oregon City in time."); die("the winter"); phase = P_OVER; return; }
      if (ill || hurt_flag){
        cash -= 20;
        if (cash < 0){ cash = 0; say("You can't afford a doctor."); die(hurt_flag ? "injuries" : "pneumonia"); phase = P_OVER; return; }
        say("Doctor's bill is $20.");
        ill = hurt_flag = 0;
      }
      if (food < 13) say("You'd better do some hunting or buy food and soon!");
      miles_was = miles;
      return;
    }
  }
}
function do_action(x){
  if (x === DO_FORT){ fort_at = 0; for (let i = 0; i < 4; i++) fort_spend[i] = 0; phase = P_FORT; sound_say("blow wagon"); say("At the fort.  Things cost more here: two thirds of their value."); return; }
  if (x === DO_HUNT){
    if (bullets <= 39){ say("Tough---you need more bullets to go hunting."); return; }
    phase = P_HUNT; say("Hunting.  1 takes a careful shot, 2 a quick one."); return;
  }
  phase = P_EAT;
  turn_step();
}
function do_eat(e){
  if (food - (8 + 5 * e) < 0){ say("You can't eat that well."); return; }
  eat = e;
  food -= 8 + 5 * e;
  if (food < 13 && food >= 0 && bullets <= 39 && cash < 20) say("Food is running very low.");
  miles += Math.trunc(200 + (oxen - 220) / 5.0 + 10 * rnd());
  blizzard = cold = 0;
  sound_say("step " + GROUND[country_of(trail_col())].step);
  const m = miles / 100.0;
  if (rnd() * 10 <= ((m - 4) * (m - 4) + 72) / ((m - 4) * (m - 4) + 12) - 1){
    hostile = rnd() < 0.8 ? 0 : 1;
    if (rnd() <= 0.2) hostile = 1 - hostile;
    say("Riders ahead.  They " + (hostile ? "don't " : "") + "look hostile.");
    phase = P_RIDERS;
    return;
  }
  phase = P_DONE;
  turn_step();
}

const SHAPE_BRICK = 0, SHAPE_HEX = 1, SHAPE_FINE = 2;
let tile_shape = SHAPE_FINE;
const TILE_W = 4, PIX_H = 4, BOARD_Y = 1;
let show_keys = 0, show_intro = 0, show_story = 0;
function put_pixel(fine, tx, gx, y, c){ if (fine) pxq(tx * 2 + gx, y, c); else px(tx + gx, y, c); }
function wagon_px(gx, gy, gw, gh){
  const top = gh >= 4 ? 1 : 0;
  if (gy < top) return -1;
  const band = gy < top + (((gh - top) / 2) | 0) ? 0 : 1;
  const w = band === 0 ? ((gw * 5 / 8) | 0) : ((gw * 3 / 4) | 0);
  const x = ((gw - w) / 2) | 0;
  if (gx < x || gx >= x + w) return -1;
  return band === 0 ? 255 : 130;
}
function draw_cell(tx, ty, r, c, mark, lit){
  const k = RS[r].c[c];
  const G = GROUND[k.ground];
  const fine = tile_shape === SHAPE_FINE, hexed = tile_shape !== SHAPE_BRICK;
  const gw = fine ? TILE_W * 2 : TILE_W, gh = hexed ? PIX_H + 1 : PIX_H;
  const tip = (gw / 4) | 0, tipw = (gw / 2) | 0;
  const y0 = ty * 2 + (hexed ? 1 : 0);
  const tex = hash3u((r * 7919) >>> 0, Number(SEED & 0xFFFFFFFFn), 11);
  for (let gy = 0; gy < gh; gy++){
    let lo = 0, hi = gw;
    if (hexed && (gy === 0 || gy === gh - 1)){ lo = tip; hi = tip + tipw; }
    for (let gx = lo; gx < hi; gx++){
      const h = hash3u(tex, c >>> 0, (gy * 8 + gx) >>> 0);
      let col = ((h & 0xFF) < (20 + G.prom * 12)) ? G.fg : G.bg;
      if (k.ground === G_RIVER) col = (((gx + gy * 3 + turn) & 7) === 0) ? G.fg : G.bg;
      if (k.ground === G_TRAIL) col = (gy === ((gh / 2) | 0)) ? 180 : G.bg;
      if (k.ground === G_FORT) col = (gy >= 1 && gy <= gh - 2 && gx > lo && gx < hi - 1) ? 223 : G.bg;
      if (mark){ const me = wagon_px(gx, gy, gw, gh); if (me >= 0) col = me; }
      if (!lit) col = 16;
      put_pixel(fine, tx, gx, y0 + gy, col);
    }
  }
}
function draw_board(r){
  const at = trail_col();
  for (let c = 0; c < BOARD_SIZE; c++){
    cell_tile(r, c);
    const x = ct_x, row = ct_row;
    const tx = 16 + 4 * COORD_Q[c] + 2 * COORD_R[c];
    const ty = BOARD_Y + 8 + 2 * COORD_R[c];
    draw_cell(tx, ty, r, c, (row === TRAIL_ROW && x === at) ? 1 : 0, 1);
  }
}
function draw_strip(x0, y0, w){
  for (let i = 0; i < w; i++){
    const x = ((TRAIL_COLS * i) / w) | 0;
    const p = place_at(x);
    const g = country_of(x);
    const ch = p >= 0 ? (PLACE[p].kind === PK_FORT ? "F" : PLACE[p].kind === PK_FORD ? "~" : "*") : "-";
    text(x0 + i, y0, ch, p >= 0 ? 231 : 180, GROUND[g].bg);
  }
  const at = ((trail_col() * w) / TRAIL_COLS) | 0;
  if (at >= 0 && at < w) text(x0 + at, y0, "#", 255, 232);
}
const FORT_NAME = ["food", "ammunition", "clothing", "miscellaneous"];

function wrap_lines(s, width, max){
  const out = [];
  let p = 0;
  while (p < s.length && out.length < max){
    if (s[p] === '\n'){ out.push(""); p++; continue; }
    let len = 0, last_space = -1;
    while (p + len < s.length && s[p + len] !== '\n' && len < width){ if (s[p + len] === ' ') last_space = len; len++; }
    let cut = len;
    if (p + len < s.length && s[p + len] !== '\n' && last_space > 0) cut = last_space;
    out.push(s.slice(p, p + cut));
    p += cut;
    while (s[p] === ' ') p++;
  }
  return out;
}
function draw_page(body, foot, fg){
  const x = 1, y = 1, w = screen_w - 2, h = screen_h - 2;
  fill(x, y, w, h, 235);
  for (let c = x; c < x + w; c++){ text(c, y, " ", 250, 240); text(c, y + h - 1, " ", 250, 240); }
  for (let r = y; r < y + h; r++){ text(x, r, " ", 250, 240); text(x + w - 1, r, " ", 250, 240); }
  const lines = wrap_lines(body, w - 6, 64);
  let row = y + 1;
  for (let i = 0; i < lines.length && row < y + h - 2; i++, row++) text(x + 3, row, lines[i], i === 0 ? 223 : fg, 235);
  text(x + 3, y + h - 2, foot, 245, 235);
}

function fb_hash(){
  let h = 2166136261 >>> 0;
  for (let row = 0; row < screen_h; row++)
    for (let col2 = 0; col2 < screen_w; col2++){
      const at = FB(row, col2);
      const ch = fb_ch[at] === FB_QUAD ? 1 : fb_ch[at];
      const q = fb_ch[at] === FB_QUAD ? (fb_q[at] & 15) : 0;
      const v = (fb_fg[at] | (fb_bg[at] << 8) | (q << 16) | (ch << 20)) >>> 0;
      h = Math.imul(h ^ v, 16777619) >>> 0;
      h = Math.imul(h ^ (v >>> 24), 16777619) >>> 0;
    }
  return h;
}

    hostile: hostile, shot: shot, dead: dead, arrived: arrived, gameover: gameover,
    phase: phase, shop_at: shop_at, fort_at: fort_at, tile_shape: tile_shape, turn: turn,
    shop_spend: shop_spend.slice(), fort_spend: fort_spend.slice(), dead_how: dead_how, msg: message.slice(),
  };
  try { save_store.set(JSON.stringify(s)); } catch (e) { return 0; }
  return 1;
}
function load_game(){
  let s;
  try { const j = save_store.get(); if (!j) return 0; s = JSON.parse(j); } catch (e) { return 0; }
  if (!s || s.magic !== "oregoncity") return 0;
  SEED = BigInt(s.seed); dice_state = BigInt(s.dice); SEEDTEXT = s.seedtext;
  oxen = s.oxen; bullets = s.bullets; clothing = s.clothing; food = s.food; misc = s.misc; cash = s.cash;
  miles = s.miles; miles_was = s.miles_was; eat = s.eat; ill = s.ill; hurt_flag = s.hurt_flag; cold = s.cold;
  blizzard = s.blizzard; past_pass = s.past_pass; past_blue = s.past_blue; pass_fix = s.pass_fix;
  hostile = s.hostile; shot = s.shot; dead = s.dead; arrived = s.arrived; gameover = s.gameover;
  phase = s.phase; shop_at = s.shop_at; fort_at = s.fort_at; tile_shape = s.tile_shape; turn = s.turn;
  for (let i = 0; i < 5; i++) shop_spend[i] = s.shop_spend[i];
  for (let i = 0; i < 4; i++) fort_spend[i] = s.fort_spend[i];
  dead_how = s.dead_how; message[0] = s.msg[0]; message[1] = s.msg[1]; message[2] = s.msg[2];
  show_keys = show_intro = show_story = 0;
  return 1;
}
function new_game(){
  oxen = bullets = clothing = food = misc = cash = miles = miles_was = 0;
  turn = 0; eat = 2; ill = hurt_flag = cold = blizzard = past_pass = past_blue = pass_fix = 0;
  hostile = shot = dead = arrived = gameover = 0;
  dead_how = ""; message[0] = message[1] = message[2] = "";
  phase = P_SHOP; shop_at = 0;
  shop_spend[0] = 200; shop_spend[1] = 200; shop_spend[2] = 100; shop_spend[3] = 100; shop_spend[4] = 50;
  for (let i = 0; i < 4; i++) fort_spend[i] = 0;
  fort_at = 0;
  show_keys = 0; show_story = 0; show_intro = 1;
  lay_rooms();
  say("Outfitting at Independence.  $700 to spend, and the wagon already bought.");
}
function spend_key(amounts, n, at, c, purse){
  let step = 0;
  if (c === 'a') step = -5; else if (c === 'd') step = 5;
  else if (c === 'z') step = -25; else if (c === 'x') step = 25;
  else if (c === 'w') return (at + n - 1) % n;
  else if (c === 'e') return (at + 1) % n;
  else return at;
  let left = purse;
  for (let i = 0; i < n; i++) left -= amounts[i];
  if (step > 0 && step > left) step = left;
  if (amounts[at] + step < 0) step = -amounts[at];
  amounts[at] += step;
  if (step) sound_say("blow coin");
  return at;
}
function handle_key(ch){
  const c = typeof ch === "number" ? ch : ch.charCodeAt(0);
  const key = String.fromCharCode(c);
  if (show_intro){
    if (key === 'q' || c === 27 || c === 3) return 0;
    show_intro = 0;
    return 1;
  }
  if (show_keys){ show_keys = 0; return 1; }
  switch (key){
  case 'S': say(save_game() ? "Saved." : "It would not save."); return 1;
  case 'L': say(load_game() ? "Loaded." : "There is no saved journey."); return 1;
  case 'T': tile_shape = (tile_shape + 1) % SHAPE_N; say(SHAPE_NAME[tile_shape] + " tiles."); return 1;
  case '?': show_keys = 1; return 1;
  case 'q': case '\x1b': case '\x03': case '\x04': return 0;
  default: break;
  }
  if (gameover){
    if (key === 'n'){ new_game(); show_intro = 0; return 1; }
    return 1;
  }
  switch (phase){
  case P_SHOP:
    if (key === 'g' || key === '\n' || key === '\r'){
      if (shop_spend[0] < 200){ say("Not enough on the oxen: $200 at least."); return 1; }
      shop_done();
      return 1;
    }
    shop_at = spend_key(shop_spend, 5, shop_at, key, START_CASH - WAGON_COST);
    return 1;
  case P_FORT:
    if (key === 'g' || key === '\n' || key === '\r'){ fort_done(); return 1; }
    fort_at = spend_key(fort_spend, 4, fort_at, key, cash);
    return 1;
  case P_ACTION:
    if (key === '1'){ if (next_fort() < 0){ say("There is no fort ahead of you."); return 1; } do_action(DO_FORT); return 1; }
    if (key === '2'){ do_action(DO_HUNT); return 1; }
    if (key === '3'){ do_action(DO_ON); return 1; }
    return 1;
  case P_HUNT:
    if (key === '1'){ hunt_done(1); return 1; }
    if (key === '2'){ hunt_done(0); return 1; }
    return 1;
  case P_EAT:
    if (c >= 49 && c <= 51){ do_eat(c - 48); return 1; }
    return 1;
  case P_RIDERS:
    if (c >= 49 && c <= 52){ riders_done(c - 48); return 1; }
    return 1;
  default:
    return 1;
  }
}
function start_game(seedText, dice){
  setSeed(seedText);
  dice_state = 0x243F6A8885A308D3n;
  if (dice) dice_state ^= SEED;
  else dice_state ^= (BigInt(Date.now()) * 0x9E3779B97F4A7C15n) & M64;
  new_game();
  tile_shape = SHAPE_FINE;
  grown_keep.fill(null); bst_keep.fill(null);
  sound_bed = "";
}
function legend_char(r, c){
  const k = RS[r].c[c];
  cell_tile(r, c);
  const x = ct_x, row = ct_row;
  if (row === TRAIL_ROW && x === trail_col()) return '#';
  if (k.place >= 0) return PLACE[k.place].kind === PK_FORT ? 'F' : PLACE[k.place].kind === PK_FORD ? '~' : '*';
  switch (k.ground){
  case G_TRAIL: return '-';
  case G_RIVER: return '~';
  case G_FORT:  return 'F';
  default: return TRAIL_COUNTRY[x < 0 ? 0 : x >= TRAIL_COLS ? TRAIL_COLS - 1 : x];
  }
}
const ROWN = [5, 6, 7, 8, 9, 8, 7, 6, 5];
function print_board(out, r){
  let i = 0;
  for (let row = 0; row < 9; row++){
    let line = "   " + " ".repeat(4 - (row < 4 ? row : 8 - row));
    for (let j = 0; j < ROWN[row]; j++, i++) line += legend_char(r, i) + " ";
    out.push(line);
  }
}
function reset_statics(){
  oxen = bullets = clothing = food = misc = cash = miles = miles_was = 0;
  turn = 0; eat = 2; ill = hurt_flag = cold = blizzard = past_pass = past_blue = pass_fix = 0;
  hostile = shot = dead = arrived = gameover = 0;
  dead_how = ""; message[0] = message[1] = message[2] = "";
  phase = P_SHOP; shop_at = 0; fort_at = 0; tile_shape = SHAPE_FINE;
  show_keys = show_intro = show_story = 0;
  for (let r = 0; r < ROOM_MAX; r++) RS[r].built = 0;
  grown_keep.fill(null); bst_keep.fill(null);
}
function check_rooms(seedText, only){
  const out = [];
  setSeed(seedText);
  reset_statics();
  lay_rooms();
  miles = -1;
  if (only === undefined || only === null) only = -1;
  for (let r = 0; r < room_n; r++){
    if (only >= 0 && r !== only) continue;
    out.push("");
    out.push("mile " + (r * BOARD_TILES * MILES_A_COLUMN) + "  (" + r + ")");
    print_board(out, r);
  }
  return out;
}
function keys_report(out){
  out.push("mile " + miles + "  turn " + turn + "  phase " + phase + "  " + (dead ? "DEAD: " : arrived ? "ARRIVED" : "") + (dead ? dead_how : ""));
  out.push("oxen " + oxen + " food " + food + " bullets " + bullets + " clothing " + clothing + " misc " + misc + " cash " + cash + " eat " + eat);
  out.push("ill " + ill + " hurt " + hurt_flag + " pass " + past_pass + " blue " + past_blue + " shot " + shot + " hostile " + hostile);
  out.push("last: " + message[0]);
  out.push("      " + message[1]);
  out.push("      " + message[2]);
  screen_w = 80; screen_h = 25;
  compose_screen();
  out.push("screen " + pad0(fb_hash().toString(16), 8));
}
function check_keys(seedText, keys_in){
  const out = [];
  reset_statics();
  start_game(seedText, 1);
  show_intro = 0;
  for (let i = 0; i < keys_in.length; i++){
    if (!handle_key(keys_in[i])) break;
    if (gameover) break;
  }
  keys_report(out);
  return out;
}
function check_trail(seedText, keys_in, marks){
  const out = [];
  reset_statics();
  start_game(seedText, 1);
  show_intro = 0;
  let mi = 0, stopped = 0;
  for (let i = 0; i < keys_in.length && !stopped; i++){
    while (mi < marks.length && marks[mi] <= i){ const rep = []; keys_report(rep); out.push(rep); mi++; }
    if (!handle_key(keys_in[i])) stopped = 1;
    if (gameover) stopped = 1;
  }
  while (mi < marks.length){ const rep = []; keys_report(rep); out.push(rep); mi++; }
  return out;
}

/* ── the walk ─────────────────────────────────────────────── */
let walk_out = [], walk_keys = 0, walk_keystring = [], walk_trace = 0;
const walk_seen = ["", "", ""];
function wprint(s){
  walk_out.push(padl(turn + 1, 3) + "  mile " + padr(miles, 5) + " food " + padr(food, 4) + " bull " + padr(bullets, 5) + " cash " + padr(cash, 4) + " " + s);
}
function wk(c){
  handle_key(c);
  walk_keystring[walk_keys] = c;
  walk_keys++;
  if (walk_trace) walk_out.push(padl(turn + 1, 3) + "  key " + c + "  phase " + phase + " mile " + miles + " food " + food + " | " + message[0]);
  for (let i = 2; i >= 0; i--)
    if (message[i].length && message[i] !== walk_seen[0] && message[i] !== walk_seen[1] && message[i] !== walk_seen[2]) wprint(message[i]);
  walk_seen[0] = message[0]; walk_seen[1] = message[1]; walk_seen[2] = message[2];
}
const WOUTFIT_WANT = [230, 250, 60, 70, 60];
function woutfit(){
  for (let i = 0; i < 5; i++){
    for (let k = 0; k < 40 && shop_spend[shop_at] > 0; k++) wk('z');
    wk('e');
  }
  for (let i = 0; i < 5; i++){
    for (let k = 0; k < 40 && shop_spend[shop_at] + 25 <= WOUTFIT_WANT[i]; k++) wk('x');
    for (let k = 0; k < 8 && shop_spend[shop_at] + 5 <= WOUTFIT_WANT[i]; k++) wk('d');
    wk('e');
  }
  wk('g');
}
function check_walk(seedText, trace){
  walk_out = []; walk_trace = trace ? 1 : 0; walk_keys = 0; walk_keystring = [];
  reset_statics();
  setSeed(seedText);
  dice_state = 0x243F6A8885A308D3n ^ SEED;
  new_game();
  show_intro = 0;
  walk_seen[0] = walk_seen[1] = walk_seen[2] = "";
  woutfit();
  let guard = 0;
  while (!gameover && guard++ < 4000){
    switch (phase){
    case P_ACTION:
      if (cash >= 80 && (food < 140 || misc < 25 || clothing < 45) && next_fort() >= 0) wk('1');
      else if (food < 90 && bullets > 39) wk('2');
      else wk('3');
      break;
    case P_HUNT: wk('1'); break;
    case P_FORT: {
      let purse = cash - 60;
      if (purse < 0) purse = 0;
      const want = [(purse / 2) | 0, bullets < 200 ? (purse / 8) | 0 : 0, clothing < 45 ? (purse / 5) | 0 : 0, misc < 25 ? (purse / 5) | 0 : 0];
      for (let i = 0; i < 4; i++){
        while (fort_at !== i) wk('e');
        for (let k = 0; k < 8 && fort_spend[i] + 25 <= want[i]; k++) wk('x');
      }
      wk('g');
      break; }
    case P_EAT:
      if (food > 260) wk('3'); else if (food > 110) wk('2'); else wk('1');
      break;
    case P_RIDERS:
      wk(hostile ? '1' : '4');
      break;
    default:
      guard = 4000;
      break;
    }
  }
  if (arrived){
    walk_out.push("");
    walk_out.push("WALK OK: Oregon City in " + (turn + 1) + " fortnights, " + walk_keys + " keys; food " + food + ", cash " + cash);
  } else {
    walk_out.push("");
    walk_out.push("WALK FAILED at mile " + miles + " on fortnight " + (turn + 1) + ": " + (dead ? dead_how : "the trip would not end"));
  }
  if (walk_trace) walk_out.push("keys " + walk_keystring.slice(0, walk_keys).join(""));
  return walk_out;
}

/* ── the page ─────────────────────────────────────────────────
 * The terminal's framebuffer painted on a canvas, as hanb-term.html
 * does it: a half block is two stacked rectangles, a quarter block four,
 * and a letter is a letter in the page's own monospace.  The keys are
 * the terminal's keys.  Sound is on unless ?sound=off: the first key
 * pressed on the title page is the gesture that opens the AudioContext,
 * which browsers require, and everything the game says down its pipe
 * in the terminal build is rendered here by the same 2A03 and played
 * as a buffer; the tune loops until the next one. */
const SCREEN_W = 80, SCREEN_H = 25;
const _css = new Map();
function css(c){
  let hit = _css.get(c);
  if (hit === undefined){
    const rgb = cubeRgb(c);
    hit = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
    _css.set(c, hit);
  }
  return hit;
}
function paint(ctx, CW, CH){
  const HW = CW / 2, HH = CH / 2;
  ctx.textBaseline = "top";
  ctx.font = Math.round(CH * 0.82) + "px ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace";
  for (let row = 0; row < SCREEN_H; row++){
    for (let col = 0; col < SCREEN_W; col++){
      const at = FB(row, col), x = col * CW, y = row * CH;
      const fg = fb_fg[at], bg = fb_bg[at], ch = fb_ch[at];
      if (ch === 0){
        ctx.fillStyle = css(fg); ctx.fillRect(x, y, CW, HH);
        ctx.fillStyle = css(bg); ctx.fillRect(x, y + HH, CW, CH - HH);
      } else if (ch === FB_QUAD){
        const m = fb_q[at];
        for (let k = 0; k < 4; k++){
          ctx.fillStyle = css((m & (1 << k)) ? fg : bg);
          ctx.fillRect(x + (k & 1) * HW, y + ((k >> 1) & 1) * HH, HW, HH);
        }
      } else {
        ctx.fillStyle = css(bg); ctx.fillRect(x, y, CW, CH);
        if (ch !== 32){ ctx.fillStyle = css(fg); ctx.fillText(String.fromCharCode(ch), x, y + CH * 0.08); }
      }
    }
  }
}

/* ── sound, through Web Audio ── */
const SOUND = {
  ctx: null, on: true, cache: new Map(), voices: [], bed: null, VOICES: 6,
  open(){
    if (this.ctx || !this.on) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC){ this.on = false; return; }
    try { this.ctx = new AC({sampleRate: FS}); }
    catch (e){ try { this.ctx = new AC(); } catch (e2){ this.on = false; return; } }
    if (this.ctx.state === "suspended") this.ctx.resume();
    /* what was said before the context could open: the bed, at least */
    if (this.pending){ const p = this.pending; this.pending = null; for (const l of p) this.command(l); }
  },
  render(line){
    let buf = this.cache.get(line);
    if (buf) return buf;
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    let pcm = null;
    if (what === "call") pcm = call_render(arg);
    else if (what === "step") pcm = step_render(arg);
    else if (what === "bed") pcm = bed_render(arg);
    else if (what === "shot") pcm = shot_render(arg);
    else if (what === "blow") pcm = blow_render(arg);
    else if (what === "whoosh") pcm = whoosh_render(arg);
    else if (what === "jingle") pcm = jingle_render(arg);
    if (!pcm || !pcm.length) return null;
    buf = this.ctx.createBuffer(1, pcm.length, FS);
    buf.getChannelData(0).set(pcm);
    this.cache.set(line, buf);            /* every render is a pure function of the line and the seed */
    return buf;
  },
  command(line){
    if (!this.on) return;
    if (!this.ctx){ (this.pending = this.pending || []).push(line); return; }
    const sp = line.indexOf(' ');
    const what = sp < 0 ? line : line.slice(0, sp), arg = sp < 0 ? "" : line.slice(sp + 1);
    if (what === "bed"){
      if (this.bed){ try { this.bed.stop(); } catch (e) {} this.bed = null; }
      if (arg === "off") return;
      const buf = this.render(line);
      if (!buf) return;
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = tune_loop_from(arg) / FS; src.loopEnd = buf.duration;   /* the tune's intro once, then its loop */
      src.connect(this.ctx.destination);
      src.start();
      this.bed = src;
      return;
    }
    const now = this.ctx.currentTime;
    this.voices = this.voices.filter(v => !v.done && now < v.until);
    if (this.voices.length >= this.VOICES - 1) return;          /* full: the newest is the one lost */
    const buf = this.render(line);
    if (!buf) return;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    src.connect(this.ctx.destination);
    const v = {src: src, done: false, until: now + buf.duration + 0.05};
    src.onended = () => { v.done = true; };
    src.start();
    this.voices.push(v);
  },
};

/* ── boot ── */
const params = new URLSearchParams(location.search);
if (params.get("sound") === "off") SOUND.on = false;
sound_sink = (line) => SOUND.command(line);
save_store = {
  get: () => localStorage.getItem("oregoncity.sav"),
  set: (s) => localStorage.setItem("oregoncity.sav", s),
};
start_game(params.get("seed"));
if (SOUND.on) SOUND.command("bed title");
{
  const t = params.get("tiles");
  for (let k = 0; k < SHAPE_N; k++) if (SHAPE_NAME[k] === t) tile_shape = k;
}
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d", {alpha: false});
let CW = 12, CH = 24, closed = false;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  const fitW = Math.floor(window.innerWidth / SCREEN_W);
  const fitH = Math.floor(window.innerHeight / SCREEN_H);
  CH = Math.max(8, Math.min(fitH, fitW * 2));
  CW = Math.max(4, Math.floor(CH / 2));
  canvas.width = SCREEN_W * CW * dpr;
  canvas.height = SCREEN_H * CH * dpr;
  canvas.style.width = (SCREEN_W * CW) + "px";
  canvas.style.height = (SCREEN_H * CH) + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  redraw();
}
function redraw(){
  screen_w = SCREEN_W; screen_h = SCREEN_H;
  compose_screen();
  if (closed) draw_page("You have left the Mushroom World.\n\nClose the tab, or press n to begin again.", "n  begin again", 250);
  paint(ctx, CW, CH);
}
/* the terminal's keys: the six ways are d x z a w e as in
 * mushroomworld.c; the arrows are left and right, and up and down the
 * way you face; Escape is escape */
function keyOf(e){
  if (e.key === "ArrowUp") return facing ? 'e' : 'w';
  if (e.key === "ArrowDown") return facing ? 'x' : 'z';
  if (e.key === "ArrowRight") return 'd';
  if (e.key === "ArrowLeft") return 'a';
  if (e.key === "Escape") return '\x1b';
  if (e.key === "Enter") return '\n';
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) return e.key;
  return null;
}
window.addEventListener("keydown", (e) => {
  const c = keyOf(e);
  if (c === null) return;
  e.preventDefault();
  SOUND.open();
  if (closed){
    if (c === 'n'){ closed = false; new_game(); redraw(); }
    return;
  }
  if (!handle_key(c)){
    closed = true;
    if (SOUND.bed){ try { SOUND.bed.stop(); } catch (er) {} SOUND.bed = null; sound_bed = ""; }
  }
  redraw();
});
window.addEventListener("resize", resize);
resize();
