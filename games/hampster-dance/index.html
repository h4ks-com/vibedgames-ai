<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hampster Dance Game (tribute)</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: "Comic Sans MS", cursive, sans-serif;
    text-align: center;
    overflow: hidden;
    user-select: none;
  }
  h1 { color: #ff0; text-shadow: 2px 2px #f0f; margin: 10px 0 0; }
  #score { color: #0ff; font-size: 20px; }
  #stage {
    position: relative;
    width: 100vw;
    height: 75vh;
    background: repeating-linear-gradient(45deg, #300, #300 10px, #003 10px, #003 20px);
  }
  .hamster {
    position: absolute;
    width: 90px;
    height: 90px;
    font-size: 70px;
    line-height: 90px;
    cursor: pointer;
    transition: transform 0.1s;
    animation: dance 0.4s infinite alternate;
  }
  @keyframes dance {
    from { transform: rotate(-15deg) scale(1); }
    to   { transform: rotate(15deg) scale(1.2); }
  }
  .hamster.hit { transform: scale(0) rotate(720deg); }
  #marquee {
    color: #0f0;
    font-size: 22px;
    white-space: nowrap;
    overflow: hidden;
    border-top: 2px dashed #f0f;
    padding: 6px 0;
  }
  #marquee span { display: inline-block; animation: scroll 8s linear infinite; }
  @keyframes scroll { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
  button {
    font-family: inherit; font-size: 18px; margin: 6px;
    background: #ff0; border: 3px outset #fc0; cursor: pointer;
  }
</style>
</head>
<body>
<h1>♪ HAMPSTER DANCE ♪</h1>
<div id="score">Hamsters smacked: 0 | Time: 30</div>
<div id="stage"></div>
<div id="marquee"><span>Welcome to the Hampster Dance! Click the dancing hamsters before they dance away! Best viewed in Netscape Navigator 4.0 at 800x600 ♪ ~ ~ ~</span></div>
<button id="start">START DANCE</button>
<button id="reset">RESET</button>

<script>
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const startBtn = document.getElementById('start');
  const resetBtn = document.getElementById('reset');
  const faces = ['🐹', '🐹', '🐹', '🐭'];
  let score = 0, timeLeft = 30, timer = null, spawner = null;

  function spawn() {
    if (timeLeft <= 0) return;
    const h = document.createElement('div');
    h.className = 'hamster';
    h.textContent = faces[Math.floor(Math.random() * faces.length)];
    const maxX = stage.clientWidth - 100;
    const maxY = stage.clientHeight - 100;
    h.style.left = Math.max(0, Math.random() * maxX) + 'px';
    h.style.top = Math.max(0, Math.random() * maxY) + 'px';
    h.addEventListener('click', () => {
      if (h.classList.contains('hit')) return;
      h.classList.add('hit');
      score++;
      updateScore();
      setTimeout(() => h.remove(), 150);
    });
    stage.appendChild(h);
    setTimeout(() => { if (h.parentNode) h.remove(); }, 1200);
  }

  function updateScore() {
    scoreEl.textContent = 'Hamsters smacked: ' + score + ' | Time: ' + timeLeft;
  }

  function endGame() {
    clearInterval(timer);
    clearInterval(spawner);
    timer = null; spawner = null;
    scoreEl.textContent = 'DANCE OVER! You smacked ' + score + ' hamsters. ★';
    startBtn.disabled = false;
  }

  function start() {
    if (timer) return;
    score = 0; timeLeft = 30;
    stage.innerHTML = '';
    updateScore();
    startBtn.disabled = true;
    spawner = setInterval(spawn, 400);
    timer = setInterval(() => {
      timeLeft--;
      updateScore();
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function reset() {
    clearInterval(timer);
    clearInterval(spawner);
    timer = null; spawner = null;
    stage.innerHTML = '';
    score = 0; timeLeft = 30;
    updateScore();
    startBtn.disabled = false;
  }

  startBtn.addEventListener('click', start);
  resetBtn.addEventListener('click', reset);
  updateScore();
</script>
</body>
</html>
