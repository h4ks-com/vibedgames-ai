<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ShellTyper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0c0c0c; --fg:#00ff00; --muted:#006400; --accent:#00ff00; --accent2:#00cc00;
  --gold:#ffcc00; --panel:#1a1a1a; --border:#333; --green:#00ff00; --red:#ff4444;
  --blue:#44aaff; --cyan:#00ffff; --magenta:#ff00ff; --yellow:#ffff00; --white:#ffffff;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Courier New',Consolas,monospace;}
body{display:flex;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;}

/* Terminal area */
#terminal{
  flex:1;height:100vh;overflow-y:auto;padding:12px;
  font-size:14px;line-height:1.6;color:var(--fg);cursor:textext;
  position:relative;
}
#terminalOutput{white-space:pre-wrap;word-break:break-word;}
.line{margin-bottom:2px;}
.input-line{display:flex;align-items:center;gap:0;}
.prompt{color:var(--green);font-weight:bold;white-space:nowrap;}
.prompt .user{color:var(--green);}
.prompt .at{color:var(--muted);}
.prompt .host{color:var(--blue);}
.prompt .colon{color:var(--muted);}
.prompt .path{color:var(--cyan);}
.prompt .dollar{color:var(--yellow);}
#cmdInput{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--fg);font-family:inherit;font-size:inherit;
  caret-color:var(--fg);
}
.cursor-blink{animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

/* Boot text */
.boot-line{color:var(--muted);}
.boot-ok{color:var(--green);}
.boot-warn{color:var(--yellow);}

/* Sidebar */
#sidebar{
  width:320px;min-width:320px;height:100vh;background:var(--panel);
  border-left:1px solid var(--border);display:flex;flex-direction:column;
  overflow:hidden;
}
#sidebarHeader{
  padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
#sidebarHeader .title{font-size:14px;font-weight:bold;color:var(--accent);}
.stats-row{
  display:flex;justify-content:space-between;padding:3px 14px;
  font-size:12px;
}
.stats-row .label{color:var(--muted);}
.stats-row .val{color:var(--fg);font-weight:bold;}
#sidebarStats{padding:8px 0;border-bottom:1px solid var(--border);}

/* Combo bar */
#comboBar{
  margin:8px 14px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;
}
#comboFill{
  height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));
  border-radius:3px;transition:width 0.2s;width:0%;
}
#wpmBar{margin:4px 14px 8px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
#wpmFill{height:100%;background:var(--blue);border-radius:2px;transition:width 0.3s;width:0%;}

/* Tabs */
#sidebarTabs{display:flex;border-bottom:1px solid var(--border);}
.sidebarTab{
  flex:1;padding:8px;text-align:center;cursor:pointer;font-size:12px;
  color:var(--muted);border-bottom:2px solid transparent;transition:all 0.2s;
  background:none;border-top:none;border-left:none;border-right:none;
  font-family:inherit;
}
.sidebarTab.active{color:var(--accent);border-bottom-color:var(--accent);}
.sidebarTab:hover{color:var(--fg);}

/* Content scroll */
#sidebarScroll{flex:1;overflow-y:auto;padding:8px;}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* Upgrade items */
.upgrade{
  padding:8px 10px;margin-bottom:6px;border:1px solid var(--border);
  border-radius:6px;cursor:pointer;transition:all 0.15s;
  background:rgba(0,255,0,0.02);
}
.upgrade:hover{border-color:var(--accent);background:rgba(0,255,0,0.08);}
.upgrade.affordable{border-color:var(--green);}
.upgrade.locked{opacity:0.4;cursor:not-allowed;}
.upgr-name{font-size:13px;font-weight:bold;color:var(--fg);}
.upgr-desc{font-size:11px;color:var(--muted);margin-top:2px;}
.upgr-cost{font-size:12px;color:var(--gold);margin-top:3px;}
.upgr-count{font-size:11px;color:var(--accent);float:right;}
.upgr-progress{
  margin-top:4px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;
}
.upgr-progress-fill{height:100%;background:var(--green);transition:width 0.3s;}

/* Achievements */
.achItem{padding:6px 10px;margin-bottom:4px;border-radius:6px;font-size:12px;}
.achItem.unlocked{background:rgba(255,204,0,0.1);}
.achItem.locked{opacity:0.35;}
.achName{font-weight:bold;color:var(--fg);}
.achDesc{color:var(--muted);font-size:11px;}

/* Floating gains */
.float-gain{
  position:fixed;color:var(--gold);font-size:14px;font-weight:bold;
  pointer-events:none;z-index:100;animation:floatUp 1.5s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0);}
  100%{opacity:0;transform:translateY(-40px);}
}

/* Particles */
.particle{
  position:fixed;width:4px;height:4px;border-radius:50%;
  pointer-events:none;z-index:99;
}

/* Achievement popup */
.ach-popup{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--panel);border:2px solid var(--gold);border-radius:12px;
  padding:20px 40px;z-index:9999;text-align:center;
  box-shadow:0 0 40px rgba(255,204,0,0.5);
  animation:achPop 3s ease forwards;
}
@keyframes achPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}
  10%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  80%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-60%) scale(1);}
}

/* Mobile */
#mobileInput{
  position:fixed;top:-100px;left:-100px;width:1px;height:1px;
  opacity:0;border:none;outline:none;font-size:16px;
}
@media(max-width:768px){
  body{flex-direction:column;}
  #terminal{height:50vh;flex:none;}
  #sidebar{width:100%;min-width:0;height:50vh;border-left:none;border-top:1px solid var(--border);}
}
</style>
</head>
<body>

<!-- Terminal -->
<div id="terminal">
  <div id="terminalOutput"></div>
  <div class="input-line">
    <span class="prompt" id="promptText">
      <span class="user">user</span><span class="at">@</span><span class="host">shelltyper</span><span class="colon">:</span><span class="path">~</span><span class="dollar">$</span>
    </span>
    <input type="text" id="cmdInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  </div>
</div>

<!-- Hidden mobile input -->
<input type="text" id="mobileInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebarHeader">
    <span class="title">⌨️ ShellTyper</span>
    <span style="font-size:11px;color:var(--muted);" id="sessionTime">0m</span>
  </div>
  <div id="sidebarStats">
    <div class="stats-row"><span class="label">Credits</span><span class="val" style="color:var(--gold);" id="credits">0</span></div>
    <div class="stats-row"><span class="label">Per Key</span><span class="val" id="perKey">1</span></div>
    <div class="stats-row"><span class="label">Per Sec</span><span class="val" id="perSec">0</span></div>
    <div class="stats-row"><span class="label">Total Keys</span><span class="val" id="totalKeys">0</span></div>
    <div class="stats-row"><span class="label">Commands Run</span><span class="val" id="cmdCount">0</span></div>
    <div class="stats-row"><span class="label">Combo</span><span class="val" style="color:var(--accent);" id="combo">×1.0</span></div>
    <div class="stats-row"><span class="label">WPM</span><span class="val" style="color:var(--blue);" id="wpm">0</span></div>
    <div id="comboBar"><div id="comboFill"></div></div>
    <div id="wpmBar"><div id="wpmFill"></div></div>
  </div>
  <div id="sidebarTabs">
    <button class="sidebarTab active" data-tab="shop">⬆ Upgrades</button>
    <button class="sidebarTab" data-tab="ach">🏆 Achievements</button>
    <button class="sidebarTab" data-tab="fs">📁 Files</button>
  </div>
  <div id="sidebarScroll">
    <div class="tab-content active" id="shopContent"></div>
    <div class="tab-content" id="achContent"></div>
    <div class="tab-content" id="fsContent"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════
const state = {
  credits:0, totalKeys:0, perKey:1, perSec:0,
  combo:1, comboTimer:0, comboMax:1.0, comboDecay:2.5,
  lastKeyTime:0, recentKeys:[], upgrades:{}, achievements:{},
  startTime:Date.now(), totalEarned:0, cmdCount:0,
  cwd:'~', cwdPath:['~'],
  fs:{
    '~':{
      'readme.txt':{'type':'file','content':'Welcome to ShellTyper!\nEvery keystroke earns you credits.\nType commands, explore, and upgrade your shell.\nTry: help, ls, cat, neofetch, sudo'},
      'notes.md':{'type':'file','content':'# My Notes\n\n- Type fast for combo bonuses\n- Buy upgrades to earn more\n- Every command counts'},
      '.secret':{'type':'file','content':'You found a secret file! +1000 bonus credits!\n...just kidding, the bonus is the journey.'},
      'projects':{'type':'dir'},
    }
  },
  history:[], historyIdx:-1,
  mobileInputVal:'',
};

// ═══════════════════════════════════════
// UPGRADES
// ═══════════════════════════════════════
const UPGRADES = [
  {id:'better_keys',name:'Better Keys',desc:'+1 credit per keystroke',baseCost:15,costMult:1.15,effect:{perKey:1}},
  {id:'auto_exec',name:'Auto-Executor',desc:'Auto-types 1 key/sec',baseCost:50,costMult:1.18,effect:{perSec:1}},
  {id:'alias_pro',name:'Alias Pro',desc:'+5 per keystroke',baseCost:200,costMult:1.2,effect:{perKey:5}},
  {id:'cron_job',name:'Cron Job',desc:'+10 auto-keys/sec',baseCost:500,costMult:1.2,effect:{perSec:10}},
  {id:'tmux',name:'Tmux Multiplier',desc:'Combo lasts 0.3s longer',baseCost:300,costMult:1.5,effect:{comboDecayAdd:0.3}},
  {id:'bash_rc',name:'Bash RC Tweaks',desc:'+50 per keystroke',baseCost:2000,costMult:1.25,effect:{perKey:50}},
  {id:'systemd',name:'Systemd Service',desc:'+100 auto-keys/sec',baseCost:5000,costMult:1.25,effect:{perSec:100}},
  {id:'kernel_mod',name:'Kernel Module',desc:'+500 per keystroke',baseCost:20000,costMult:1.3,effect:{perKey:500}},
  {id:'docker_swarm',name:'Docker Swarm',desc:'+1000 auto-keys/sec',baseCost:50000,costMult:1.3,effect:{perSec:1000}},
  {id:'root_access',name:'Root Access',desc:'All earnings ×2',baseCost:100000,costMult:3,effect:{mult:2}},
  {id:'quantum_shell',name:'Quantum Shell',desc:'+10000 per keystroke',baseCost:500000,costMult:1.4,effect:{perKey:10000}},
  {id:'singularity',name:'Singularity Process',desc:'+50000 auto-keys/sec',baseCost:1000000,costMult:1.4,effect:{perSec:50000}},
];

// ═══════════════════════════════════════
// ACHIEVEMENTS
// ═══════════════════════════════════════
const ACHIEVEMENTS = [
  {id:'first_key',name:'Hello, World',desc:'Press your first key',check:s=>s.totalKeys>=1},
  {id:'hundred',name:'Getting Started',desc:'Press 100 keys',check:s=>s.totalKeys>=100},
  {id:'thousand',name:'Power User',desc:'Press 1,000 keys',check:s=>s.totalKeys>=1000},
  {id:'tenk',name:'Keyboard Warrior',desc:'Press 10,000 keys',check:s=>s.totalKeys>=10000},
  {id:'first_cmd',name:'Command Line',desc:'Run your first command',check:s=>s.cmdCount>=1},
  {id:'ten_cmds',name:'Script Kiddie',desc:'Run 10 commands',check:s=>s.cmdCount>=10},
  {id:'fifty_cmds',name:'Sysadmin',desc:'Run 50 commands',check:s=>s.cmdCount>=50},
  {id:'hundred_cmds',name:'Shell Master',desc:'Run 100 commands',check:s=>s.cmdCount>=100},
  {id:'combo_5',name:'On a Roll',desc:'Reach ×5 combo',check:s=>s.comboMax>=5},
  {id:'combo_10',name:'In the Zone',desc:'Reach ×10 combo',check:s=>s.comboMax>=10},
  {id:'combo_25',name:'Flow State',desc:'Reach ×25 combo',check:s=>s.comboMax>=25},
  {id:'combo_50',name:'Inhuman',desc:'Reach ×50 combo',check:s=>s.comboMax>=50},
  {id:'rich',name:'First Grand',desc:'Earn 1,000 credits total',check:s=>s.totalEarned>=1000},
  {id:'richer',name:'Six Figures',desc:'Earn 100,000 credits total',check:s=>s.totalEarned>=100000},
  {id:'millionaire',name:'Millionaire',desc:'Earn 1,000,000 credits total',check:s=>s.totalEarned>=1000000},
  {id:'wpm_40',name:'Touch Typist',desc:'Hit 40 WPM',check:s=>calcWPM()>=40},
  {id:'wpm_80',name:'Speed Demon',desc:'Hit 80 WPM',check:s=>calcWPM()>=80},
  {id:'wpm_100',name:'Inhuman Speed',desc:'Hit 100 WPM',check:s=>calcWPM()>=100},
];

// ═══════════════════════════════════════
// STATS
// ═══════════════════════════════════════
function recalcStats(){
  state.perKey=1; state.perSec=0; state.comboDecay=2.5;
  let mult=1;
  for(const u of UPGRADES){
    const count=state.upgrades[u.id]||0;
    if(count>0&&u.effect){
      if(u.effect.perKey)state.perKey+=u.effect.perKey*count;
      if(u.effect.perSec)state.perSec+=u.effect.perSec*count;
      if(u.effect.mult)mult*=Math.pow(u.effect.mult,count);
      if(u.effect.comboDecayAdd)state.comboDecay+=u.effect.comboDecayAdd*count;
    }
  }
  state.perKey*=mult; state.perSec*=mult;
}

function upgradeCost(u){
  const count=state.upgrades[u.id]||0;
  return Math.floor(u.baseCost*Math.pow(u.costMult,count));
}

function buyUpgrade(u){
  const cost=upgradeCost(u);
  if(state.credits<cost)return false;
  state.credits-=cost;
  state.upgrades[u.id]=(state.upgrades[u.id]||0)+1;
  recalcStats();
  return true;
}

function calcWPM(){
  const now=Date.now();
  const recent=state.recentKeys.filter(t=>now-t<60000);
  return Math.round(recent.length/5);
}

function fmtNum(n){
  if(n>=1e9)return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return Math.floor(n).toString();
}

// ═══════════════════════════════════════
// KEYSTROKE HANDLING
// ═══════════════════════════════════════
const terminal=document.getElementById('terminal');
const terminalOutput=document.getElementById('terminalOutput');
const cmdInput=document.getElementById('cmdInput');
const mobileInput=document.getElementById('mobileInput');

function processChar(char){
  const now=Date.now();
  if(now-state.lastKeyTime<2000){
    state.combo=Math.min(state.combo+0.05,50);
  } else {
    state.combo=1;
  }
  state.comboMax=Math.max(state.comboMax,state.combo);
  state.comboTimer=state.comboDecay;
  state.lastKeyTime=now;
  state.recentKeys.push(now);
  state.recentKeys=state.recentKeys.filter(t=>now-t<60000);

  const earn=state.perKey*state.combo;
  state.credits+=earn;
  state.totalEarned+=earn;
  state.totalKeys++;

  showFloatGain(earn);
  spawnParticles();
}

// Desktop typing in the command input
cmdInput.addEventListener('keydown',(e)=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Enter'){
    const cmd=cmdInput.value;
    state.history.push(cmd);
    state.historyIdx=state.history.length;
    runCommand(cmd);
    cmdInput.value='';
    e.preventDefault();
    return;
  }
  if(e.key==='ArrowUp'){
    e.preventDefault();
    if(state.historyIdx>0){
      state.historyIdx--;
      cmdInput.value=state.history[state.historyIdx]||'';
    }
    return;
  }
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(state.historyIdx<state.history.length-1){
      state.historyIdx++;
      cmdInput.value=state.history[state.historyIdx]||'';
    } else {
      state.historyIdx=state.history.length;
      cmdInput.value='';
    }
    return;
  }
  if(e.key==='Tab'){
    e.preventDefault();
    tabComplete();
    return;
  }
  if(e.key.length===1){
    processChar(e.key);
  }
});

cmdInput.addEventListener('input',(e)=>{
  // Handle mobile input events
  const val=cmdInput.value;
  if(val.length>state.mobileInputVal.length){
    const newChars=val.slice(state.mobileInputVal.length);
    for(const ch of newChars){
      if(ch.length===1)processChar(ch);
    }
  }
  state.mobileInputVal=val;
});

// Mobile input handler
mobileInput.addEventListener('input',(e)=>{
  const val=mobileInput.value;
  if(val.length>state.mobileInputVal.length){
    const newChars=val.slice(state.mobileInputVal.length);
    for(const ch of newChars){
      if(ch.length===1)processChar(ch);
    }
  }
  if(val.length>50){
    cmdInput.focus();
    mobileInput.value='';
    state.mobileInputVal='';
  } else {
    state.mobileInputVal=val;
  }
  mobileInput.focus();
});

mobileInput.addEventListener('keydown',(e)=>{
  if(e.key==='Enter'){
    e.preventDefault();
    processChar('\n');
    mobileInput.value='';
    state.mobileInputVal='';
  }
});

// Tap to focus
terminal.addEventListener('click',(e)=>{
  if(e.target.tagName==='BUTTON'||e.target.tagName==='SELECT')return;
  cmdInput.focus();
});
terminal.addEventListener('touchstart',(e)=>{
  if(e.target.tagName==='BUTTON'||e.target.tagName==='SELECT')return;
  setTimeout(()=>{cmdInput.focus();mobileInput.focus();},100);
},{passive:true});

// ═══════════════════════════════════════
// SHELL COMMANDS
// ═══════════════════════════════════════
function runCommand(rawCmd){
  const cmd=rawCmd.trim();
  state.cmdCount++;
  printLine(`<span class="prompt"><span style="color:var(--green)">user</span><span style="color:var(--muted)">@</span><span style="color:var(--blue)">shelltyper</span><span style="color:var(--muted)">:</span><span style="color:var(--cyan)">${state.cwd}</span><span style="color:var(--yellow)">$</span></span> ${escapeHtml(cmd)}`);

  if(!cmd)return;

  const parts=cmd.split(/\s+/);
  const bin=parts[0];
  const args=parts.slice(1);

  const commands={
    help:()=>`
Available commands:
  help        Show this help
  ls [path]   List directory contents
  cd <path>   Change directory
  pwd         Print working directory
  cat <file>  Display file contents
  echo <txt>  Print text
  mkdir <dir> Create directory
  touch <file>Create empty file
  rm <file>   Remove file
  neofetch    System info
  whoami      Print current user
  date        Show current date/time
  uname       System information
  clear       Clear terminal
  history     Show command history
  stats       Show your typing stats
  credits     Show credit balance
  shop        Open upgrade shop
  ascii       Show ASCII art
  fortune     Random fortune
  sudo <cmd>  Run as root (adds bonus credits)
  vim         Launch fake vim (just kidding)
  exit        Close terminal (just kidding)
  cowsay <txt>ASCII cow says something
`,
    ls:()=>{
      const dir=getDirFromPath(args[0]||'.');
      if(!dir)return printLine('ls: cannot access \''+(args[0]||'.')+'\'', 'var(--red)');
      const items=Object.entries(dir).sort((a,b)=>{
        const ad=a[1].type==='dir'?0:1, bd=b[1].type==='dir'?0:1;
        if(ad!==bd)return ad-bd;
        return a[0].localeCompare(b[0]);
      });
      if(items.length===0)return printLine('');
      let line='';
      for(const[name,info]of items){
        const isDir=info.type==='dir';
        const hidden=name.startsWith('.');
        const color=isDir?'var(--blue)':hidden?'var(--muted)':'var(--fg)';
        const suffix=isDir?'/':'';
        line+=`<span style="color:${color}">${name}${suffix}</span>  `;
      }
      printLine(line.trim());
    },
    cd:()=>{
      const target=args[0]||'~';
      if(target==='~'||target==='/'){
        state.cwd='~'; state.cwdPath=['~'];
        updatePrompt();
        return;
      }
      if(target==='..'){
        if(state.cwdPath.length>1)state.cwdPath.pop();
        state.cwd=state.cwdPath.join('/');
        if(state.cwd==='~')state.cwd='~';
        updatePrompt();
        return;
      }
      const dir=getDirFromPath(target);
      if(!dir||dir.type==='file')return printLine('cd: no such directory: '+target,'var(--red)');
      state.cwdPath.push(target);
      state.cwd=state.cwdPath.join('/');
      updatePrompt();
    },
    pwd:()=>printLine('/home/user'+(state.cwd!=='~'?'/'+state.cwdPath.slice(1).join('/'):'')),
    cat:()=>{
      if(!args[0])return printLine('cat: missing operand','var(--red)');
      const dir=getCurrentDir();
      if(!dir||!dir[args[0]])return printLine('cat: '+args[0]+': No such file or directory','var(--red)');
      if(dir[args[0]].type==='dir')return printLine('cat: '+args[0]+': Is a directory','var(--red)');
      printLine(escapeHtml(dir[args[0]].content||'(empty)'));
    },
    echo:()=>printLine(args.join(' ')),
    mkdir:()=>{
      if(!args[0])return printLine('mkdir: missing operand','var(--red)');
      const dir=getCurrentDir();
      if(!dir)return;
      if(dir[args[0]])return printLine('mkdir: cannot create directory \''+args[0]+'\': File exists','var(--red)');
      dir[args[0]]={type:'dir'};
      printLine('','var(--green)');
    },
    touch:()=>{
      if(!args[0])return printLine('touch: missing operand','var(--red)');
      const dir=getCurrentDir();
      if(!dir)return;
      if(!dir[args[0]])dir[args[0]]={type:'file',content:''};
    },
    rm:()=>{
      if(!args[0])return printLine('rm: missing operand','var(--red)');
      const dir=getCurrentDir();
      if(!dir||!dir[args[0]])return printLine('rm: cannot remove \''+args[0]+'\': No such file or directory','var(--red)');
      if(args.includes('-rf')||args.includes('-r')){
        delete dir[args[0]];

function tabComplete(){
  const val=cmdInput.value;
  const parts=val.split(/\s+/);
  if(parts.length<=1){
    const prefix=parts[0];
    const cmds=['help','ls','cd','pwd','cat','echo','mkdir','touch','rm','neofetch','whoami','date','uname','clear','history','stats','credits','shop','ascii','fortune','sudo','vim','cowsay','exit'];
    const matches=cmds.filter(c=>c.startsWith(prefix));
    if(matches.length===1){
      cmdInput.value=matches[0]+' ';
      state.mobileInputVal=cmdInput.value;
    } else if(matches.length>1){
      printLine(matches.join('  '));
    }
  } else {
    const dir=getCurrentDir();
    if(dir){
      const prefix=parts[parts.length-1];
      const matches=Object.keys(dir).filter(k=>k.startsWith(prefix));
      if(matches.length===1){
        parts[parts.length-1]=matches[0];
        cmdInput.value=parts.join(' ')+' ';
        state.mobileInputVal=cmdInput.value;
      }
    }
  }
}

function getCurrentDir(){
  let d=state.fs['~'];
  for(let i=1;i<state.cwdPath.length;i++){
    if(d&&d[state.cwdPath[i]]&&d[state.cwdPath[i]].type==='dir'){
      d=d[state.cwdPath[i]];
    } else return null;
  }
  return d;
}

function getDirFromPath(path){
  if(!path||path==='.')return getCurrentDir();
  if(path==='~'||path==='/')return state.fs['~'];
  let d=getCurrentDir();
  for(const p of path.split('/')){
    if(p==='.'||p==='')continue;
    if(p==='..'){continue;}
    if(d&&d[p]&&d[p].type==='dir'){d=d[p];}
    else return null;
  }
  return d;
}

function updatePrompt(){
  const prompt=document.getElementById('promptText');
  prompt.innerHTML=`<span class="user">user</span><span class="at">@</span><span class="host">shelltyper</span><span class="colon">:</span><span class="path">${escapeHtml(state.cwd)}</span><span class="dollar">$</span>`;
}

// ═══════════════════════════════════════
// TERMINAL OUTPUT
// ═══════════════════════════════════════
function printLine(text,color){
  const div=document.createElement('div');
  div.className='line';
  if(color)div.style.color=color;
  div.innerHTML=text;
  terminalOutput.appendChild(div);
  scrollToBottom();
}

function printHTML(html){
  const div=document.createElement('div');
  div.className='line';
  div.innerHTML=html;
  terminalOutput.appendChild(div);
  scrollToBottom();
}

function scrollToBottom(){
  terminal.scrollTop=terminal.scrollHeight;
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════
// UI RENDER
// ═══════════════════════════════════════
function updateUI(){
  document.getElementById('credits').textContent=fmtNum(state.credits);
  document.getElementById('perKey').textContent=fmtNum(state.perKey);
  document.getElementById('perSec').textContent=fmtNum(state.perSec);
  document.getElementById('totalKeys').textContent=fmtNum(state.totalKeys);
  document.getElementById('cmdCount').textContent=state.cmdCount;
  document.getElementById('combo').textContent='×'+state.combo.toFixed(1);
  document.getElementById('wpm').textContent=calcWPM();
  document.getElementById('comboFill').style.width=Math.min(state.combo/50*100,100)+'%';
  document.getElementById('wpmFill').style.width=Math.min(calcWPM()/100*100,100)+'%';
  const mins=Math.floor((Date.now()-state.startTime)/60000);
  document.getElementById('sessionTime').textContent=mins+'m';
}

function renderShop(){
  const c=document.getElementById('shopContent');
  c.innerHTML='<div style="font-size:12px;color:var(--muted);padding:4px 0 8px;">Click to buy upgrades</div>';
  for(const u of UPGRADES){
    const cost=upgradeCost(u);
    const count=state.upgrades[u.id]||0;
    const affordable=state.credits>=cost;
    const div=document.createElement('div');
    div.className='upgrade'+(affordable?' affordable':'');
    const progress=Math.min(state.credits/cost*100,100);
    div.innerHTML=`
      <div class="upgr-name">${u.name} <span class="upgr-count">×${count}</span></div>
      <div class="upgr-desc">${u.desc}</div>
      <div class="upgr-cost">${fmtNum(cost)} credits</div>
      <div class="upgr-progress"><div class="upgr-progress-fill" style="width:${progress}%"></div></div>`;
    div.onclick=()=>{
      if(buyUpgrade(u)){
        renderShop();
        showFloatGain(0,'+1 '+u.name,'var(--green)');
      }
    };
    c.appendChild(div);
  }
}

function renderAchievements(){
  const c=document.getElementById('achContent');
  const unlocked=ACHIEVEMENTS.filter(a=>state.achievements[a.id]).length;
  c.innerHTML=`<div style="font-size:12px;color:var(--muted);padding:4px 0 8px;">${unlocked}/${ACHIEVEMENTS.length} unlocked</div>`;
  for(const ach of ACHIEVEMENTS){
    const u=state.achievements[ach.id];
    const div=document.createElement('div');
    div.className='achItem '+(u?'unlocked':'locked');
    div.innerHTML=`<div class="achName">${u?'✅':'🔒'} ${ach.name}</div><div class="achDesc">${ach.desc}</div>`;
    c.appendChild(div);
  }
}

function renderFileBrowser(){
  const c=document.getElementById('fsContent');
  const dir=getCurrentDir();
  if(!dir){c.innerHTML='<div style="color:var(--muted);">No directory</div>';return;}
  c.innerHTML='<div style="font-size:12px;color:var(--muted);padding:4px 0 8px;">📁 '+escapeHtml(state.cwd)+'</div>';
  for(const[name,info]of Object.entries(dir).sort((a,b)=>{
    const ad=a[1].type==='dir'?0:1,bd=b[1].type==='dir'?0:1;
    return ad-bd||a[0].localeCompare(b[0]);
  })){
    const isDir=info.type==='dir';
    const div=document.createElement('div');
    div.style.cssText='padding:4px 8px;font-size:12px;cursor:pointer;';
    div.innerHTML=`<span style="color:${isDir?'var(--blue)':'var(--fg)'}">${isDir?'📁':'📄'}</span> ${escapeHtml(name)}${isDir?'/':''}`;
    div.onclick=()=>{
      if(isDir){
        state.cwdPath.push(name);
        state.cwd=state.cwdPath.join('/');
        updatePrompt();
        renderFileBrowser();
      }
    };
    c.appendChild(div);
  }
}

function switchTab(tab){
  document.querySelectorAll('.sidebarTab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  if(tab==='shop'){document.getElementById('shopContent').classList.add('active');renderShop();}
  if(tab==='ach'){document.getElementById('achContent').classList.add('active');renderAchievements();}
  if(tab==='fs'){document.getElementById('fsContent').classList.add('active');renderFileBrowser();}
}

document.querySelectorAll('.sidebarTab').forEach(tab=>{
  tab.onclick=()=>switchTab(tab.dataset.tab);
});

// ═══════════════════════════════════════
function showFloatGain(amount,text,color){
  const el=document.createElement('div');
  el.className='float-gain';
  el.textContent=text||('+'+fmtNum(amount));
  if(color)el.style.color=color;
  const rect=terminal.getBoundingClientRect();
  el.style.left=(rect.left+20+Math.random()*(rect.width-40))+'px';
  el.style.top=(rect.top+50+Math.random()*100)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1500);
}

function spawnParticles(){
  const colors=['#00ff00','#00ffff','#ffff00','#ff00ff','#00aaff'];
  for(let i=0;i<3;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.left=(Math.random()*window.innerWidth*0.6)+'px';
    p.style.top=(Math.random()*window.innerHeight*0.6)+'px';
    const dx=(Math.random()-0.5)*100;
    const dy=(Math.random()-0.5)*100-30;
    p.style.transition='all 1s ease-out';
    document.body.appendChild(p);
    requestAnimationFrame(()=>{
      p.style.transform=`translate(${dx}px,${dy}px)`;
      p.style.opacity='0';
    });
    setTimeout(()=>p.remove(),1000);
  }
}

function checkAchievements(){
  for(const ach of ACHIEVEMENTS){
    if(!state.achievements[ach.id]&&ach.check(state)){
      state.achievements[ach.id]=true;
      showAchievementPopup(ach);
    }
  }
}

function showAchievementPopup(ach){
  const el=document.createElement('div');
  el.className='ach-popup';
  el.innerHTML=`<div style="font-size:32px;margin-bottom:8px;">🏆</div><div style="font-size:18px;font-weight:bold;color:var(--gold);margin-bottom:4px;">${ach.name}</div><div style="font-size:12px;color:var(--muted);">${ach.desc}</div>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

];

function bootSequence(){
  let i=0;
  function next(){
    if(i>=bootLines.length){
      cmdInput.focus();
      mobileInput.focus();
      return;
    }
    const[line,delay]=bootLines[i];
    printHTML('<span class="boot-line">'+line+'</span>');
    i++;
    setTimeout(next,delay);
  }
  next();
}

// ═══════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════
let lastTick=Date.now();
let lastRender=0;

function gameLoop(){
  const now=Date.now();
  const dt=(now-lastTick)/1000;
  lastTick=now;

  if(state.perSec>0){
    const idleEarn=state.perSec*dt;
    state.credits+=idleEarn;
    state.totalEarned+=idleEarn;
  }

  if(state.comboTimer>0){
    state.comboTimer-=dt;
    if(state.comboTimer<=0){state.combo=1;state.comboTimer=0;}
  }

  updateUI();

  if(now-lastRender>500){
    renderShop();
    renderAchievements();
    checkAchievements();
    if(document.getElementById('fsContent').classList.contains('active')){
      renderFileBrowser();
    }
    lastRender=now;
  }
  requestAnimationFrame(gameLoop);
}
