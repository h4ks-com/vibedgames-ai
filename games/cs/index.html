<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CELL → SINGULARITY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#070b16;--card:#0e1526;--line:#1c2742;--txt:#dce6ff;--dim:#7a8bb5;--acc:#39e6a3;--acc2:#8a6bff;--idea:#ffb347;--mb:#ff5ecf}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;
background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(138,107,255,.18),transparent),radial-gradient(ellipse 60% 40% at 80% 110%,rgba(57,230,163,.08),transparent)}
#app{max-width:760px;margin:0 auto;padding:10px 12px 90px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 12px}
h1{font-size:15px;letter-spacing:3px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#stats{text-align:right;font-size:11px;color:var(--dim);line-height:1.5}
#stats b{color:var(--txt);font-size:14px}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:10px;margin-left:4px}
.pill.mb{color:var(--mb);border-color:#4a2040}
/* tap orb */
#orbWrap{text-align:center;padding:6px 0 14px;position:relative}
#orb{width:130px;height:130px;border-radius:50%;cursor:pointer;user-select:none;position:relative;z-index:2;
background:radial-gradient(circle at 35% 30%,#9fffd9,#25c98a 45%,#0a5e4a 80%);
box-shadow:0 0 40px rgba(57,230,163,.45),inset 0 0 30px rgba(255,255,255,.15);
transition:transform .08s;display:inline-flex;align-items:center;justify-content:center;font-size:52px}
#orb:active{transform:scale(.93)}
#orb .core{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.12);opacity:1}}
#tapInfo{font-size:11px;color:var(--dim);margin-top:6px}
.float{position:absolute;font-weight:800;pointer-events:none;animation:fl 1s forwards;font-size:16px;color:var(--acc);z-index:5;text-shadow:0 0 8px rgba(57,230,163,.8)}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
/* tabs */
#tabs{display:flex;gap:6px;margin:4px 0 14px}
.tab{flex:1;padding:9px 4px;text-align:center;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-weight:700;font-size:12px;cursor:pointer;letter-spacing:1px}
.tab.on{color:var(--txt);border-color:var(--acc);box-shadow:0 0 14px rgba(57,230,163,.25)}
.tab.lock{opacity:.35;pointer-events:none}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;background:var(--acc);animation:pulse 1.2s infinite;vertical-align:middle}
/* buy mode */
#buyMode{text-align:right;margin-bottom:8px}
#buyMode button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:4px 12px;font-size:11px;cursor:pointer;margin-left:4px}
#buyMode button.on{color:var(--acc);border-color:var(--acc)}
/* tree */
.spine{position:relative;padding-left:0}
.node{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 12px;display:flex;gap:12px;align-items:center;transition:border-color .3s,box-shadow .3s}
.node.avail{border-color:#2b4a3f}
.node.afford{border-color:var(--acc);box-shadow:0 0 16px rgba(57,230,163,.18)}
.node.locked{opacity:.45;filter:grayscale(.7)}
.node .icon{font-size:34px;width:48px;text-align:center;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(138,107,255,.4))}
.node .info{flex:1;min-width:0}
.node .nm{font-weight:800;font-size:14px}
.node .nm .lv{font-size:10px;color:var(--acc);margin-left:6px;font-weight:700}
.node .nm .lv.ideac{color:var(--idea)}
.node .nm .ms{font-size:9px;color:var(--acc2);margin-left:6px}
.node .op{font-size:11px;color:var(--dim);margin-top:2px}
.node .buy{flex-shrink:0;text-align:center}
.node .buy button{background:linear-gradient(135deg,#1d5c45,#123c2e);color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:8px 12px;font-weight:800;font-size:12px;cursor:pointer;min-width:86px}
.node .buy button.ideaB{color:var(--idea);border-color:var(--idea);background:linear-gradient(135deg,#5c4a1d,#3c2f12)}
.node .buy button:disabled{opacity:.35;cursor:default}
.node .buy .ct{font-size:10px;color:var(--dim);margin-top:3px}
.progress{height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--acc);transition:width .3s}
.progress.ideaP i{background:var(--idea)}
/* reality */
.up{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.up .icon{font-size:30px}
.up h3{font-size:13px;color:var(--mb)}
.up p{font-size:11px;color:var(--dim);margin-top:3px}
.up button{background:linear-gradient(135deg,#5c1d4a,#3c123a);color:var(--mb);border:1px solid var(--mb);border-radius:10px;padding:9px 14px;font-weight:800;font-size:12px;cursor:pointer}
.up button:disabled{opacity:.35;cursor:default}
#ascendBox{text-align:center;padding:18px;border:1px solid var(--mb);border-radius:16px;margin:14px 0;background:radial-gradient(circle at 50% 0,rgba(255,94,207,.12),transparent);display:none}
#ascendBox h2{color:var(--mb);font-size:16px;letter-spacing:2px}
#ascendBox p{font-size:12px;color:var(--dim);margin:8px 0}
#ascendBtn{background:linear-gradient(135deg,#8a2a70,#4d1745);color:#ffd9f2;border:none;border-radius:12px;padding:13px 30px;font-size:14px;font-weight:800;letter-spacing:2px;cursor:pointer;box-shadow:0 0 24px rgba(255,94,207,.35)}
#log{margin-top:16px;font-size:11px;color:var(--dim);line-height:1.7;border-top:1px dashed var(--line);padding-top:10px}
#log div{animation:fadein .5s}
@keyframes fadein{from{opacity:0;transform:translateX(-8px)}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(4,7,15,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal .box{background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:24px;max-width:380px;text-align:center}
#modal h2{font-size:15px;margin-bottom:10px}
#modal p{font-size:12px;color:var(--dim);line-height:1.7}
#modal button{margin-top:16px;background:linear-gradient(135deg,#1d5c45,#123c2e);color:var(--acc);border:1px solid var(--acc);border-radius:10px;padding:10px 26px;font-weight:800;cursor:pointer}
footer{text-align:center;font-size:10px;color:#3a4666;padding:20px 0;letter-spacing:1px}
</style>
</head>
<body>
<div id="app">
<header>
<h1>CELL → SINGULARITY</h1>
<div id="stats">
<b id="sEnt">0</b> <span class="pill" id="sEps">0/s</span><br>
<b id="sIdea" style="color:var(--idea)">0</b> <span class="pill" id="sIps" style="color:var(--idea);display:none">0/s</span><span id="sMbWrap"><b id="sMb" style="color:var(--mb)">0</b> <span class="pill mb" id="sMbP">MB</span></span>
</div>
</header>
<div id="orbWrap"><div id="orb"><span id="orbEmoji">🧬</span><div class="core"></div></div><div id="tapInfo">tap the cell</div></div>
<div id="tabs">
<div class="tab on" id="tabLife">LIFE</div>
<div class="tab lock" id="tabCiv">MIND</div>
<div class="tab lock" id="tabRe">REALITY</div>
</div>
<div id="buyMode">
<button data-n="1" class="on">BUY 1</button>
<button data-n="10">BUY 10</button>
<button data-n="0">MAX</button>
</div>
<div id="view"></div>
<div id="ascendBox">
<h2>⚡ THE SINGULARITY ⚡</h2>
<p>The simulation has outgrown its creators. Collapse this universe and inherit its computation as <b style="color:var(--mb)">Metabits</b>.</p>
<p id="mbGain" style="font-size:15px;color:var(--mb)"></p>
<button id="ascendBtn">COLLAPSE UNIVERSE</button>
</div>
<div id="log"></div>
<footer>A FAN-MADE IDLE RECREATION · INSPIRED BY CELL TO SINGULARITY BY COMPUTERLUNCH</footer>
</div>
<div id="modal"><div class="box"><h2 id="mTitle"></h2><p id="mBody"></p><button onclick="document.getElementById('modal').style.display='none'">CONTINUE</button></div></div>
<script>
'use strict';
/* ---------- data ---------- */
const LIFE=[
{n:'Amino Acids',e:'🧪',d:'Organic molecules self-assemble in the primordial soup',c:15,o:.15},
{n:'RNA',e:'🧬',d:'The first molecule that copies itself',c:120,o:1},
{n:'Prokaryotes',e:'🦠',d:'Simple cells divide and conquer the ocean',c:1400,o:8},
{n:'Eukaryotes',e:'🔬',d:'Cells swallow cells — complexity begins',c:16e3,o:47},
{n:'Multicellular Life',e:'🪸',d:'Cells learn to cooperate',c:2e5,o:260},
{n:'Simple Sea Life',e:'🪐',d:'Jellies drift through ancient seas',c:2.6e6,o:1400},
{n:'Complex Sea Life',e:'🐟',d:'Eyes, spines, and the first swimmers',c:3.6e7,o:7800},
{n:'Land Plants',e:'🌱',d:'Green conquest of the barren continents',c:5e8,o:44e3},
{n:'Arthropods',e:'🦂',d:'Exoskeletons scuttle ashore',c:7e9,o:26e4},
{n:'Amphibians',e:'🐸',d:'The first steps onto land',c:9e10,o:1.6e6},
{n:'Reptiles',e:'🦎',d:'Hard eggs, dry skin, empires of scale',c:1.2e12,o:1e7},
{n:'Dinosaurs',e:'🦖',d:'Thunder lizards rule for 160 million years',c:1.6e13,o:6.5e7},
{n:'Birds',e:'🦅',d:'The dinosaurs that took to the sky',c:2e14,o:4.3e8},
{n:'Mammals',e:'🐺',d:'Warm blood in the shadow of giants',c:2.6e15,o:2.9e9},
{n:'Primates',e:'🐒',d:'Hands, eyes, and restless curiosity',c:3.4e16,o:2.1e10},
{n:'Hominids',e:'🪓',d:'Upright walkers who shape stone',c:4.4e17,o:1.5e11},
{n:'Humans',e:'🧠',d:'The mind that asks why — unlocks IDEAS',c:6e18,o:1.1e12}];
const CIV=[
{n:'Fire',e:'🔥',d:'Tamed flame. Warmth, light, and cooked meals',c:100,o:.6},
{n:'Agriculture',e:'🌾',d:'Seeds and surplus. Villages take root',c:1300,o:4},
{n:'Writing',e:'📜',d:'Memory that outlives the rememberer',c:17e3,o:25},
{n:'Bronze Working',e:'⚒️',d:'Metal tools, cities, and kings',c:25e4,o:150},
{n:'Mathematics',e:'📐',d:'Numbers become a language',c:4e6,o:900},
{n:'Printing Press',e:'🖨️',d:'Ideas replicate faster than scribes',c:6e7,o:5600},
{n:'Steam Power',e:'🚂',d:'The engine that ended the muscle age',c:9e8,o:3.4e4},
{n:'Electricity',e:'⚡',d:'Lightning, bottled and wired',c:1.3e10,o:2.1e5},
{n:'Computers',e:'💻',d:'Thought at the speed of electrons',c:1.8e11,o:1.3e6},
{n:'The Internet',e:'🌐',d:'Every mind, one network',c:2.6e12,o:8e6},
{n:'Artificial Intelligence',e:'🤖',d:'Machines that learn to learn',c:3.6e13,o:5e7},
{n:'Nanotechnology',e:'⚛️',d:'Engineering at the scale of atoms',c:5e14,o:3.1e8},
{n:'Fusion Power',e:'☀️',d:'A star in a bottle',c:7e15,o:2e9},
{n:'Space Colonization',e:'🚀',d:'Life spreads beyond its cradle',c:9e16,o:1.4e10},
{n:'Dyson Swarm',e:'🛰️',d:'The sun, harvested',c:1.3e18,o:9e10},
{n:'The Singularity',e:'🕳️',d:'The simulation becomes self-aware — unlocks ASCENSION',c:2e19,o:6.5e11}];
const MS=[10,25,50,100,150,200,300,400,500];
const UPG=[
{n:'Entropy Amplifier',e:'🌡️',d:l=>`All Entropy generation ×${Math.pow(2,l+1)}. The soup boils harder.`,c:l=>2*Math.pow(4,l)},
{n:'Idea Amplifier',e:'💡',d:l=>`All Idea generation ×${Math.pow(2,l+1)}. Minds burn brighter.`,c:l=>2*Math.pow(4,l)},
{n:'Quantum Tap',e:'👆',d:l=>`Tap power ×${Math.pow(4,l+1)}. Your finger warps probability.`,c:l=>1*Math.pow(3,l)},
{n:'Stasis Field',e:'⏳',d:l=>`Offline production ${50+10*l}% (max 12h).`,c:l=>3*Math.pow(3,l),cap:5},
{n:'Big Bang',e:'💥',d:l=>l?'Start each universe with 1M Entropy & the first 4 generators.':'Restart with a head start: 1M Entropy + 4 free generators.',c:l=>10*Math.pow(10,l),cap:1}];
/* ---------- state ---------- */
const D=()=>({e:0,i:0,mb:0,g:LIFE.map(()=>0),c:CIV.map(()=>0),u:UPG.map(()=>0),
totE:0,totI:0,runE:0,runI:0,taps:0,asc:0,t:Date.now(),seen:-1});
let S=D();let buyN=1;let view='life';let eps=0,ips=0;
try{const raw=localStorage.getItem('c2s_save');if(raw){const p=JSON.parse(raw);S=Object.assign(D(),p);}}catch(e){}
/* ---------- helpers ---------- */
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc'];
function fmt(n){if(!isFinite(n))return'∞';if(n<0)return'-'+fmt(-n);if(n<1000)return n<10&&n%1!==0?n.toFixed(1):Math.floor(n)+'';
let t=Math.floor(Math.log10(n)/3);if(t>=SUF.length)return n.toExponential(2);return(n/10**(3*t)).toFixed(2)+SUF[t];}
function msMult(lv){let m=1;for(const x of MS)if(lv>=x)m*=2;return m;}
function costGen(arr,idx,st){const lv=st[idx];return arr[idx].c*Math.pow(1.15,lv);}
function outGen(arr,idx,st){return arr[idx].o*st[idx]*msMult(st[idx]);}
function entMult(){return Math.pow(2,S.u[0]);}
function ideaMult(){return Math.pow(2,S.u[1]);}
function tapMult(){return Math.pow(4,S.u[2]);}
function offMult(){return .5+.1*S.u[3];}
function civUnlocked(){return S.g[16]>0;}
function singUnlocked(){return S.c[15]>0;}
function tabDots(){return false;}
/* ---------- computation ---------- */
function calc(){eps=0;for(let k=0;k<LIFE.length;k++)if(S.g[k]>0)eps+=outGen(LIFE,k,S.g);eps*=entMult();
ips=0;if(civUnlocked()){for(let k=0;k<CIV.length;k++)if(S.c[k]>0)ips+=outGen(CIV,k,S.c);ips*=ideaMult();}}
function mbPending(){return Math.floor(Math.sqrt(S.runE/1e12))+Math.floor(Math.sqrt(S.runI/1e9));}
function maxAffordable(arr,idx,cur){let lv=(arr===LIFE?S.g:S.c)[idx];let c=arr[idx].c*Math.pow(1.15,lv);let tot=0,n=0;
while(n<500){const nx=tot+c;if(nx>cur)break;tot=nx;n++;c*=1.15;}return n||0;}
/* ---------- log ---------- */
function log(msg){const L=document.getElementById('log');const d=document.createElement('div');d.textContent=msg;L.prepend(d);while(L.children.length>7)L.removeChild(L.lastChild);}
/* ---------- tap ---------- */
const orb=document.getElementById('orb');
orb.addEventListener('pointerdown',ev=>{const gain=(1+eps*.15)*tapMult();S.e+=gain;S.totE+=gain;S.runE+=gain;S.taps++;
const w=document.getElementById('orbWrap');const f=document.createElement('div');f.className='float';f.textContent='+'+fmt(gain);
const r=orb.getBoundingClientRect();f.style.left=(r.left-10+Math.random()*60)+'px';f.style.top=(r.top+20)+'px';w.appendChild(f);setTimeout(()=>f.remove(),1000);});
/* ---------- buy ---------- */
function buy(arr,idx){const st=arr===LIFE?S.g:S.c;const cur=arr===LIFE?S.e:S.i;const lv=st[idx];
let n=buyN===0?maxAffordable(arr,idx,cur):buyN;
if(n<=0)return;let cost=0,c=arr[idx].c*Math.pow(1.15,lv);for(let k=0;k<n;k++){cost+=c;c*=1.15;}
if(cost>cur){if(buyN===0){}else{n=Math.floor(Math.log(cur/(arr[idx].c*Math.pow(1.15,lv))*0.15+1)/Math.log(1.15))||0;if(n<=0)return;cost=0;c=arr[idx].c*Math.pow(1.15,lv);for(let k=0;k<n;k++){cost+=c;c*=1.15;}if(cost>cur)return;}}
if(arr===LIFE)S.e-=cost;else S.i-=cost;const was=st[idx];st[idx]+=n;
if(arr===LIFE&&idx===S.seen+1){S.seen=idx;log(`🧬 EVOLUTION: ${arr[idx].n} emerge${idx?'':'s'}!`);}
if(arr===CIV&&was===0&&idx>0){if(idx===15){log('🕳️ THE SINGULARITY ACHIEVED — Reality tab unlocked.');}else log(`💡 ${arr[idx].n} discovered.`);}
if(arr===LIFE&&was===0&&idx===16){log('🧠 Humanity awakens — the MIND tab pulses with Ideas.');}
render();calc();save();}
/* ---------- reality ---------- */
function buyUp(u){const c=UPG[u].c(S.u[u]);if(S.mb<c)return;if(UPG[u].cap&&S.u[u]>=UPG[u].cap)return;S.mb-=c;S.u[u]++;
log('💠 Reality Engine: '+UPG[u].n+' upgraded.');render();calc();save();}
document.getElementById('ascendBtn').addEventListener('click',()=>{
const g=mbPending();if(g<=0)return;S.mb+=g;S.asc++;const runE=S.runE,runI=S.runI;
S.e=0;S.i=0;S.g=LIFE.map(()=>0);S.c=CIV.map(()=>0);S.runE=0;S.runI=0;S.seen=-1;
if(UPG[4].cap&&S.u[4]>=1){S.e=1e6;S.totE+=1e6;S.runE+=1e6;for(let k=0;k<4;k++)S.g[k]=1;S.seen=3;}
log(`⚡ UNIVERSE COLLAPSED — +${fmt(g)} Metabits from ${fmt(runE)} entropy & ${fmt(runI)} ideas.`);
showModal('SINGULARITY','The universe folds into pure computation.\n+'+fmt(g)+' Metabits now power your Reality Engine.\nEvolution begins again — faster.');
renderTabs();render();calc();save();});
/* ---------- UI ---------- */
function showModal(t,b){document.getElementById('mTitle').textContent=t;document.getElementById('mBody').textContent=b;document.getElementById('modal').style.display='flex';}
const emojiFor=()=>{const lv=S.seen;const e=['🧪','🧬','🦠','🔬','🪸','🪐','🐟','🌱','🦂','🐸','🦎','🦖','🦅','🐺','🐒','🪓','🧠'];
return lv>=0&&e[lv]?e[lv]:'🧪';};
function renderTabs(){const tC=document.getElementById('tabCiv'),tR=document.getElementById('tabRe');
tC.classList.toggle('lock',!civUnlocked());tR.classList.toggle('lock',S.mb<=0&&!singUnlocked());
document.getElementById('sIps').style.display=civUnlocked()?'inline-block':'none';
document.getElementById('sMbWrap').style.display=(S.mb>0||S.asc>0)?'inline':'none';
document.getElementById('tabLife').classList.toggle('on',view==='life');
document.getElementById('tabCiv').classList.toggle('on',view==='civ');
document.getElementById('tabRe').classList.toggle('on',view==='re');
document.getElementById('buyMode').style.display=view==='re'?'none':'block';}
function render(){/* stats */
calc();
document.getElementById('sEnt').textContent=fmt(S.e);
document.getElementById('sEps').textContent=fmt(eps)+'/s';
document.getElementById('sIdea').textContent=fmt(S.i);
document.getElementById('sIps').textContent=fmt(ips)+'/s';
document.getElementById('sMb').textContent=fmt(S.mb);
document.getElementById('orbEmoji').textContent=emojiFor();
document.getElementById('tapInfo').textContent='+'+fmt((1+eps*.15)*tapMult())+' per tap';
renderTabs();
const V=document.getElementById('view');V.innerHTML='';const box=document.getElementById('ascendBox');
if(view==='life'||view==='civ'){box.style.display='none';
const arr=view==='life'?LIFE:CIV;const st=view==='life'?S.g:S.c;const cur=view==='life'?S.e:S.i;
const wrap=document.createElement('div');wrap.className='spine';
let lastIdx=-1;for(let k=arr.length-1;k>=0;k--)if(st[k]>0){lastIdx=k;break;}
const showUpTo=Math.min(arr.length-1,lastIdx+2);
for(let k=0;k<=showUpTo;k++){const g=arr[k];const lv=st[k];const locked=lv===0&&k>(lastIdx+1)&&k>0;
const unlockedYet=lv>0;const c=costGen(arr,k,st);
let n=buyN===0?maxAffordable(arr,k,cur):buyN;if(buyN===0&&n===0)n=1;
let cost=0,cc=g.c*Math.pow(1.15,lv);for(let q=0;q<n;q++){cost+=cc;cc*=1.15;}
const afford=cur>=cost;const isIdea=view==='civ';
const node=document.createElement('div');node.className='node'+(unlockedYet?' avail':'')+(afford&&!locked?' afford':'')+(locked?' locked':'');
let msTxt='';const nextMs=MS.find(m=>m>lv);if(nextMs)msTxt=`<span class="ms">×2 @ ${nextMs}</span>`;
node.innerHTML=`<div class="icon">${g.e}</div><div class="info"><div class="nm">${g.n}${lv>0?`<span class="lv${isIdea?' ideac':''}">LV ${lv}</span>`:''}${msTxt}</div>
<div class="op">${g.d}${lv>0?` · <b>${fmt(outGen(arr,k,st)*(isIdea?ideaMult():entMult()))}</b> ${isIdea?'ideas':'entropy'}/s`:''}</div>
<div class="progress${isIdea?' ideaP':''}"><i style="width:${Math.min(100,cur/c*100)}%"></i></div></div>
