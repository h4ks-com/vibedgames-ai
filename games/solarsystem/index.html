<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#04060f">
<title>Solar System Explorer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#04060f;color:#e8edff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;z-index:1;touch-action:none}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(2,4,12,.55) 100%)}
#labels{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-150%);font:600 11px/1.2 inherit;color:#dbe3ff;text-shadow:0 1px 6px #000,0 0 3px #000;letter-spacing:.05em;white-space:nowrap;opacity:.9;will-change:left,top}
.lbl.moon{font-size:9.5px;color:#b6c1e6;opacity:.85}
#hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:5;padding:10px 14px;background:rgba(12,16,30,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(130,160,255,.14);border-radius:14px;max-width:78vw}
#hud h1{font-size:15px;font-weight:700;background:linear-gradient(90deg,#ffd98a,#8fb0ff 60%,#c9a0ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
#hud p{font-size:10.5px;color:#8fa0c8;margin-top:2px;letter-spacing:.03em}
#uiControls{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:7;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(12,16,30,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(130,160,255,.14);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.5);width:min(540px,calc(100vw - 20px))}
.cbtn{flex:none;width:38px;height:38px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#dfe6ff;font-size:15px;display:grid;place-items:center;cursor:pointer;transition:transform .1s,background .2s}
.cbtn:active{transform:scale(.92)}
.cbtn.on{background:rgba(122,162,255,.22);border-color:rgba(122,162,255,.5)}
.sl{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.sl span{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#8fa0c8}
.sl input{flex:1;accent-color:#7aa2ff;height:24px;min-width:40px}
#spdv{font-size:11px;color:#c6d2ff;width:36px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
#panel{position:fixed;left:10px;right:10px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:6;background:linear-gradient(165deg,rgba(20,26,48,.92),rgba(8,11,22,.95));backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(130,160,255,.16);border-radius:18px;padding:16px;max-height:52vh;overflow-y:auto;transform:translateY(130%);opacity:0;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s;pointer-events:none;box-shadow:0 12px 50px rgba(0,0,0,.6)}
#panel.open{transform:none;opacity:1;pointer-events:auto}
#pClose{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#c9d3f5;font-size:13px;display:grid;place-items:center;cursor:pointer}
#pHead{display:flex;align-items:center;gap:12px;padding-right:34px}
#pEmoji{font-size:32px;line-height:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
#pName{font-size:21px;font-weight:800;letter-spacing:.01em}
#pType{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#8fb0ff;margin-top:2px;font-weight:600}
#pBlurb{font-size:12.5px;line-height:1.55;color:#b9c4e2;margin:10px 0 12px}
#pStats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 10px}
.stat span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#8fa0c8;margin-bottom:3px}
.stat b{font-size:12.5px;color:#e8edff;font-weight:600}
#pMoons{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.chip{padding:7px 12px;border-radius:999px;background:rgba(122,162,255,.14);border:1px solid rgba(122,162,255,.32);color:#cdd9ff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.chip:active{transform:scale(.95)}
.chip.back{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:#04060f;transition:opacity .6s}
#splash div{font-size:14px;color:#9db0e0;letter-spacing:.14em;text-transform:uppercase;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
#splash .orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c8,#ffb43a 60%,#ff8a1f);box-shadow:0 0 40px #ffab3d99}
@media(min-width:760px){
 #panel{left:auto;top:70px;right:14px;width:352px;bottom:auto;max-height:calc(100vh - 180px);transform:translateX(40px)}
 #panel.open{transform:none}
 #hud{left:16px}
}
</style>

<body>
<div id="splash"><div class="orb"></div><div>loading the solar system…</div></div>
<div id="vig"></div>
<div id="labels"></div>

<div id="panel">
  <button id="pClose">✕</button>
  <div id="pHead"><span id="pEmoji"></span><div><h2 id="pName"></h2><div id="pType"></div></div></div>
  <p id="pBlurb"></p>
  <div id="pStats"></div>
  <div id="pMoons"></div>
</div>
<div id="uiControls">
  <button class="cbtn" id="btnPause" title="pause">⏸</button>
  <div class="sl"><span>speed</span><input id="speed" type="range" min="0" max="100" value="25"><b id="spdv">1×</b></div>
  <button class="cbtn on" id="btnLbl" title="labels">🏷</button>
  <button class="cbtn" id="btnHome" title="reset view">⟲</button>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $=q=>document.querySelector(q);
let W=innerWidth,H=innerHeight;

let renderer;
try{ renderer=new THREE.WebGLRenderer({antialias:true}); }
catch(e){ $('#splash').innerHTML='<div>WebGL not available on this device 😢</div>'; throw e; }
renderer.setSize(W,H); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04060f);
const camera=new THREE.PerspectiveCamera(55,W/H,.1,4000);
const HOME=new THREE.Vector3(0,80,165); camera.position.copy(HOME);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.07;
controls.minDistance=6;controls.maxDistance=600;controls.enablePan=false;

scene.add(new THREE.AmbientLight(0x44557a,.85));
const sunLight=new THREE.PointLight(0xfff2cf,3.2,0,0); scene.add(sunLight);

/* ---------- canvas texture helpers ---------- */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
function tex(c){const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}

function planetTex(stops,o={}){
  const [c,x]=cv(512,256);
  const g=x.createLinearGradient(0,0,0,256);
  stops.forEach((col,i)=>g.addColorStop(i/(stops.length-1),col));
  x.fillStyle=g;x.fillRect(0,0,512,256);
  const bc=o.bandColor||'#ffffff';
  for(let i=0;i<(o.bands||0);i++){
    const y0=Math.random()*256,h=4+Math.random()*18;
    x.globalAlpha=.05+Math.random()*.11;x.fillStyle=bc;x.beginPath();x.moveTo(0,y0);
    for(let px=0;px<=512;px+=16)x.lineTo(px,y0+Math.sin(px*.03+i*2)*6);
    for(let px=512;px>=0;px-=16)x.lineTo(px,y0+h+Math.sin(px*.025-i)*6);
    x.closePath();x.fill();
  }
  for(let i=0;i<(o.craters||0);i++){
    const r=2+Math.random()*7;
    x.globalAlpha=.1+Math.random()*.12;x.fillStyle='#000';
    x.beginPath();x.arc(Math.random()*512,Math.random()*256,r,0,7);x.fill();
    x.globalAlpha=.08;x.fillStyle='#fff';
    x.beginPath();x.arc(Math.random()*512,Math.random()*256,r*.5,0,7);x.fill();
  }
  for(let i=0;i<(o.speckle??600);i++){
    x.globalAlpha=.03+Math.random()*.07;
    x.fillStyle=Math.random()>.5?'#000':'#fff';
    x.beginPath();x.arc(Math.random()*512,Math.random()*256,.5+Math.random()*2.4,0,7);x.fill();
  }
  if(o.spot){
    x.globalAlpha=.85;x.fillStyle=o.spot;
    x.beginPath();x.ellipse(358,158,26,13,0,0,7);x.fill();
    x.globalAlpha=.35;x.strokeStyle='#ffd9c0';x.lineWidth=3;
    x.beginPath();x.ellipse(358,158,27,14,0,0,7);x.stroke();
  }
  if(o.caps){
    x.globalAlpha=.92;x.fillStyle='#f0f8ff';
    x.beginPath();x.ellipse(256,6,300,20,0,0,7);x.fill();
    x.beginPath();x.ellipse(256,250,300,20,0,0,7);x.fill();
  }
  x.globalAlpha=1;return tex(c);
}
function earthTex(){
  const [c,x]=cv(512,256);
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#1a4bb0');g.addColorStop(.5,'#1e56c4');g.addColorStop(1,'#123a92');
  x.fillStyle=g;x.fillRect(0,0,512,256);
  const greens=['#3d8f5a','#2f7d4a','#5a9a64','#357a52'];
  for(let i=0;i<16;i++){
    const cx0=Math.random()*512,cy0=40+Math.random()*176,n=3+Math.random()*5|0;
    x.fillStyle=greens[i%greens.length];x.globalAlpha=.95;
    for(let j=0;j<n;j++){x.beginPath();x.arc(cx0+(Math.random()-.5)*70,cy0+(Math.random()-.5)*40,8+Math.random()*22,0,7);x.fill();}
  }
  x.globalAlpha=.92;x.fillStyle='#f0f8ff';
  x.beginPath();x.ellipse(256,7,320,22,0,0,7);x.fill();
  x.beginPath();x.ellipse(256,249,320,22,0,0,7);x.fill();
  x.strokeStyle='#ffffff';x.globalAlpha=.16;x.lineWidth=5;
  for(let i=0;i<22;i++){
    const y0=Math.random()*256;x.beginPath();x.moveTo(0,y0);
    for(let px=0;px<=512;px+=24)x.lineTo(px,y0+Math.sin(px*.05+i*3)*8);
    x.stroke();
  }
  x.globalAlpha=1;return tex(c);
}
function sunTex(){
  const [c,x]=cv(512,256);
  x.fillStyle='#ffb43a';x.fillRect(0,0,512,256);
  for(let i=0;i<1400;i++){
    x.globalAlpha=.05+Math.random()*.07;
    x.fillStyle=Math.random()>.5?'#ff9a2e':'#ffe9a8';
    x.beginPath();x.arc(Math.random()*512,Math.random()*256,1+Math.random()*7,0,7);x.fill();
  }
  for(let i=0;i<40;i++){
    x.globalAlpha=.05;x.fillStyle='#e07f1f';
    x.beginPath();x.arc(Math.random()*512,Math.random()*256,10+Math.random()*22,0,7);x.fill();
  }
  x.globalAlpha=1;return tex(c);
}
function glowTex(){
  const [c,x]=cv(256,256);
  const g=x.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,244,210,1)');g.addColorStop(.22,'rgba(255,205,120,.6)');
  g.addColorStop(.5,'rgba(255,150,50,.18)');g.addColorStop(1,'rgba(255,120,30,0)');
  x.fillStyle=g;x.fillRect(0,0,256,256);return tex(c);
}
function ringTex(){
  const [c,x]=cv(512,512);
  const segs=[[70,108,.32],[108,132,.55],[132,150,.68],[150,168,.78],[168,177,0],[177,208,.85],[208,228,.5],[228,250,.18]];
  for(const [a,b,al] of segs){
    for(let r=a;r<b;r+=1.6){
      const jitter=.75+.25*Math.sin(r*.7);
      x.strokeStyle=`rgba(226,214,182,${(al*jitter).toFixed(3)})`;
      x.lineWidth=1.8;x.beginPath();x.arc(256,256,r,0,7);x.stroke();
    }
  }
  return tex(c);
}
function markerTex(){
  const [c,x]=cv(128,128);
  x.strokeStyle='rgba(150,185,255,.25)';x.lineWidth=14;
  x.beginPath();x.arc(64,64,46,0,7);x.stroke();
  x.strokeStyle='rgba(190,215,255,.95)';x.lineWidth=4;
  x.beginPath();x.arc(64,64,46,0,7);x.stroke();
  return tex(c);
}

/* ---------- starfield & belt ---------- */
function starField(n,size,op){
  const g=new THREE.BufferGeometry();
  const p=new Float32Array(n*3),cl=new Float32Array(n*3),col=new THREE.Color();
  for(let i=0;i<n;i++){
    const r=850+Math.random()*700,th=Math.acos(2*Math.random()-1),ph=Math.random()*Math.PI*2;
    p[i*3]=r*Math.sin(th)*Math.cos(ph);p[i*3+1]=r*Math.cos(th);p[i*3+2]=r*Math.sin(th)*Math.sin(ph);
    const k=Math.random();
    if(k<.68)col.setHSL(.6,.05,.9);else if(k<.85)col.setHSL(.6,.6,.85);else col.setHSL(.09,.7,.85);
    cl[i*3]=col.r;cl[i*3+1]=col.g;cl[i*3+2]=col.b;
  }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('color',new THREE.BufferAttribute(cl,3));
  return new THREE.Points(g,new THREE.PointsMaterial({size,vertexColors:true,sizeAttenuation:false,transparent:true,opacity:op,depthWrite:false}));
}
scene.add(starField(2600,1.7,.9));
scene.add(starField(220,3.4,.95));
(function belt(){
  const n=1700,g=new THREE.BufferGeometry(),p=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r=36+Math.random()*5.6,a=Math.random()*Math.PI*2,y=(Math.random()-.5)*1.8;
    p[i*3]=Math.cos(a)*r;p[i*3+1]=y;p[i*3+2]=Math.sin(a)*r;
  }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x8a8378,size:.55,transparent:true,opacity:.75,depthWrite:false})));
})();
function orbitLine(rad){
  const pts=[];
  for(let a=0;a<=Math.PI*2+.02;a+=.02)pts.push(new THREE.Vector3(Math.cos(a)*rad,0,Math.sin(a)*rad));
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x8899cc,transparent:true,opacity:.15}));
  scene.add(l);
}

/* ---------- sun ---------- */
const sunBody={id:'sun',name:'Sun',type:'☀️ G-type star',r:8,
  stats:{Diameter:'1.39M km','System mass':'99.86%','Surface temp':'5,505 °C','Core temp':'15M °C','Age':'4.6B years','Light to Earth':'8 min 20 s'},
  blurb:'The star at the heart of it all. It holds 99.86% of the solar system\u2019s mass and fuses ~600 million tons of hydrogen every second. Every world here is a rounding error in comparison.'};
const sunMesh=new THREE.Mesh(new THREE.SphereGeometry(8,48,32),new THREE.MeshBasicMaterial({map:sunTex()}));
sunMesh.userData.body=sunBody;sunBody.mesh=sunMesh;scene.add(sunMesh);
const glowT=glowTex();
const glow1=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0xffc873,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false}));
glow1.scale.setScalar(48);sunMesh.add(glow1);
const glow2=new THREE.Sprite(new THREE.SpriteMaterial({map:glowT,color:0xfff3d0,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}));
glow2.scale.setScalar(26);sunMesh.add(glow2);

/* ---------- planet data ---------- */
const PDATA=[

const MDATA={
 earth:[{id:'luna',name:'Luna',type:'🌙 Moon of Earth',r:.5,d:5.2,per:27.3,col:'#b9bcc6',stats:{Diameter:'3,474 km','Orbit period':'27.3 days','Distance':'384,400 km'},blurb:'Likely born from a giant impact 4.5 billion years ago. It drifts 3.8 cm farther away each year, steadies Earth\u2019s tilt, and runs the tides.'}],

       {id:'deimos',name:'Deimos',type:'🌙 Moon of Mars',r:.2,d:4.4,per:1.26,col:'#94897e',stats:{Diameter:'~12 km','Orbit period':'30.3 hours',Origin:'captured asteroid?'},blurb:'A tiny, smooth nugget of rock — likely a captured asteroid, named for the Greek god of dread.'}],
 jupiter:[{id:'io',name:'Io',type:'🌙 Moon of Jupiter',r:.58,d:8.4,per:1.77,col:'#d9c25e',stats:{Diameter:'3,643 km','Orbit period':'1.8 days',Record:'most volcanic body'},blurb:'The most volcanic world in the solar system — hundreds of erupting volcanoes, kneaded by Jupiter\u2019s relentless gravity.'},
          {id:'europa',name:'Europa',type:'🌙 Moon of Jupiter',r:.5,d:10,per:3.55,col:'#ded4c4',stats:{Diameter:'3,122 km','Orbit period':'3.6 days',Claim:'hidden ocean'},blurb:'Beneath its cracked ice shell lies a salty ocean with more water than all of Earth\u2019s — a prime target in the search for life.'},
          {id:'ganymede',name:'Ganymede',type:'🌙 Moon of Jupiter',r:.8,d:12.2,per:7.15,col:'#a2907c',stats:{Diameter:'5,268 km','Orbit period':'7.2 days',Record:'largest moon'},blurb:'The biggest moon in the solar system — larger than Mercury — and the only one with its own magnetic field.'},
          {id:'callisto',name:'Callisto',type:'🌙 Moon of Jupiter',r:.72,d:14.6,per:16.7,col:'#77695c',stats:{Diameter:'4,821 km','Orbit period':'16.7 days',Record:'most cratered'},blurb:'The most heavily cratered object known — a 4-billion-year-old face that never resurfaces itself.'}],
 saturn:[{id:'titan',name:'Titan',type:'🌙 Moon of Saturn',r:.75,d:13.8,per:15.9,col:'#d8a24f',stats:{Diameter:'5,150 km','Orbit period':'15.9 days',Claim:'methane lakes'},blurb:'Bigger than Mercury, wrapped in a thick nitrogen haze, with rivers, rain and lakes — of liquid methane. It\u2019s what early Earth might have smelled like.'}],
 uranus:[],
 venus:[],mercury:[],
 neptune:[{id:'triton',name:'Triton',type:'🌙 Moon of Neptune',r:.6,d:6.8,per:-5.9,col:'#d9c8bf',stats:{Diameter:'2,707 km','Orbit period':'5.9 days ↺',Origin:'captured KBO'},blurb:'Orbits backwards — a captured Kuiper Belt object. Nitrogen geysers erupt from its icy crust at −235 °C.'}]
};

/* ---------- build bodies ---------- */
const bodies=[sunBody],byId={sun:sunBody},pickMeshes=[sunMesh],planets=[];
const labelsRoot=$('#labels');
function addLabel(b,isMoon){
  const el=document.createElement('div');
  el.className='lbl'+(isMoon?' moon':'');el.textContent=b.name;el.style.display=isMoon?'none':'block';
  labelsRoot.appendChild(el);b.el=el;
}
addLabel(sunBody,false);
const sphereGeo={};
function sphere(r){const k=r.toFixed(2);return sphereGeo[k]||(sphereGeo[k]=new THREE.SphereGeometry(r,40,28));}

for(const pd of PDATA){
  const map=pd.earth?earthTex():
    pd.id==='mercury'?planetTex(['#a59a91','#8a8078','#7a716a','#8d847c'],{craters:70,speckle:800}):
    pd.id==='venus'?planetTex(['#ecd9a8','#d9bd82','#e6d19b','#cdb077','#e3cd97'],{bands:26,bandColor:'#f5e7c0',speckle:250}):
    pd.id==='mars'?planetTex(['#c1633f','#a94f31','#b55a38','#8f4229'],{craters:45,speckle:700,caps:true}):
    pd.id==='jupiter'?planetTex(['#d8c4a8','#c9a67d','#e6d9c3','#b98d63','#e2cfae','#c7a179'],{bands:18,spot:'#c8542f'}):
    pd.id==='saturn'?planetTex(['#e8d8ae','#d9c48e','#efe3c0','#cbb37e','#e4d4a6'],{bands:14,speckle:200}):
    pd.id==='uranus'?planetTex(['#9fdfe8','#8fd4de','#aadfe6','#7fc9d6'],{bands:6,bandColor:'#c8f0f4',speckle:120}):
    planetTex(['#3a66d6','#2f55c0','#4a77e0','#2a4bb0'],{bands:8,spot:'#1e3a8f',speckle:250});
  const sys=new THREE.Group();scene.add(sys);
  const tiltG=new THREE.Group();tiltG.rotation.z=-THREE.MathUtils.degToRad(pd.tilt);sys.add(tiltG);
  const mat=new THREE.MeshLambertMaterial({map,emissive:new THREE.Color(pd.base).multiplyScalar(.13)});
  const mesh=new THREE.Mesh(sphere(pd.r),mat);tiltG.add(mesh);
  const body={...pd,sys,mesh,moons:[],angle:Math.random()*Math.PI*2,w:Math.PI*2/pd.per,spin:24/pd.rotH,isMoon:false};
  body.stats=Object.assign({},pd.stats);
  if(pd.rings){
    const rg=new THREE.Mesh(new THREE.RingGeometry(pd.r*1.35,pd.r*2.4,110),
      new THREE.MeshBasicMaterial({map:ringTex(),transparent:true,side:THREE.DoubleSide,depthWrite:false}));
    rg.rotation.x=-Math.PI/2;tiltG.add(rg);
  }
  mesh.userData.body=body;pickMeshes.push(mesh);bodies.push(body);byId[body.id]=body;planets.push(body);
  addLabel(body,false);orbitLine(pd.dist);
  for(const md of (MDATA[pd.id]||[])){
    const pivot=new THREE.Group();sys.add(pivot);
    const mm=new THREE.Mesh(sphere(md.r),new THREE.MeshLambertMaterial({color:md.col,emissive:new THREE.Color(md.col).multiplyScalar(.1)}));
    mm.position.x=md.d;pivot.add(mm);
    const sign=md.per<0?-1:1;
    const mb={...md,mesh:mm,pivot,parent:body,angle:Math.random()*Math.PI*2,w2:sign*Math.min(Math.PI*2/Math.abs(md.per),1.0),isMoon:true};
    mm.userData.body=mb;pickMeshes.push(mm);bodies.push(mb);byId[mb.id]=mb;body.moons.push(mb);
    addLabel(mb,true);
  }
}

/* ---------- selection marker ---------- */
const marker=new THREE.Sprite(new THREE.SpriteMaterial({map:markerTex(),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
marker.visible=false;scene.add(marker);

/* ---------- state / ui ---------- */
let paused=false,mult=1,labelsOn=true,selected=null,followObj=null,camTween=null,boot=true;
const wp=new THREE.Vector3(),tmp=new THREE.Vector3();
const speedIn=$('#speed');
function fmtMult(v){return (v<10?v.toFixed(1):Math.round(v))+'×';}
function setMult(){mult=.25*Math.pow(200,speedIn.value/100);$('#spdv').textContent=fmtMult(mult);}
speedIn.addEventListener('input',setMult);setMult();

function showInfo(b){
  $('#pEmoji').textContent=b.emoji2||(b.isMoon?'🌙':'');
  $('#pName').textContent=b.name;$('#pType').textContent=b.type;
  $('#pBlurb').textContent=b.blurb;
  $('#pStats').innerHTML=Object.entries(b.stats).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
  let h='';
  if(b.parent)h+=`<button class="chip back" data-id="${b.parent.id}">⬅ back to ${b.parent.name}</button>`;
  if(b.moons&&b.moons.length)for(const m of b.moons)h+=`<button class="chip" data-id="${m.id}">🌙 ${m.name}</button>`;
  const pm=$('#pMoons');pm.innerHTML=h;pm.style.display=h?'flex':'none';
  pm.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>select(byId[ch.dataset.id])));
}
function select(b){
  selected=b;followObj=b.mesh;marker.visible=true;
  showInfo(b);$('#panel').classList.add('open');
  b.mesh.getWorldPosition(wp);
  const dir=camera.position.clone().sub(wp);
  if(dir.lengthSq()<.01)dir.set(1,.6,1);dir.normalize();
  camTween={dir,dist:b.r*7+4.5,t:0};
}
function deselect(){
  selected=null;followObj=null;marker.visible=false;camTween=null;
  $('#panel').classList.remove('open');
}
$('#pClose').addEventListener('click',deselect);
$('#btnPause').addEventListener('click',e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'⏸';});
$('#btnLbl').addEventListener('click',e=>{labelsOn=!labelsOn;e.currentTarget.classList.toggle('on',labelsOn);});
$('#btnHome').addEventListener('click',()=>{
  deselect();
  camTween={toHome:true,t:0,from:camera.position.clone(),fromT:controls.target.clone(),to:HOME.clone(),toT:new THREE.Vector3()};
});

/* ---------- tap picking ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
let pd=null;
renderer.domElement.addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{
  if(pd&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)<9)pick(e);
  pd=null;
});
controls.addEventListener('start',()=>{camTween=null;pd=null;});
function pick(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(pickMeshes,false);
  if(hits.length)select(hits[0].object.userData.body);else deselect();
}

/* ---------- labels ---------- */
function updLabels(){
  for(const b of bodies){
    let vis=b.isMoon?(selected&&(selected===b.parent||selected===b)):true;
    if(!labelsOn)vis=false;
    if(!vis){b.el.style.display='none';continue;}
    b.mesh.getWorldPosition(tmp);tmp.y+=b.r*1.15;tmp.project(camera);
    if(tmp.z>1||tmp.z<-1){b.el.style.display='none';continue;}
    const x=(tmp.x*.5+.5)*W,y=(-tmp.y*.5+.5)*H;
    if(x<-60||x>W+60||y<-30||y>H+30){b.el.style.display='none';continue;}
    b.el.style.display='block';b.el.style.left=x+'px';b.el.style.top=y+'px';
  }
}

/* ---------- resize & loop ---------- */
addEventListener('resize',()=>{
  W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);
});
const clock=new THREE.Clock();
function ease(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;}
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  const sp=paused?0:mult,dps=5;
  for(const b of planets){
    b.angle+=b.w*dps*sp*dt;
    b.sys.position.set(Math.cos(b.angle)*b.dist,0,Math.sin(b.angle)*b.dist);
    b.mesh.rotation.y+=b.spin*.15*dt*Math.max(.35,sp);
    for(const m of b.moons){m.angle+=m.w2*dps*sp*dt;m.pivot.rotation.y=m.angle;m.mesh.rotation.y+=.25*dt;}
  }
  sunMesh.rotation.y+=.02*dt*Math.max(.3,sp);
  if(camTween){
    camTween.t+=dt/1.15;const k=Math.min(1,camTween.t),e=ease(k);
    if(camTween.toHome){
      camera.position.lerpVectors(camTween.from,camTween.to,e);
      controls.target.lerpVectors(camTween.fromT,camTween.toT,e);
      if(k>=1)camTween=null;
    }else if(followObj){
      followObj.getWorldPosition(wp);
      const dst=camTween.dir.clone().multiplyScalar(camTween.dist).add(wp);
      camera.position.lerp(dst,1-Math.pow(1-e,2));
      if(k>=1)camTween=null;
    }
  }
  if(followObj){followObj.getWorldPosition(wp);controls.target.lerp(wp,.12);}
  if(marker.visible&&selected){
    selected.mesh.getWorldPosition(wp);marker.position.copy(wp);
    const s=selected.r*3.4*(1+.07*Math.sin(performance.now()*.004));
    marker.scale.set(s,s,1);
  }
  controls.update();
  updLabels();
  renderer.render(scene,camera);
  if(boot){const s=$('#splash');s.style.opacity='0';setTimeout(()=>s.remove(),650);boot=false;}
}
animate();
</script>
</body>
</html>
